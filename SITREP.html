<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>SITREP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- the BRIEF colorway (working name) · RULED 2026-09-10: the creator-cases explainer's palette is the default for the boards we keep using; ROSE/WATCH stays with DARKROOM + public-facing work ---- */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --bar: color-mix(in srgb, var(--ink) 22%, transparent);
    --bar-retired: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--ink) 22%, transparent) 4px 6px);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light; /* E-INK: the light face, provisional 9/11 — Kindle gray, never white; shown only when the viewer forces light */
  }
  /* DARK is the only theme (RULED 9/11: "there's only one theme, and that's dark"); the toggle is gone */
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320;
    --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B;
    --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --bar: color-mix(in srgb, var(--ink) 30%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2;
    --panel: #E4E4DE;
    --panel-2: #CBCBC4;
    --ink: #1B1B19;
    --ink-2: #44453F;
    --ink-3: #6B6C65;
    --accent: #E04E18;
    --accent-ink: #A83409;
    --accent-soft: #E9D5CA;
    --link: #A83409;
    --good: #1F6B45;
    --good-soft: #CFE0D3;
    --warn: #5E4F22;
    --warn-soft: #E2D9BE;
    --bad: #962C37;
    --bad-soft: #E6CCCF;
    --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409;
    --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, input:focus-visible, .ol-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }

  .mono { font-family: var(--mono); }
  .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- concept links (CK3 R1) ---- */
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- app frame ---- */
  .app {
    height: 100vh; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: 236px minmax(0, 1fr) 316px;
    grid-template-areas: "head head head" "ol panel rail" "foot foot foot";
  }
  header.head {
    grid-area: head; display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line-2);
    background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px);
  }
  .brand { display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; border-right: 1px solid var(--line); min-width: 236px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
  .brand h1 i { display: inline-block; width: 10px; height: 10px; background: var(--accent); margin-right: 8px; transform: translateY(-2px); }
  .brand .sub { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 4px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 236px; }
  /* the stat strip never wraps: one fixed-height band, tiles scroll sideways, long values ellipsize (Papi 9/16: the top row was stacking and eating the panel) */
  .stats { display: flex; align-items: stretch; flex: 1 1 0; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .stat { display: flex; flex-direction: column; justify-content: center; padding: 6px 16px; border-right: 1px solid var(--line); flex: 1 1 0; min-width: 112px; max-width: 260px; overflow: hidden; }
  .stat b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b.line { font-family: var(--body); font-weight: 700; font-size: 15px; line-height: 1.2; }
  .stat small { display: block; font-family: var(--mono); font-size: 11px; line-height: 1.3; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat > span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.s-hot b { color: var(--accent); } .stat.s-warn b { color: var(--warn); } .stat.s-bad b { color: var(--bad); } .stat.s-good b { color: var(--good); }
  .box { display: flex; align-items: center; gap: 16px; padding: 0 18px; border-left: 1px solid var(--line); flex: 0 0 auto; white-space: nowrap; }
  .light { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
  .light i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
  .light.up i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .light small { color: var(--ink-3); }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  a.gloss { text-decoration: none; }
  /* the big SOI button (was glossary; the word retired 9/11) (Papi, 9/10: "a big button I can click on from the sit rep page") */
  .gloss { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 16px; margin-right: 12px; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; border: 2px solid var(--accent); }
  .gloss small { font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; margin-top: 3px; }
  .gloss:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .gloss.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  /* the glossary page view */
  .gsearch { width: 100%; max-width: 520px; font: 16px var(--body); padding: 9px 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); margin-bottom: 6px; }
  .gpage { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 22px; margin-top: 6px; }
  .gent { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .gent .gw { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .gent .gw .t { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; border-bottom-width: 2px; }
  .gent p { margin: 0; font-size: 15.5px; line-height: 1.45; }
  .gent .w { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .ol-row.gl-row { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .effort { grid-column: 1 / -1; display: flex; gap: 22px; align-items: center; height: 34px; padding: 0 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink-2); flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .effort > span { flex: 0 0 auto; }
  .effort b { color: var(--bad); font-weight: 500; }
  .effort .k { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px; }
  header.head { flex-wrap: wrap; flex: 0 0 auto; max-height: 118px; overflow: hidden; }
  header.head > .row { display: flex; flex: 1 0 100%; align-items: stretch; height: 82px; min-width: 0; }

  /* ---- outliner · the strand (CK3 R12) ---- */
  nav.ol { grid-area: ol; border-right: 1px solid var(--line-2); padding: 18px 0 18px 0; overflow-y: auto; position: relative; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.ol .lbl { padding: 0 18px 10px; display: block; }
  .ol-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 14px 9px 18px; position: relative; color: var(--ink-2); border-left: 3px solid transparent; }
  .ol-row .node { width: 30px; display: flex; align-items: center; justify-content: center; }
  .ol-row .node i { width: 9px; height: 9px; border: 1.5px solid var(--ink-3); border-radius: 50%; background: var(--bg); position: relative; z-index: 1; }
  .ol-row .name { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .ol-row .id { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); display: block; margin-bottom: 2px; }
  .ol-row .key { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line-2); padding: 1px 5px; }
  .ol-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .ol-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  .ol-row.on .node i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  nav.ol .strand { position: absolute; left: 32.5px; top: 46px; bottom: 30px; width: 1px; background: var(--line-2); }
  nav.ol .foot { padding: 18px 18px 0; font-family: var(--mono); font-size: 11px; color: var(--ink-3); line-height: 1.7; }
  nav.ol .foot b { color: var(--ink-2); font-weight: 500; }

  /* ---- the block panel ---- */
  main.panel { grid-area: panel; overflow-y: auto; padding: 26px 34px 40px; position: relative; }
  .frame { position: relative; padding: 4px 0 0; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 16px; height: 16px; border: 1px solid var(--ink-3); pointer-events: none; }
  .frame::before { top: -6px; left: -14px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -8px; right: -14px; border-left: 0; border-top: 0; }
  .bh { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .bh .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .bh .src { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
  h2.bt { margin: 0 0 12px; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 4.2vw, 52px); line-height: .95; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  p.plain { margin: 0 0 22px; font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }

  .grp { margin-top: 18px; }
  .grp > .lbl { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .grp > .lbl em { font-style: normal; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item.note { background: color-mix(in srgb, var(--bad) 8%, transparent); padding: 12px 14px; margin-top: 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ink-3); min-width: 30px; text-align: right; padding-top: 2px; }
  .item .body { min-width: 0; }
  .item .text { font-size: 17px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .item .next { margin-top: 6px; font-size: 15.5px; color: var(--ink-2); display: flex; gap: 8px; }
  .item .next .lbl { padding-top: 4px; white-space: nowrap; color: var(--accent); }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

  /* chips: status carries a glyph + word, never color alone */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr .both { background: linear-gradient(90deg, var(--ink) 50%, var(--orange-soft) 50%); color: var(--orange); border-color: var(--ink); text-shadow: none; }
  .tr span + span { margin-left: -1px; }

  /* deep stacks · single-series ranked bars */
  .bars { margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 34px minmax(180px, 1.1fr) auto minmax(120px, 2fr) 64px 46px minmax(90px, .8fr); gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .bar-row.hd { border-bottom: 1px solid var(--line-2); padding-bottom: 6px; }
  .bar-row .rk { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--ink-3); text-align: right; }
  .bar-row .pj { font-size: 16px; }
  .bar-row .pj.ret { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--bad); }
  .bar-row .track { height: 14px; position: relative; }
  .bar-row .track b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 3px 3px 0; min-width: 4px; }
  .bar-row .track b.ret { background: var(--bar-retired); }
  .bar-row .v { font-family: var(--mono); font-size: 13px; text-align: right; }
  .bar-row .c { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; }
  .bar-row .s { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .totals { display: flex; gap: 22px; margin-top: 16px; font-family: var(--mono); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .totals b { font-weight: 500; color: var(--ink); }
  .barhover { pointer-events: none; }

  /* pmcs table */
  table.pmcs { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15.5px; }
  table.pmcs th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.pmcs td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tblwrap { overflow-x: auto; }

  /* blocked · numbered */
  .dec { display: grid; grid-template-columns: 52px 1fr; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .dec .n { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: .9; color: var(--accent); }
  .dec .n.dim { color: var(--ink-3); }
  .dec h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
  .dec .what { margin: 4px 0 0; font-size: 16.5px; }
  .dec .un { margin-top: 6px; font-size: 15px; color: var(--ink-2); display: flex; gap: 8px; }
  .dec .un .lbl { padding-top: 3px; color: var(--good); white-space: nowrap; }

  /* leverage line */
  .lev { margin-top: 18px; padding: 28px 30px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 78ch; }
  .lev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .lev .big { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 6vw, 84px); line-height: .9; text-transform: uppercase; margin: 0 0 16px; }
  .lev .big .t { border-bottom-width: 3px; }
  .lev p { margin: 0; font-size: 18px; line-height: 1.5; }

  /* soi card */
  .soi { margin-top: 10px; display: grid; grid-template-columns: 1fr; }
  .soi .row { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .soi .w { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
  .soi .g { font-size: 16px; color: var(--ink-2); }
  .nouns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .nouns .t { font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
  .nouns .t:hover { border-color: var(--link); }

  /* ---- the context rail · the explainer register ---- */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 20px 20px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 18px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .ctx { display: grid; gap: 14px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 4px; color: var(--accent); }
  .ctx .c p { margin: 0; font-size: 15.5px; line-height: 1.5; }
  .rail .sec { border-top: 1px solid var(--line); padding-top: 14px; }
  .runs { display: grid; gap: 8px; margin-top: 8px; }
  .run { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
  .run i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; animation: pulse 1.6s ease-in-out infinite; }
  .run small { display: block; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }

n calls stop being questions, because every one of them is measured from it.", "strand": {"last": "Five sessions on 9/16 cleared the character stack end to end — sheet, beats, five systems into TM 02–06, BOLO 18 closed with four complete waves, all 1,031 Zotero items keyed, the crew grades and the DOPE SHEET layout ruled, and JUDY's ears shipped with a console on :8787.", "plan": "Rule the gating calls on 24, build the slice, and stop at the sheet's order instead of running the pipeline six evenings ahead.", "you": "You ruled D-7, D-9, D-6 and D-5, then said 'that's a little bit too far' — so the slice stands as built and nothing more moves on it without your word. Then you opened 56 and 57 in the same day.", "next": "Name the launch month for BOLO 24. Library, split, the Gate 3 skin test and the death month are all dated from it. Separately, BOLO 57 just turned Blocked #11 from a three-way into a four-way — it needs a boresight to price it before it can be ranked."}, "line": "Name BOLO 24's launch month.", "why": "The slice is finished work parked on an unanswered date, and 9/16 proved the build capacity is not the constraint — five sessions delivered a character sheet, five narrative systems, a closed BOLO 18, a voice console and an ElevenLabs integration. Six rows in Block V are still blocked, some since March. The bottleneck is the ruling that releases work already sitting done, and every one of 24's four remaining calls is measured from the launch month."}, {"id": "VII", "name": "The SOI card", "kind": "card", "plain": "The words that run this operation. Say one and the protocol fires. Every term on this page is a live link; hover it, hold, and the definition opens. The full book is the SOI: the BREVITY.", "strand": {"last": "Ruled 9/11: DOPE SHEET (the status page) · SOI is the book · \"the house tongue\" and \"glossary\" retired · dark is the only theme.", "plan": "The SOI page replaces the in-page glossary once it publishes (Charlie Mike pages, step 4). BOLO 37 moves rulings into a daily loop.", "you": "You clarified FRAGO on your own read of doctrine: the update, never the page.", "next": "Confirm OPORD as the page's word. Name the loop; MINT is the recommendation."}, "soi": [{"k": "sitrep", "w": "sit rep", "g": "The full board, cold start. Spoken, it flushes the [[ready-rack|Ready Rack]] and delivers blocks 0 to VII in fixed order. From 9/10 it also "}, {"k": "oscar-mike", "w": "Oscar Mike", "g": "The close-out, all in one — RULED 9/11 (\"when I say we're Oscar Mike, I wanna close out the session… just one thing\"). Spoken, it ends the s"}, {"k": "how-copy", "w": "how copy?", "g": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one ques"}, {"k": "boresight", "w": "boresight", "g": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X"}, {"k": "bolo", "w": "BOLO", "g": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighti"}, {"k": "ivory-tower", "w": "ivory tower", "g": "Academic mode: published literature only, every claim cited inline, established versus contested marked."}, {"k": "break-break", "w": "break-break", "g": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it."}, {"k": "buttonhook", "w": "buttonhook back", "g": "Close the detour and return to the parked thread unprompted, restating where we were."}, {"k": "run-the-darkroom", "w": "run the darkroom", "g": "Launch [[darkroom|DARKROOM]] in the background, no questions. The garbles black room and dark room read the same."}, {"k": "main-effort", "w": "the main effort", "g": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep'"}, {"k": "challenge", "w": "the challenge phrase", "g": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is neve"}, {"k": "out-block", "w": "the OUT block", "g": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing af"}, {"k": "status-on-bolo", "w": "status on BOLO N", "g": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO"}, {"k": "rtb", "w": "RTB", "g": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, th"}, {"k": "charlie-mike", "w": "Charlie Mike", "g": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The "}, {"k": "frago", "w": "FRAGO", "g": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Papi's clarification 9/10 late (\"FRAGO is just the"}, {"k": "dope-sheet", "w": "DOPE SHEET", "g": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRA"}, {"k": "actual", "w": "ACTUAL", "g": "The suffix for the commander in person on the net (\"Six Actual\"). RULED 9/11 as the formal form of the operator's callsign: [[hotline|HOTLIN"}, {"k": "abort", "w": "ABORT", "g": "The cancel word, RULED 9/11: \"abort abort abort\" spoken three times, then the correction. Cancels the immediately preceding order; the recor"}, {"k": "hotline", "w": "HOTLINE", "g": "The operator's callsign, RULED 9/11. Casual: \"Hotline\", \"word from Hotline\". On the net and on every page: **HOTLINE ACTUAL**. The point: th"}, {"k": "gear", "w": "gear N", "g": "The agent ceiling for the current task, spoken as a number. Gear 1 = 3 agents (the default; silence means gear 1) · 2 = 6 · 3 = 9 · 4 = 12 ·"}], "nouns": ["bolo", "pmcs", "fresh-ten", "ancients", "deep-stacks", "ready-rack", "magazine", "sop", "ttp"]}]}, "glossary": {"sitrep": {"t": "sit rep", "k": "proword", "d": "The full board, cold start. Spoken, it flushes the [[ready-rack|Ready Rack]] and delivers blocks 0 to VII in fixed order. From 9/10 it also lands as this page.", "w": "SOP.md §1–2", "st": "ruled"}, "oscar-mike": {"t": "Oscar Mike", "k": "proword", "st": "ruled", "d": "The close-out, all in one — RULED 9/11 (\"when I say we're Oscar Mike, I wanna close out the session… just one thing\"). Spoken, it ends the session: the Ready Rack note is finalized, STATE updated, the day's journal appended, the reply ends with the OUT block. Nothing is parked into a card any more; every BOLO's resume order lives on its [[dope-sheet|DOPE SHEET]]. [[charlie-mike|Charlie Mike]] resumes; [[rtb|RTB]] sends the old parked cards home.", "w": "SOP.md §1 · §7 rule 9"}, "sweep": {"t": "sweep", "k": "proword", "d": "Retired 9/10, replaced by [[rtb|RTB]]. Was: promote the parked keepers to their real homes and clear oscar-mike/.", "w": "SOP.md §1", "st": "retired"}, "how-copy": {"t": "how copy?", "k": "proword", "d": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one question.", "w": "SOP.md §1", "st": "ruled"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X aims it at one item.", "w": "SOP.md §1", "st": "ruled"}, "bolo": {"t": "BOLO", "k": "proword", "d": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighting, wraps, holds. The board noun is the watchlist itself.", "w": "BOLO.md", "st": "ruled"}, "pmcs": {"t": "PMCS", "k": "noun", "d": "Preventive Maintenance Checks and Services. The rs, each item with what it is waiting on.", "w": "SOP.md §2"}, "deep-stacks": {"t": "Deep Stacks", "k": "noun", "d": "Block III: projects ranked by volume of thought spent, from PROJECTS.md. Volume is characters of conversation, a proxy for thinking, not value.", "w": "PROJECTS.md"}, "leverage-line": {"t": "the leverage line", "k": "noun", "d": "Block VI: the single highest-leverage next action. Provisional rename pending: the Main Effort, MCDP 1's term for the one point everything else supports.", "w": "SOP.md §2"}, "soi": {"t": "SOI", "k": "noun", "d": "Signal Operating Instructions: the [[brevity|BREVITY]]'s book. The proword card (SOP §0), Block VII of every board, and since 9/11 its own page — search, A to Z, by section, the dictation codebook. \"Glossary\" is retired as a word (Papi, 9/11); every button and key says SOI.", "w": "SOP.md §0 · _tools/soi/ · the SOI page", "st": "ruled"}, "sop": {"t": "SOP", "k": "noun", "d": "SOP.md, the canonical home of every comms code and session protocol. On any conflict with memory, the file wins.", "w": "SOP.md"}, "trunk-black": {"t": "BLACK", "k": "noun", "d": "BLACK = Bold Venture (BVX): creative, IP, systems. Everything you make lands in one of two trunks; this is the first.", "w": "SOP.md §2"}, "trunk-orange": {"t": "ORANGE", "k": "noun", "d": "ORANGE = Ultrasin: venture, body, sexuality. The second house.", "w": "SOP.md §2"}, "trunk-operator": {"t": "OPERATOR", "k": "noun", "d": "OPERATOR = you as equipment: [[pmcs|PMCS]], tooling, readiness. Not a house; the person who runs both.", "w": "SOP.md §2"}, "stall-pattern": {"t": "the stall pattern", "k": "ruling", "d": "The recurring failure: a finished design blocked on one unanswered decision, then rebuilt from scratch later. The fix is the ruling, not more structure.", "w": "memory · STATE.md"}, "d9": {"t": "D-9", "k": "item", "d": "Ledger item D-9 on the [[bolo24|BOLO 24]] charter: the [[boresight]] HOLD from 9/3, converted 9/4, undated for twelve days and named by five boards running. **RULED GO 2026-09-16** (\"rule D9 go\"), staged clear: the no-dependency items deliver, the rest as their gates (D-5 · D-6 · D-7) clear.", "w": "_PRIVATE/BOLO-24-charter.md · STATE Blocked #10", "st": "ruled"}, "bolo24": {"t": "BOLO 24", "k": "item", "d": "The zero-budget ORANGE launch: 3D erotica stills in Blender, DARKROOM-fed, Ultrasin as the studio, a first signing with an arc. Charter in _PRIVATE/. Gated by [[d9|D-9]]; the next proposed gate is [[r9|R9]].", "w": "BOLO.md #24"}, "r9": {"t": "R9", "k": "item", "d": "Synthesis recommendation 9: thirty days on a fresh X account before any platform commit. Zero cost. Metric: follower growth against Kirenes' no-funnel rate and Variety Itsol's studio-promoted year one.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "r10": {"t": "R10", "k": "item", "d": "Fill reference seats 4 to 8 with the same agent template: a disclosed-AI creator on Fanvue, a Patreon 3D still artist, a Reddit-native grower, the itsmemphishxe reference.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "cam-line": {"t": "the cam line", "k": "item", "d": "The Lab-venture question: live cam access is Siswet's moat, and a rendered persona cannot stand in a live room. Board it as the difference between the two ORANGE plays, or rule it irrelevant.", "w": "oscar-mike/creator-cases.md"}, "ultra-dark": {"t": "ULTRA DARK", "k": "system", "d": "BOLO 27: the curation imprint under Ultrasin. A rating scale plus a written line on every post; commissioned edits as the first-dollar line. A funnel, never the asset.", "w": "oscar-mike/ultradark-walkthrough.md · _PRIVATE/ULTRADARK-*.md"}, "block-c": {"t": "Block C", "k": "item", "d": "The [[ultra-dark|ULTRA DARK]] walkthrough's third step: you mark 12 to 16 clips in [[stash|Stash]], say marked, the pull script fires, Resolve builds the 12-second blurb. Blocks A and B have been done since 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md · DOPE SHEET 44 https://claude.ai/artifact/6uRCbniv1JNj5a4B6wFR6b"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON_NODES/oxo-telling-profile.md"}, "series": {"t": "SERIES", "k": "ruling", "d": "Ruling R9 of 9/9: The Outliers is a series, not a feature and not prose. Recorded in the storyform frontmatter. It unblocked the first scene card and the first Fountain pages.", "w": "_CANON_NODES/oxo-storyform.md"}, "outliers": {"t": "The Outliers", "k": "system", "d": "OVEREXITOUT / The Outliers: the flagship BLACK IP. Storyform ruled 8/24, DCUS instanced 8/26, medium ruled [[series]] 9/9, first pages 9/10. Anna still has no node.", "w": "_CANON_NODES/ · OUTLIERS_FINAL_DRAFT/"}, "warroom": {"t": "WARROOM", "k": "system", "d": "The MCDP doctrine browser: MIL.01 to MIL.11 as a game encyclopedia on the [[ck3-rules|CK3 rules]]. Version 1.1 wears the [[watch-register|WATCH register]]. Name provisional; paused by you on 9/6.", "w": "MCDP-CODEX.html"}, "watch-register": {"t": "the WATCH register", "k": "system", "d": "One grammar, two faces keyed to room light: DAY paper for the lit desk, NIGHT near-black for the dark one. Seven hues, every ratio contrast-checked against the long-watch standards. WARROOM wears it; this page moved to the creator-cases colorway on 9/10 by your ruling.", "w": "_0.1_BVX_LEARN/_meta/WATCH-REGISTER.md"}, "ck3-rules": {"t": "the CK3 rules", "k": "system", "d": "Nineteen rules derived from Crusader Kings III's interface: concept links with nested tooltips capped at depth 3, timer or key lock, a character-sheet layout, an outliner plus an encyclopedia, one semantic color set. This page runs on them.", "w": "_0.1_BVX_LEARN/_meta/CK3-IA-STUDY.md"}, "bolo45": {"t": "BOLO 45", "k": "item", "d": "The creator-case sweep and the manager path. Ruled 9/10: [[natasha-teen|Natasha Teen]] is the referent; everything public unless you specify; the management recon ordered. Its three files never landed; relaunched this evening.", "w": "BOLO.md #45"}, "the-take": {"t": "THE TAKE", "k": "item", "d": "The placeholder name for the lessons block on each creator case. Ruled [[ttp|TTP]] on 9/10.", "w": "explainer page · BOLO 45", "st": "retired"}, "creator-case": {"t": "creator case", "k": "noun", "d": "One file about one creator: how they started, how they run it, how they get paid. Public record only, filed beside the [[register|performer register]]. Seven exist; two more are running.", "w": "_CANON_NODES/creator-case-*.md"}, "register": {"t": "the performer register", "k": "system", "d": "138 names, any sex, 21 in the stable core. Lanes: performer · e-girl · creator case · Stash name. Built 9/8 from nine of your lists; widened 9/9.", "w": "_CANON_NODES/performer-register.md"}, "nasa-girl": {"t": "the NASA girl", "k": "item", "d": "The performer you recalled by story (used to be an engineer, NASA, then did this). Two candidates were built on 9/10; you named her this evening: Rebel Rhyder. Her case is running; the candidates stay as receipts.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "natasha-teen": {"t": "Natasha Teen", "k": "person", "d": "Register row, lane P, starred by you 9/9. The referent for like Natasha Teen did; her case verifies whether she built an agency or roster.", "w": "_CANON_NODES/performer-register.md"}, "explainer": {"t": "the explainer register", "k": "ruling", "d": "The elementary landing-page voice you liked on 9/10: what we did last, what the plan was, what you did, in plain words. This board's right rail speaks it on every block.", "w": "https://claude.ai/code/artifact/68adc31f-f644-45de-881f-6d17a355021f"}, "modmigrate": {"t": "modmigrate", "k": "item", "d": "_tools/modmigrate/: the 9/7 Minecraft modpack migration (Modrinth Fabric 1.21.11 to NeoForge 1.21.11). Real work with no STATE row, no BOLO, no journal. Surfaced on three boards running.", "w": "_tools/modmigrate/"}, "bolo37": {"t": "BOLO 37", "k": "item", "d": "The proword selection loop: five candidates, pick three ranked, ten a day, Claude's sealed pick revealed after. Name bench MINT (rec). Three spec gaps; gap 3, placement, is answered by this page.", "w": "BOLO.md #37 · SOP.md §5"}, "bolo38": {"t": "BOLO 38", "k": "item", "d": "The sit rep as a front page, the CK3 save-load screen. Captured 9/6; fired 9/10 evening on your order; v0.5 on 9/10 night. Charlie Mike'd 9/11: OPORD retitle, the SOI published, both pages re-pointed. Its OPORD page carries the rest.", "w": "BOLO.md #38"}, "the-box": {"t": "the box", "k": "system", "d": "The machine's servers: [[stash|Stash]] on :9999 and [[darkroom|DARKROOM]] on :8484. Both up this evening, the first time at a board since 9/4.", "w": "localhost"}, "bolo29": {"t": "BOLO 29", "k": "item", "d": "The SFW TikTok channel: owned Fortnite skins doing the emotes, faceless, BLACK. Research banked; held on one question, the reward-versus-risk reading.", "w": "oscar-mike/bolo29-tiktok.md"}, "bolo35": {"t": "BOLO 35", "k": "item", "d": "The story timeline tool and its theory: sound synthesis against the conservatory score. Read delivered 9/6; four questions held.", "w": "oscar-mike/story-timeline.md"}, "bolo41": {"t": "BOLO 41", "k": "item", "d": "The locus system: research filed by neighborhood. Convention provisional in _0.1_BVX_LEARN/LOCI/; needs your ratification.", "w": "_0.1_BVX_LEARN/LOCI/README.md"}, "numbering": {"t": "the 03/03 numbering", "k": "item", "d": "Two domains share the 03 prefix: 03_SETTING_SYSTEMS (stood up 8/25) and the empty pre-reserved 03_PLOT_SYSTEMS. One rename either way.", "w": "ShroomsQ/_CANON/_SSOT/"}, "trash-land": {"t": "Trash Land", "k": "item", "d": "BOLO 30: the man-made trash DMZ between the southern and northern US, mountain-range scale. Seed node written 9/6; seven rulings open, name bench recommends The Midden.", "w": "_CANON_NODES/oxo-trash-land-seed.md"}, "main-effort": {"t": "the main effort", "k": "proword", "d": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep's Block VI rename rides on it. On this board it has been [[block-c|Block C]] plus [[d9|D-9]] since 9/4.", "w": "SOP.md §5", "st": "provisional"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "The Marine Corps operations order: Situation · Mission · Execution · Administration and Logistics · Command and Signal. Mission first, then how. A BOLO status page is written in this shape.", "w": "MIL.05 · MCDP 5 Planning"}, "speed": {"t": "speed", "k": "ruling", "d": "MCDP 1: speed over time is tempo, and tempo is itself a weapon. On a page: read in ten seconds, the order on top, the story underneath. One of the three that govern the status page, with [[focus]] and [[boldness]].", "w": "MIL.01 §4 · invariant 8"}, "focus": {"t": "focus", "k": "ruling", "d": "MCDP 1: the convergence of effects at the decisive time and place, which demands strict economy everywhere else. On a page: one [[main-effort|main effort]] named, everything else supporting it and kept short.", "w": "MIL.01 §4 · invariant 8"}, "boldness": {"t": "boldness", "k": "ruling", "d": "MCDP 1: unhesitating exploitation of uncertainty to pursue major rather than marginal results; do not strive for certainty before you act. On a page: every call carries a default that runs if you say nothing.", "w": "MIL.01 §4 · quotes"}, "commanders-intent": {"t": "commander's intent", "k": "ruling", "d": "The purpose behind a task, stated as task plus in order to. The why outlasts the what, so a subordinate can act without asking. The Mission paragraph of every status page carries it.", "w": "MIL.01 §8"}, "mission-tactics": {"t": "mission tactics", "k": "ruling", "d": "Assign the task and the intent, leave the method to the one doing it, intervene only by exception. It is why a status page states defaults instead of asking questions.", "w": "MIL.01 §8"}, "ofm": {"t": "OFM agency", "k": "noun", "d": "The fansite-era management agency: an operations vendor running messages, traffic and posting on the creator's own account for 20 to 50 percent or more. A different business from the licensed booking agent of the studio era (10 to 15 percent).", "w": "_CANON_NODES/creator-management-recon.md §0"}, "ash": {"t": "A.S.H.", "k": "item", "d": "Riley Reid's creator-first agency, launched April 2021 because friends were paying up to 30 percent. The verified item behind the recon's creator-first list; the earlier Clubhouse Media Group line was a conflation and is corrected.", "w": "_CANON_NODES/creator-management-recon.md"}, "fla-468": {"t": "Florida ch. 468", "k": "item", "d": "Florida's talent-agency licensing statute: anyone who, for compensation, procures engagements for an artist, and artist includes a model. Running a creator's own account is not obviously procuring; booking that creator into a shoot or brand deal plainly is. An attorney question the moment a second human is booked.", "w": "_CANON_NODES/creator-management-recon.md §0"}, "management-recon": {"t": "the management recon", "k": "item", "d": "The sourced read on the manager path, 171 URLs: two businesses share the word agency; Fanvue is the only platform with a real agency structure; creator-first is the documented origin of the lane; reputation, not capital, is the barrier.", "w": "_CANON_NODES/creator-management-recon.md"}, "management-voices": {"t": "the management voices", "k": "item", "d": "Twenty-two first-person accounts of people who became managers, agency owners or house-builders. Nobody credible started with a roster; they started with one relationship. The commission number is the ethics map. Account control is the line.", "w": "_CANON_NODES/creator-management-voices.md"}, "bolo42": {"t": "BOLO 42", "k": "item", "d": "The admired-performers table, delivered 9/8 as the [[register|performer register]]; widened 9/9 to any sex; the creator-case nodes link from its rows.", "w": "BOLO.md #42"}, "rebel-rhyder": {"t": "Rebel Rhyder", "k": "person", "d": "The [[nasa-girl|NASA girl]], named by you 9/10 evening. Her case landed the same night: an electrical engineer who worked in aerospace for two years, in her own words; NASA is Rocco Siffredi's word only. Register row added, lane P, source S.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "challenge": {"t": "the challenge phrase", "k": "proword", "st": "ruled", "d": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is never explained.", "w": "STATE.md header · SOP.md §1"}, "out-block": {"t": "the OUT block", "k": "proword", "st": "ruled", "d": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing after it: OSCAR MIKE · OUT · OUT · OUT. A visible seam between what was parked and what starts next. Coded 9/6 on your order.", "w": "SOP.md §7 rule 9"}, "status-on-bolo": {"t": "status on BOLO N", "k": "proword", "st": "ruled", "d": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO, which is the update, not the page.", "w": "SOP.md §1 · §8"}, "recon": {"t": "recon", "k": "proword", "st": "benched", "d": "Benched 9/6: the [[boresight]] protocol aimed outside the wire (web and literature) instead of at the vault. \"Napkin recon\" would be the one-pass form. Waits in the [[bolo37|selection loop]].", "w": "SOP.md §5"}, "napkin": {"t": "napkin", "k": "proword", "st": "benched", "d": "Benched 9/6 as a modifier: back-of-the-napkin, one pass, rough numbers, no question loop. Spoken as a prefix: \"napkin boresight\", \"napkin recon\".", "w": "SOP.md §5"}, "syllabus": {"t": "syllabus", "k": "proword", "st": "benched", "d": "Benched 9/6: \"pull the syllabus on X\" = the tier-one 101 textbooks of a field, [[ivory-tower|ivory tower]], one per field to start.", "w": "SOP.md §5"}, "distill": {"t": "distill", "k": "proword", "st": "benched", "d": "Benched 9/6: make the BVX-LEARN one-sheet. The doctrine's own word: distill, don't summarize.", "w": "SOP.md §5"}, "grammar": {"t": "grammar", "k": "proword", "st": "benched", "d": "Benched 9/6: \"write the grammar\" = derive a system's operating language from its sources.", "w": "SOP.md §5"}, "mint": {"t": "MINT", "k": "proword", "st": "benched", "d": "Recommended name for the proword selection loop ([[bolo37|BOLO 37]]): where the lexicon gets struck, beside DARKROOM and WARROOM. Bench: BREVITY · SOI · CALLSIGN · LEXICON. Your ruling.", "w": "BOLO.md #37 · SOP.md §5"}, "readyroom": {"t": "READYROOM", "k": "proword", "st": "benched", "d": "Recommended name for the sit rep front page program: the Navy's briefing room, sibling of DARKROOM and WARROOM. Bench: OPSROOM · FRONTPAGE · THE BOARD. Your ruling.", "w": "BOLO.md #38"}, "ttp": {"t": "TTP", "k": "item", "d": "Tactics, Techniques and Procedures. Section 10 of every [[creator-case|creator case]]: the one mechanic worth studying, three to five transferable tips, what does not transfer, and which venture it feeds. Named by Papi 9/10 from the Corps bench (GOUGE was the provisional header); struck alternatives THE TAKE, LESSONS LEARNED, HOT WASH.", "w": "SOP.md §5 · _CANON_NODES/creator-case-*.md §10", "st": "ruled"}, "rtb": {"t": "RTB", "k": "proword", "d": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, the folder cleared. Papi's own coinage 9/10; replaces the retired [[sweep|sweep]]. Third movement of the park trio with [[oscar-mike|Oscar Mike]] and [[charlie-mike|Charlie Mike]]. 9/11: one meaning only — the pass that sends a parked card home and clears it; retires itself when oscar-mike/ is empty. The end of the sortie is Oscar Mike.", "w": "SOP.md §1", "st": "ruled"}, "charlie-mike": {"t": "Charlie Mike", "k": "proword", "d": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The park trio is Oscar Mike (park), Charlie Mike (resume), [[rtb|RTB]] (return to base).", "w": "SOP.md §1", "st": "ruled"}, "gouge": {"t": "GOUGE", "k": "item", "d": "Navy and Marine slang for the essential distilled information. Recommended 9/10 as the name for the creator-case lessons block and used as its provisional header for a few hours; Papi ruled [[ttp|TTP]] instead. Bench only.", "w": "SOP.md §5", "st": "retired"}, "frago": {"t": "FRAGO", "k": "proword", "st": "ruled", "d": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Papi's clarification 9/10 late (\"FRAGO is just the update after we've made the BOLO status page\"). \"FRAGO 45\" folds what changed since the last build into [[opord|OPORD 45]] and republishes; only what changed, everything not mentioned stands as ordered; the page's Log keeps every FRAGO.", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "opord": {"t": "OPORD (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 after twelve hours (\"there has to be a better name than that, something much cooler\"). The thing it named is the [[dope-sheet|DOPE SHEET]].", "w": "SOP.md §5"}, "bolo46": {"t": "BOLO 46", "k": "item", "d": "The OXO series follow-through: the [[telling-profile|Telling Profile]]'s 12 rulings · Anna's node · the pilot's page one. Captured 9/11 at priority one on Papi's word; it had no BOLO before.", "w": "BOLO.md #46"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRAGOs]]. RULED 9/11: header \"DOPE SHEET N\"; spoken \"give me the dope on N\", \"status report on N\", \"the situation on N\" all read the same. From the Scout Sniper's DOPE book: Data On Previous Engagements, everything known on the target and every prior engagement in one book. Replaced OPORD (retired the same morning).", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "bolo47": {"t": "BOLO 47", "k": "item", "d": "The dashboard consult: eight ranked ideas from current Claude Code / VS Code operator boards for the [[sitrep|sit rep]] page. Captured 9/11; none taken yet.", "w": "BOLO.md #47"}, "bolo48": {"t": "BOLO 48", "k": "item", "d": "The name bench: every unruled word with its bench on one sheet. Ruled 9/11: DOPE SHEET · ADORNED · ABORT (the cancel word) · BREVITY (what the SOI holds) · HOTLINE / HOTLINE ACTUAL (the operator's callsign). Closed 9/11: the close-out is Oscar Mike, ENDEX retired. Open: READYROOM · MINT. Pool: \"caught up\" · INTEL.", "w": "BOLO.md #48 · SOP §5"}, "bolo49": {"t": "BOLO 49", "k": "item", "d": "The Massive presets: the best free banks for Native Instruments Massive, verified 9/11; the shortlist is on its sheet.", "w": "BOLO.md #49"}, "eink": {"t": "E-INK", "k": "ruling", "st": "provisional", "d": "The light face of every internal page, provisional 9/11: Kindle-gray paper (#D8D8D2 ground, #E4E4DE surface), never white — \"like an old Kindle… digital ink.\" Shown only when a viewer forces light; DARK is the only theme and the toggle is gone.", "w": "SOP.md §2 · the three templates"}, "adorned": {"t": "ADORNED", "k": "ruling", "st": "ruled", "d": "DARKROOM dress-state value, RULED 9/11 (\"let's do adorned\"): naked except for an accessory — socks, heels, jewelry, glasses, a hat, a harness; the r/WhyWearAnythingAtAll read. Replaced implied (retired 9/11: no garment and nothing shown). Vocab edited, zero-shot rerun, probes retrained the same morning; 42 old human confirmations still say implied and are left as Papi's record.", "w": "_PRIVATE/taxonomy_engine/vocab.json · BOLO 44"}, "actual": {"t": "ACTUAL", "k": "proword", "st": "ruled", "d": "The suffix for the commander in person on the net (\"Six Actual\"). RULED 9/11 as the formal form of the operator's callsign: [[hotline|HOTLINE ACTUAL]]. Never alone.", "w": "SOP.md §5"}, "bolo50": {"t": "BOLO 50", "k": "item", "d": "The standards campaign: every level of the operation as a standards organization; a networked library of outside and Command-made standards. Research phase: the harvest banked as a locus, the register pulled by agent. Opened 9/11 on a break-break.", "w": "BOLO.md #50 · _0.1_BVX_LEARN/LOCI/standards.locus.md"}, "abort": {"t": "ABORT", "k": "proword", "st": "ruled", "d": "The cancel word, RULED 9/11: \"abort abort abort\" spoken three times, then the correction. Cancels the immediately preceding order; the record keeps the abort line, not the order. Aircrew and JTAC lineage: the call not to release. First live use the same minute: \"abort abort abort the index process\" (the ENDEX). Replaced belay.", "w": "SOP.md §0–1 · §5"}, "brevity": {"t": "BREVITY", "k": "noun", "st": "ruled", "d": "What the [[soi|SOI]] holds, RULED 9/11 (\"I do like brevity better\"): the Command's word list, after the Multi-Service Brevity Codes, the list that makes radio short. The SOI's subtitle on every page. Replaced \"the lexicon\" (provisional) and \"the house tongue\" (retired). BREVITY leaves MINT's bench; MINT stands for the loop.", "w": "SOP.md §0 · §6 · the SOI page"}, "hotline": {"t": "HOTLINE", "k": "proword", "st": "ruled", "d": "The operator's callsign, RULED 9/11. Casual: \"Hotline\", \"word from Hotline\". On the net and on every page: **HOTLINE ACTUAL**. The point: the word comes from on high, detached from the person, the way CENTCOM ACTUAL speaks for the command, not for a man (\"remove the artist from the art\"). Replaces \"you\" on the explainer rail.", "w": "SOP.md §0–1 · §5 · const WHO in the templates"}, "bolo51": {"t": "BOLO 51", "k": "item", "d": "The logistics front: one standing audit, quality, and improvement function over every system in daily use, plus the token offload onto hooks, skills, subagents, routines, and the design canvas. Standards pulled from BOLO 50's register. Opened 9/12.", "w": "BOLO.md #51 · DOPE SHEET 51"}, "proword": {"t": "proword", "k": "noun", "st": "ruled", "d": "Procedure word. Radiotelephony's fixed words that stand for a whole instruction: ROGER, WILCO, OUT, SAY AGAIN. NATO's book for them is ACP 125. The Command's prowords are the same idea aimed at the protocol: say one and the procedure fires.", "w": "SOP.md §0–1 · ACP 125"}, "gear": {"t": "gear N", "k": "proword", "st": "provisional", "d": "The agent ceiling for the current task, spoken as a number. Gear 1 = 3 agents (the default; silence means gear 1) · 2 = 6 · 3 = 9 · 4 = 12 · 5 = 15, never used: the ceiling exists to be named. A shift lasts one task, then back to gear 1. At every gear, fetch-and-extract agents run haiku, write-ups sonnet, fable on the main line only. Working name (Papi 9/12: \"let's just call them gears for now\"); warps and DEFCON aborted in the same breath. Part of [[gearbox|the gearbox]].", "w": "SOP.md §1 · §5 · BOLO 52"}, "gearbox": {"t": "the gearbox", "k": "system", "st": "provisional", "d": "The sustainable-speed system, opened 9/12 as BOLO 52: the [[gear|gears]] (the agent ceiling), the gauge (_tools/usage/, weighted tokens per day from the local transcripts), and the weekly budget the week must fit. Lineage: the 9/10 sixteen-agent run spent half a week in one session. Never sixteen again.", "w": "_tools/usage/ · BOLO 52 · SOP.md §1"}, "bolo52": {"t": "BOLO 52", "k": "item", "d": "The gearbox: the sustainable-speed system. Gears 1–5 as the agent ceiling, the gauge, the weekly budget. Spun out of BOLO 51 on 9/12; name provisional.", "w": "BOLO.md #52"}, "bolo53": {"t": "BOLO 53", "k": "item", "d": "The Command's own development standard: the boresight → how-copy → build → FRAGO → Oscar Mike loop read as an iterative-incremental life cycle, filed beside the project flow. Tabled 9/12; OPENED 9/15 by Papi's \"Open 53\"; v0.1 working draft on disk.", "w": "BOLO.md #53 · DOPE SHEET 53 · ShroomsQ/_CANON/_SSOT/05_OPERATIONS/📐 ssot_05_operations_development_standard.md"}, "bolo54": {"t": "BOLO 54", "k": "item", "d": "The sit rep formation: orchestrator, independent specialists, one reviewer at the fan-in. Papi's doctrine 9/12 (Amdahl · Brooks · context is the cost unit · review at the merge). Built the same turn: prep.py · assemble.py · the sitrep skill. The main line's read drops from ~211 KB to ~3 KB.", "w": "BOLO.md #54 · DOPE SHEET 54 · .claude/skills/sitrep/"}, "formation": {"t": "the formation", "k": "system", "st": "provisional", "d": "How agents are laid out on any multi-agent job (BOLO 54, 9/12): hub and spoke. The main line decomposes into pieces that share no state; specialists run independently on disjoint inputs; they sync only at named handoff points; one reviewer, a script where it can be, sits at the fan-in. No peer cross-checks. Rides the [[gearbox|gearbox]]: the gear says how many, the formation says how they stand.", "w": "SOP.md §1 (the gear row) · BOLO 54"}, "bolo55": {"t": "BOLO 55", "k": "item", "d": "The DOPE SHEET format — the document layout. Captured 9/16.", "w": "BOLO.md #55 · DOPE SHEET 55"}, "command": {"t": "the Command", "k": "noun", "st": "ruled", "d": "The whole operation under HOTLINE ACTUAL: BLACK, ORANGE and OPERATOR together. RULED 2026-09-16 (\"let's go with command\") from a bench of ten on BOLO 48; \"the house\" is retired as the word. Marine usage: the authority a unit answers to. Command standard, the Command's ladder, Command-native; \"organic\" replaces in-house.", "w": "SOP.md §2 · §5 · BOLO 48"}, "bolo18": {"t": "BOLO 18", "k": "item", "d": "The two-stage spine sweep: every source in the Zotero library keyed to the story spine's shelves, then distilled shelf by shelf into the plot, setting and character models. Reopened 9/16 as the gate on all story-side work; the full pass keyed all 1,031 items the same night.", "w": "BOLO.md #18 · _tools/zotero/README.md · DOPE SHEET 18 https://claude.ai/artifact/CRVaYBt5GBFp7inyXYG3C5"}, "bolo25": {"t": "BOLO 25", "k": "item", "d": "The standard project. Watchlist row 25 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #25"}, "bolo31": {"t": "BOLO 31", "k": "item", "d": "MIL.01 read. Watchlist row 31 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #31"}, "bolo32": {"t": "BOLO 32", "k": "item", "d": "The markdown marking SOP. Watchlist row 32 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #32"}, "bolo33": {"t": "BOLO 33", "k": "item", "d": "The MCDP browser. Watchlist row 33 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #33"}, "bolo39": {"t": "BOLO 39", "k": "item", "d": "Food preservation. Watchlist row 39 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #39"}}};
const B = DATA.board, G = DATA.glossary;
const WHO = 'HOTLINE ACTUAL'; /* the operator's callsign on the net — RULED 9/11: HOTLINE (casual: word from Hotline; formal: HOTLINE ACTUAL), detached from the person */
const SOI_URL = "https://claude.ai/code/artifact/4c2fc9c7-e0d2-4626-8142-9740ff8ee0e5";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => {
    const g = G[k]; const label = l || (g ? g.t : k);
    return g ? `<a class="t" data-t="${k}" tabindex="0">${label}</a>` : label;
  });
  return s;
}
const ST = {
  hot: ['●', 'hot'], open: ['○', 'open'], held: ['◐', 'held'], gated: ['◇', 'on your go'], parked: ['▭', 'parked'],
  done: ['✓', 'done'], ruled: ['✓', 'ruled'], good: ['●', 'up'], bad: ['▲', 'stalled'], missing: ['▲', 'no record'],
  corrected: ['↺', 'corrected'], new: ['✦', 'new']
};
const chip = s => { const d = ST[s] || ['·', s]; return `<span class="chip st-${s}">${s === 'hot' ? '<i></i>' : d[0]} ${d[1]}</span>`; };
function trunk(t) {
  if (!t) return '';
  const parts = t.split('/');
  const one = x => x === 'BLACK' ? `<span class="b">BLACK</span>` : x === 'ORANGE' ? `<span class="o">ORANGE</span>` : x === 'BOTH' ? `<span class="both">BOTH</span>` : `<span class="p">${esc(x)}</span>`;
  return `<span class="tr" title="trunk">${parts.map(one).join('')}</span>`;
}

/* ---- header ---- */
const M = B.meta;
$('#brandSub').textContent = `${M.date} · ${M.when} · ${M.version}`;
const splitStat = v => {
  v = String(v == null ? '' : v).trim();
  let m = v.match(/^(\d[\d,.]*(?:\s?[%kKxX])?)\s*(.*)$/s) || v.match(/^([A-Z][A-Z0-9\/]{1,10})\s*(.*)$/s);
  if (m) return { big: m[1], rest: m[2].replace(/^[\s·;:,\-]+/, ''), line: false };
  return { big: v, rest: '', line: true };
};
$('#stats').innerHTML = M.stats.map(s => { const p = splitStat(s.v);
  return `<div class="stat s-${s.s || ''}" title="${esc(s.k)}: ${esc(s.v)}"><b class="num${p.line ? ' line' : ''}">${esc(p.big)}</b>${p.rest ? `<small>${esc(p.rest)}</small>` : ''}<span>${esc(s.k)}</span></div>`; }).join('');
$('#box').innerHTML = M.box.map(b => `<div class="light ${b.up ? 'up' : ''}"><i></i><a class="t" data-t="${b.k}" tabindex="0">${esc(b.name)}</a><small>${esc(b.port)} · ${b.up ? 'UP' : 'DOWN'}</small></div>`).join('')
  + `<a class="gloss" id="glossBtn" href="${SOI_URL}" target="_blank" rel="noopener" title="G">SOI<small>the brevity</small></a>`;
$('#effort').innerHTML = `<span><span class="k">main effort</span>${md(M.main_effort)}</span>`
  + `<span><span class="k">rack</span>${esc(M.rack.flushed)} · staged ${esc(M.rack.staged)}</span>`
  + `<span><span class="k">tree</span>${esc(M.tree)} · stack ${esc(M.stack)}</span>`
  + `<span><span class="k">built from</span>${esc(M.build.files)} · ${esc(M.build.read)} · ${esc(M.build.calls)} · ${esc(M.build.rounds)}</span>`;
$('#footR').textContent = `${M.date} · trigger: ${M.trigger}`;

/* ---- outliner ---- */
const blocks = B.blocks;
const countOf = b => b.items ? b.items.length : b.groups ? b.groups.reduce((n, g) => n + g.items.length, 0) : b.rows ? b.rows.length : b.soi ? b.soi.length : 1;
$('#olRows').innerHTML = blocks.map((b, i) => `<button class="ol-row" data-i="${i}"><span class="node"><i></i></span><span><span class="id">Block ${esc(b.id)}</span><span class="name">${esc(b.name)}</span></span><span class="key">${i}</span></button>`).join('')
  ;
$('#olFoot').innerHTML = `<b>${M.agents.length}</b> agents in flight<br><b>${countOf(blocks[4])}</b> decisions are yours`;

/* ---- panel renderers ---- */
function itemHTML(it) {
  const n = it.n != null ? `<span class="n num">${it.n}</span>` : `<span class="n"></span>`;
  return `<li class="item ${it.note ? 'note' : ''}">${n}<div class="body"><div class="text">${md(it.t)}</div>
    <div class="meta">${it.s ? chip(it.s) : ''}${trunk(it.trunk)}${it.when ? `<span class="when">${esc(it.when)}</span>` : ''}</div>
    ${it.next ? `<div class="next"><span class="lbl">next</span><span>${md(it.next)}</span></div>` : ''}</div></li>`;
}
function groupsHTML(groups) {
  return groups.map(g => `<div class="grp"><span class="lbl">${esc(g.label)}${g.note ? `<em>· ${esc(g.note)}</em>` : ''}</span>
    ${g.items.length ? `<ul class="items">${g.items.map(itemHTML).join('')}</ul>` : `<p class="plain" style="margin:8px 0 0;font-size:15px">Nothing here.</p>`}</div>`).join('');
}
function render(b) {
  let body = '';
  if (b.kind === 'list') body = b.groups ? groupsHTML(b.groups) : `<ul class="items">${b.items.map(itemHTML).join('')}</ul>`;
  else if (b.kind === 'bars') {
    const max = Math.max(...b.rows.map(r => r.v));
    body = `<div class="bars"><div class="bar-row hd"><span class="lbl">#</span><span class="lbl">project</span><span class="lbl">trunk</span><span class="lbl">volume · ${esc(b.unit)}</span><span class="lbl" style="text-align:right">k chars</span><span class="lbl" style="text-align:right">convs</span><span class="lbl">state</span></div>`
      + b.rows.map(r => `<div class="bar-row"><span class="rk">${r.rank}</span><span class="pj ${r.retired ? 'ret' : ''}">${md(r.p)}</span>${trunk(r.trunk)}
        <span class="track t barhover-src" tabindex="0" data-raw="${esc(r.p.replace(/\[\[[^\]|]+\|?([^\]]*)\]\]/g, '$1'))} · ~${r.v}k characters across ${r.convs} conversations · ${esc(r.state)} · frozen at the 8/15 export"><b class="${r.retired ? 'ret' : ''}" style="width:${(r.v / max * 100).toFixed(1)}%"></b></span>
        <span class="v num">${r.v}k</span><span class="c num">${r.convs}</span><span class="s">${esc(r.state)}</span></div>`).join('')
      + `</div><div class="totals">${b.totals.map(t => `<span><b>${esc(t.k)}</b> ${esc(t.v)}</span>`).join('')}<span>Volume is characters of conversation: thought spent, not value.</span></div>`;
  } else if (b.kind === 'board') {
    body = groupsHTML(b.groups) + `<div class="grp"><span class="lbl"><a class="t" data-t="pmcs" tabindex="0">PMCS</a> <em>· the operator is equipment</em></span>
      <div class="tblwrap"><table class="pmcs"><thead><tr><th>Item</th><th>Status</th><th>Next action</th></tr></thead><tbody>
      ${b.pmcs.map(p => `<tr><td><strong>${esc(p.item)}</strong></td><td>${chip(p.s)} <span class="when">${esc(p.status)}</span></td><td>${md(p.next)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  } else if (b.kind === 'numbered') {
    body = `<div class="decs">${b.items.map(d => `<div class="dec"><span class="n num ${d.n > 3 ? 'dim' : ''}">${d.n}</span><div><h3>${md(d.title)}</h3><p class="what">${md(d.what)}</p>
      <div class="un"><span class="lbl">unblocks</span><span>${md(d.unblocks)}</span></div><div class="meta" style="margin-top:6px">${trunk(d.trunk)}</div></div></div>`).join('')}</div>`;
  } else if (b.kind === 'line') {
    body = `<div class="lev"><p class="big">${md(b.line)}</p><p>${md(b.why)}</p></div>`;
  } else if (b.kind === 'card') {
    body = `<div class="soi">${b.soi.map(s => `<div class="row"><span class="w"><a class="t" data-t="${s.k}" tabindex="0">${esc(s.w)}</a></span><span class="g">${md(s.g)}</span></div>`).join('')}</div>
      <span class="lbl" style="display:block;margin-top:22px">Board nouns</span><div class="nouns">${b.nouns.map(k => `<a class="t" data-t="${k}" tabindex="0">${esc(G[k].t)}</a>`).join('')}</div>`;
  }
  $('#panel').innerHTML = `<div class="frame"><div class="bh"><span class="eyebrow">Block ${esc(b.id)}</span><span class="src">${esc(b.name)} · ${countOf(b)} entries</span></div>
    <h2 class="bt">${esc(b.name)}</h2><p class="plain">${md(b.plain)}</p>${body}</div>`;
  $('#panel').scrollTop = 0;
  const s = b.strand;
  $('#ctx').innerHTML = `<h4>Where you are</h4><div class="ctx">
    <div class="c"><span class="lbl">What we did last</span><p>${md(s.last)}</p></div>
    <div class="c"><span class="lbl">What the plan was</span><p>${md(s.plan)}</p></div>
    <div class="c"><span class="lbl">What ${WHO} did</span><p>${md(s.you)}</p></div>
    <div class="c"><span class="lbl">What's next</span><p>${md(s.next)}</p></div></div>
    <div class="sec"><span class="lbl">In flight</span><div class="runs">${M.agents.map(a => `<div class="run"><i></i><div>${esc(a.name)}<small>${esc(a.from)}</small></div></div>`).join('')}</div></div>`;
}
let cur = 0, glossaryOpen = false;
function go(i) {
  cur = Math.max(0, Math.min(blocks.length - 1, i));
  glossaryOpen = false;
  document.querySelectorAll('.ol-row').forEach(r => r.classList.toggle('on', !r.dataset.g && +r.dataset.i === cur));
  $('#glossBtn').classList.remove('on');
  closeTips(0);
  render(blocks[cur]);
  try { localStorage.setItem('sitrep_block', String(cur)); history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
/* ---- the glossary page: every proword and board word, from the same register the tooltips use ---- */
const KIND_ORDER = ['proword', 'noun', 'ruling', 'system', 'item', 'person'];
const KIND_LABEL = { proword: 'Prowords · say one and the protocol fires', noun: 'Board nouns', ruling: 'Rulings and doctrine', system: 'Systems and programs', item: 'Items on the board', person: 'People' };
const stChip = st => st ? `<span class="chip st-${st === 'ruled' ? 'ruled' : st === 'benched' ? 'parked' : 'open'}">${st}</span>` : '';
function showGlossaryPage() { window.open(SOI_URL, '_blank', 'noopener'); }
$('#olRows').addEventListener('click', e => { const r = e.target.closest('.ol-row'); if (!r) return; if (r.dataset.g) showGlossaryPage(); else go(+r.dataset.i); });
/* the SOI button is an outbound link */

/* ---- tooltips: hover → open · 1.5 s or Space → lock · nested to depth 3 · Esc closes ---- */
let tips = [];
let openTimer = null, closeTimer = null;
function tipFor(target, depth) {
  const k = target.dataset.t; const raw = target.dataset.raw;
  const el = document.createElement('div');
  el.className = 'tip' + (raw ? ' raw' : '');
  el.dataset.depth = depth;
  if (raw) { el.textContent = raw; }
  else {
    const g = G[k];
    const deep = depth >= 3;
    el.innerHTML = `<div class="th"><b>${esc(g.t)}</b><span class="k">${esc(g.k)}</span></div>
      <p>${deep ? esc(g.d.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kk, l) => l || (G[kk] ? G[kk].t : kk))) : md(g.d)}</p>
      ${deep ? `<div class="w"><a href="#" class="glopen" data-k="${k}">Open in SOI →</a></div>` : `<div class="w">${esc(g.w || '')}</div>`}
      <div class="lock"><b></b></div><div class="hint">hold 1.5 s or press Space to lock · Esc closes · click opens the SOI panel</div>`;
  }
  document.body.appendChild(el);
  // position: below the target, clamped to the viewport
  const r = target.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
  let y = r.bottom + 8; if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const rec = { el, target, depth, locked: false, timer: null };
  if (!raw) {
    const bar = $('.lock b', el); requestAnimationFrame(() => { bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%'; });
    rec.timer = setTimeout(() => lock(rec), 1500);
  }
  el.addEventListener('mouseenter', () => { clearTimeout(closeTimer); });
  el.addEventListener('mouseleave', () => scheduleClose(depth));
  el.addEventListener('click', e => { const a = e.target.closest('.glopen'); if (a) { e.preventDefault(); openGlossary(a.dataset.k); } });
  target.classList.add('on');
  tips.push(rec);
  return rec;
}
function lock(rec) { rec.locked = true; rec.el.classList.add('locked'); }
function closeTips(fromDepth) {
  // close every tip at depth >= fromDepth, unless a shallower one is locked and this is a hover-leave (handled by caller)
  tips.filter(t => t.depth >= fromDepth).forEach(t => { clearTimeout(t.timer); t.el.remove(); t.target.classList.remove('on'); });
  tips = tips.filter(t => t.depth < fromDepth);
}
function scheduleClose(depth) {
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => {
    // close from the deepest unlocked tip at or above this depth
    const unlocked = tips.filter(t => t.depth >= depth && !t.locked);
    if (unlocked.length) closeTips(Math.min(...unlocked.map(t => t.depth)));
  }, 220);
}
function depthOf(target) { const p = target.closest('.tip'); return p ? +p.dataset.depth + 1 : 1; }
function onEnter(target) {
  clearTimeout(openTimer); clearTimeout(closeTimer);
  const d = depthOf(target);
  openTimer = setTimeout(() => {
    // one tip per depth: replace any existing tip at this depth or deeper
    closeTips(d);
    tipFor(target, d);
  }, 120);
}
document.addEventListener('mouseover', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.t'); if (t) { clearTimeout(openTimer); scheduleClose(depthOf(t)); } });
document.addEventListener('focusin', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('focusout', e => { const t = e.target.closest('.t'); if (t) scheduleClose(depthOf(t)); });
document.addEventListener('click', e => {
  const t = e.target.closest('.t');
  if (t && t.dataset.t) { e.preventDefault(); openGlossary(t.dataset.t); return; }
  if (!e.target.closest('.tip')) closeTips(1);
});

/* ---- glossary panel ---- */
const kinds = [...new Set(Object.values(G).map(g => g.k))];
let glKind = null, glHist = [];
$('#glCats').innerHTML = `<button data-k="" class="on">all</button>` + kinds.map(k => `<button data-k="${k}">${k}</button>`).join('');
function glRender() {
  const q = $('#glSearch').value.trim().toLowerCase();
  const rows = Object.entries(G).filter(([k, g]) => (!glKind || g.k === glKind) && (!q || g.t.toLowerCase().includes(q) || g.d.toLowerCase().includes(q)))
    .sort((a, b) => a[1].t.localeCompare(b[1].t));
  $('#glList').innerHTML = rows.map(([k, g]) => `<button data-k="${k}"><span>${esc(g.t)}</span><span class="k">${esc(g.k)}</span></button>`).join('') || `<p class="plain" style="font-size:14px">No term matches.</p>`;
  $('#glHist').innerHTML = glHist.length > 1 ? `<button id="glBack">← back (B)</button><span>${glHist.slice(-4).map(k => esc(G[k].t)).join(' · ')}</span>` : '';
}
function glShow(k) {
  const g = G[k]; if (!g) return;
  if (glHist[glHist.length - 1] !== k) glHist.push(k);
  const d = $('#glDetail'); d.hidden = false;
  d.innerHTML = `<h5>${esc(g.t)}</h5><p>${md(g.d)}</p><div class="w">${esc(g.k)} · ${esc(g.w || '')}</div>`;
  glRender();
}
function openGlossary(k) { $('#rail').classList.add('gl'); closeTips(1); if (k) glShow(k); else glRender(); $('#glSearch').focus(); }
function closeGlossary() { $('#rail').classList.remove('gl'); }
$('#glClose').addEventListener('click', closeGlossary);
$('#glSearch').addEventListener('input', glRender);
$('#glCats').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; glKind = b.dataset.k || null; document.querySelectorAll('#glCats button').forEach(x => x.classList.toggle('on', x === b)); glRender(); });
$('#glList').addEventListener('click', e => { const b = e.target.closest('button'); if (b) glShow(b.dataset.k); });
$('#glHist').addEventListener('click', e => { if (e.target.id === 'glBack') { glHist.pop(); const k = glHist.pop(); if (k) glShow(k); else { $('#glDetail').hidden = true; glRender(); } } });

/* ---- theme: auto → light → dark ---- */
/* theme toggle removed 9/11: dark only */

/* ---- keys ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) { if (e.key === 'Escape') { e.target.blur(); closeGlossary(); } return; }
  if (e.key >= '0' && e.key <= '7' && !e.metaKey && !e.ctrlKey && !e.altKey) { go(+e.key); return; }
  if (e.key === 'ArrowRight') { go(cur + 1); return; }
  if (e.key === 'ArrowLeft') { go(cur - 1); return; }
  if (e.key === 'Escape') { if (tips.length) closeTips(1); else closeGlossary(); return; }
  if (e.key === ' ' && tips.length) { e.preventDefault(); lock(tips[tips.length - 1]); return; }
  if (e.key === 'g' || e.key === 'G') { showGlossaryPage(); return; }
  if ((e.key === 'b' || e.key === 'B') && $('#rail').classList.contains('gl')) { const bb = $('#glBack'); if (bb) bb.click(); }
});

go(0); /* every board opens on Block 0: last session first */
</script>

</body>
</html>
