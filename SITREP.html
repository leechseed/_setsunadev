<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>SITREP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- the BRIEF colorway (working name) · RULED 2026-09-10: the creator-cases explainer's palette is the default for the boards we keep using; ROSE/WATCH stays with DARKROOM + public-facing work ---- */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --bar: color-mix(in srgb, var(--ink) 22%, transparent);
    --bar-retired: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--ink) 22%, transparent) 4px 6px);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light; /* E-INK: the light face, provisional 9/11 — Kindle gray, never white; shown only when the viewer forces light */
  }
  /* DARK is the only theme (RULED 9/11: "there's only one theme, and that's dark"); the toggle is gone */
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320;
    --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B;
    --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --bar: color-mix(in srgb, var(--ink) 30%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2;
    --panel: #E4E4DE;
    --panel-2: #CBCBC4;
    --ink: #1B1B19;
    --ink-2: #44453F;
    --ink-3: #6B6C65;
    --accent: #E04E18;
    --accent-ink: #A83409;
    --accent-soft: #E9D5CA;
    --link: #A83409;
    --good: #1F6B45;
    --good-soft: #CFE0D3;
    --warn: #5E4F22;
    --warn-soft: #E2D9BE;
    --bad: #962C37;
    --bad-soft: #E6CCCF;
    --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409;
    --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, input:focus-visible, .ol-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }

  .mono { font-family: var(--mono); }
  .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- concept links (CK3 R1) ---- */
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- app frame ---- */
  .app {
    height: 100vh; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: 236px minmax(0, 1fr) 316px;
    grid-template-areas: "head head head" "ol panel rail" "foot foot foot";
  }
  header.head {
    grid-area: head; display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line-2);
    background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px);
  }
  .brand { display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; border-right: 1px solid var(--line); min-width: 236px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
  .brand h1 i { display: inline-block; width: 10px; height: 10px; background: var(--accent); margin-right: 8px; transform: translateY(-2px); }
  .brand .sub { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 4px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 236px; }
  /* the stat strip never wraps: one fixed-height band, tiles scroll sideways, long values ellipsize (Chief 9/16: the top row was stacking and eating the panel) */
  .stats { display: flex; align-items: stretch; flex: 1 1 0; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .stat { display: flex; flex-direction: column; justify-content: center; padding: 6px 16px; border-right: 1px solid var(--line); flex: 1 1 0; min-width: 112px; max-width: 260px; overflow: hidden; }
  .stat b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b.line { font-family: var(--body); font-weight: 700; font-size: 15px; line-height: 1.2; }
  .stat small { display: block; font-family: var(--mono); font-size: 11px; line-height: 1.3; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat > span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.s-hot b { color: var(--accent); } .stat.s-warn b { color: var(--warn); } .stat.s-bad b { color: var(--bad); } .stat.s-good b { color: var(--good); }
  .box { display: flex; align-items: center; gap: 16px; padding: 0 18px; border-left: 1px solid var(--line); flex: 0 0 auto; white-space: nowrap; }
  .light { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
  .light i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
  .light.up i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .light small { color: var(--ink-3); }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  a.gloss { text-decoration: none; }
  /* the big SOI button (was glossary; the word retired 9/11) (Chief, 9/10: "a big button I can click on from the sit rep page") */
  .gloss { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 16px; margin-right: 12px; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; border: 2px solid var(--accent); }
  .gloss small { font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; margin-top: 3px; }
  .gloss:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .gloss.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  /* the glossary page view */
  .gsearch { width: 100%; max-width: 520px; font: 16px var(--body); padding: 9px 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); margin-bottom: 6px; }
  .gpage { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 22px; margin-top: 6px; }
  .gent { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .gent .gw { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .gent .gw .t { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; border-bottom-width: 2px; }
  .gent p { margin: 0; font-size: 15.5px; line-height: 1.45; }
  .gent .w { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .ol-row.gl-row { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .effort { grid-column: 1 / -1; display: flex; gap: 22px; align-items: center; height: 34px; padding: 0 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink-2); flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .effort > span { flex: 0 0 auto; }
  .effort b { color: var(--bad); font-weight: 500; }
  .effort .k { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px; }
  header.head { flex-wrap: wrap; flex: 0 0 auto; max-height: 118px; overflow: hidden; }
  header.head > .row { display: flex; flex: 1 0 100%; align-items: stretch; height: 82px; min-width: 0; }

  /* ---- outliner · the strand (CK3 R12) ---- */
  nav.ol { grid-area: ol; border-right: 1px solid var(--line-2); padding: 18px 0 18px 0; overflow-y: auto; position: relative; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.ol .lbl { padding: 0 18px 10px; display: block; }
  .ol-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 14px 9px 18px; position: relative; color: var(--ink-2); border-left: 3px solid transparent; }
  .ol-row .node { width: 30px; display: flex; align-items: center; justify-content: center; }
  .ol-row .node i { width: 9px; height: 9px; border: 1.5px solid var(--ink-3); border-radius: 50%; background: var(--bg); position: relative; z-index: 1; }
  .ol-row .name { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .ol-row .id { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); display: block; margin-bottom: 2px; }
  .ol-row .key { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line-2); padding: 1px 5px; }
  .ol-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .ol-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  .ol-row.on .node i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  nav.ol .strand { position: absolute; left: 32.5px; top: 46px; bottom: 30px; width: 1px; background: var(--line-2); }
  nav.ol .foot { padding: 18px 18px 0; font-family: var(--mono); font-size: 11px; color: var(--ink-3); line-height: 1.7; }
  nav.ol .foot b { color: var(--ink-2); font-weight: 500; }

  /* ---- the block panel ---- */
  main.panel { grid-area: panel; overflow-y: auto; padding: 26px 34px 40px; position: relative; }
  .frame { position: relative; padding: 4px 0 0; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 16px; height: 16px; border: 1px solid var(--ink-3); pointer-events: none; }
  .frame::before { top: -6px; left: -14px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -8px; right: -14px; border-left: 0; border-top: 0; }
  .bh { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .bh .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .bh .src { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
  h2.bt { margin: 0 0 12px; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 4.2vw, 52px); line-height: .95; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  p.plain { margin: 0 0 22px; font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }

  .grp { margin-top: 18px; }
  .grp > .lbl { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .grp > .lbl em { font-style: normal; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item.note { background: color-mix(in srgb, var(--bad) 8%, transparent); padding: 12px 14px; margin-top: 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ink-3); min-width: 30px; text-align: right; padding-top: 2px; }
  .item .body { min-width: 0; }
  .item .text { font-size: 17px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .item .next { margin-top: 6px; font-size: 15.5px; color: var(--ink-2); display: flex; gap: 8px; }
  .item .next .lbl { padding-top: 4px; white-space: nowrap; color: var(--accent); }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

  /* chips: status carries a glyph + word, never color alone */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr .both { background: linear-gradient(90deg, var(--ink) 50%, var(--orange-soft) 50%); color: var(--orange); border-color: var(--ink); text-shadow: none; }
  .tr span + span { margin-left: -1px; }

  /* deep stacks · single-series ranked bars */
  .bars { margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 34px minmax(180px, 1.1fr) auto minmax(120px, 2fr) 64px 46px minmax(90px, .8fr); gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .bar-row.hd { border-bottom: 1px solid var(--line-2); padding-bottom: 6px; }
  .bar-row .rk { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--ink-3); text-align: right; }
  .bar-row .pj { font-size: 16px; }
  .bar-row .pj.ret { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--bad); }
  .bar-row .track { height: 14px; position: relative; }
  .bar-row .track b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 3px 3px 0; min-width: 4px; }
  .bar-row .track b.ret { background: var(--bar-retired); }
  .bar-row .v { font-family: var(--mono); font-size: 13px; text-align: right; }
  .bar-row .c { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; }
  .bar-row .s { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .totals { display: flex; gap: 22px; margin-top: 16px; font-family: var(--mono); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .totals b { font-weight: 500; color: var(--ink); }
  .barhover { pointer-events: none; }

  /* pmcs table */
  table.pmcs { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15.5px; }
  table.pmcs th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.pmcs td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tblwrap { overflow-x: auto; }

  /* blocked · numbered */
  .dec { display: grid; grid-template-columns: 52px 1fr; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .dec .n { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: .9; color: var(--accent); }
  .dec .n.dim { color: var(--ink-3); }
  .dec h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
  .dec .what { margin: 4px 0 0; font-size: 16.5px; }
  .dec .un { margin-top: 6px; font-size: 15px; color: var(--ink-2); display: flex; gap: 8px; }
  .dec .un .lbl { padding-top: 3px; color: var(--good); white-space: nowrap; }

  /* leverage line */
  .lev { margin-top: 18px; padding: 28px 30px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 78ch; }
  .lev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .lev .big { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 6vw, 84px); line-height: .9; text-transform: uppercase; margin: 0 0 16px; }
  .lev .big .t { border-bottom-width: 3px; }
  .lev p { margin: 0; font-size: 18px; line-height: 1.5; }

  /* soi card */
  .soi { margin-top: 10px; display: grid; grid-template-columns: 1fr; }
  .soi .row { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .soi .w { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
  .soi .g { font-size: 16px; color: var(--ink-2); }
  .nouns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .nouns .t { font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
  .nouns .t:hover { border-color: var(--link); }

  /* ---- the context rail · the explainer register ---- */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 20px 20px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 18px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .ctx { display: grid; gap: 14px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 4px; color: var(--accent); }
  .ctx .c p { margin: 0; font-size: 15.5px; line-height: 1.5; }
  .rail .sec { border-top: 1px solid var(--line); padding-top: 14px; }
  .runs { display: grid; gap: 8px; margin-top: 8px; }
  .run { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
  .run i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; animation: pulse 1.6s ease-in-out infinite; }
  .run small { display: block; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }

rs to their real homes and clear oscar-mike/.", "w": "SOP.md §1", "st": "retired"}, "how-copy": {"t": "how copy?", "k": "proword", "d": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one question.", "w": "SOP.md §1", "st": "ruled"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X aims it at one item.", "w": "SOP.md §1", "st": "ruled"}, "bolo": {"t": "BOLO", "k": "proword", "d": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighting, wraps, holds. The board noun is the watchlist itself.", "w": "BOLO.md", "st": "ruled"}, "pmcs": {"t": "PMCS", "k": "noun", "d": "Preventive Maintenance Checks and Services. The operator is equipment: body, medical, life admin. Never mixed with projects.", "w": "BOLO.md · PMCS table"}, "ivory-tower": {"t": "ivory tower", "k": "proword", "d": "Academic mode: published literature only, every claim cited inline, established versus contested marked.", "w": "SOP.md §1", "st": "ruled"}, "break-break": {"t": "break-break", "k": "proword", "d": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it.", "w": "SOP.md §1", "st": "ruled"}, "buttonhook": {"t": "buttonhook back", "k": "proword", "d": "Close the detour and return to the parked thread unprompted, restating where we were.", "w": "SOP.md §1", "st": "ruled"}, "run-the-darkroom": {"t": "run the darkroom", "k": "proword", "d": "Launch [[darkroom|DARKROOM]] in the background, no questions. The garbles black room and dark room read the same.", "w": "SOP.md §1", "st": "ruled"}, "belay": {"t": "belay (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 for [[abort|ABORT]]. Was: cancel the preceding order. Naval lineage: belay = stop, make fast.", "w": "SOP.md §5"}, "endex": {"t": "ENDEX (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11: it collided with \"index\" in dictation and was one process too many. The close-out is [[oscar-mike|Oscar Mike]].", "w": "SOP.md §5"}, "ready-rack": {"t": "Ready Rack", "k": "noun", "d": "_CACHE/. Session notes staged for the next sit rep. Flushed into the [[magazine|Magazine]] on every board; an empty Rack proves the handoff completed.", "w": "_CACHE/"}, "magazine": {"t": "Magazine", "k": "noun", "d": "_LOG/. Deep storage for flushed session notes. Append-only; nothing is deleted, it is stowed.", "w": "_LOG/"}, "fresh-ten": {"t": "Fresh Ten", "k": "noun", "d": "Block I: the ten projects touched most recently, newest first, each with its last-touched date and a concrete next step.", "w": "SOP.md §2"}, "ancients": {"t": "The Ancients", "k": "noun", "d": "Block II: the longest-untouched work in three tiers, each item with what it is waiting on.", "w": "SOP.md §2"}, "deep-stacks": {"t": "Deep Stacks", "k": "noun", "d": "Block III: projects ranked by volume of thought spent, from PROJECTS.md. Volume is characters of conversation, a proxy for thinking, not value.", "w": "PROJECTS.md"}, "leverage-line": {"t": "the leverage line", "k": "noun", "d": "Block VI: the single highest-leverage next action. Provisional rename pending: the Main Effort, MCDP 1's term for the one point everything else supports.", "w": "SOP.md §2"}, "soi": {"t": "SOI", "k": "noun", "d": "Signal Operating Instructions: the [[brevity|BREVITY]]'s book. The proword card (SOP §0), Block VII of every board, and since 9/11 its own page — search, A to Z, by section, the dictation codebook. \"Glossary\" is retired as a word (Chief, 9/11); every button and key says SOI.", "w": "SOP.md §0 · _tools/soi/ · the SOI page", "st": "ruled"}, "sop": {"t": "SOP", "k": "noun", "d": "SOP.md, the canonical home of every comms code and session protocol. On any conflict with memory, the file wins.", "w": "SOP.md"}, "trunk-black": {"t": "BLACK", "k": "noun", "d": "BLACK = Bold Venture (BVX): creative, IP, systems. Everything you make lands in one of two trunks; this is the first.", "w": "SOP.md §2"}, "trunk-orange": {"t": "ORANGE", "k": "noun", "d": "ORANGE = Ultrasin: venture, body, sexuality. The second house.", "w": "SOP.md §2"}, "trunk-operator": {"t": "OPERATOR", "k": "noun", "d": "OPERATOR = you as equipment: [[pmcs|PMCS]], tooling, readiness. Not a house; the person who runs both.", "w": "SOP.md §2"}, "stall-pattern": {"t": "the stall pattern", "k": "ruling", "d": "The recurring failure: a finished design blocked on one unanswered decision, then rebuilt from scratch later. The fix is the ruling, not more structure.", "w": "memory · STATE.md"}, "d9": {"t": "D-9", "k": "item", "d": "Ledger item D-9 on the [[bolo24|BOLO 24]] charter: the [[boresight]] HOLD from 9/3, converted 9/4, undated for twelve days and named by five boards running. **RULED GO 2026-09-16** (\"rule D9 go\"), staged clear: the no-dependency items deliver, the rest as their gates (D-5 · D-6 · D-7) clear.", "w": "_PRIVATE/BOLO-24-charter.md · STATE Blocked #10", "st": "ruled"}, "bolo24": {"t": "BOLO 24", "k": "item", "d": "The zero-budget ORANGE launch: 3D erotica stills in Blender, DARKROOM-fed, Ultrasin as the studio, a first signing with an arc. Charter in _PRIVATE/. Gated by [[d9|D-9]]; the next proposed gate is [[r9|R9]].", "w": "BOLO.md #24 · BORESIGHT 24: https://claude.ai/artifact/Km31pQKccwtmT5UZfVdUa1"}, "r9": {"t": "R9", "k": "item", "d": "Synthesis recommendation 9: thirty days on a fresh X account before any platform commit. Zero cost. Metric: follower growth against Kirenes' no-funnel rate and Variety Itsol's studio-promoted year one.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "r10": {"t": "R10", "k": "item", "d": "Fill reference seats 4 to 8 with the same agent template: a disclosed-AI creator on Fanvue, a Patreon 3D still artist, a Reddit-native grower, the itsmemphishxe reference.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "cam-line": {"t": "the cam line", "k": "item", "d": "The Lab-venture question: live cam access is Siswet's moat, and a rendered persona cannot stand in a live room. Board it as the difference between the two ORANGE plays, or rule it irrelevant.", "w": "oscar-mike/creator-cases.md"}, "ultra-dark": {"t": "ULTRA DARK", "k": "system", "d": "BOLO 27: the curation imprint under Ultrasin. A rating scale plus a written line on every post; commissioned edits as the first-dollar line. A funnel, never the asset.", "w": "oscar-mike/ultradark-walkthrough.md · _PRIVATE/ULTRADARK-*.md"}, "block-c": {"t": "Block C", "k": "item", "d": "The [[ultra-dark|ULTRA DARK]] walkthrough's third step: you mark 12 to 16 clips in [[stash|Stash]], say marked, the pull script fires, Resolve builds the 12-second blurb. Blocks A and B have been done since 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md · DOPE SHEET 44 https://claude.ai/artifact/6uRCbniv1JNj5a4B6wFR6b"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON_NODES/oxo-telling-profile.md"}, "series": {"t": "SERIES", "k": "ruling", "d": "Ruling R9 of 9/9: The Outliers is a series, not a feature and not prose. Recorded in the storyform frontmatter. It unblocked the first scene card and the first Fountain pages.", "w": "_CANON_NODES/oxo-storyform.md"}, "outliers": {"t": "The Outliers", "k": "system", "d": "OVEREXITOUT / The Outliers: the flagship BLACK IP. Storyform ruled 8/24, DCUS instanced 8/26, medium ruled [[series]] 9/9, first pages 9/10. Anna still has no node.", "w": "_CANON_NODES/ · OUTLIERS_FINAL_DRAFT/"}, "warroom": {"t": "WARROOM", "k": "system", "d": "The MCDP doctrine browser: MIL.01 to MIL.11 as a game encyclopedia on the [[ck3-rules|CK3 rules]]. Version 1.1 wears the [[watch-register|WATCH register]]. Name provisional; paused by you on 9/6.", "w": "MCDP-CODEX.html"}, "watch-register": {"t": "the WATCH register", "k": "system", "d": "One grammar, two faces keyed to room light: DAY paper for the lit desk, NIGHT near-black for the dark one. Seven hues, every ratio contrast-checked against the long-watch standards. WARROOM wears it; this page moved to the creator-cases colorway on 9/10 by your ruling.", "w": "_0.1_BVX_LEARN/_meta/WATCH-REGISTER.md"}, "ck3-rules": {"t": "the CK3 rules", "k": "system", "d": "Nineteen rules derived from Crusader Kings III's interface: concept links with nested tooltips capped at depth 3, timer or key lock, a character-sheet layout, an outliner plus an encyclopedia, one semantic color set. This page runs on them.", "w": "_0.1_BVX_LEARN/_meta/CK3-IA-STUDY.md"}, "bolo45": {"t": "BOLO 45", "k": "item", "d": "The creator-case sweep and the manager path. Ruled 9/10: [[natasha-teen|Natasha Teen]] is the referent; everything public unless you specify; the management recon ordered. Its three files never landed; relaunched this evening.", "w": "BOLO.md #45"}, "the-take": {"t": "THE TAKE", "k": "item", "d": "The placeholder name for the lessons block on each creator case. Ruled [[ttp|TTP]] on 9/10.", "w": "explainer page · BOLO 45", "st": "retired"}, "creator-case": {"t": "creator case", "k": "noun", "d": "One file about one creator: how they started, how they run it, how they get paid. Public record only, filed beside the [[register|performer register]]. Seven exist; two more are running.", "w": "_CANON_NODES/creator-case-*.md"}, "register": {"t": "the performer register", "k": "system", "d": "138 names, any sex, 21 in the stable core. Lanes: performer · e-girl · creator case · Stash name. Built 9/8 from nine of your lists; widened 9/9.", "w": "_CANON_NODES/performer-register.md"}, "nasa-girl": {"t": "the NASA girl", "k": "item", "d": "The performer you recalled by story (used to be an engineer, NASA, then did this). Two candidates were built on 9/10; you named her this evening: Rebel Rhyder. Her case is running; the candidates stay as receipts.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "natasha-teen": {"t": "Natasha Teen", "k": "person", "d": "Register row, lane P, starred by you 9/9. The referent for like Natasha Teen did; her case verifies whether she built an agency or roster.", "w": "_CANON_NODES/performer-register.md"}, "explainer": {"t": "the explainer register", "k": "ruling", "d": "The elementary landing-page voice you liked on 9/10: what we did last, what the plan was, what you did, in plain words. This board's right rail speaks it on every block.", "w": "https://claude.ai/code/artifact/68adc31f-f644-45de-881f-6d17a355021f"}, "modmigrate": {"t": "modmigrate", "k": "item", "d": "_tools/modmigrate/: the 9/7 Minecraft modpack migration (Modrinth Fabric 1.21.11 to NeoForge 1.21.11). Real work with no STATE row, no BOLO, no journal. Surfaced on three boards running.", "w": "_tools/modmigrate/"}, "bolo37": {"t": "BOLO 37", "k": "item", "d": "The proword selection loop, named BREVITY 9/23: each open bench shows five, Chief picks three ranked, the picks write to disk on submit, the back five are the reserve. Placement: a panel of the sit rep page (BOLO 38). Build fires on \"go 37\".", "w": "BOLO.md #37 · SOP.md §5 · DOPE SHEET 37 https://claude.ai/artifact/GgA7zgN42aMWiJQqbKGGso"}, "bolo38": {"t": "BOLO 38", "k": "item", "d": "The sit rep as a front page, the CK3 save-load screen. Captured 9/6; fired 9/10 evening on your order; v0.5 on 9/10 night. Charlie Mike'd 9/11: OPORD retitle, the SOI published, both pages re-pointed. Its OPORD page carries the rest.", "w": "BOLO.md #38"}, "the-box": {"t": "the box", "k": "system", "d": "The machine's servers: [[stash|Stash]] on :9999 and [[darkroom|DARKROOM]] on :8484. Both up this evening, the first time at a board since 9/4.", "w": "localhost"}, "bolo29": {"t": "BOLO 29", "k": "item", "d": "The SFW TikTok channel: owned Fortnite skins doing the emotes, faceless, BLACK. Research banked; held on one question, the reward-versus-risk reading.", "w": "oscar-mike/bolo29-tiktok.md"}, "bolo35": {"t": "BOLO 35", "k": "item", "d": "The story timeline tool and its theory: sound synthesis against the conservatory score. Read delivered 9/6; four questions held.", "w": "oscar-mike/story-timeline.md"}, "bolo41": {"t": "BOLO 41", "k": "item", "d": "The locus system: research filed by neighborhood. Convention provisional in _0.1_BVX_LEARN/LOCI/; needs your ratification.", "w": "_0.1_BVX_LEARN/LOCI/README.md"}, "numbering": {"t": "the 03/03 numbering", "k": "item", "d": "Two domains share the 03 prefix: 03_SETTING_SYSTEMS (stood up 8/25) and the empty pre-reserved 03_PLOT_SYSTEMS. One rename either way.", "w": "ShroomsQ/_CANON/_SSOT/"}, "trash-land": {"t": "Trash Land", "k": "item", "d": "BOLO 30: the man-made trash DMZ between the southern and northern US, mountain-range scale. Seed node written 9/6; seven rulings open, name bench recommends The Midden.", "w": "_CANON_NODES/oxo-trash-land-seed.md"}, "main-effort": {"t": "the main effort", "k": "proword", "d": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep's Block VI rename rides on it. On this board it has been [[block-c|Block C]] plus [[d9|D-9]] since 9/4.", "w": "SOP.md §5", "st": "provisional"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "The Marine Corps operations order: Situation · Mission · Execution · Administration and Logistics · Command and Signal. Mission first, then how. A BOLO status page is written in this shape.", "w": "MIL.05 · MCDP 5 Planning"}, "speed": {"t": "speed", "k": "ruling", "d": "MCDP 1: speed over time is tempo, and tempo is itself a weapon. On a page: read in ten seconds, the order on top, the story underneath. One of the three that govern the status page, with [[focus]] and [[boldness]].", "w": "MIL.01 §4 · invariant 8"}, "focus": {"t": "focus", "k": "ruling", "d": "MCDP 1: the convergence of effects at the decisive time and place, which demands strict economy everywhere else. On a page: one [[main-effort|main effort]] named, everything else supporting it and kept short.", "w": "MIL.01 §4 · invariant 8"}, "boldness": {"t": "boldness", "k": "ruling", "d": "MCDP 1: unhesitating exploitation of uncertainty to pursue major rather than marginal results; do not strive for certainty before you act. On a page: every call carries a default that runs if you say nothing.", "w": "MIL.01 §4 · quotes"}, "commanders-intent": {"t": "commander's intent", "k": "ruling", "d": "The purpose behind a task, stated as task plus in order to. The why outlasts the what, so a subordinate can act without asking. The Mission paragraph of every status page carries it.", "w": "MIL.01 §8"}, "mission-tactics": {"t": "mission tactics", "k": "ruling", "d": "Assign the task and the intent, leave the method to the one doing it, intervene only by exception. It is why a status page states defaults instead of asking questions.", "w": "MIL.01 §8"}, "ofm": {"t": "OFM agency", "k": "noun", "d": "The fansite-era management agency: an operations vendor running messages, traffic and posting on the creator's own account for 20 to 50 percent or more. A different business from the licensed booking agent of the studio era (10 to 15 percent).", "w": "_CANON_NODES/creator-management-recon.md §0"}, "ash": {"t": "A.S.H.", "k": "item", "d": "Riley Reid's creator-first agency, launched April 2021 because friends were paying up to 30 percent. The verified item behind the recon's creator-first list; the earlier Clubhouse Media Group line was a conflation and is corrected.", "w": "_CANON_NODES/creator-management-recon.md"}, "fla-468": {"t": "Florida ch. 468", "k": "item", "d": "Florida's talent-agency licensing statute: anyone who, for compensation, procures engagements for an artist, and artist includes a model. Running a creator's own account is not obviously procuring; booking that creator into a shoot or brand deal plainly is. An attorney question the moment a second human is booked.", "w": "_CANON_NODES/creator-management-recon.md §0"}, "management-recon": {"t": "the management recon", "k": "item", "d": "The sourced read on the manager path, 171 URLs: two businesses share the word agency; Fanvue is the only platform with a real agency structure; creator-first is the documented origin of the lane; reputation, not capital, is the barrier.", "w": "_CANON_NODES/creator-management-recon.md"}, "management-voices": {"t": "the management voices", "k": "item", "d": "Twenty-two first-person accounts of people who became managers, agency owners or house-builders. Nobody credible started with a roster; they started with one relationship. The commission number is the ethics map. Account control is the line.", "w": "_CANON_NODES/creator-management-voices.md"}, "bolo42": {"t": "BOLO 42", "k": "item", "d": "The admired-performers table, delivered 9/8 as the [[register|performer register]]; widened 9/9 to any sex; the creator-case nodes link from its rows.", "w": "BOLO.md #42"}, "rebel-rhyder": {"t": "Rebel Rhyder", "k": "person", "d": "The [[nasa-girl|NASA girl]], named by you 9/10 evening. Her case landed the same night: an electrical engineer who worked in aerospace for two years, in her own words; NASA is Rocco Siffredi's word only. Register row added, lane P, source S.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "challenge": {"t": "the challenge phrase", "k": "proword", "st": "ruled", "d": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is never explained.", "w": "STATE.md header · SOP.md §1"}, "out-block": {"t": "the OUT block", "k": "proword", "st": "ruled", "d": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing after it: OSCAR MIKE · OUT · OUT · OUT. A visible seam between what was parked and what starts next. Coded 9/6 on your order.", "w": "SOP.md §7 rule 9"}, "status-on-bolo": {"t": "status on BOLO N", "k": "proword", "st": "ruled", "d": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO, which is the update, not the page.", "w": "SOP.md §1 · §8"}, "recon": {"t": "recon", "k": "proword", "st": "benched", "d": "Benched 9/6: the [[boresight]] protocol aimed outside the wire (web and literature) instead of at the vault. \"Napkin recon\" would be the one-pass form. Waits in the [[bolo37|selection loop]].", "w": "SOP.md §5"}, "napkin": {"t": "napkin", "k": "proword", "st": "benched", "d": "Benched 9/6 as a modifier: back-of-the-napkin, one pass, rough numbers, no question loop. Spoken as a prefix: \"napkin boresight\", \"napkin recon\".", "w": "SOP.md §5"}, "syllabus": {"t": "syllabus", "k": "proword", "st": "benched", "d": "Benched 9/6: \"pull the syllabus on X\" = the tier-one 101 textbooks of a field, [[ivory-tower|ivory tower]], one per field to start.", "w": "SOP.md §5"}, "distill": {"t": "distill", "k": "proword", "st": "benched", "d": "Benched 9/6: make the BVX-LEARN one-sheet. The doctrine's own word: distill, don't summarize.", "w": "SOP.md §5"}, "grammar": {"t": "grammar", "k": "proword", "st": "benched", "d": "Benched 9/6: \"write the grammar\" = derive a system's operating language from its sources.", "w": "SOP.md §5"}, "mint": {"t": "MINT", "k": "proword", "st": "retired", "d": "Retired 9/23: was the recommended name for the proword selection loop; Chief named it BREVITY.", "w": "BOLO.md #37 · SOP.md §5"}, "readyroom": {"t": "READYROOM", "k": "proword", "st": "benched", "d": "Recommended name for the sit rep front page program: the Navy's briefing room, sibling of DARKROOM and WARROOM. Bench: OPSROOM · FRONTPAGE · THE BOARD. Your ruling.", "w": "BOLO.md #38"}, "ttp": {"t": "TTP", "k": "item", "d": "Tactics, Techniques and Procedures. Section 10 of every [[creator-case|creator case]]: the one mechanic worth studying, three to five transferable tips, what does not transfer, and which venture it feeds. Named by Chief 9/10 from the Corps bench (GOUGE was the provisional header); struck alternatives THE TAKE, LESSONS LEARNED, HOT WASH.", "w": "SOP.md §5 · _CANON_NODES/creator-case-*.md §10", "st": "ruled"}, "rtb": {"t": "RTB", "k": "proword", "d": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, the folder cleared. Chief's own coinage 9/10; replaces the retired [[sweep|sweep]]. Third movement of the park trio with [[oscar-mike|Oscar Mike]] and [[charlie-mike|Charlie Mike]]. 9/11: one meaning only — the pass that sends a parked card home and clears it; retires itself when oscar-mike/ is empty. The end of the sortie is Oscar Mike.", "w": "SOP.md §1", "st": "ruled"}, "charlie-mike": {"t": "Charlie Mike", "k": "proword", "d": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The park trio is Oscar Mike (park), Charlie Mike (resume), [[rtb|RTB]] (return to base).", "w": "SOP.md §1", "st": "ruled"}, "gouge": {"t": "GOUGE", "k": "item", "d": "Navy and Marine slang for the essential distilled information. Recommended 9/10 as the name for the creator-case lessons block and used as its provisional header for a few hours; Chief ruled [[ttp|TTP]] instead. Bench only.", "w": "SOP.md §5", "st": "retired"}, "frago": {"t": "FRAGO", "k": "proword", "st": "ruled", "d": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Chief's clarification 9/10 late (\"FRAGO is just the update after we've made the BOLO status page\"). \"FRAGO 45\" folds what changed since the last build into [[opord|OPORD 45]] and republishes; only what changed, everything not mentioned stands as ordered; the page's Log keeps every FRAGO.", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "opord": {"t": "OPORD (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 after twelve hours (\"there has to be a better name than that, something much cooler\"). The thing it named is the [[dope-sheet|DOPE SHEET]].", "w": "SOP.md §5"}, "bolo46": {"t": "BOLO 46", "k": "item", "d": "The OXO series follow-through: the [[telling-profile|Telling Profile]]'s 12 rulings · Anna's node · the pilot's page one. Captured 9/11 at priority one on Chief's word; it had no BOLO before.", "w": "BOLO.md #46"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRAGOs]]. RULED 9/11: header \"DOPE SHEET N\"; spoken \"give me the dope on N\", \"status report on N\", \"the situation on N\" all read the same. From the Scout Sniper's DOPE book: Data On Previous Engagements, everything known on the target and every prior engagement in one book. Replaced OPORD (retired the same morning).", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "bolo47": {"t": "BOLO 47", "k": "item", "d": "The dashboard consult: eight ranked ideas from current Claude Code / VS Code operator boards for the [[sitrep|sit rep]] page. Captured 9/11; none taken yet.", "w": "BOLO.md #47"}, "bolo48": {"t": "BOLO 48", "k": "item", "d": "The name bench: every unruled word with its bench on one sheet. Ruled 9/11: DOPE SHEET · ADORNED · ABORT (the cancel word) · BREVITY (what the SOI holds) · HOTLINE / HOTLINE ACTUAL (the operator's callsign). Closed 9/11: the close-out is Oscar Mike, ENDEX retired. Open: READYROOM · MINT. Pool: \"caught up\" · INTEL.", "w": "BOLO.md #48 · SOP §5"}, "bolo49": {"t": "BOLO 49", "k": "item", "d": "The Massive presets: the best free banks for Native Instruments Massive, verified 9/11; the shortlist is on its sheet.", "w": "BOLO.md #49"}, "eink": {"t": "E-INK", "k": "ruling", "st": "provisional", "d": "The light face of every internal page, provisional 9/11: Kindle-gray paper (#D8D8D2 ground, #E4E4DE surface), never white — \"like an old Kindle… digital ink.\" Shown only when a viewer forces light; DARK is the only theme and the toggle is gone.", "w": "SOP.md §2 · the three templates"}, "adorned": {"t": "ADORNED", "k": "ruling", "st": "ruled", "d": "DARKROOM dress-state value, RULED 9/11 (\"let's do adorned\"): naked except for an accessory — socks, heels, jewelry, glasses, a hat, a harness; the r/WhyWearAnythingAtAll read. Replaced implied (retired 9/11: no garment and nothing shown). Vocab edited, zero-shot rerun, probes retrained the same morning; 42 old human confirmations still say implied and are left as Chief's record.", "w": "_PRIVATE/taxonomy_engine/vocab.json · BOLO 44"}, "actual": {"t": "ACTUAL", "k": "proword", "st": "ruled", "d": "The suffix for the commander in person on the net (\"Six Actual\"). RULED 9/11 as the formal form of the operator's callsign: [[hotline|HOTLINE ACTUAL]]. Never alone.", "w": "SOP.md §5"}, "bolo50": {"t": "BOLO 50", "k": "item", "d": "The standards campaign: every level of the operation as a standards organization; a networked library of outside and Command-made standards. Research phase: the harvest banked as a locus, the register pulled by agent. Opened 9/11 on a break-break.", "w": "BOLO.md #50 · _0.1_BVX_LEARN/LOCI/standards.locus.md"}, "abort": {"t": "ABORT", "k": "proword", "st": "ruled", "d": "The cancel word, RULED 9/11: \"abort abort abort\" spoken three times, then the correction. Cancels the immediately preceding order; the record keeps the abort line, not the order. Aircrew and JTAC lineage: the call not to release. First live use the same minute: \"abort abort abort the index process\" (the ENDEX). Replaced belay.", "w": "SOP.md §0–1 · §5"}, "brevity": {"t": "BREVITY", "k": "noun", "st": "ruled", "d": "What the [[soi|SOI]] holds, RULED 9/11 (\"I do like brevity better\"): the Command's word list, after the Multi-Service Brevity Codes, the list that makes radio short. The SOI's subtitle on every page. Replaced \"the lexicon\" (provisional) and \"the house tongue\" (retired). RULED 9/23: BREVITY also names the proword selection loop ([[bolo37|BOLO 37]]), the pass that mints the list; MINT retired.", "w": "SOP.md §0 · §6 · the SOI page"}, "hotline": {"t": "HOTLINE", "k": "proword", "st": "ruled", "d": "The operator's callsign, RULED 9/11. Casual: \"Hotline\", \"word from Hotline\". On the net and on every page: **HOTLINE ACTUAL**. The point: the word comes from on high, detached from the person, the way CENTCOM ACTUAL speaks for the command, not for a man (\"remove the artist from the art\"). Replaces \"you\" on the explainer rail.", "w": "SOP.md §0–1 · §5 · const WHO in the templates"}, "bolo51": {"t": "BOLO 51", "k": "item", "d": "The logistics front: one standing audit, quality, and improvement function over every system in daily use, plus the token offload onto hooks, skills, subagents, routines, and the design canvas. Standards pulled from BOLO 50's register. Opened 9/12.", "w": "BOLO.md #51 · DOPE SHEET 51"}, "proword": {"t": "proword", "k": "noun", "st": "ruled", "d": "Procedure word. Radiotelephony's fixed words that stand for a whole instruction: ROGER, WILCO, OUT, SAY AGAIN. NATO's book for them is ACP 125. The Command's prowords are the same idea aimed at the protocol: say one and the procedure fires.", "w": "SOP.md §0–1 · ACP 125"}, "gear": {"t": "gear N", "k": "proword", "st": "provisional", "d": "The agent ceiling for the current task, spoken as a number. Gear 1 = 3 agents (the default; silence means gear 1) · 2 = 6 · 3 = 9 · 4 = 12 · 5 = 15, never used: the ceiling exists to be named. A shift lasts one task, then back to gear 1. At every gear, fetch-and-extract agents run haiku, write-ups sonnet, fable on the main line only. Working name (Chief 9/12: \"let's just call them gears for now\"); warps and DEFCON aborted in the same breath. Part of [[gearbox|the gearbox]].", "w": "SOP.md §1 · §5 · BOLO 52"}, "gearbox": {"t": "the gearbox", "k": "system", "st": "provisional", "d": "The sustainable-speed system, opened 9/12 as BOLO 52: the [[gear|gears]] (the agent ceiling), the gauge (_tools/usage/, weighted tokens per day from the local transcripts), and the weekly budget the week must fit. Lineage: the 9/10 sixteen-agent run spent half a week in one session. Never sixteen again.", "w": "_tools/usage/ · BOLO 52 · SOP.md §1"}, "bolo52": {"t": "BOLO 52", "k": "item", "d": "The gearbox: the sustainable-speed system. Gears 1–5 as the agent ceiling, the gauge, the weekly budget. Spun out of BOLO 51 on 9/12; name provisional.", "w": "BOLO.md #52"}, "bolo53": {"t": "BOLO 53", "k": "item", "d": "The Command's own development standard: the boresight → how-copy → build → FRAGO → Oscar Mike loop read as an iterative-incremental life cycle, filed beside the project flow. Tabled 9/12; OPENED 9/15 by Chief's \"Open 53\"; v0.1 working draft on disk.", "w": "BOLO.md #53 · DOPE SHEET 53 · ShroomsQ/_CANON/_SSOT/05_OPERATIONS/📐 ssot_05_operations_development_standard.md"}, "bolo54": {"t": "BOLO 54", "k": "item", "d": "The sit rep formation: orchestrator, independent specialists, one reviewer at the fan-in. Chief's doctrine 9/12 (Amdahl · Brooks · context is the cost unit · review at the merge). Built the same turn: prep.py · assemble.py · the sitrep skill. The main line's read drops from ~211 KB to ~3 KB.", "w": "BOLO.md #54 · DOPE SHEET 54 · .claude/skills/sitrep/"}, "formation": {"t": "the formation", "k": "system", "st": "provisional", "d": "How agents are laid out on any multi-agent job (BOLO 54, 9/12): hub and spoke. The main line decomposes into pieces that share no state; specialists run independently on disjoint inputs; they sync only at named handoff points; one reviewer, a script where it can be, sits at the fan-in. No peer cross-checks. Rides the [[gearbox|gearbox]]: the gear says how many, the formation says how they stand.", "w": "SOP.md §1 (the gear row) · BOLO 54"}, "bolo55": {"t": "BOLO 55", "k": "item", "d": "The DOPE SHEET format — the document layout. Captured 9/16 and RULED the same day (Chief: \"one page · keep the rail, keep it\"): one page, the explainer rail kept, the five-paragraph order with the order on top, the mantra, the log. Every sheet since builds to it.", "w": "BOLO.md #55 · DOPE SHEET 55"}, "command": {"t": "the Command", "k": "noun", "st": "ruled", "d": "The whole operation under HOTLINE ACTUAL: BLACK, ORANGE and OPERATOR together. RULED 2026-09-16 (\"let's go with command\") from a bench of ten on BOLO 48; \"the house\" is retired as the word. Marine usage: the authority a unit answers to. Command standard, the Command's ladder, Command-native; \"organic\" replaces in-house.", "w": "SOP.md §2 · §5 · BOLO 48"}, "bolo18": {"t": "BOLO 18", "k": "item", "d": "The two-stage spine sweep: every source in the Zotero library keyed to the story spine's shelves, then distilled shelf by shelf into the plot, setting and character models. Reopened 9/16 as the gate on all story-side work; the full pass keyed all 1,031 items the same night.", "w": "BOLO.md #18 · _tools/zotero/README.md · DOPE SHEET 18 https://claude.ai/artifact/CRVaYBt5GBFp7inyXYG3C5"}, "bolo25": {"t": "BOLO 25", "k": "item", "d": "The standard project. Watchlist row 25 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #25"}, "bolo31": {"t": "BOLO 31", "k": "item", "d": "MIL.01 read. Watchlist row 31 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #31"}, "bolo32": {"t": "BOLO 32", "k": "item", "d": "The markdown marking SOP. Watchlist row 32 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #32"}, "bolo33": {"t": "BOLO 33", "k": "item", "d": "The MCDP browser. Watchlist row 33 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #33"}, "bolo39": {"t": "BOLO 39", "k": "item", "d": "Food preservation. Watchlist row 39 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #39"}, "bolo57": {"t": "BOLO 57", "k": "item", "d": "Voice work as income: Chief can already build voices in ElevenLabs, so it is a fourth candidate venture beside 24 · 27 · 29. Four paths named, none costed. Held until a boresight prices it.", "w": "https://claude.ai/artifact/19rjZFkarB1QvEYK1vubdo"}, "bolo56": {"t": "BOLO 56", "k": "item", "d": "JUDY — the voice loop. Ears (BOLO 26), brain (keyword router, ruled 9/17), mouth (ElevenLabs, Blondie ruled 9/17), face and console all built. The wire — an MCP server exposing brain.py's tools to the VS Code session — is ruled and not yet built.", "w": "https://claude.ai/artifact/Ckg6W4JrNo8JvLR55ZW5Ea"}, "crew-grades": {"t": "crew grades", "k": "ruling", "st": "provisional", "d": "The seats in [[formation|the formation]] are named by NASA shuttle crew grade. RULED 2026-09-16 (\"I like specialist, mission specialist… go CDR\"; bench: NASA crew grades (rec) · Marine fire team · Mission Control consoles). The grade says what kind of work a seat does, never which model sits in it: [[cdr|CDR]] · [[ms|MS]] · [[ps|PS]] · [[range|RANGE]]. Gear 1 = one MS + two PS under the CDR. \"Sonnet specialist\" and \"haiku specialist\" retired. Provisional until it survives a week.", "w": "SOP.md §6 · BOLO 54"}, "cdr": {"t": "CDR", "k": "noun", "st": "provisional", "d": "Commander. The main line in [[formation|the formation]]: decomposes the job, rules, writes the header and the order. Fable sits there today. One of the [[crew-grades|crew grades]], RULED 2026-09-16.", "w": "SOP.md §6"}, "ms": {"t": "MS", "k": "noun", "st": "provisional", "d": "Mission Specialist. The writer seat in [[formation|the formation]]: the crew member who does the mission's work, drafts the sheet, writes the register. Sonnet sits there today. Usage: \"an MS drafts the sheet.\" One of the [[crew-grades|crew grades]].", "w": "SOP.md §6"}, "ps": {"t": "PS", "k": "noun", "st": "provisional", "d": "Payload Specialist. The fetcher seat in [[formation|the formation]]: flown for one payload, one narrow task, such as pulling links or extracting a batch. Haiku sits there today. Usage: \"two PS pull the links.\" One of the [[crew-grades|crew grades]].", "w": "SOP.md §6"}, "range": {"t": "RANGE", "k": "noun", "st": "provisional", "d": "The range safety officer: the script reviewer at the fan-in of [[formation|the formation]]. Holds the abort, never flies. A script wherever it can be, never a checker agent. Usage: \"RANGE stopped the run.\" One of the [[crew-grades|crew grades]].", "w": "SOP.md §6 · BOLO 54"}, "tm": {"t": "TM", "k": "noun", "st": "ruled", "d": "Technical Manual. The page type for a system document, RULED 2026-09-16 (\"TM go\"; bench TM (rec) · FM · SCHEMATIC), beside the SITREP (the board), the [[dope-sheet|DOPE SHEET]] (a BOLO's status) and the [[soi|SOI]] (the book). TM 04 = the plot system · TM 03 = the setting system · TM 02 = the character system, each built by _tools/tm/build.py from its SSOT markdown. Every TM carries the [[ck3-rules|CK3 hover layer]]; a section with no hover terms is a blocking finding.", "w": "SOP.md §6 · _tools/tm/"}, "organic": {"t": "organic", "k": "noun", "st": "ruled", "d": "The Command's word for what it builds and runs itself, RULED 2026-09-16 with [[command|the Command]]: \"organic\" replaces in-house. Military usage: organic assets are the ones a unit owns outright rather than borrows. An organic tool is one written here; an organic voice is one that runs on [[the-box|the box]].", "w": "SOP.md §6"}, "the-house": {"t": "the house (retired)", "k": "noun", "st": "retired", "d": "Retired 2026-09-16 for [[command|the Command]]. Was: the whole operation, and by extension house format, house tongue, in-house. Say the Command, Command format, [[organic]].", "w": "SOP.md §6"}, "judy": {"t": "JUDY", "k": "system", "st": "ruled", "d": "The voice loop, [[bolo56|BOLO 56]]: Chief talks, she listens, she answers out loud. Name RULED 2026-09-16, spelled J-U-D-Y, superseding the provisional THE HANDLER. Persona TARS (affable, informative, bratty); voice the 007 handler register, Blondie on ElevenLabs ruled 9/17; face on the desktop as PNG state swaps. Ears local on the 3090 ([[bolo26|BOLO 26]]), brain the keyword router (ruled 9/17), the wire an MCP server to the VS Code session (ruled, unbuilt). Lives in _tools/dictation/.", "w": "BOLO.md row 56 · DOPE SHEET 56"}, "go": {"t": "go N", "k": "proword", "st": "ruled", "d": "The phase go-word on a [[dope-sheet|DOPE SHEET]]: \"go 6\" fires phase 6 of the sheet's execution paragraph, nothing more. Coded 9/15 (dictation: \"goes to ex 6\"). RULED 2026-09-16 the hard way: \"go\" is the order, not the build-out. Chief said \"slice go,\" the whole pipeline stood up and six evenings got assigned, and he called it \"a little bit too far.\" Deliver the sheet's order, then wait for the next word.", "w": "SOP.md §8 · BOLO 55"}, "ladder": {"t": "the Command's ladder", "k": "ruling", "st": "ruled", "d": "The standards ladder from BOLO 50, RULED 2026-09-15: the NASA four rungs, policy → procedural requirement → standard → handbook, with spec as a tag on nodes. Every Command document carries its rung in the frontmatter (SOP.md sits on procedure). Each world's standards body is canon in its own right.", "w": "BOLO.md row 50 · _0.1_BVX_LEARN"}, "digest": {"t": "the session-open digest", "k": "system", "st": "provisional", "d": "What a session reads instead of the five files: the hook prints the Ready Rack, the blocked rows, the newest BOLOs, PMCS red, the box and the tree at open (SOP §4 under [[formation|the formation]], BOLO 54). The five are still read every sit rep, by the specialists and the prep script; the [[cdr|CDR]] reads the digest.", "w": "SOP.md §4 · _tools/sitrep/digest.py"}, "bolo26": {"t": "BOLO 26", "k": "item", "st": "ruled", "d": "Dictation with a custom dictionary: the whisper fix. Route RULED BUILD 9/16 and shipped the same session as _tools/dictation/ (faster-whisper on the 3090, the Command lexicon as initial prompt, SOP section 8 repair). Now the listening half of [[judy|JUDY]].", "w": "https://claude.ai/code/artifact/c5ece55b-4c2b-49e1-bc94-31bce8477ec9"}, "chief": {"t": "Chief", "k": "person", "st": "ruled", "d": "The operator's address, RULED 9/17 (\"across the board, change it everywhere, Chief, C-H-I-E-F\"). Replaces Papi in every live document, page, tool and memory; the frozen archives keep the old word as record. On the net and on the pages the callsign is still [[hotline|HOTLINE ACTUAL]]; in chat and in the record, Chief.", "w": "SOP.md §5 · §8"}, "launch-sequence": {"t": "the launch sequence", "k": "system", "st": "ruled", "d": "What [[go-for-launch|go for launch]] fires (BOLO 58, built 9/17): a zero-token script brings the DARKROOM and [[judy|JUDY]] up, probes the wire, opens the board and the [[soi|SOI]]; then the [[sitrep|sit rep]] runs in the formation; the reply carries the station poll. Stations RULED 9/17 by Chief: the board · the SOI · zero DOPE SHEETs · the DARKROOM · JUDY · the seven tools. The name RULED 9/17: \"just launch sequence\".", "w": "_tools/launch/launch.py · .claude/skills/launch/ · BOLO.md row 58"}, "go-for-launch": {"t": "go for launch", "k": "proword", "st": "ruled", "d": "The word that fires [[launch-sequence|the launch sequence]], RULED 9/17 over a bench of ten (five Marine, five NASA). Lineage: the flight director's go/no-go poll, every console answering go. Garbles: go for log · go for lunch. Never [[go|go N]], which is a phase go-word on a DOPE SHEET.", "w": "SOP.md §0–1 · §5 · §8 · .claude/skills/launch/"}, "good-traffic": {"t": "good traffic, stand by", "k": "proword", "st": "ruled", "d": "One of [[judy|JUDY]]'s two acknowledgments, RULED 9/17: your transmission came through clean, wait for the reply. The other is \"Copy.\" She says nothing else to confirm receipt.", "w": "SOP.md §5 · _tools/dictation/reader.py"}, "lock-in": {"t": "JUDY, lock in", "k": "proword", "st": "ruled", "d": "Switches [[judy|JUDY]] to the military-comms attitude, RULED 9/17: radiotelephone register, prowords, no jokes, brat 0, nine sentences at most. Preset key strac. Bench it beat: STRAC · BY THE BOOK · CONDITION ONE · NOMINAL.", "w": "SOP.md §1 · §5 · _tools/dictation/presets.py"}, "fries-in-the-bag": {"t": "JUDY, put the fries in the bag", "k": "proword", "st": "ruled", "d": "Switches [[judy|JUDY]] to the comfortable-day attitude, RULED 9/17: warm, dry, a light flirt, the information first; brat 45. The standing default. Preset key at-ease. Bench it beat: AT EASE · REST · CRUISE. Garble: \"put the fries in the best\".", "w": "SOP.md §1 · §5 · _tools/dictation/presets.py"}, "goon-time": {"t": "JUDY, it's goon time", "k": "proword", "st": "ruled", "d": "Switches [[judy|JUDY]] to the full-brat attitude, RULED 9/17: teasing, knowing, innuendo allowed, facts intact; brat 100, sixteen sentences. Preset key liberty. Bench it beat: LIBERTY CALL · ZERO-G · OFF THE LEASH.", "w": "SOP.md §1 · §5 · _tools/dictation/presets.py"}, "volcano": {"t": "the volcano", "k": "ruling", "st": "provisional", "d": "Chief's image for BOLO 24's edge (9/17): be the unexpected and immediately a contender while everyone else climbs ladders. The boresight priced it as a mechanism, not a wish: [[character-moat|character as moat]], [[motion-lane|motion as fuse]], a [[category-sentence|press-ready sentence]] as the attached audience, and a [[thirty-day-test|thirty-day test]] before a library is banked.", "w": "_PRIVATE/_boresight-24/market-demand.md §5 · BORESIGHT 24"}, "volcano-sequence": {"t": "the Volcano Sequence", "k": "system", "st": "provisional", "d": "The fused method for BOLO 24 (method brief, 9/17): NASA's reviews and [[conops|ConOps]], the Marines' [[mcpp|problem framing and war game]], the Double Diamond and Jobs-to-be-Done for the audience, and category design's [[lightning-strike|Lightning Strike]] for the splash. Five phases slotted into M-002 to M-005 without renaming them; each closed by a review the charter did not have (MCR · SDR/PDR · CDR/SIR/ORR · FRR · Gate 4).", "w": "_PRIVATE/_boresight-24/method.md §5"}, "conops": {"t": "ConOps", "k": "noun", "st": "ruled", "d": "Concept of operations, NASA systems engineering: walk the whole system end to end from the user's seat before building it, including the off-nominal scenarios. For BOLO 24: a follower's first thirty seconds, a subscriber's first paid week, a platform trust-and-safety review, a month where the conservative gate is missed twice. The missing design-research artifact the method brief named.", "w": "_PRIVATE/_boresight-24/method.md §2 · NASA SEH"}, "mcpp": {"t": "MCPP", "k": "noun", "st": "ruled", "d": "The Marine Corps Planning Process: problem framing → course-of-action development → COA war game → COA comparison and decision → orders development → transition. Problem framing is design research by another name; the war game is the pre-launch simulation BOLO 24 never had: play the launch three moves out against the algorithm, the platform and a rival account before a resource commits.", "w": "_PRIVATE/_boresight-24/method.md §3 · MCWP 5-10"}, "lightning-strike": {"t": "Lightning Strike", "k": "noun", "st": "ruled", "d": "Play Bigger's category-design launch: a category announcement compressed into a short window to generate maximum attention, then repeated on a three-to-six-month cadence. The closest documented pattern to [[volcano|the volcano]]. For BOLO 24 it is workstream W8, the splash: one [[category-sentence|sentence]], one asset built to carry it, the day-one sequence, cleared by its own FRR.", "w": "_PRIVATE/_boresight-24/method.md §4 · playbigger.com"}, "trl": {"t": "TRL", "k": "noun", "st": "ruled", "d": "Technology Readiness Level, NASA's maturity ladder from 1 (principles observed) to 9 (flight proven). The boresight's read: the render chain and the rig sit at 6–7 (demonstrated once, S4-01); the discovery engine sits at 3–4 (an analytical case, nothing demonstrated on a real audience). Raising the low one is what the [[thirty-day-test|thirty-day test]] is for.", "w": "_PRIVATE/_boresight-24/method.md §2"}, "thirty-day-test": {"t": "the thirty-day test", "k": "ruling", "st": "provisional", "d": "R9 from the creator-cases synthesis, dated by the boresight: the slice plus the first loop posted to X and Bluesky 10/1–10/31 under the disclosed frame, thresholds written before the first post. Follower growth at or above about 1,300 a month (the Variety Itsol rate) reads [[volcano|volcano]], bank forty; about 470 (the Kirenes rate) reads ladder, bank twenty; under 250 reads replan the positioning before November. Call D-15.", "w": "BORESIGHT 24 · D-15 · _PRIVATE/_boresight-24/facts.md §7"}, "motion-lane": {"t": "the motion lane", "k": "ruling", "st": "provisional", "d": "Call D-12: add short loops (five to fifteen seconds) as the viral unit beside the stills. The evidence: every documented fast breakout shipped motion; the best stills-only page found caps near a thousand a month after four years; the top of the lane (RadRoachHD 41,500 a month, wildeer 15,400) is animators and game devs. The pipeline renders a frame in thirty seconds, so a five-second loop is about an hour of GPU time.", "w": "BORESIGHT 24 · D-12 · _PRIVATE/_boresight-24/market-supply.md §1–2"}, "character-moat": {"t": "character as moat", "k": "ruling", "st": "provisional", "d": "The boresight's read of MCDP 1's center of gravity for BOLO 24: the character bible (Remi's wound, register and arc) is the one thing the cautionary cases lack and competitors cannot copy quickly. It is the moat, not the fuse: it keeps an audience, it does not fetch one. The fuse is [[motion-lane|motion]] and a [[category-sentence|sentence]].", "w": "BORESIGHT 24 · _PRIVATE/_boresight-24/method.md §3"}, "category-sentence": {"t": "the category sentence", "k": "ruling", "st": "provisional", "d": "Call D-16: the one sentence the whole launch carries, the [[lightning-strike|Lightning Strike]]'s point of view. Aitana Lopez's mechanism was a press-ready sentence ('the first AI model earning real money'), not a render. The studio's placeholder: 'a studio signed a girl who does not exist, and she is the only one in the lane with a life.' Chief words the real one.", "w": "BORESIGHT 24 · D-16"}, "processor-risk": {"t": "processor risk", "k": "noun", "st": "ruled", "d": "Every adult platform sits downstream of the same card networks. Gumroad banned NSFW in March 2024 (Stripe/PayPal); in July 2025 Collective Shout pressured the processors and Steam retired a theme-based set of games (incest, non-consent, torture — not AI-specific, and adult games broadly still sell there) while itch.io lost paid adult entirely (free adult re-indexed within days); Civitai lost card processing in May 2025 and went to crypto. The chokepoint is the moment a platform is classified as existing to sell explicit content. Calls D-13 and D-18.", "w": "_PRIVATE/_boresight-24/market-supply.md §3"}, "fanvue": {"t": "Fanvue", "k": "noun", "st": "ruled", "d": "The platform positioning itself as home for disclosed AI and CGI personas doing adult or near-adult content; ran the first 'AI Personality of the Year' award with OpenArt in June 2026 (won by Soraya Thorne). Evidence that the disclosed-persona lane has an institution to break into on purpose. The boresight recommends a Fanvue test beside Patreon, SubscribeStar Adult and Fansly (D-13).", "w": "_PRIVATE/_boresight-24/market-demand.md §3, §5"}, "aitana": {"t": "Aitana Lopez", "k": "item", "st": "ruled", "d": "The Barcelona agency's disclosed CGI influencer (debuted late 2023): about ten thousand a month in brand deals before two hundred thousand followers, now near 360 thousand. The mechanism the boresight names as Remi's honest path: a small team, a maintained life, and a press-ready sentence the media amplified for free. SFW, and the adult CGI-persona lane is copying it.", "w": "_PRIVATE/_boresight-24/market-demand.md §3, §5"}, "stills-ceiling": {"t": "the stills ceiling", "k": "noun", "st": "ruled", "d": "What a stills-only 3D page earns, observed 9/17 on Graphtreon: the best found (Mr. Vargas) near a thousand a month on 177 patrons after four years and a studio apprenticeship; Dreamrider3D at 31 dollars a month after six years; platform-wide 98 percent of Patreon creators never clear a thousand a month. Animation or a game wrapper is what pushes past it.", "w": "_PRIVATE/_boresight-24/market-supply.md §2"}, "the-ai-shock": {"t": "the AI shock", "k": "noun", "st": "ruled", "d": "What generative AI did to hand-rendered 3D by 2026: it split the lane instead of killing it. Civitai lost card processing (May 2025); 'slop' was Merriam-Webster's 2025 word of the year; the counter-trend is a human-made premium. The policy line everywhere is stylized versus photoreal-of-a-real-person, not AI versus hand. A consistent hand-posed 3D character reads as 'real 3D' against the flood.", "w": "_PRIVATE/_boresight-24/market-demand.md §2"}, "better-areas": {"t": "the better areas", "k": "noun", "st": "ruled", "d": "Adjacent lanes for the same Blender skill, from the demand read: VTuber model commissions (1,300 to 3,800 dollars entry, five to ten thousand rigged; a booming, policy-safe market), adult VR (projected 19 billion dollars by 2026, 97 percent subscription), AI-hybrid pipelines with the human finish sold as the product, and 3D visual novels (top adult-VN creators about five thousand a month in 2023). Real lanes; none is the one on the sheet.", "w": "_PRIVATE/_boresight-24/market-demand.md §6"}, "remi": {"t": "Remi Slate", "k": "person", "st": "provisional", "d": "Ultrasin's first signing: 21 in canon, born August 11 2005, the mother lost in 2020 (D-7), evicted at 18; a disclosed 3D persona (D-6) with a bratty, direct register and a wound and an arc. The character sheet is v0.2; the name is ruled 'for now' with the spelling open. The boresight's read: she is the moat; she needs motion and a sentence to travel.", "w": "_PRIVATE/BOLO-24-character-sheet.md"}, "route-b": {"t": "Route B", "k": "ruling", "st": "ruled", "d": "RULED 2026-09-17 (D-12, Chief: \"we're going to be doing Route B\"): the motion lane is local AI image-to-video on the finished Blender render — ComfyUI with Wan 2.2 or LTX on the 3090, NSFW loops and beginner workflows already on Civitai, zero dollars. Route A (the Spine-style living picture NIKKE actually uses) is the later splash asset if loops travel; Route C (light Blender motion) is the fallback. Nowhere in the plan does Chief animate by hand.", "w": "_PRIVATE/_boresight-24/motion-lane.md §4, §6"}, "lewd-line": {"t": "the lewd line", "k": "ruling", "st": "provisional", "d": "Call D-18: suggestive-not-explicit (bikini, lingerie, implied; no nipples, no genitals, no act) versus explicit. Lewd-first keeps Instagram and TikTok reach, the brand-deal ceiling (Lu do Magalu about 34 thousand a post, Milla Sofia 10 to 25 thousand), rails under five percent and no age-verification net; explicit buys per-fan revenue nobody has quantified and costs all of that. The standard ladder: a second, separated Fanvue account once the free audience converts.", "w": "_PRIVATE/_boresight-24/lewd-lane.md §4–5"}, "close-friends": {"t": "Close Friends", "k": "noun", "st": "ruled", "d": "Two things wearing one name. Instagram Subscriptions is the real rail: a paid Stories tier, zero Meta commission through 2026, app-store cut on top, ten thousand followers to unlock. The informal version — a Close Friends tier paid off-platform by Venmo, Cash App or PayPal friends-and-family — inherits the payment app's adult ban and its freezes (PayPal up to 180 days). The trap, per the rails read.", "w": "_PRIVATE/_boresight-24/rails.md §B1"}, "boring-rails": {"t": "the boring rails", "k": "noun", "st": "ruled", "d": "The 2026 rails that hold under five percent effective cost for a lewd-not-nude persona and trigger no ID wall because none is legally an adult platform: Instagram Subscriptions, Fanfix (20 percent, brand-safe, no nudity and no AI nudes), Passes (flat 10 percent), Ko-fi and Buy Me a Coffee as tip jars, Throne wishlists. Fanvue (15 to 20 percent) is the one that also carries an explicit paywall behind a lewd public layer.", "w": "_PRIVATE/_boresight-24/rails.md §B2, §B6"}, "age-verification": {"t": "the age-verification net", "k": "noun", "st": "ruled", "d": "What attaches the moment content is sold as explicit: 26 US states with adult age-verification laws as of June 2026 (upheld 6–3 in Free Speech Coalition v. Paxton, June 2025), the UK Online Safety Act in force since July 2025 (document or facial age assurance; penalties up to ten percent of global revenue or 18 million pounds), the EU moving nationally. Lewd-not-nude content on mainstream apps sits under the legal definition and outside the net.", "w": "_PRIVATE/_boresight-24/rails.md §B5 · _PRIVATE/_boresight-24/lewd-lane.md §4"}, "steam-record": {"t": "the Steam record", "k": "noun", "st": "ruled", "d": "Corrected 9/17 on Chief's word. Valve's July 2025 clause bars content that breaks its payment processors' rules; the retired games clustered on incest, non-consent, torture and slavery (counts from 50 to 400-plus, no official figure). It was theme-based, not AI-based; Valve's AI policy is a separate track whose only adult carve-out is live-generated content. Adult games broadly still sell on Steam under the Adult Only tag. itch.io lost paid adult entirely; free adult was re-indexed within days.", "w": "_PRIVATE/_boresight-24/rails.md §A"}, "bolo62": {"t": "BOLO 62", "k": "item", "d": "The knobs: the MPK rotary dials wired as the scroll wheel and the zoom, a daemon beside JUDY and a KNOBS station on launch. Wired 9/17; directions unproven by Chief's hand.", "w": "BOLO.md · row 62"}, "bolo64": {"t": "BOLO 64", "k": "item", "d": "The Claude Code doctrine: best practices folded into the Command. Captured 9/17 as research only; the four clarifying questions sit at the top of the Blocked table by Chief's word.", "w": "BOLO.md · row 64 · DOPE SHEET 64 https://claude.ai/artifact/FnzAdEuAGoAkN3hWreqjMF · BORESIGHT 64 https://claude.ai/artifact/PtQsWhM6VpKzuiAQ1Mhfi4"}, "bolo67": {"t": "BOLO 67", "k": "item", "d": "The plain register: JUDY talks like the Claude Code docs and keeps the attitude. Captured 9/17; the boresight found the gap is code tokens, undefined lexicon and actor-first sentences, not grade level.", "w": "BOLO.md · row 67"}, "bolo68": {"t": "BOLO 68", "k": "item", "d": "The workflows: the formation as scripts, not prose. Captured 9/17; the first candidate is the sit rep formation as a Claude Code workflow.", "w": "BOLO.md · row 68"}, "bolo69": {"t": "BOLO 69", "k": "item", "d": "The yo-yo: the inbox for the idea that springs. One pad, Pepper's voice, one folder, a Haiku crew; the trick lays an idea down, the wind stores it. Captured 9/17, DOPE SHEET ordered 9/18.", "w": "https://claude.ai/artifact/G6sfNtbgR884ifa868RsLu"}}, "brevity": {"slots": [{"id": "main-effort", "thing": "The command proword for 'this is the one thing, focus here': MCDP 1's designated main effort, the task everything else supports. Spoken, it names or asks for the single priority. Block VI's title rides on it.", "since": "8/21", "front": ["MAIN EFFORT", "DECISIVE POINT", "PRIORITY", "SCHWERPUNKT", "FOCUS OF EFFORT"], "sealed": ["MAIN EFFORT", "DECISIVE POINT", "PRIORITY"], "status": "open", "ruling": null}, {"id": "outside-read", "thing": "The boresight aimed outside the wire: the same three-part read (readback, the read, clarifying questions) drawing on the web and the literature instead of the vault. Chief: 'a word different than boresight for anything on the web or outside of it.'", "since": "9/6", "front": ["RECON", "SCOUT", "OTH", "INTEL", "SWEEP"], "sealed": ["RECON", "SCOUT", "OTH"], "status": "open", "ruling": null}, {"id": "napkin", "thing": "The modifier for a back-of-the-napkin read: a fast, rough pass that says the shape of the answer before the real read. Chief: 'I want to be able to say napkin boresight.'", "since": "9/6", "front": ["NAPKIN", "QUICK LOOK", "ROUGH", "MAP CHECK", "GLANCE"], "sealed": ["NAPKIN", "QUICK LOOK", "ROUGH"], "status": "open", "ruling": null}, {"id": "intel-noun", "thing": "The noun for
