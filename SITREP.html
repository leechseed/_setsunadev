}
/* ---- the glossary page: every proword and board word, from the same register the tooltips use ---- */
const KIND_ORDER = ['proword', 'noun', 'ruling', 'system', 'item', 'person'];
const KIND_LABEL = { proword: 'Prowords · say one and the protocol fires', noun: 'Board nouns', ruling: 'Rulings and doctrine', system: 'Systems and programs', item: 'Items on the board', person: 'People' };
const stChip = st => st ? `<span class="chip st-${st === 'ruled' ? 'ruled' : st === 'benched' ? 'parked' : 'open'}">${st}</span>` : '';
function showGlossaryPage() { window.open(SOI_URL, '_blank', 'noopener'); }
$('#olRows').addEventListener('click', e => { const r = e.target.closest('.ol-row'); if (!r) return; if (r.dataset.g) showGlossaryPage(); else go(+r.dataset.i); });
/* the SOI button is an outbound link */

/* ---- tooltips: hover → open · 1.5 s or Space → lock · nested to depth 3 · Esc closes ---- */
let tips = [];
let openTimer = null, closeTimer = null;
function tipFor(target, depth) {
  const k = target.dataset.t; const raw = target.dataset.raw;
  const el = document.createElement('div');
  el.className = 'tip' + (raw ? ' raw' : '');
  el.dataset.depth = depth;
  if (raw) { el.textContent = raw; }
  else {
    const g = G[k];
    const deep = depth >= 3;
    el.innerHTML = `<div class="th"><b>${esc(g.t)}</b><span class="k">${esc(g.k)}</span></div>
      <p>${deep ? esc(g.d.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kk, l) => l || (G[kk] ? G[kk].t : kk))) : md(g.d)}</p>
      ${deep ? `<div class="w"><a href="#" class="glopen" data-k="${k}">Open in SOI →</a></div>` : `<div class="w">${esc(g.w || '')}</div>`}
      <div class="lock"><b></b></div><div class="hint">hold 1.5 s or press Space to lock · Esc closes · click opens the SOI panel</div>`;
  }
  document.body.appendChild(el);
  // position: below the target, clamped to the viewport
  const r = target.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
  let y = r.bottom + 8; if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const rec = { el, target, depth, locked: false, timer: null };
  if (!raw) {
    const bar = $('.lock b', el); requestAnimationFrame(() => { bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%'; });
    rec.timer = setTimeout(() => lock(rec), 1500);
  }
  el.addEventListener('mouseenter', () => { clearTimeout(closeTimer); });
  el.addEventListener('mouseleave', () => scheduleClose(depth));
  el.addEventListener('click', e => { const a = e.target.closest('.glopen'); if (a) { e.preventDefault(); openGlossary(a.dataset.k); } });
  target.classList.add('on');
  tips.push(rec);
  return rec;
}
function lock(rec) { rec.locked = true; rec.el.classList.add('locked'); }
function closeTips(fromDepth) {
  // close every tip at depth >= fromDepth, unless a shallower one is locked and this is a hover-leave (handled by caller)
  tips.filter(t => t.depth >= fromDepth).forEach(t => { clearTimeout(t.timer); t.el.remove(); t.target.classList.remove('on'); });
  tips = tips.filter(t => t.depth < fromDepth);
}
function scheduleClose(depth) {
  clearTimeout(closeTimer);
  closeTimer = setTimeout(() => {
    // close from the deepest unlocked tip at or above this depth
    const unlocked = tips.filter(t => t.depth >= depth && !t.locked);
    if (unlocked.length) closeTips(Math.min(...unlocked.map(t => t.depth)));
  }, 220);
}
function depthOf(target) { const p = target.closest('.tip'); return p ? +p.dataset.depth + 1 : 1; }
function onEnter(target) {
  clearTimeout(openTimer); clearTimeout(closeTimer);
  const d = depthOf(target);
  openTimer = setTimeout(() => {
    // one tip per depth: replace any existing tip at this depth or deeper
    closeTips(d);
    tipFor(target, d);
  }, 120);
}
document.addEventListener('mouseover', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.t'); if (t) { clearTimeout(openTimer); scheduleClose(depthOf(t)); } });
document.addEventListener('focusin', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('focusout', e => { const t = e.target.closest('.t'); if (t) scheduleClose(depthOf(t)); });
document.addEventListener('click', e => {
  const t = e.target.closest('.t');
  if (t && t.dataset.t) { e.preventDefault(); openGlossary(t.dataset.t); return; }
  if (!e.target.closest('.tip')) closeTips(1);
});

/* ---- glossary panel ---- */
const kinds = [...new Set(Object.values(G).map(g => g.k))];
let glKind = null, glHist = [];
$('#glCats').innerHTML = `<button data-k="" class="on">all</button>` + kinds.map(k => `<button data-k="${k}">${k}</button>`).join('');
function glRender() {
  const q = $('#glSearch').value.trim().toLowerCase();
  const rows = Object.entries(G).filter(([k, g]) => (!glKind || g.k === glKind) && (!q || g.t.toLowerCase().includes(q) || g.d.toLowerCase().includes(q)))
    .sort((a, b) => a[1].t.localeCompare(b[1].t));
  $('#glList').innerHTML = rows.map(([k, g]) => `<button data-k="${k}"><span>${esc(g.t)}</span><span class="k">${esc(g.k)}</span></button>`).join('') || `<p class="plain" style="font-size:14px">No term matches.</p>`;
  $('#glHist').innerHTML = glHist.length > 1 ? `<button id="glBack">← back (B)</button><span>${glHist.slice(-4).map(k => esc(G[k].t)).join(' · ')}</span>` : '';
}
function glShow(k) {
  const g = G[k]; if (!g) return;
  if (glHist[glHist.length - 1] !== k) glHist.push(k);
  const d = $('#glDetail'); d.hidden = false;
  d.innerHTML = `<h5>${esc(g.t)}</h5><p>${md(g.d)}</p><div class="w">${esc(g.k)} · ${esc(g.w || '')}</div>`;
  glRender();
}
function openGlossary(k) { $('#rail').classList.add('gl'); closeTips(1); if (k) glShow(k); else glRender(); $('#glSearch').focus(); }
function closeGlossary() { $('#rail').classList.remove('gl'); }
$('#glClose').addEventListener('click', closeGlossary);
$('#glSearch').addEventListener('input', glRender);
$('#glCats').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; glKind = b.dataset.k || null; document.querySelectorAll('#glCats button').forEach(x => x.classList.toggle('on', x === b)); glRender(); });
$('#glList').addEventListener('click', e => { const b = e.target.closest('button'); if (b) glShow(b.dataset.k); });
$('#glHist').addEventListener('click', e => { if (e.target.id === 'glBack') { glHist.pop(); const k = glHist.pop(); if (k) glShow(k); else { $('#glDetail').hidden = true; glRender(); } } });

/* ---- theme: auto → light → dark ---- */
/* theme toggle removed 9/11: dark only */

/* ---- keys ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) { if (e.key === 'Escape') { e.target.blur(); closeGlossary(); } return; }
  if (e.key >= '0' && e.key <= '7' && !e.metaKey && !e.ctrlKey && !e.altKey) { go(+e.key); return; }
  if (e.key === 'ArrowRight') { go(cur + 1); return; }
  if (e.key === 'ArrowLeft') { go(cur - 1); return; }
  if (e.key === 'Escape') { if (tips.length) closeTips(1); else closeGlossary(); return; }
  if (e.key === ' ' && tips.length) { e.preventDefault(); lock(tips[tips.length - 1]); return; }
  if (e.key === 'g' || e.key === 'G') { showGlossaryPage(); return; }
  if ((e.key === 'b' || e.key === 'B') && $('#rail').classList.contains('gl')) { const bb = $('#glBack'); if (bb) bb.click(); }
});

go(0); /* every board opens on Block 0: last session first */
</script>

</body>
