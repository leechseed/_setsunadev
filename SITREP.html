<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>SITREP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- the BRIEF colorway (working name) · RULED 2026-09-10: the creator-cases explainer's palette is the default for the boards we keep using; ROSE/WATCH stays with DARKROOM + public-facing work ---- */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --bar: color-mix(in srgb, var(--ink) 22%, transparent);
    --bar-retired: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--ink) 22%, transparent) 4px 6px);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light; /* E-INK: the light face, provisional 9/11 — Kindle gray, never white; shown only when the viewer forces light */
  }
  /* DARK is the only theme (RULED 9/11: "there's only one theme, and that's dark"); the toggle is gone */
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320;
    --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B;
    --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --bar: color-mix(in srgb, var(--ink) 30%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2;
    --panel: #E4E4DE;
    --panel-2: #CBCBC4;
    --ink: #1B1B19;
    --ink-2: #44453F;
    --ink-3: #6B6C65;
    --accent: #E04E18;
    --accent-ink: #A83409;
    --accent-soft: #E9D5CA;
    --link: #A83409;
    --good: #1F6B45;
    --good-soft: #CFE0D3;
    --warn: #5E4F22;
    --warn-soft: #E2D9BE;
    --bad: #962C37;
    --bad-soft: #E6CCCF;
    --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409;
    --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, input:focus-visible, .ol-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }

  .mono { font-family: var(--mono); }
  .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---- concept links (CK3 R1) ---- */
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- app frame ---- */
  .app {
    height: 100vh; display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: 236px minmax(0, 1fr) 316px;
    grid-template-areas: "head head head" "ol panel rail" "foot foot foot";
  }
  header.head {
    grid-area: head; display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--line-2);
    background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px);
  }
  .brand { display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; border-right: 1px solid var(--line); min-width: 236px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
  .brand h1 i { display: inline-block; width: 10px; height: 10px; background: var(--accent); margin-right: 8px; transform: translateY(-2px); }
  .brand .sub { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 4px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 236px; }
  /* the stat strip never wraps: one fixed-height band, tiles scroll sideways, long values ellipsize (Chief 9/16: the top row was stacking and eating the panel) */
  .stats { display: flex; align-items: stretch; flex: 1 1 0; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .stat { display: flex; flex-direction: column; justify-content: center; padding: 6px 16px; border-right: 1px solid var(--line); flex: 1 1 0; min-width: 112px; max-width: 260px; overflow: hidden; }
  .stat b { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b.line { font-family: var(--body); font-weight: 700; font-size: 15px; line-height: 1.2; }
  .stat small { display: block; font-family: var(--mono); font-size: 11px; line-height: 1.3; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat > span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.s-hot b { color: var(--accent); } .stat.s-warn b { color: var(--warn); } .stat.s-bad b { color: var(--bad); } .stat.s-good b { color: var(--good); }
  .box { display: flex; align-items: center; gap: 16px; padding: 0 18px; border-left: 1px solid var(--line); flex: 0 0 auto; white-space: nowrap; }
  .light { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
  .light i { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
  .light.up i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .light small { color: var(--ink-3); }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  a.gloss { text-decoration: none; }
  /* the big SOI button (was glossary; the word retired 9/11) (Chief, 9/10: "a big button I can click on from the sit rep page") */
  .gloss { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 16px; margin-right: 12px; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; border: 2px solid var(--accent); }
  .gloss small { font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; margin-top: 3px; }
  .gloss:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .gloss.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  /* the glossary page view */
  .gsearch { width: 100%; max-width: 520px; font: 16px var(--body); padding: 9px 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); margin-bottom: 6px; }
  .gpage { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 22px; margin-top: 6px; }
  .gent { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .gent .gw { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .gent .gw .t { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; border-bottom-width: 2px; }
  .gent p { margin: 0; font-size: 15.5px; line-height: 1.45; }
  .gent .w { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .ol-row.gl-row { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .effort { grid-column: 1 / -1; display: flex; gap: 22px; align-items: center; height: 34px; padding: 0 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--ink-2); flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .effort > span { flex: 0 0 auto; }
  .effort b { color: var(--bad); font-weight: 500; }
  .effort .k { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px; }
  header.head { flex-wrap: wrap; flex: 0 0 auto; max-height: 118px; overflow: hidden; }
  header.head > .row { display: flex; flex: 1 0 100%; align-items: stretch; height: 82px; min-width: 0; }

  /* ---- outliner · the strand (CK3 R12) ---- */
  nav.ol { grid-area: ol; border-right: 1px solid var(--line-2); padding: 18px 0 18px 0; overflow-y: auto; position: relative; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.ol .lbl { padding: 0 18px 10px; display: block; }
  .ol-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 14px 9px 18px; position: relative; color: var(--ink-2); border-left: 3px solid transparent; }
  .ol-row .node { width: 30px; display: flex; align-items: center; justify-content: center; }
  .ol-row .node i { width: 9px; height: 9px; border: 1.5px solid var(--ink-3); border-radius: 50%; background: var(--bg); position: relative; z-index: 1; }
  .ol-row .name { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .ol-row .id { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); display: block; margin-bottom: 2px; }
  .ol-row .key { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line-2); padding: 1px 5px; }
  .ol-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .ol-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  .ol-row.on .node i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  nav.ol .strand { position: absolute; left: 32.5px; top: 46px; bottom: 30px; width: 1px; background: var(--line-2); }
  nav.ol .foot { padding: 18px 18px 0; font-family: var(--mono); font-size: 11px; color: var(--ink-3); line-height: 1.7; }
  nav.ol .foot b { color: var(--ink-2); font-weight: 500; }

  /* ---- the block panel ---- */
  main.panel { grid-area: panel; overflow-y: auto; padding: 26px 34px 40px; position: relative; }
  .frame { position: relative; padding: 4px 0 0; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 16px; height: 16px; border: 1px solid var(--ink-3); pointer-events: none; }
  .frame::before { top: -6px; left: -14px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -8px; right: -14px; border-left: 0; border-top: 0; }
  .bh { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .bh .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .bh .src { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
  h2.bt { margin: 0 0 12px; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 4.2vw, 52px); line-height: .95; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  p.plain { margin: 0 0 22px; font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }

  .grp { margin-top: 18px; }
  .grp > .lbl { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .grp > .lbl em { font-style: normal; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item.note { background: color-mix(in srgb, var(--bad) 8%, transparent); padding: 12px 14px; margin-top: 12px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ink-3); min-width: 30px; text-align: right; padding-top: 2px; }
  .item .body { min-width: 0; }
  .item .text { font-size: 17px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .item .next { margin-top: 6px; font-size: 15.5px; color: var(--ink-2); display: flex; gap: 8px; }
  .item .next .lbl { padding-top: 4px; white-space: nowrap; color: var(--accent); }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

  /* chips: status carries a glyph + word, never color alone */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr .both { background: linear-gradient(90deg, var(--ink) 50%, var(--orange-soft) 50%); color: var(--orange); border-color: var(--ink); text-shadow: none; }
  .tr span + span { margin-left: -1px; }

  /* deep stacks · single-series ranked bars */
  .bars { margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 34px minmax(180px, 1.1fr) auto minmax(120px, 2fr) 64px 46px minmax(90px, .8fr); gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .bar-row.hd { border-bottom: 1px solid var(--line-2); padding-bottom: 6px; }
  .bar-row .rk { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--ink-3); text-align: right; }
  .bar-row .pj { font-size: 16px; }
  .bar-row .pj.ret { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--bad); }
  .bar-row .track { height: 14px; position: relative; }
  .bar-row .track b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 0 3px 3px 0; min-width: 4px; }
  .bar-row .track b.ret { background: var(--bar-retired); }
  .bar-row .v { font-family: var(--mono); font-size: 13px; text-align: right; }
  .bar-row .c { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; }
  .bar-row .s { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .totals { display: flex; gap: 22px; margin-top: 16px; font-family: var(--mono); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .totals b { font-weight: 500; color: var(--ink); }
  .barhover { pointer-events: none; }

  /* pmcs table */
  table.pmcs { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15.5px; }
  table.pmcs th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.pmcs td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tblwrap { overflow-x: auto; }

  /* blocked · numbered */
  .dec { display: grid; grid-template-columns: 52px 1fr; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .dec .n { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: .9; color: var(--accent); }
  .dec .n.dim { color: var(--ink-3); }
  .dec h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
  .dec .what { margin: 4px 0 0; font-size: 16.5px; }
  .dec .un { margin-top: 6px; font-size: 15px; color: var(--ink-2); display: flex; gap: 8px; }
  .dec .un .lbl { padding-top: 3px; color: var(--good); white-space: nowrap; }

  /* leverage line */
  .lev { margin-top: 18px; padding: 28px 30px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 78ch; }
  .lev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .lev .big { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 6vw, 84px); line-height: .9; text-transform: uppercase; margin: 0 0 16px; }
  .lev .big .t { border-bottom-width: 3px; }
  .lev p { margin: 0; font-size: 18px; line-height: 1.5; }

  /* soi card */
  .soi { margin-top: 10px; display: grid; grid-template-columns: 1fr; }
  .soi .row { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .soi .w { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
  .soi .g { font-size: 16px; color: var(--ink-2); }
  .nouns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .nouns .t { font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
  .nouns .t:hover { border-color: var(--link); }

  /* ---- the context rail · the explainer register ---- */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 20px 20px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 18px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .ctx { display: grid; gap: 14px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 4px; color: var(--accent); }
  .ctx .c p { margin: 0; font-size: 15.5px; line-height: 1.5; }
  .rail .sec { border-top: 1px solid var(--line); padding-top: 14px; }
  .runs { display: grid; gap: 8px; margin-top: 8px; }
  .run { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
  .run i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; animation: pulse 1.6s ease-in-out infinite; }
  .run small { display: block; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }

e\" and \"glossary\" retired · dark is the only theme.", "plan": "The SOI page replaces the in-page glossary once it publishes (Charlie Mike pages, step 4). BOLO 37 moves rulings into a daily loop.", "you": "You clarified FRAGO on your own read of doctrine: the update, never the page.", "next": "Confirm OPORD as the page's word. Name the loop; MINT is the recommendation."}, "soi": [{"k": "sitrep", "w": "sit rep", "g": "The full board, cold start. Spoken, it flushes the [[ready-rack|Ready Rack]] and delivers blocks 0 to VII in fixed order. From 9/10 it also "}, {"k": "oscar-mike", "w": "Oscar Mike", "g": "The close-out, all in one — RULED 9/11 (\"when I say we're Oscar Mike, I wanna close out the session… just one thing\"). Spoken, it ends the s"}, {"k": "how-copy", "w": "how copy?", "g": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one ques"}, {"k": "boresight", "w": "boresight", "g": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X"}, {"k": "bolo", "w": "BOLO", "g": "\"BOLO that\" / \"put that down\": Claude captures the tasking in BOLO.md the turn Chief speaks it. Be On the Lookout, named for the bolas: thro"}, {"k": "ivory-tower", "w": "ivory tower", "g": "Academic mode: published literature only, every claim cited inline, established versus contested marked."}, {"k": "break-break", "w": "break-break", "g": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it."}, {"k": "buttonhook", "w": "buttonhook back", "g": "Close the detour and return to the parked thread unprompted, restating where we were."}, {"k": "run-the-darkroom", "w": "run the darkroom", "g": "Launch [[darkroom|DARKROOM]] in the background, no questions. The garbles black room and dark room read the same."}, {"k": "main-effort", "w": "PRIORITY", "g": "RULED 9/24 on [[brevity|BREVIT
