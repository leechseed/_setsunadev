nd signature discipline written down and practiced — what is denied, to whom, through which channels?", "Do I measure the narrative's effect on the intended audience rather than counting what I put out?", "Do I have rehearsed drills for cognitive and functional disruption — isolate, disable, restore; re-affirm, <span class=\"t\" data-t=\"act\">act</span>, showcase?", "Before every observable action, do I assume global exposure and hostile distortion and weigh second- and third-order effects?", "Do I apply <span class=\"t\" data-t=\"media literacy\">media literacy</span> and check my own biases before acting on <span class=\"t\" data-t=\"information\">information</span>?", "Do I <span class=\"t\" data-t=\"plan\">plan</span> deception and <span class=\"t\" data-t=\"surprise\">surprise</span> as a default rather than an exception?"], "selfcheck_note": "", "application": [{"lead": "Information advantage → the persona account is an information operation (BOLO 24).", "body": "The four functions are the launch checklist. <i>Generate</i>: audience research, the reference set (5 core / 25 wide), screenshots of the register being copied, archived for future use. <i>Preserve</i>: the persona bible and canon, the post archive, the historical record — and recovery when a post contradicts the story. <i>Deny</i>: the operator–persona boundary — metadata, location, timing, device and account hygiene, and the <code>_PRIVATE/</code> gitignore line in a public repo. <i>Project</i>: the posting cadence, the grief season, the actions that make the narrative believable. Planned in combination or not at all."}, {"lead": "Command narrative ≠ commander's intent → the persona bible is the command narrative.", "body": "Who she is, what she does, why she does it — the enduring context that anchors every post, season, and shoot, for both audiences (Papi/Claude internally, followers externally). Each post or season gets its own intent; the <span class=\"t\" data-t=\"command narrative\">command narrative</span> is what all of them nest under. Ultrasin and Bold Venture are the strategic narratives above it."}, {"lead": "Nest, don't invent; credibility is action → the Baddie is an existing narrative.", "body": "Taxonomy already rules Baddie an attitude archetype; the reference account is the register. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> says join the existing story rather than build an unfamiliar one, and back it with visible action. \"Fictional arc mirrors the real arc, believability is the bar\" is the doctrinal credibility rule. The canon-age rail is narrative preservation and legal protection in one line."}, {"lead": "Narrative preservation → expect the say/do gap to be attacked.", "body": "The moment a message goes out, the <span class=\"t\" data-t=\"opponent\">opponent</span> (audience, platform, rival) looks for the contradiction. Consistent proactive messaging across redundant channels; the archive as fact-based evidence; and the setback drill written before launch — transparent, re-affirm, <span class=\"t\" data-t=\"act\">act</span> consistently, showcase the correction. The grief mechanic is a preservation asset only if it is never contradicted."}, {"lead": "Force resiliency → the operator is the target.", "body": "Cognitive disruption (dogpiles, comment brigades, exposure attempts) and functional disruption (account loss, shadow-ban, platform rule change) are the ambushes. Write the action drills before day one: isolate, disable, restore for the account; re-affirm and <span class=\"t\" data-t=\"act\">act</span> for the narrative. Continue posting on intent with degraded capability — <span class=\"t\" data-t=\"tempo\">tempo</span> is resiliency."}, {"lead": "Compressed levels and discipline in the information environment → nothing is local.", "body": "Every post, DM, and repo commit is evaluated for second- and third-order effects and assumed to be globally visible and hostilely distorted. The repo is public: what belongs in <code>_PRIVATE/</code> is a deny decision, made in advance, not after."}, {"lead": "Volume, velocity, value → the posting doctrine.", "body": "Value is judged by contribution to the decision (the follower's conversion), not by volume. Rate, transmission medium, and style of presentation are levers on perception — the medium-grammar layer of the story lattice is where those levers live."}, {"lead": "What MCDP 8 adds to the standard PM flow (BOLO 25).", "body": "An <span class=\"t\" data-t=\"information\">information</span> line in every charter: (1) audiences — internal and external; (2) the narrative, developed at problem framing and nested under the trunk narrative; (3) the deny list — what is protected, from whom, how; (4) the measure of narrative effect with the intended audience; (5) which element of the project is tasked to generate, preserve, deny, or project, and whether an <span class=\"t\" data-t=\"information\">information</span> effect is the <span class=\"t\" data-t=\"main effort\">main effort</span>. A project's public face is a warfighting function of the project, not a <span class=\"t\" data-t=\"communications\">communications</span> afterthought."}], "marks": []}], "register": [{"term": "independent wills", "sense": "the two sides of a conflict, each choosing freely; war is their collision, never one side's plan", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "friction", "sense": "the force that resists every action and makes the simple difficult", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "uncertainty", "sense": "the permanent absence of complete information; the fog of war", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "disorder", "sense": "the breakdown of plans and order that grows as action proceeds", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "certainty", "sense": "full knowledge before acting; unattainable, never a precondition for action", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "positive control", "sense": "directing every action from the top; impossible in war", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "superior tempo", "sense": "operating faster than the enemy, consistently, over time", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "decentralizing decisions", "sense": "pushing decisions down to those who hold the local information", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "subordinates", "sense": "the people who execute; in this doctrine, the decision-makers on the spot", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "act", "sense": "to move on intent without waiting for orders or certainty", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "commander's intent", "sense": "the purpose behind a task; the why that outlasts the what", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "strength", "sense": "combat power, concentrated where it decides", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "critical vulnerabilities", "sense": "the weak points that, struck, damage the enemy's ability to resist the most", "source": "MIL.01", "section": "CORE THESIS"}, {"term": "Zweikampf", "sense": "Clausewitz's two-struggle; war as two wrestlers, force against counterforce", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "force", "sense": "one will's exertion on the other", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "counterforce", "sense": "the opposing will's answer to force", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "plan", "sense": "a scheme of action; in war, always met by a counter-plan", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "counter-plan", "sense": "the enemy's answering scheme; the reason no plan survives contact", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "situation", "sense": "the state of affairs at a moment; produced jointly, owned by neither side", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "continuous mutual adaptation", "sense": "each side changing in response to the other, without end", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "energy", "sense": "the capacity to act, which friction drains", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Self-induced friction", "sense": "friction a force creates for itself: unclear goals, complicated plans, complex organization", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "unclear goals", "sense": "aims not understood by those executing them; a source of self-induced friction", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "complicated plans", "sense": "plans with more parts than friction allows; a source of self-induced friction", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "complex organization", "sense": "structure with too many layers and links; a source of self-induced friction", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "external friction", "sense": "friction from the enemy, terrain, weather, and chance; cannot be eliminated", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "will", "sense": "the moral force that pushes through friction", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "fog of war", "sense": "the atmosphere of uncertainty in which all action takes place", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "structural", "sense": "built into the nature of war; not a defect to be fixed", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Nonlinearity", "sense": "causes and effects out of proportion; small incidents decide outcomes", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "minor incidents", "sense": "small events with outsized effects under nonlinearity", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "decisive effects", "sense": "outcomes that settle the matter", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Judgment", "sense": "estimating possibilities and probabilities under uncertainty", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "possibilities", "sense": "what could happen; judgment's raw material", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "probabilities", "sense": "how likely each possibility is; judgment's estimate", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "communications", "sense": "the links between units; they fail as disorder grows", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "improvisation", "sense": "acting off-plan when the plan has failed; a permanent necessity", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "original scheme", "sense": "the plan as first conceived, from which action drifts", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "commander", "sense": "the one who shapes the general flow and does not control each event", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "influences", "sense": "shapes the flow without controlling it; the commander's real verb", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "general flow", "sense": "the overall direction of events; the most a commander can steer", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "control", "sense": "command of each event; the thing war does not permit", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "event", "sense": "a single occurrence in the flow; not controllable one by one", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Outcomes", "sense": "results, which emerge from many local decisions", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "local decisions", "sense": "choices made on the spot by those present", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "local information", "sense": "what is known where the action is, and nowhere else", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Full centralization", "sense": "one decision-maker for everything; contradicts the nature of war", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "single decisionmaker", "sense": "the top of a fully centralized system; the wrong model", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Material factors", "sense": "forces, equipment, numbers; measurable, less decisive", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "doctrine", "sense": "a shared way of thinking about war; the thing being read", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "effect of fires", "sense": "what firepower does; its greatest effect is moral, not material", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "moral strength", "sense": "the will and cohesion of a force; the true target of fires", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "matériel", "sense": "equipment and supplies; the physical, secondary target", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Military action", "sense": "the use of force; a political instrument", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "political instrument", "sense": "a tool of policy, which is what military action is", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "political aims", "sense": "the ends of policy that military action must serve", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Speed", "sense": "rapidity in time; a weapon", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "weapon", "sense": "anything that generates combat power, including speed", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "focus", "sense": "convergence of effects at the decisive time and place", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "convergence of effects", "sense": "many actions arriving together where it matters", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "prudent risk", "sense": "risk accepted deliberately to achieve focus; economy everywhere else", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Risk", "sense": "exposure to loss; inherent in action and inaction alike", "source": "MIL.01", "section": "INVARIANTS"}, {"term": "Tempo", "sense": "Speed over time — the consistent ability to operate quickly; a weapon measured relative to the enemy", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Surprise", "sense": "A state of disorientation from an unexpected event that degrades the ability to resist; achieved by deception, ambiguity, or stealth", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Boldness", "sense": "Unhesitating exploitation of uncertainty to pursue major rather than marginal results; tempered by judgment", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Center of gravity", "sense": "Any important source of strength — capability, locality, relationship, or moral factor — without which a force cannot function", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Critical vulnerability", "sense": "A vulnerability that, if exploited, does the most significant damage to the enemy's ability to resist; the pathway to a center of gravity", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Maneuver warfare", "sense": "A philosophy that seeks to shatter the enemy's cohesion through rapid, focused, unexpected actions creating a situation with which the enemy cannot cope", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Attrition warfare", "sense": "Victory through cumulative destruction of material by superior firepower; results proportionate to effort", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Mission tactics", "sense": "Assigning a subordinate a mission without specifying how it must be accomplished; a contract between senior and subordinate", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Mission-type order", "sense": "An order to perform a mission without specifying how it is to be accomplished", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Main effort", "sense": "The unit assigned the mission most critical to success at that moment; the focal point of the force's combat power and priority for all support", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Surfaces and gaps", "sense": "Enemy strengths and enemy weaknesses, in space, time, or capability", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Reconnaissance pull", "sense": "Pulling combat power through gaps found by forward units, as opposed to command push from the rear", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Combined arms", "sense": "Integration of arms such that to counter one the enemy must become more vulnerable to another — a dilemma", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Topsight", "sense": "A grasp of how one's own action fits into the larger situation; the bird's-eye view that reveals the whole", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Implicit communication", "sense": "Communication through mutual understanding using a minimum of key, well-understood phrases; built on shared philosophy and shared experience", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Culminating point", "sense": "The point at which an offense can no longer sustain itself and must revert to the defense", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Shaping", "sense": "Lethal and nonlethal actions that set the general conditions of war to advantage before the decisive moment", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Zero-defects mentality", "sense": "Punishing errors of boldness so that initiative is stifled; expressly prohibited", "source": "MIL.01", "section": "KEY VOCABULARY (author)"}, {"term": "Politics", "sense": "The process by which power is distributed in any society; interactive, competitive or cooperative, not rational in outcome", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Policy", "sense": "The conscious, reasoned use of power to accomplish a purpose; a rational subcomponent of politics, produced through politics", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Strategy", "sense": "The process of interrelating ends and means, and the product — a specific way of using specified means to achieve distinct ends", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "National strategy", "sense": "Developing and using all instruments of national power, in peace and war, to secure the objectives of policy (also grand strategy, national security strategy)", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Military strategy", "sense": "Employing armed forces to secure the objectives of national policy by force or the threat of force; subordinate to national strategy", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Instruments of national power", "sense": "Diplomatic, economic, military, informational (DIME)", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Vital interests", "sense": "Interests a nation will not compromise and will fight for", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Survival", "sense": "Continued existence of the political entity at war; the minimum goal and prerequisite for victory", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Victory", "sense": "Achievement of the political aims plus an end to the war; may mean only ending on less unfavorable terms", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Limited political objective", "sense": "The enemy leadership survives and remains in power, with some of its power reduced", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Unlimited political objective", "sense": "The enemy leadership is removed as a political entity", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Strategy of annihilation", "sense": "Eliminating the enemy's military capacity to resist; incapacitation, not necessarily physical destruction", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Strategy of erosion", "sense": "Raising the enemy leadership's costs until settling is preferable to continuing; the classical \"strategy of attrition\"", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Center of gravity (strategic)", "sense": "A key source of enemy strength — forces, a capital, a population, a leader, public support", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Critical vulnerability", "sense": "A weakness that (1) significantly undermines a center of gravity and (2) we have the means to exploit", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Strategic concept", "sense": "The course of action accepted from the strategic estimate; the clear, compelling basis for all subsequent planning", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Balance of power", "sense": "A mechanism of shifting alliances that keeps any one entity from dominance; a strategic constant at every level", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Culminating point of victory", "sense": "The point at which one competitor's success prompts allies and others to withdraw support or turn against it", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Symmetrical / asymmetrical", "sense": "Matching the enemy strength for strength vs. applying a category of means to which the enemy cannot respond in kind", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Deterrence by denial / reprisal", "sense": "Convincing the enemy the action will fail vs. convincing the enemy the cost will exceed the gain", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Standardized / tailored strategy", "sense": "A pattern response to a recognized problem type vs. a response fitted to the specific problem", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Strategy by default", "sense": "A strategy dictated by circumstance, ideology, or unconscious assumption rather than rational consideration", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Fait accompli", "sense": "An action whose political and military goals are identical and achieved in one blow, presenting an accomplished fact", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "The trinity", "sense": "Clausewitz's three tendencies — primordial violence and emotion, chance and probability, subordination to reason — always all at work", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Complex adaptive system", "sense": "A system whose members co-evolve and generate their own rules; constrained but not determined by external factors; inherently unpredictable", "source": "MIL.02", "section": "KEY VOCABULARY (author)"}, {"term": "Campaign", "sense": "A series of related military operations aimed at a strategic or operational objective within a given time and space", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Campaign plan", "sense": "The concise statement of design describing how time, space, and purpose connect the operations, leading to a well-defined end state", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Operational level of war", "sense": "The level that links strategy and tactics; the use of tactical results to attain strategic objectives; the art of winning campaigns", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Military strategic aim", "sense": "The political effect military forces must achieve, translated into military terms; the starting point of campaign design", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Restraints / constraints", "sense": "Restraints prohibit or restrict actions; constraints obligate the commander to certain courses of action", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Battle / engagement", "sense": "A battle is a series of related tactical engagements for a significant objective; an engagement is a small tactical conflict", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Strategy of annihilation", "sense": "Eliminating the enemy's capacity to resist; military forces are the main effort; victory easily measured", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Strategy of erosion", "sense": "Raising the enemy leadership's costs above what they will pay; main effort variable; victory flexibly defined", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Strategic center of gravity", "sense": "An objective whose seizure, destruction, or neutralization profoundly affects the enemy leadership's will or ability to continue", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Operational center of gravity", "sense": "The concentration of enemy military power most dangerous to us or standing between us and the strategic mission", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Critical vulnerability", "sense": "A weakness that undermines a key strength and that we are capable of attacking effectively; may have to be created", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Campaign concept", "sense": "The single unifying idea of the campaign — what and how — with intent explicitly stated", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Phase", "sense": "A natural, event-driven subdivision of the campaign with its own intermediate goal and intent", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Branch / sequel", "sense": "A branch is an option at a decision point; a sequel is the follow-up action to a given outcome", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Forward and backward planning", "sense": "Envisioning phases from the present toward the end state and from the end state back to the present; the two must mesh", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Logistical culmination", "sense": "The point at which resources can no longer sustain the force; may force sequential phasing", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Conceptual / functional / detailed planning", "sense": "Broad scheme → supporting concepts for each warfighting function → specific coordination", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "End state", "sense": "The acceptable political and military condition whose achievement justifies terminating combat operations", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Conflict termination", "sense": "The planned suspension or end of combat, including disengagement, transition, and reconstitution", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Reconstitution", "sense": "Restoring units to required readiness through reorganization (internal shifts) or regeneration (large-scale replacement)", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Operational tempo", "sense": "The pace of events between engagements; relative to the enemy", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Operational surprise", "sense": "Catching the enemy unprepared in a way that affects the campaign, with or without tactical surprise", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Warfighting functions", "sense": "Command and control, maneuver, fires, intelligence, logistics, force protection — harmonized for synergy", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Shaping", "sense": "Influencing events to change the general conditions decisively to our advantage before the decisive action", "source": "MIL.03", "section": "KEY VOCABULARY (author)"}, {"term": "Tactics", "sense": "The art and science of winning engagements and battles — creative employment of combat power (art) resting on mastered techniques and procedures (science)", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Combat power", "sense": "The total destructive and disruptive force a unit can apply against the opponent at a given time — physical, moral, and mental factors combined", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Decision (decisive)", "sense": "A battle or engagement whose result leads directly to larger success in the campaign or war; the opposite of incremental gain", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Military judgment", "sense": "The developed ability to understand a situation and act decisively; honed by experience, education, and practice", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Pattern recognition / coup d'oeil", "sense": "Grasping the true significance of a situation from limited information — \"stroke of the eye,\" tactical sense", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Critical vulnerability", "sense": "A vulnerability whose exploitation destroys a capability without which the enemy cannot function effectively", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Shaping", "sense": "Lethal and nonlethal actions that make the enemy vulnerable, dictate the time and place of battle, and preserve multiple friendly options", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Main effort", "sense": "The unit assigned the mission most critical to success at that moment; the focal point of the force's combat power and support", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Economy of force", "sense": "Making effective use of every asset — forces not directly supporting the main effort support it indirectly", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Combined arms", "sense": "Integrating arms so that any action the enemy takes to avoid one threat increases vulnerability to another — a dilemma, not a problem", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Cheng / Ch'i", "sense": "Sun Tzu: the direct, fixing action / the unexpected, extraordinary action that bids for decision; interchangeable in battle", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Trapping", "sense": "Destroying the enemy's ability to think through a dilemma, as opposed to pushing him off ground he retakes tomorrow", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Ambush mentality", "sense": "Turning every situation into an ambush: surprise, lure, invisibility, shock, focus on the enemy", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Tempo", "sense": "Speed plus timing — generating and maintaining a fast pace when it counts and recovering when it does not hurt", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Friction point", "sense": "A transition in time and space — formation to formation, posture to posture — where tempo is lost or preserved", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "OODA loop", "sense": "Boyd's observation–orientation–decision–action cycle; conflict as time-competitive cycles, maneuver as being consistently faster", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Mission tactics", "sense": "Assigning a mission and its purpose without specifying how it is to be accomplished", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Commander's intent", "sense": "The purpose behind the task, enabling subordinates to adapt without diffusion of effort", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Implicit communication", "sense": "Mutual understanding requiring little or no talk — faster and more reliable than explicit communication", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Branch / Sequel", "sense": "Branch: an option within the current operation for changing conditions. Sequel: the course of action following a probable outcome", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Coupling", "sense": "The degree to which parts of a plan depend on each other; loosely coupled plans change without cascading", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Reserve", "sense": "Combat power initially withheld to influence future action — the tool for clinching victory or averting crisis", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Consolidation / Exploitation / Pursuit", "sense": "Protect the gain / disorganize the enemy in depth / catch and destroy a force attempting to escape", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Cooperation", "sense": "The union of self-discipline and initiative in pursuit of a common goal; the component of control that survives chaos", "source": "MIL.04", "section": "KEY VOCABULARY (author)"}, {"term": "Intelligence", "sense": "Knowledge about the enemy and the surrounding environment needed to support decisionmaking; the analysis and synthesis of information into knowledge", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Information", "sense": "Unevaluated material of any kind — the raw material from which intelligence is derived", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Counterintelligence", "sense": "Active and passive measures denying the enemy knowledge of the friendly situation; countering espionage, subversion, terrorism", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Basic intelligence", "sense": "Background knowledge of established, slowly changing conditions — most reliable, least time-sensitive, rarely decisive", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Current intelligence", "sense": "Description of the existing situation — more specific, less reliable, harder to obtain", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Estimative intelligence", "sense": "Anticipation of possible and probable futures — the most important and least reliable class", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Capabilities / Intentions", "sense": "What the enemy can do (rests on facts) / what he will do (exists in his mind); capabilities bound intentions", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Signals / Noise", "sense": "Information that yields insight when interpreted / information that is false, stale, ambiguous, or irrelevant", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Mindset", "sense": "The set of assumptions, biases, and preconceptions that filters signal from noise — indispensable and hazardous", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Intelligence requirement", "sense": "A question about the enemy or environment whose answer the commander needs to decide soundly — a gap", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Priority intelligence requirement (PIR)", "sense": "An intelligence requirement tied to a decision that critically affects mission success; the commander's guidance to the effort", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Intelligence cycle", "sense": "Planning and direction → collection → processing and exploitation → production → dissemination → utilization", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Production / Synthesis", "sense": "Converting processed information into intelligence — evaluate, analyze, integrate, interpret; the step that creates meaning", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Push / Pull", "sense": "Dissemination direct to users / dissemination to an accessible base users draw from", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Indications and warnings", "sense": "Alarms of potential hostile action running counter to planning assumptions", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Combat assessment", "sense": "Determining the effects of friendly action on the enemy; links utilization back to direction", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Immediate production", "sense": "Disseminating critical, time-sensitive information before full analysis — production decentralized to the unit that has it", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Alarm channel", "sense": "Lateral or diagonal dissemination outside the hierarchical pipeline, to whoever needs it most", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "\"In red ink\"", "sense": "The intelligence officer as operator working from the enemy's perspective", "source": "MIL.05", "section": "KEY VOCABULARY (author)"}, {"term": "Expedition", "sense": "A military operation by an armed force to accomplish a specific objective in a foreign country", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Expeditionary mindset / \"bags packed\"", "sense": "Readiness and willingness to deploy on a moment's notice, anywhere, for any mission, with a Spartan acceptance of austerity", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Disaster / Disruption / Dispute", "sense": "Mass-suffering calamity / intentional disorder interfering with government / open clash between political groups — the three crisis classes and their escalation ladder", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Fragmegration", "sense": "Simultaneous political fragmentation and economic integration producing a tightly coupled, disruption-sensitive global system", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Littoral", "sense": "Where land and sea meet — home to most population, trade, growth, and conflict", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Closure rate", "sense": "How quickly a force can close on an objective area once tasked", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Reach", "sense": "The geographic limits to which a force can deploy and sustain credible power", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Strategic / Operational / Tactical mobility", "sense": "Theater to theater / between engagements within a theater / in combat", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Forcible entry", "sense": "Introduction of forces in the face of organized, armed resistance; seizing a lodgment by combat", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Entry / Enabling actions / Decisive actions", "sense": "Initial introduction onto foreign soil / preparatory actions that set the stage / actions that accomplish the political objective", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Exit strategy", "sense": "The planned redeployment that maintains the desired political situation — decided at entry", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Sustainability", "sense": "The ability to maintain the necessary level and duration of operational activity to achieve objectives", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Reconstitution", "sense": "Regenerating, reorganizing, replenishing, and reorienting for a new mission from the forward position without returning to home base", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Improvisation / Innovation", "sense": "An untested response to a specific unexpected condition / the systematic adoption of new methods, often an improvisation that proved general", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "MAGTF", "sense": "Marine air-ground task force — command, ground combat, aviation combat, and combat service support elements, task-organized", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "MEF / MEU(SOC) / SPMAGTF", "sense": "Principal warfighting organization (60 days) / standard forward-deployed unit (15 days) / narrow-mission force", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Rheostat", "sense": "The sea-based MAGTF's ability to vary the composition, scope, and size of force phased ashore", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Sea basing", "sense": "Keeping fires, command and control, aviation, and logistics afloat to shrink the footprint ashore and enlarge freedom of action", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Operational Maneuver from the Sea", "sense": "Capstone concept: using the sea to maneuver against an operational objective, striking weakness at the time and place of our choosing", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Ship-to-objective maneuver", "sense": "Fusing the ship-to-shore movement and subsequent operations into one decisive maneuver, skipping the beachhead buildup", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Maritime prepositioning force", "sense": "Prepositioned shipping plus a fly-in echelon — rapid assembly of a MAGTF in a forward area", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "MOOTW", "sense": "Military operations other than war — the use of military capability short of war, politically constrained", "source": "MIL.06", "section": "KEY VOCABULARY (author)"}, {"term": "Logistics", "sense": "Planning and executing the movement and support of forces; the bridge between a nation's economy and its combat forces", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Sustainment", "sense": "The broader category: provision of logistics and personnel services to maintain and prolong operations until mission accomplishment and redeployment", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Culminating point", "sense": "The point at which a force can no longer sustain the attack and reverts to defense; set by logistics", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Responsiveness", "sense": "Right support, right place, right time; the keystone principle", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Attainability", "sense": "The commander's judgment that sufficient supplies and support exist to initiate operations at acceptable risk", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Logistics visibility", "sense": "Processed, analyzed awareness of demand (need vs. concept of operations) and supply (available resources)", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Supply chain / supply web", "sense": "Single efficient linear network that fails when blocked / redundant multi-path network that resists blockage at higher cost", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Push / pull", "sense": "Scheduled delivery from forecast / delivery on request from actual consumption", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Logistics snowball effect", "sense": "Cumulative false demand from padded requirements that undercuts prioritization", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Hybrid logistics", "sense": "Blending old, new, and emerging means; modular capability tailored to a distributed force", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Setting the theater", "sense": "Operational-level shaping: distribution network, force posture, forward provisioning before conflict", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Concept of support", "sense": "The integrated plan for how every logistics function supports every warfighting function", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Distribution node", "sense": "Any place where people or materiel are stored, reconfigured, or await movement; caches to sea bases", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Self-sufficiency / dependency", "sense": "Ends of the sustainment spectrum; forces blend them by mission and area", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Warfighting functions", "sense": "Command and control, intelligence, fires, maneuver, force protection, information, logistics", "source": "MIL.07", "section": "KEY VOCABULARY (author)"}, {"term": "Planning", "sense": "The art and science of envisioning a desired future and laying out effective ways of bringing it about; thinking before doing", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Plan", "sense": "Any product of planning; an interim configuration of actions in time and space, always subject to revision; the basis for action, cooperation, and adaptation", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Process vs. procedure", "sense": "A dynamic system of related activities vs. a prescribed sequence of steps; planning is the former", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Conceptual / functional / detailed planning", "sense": "Aims, intent, and broad concepts (art) / supporting plans by function / specifics of execution (science)", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Commitment / contingency / orientation planning", "sense": "Modes by uncertainty: commit resources to one plan / prepare several without committing / assess and design flexibility only", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Planning horizon", "sense": "How far into the future planning tries to shape events; commitment, contingency, and orientation horizons run concurrently", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Decision planning / execution planning", "sense": "Planning before the decision (generate and evaluate courses) / after it (translate into an executable directive)", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Deliberate / rapid planning", "sense": "Well in advance on assumptions / time-sensitive on current conditions; rapid revises deliberate", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Forward / reverse planning", "sense": "From present toward next feasible step / from end state back toward present", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Tight / loose coupling", "sense": "Close, time-dependent interaction between plan elements / independent, asynchronous elements; integrated vs. modular", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Control process", "sense": "The plan component that supervises execution: coordination measures, feedback mechanisms, decision points", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Decision point", "sense": "A designed point in execution requiring a decision about how to proceed", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Branches and sequels", "sense": "Planned alternatives within a phase / planned follow-on phases for likely contingencies", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Directive", "sense": "Any communication establishing policy or ordering action; plans (conditional) and orders (obligation to execute)", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Warning order / fragmentary order", "sense": "Preliminary notice to begin preparation / abbreviated order that avoids restating the base order", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Commander's intent", "sense": "The purpose behind the mission; brief, unambiguous, compelling; drafted by the commander personally", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Anticipatory adaptation / improvisation", "sense": "Adapting in advance through planning / adapting in real time from the plan as point of departure", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "General vs. vague goal", "sense": "Few criteria with broad latitude, good / no usable criteria for success, bad", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Simple vs. simplistic", "sense": "As simple as the situation allows / made simple by ignoring the situation's real complications", "source": "MIL.08", "section": "KEY VOCABULARY (author)"}, {"term": "Command", "sense": "The exercise of authority: deciding what needs to be done and directing or influencing the conduct of others", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Control", "sense": "Feedback — the continuous flow of information about the unfolding situation returning to the commander, showing the gap between goal and reality", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Command and control", "sense": "As a noun, a system of people, information, and support structure; as a verb, the process by which a commander recognizes what needs to be done and sees that it is done", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Feedback", "sense": "The mechanism by which the whole system adapts; may come from any direction and in any form", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "OODA loop", "sense": "Observe–orient–decide–act; the continuous, cyclic command and control process; tempo advantage compounds", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Tempo", "sense": "Speed of the decision-action cycle relative to the opponent", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Uncertainty", "sense": "What is not known about the situation; doubt that blocks or threatens to block action; a byproduct of war", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Raw data / processed data / knowledge / understanding", "sense": "The information hierarchy: signals → formatted form → evaluated and integrated meaning → synthesized situational awareness", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Situational awareness", "sense": "Understanding applied to the situation; the basis for decision", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Image", "sense": "The embodiment of understanding of a situation; the form in which people think, understand, and are inspired", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Coup d'oeil", "sense": "\"Stroke of the eye\"; the gifted commander's intuitive grasp of the situation through the fog", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Topsight", "sense": "The big-picture grasp of how the parts fit together, from a far-overhead vantage", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Directed telescope", "sense": "A dedicated observer or sensor reporting directly to the commander to bypass distortion and delay; augments, never replaces, the chain", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Detailed command and control", "sense": "Certainty-seeking, centralized, coercive, explicit, vertical, slow, brittle", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Mission command and control", "sense": "Uncertainty-accepting, decentralized, spontaneous, implicit, lateral, fast, robust", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Mission tactics", "sense": "Assigning a mission and explaining intent, leaving the subordinate free to choose the manner of accomplishment", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Commander's intent", "sense": "The desired result of the action; the enduring half of a mission; predominant over the task", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Implicit communication", "sense": "Mutual understanding and cooperation with minimal information transmitted, from shared experience and common outlook", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Supply-push / demand-pull", "sense": "Information sent as available or scheduled / information sent on request", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Demand cascade", "sense": "A pull request filtering down the chain until it reaches the echelon that can gather it", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Broadcast / point-to-point", "sense": "Simultaneous transmission to a wide audience / sequential transmission to specific users, filtered at each node", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Satisficing", "sense": "Selecting the first solution that satisfactorily solves the problem rather than optimizing", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Intuitive / analytical decision-making", "sense": "Pattern recognition and situation assessment / concurrent comparison of multiple options against criteria", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Span of control", "sense": "Number of subordinates under one commander; three to seven as a rule of thumb", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Unity of command", "sense": "A given mission falls under one commander who receives orders from one superior", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Command and control support structure", "sense": "Organizations, procedures, equipment, facilities, training, education, doctrine that aid the people; not the system itself", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Complex system", "sense": "Multiple parts each acting on its own circumstances and thereby changing the circumstances of all the others; nonlinear, open, organic", "source": "MIL.09", "section": "KEY VOCABULARY (author)"}, {"term": "Learning", "sense": "Developing knowledge, skills, and attitudes through study, experience, or instruction; includes both training and education", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Training", "sense": "Learning-by-doing; prepares for the known factors of war", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Education", "sense": "Study and intellectual development; prepares for the unknown factors of war", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Competence", "sense": "Sufficient knowledge, judgment, and skills to perform a particular duty, job, or function", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Intellectual edge", "sense": "Developed knowledge and experience that lets Marines recognize cues, make sense of information, and respond faster than the enemy", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "OODA loop", "sense": "Observe–orient–decide–act; the decision cycle maneuver warfare seeks to run faster than the enemy's", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Bias for action", "sense": "The disposition to decide and act within commander's intent without waiting to be told", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Learning friction", "sense": "Lack of self-awareness, emotional regulation, humility, time management, or bias — the forces that make learning harder than it looks", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Intrinsic / extrinsic feedback", "sense": "Feedback from your own perception vs. feedback from an external source (instructor, peer, data)", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Adaptability", "sense": "The quality of adjusting to new conditions; learning is itself a form of adaptive behavior", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Vicarious experience", "sense": "Learning obtained by observing, reading, and studying what others experienced", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Mental imagery", "sense": "Visualization used to rehearse decisions, explore branches and sequels, and gain confidence before execution", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Growth / fixed mindset", "sense": "Belief that effort changes one's qualities vs. belief that qualities are innate; the first seeks feedback, the second avoids it", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Intrinsic motivation", "sense": "Engagement driven by internal reward; cultivated by attributing success to preparation, effort, persistence, practice", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Surfaces and gaps (learner)", "sense": "Areas of existing understanding vs. weaknesses in knowledge, experience, or competency", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Main effort (learner)", "sense": "The learner is the focus of effort; leaders and instructors are in support", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Self-directed learning", "sense": "Taking the initiative to identify learning needs, set goals, pursue them, and evaluate outcomes", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Mission tactics", "sense": "Assigning a mission without specifying how it must be accomplished; the model for self-directed learning", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Diagnostic / formative / summative assessment", "sense": "Before / during / after a learning activity; all are feedback tools, not scores", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Coach–teach–mentor", "sense": "The instructional posture that delivers constructive feedback", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Brilliance in the basics", "sense": "Technical and tactical proficiency in fundamentals; the foundation of mastery", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Negative training", "sense": "Incorrect or unfocused practice that transfers bad habits to the battlespace", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Foot-locker education", "sense": "Small-unit leaders and tested veterans teaching their people directly — where the greatest lessons pass", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Metacognition", "sense": "Awareness and understanding of one's own thought processes", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Andragogy", "sense": "Adult learning methods, techniques, and principles", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Learning organization", "sense": "Develops new ideas, tests them, learns from success and failure, and assumes what worked before may not work next", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Warrior-scholar", "sense": "A Marine who seizes the initiative to study the profession whenever and wherever the opportunity arises", "source": "MIL.10", "section": "KEY VOCABULARY (author)"}, {"term": "Information environment", "sense": "The global competitive space spanning the warfighting domains where all operations depend on information, including all social, cultural, psychological, technical, and physical factors bearing on decisions", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Information advantage", "sense": "An exploitable condition resulting from one actor's ability to generate, preserve, deny, and project information more effectively than another", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Information warfighting function", "sense": "The grouping of activities whose purpose is to create and exploit information advantages in pursuit of mission objectives", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Systems overmatch", "sense": "Technical advantage of one side over another, yielding fires, intelligence, maneuver, logistics, force protection, or command and control advantages", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Prevailing narrative", "sense": "The narrative that is credible and resonates most with the intended audience; a public opinion or perception advantage", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Force resiliency", "sense": "The ability to resist, counter, and prevail against reconnaissance, technical disruption, and malign activity such as misinformation, disinformation, and propaganda", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Information generation", "sense": "Gaining access, building awareness of threats and opportunities, holding systems at risk, creating the information needed to plan and operate", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Information preservation", "sense": "Protecting and defending information, systems, networks, the historical record, and the narrative against internal and external threats", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Information denial", "sense": "Disrupting, destroying, or concealing the information the opponent needs to understand, decide, or act in coordination", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Information projection", "sense": "Communicating, transmitting, or delivering information of any type to inform, influence, or deceive an observer or targeted system", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Informational power", "sense": "The use of information, narratives, and technical means to advance interests and achieve objectives", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Competition continuum", "sense": "The constant interaction between competitors spanning every action below and above the threshold of armed conflict; war is a form of violent competition", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Opponent", "sense": "Any actual or potential competitor, adversary, or enemy at any point on the competition continuum", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Misinformation / disinformation", "sense": "False information without deliberate intent to harm / false information deliberately intended to cause harm or create an effect", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Thinking / non-thinking processes", "sense": "Human perception, cognition, decision, behavior / pre-programmed, hard-wired, or algorithmic processing", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Cognitive / functional component", "sense": "The human (operator) aspect of an objective / the system's ability to function — each exploitable directly or indirectly", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Direct / indirect approach", "sense": "Strength against strength (attrition) / strength against critical vulnerability (maneuver)", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Command narrative", "sense": "The story that anchors all of a unit's public communication, exercises, and operations; broader than commander's intent; for internal and external audiences", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Nesting", "sense": "Aligning a command narrative under higher, joint, and strategic narratives, and inside existing cultural narratives", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Signature management", "sense": "Selectively altering or suppressing visual, electromagnetic, administrative, and digital emanations — a passive form of denial", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Reflexive control", "sense": "An information-centric theory of manipulating perception to create confusion, paralysis, or a chosen behavior in the opponent", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Three Warfares", "sense": "China's approach to competition: public opinion/media warfare, psychological warfare, legal warfare — to control the narrative", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Volume / velocity / value", "sense": "Quantity of information / speed and direction of its movement (volume against bandwidth and noise) / contribution to the decision at hand", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}, {"term": "Media literacy", "sense": "Critical distinction between primary source, news, commentary, manipulated media, parody, satire, and opinion; a force-resiliency skill", "source": "MIL.11", "section": "KEY VOCABULARY (author)"}], "terms": {"independent wills": {"term": "independent wills", "senses": [{"sense": "the two sides of a conflict, each choosing freely; war is their collision, never one side's <span class=\"t\" data-t=\"plan\">plan</span>", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01", "MIL.09"]}, "friction": {"term": "friction", "senses": [{"sense": "the <span class=\"t\" data-t=\"force\">force</span> that resists every action and makes the simple difficult", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}, {"sense": "The <span class=\"t\" data-t=\"force\">force</span> that resists all action and saps <span class=\"t\" data-t=\"energy\">energy</span>; external (enemy, terrain, chance) or self-induced (<span class=\"t\" data-t=\"unclear goals\">unclear goals</span>, <span class=\"t\" data-t=\"complicated plans\">complicated plans</span>, <span class=\"t\" data-t=\"complex organization\">complex organization</span>)", "source": "MIL.01", "section": "KEY VOCABULARY", "kind": "author"}], "appears": ["MIL.01", "MIL.04", "MIL.08", "MIL.10", "MIL.11"]}, "uncertainty": {"term": "uncertainty", "senses": [{"sense": "the permanent absence of complete <span class=\"t\" data-t=\"information\">information</span>; the <span class=\"t\" data-t=\"fog of war\">fog of war</span>", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}, {"sense": "What is not known about the <span class=\"t\" data-t=\"situation\">situation</span>; doubt that blocks or threatens to block action; a byproduct of war", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.05", "MIL.08", "MIL.09", "MIL.11"]}, "disorder": {"term": "disorder", "senses": [{"sense": "the breakdown of <span class=\"t\" data-t=\"plan\">plans</span> and order that grows as action proceeds", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01", "MIL.06", "MIL.09"]}, "certainty": {"term": "certainty", "senses": [{"sense": "full knowledge before acting; unattainable, never a precondition for action", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01", "MIL.03", "MIL.05", "MIL.09"]}, "positive control": {"term": "positive control", "senses": [{"sense": "directing every action from the top; impossible in war", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01"]}, "superior tempo": {"term": "superior tempo", "senses": [{"sense": "operating faster than the enemy, consistently, over time", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01"]}, "decentralizing decisions": {"term": "decentralizing decisions", "senses": [{"sense": "pushing decisions down to those who hold the <span class=\"t\" data-t=\"local information\">local information</span>", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01"]}, "subordinates": {"term": "subordinates", "senses": [{"sense": "the people who execute; in this <span class=\"t\" data-t=\"doctrine\">doctrine</span>, the decision-makers on the spot", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01", "MIL.04", "MIL.08", "MIL.09", "MIL.10"]}, "act": {"term": "act", "senses": [{"sense": "to move on intent without waiting for orders or <span class=\"t\" data-t=\"certainty\">certainty</span>", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}], "appears": ["MIL.01", "MIL.02", "MIL.04", "MIL.05", "MIL.08", "MIL.09", "MIL.10", "MIL.11"]}, "commander's intent": {"term": "commander's intent", "senses": [{"sense": "the purpose behind a task; the why that outlasts the what", "source": "MIL.01", "section": "CORE THESIS", "kind": "reader"}, {"sense": "The purpose behind the task, enabling <span class=\"t\" data-t=\"subordinates\">subordinates</span> to adapt without diffusion of effort", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "The purpose behind the mission; brief, unambiguous, compelling; drafted by the <span class=\"t\" data-t=\"commander\">commander</span> personally", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "The desired result of the action; the enduring half of a mission; predominant over the task", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "The purpose behind a task; the \"why\" that outlasts the \"what\" and permits initiative in harmony with the <span class=\"t\" data-t=\"co
