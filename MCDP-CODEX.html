ation\" as the <span class=\"t\" data-t=\"plan\">plan</span>'s highest value, \"wait out\" as an answer to a subordinate whose task is obsolete, micromanaging because the technology permits it, pure broadcast (overload) or pure demand-pull (delay), reports filtered through many echelons and trusted for their display quality, <span class=\"t\" data-t=\"directed telescope\">directed telescopes</span> that spy on <span class=\"t\" data-t=\"subordinates\">subordinates</span>, procedures applied to <span class=\"t\" data-t=\"judgment\">judgment</span> tasks, elaborate <span class=\"t\" data-t=\"planning\">planning</span> models compressed under time pressure, zero-defects cultures, <span class=\"t\" data-t=\"commander\">commanders</span> imprisoned in the <span class=\"t\" data-t=\"command\">command</span> post, staffs grown to process the <span class=\"t\" data-t=\"information\">information</span> that growing them demands, equipment that encourages micromanagement or replaces the person who can think with the machine that cannot, <span class=\"t\" data-t=\"planning\">planning</span> as scripting.", "selfcheck": ["Have I stated the intent, made it predominant, and made it brief enough for <span class=\"t\" data-t=\"subordinates\">subordinates</span> to hold in mind?", "Am I treating <span class=\"t\" data-t=\"feedback\">feedback</span> — the <span class=\"t\" data-t=\"situation\">situation</span> report, the readback, the status of the action — as the <span class=\"t\" data-t=\"control\">control</span> mechanism, rather than my <span class=\"t\" data-t=\"directive\">directives</span>?", "Am I deciding on what I know, at acceptable <span class=\"t\" data-t=\"risk\">risk</span>, faster than the <span class=\"t\" data-t=\"opponent\">opponent</span> — or waiting for <span class=\"t\" data-t=\"certainty\">certainty</span>?", "Is <span class=\"t\" data-t=\"information\">information</span> reaching me as understanding and <span class=\"t\" data-t=\"image\">images</span>, not data volume?", "Have I pushed the decision to the lowest level that has the direct observation to make it?", "Do my <span class=\"t\" data-t=\"subordinates\">subordinates</span> and staff have the trust and latitude to <span class=\"t\" data-t=\"act\">act</span> on intent when the task is overcome by <span class=\"t\" data-t=\"event\">events</span>?", "Am I using intuitive decision-making as the norm and analysis where time and computation demand it?", "Is my <span class=\"t\" data-t=\"information\">information</span> system a hybrid — routine pushed to a local base I pull from, critical items pushed direct?", "Am I where the critical <span class=\"t\" data-t=\"image\">image</span> is, with the staff empowered to <span class=\"t\" data-t=\"act\">act</span> while I am there?", "Do I tolerate mistakes of action and refuse to tolerate inaction?", "Have I resisted micromanaging where the tools would let me?", "Is the whole system helping me <span class=\"t\" data-t=\"act\">act</span> faster and more effectively than the <span class=\"t\" data-t=\"opponent\">opponent</span>?"], "selfcheck_note": "", "application": [{"lead": "Control is feedback → the sit rep is the control mechanism.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span> inverts the intuition that the <span class=\"t\" data-t=\"commander\">commander</span> <span class=\"t\" data-t=\"control\">controls</span> by issuing orders. <span class=\"t\" data-t=\"control\">Control</span> is the <span class=\"t\" data-t=\"information\">information</span> returning about the <span class=\"t\" data-t=\"situation\">situation</span> — so <i>sit rep</i> is not a report the AI partner owes the operator; it is the mechanism by which the whole operation comes under <span class=\"t\" data-t=\"control\">control</span>. Its content standard is the <span class=\"t\" data-t=\"information\">information</span> hierarchy: the partner moves <span class=\"t\" data-t=\"information\">information</span> as far up as it can — filter, fuse, prioritize into understanding and <span class=\"t\" data-t=\"image\">images</span> (\"paint me a picture\"), never a data dump — and stops short of the <span class=\"t\" data-t=\"judgment\">judgment</span> only the <span class=\"t\" data-t=\"commander\">commander</span> can make. Blocks 0 and IV exist to show the gap between the goal and the <span class=\"t\" data-t=\"situation\">situation</span> as it exists."}, {"lead": "How copy → explicit feedback that closes the loop.", "body": "<span class=\"t\" data-t=\"feedback\">Feedback</span> \"provides the means to improve and confirm mutual understanding.\" The readback after <i>how copy?</i> is the operator verifying the partner's <span class=\"t\" data-t=\"image\">image</span> matches the intent before execution consumes time. It is explicit communication used deliberately while implicit understanding is still being built — and the goal over time is for it to shorten as shared context accumulates."}, {"lead": "Boresight → implicit understanding before execution.", "body": "\"Mutual understanding with minimal <span class=\"t\" data-t=\"information\">information</span> exchange\" is the product of common ethos and repeated practice. Boresighting the partner — canonical docs, SOP, STATE.md, MEMORY — is building the shared <span class=\"t\" data-t=\"image\">image</span> so that during execution \"a key phrase or a slight gesture can sometimes communicate more than a detailed order.\" Prowords themselves are <span class=\"t\" data-t=\"implicit communication\">implicit communication</span>: one word carries a whole protocol."}, {"lead": "Mission command → mission-type orders to the AI partner.", "body": "Assign the task and explain the intent; leave the method to the partner. Intent is predominant: when the <span class=\"t\" data-t=\"situation\">situation</span> changes mid-session and the task goes obsolete, the partner <span class=\"t\" data-t=\"act\">acts</span> on intent rather than \"wait out.\" The corollary burden: the partner keeps the larger <span class=\"t\" data-t=\"situation\">situation</span> in mind and informs the operator of the departure."}, {"lead": "OODA → the session cycle and the cache note.", "body": "Observe (read STATE.md, sit rep), orient (build the <span class=\"t\" data-t=\"image\">image</span>), decide, <span class=\"t\" data-t=\"act\">act</span> — and the <code>_CACHE/</code> session note is the <span class=\"t\" data-t=\"feedback\">feedback</span> that makes the next loop start from a changed <span class=\"t\" data-t=\"situation\">situation</span> rather than from zero. \"Analysis after the fact, which ascertains the results and lessons of the action and so informs future actions, contributes to <span class=\"t\" data-t=\"command and control\">command and control</span>.\" ENDEX is where that analysis happens."}, {"lead": "Hybrid information management → STATE.md and BOLO.", "body": "Push routine <span class=\"t\" data-t=\"information\">information</span> to \"an easily accessible, local data base\" the <span class=\"t\" data-t=\"commander\">commander</span> pulls from — that is STATE.md and the PMCS table. Push critical, time-sensitive items direct, even out of turn — that is BOLO capture the same turn a to-do is spoken. <span class=\"t\" data-t=\"directed telescope\">Directed telescopes</span> for what no system anticipates — that is a background agent (DARKROOM) aimed at one question."}, {"lead": "Tolerate mistakes of action, not inaction → the counter to the stall pattern.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span> builds \"an institutional prejudice for tolerating mistakes of action but not inaction.\" The recurring stall — a finished design blocked on one decision — is inaction. Under this <span class=\"t\" data-t=\"doctrine\">doctrine</span> the partner makes the call at acceptable <span class=\"t\" data-t=\"risk\">risk</span> and reports it, and the operator's review culture does not punish the attempt."}, {"lead": "Prisoners in their own headquarters → delegate the routine.", "body": "\"The <span class=\"t\" data-t=\"commander\">commander</span> should do only those things which only the <span class=\"t\" data-t=\"commander\">commander</span> can do.\" The operator's scarce commodity is attention; routine tasks go to the partner, and the partner is empowered to <span class=\"t\" data-t=\"act\">act</span> while the operator is at the critical spot. A partner that cannot <span class=\"t\" data-t=\"act\">act</span> without the operator present makes the operator a prisoner of the workspace."}, {"lead": "Simple models expanded, not complex models compressed → the default <code>project_flow</code>.", "body": "Time <span class=\"t\" data-t=\"will\">will</span> be short most of the time. The standard flow is the compressed version — brief, gate, sit rep, ENDEX — expanded when time and circumstances permit, never an elaborate procedure squeezed under pressure. Balck: \"Don't work hard, work fast.\""}, {"lead": "Main effort → focusing command and control.", "body": "\"The <span class=\"t\" data-t=\"focus\">focus</span> of the <span class=\"t\" data-t=\"command and control\">command and control</span> effort should reflect the overall <span class=\"t\" data-t=\"focus\">focus</span> of efforts.\" <span class=\"t\" data-t=\"command and control\">Command and control</span> resources — attention, <span class=\"t\" data-t=\"planning\">planning</span>, sit rep detail, the partner's cycles — concentrate on the <span class=\"t\" data-t=\"main effort\">main effort</span>, with economy elsewhere. Everything else gets less <span class=\"t\" data-t=\"information\">information</span>, not more."}], "marks": []}, {"id": "MIL.10", "bvx_id": "BVX.1120", "title": "MCDP 7 — Learning", "author": "U.S. Marine Corps (HQMC)", "year": "2020", "edition": "20 Feb 2020", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "learning-philosophy", "training-vs-education", "learning-culture", "feedback-aar", "self-directed-learning", "maneuver-warfare"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.04 — MCDP 1-3 Tactics — USMC (1997)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)", "🧬 MIL.11 — MCDP 8 Information — USMC (2022)"], "feeds": [{"layer": "_0.1_BVX_LEARN", "variable": "learning_pipeline", "strength": "primary", "note": "The one-sheet system is MCDP 7's vicarious-experience mechanic made literal — 'there is no excuse for not learning from others.' Training/education split tells the pipeline what a sheet is for: education (the unknown, judgment) with a self-check drill (training) attached. Surfaces-and-gaps is the catalog's self-assessment logic."}, {"layer": "SOP", "variable": "transmission_pedagogy", "strength": "primary", "note": "Doctrinal source for BOLO 6. Learner is the main effort; instructor is in support. Why before what. Describe → explain → demonstrate → do → assess → feedback. Socratic debrief over criticism. Match method to outcome, never one-size-fits-all. Feedback without follow-on action is wasted effort."}, {"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "secondary", "note": "The AAR is a phase, not an afterthought: what happened → why → what applies next. Mistakes in the controlled environment are the mechanism that prevents mistakes in the live one. Adopt a new method only when demonstrably better — the anti-rebuild rule for the recurring stall pattern."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "The readback is extrinsic feedback; the sit rep is a formative assessment. Honest professional opinion is a duty until the decision is stated — then execute. Debrief with no ranks visible."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "secondary", "note": "Candidates: out-learning is the mechanism of out-fighting · no feedback, no learning · you fight the way you learned · the learner is the main effort · learn because of errors, not despite them."}], "file": "🧬 MIL.10 — MCDP 7 Learning — USMC (2020).md", "thesis": "<span class=\"t\" data-t=\"learning\">Learning</span> is a <span class=\"t\" data-t=\"weapon\">weapon</span> system: <span class=\"t\" data-t=\"maneuver warfare\">maneuver warfare</span> is won by the side that recognizes, decides, and adapts faster than a thinking enemy, that <span class=\"t\" data-t=\"speed\">speed</span> is built only through continuous, self-directed, feedback-driven <span class=\"t\" data-t=\"learning\">learning</span> — <span class=\"t\" data-t=\"training\">training</span> for the known, <span class=\"t\" data-t=\"education\">education</span> for the unknown — so <span class=\"t\" data-t=\"learning\">learning</span> is every Marine's career-long professional obligation inside a culture the leader is responsible for building, and out-learning the enemy is the mechanism of out-fighting the enemy. ---", "invariants": [{"lead": "Learning is training plus education; neither substitutes for the other.", "body": "<span class=\"t\" data-t=\"training\">Training</span> prepares for the known factors (marksmanship, procedure); <span class=\"t\" data-t=\"education\">education</span> prepares for the unknown (decision-making in changing circumstances). <span class=\"t\" data-t=\"training\">Training</span> is learning-by-doing; <span class=\"t\" data-t=\"education\">education</span> is study and intellectual development. Both are required, working together, and the outcome of both is called <span class=\"t\" data-t=\"learning\">learning</span>."}, {"lead": "Out-learning is the mechanism of out-fighting.", "body": "<span class=\"t\" data-t=\"maneuver warfare\">Maneuver warfare</span> attacks the enemy's ability to decide. The side that moves through observe–orient–decide–<span class=\"t\" data-t=\"act\">act</span> faster wins, and that <span class=\"t\" data-t=\"speed\">speed</span> is a learned cognitive competency — problem framing, pattern recognition, critical thinking, synthesis — not a piece of equipment. The mind is prepared like any other <span class=\"t\" data-t=\"weapon\">weapon</span> system; technology supports it and never replaces it."}, {"lead": "No feedback, no learning.", "body": "<span class=\"t\" data-t=\"feedback\">Feedback</span> is intrinsic (your own perception of the error) and extrinsic (an instructor identifying it). <span class=\"t\" data-t=\"learning\">Learning</span> is itself adaptive behavior, and adaptation is impossible without seeking and responding to <span class=\"t\" data-t=\"feedback\">feedback</span>. Awareness of a weakness without follow-on action is wasted effort for both parties."}, {"lead": "The individual owns the outcome; the leader owns the conditions.", "body": "Four areas of responsibility: the individual, the instructor, the <span class=\"t\" data-t=\"commander\">commander</span>/leader, the institution. <span class=\"t\" data-t=\"commander\">Commanders</span> set the conditions for a culture of <span class=\"t\" data-t=\"learning\">learning</span>; each Marine is responsible for <span class=\"t\" data-t=\"learning\">learning</span> in those conditions. Adult learners are responsible for their own <span class=\"t\" data-t=\"learning\">learning</span> <span class=\"t\" data-t=\"outcomes\">outcomes</span>, actions, and decisions."}, {"lead": "Errors are the raw material.", "body": "Mistakes in a controlled environment are the mechanism by which mistakes in combat are prevented. Tolerance is set from above: a subordinate's willingness to admit mistakes depends on the <span class=\"t\" data-t=\"commander\">commander</span>'s willingness to tolerate them. Marines learn because of their errors, not despite them."}, {"lead": "The learner is the main effort.", "body": "Every decision about method, environment, or delivery asks one question: how can I best support the learner? Leaders and instructors are always in support. There is no single correct design for a <span class=\"t\" data-t=\"learning\">learning</span> environment because every objective, learner, and condition differs."}, {"lead": "Skills atrophy; mastery is a journey, not a destination.", "body": "Neglected competencies decay quickly. Reaching a goal is the signal to move to a harder one. The higher the rank, the greater the need to learn and the less time perceived to do it — so the habit starts early and never stops."}, {"lead": "You fight the way you learned.", "body": "Under the stress of combat, Marines execute what they practiced. <span class=\"t\" data-t=\"learning\">Learning</span> environments therefore mirror the conditions expected, include an opposing <span class=\"t\" data-t=\"will\">will</span>, and permit reasonable <span class=\"t\" data-t=\"risk\">risk</span>. Incorrect practice is not neutral; it is <span class=\"t\" data-t=\"negative training\">negative training</span> that transfers to the battlespace."}], "heuristics": [{"situation": "Deciding what or how to study", "do": "Establish <i>why</i> first — the purpose relative to the mission; then the content", "not": "Consume content because it is assigned, available, or new"}, {"situation": "A rep or exercise went wrong", "do": "Run the AAR: what happened → why it happened → what applies next time; discuss the thinking that produced the action", "not": "Point out the mistake without context; berate the first mistake"}, {"situation": "Giving <span class=\"t\" data-t=\"feedback\">feedback</span>", "do": "Describe → explain why it matters → demonstrate → have them do it → assess → constructive <span class=\"t\" data-t=\"feedback\">feedback</span>; Socratic questions in the debrief", "not": "Deliver the \"right answer\" according to your personal view; negative <span class=\"t\" data-t=\"feedback\">feedback</span> that tears down and stifles initiative"}, {"situation": "<span class=\"t\" data-t=\"feedback\">Feedback</span> reveals a gap in you", "do": "<span class=\"t\" data-t=\"act\">Act</span> on it — set the interim step, the timeline, the practice", "not": "File it; seek only <span class=\"t\" data-t=\"feedback\">feedback</span> that confirms existing ability"}, {"situation": "A subordinate challenges your idea", "do": "Permit the challenge in discussion and <span class=\"t\" data-t=\"planning\">planning</span>, up to the moment you decide; then everyone executes", "not": "Read the challenge as a challenge to authority; shut down the <span class=\"t\" data-t=\"feedback\">feedback</span> channel"}, {"situation": "A new method, tool, or technology appears", "do": "Demand evidence it is <i>demonstrably</i> better than the existing method before replacing it", "not": "Adopt it because it is new; reject it because the old one exists"}, {"situation": "Choosing a <span class=\"t\" data-t=\"learning\">learning</span> method", "do": "Match method to the intended outcome, the learner's level, and available time and resources; vary methods", "not": "One-size-fits-all instruction"}, {"situation": "<span class=\"t\" data-t=\"learning\">Learning</span> basic facts, standing orders, drills", "do": "Rote memorization and repetition — efficient and correct here", "not": "Rote for everything; treat efficiency as if it were effectiveness"}, {"situation": "<span class=\"t\" data-t=\"learning\">Learning</span> <span class=\"t\" data-t=\"doctrine\">doctrine</span> or principle", "do": "Understand it deeply enough to know <i>when and how to deviate</i> as the <span class=\"t\" data-t=\"situation\">situation</span> demands", "not": "Memorize the rule and apply it rigidly"}, {"situation": "\"No time to learn\" at senior level", "do": "Self-directed study gets time at least equal to physical conditioning; exploit downtime (transit, ship, waiting)", "not": "Defer <span class=\"t\" data-t=\"learning\">learning</span> until the schedule clears — it never does"}, {"situation": "Assessing your own <span class=\"t\" data-t=\"competence\">competence</span>", "do": "Continuous, aggressive reconnaissance of your surfaces (<span class=\"t\" data-t=\"strength\">strengths</span>) and gaps (weaknesses); expose the gaps", "not": "Hide the gaps; build only on surfaces"}, {"situation": "You cannot practice every variation", "do": "<span class=\"t\" data-t=\"vicarious experience\">Vicarious experience</span> — read, observe, study AARs and lessons learned, run <span class=\"t\" data-t=\"mental imagery\">mental imagery</span> of <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span>", "not": "Wait for direct experience to teach you"}, {"situation": "After an intense experience", "do": "Take time to reflect — solitude turns experience into a lesson", "not": "React to the next stimulus; the lesson is lost"}, {"situation": "You want to master a topic", "do": "Teach it well to someone else", "not": "Study it alone"}, {"situation": "Supervising <span class=\"t\" data-t=\"subordinates\">subordinates</span> in garrison", "do": "Grant freedom of action; monitor and correct when necessary", "not": "Over-supervise — then expect <span class=\"t\" data-t=\"boldness\">boldness</span> in the field"}], "concepts": [{"title": "Training vs. Education", "body": "<span class=\"t\" data-t=\"learning\">Learning</span> is developing knowledge, skills, and attitudes through study, experience, or instruction; it encompasses both <span class=\"t\" data-t=\"training\">training</span> and <span class=\"t\" data-t=\"education\">education</span>. <span class=\"t\" data-t=\"training\">Training</span> addresses the known factors of war and is primarily learning-by-doing; <span class=\"t\" data-t=\"education\">education</span> addresses the unknown factors and is study and intellectual development. The complexity and rate of change of the modern battlefield require a highly educated <span class=\"t\" data-t=\"force\">force</span> — but \"we must not educate without the complementary execution of well-conceived <span class=\"t\" data-t=\"training\">training</span>.\" <span class=\"t\" data-t=\"competence\">Competence</span> — sufficient knowledge, <span class=\"t\" data-t=\"judgment\">judgment</span>, and skill for the duty — is the output; a Marine with knowledge and skills but no <span class=\"t\" data-t=\"judgment\">judgment</span> requires close supervision, which combat may not permit."}, {"title": "The Five Learning Principles", "body": "(1) Know yourself and seek self-improvement — your values, biases, and experiences shape what you learn. (2) Be ready and willing to learn — humility, courage, curiosity, discipline; awareness of your own thought processes (<span class=\"t\" data-t=\"metacognition\">metacognition</span>). (3) Understand why you are <span class=\"t\" data-t=\"learning\">learning</span> — purpose produces motivation and transfer to new <span class=\"t\" data-t=\"situation\">situations</span>. (4) Provide and receive constructive <span class=\"t\" data-t=\"feedback\">feedback</span> — the non-negotiable engine. (5) <span class=\"t\" data-t=\"learning\">Learning</span> is purpose-driven to develop professional <span class=\"t\" data-t=\"competence\">competence</span> — specific goals, measurable objectives, team-oriented, experiential."}, {"title": "The Mind as a Weapon: the Intellectual Edge and the OODA Loop", "body": "The warfighter who recognizes what is happening, adapts, and decides in the shortest time holds the advantage. This edge is built from deliberate practice of cognitive competencies (problem framing, mental imaging, critical thinking, analysis, synthesis, reasoning) and from memory trained to recall instinctively under stress — because network access, time, and signature discipline <span class=\"t\" data-t=\"will\">will</span> not always permit a digital search. The rate of technological change makes the loop more important, not less. Technology is leveraged; it is never the solution alone."}, {"title": "Feedback and Assessment as Tools", "body": "<span class=\"t\" data-t=\"feedback\">Feedback</span> is intrinsic or extrinsic; both are required for <span class=\"t\" data-t=\"adaptability\">adaptability</span>. Assessments are <span class=\"t\" data-t=\"feedback\">feedback</span> instruments, not scores: diagnostic (what does the learner know before), formative (how is it going during — process-oriented, identifies what to strengthen), summative (what was learned after — did they meet the standard). The best instructors run <span class=\"t\" data-t=\"coach–teach–mentor\">coach–teach–mentor</span>. Assessments are honest, transparent, constructive, and most valuable when the learner can apply them immediately. Errors and failures are never <span class=\"t\" data-t=\"end state\">end states</span>; they are steps."}, {"title": "The Culture of Learning and the Four Areas of Responsibility", "body": "Culture is the underlying beliefs, assumptions, values, and ways of interacting. Ideas and methods outweigh <span class=\"t\" data-t=\"weapon\">weapon</span> systems and org structures. The hierarchy required for <span class=\"t\" data-t=\"command and control\">command and control</span> can also suppress initiative, <span class=\"t\" data-t=\"feedback\">feedback</span>, and problem solving — leaders must guard against this. Four functional areas: the individual (progress in self-education, build a bias for intelligent action), the instructor (selected for teaching potential; \"those who have done well, teach\"), the <span class=\"t\" data-t=\"commander\">commander</span>/leader (set conditions; tailor the unit's <span class=\"t\" data-t=\"learning\">learning</span> to the mission; set the example; tolerate mistakes and set the standard for reasonable <span class=\"t\" data-t=\"risk\">risk</span>), the institution (refine methods, provide resources, structure incentives). The greatest combat mistake may be unwillingness to <span class=\"t\" data-t=\"act\">act</span> from fear of <span class=\"t\" data-t=\"risk\">risk</span>."}, {"title": "Growth Mindset, Goals, and Intrinsic Motivation", "body": "Marines set clear short-, mid-, and long-term professional goals — process-oriented, so near goals lead to far ambitions — assess progress, adjust the goal harder if met or add interim steps if missed, and hold each other accountable. Growth <span class=\"t\" data-t=\"mindset\">mindset</span>: effort and <span class=\"t\" data-t=\"learning\">learning</span> change one's qualities; seek challenge and <span class=\"t\" data-t=\"feedback\">feedback</span>. Fixed <span class=\"t\" data-t=\"mindset\">mindset</span>: qualities are innate; seek only confirming <span class=\"t\" data-t=\"feedback\">feedback</span>; stagnate. Leaders shape <span class=\"t\" data-t=\"mindset\">mindset</span> by attributing success to preparation, effort, persistence, and practice, which cultivates <span class=\"t\" data-t=\"intrinsic motivation\">intrinsic motivation</span> — the only motivation that sustains a career."}, {"title": "Surfaces and Gaps, Applied to the Learner", "body": "MCDP 1's surfaces (enemy <span class=\"t\" data-t=\"strength\">strengths</span>) and gaps (enemy weaknesses) turned inward. A learner's surfaces are areas of existing understanding — maintained, built on, related to new material. Gaps are weaknesses in knowledge, experience, or competency — filled with new understanding and practice. Recognition requires awareness, honesty, and <span class=\"t\" data-t=\"judgment\">judgment</span>; a surface in one learner is a gap in another. Learners do not hide gaps; they exercise intellectual humility, leverage surfaces to form new connections, and ensure surfaces do not deteriorate while gaps are worked. Open discussion and quality AARs are the reconnaissance."}, {"title": "The Learner-Centric Environment", "body": "The <span class=\"t\" data-t=\"learning\">learning</span> environment is every factor that <span class=\"t\" data-t=\"influences\">influences</span> instruction — methods, resources, technology, culture, instructors, peers, social elements — not the room. The learner is the <span class=\"t\" data-t=\"main effort\">main effort</span>; instructors and leaders are in support and tailor delivery to needs, aptitudes, pace, and prior knowledge (adult learners integrate new material through existing knowledge). Environments must foster analytical reasoning and rapid recognition-primed decision-making, mirror expected conditions, and provide an opposing <span class=\"t\" data-t=\"will\">will</span> — \"there is no substitute for fighting against a competent, realistic, thinking, adaptive enemy.\" Improving the environment does not mean making it more efficient; mastery requires time to question, reflect, and apply. New methods are adopted only when demonstrably better."}, {"title": "Self-Directed Learning as Mission Tactics", "body": "<span class=\"t\" data-t=\"self-directed learning\">Self-directed learning</span>: the individual identifies <span class=\"t\" data-t=\"learning\">learning</span> needs, formulates goals, pursues them, and evaluates <span class=\"t\" data-t=\"outcomes\">outcomes</span>. It is the <span class=\"t\" data-t=\"learning\">learning</span> analogue of <span class=\"t\" data-t=\"mission tactics\">mission tactics</span> — the leader assigns the mission and intent without prescribing the method; the learner owns the <span class=\"t\" data-t=\"plan\">plan</span> and its execution, framed by guidance; the leader provides support and is freed to <span class=\"t\" data-t=\"focus\">focus</span> on learners who need more help. It develops critical evaluation of sources and perspectives, and it becomes more effective and more necessary as the learner advances."}, {"title": "Vicarious Experience, Mental Imagery, and Reflection", "body": "<span class=\"t\" data-t=\"vicarious experience\">Vicarious experience</span> — <span class=\"t\" data-t=\"learning\">learning</span> from what others experienced through observation, reading, AARs, lessons-learned reports, history — is the accelerant, and it matters more in this profession because not every variation can be practiced. The more <span class=\"t\" data-t=\"vicarious experience\">vicarious experience</span> banked, the less likely any new <span class=\"t\" data-t=\"situation\">situation</span> is wholly unique. <span class=\"t\" data-t=\"mental imagery\">Mental imagery</span> rehearses decisions against <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span> and reduces <span class=\"t\" data-t=\"surprise\">surprise</span>. Reflection converts experience into a lesson; without solitude and time to reflect, the lesson is not extracted. Always ask <i>why</i> the <span class=\"t\" data-t=\"event\">events</span> happened and what applies forward, not only what happened."}, {"title": "The Learning Leader", "body": "Teaching and leading cannot be uncoupled; a leader who cannot teach struggles to lead. The leader models <span class=\"t\" data-t=\"learning\">learning</span> (self-directed study at least equal in time to physical conditioning), turns mistakes into teachable moments, opens dialogue on how thoughts and actions produced <span class=\"t\" data-t=\"outcomes\">outcomes</span>, gives <span class=\"t\" data-t=\"subordinates\">subordinates</span> freedom of action, and does not wait for failure to find a <span class=\"t\" data-t=\"learning\">learning</span> opportunity. The officer–enlisted relationship is teacher and scholar. Humility is <span class=\"t\" data-t=\"structural\">structural</span>: the more you learn, the more you need to learn; you learn from anyone regardless of rank; honest professional disagreement is a duty until the decision is stated. Debriefs with no ranks visible free seniors to learn from juniors. <span class=\"t\" data-t=\"brilliance in the basics\">Brilliance in the basics</span> comes first, built by deliberate, purposeful, quality practice. ---"}], "vocabulary": [{"term": "Learning", "definition": "Developing knowledge, skills, and attitudes through study, experience, or instruction; includes both <span class=\"t\" data-t=\"training\">training</span> and <span class=\"t\" data-t=\"education\">education</span>"}, {"term": "Training", "definition": "Learning-by-doing; prepares for the known factors of war"}, {"term": "Education", "definition": "Study and intellectual development; prepares for the unknown factors of war"}, {"term": "Competence", "definition": "Sufficient knowledge, <span class=\"t\" data-t=\"judgment\">judgment</span>, and skills to perform a particular duty, job, or function"}, {"term": "Intellectual edge", "definition": "Developed knowledge and experience that lets Marines recognize cues, make sense of <span class=\"t\" data-t=\"information\">information</span>, and respond faster than the enemy"}, {"term": "OODA loop", "definition": "Observe–orient–decide–<span class=\"t\" data-t=\"act\">act</span>; the decision cycle <span class=\"t\" data-t=\"maneuver warfare\">maneuver warfare</span> seeks to run faster than the enemy's"}, {"term": "Bias for action", "definition": "The disposition to decide and <span class=\"t\" data-t=\"act\">act</span> within <span class=\"t\" data-t=\"commander's intent\">commander's intent</span> without waiting to be told"}, {"term": "Learning friction", "definition": "Lack of self-awareness, emotional regulation, humility, time management, or bias — the <span class=\"t\" data-t=\"force\">forces</span> that make <span class=\"t\" data-t=\"learning\">learning</span> harder than it looks"}, {"term": "Intrinsic / extrinsic feedback", "definition": "<span class=\"t\" data-t=\"feedback\">Feedback</span> from your own perception vs. <span class=\"t\" data-t=\"feedback\">feedback</span> from an external source (instructor, peer, data)"}, {"term": "Adaptability", "definition": "The quality of adjusting to new conditions; <span class=\"t\" data-t=\"learning\">learning</span> is itself a form of adaptive behavior"}, {"term": "Vicarious experience", "definition": "<span class=\"t\" data-t=\"learning\">Learning</span> obtained by observing, reading, and studying what others experienced"}, {"term": "Mental imagery", "definition": "Visualization used to rehearse decisions, explore <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span>, and gain confidence before execution"}, {"term": "Growth / fixed mindset", "definition": "Belief that effort changes one's qualities vs. belief that qualities are innate; the first seeks <span class=\"t\" data-t=\"feedback\">feedback</span>, the second avoids it"}, {"term": "Intrinsic motivation", "definition": "Engagement driven by internal reward; cultivated by attributing success to preparation, effort, persistence, practice"}, {"term": "Surfaces and gaps (learner)", "definition": "Areas of existing understanding vs. weaknesses in knowledge, experience, or competency"}, {"term": "Main effort (learner)", "definition": "The learner is the <span class=\"t\" data-t=\"focus\">focus</span> of effort; leaders and instructors are in support"}, {"term": "Self-directed learning", "definition": "Taking the initiative to identify <span class=\"t\" data-t=\"learning\">learning</span> needs, set goals, pursue them, and evaluate <span class=\"t\" data-t=\"outcomes\">outcomes</span>"}, {"term": "Mission tactics", "definition": "Assigning a mission without specifying how it must be accomplished; the model for <span class=\"t\" data-t=\"self-directed learning\">self-directed learning</span>"}, {"term": "Diagnostic / formative / summative assessment", "definition": "Before / during / after a <span class=\"t\" data-t=\"learning\">learning</span> activity; all are <span class=\"t\" data-t=\"feedback\">feedback</span> tools, not scores"}, {"term": "Coach–teach–mentor", "definition": "The instructional posture that delivers constructive <span class=\"t\" data-t=\"feedback\">feedback</span>"}, {"term": "Brilliance in the basics", "definition": "Technical and tactical proficiency in fundamentals; the foundation of mastery"}, {"term": "Negative training", "definition": "Incorrect or unfocused practice that transfers bad habits to the battlespace"}, {"term": "Foot-locker education", "definition": "Small-unit leaders and tested veterans teaching their people directly — where the greatest lessons pass"}, {"term": "Metacognition", "definition": "Awareness and understanding of one's own thought processes"}, {"term": "Andragogy", "definition": "Adult <span class=\"t\" data-t=\"learning\">learning</span> methods, techniques, and principles"}, {"term": "Learning organization", "definition": "Develops new ideas, tests them, learns from success and failure, and assumes what worked before may not work next"}, {"term": "Warrior-scholar", "definition": "A Marine who seizes the initiative to study the profession whenever and wherever the opportunity arises"}], "quotes": [{"quote": "Out-learning the enemy is, therefore, the key to out-fighting the enemy.", "caption": ""}, {"quote": "Learners and instructors alike should understand that Marines learn because of their errors, not despite them.", "caption": ""}, {"quote": "There is no excuse for not <span class=\"t\" data-t=\"learning\">learning</span> from others.", "caption": ""}, {"quote": "Teaching and leading cannot be uncoupled—Marines who cannot teach <span class=\"t\" data-t=\"will\">will</span> struggle as leaders.", "caption": ""}, {"quote": "During the stresses of combat, Marines <span class=\"t\" data-t=\"will\">will</span> fight the way that they learned.", "caption": ""}, {"quote": "A subordinate's willingness to admit mistakes depends on the <span class=\"t\" data-t=\"commander\">commander</span>'s willingness to tolerate them.", "caption": ""}, {"quote": "Marines are open to exploring and adopting new methods when they are demonstrably better, not just because they are new.", "caption": ""}, {"quote": "We cannot rightly expect <span class=\"t\" data-t=\"subordinates\">subordinates</span> to exercise <span class=\"t\" data-t=\"boldness\">boldness</span> and initiative in the field when they are accustomed to being over-supervised in garrison.", "caption": ""}, {"quote": "Reaching a goal along the path to mastery is an indication that it is time to move on to a more challenging goal.", "caption": ""}, {"quote": "Solitude allows you to reflect while others are reacting.", "caption": ""}], "doesnt_work": "<span class=\"t\" data-t=\"learning\">Learning</span> without knowing why, <span class=\"t\" data-t=\"training\">training</span> without <span class=\"t\" data-t=\"education\">education</span> or educating without <span class=\"t\" data-t=\"training\">training</span>, one-size-fits-all instruction, rote memorization applied to everything, treating efficiency as effectiveness, adopting methods because they are new, refusing methods because the old one exists, relying on digital storage and search in place of trained memory, treating technology as the solution, a fixed <span class=\"t\" data-t=\"mindset\">mindset</span> that seeks only confirming <span class=\"t\" data-t=\"feedback\">feedback</span>, hiding gaps, awareness of weakness without follow-on action, negative <span class=\"t\" data-t=\"feedback\">feedback</span> that tears down, berating the first mistake, pointing out mistakes without context or explanation, reading a challenged idea as challenged authority, hierarchy that suppresses initiative and <span class=\"t\" data-t=\"feedback\">feedback</span>, over-supervision in garrison, intolerance of mistakes in <span class=\"t\" data-t=\"training\">training</span>, fear of <span class=\"t\" data-t=\"risk\">risk</span> as a substitute for <span class=\"t\" data-t=\"judgment\">judgment</span>, settling for \"good enough,\" reacting without reflection, asking only what happened instead of why, assessments used as arbitrary scores, incorrect or unfocused practice, deferring <span class=\"t\" data-t=\"learning\">learning</span> because rank leaves no time, hubris and ego.", "selfcheck": ["Do I know <i>why</i> I am <span class=\"t\" data-t=\"learning\">learning</span> what I am <span class=\"t\" data-t=\"learning\">learning</span> — the purpose relative to the mission?", "Do I seek and <span class=\"t\" data-t=\"act\">act</span> on <span class=\"t\" data-t=\"feedback\">feedback</span>, intrinsic and extrinsic, with a follow-on step every time a gap is exposed?", "Do I run a real AAR after every significant <span class=\"t\" data-t=\"event\">event</span> — what happened, why, what applies next — and record the lesson?", "Do I have written short-, mid-, and long-term <span class=\"t\" data-t=\"learning\">learning</span> goals, and do I harden them when I <span class=\"t\" data-t=\"reach\">reach</span> them?", "Have I done honest reconnaissance of my <span class=\"t\" data-t=\"surfaces and gaps\">surfaces and gaps</span>, and am I working the gaps rather than hiding them?", "Do I bank <span class=\"t\" data-t=\"vicarious experience\">vicarious experience</span> — reading, AARs, others' lessons — instead of waiting for direct experience?", "Do I make time to reflect after <span class=\"t\" data-t=\"learning\">learning</span> experiences rather than moving to the next stimulus?", "Do I teach what I want to master?", "When I lead, do I tolerate mistakes in the controlled environment, permit challenge up to the decision, and set the example of <span class=\"t\" data-t=\"learning\">learning</span>?", "Do I demand evidence a new method is demonstrably better before replacing one that works?"], "selfcheck_note": "", "application": [{"lead": "Training vs. education → what a one-sheet is for.", "body": "BVX-LEARN one-sheets are <i><span class=\"t\" data-t=\"education\">education</span></i> — invariants, heuristics, and <span class=\"t\" data-t=\"judgment\">judgment</span> for the unknown. The SOP, prowords, and house format are <i><span class=\"t\" data-t=\"training\">training</span></i> — procedure for the known. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> says neither stands alone: every one-sheet carries a self-check (the drill), and every procedure in the SOP traces to a principle in a sheet."}, {"lead": "Vicarious experience → the knowledge pipeline.", "body": "\"There is no excuse for not <span class=\"t\" data-t=\"learning\">learning</span> from others\" is the mandate for <code>_0.1_BVX_LEARN</code>. The catalog is the operation's lessons-learned library; each sheet banks another experience so fewer <span class=\"t\" data-t=\"situation\">situations</span> arrive wholly new. The <code>feeds:</code> block is the transfer mechanism — a sheet that feeds nothing is history, not <span class=\"t\" data-t=\"learning\">learning</span>."}, {"lead": "AAR / \"why, not what\" → the session cache and <code>_LOG/</code>.", "body": "The session note at close is the AAR. It must answer <i>why</i> the session went as it did and <i>what applies next</i>, not only what was done. The recurring stall pattern — finished designs blocked on one unanswered decision, then rebuilt — is exactly the lesson an AAR is built to capture and the \"demonstrably better\" rule is built to prevent: no rebuild without evidence the rebuild beats the finished design."}, {"lead": "Learner as main effort → transmission pedagogy (BOLO 6).", "body": "The doctrinal source for how the AI teaches in-chat. The learner is the <span class=\"t\" data-t=\"main effort\">main effort</span>; the AI is in support and tailors method to the learner, never one-size-fits-all. Sequence: establish <i>why</i> → describe → explain → demonstrate → have the learner do it → assess → constructive <span class=\"t\" data-t=\"feedback\">feedback</span>. Debrief Socratically; criticism without context is wasted effort. House format (SOP §7) is the cognitive-load <span class=\"t\" data-t=\"control\">control</span> layer of this pedagogy."}, {"lead": "Self-directed learning as mission tactics → BOLOs and taskings.", "body": "A BOLO is a <span class=\"t\" data-t=\"mission-type order\">mission-type order</span> for <span class=\"t\" data-t=\"learning\">learning</span>: intent and <span class=\"t\" data-t=\"end state\">end state</span> stated, method left to the executor, report back. The board supports and corrects; it does not prescribe every step. Over-supervision in the small tasks produces no initiative in the large ones."}, {"lead": "Surfaces and gaps → the PMCS table and STATE.md.", "body": "The watchlist is gap reconnaissance. STATE.md lists what is active and what is blocked — the blocked items are the operation's gaps. <span class=\"t\" data-t=\"doctrine\">Doctrine</span>: do not hide them; work them while ensuring the surfaces (finished systems, working protocols) do not deteriorate."}, {"lead": "Reflection → the session-end STATE.md update.", "body": "Gray's twenty-minute walk and Mattis's \"solitude allows you to reflect while others are reacting\" are the argument for the close-of-session ritual: the cache note, the STATE.md update, and the BOLO sweep are the reflection step. Skipping them is the failure mode <span class=\"t\" data-t=\"doctrine\">doctrine</span> names — reacting to the next stimulus with the lesson unextracted."}, {"lead": "Goals, growth mindset, feedback culture → the partnership's operating stance.", "body": "<span class=\"t\" data-t=\"learning\">Learning</span> goals in three horizons, hardened on reaching them; success attributed to preparation and practice; honest professional disagreement from the AI is a duty until Papi rules, then execution; debriefs \"with no ranks visible.\" The readback protocol (\"Good copy\" + readback) is the extrinsic-feedback loop made routine."}], "marks": []}, {"id": "MIL.11", "bvx_id": "BVX.1121", "title": "MCDP 8 — Information", "author": "U.S. Marine Corps (HQMC)", "year": "2022", "edition": "21 Jun 2022", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "information-warfare", "narrative", "information-environment", "deception-opsec", "force-resiliency", "maneuver-warfare"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.02 — MCDP 1-1 Strategy — USMC (1997)", "🧬 MIL.05 — MCDP 2 Intelligence — USMC (1997)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)", "🧬 MIL.10 — MCDP 7 Learning — USMC (2020)"], "feeds": [{"layer": "_PRIVATE/BOLO-24", "variable": "persona_information_environment", "strength": "primary", "note": "A persona account is an information operation. Generate = audience and reference research, archive everything. Preserve = the canon bible and the historical record; recover from narrative setbacks by re-affirming and acting consistently. Deny = the OPSEC boundary between operator and persona (signature management; _PRIVATE/ gitignored). Project = the posting cadence and the actions that back the story. Nest inside the existing Baddie narrative; credibility is backed by visible action; the command narrative is distinct from any single post's intent."}, {"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "Adds an information line to every charter: narrative development begins at problem framing and runs concurrent with planning. Each project states its audiences, its narrative, what must be denied (OPSEC list), and how narrative effectiveness is measured. Information is a function of the project, not a comms afterthought."}, {"layer": "01_NARRATIVE_FRAMEWORKS", "variable": "medium_grammars", "strength": "secondary", "note": "Narrative gives meaning to a set of facts; the prevailing one is the credible one that resonates with the intended audience. Volume, velocity, and value — plus rate, transmission medium, and style of presentation — are the levers on how an audience perceives. Maps to the telling/medium layers only; not a story-structure source."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Discipline in the information environment: every transmission is evaluated for second- and third-order effects; the repo is public, so the .gitignore line is the deny function. Preservation includes the record — the _LOG/ and cache notes are the operation's unit history."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "secondary", "note": "Candidates: advantage is never assumed, it is fought for · every action is a message · narratives are nested, not invented · the four functions operate only in combination."}], "file": "🧬 MIL.11 — MCDP 8 Information — USMC (2022).md", "thesis": "<span class=\"t\" data-t=\"information\">Information</span> is a warfighting function because advantage in it is never given: in a global, always-on environment where every action is a message and a local <span class=\"t\" data-t=\"act\">act</span> is a global <span class=\"t\" data-t=\"event\">event</span> in seconds, a <span class=\"t\" data-t=\"force\">force</span> wins by generating, preserving, denying, and projecting <span class=\"t\" data-t=\"information\">information</span> more effectively than its <span class=\"t\" data-t=\"opponent\">opponent</span> — in combination, with a maneuver <span class=\"t\" data-t=\"mindset\">mindset</span> — to create and exploit three advantages (<span class=\"t\" data-t=\"systems overmatch\">systems overmatch</span>, <span class=\"t\" data-t=\"prevailing narrative\">prevailing narrative</span>, <span class=\"t\" data-t=\"force resiliency\">force resiliency</span>) that let it influence the <span class=\"t\" data-t=\"opponent\">opponent</span>'s <span class=\"t\" data-t=\"will\">will</span> and impose its own. ---", "invariants": [{"lead": "Advantage is fought for, never assumed.", "body": "The <span class=\"t\" data-t=\"information\">information</span> age ended the presumption of persistent <span class=\"t\" data-t=\"information\">information</span> superiority. Some advantages pre-exist, most are temporary, and all can be exploited by either side. Any advantage held must be exploited before it expires."}, {"lead": "The information environment is global, enduring, and never off.", "body": "Light-speed communication gives anyone with a device global <span class=\"t\" data-t=\"reach\">reach</span>; the levels of warfare compress — a tactical <span class=\"t\" data-t=\"act\">act</span> becomes strategic in seconds, and the battlespace no longer has hierarchical or geographic boundaries. Assume every action <span class=\"t\" data-t=\"will\">will</span> be exposed, communicated globally, and distorted by an <span class=\"t\" data-t=\"opponent\">opponent</span> for disproportionate effect."}, {"lead": "Every action is a message.", "body": "All activity is physically detectable and observable and therefore communicates, intentionally or not. Presence, posture, and action are always open to interpretation — including by parties not yet in the fight who decide to enter based on what they see."}, {"lead": "Narrative gives meaning to facts, and credibility decides which narrative prevails.", "body": "The <span class=\"t\" data-t=\"prevailing narrative\">prevailing narrative</span> is the one that is credible and resonates most with the intended audience. Credibility comes from visible action matching words. Narratives already exist in every society; new ones are rarely created — a <span class=\"t\" data-t=\"command narrative\">command narrative</span> is nested inside the existing ones."}, {"lead": "The four functions operate only in combination.", "body": "Generate, preserve, deny, and project are mutually supporting, mutually reinforcing, and overlapping; projection is always coordinated with denial. A <span class=\"t\" data-t=\"plan\">plan</span> that uses one in isolation leaves the others to the <span class=\"t\" data-t=\"opponent\">opponent</span>."}, {"lead": "Every objective has a cognitive and a functional component.", "body": "<span class=\"t\" data-t=\"information\">Information</span> is the input to both thinking (human) and non-thinking (machine) processes, which yields two avenues of approach to any objective — the operator and the system — each exploitable directly or indirectly."}, {"lead": "Trust is the basis of belief.", "body": "People no longer experience most <span class=\"t\" data-t=\"event\">events</span> directly; the technology that mediates reality is the target. The human–machine interface is where perception is shaped, and volume, velocity, and value are the tangible levers on it."}, {"lead": "Information is the commander's business and every member's role.", "body": "It is not the realm of specialists. The <span class=\"t\" data-t=\"commander\">commander</span> integrates it into every <span class=\"t\" data-t=\"plan\">plan</span>; every individual protects it, leverages it, and understands what their own conduct communicates."}, {"lead": "The mindset is offensive and the model is maneuver.", "body": "Penetrate the <span class=\"t\" data-t=\"opponent\">opponent</span>'s system and tear it apart from within — do not wear it down. Assault through the ambush. The ultimate aim of an <span class=\"t\" data-t=\"information advantage\">information advantage</span> is to influence the <span class=\"t\" data-t=\"opponent\">opponent</span>'s <span class=\"t\" data-t=\"will\">will</span>."}], "heuristics": [{"situation": "<span class=\"t\" data-t=\"planning\">Planning</span> any operation or project", "do": "Develop the narrative during problem framing, concurrent with <span class=\"t\" data-t=\"planning\">planning</span>; state audiences, narrative, what is denied, how effect is measured", "not": "Bolt <span class=\"t\" data-t=\"communications\">communications</span> on at the end"}, {"situation": "Entering a new audience or environment", "do": "Map the existing narratives and key stakeholders; nest your credible narrative inside them", "not": "Invent a new, unfamiliar narrative and expect it to take"}, {"situation": "Words and actions diverge", "do": "Fix the action — messages are made credible by visible action on the ground", "not": "Message harder"}, {"situation": "You acted against your own narrative", "do": "Be transparent and truthful, apologize if applicable, re-affirm the narrative, direct consistent action, then showcase the correction", "not": "Deny, delay, hope it passes"}, {"situation": "<span class=\"t\" data-t=\"opponent\">Opponent</span>'s narrative is resonating", "do": "Highlight the gap between what they say and do with evidence; disrupt their distribution", "not": "Argue inside their frame"}, {"situation": "About to post, speak, or <span class=\"t\" data-t=\"act\">act</span> where it can be observed", "do": "Evaluate second- and third-order effects; assume global exposure and hostile distortion", "not": "Treat it as local, private, or off-duty"}, {"situation": "Building awareness of the environment", "do": "Generate: gain and maintain access; record and archive (screenshots, unit history, documents) for future use", "not": "Assume you <span class=\"t\" data-t=\"will\">will</span> remember or find it later"}, {"situation": "Facing an <span class=\"t\" data-t=\"opponent\">opponent</span>'s <span class=\"t\" data-t=\"strength\">strength</span>", "do": "Indirect approach — your <span class=\"t\" data-t=\"strength\">strength</span> against their <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span>", "not": "<span class=\"t\" data-t=\"strength\">Strength</span> against <span class=\"t\" data-t=\"strength\">strength</span> (attrition)"}, {"situation": "Under <span class=\"t\" data-t=\"information\">information</span> disruption or setback", "do": "Continue action on intent with the <span class=\"t\" data-t=\"information\">information</span> available; maintain <span class=\"t\" data-t=\"tempo\">tempo</span>; execute rehearsed drills — isolate, disable, restore", "not": "Halt until the picture is clear"}, {"situation": "Deciding whether concealment or deception is worth it", "do": "It is, at any scale, in almost all <span class=\"t\" data-t=\"situation\">situations</span>; <span class=\"t\" data-t=\"plan\">plan</span> it and coordinate projection with denial", "not": "Skip it because it costs time"}, {"situation": "Judging whether the narrative works", "do": "Measure effectiveness with the intended audience even though it is subjective and slow", "not": "Count outputs and assume effect"}, {"situation": "Consuming <span class=\"t\" data-t=\"information\">information</span>", "do": "<span class=\"t\" data-t=\"media literacy\">Media literacy</span> — distinguish primary source, news, commentary, manipulated media, parody, opinion; know your own cognitive biases", "not": "Trust the screen because it is on the screen"}, {"situation": "Judging a piece of <span class=\"t\" data-t=\"information\">information</span>", "do": "Value it by its contribution to the decision at hand — timing, accuracy, relevance, context, trust", "not": "Value it by volume or recency"}, {"situation": "Running a <span class=\"t\" data-t=\"training\">training</span> exercise or rehearsal", "do": "Treat it as observed; design which signatures to amplify and which to suppress", "not": "Treat it as a private rehearsal"}], "concepts": [{"title": "Information as the Seventh Warfighting Function", "body": "The newest Marine Corps warfighting function, alongside <span class=\"t\" data-t=\"command and control\">command and control</span>, maneuver, fires, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, <span class=\"t\" data-t=\"logistics\">logistics</span>, and <span class=\"t\" data-t=\"force\">force</span> protection. Like each of them it groups similar activities, and its purpose distinguishes it: to create and exploit <span class=\"t\" data-t=\"information advantage\">information advantages</span> in pursuit of mission objectives. All functions depend on assured access to trusted, timely, relevant <span class=\"t\" data-t=\"information\">information</span>, and every one of them has inherent informational aspects — maneuver signals intent and stimulates the enemy to <span class=\"t\" data-t=\"act\">act</span> so he can be observed; fires are used more for cognitive effect on <span class=\"t\" data-t=\"will\">will</span> than for physical effect; <span class=\"t\" data-t=\"logistics\">logistics</span> footprints expose intent; <span class=\"t\" data-t=\"force\">force</span> protection communicates resolve. Institutionalizing <span class=\"t\" data-t=\"information\">information</span> means making it a primary instrument of <span class=\"t\" data-t=\"maneuver warfare\">maneuver warfare</span>."}, {"title": "Information Advantage and Its Three Types", "body": "<span class=\"t\" data-t=\"information advantage\">Information advantage</span> is an exploitable condition resulting from one actor's ability to generate, preserve, deny, and project <span class=\"t\" data-t=\"information\">information</span> more effectively than another. Three primary types: <b><span class=\"t\" data-t=\"systems overmatch\">systems overmatch</span></b> — technical advantage yielding fires, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, maneuver, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"force\">force</span> protection, or <span class=\"t\" data-t=\"command and control\">command and control</span> advantages, won by disrupting the <span class=\"t\" data-t=\"opponent\">opponent</span>'s information-dependent systems while protecting your own (access is the precondition); <b><span class=\"t\" data-t=\"prevailing narrative\">prevailing narrative</span></b> — public opinion or perception advantage yielding trust, credibility, believability; <b><span class=\"t\" data-t=\"force resiliency\">force resiliency</span></b> — the ability to resist, counter, and prevail against reconnaissance, technical disruption, and malign activity. These generate further advantages: decision <span class=\"t\" data-t=\"speed\">speed</span>, <span class=\"t\" data-t=\"surprise\">surprise</span>, <span class=\"t\" data-t=\"tempo\">tempo</span>, mass, psychological."}, {"title": "The Four Functions of Information", "body": "<b>Generation</b> — gain and maintain access to the <span class=\"t\" data-t=\"information environment\">information environment</span>; build awareness of threats, vulnerabilities, and opportunities; hold systems at <span class=\"t\" data-t=\"risk\">risk</span>; create the <span class=\"t\" data-t=\"information\">information</span> needed to <span class=\"t\" data-t=\"plan\">plan</span> and operate (includes recording and archiving for future use). <b>Preservation</b> — protect and defend the <span class=\"t\" data-t=\"information\">information</span>, systems, and networks used for <span class=\"t\" data-t=\"planning\">planning</span> and operations against internal and external threats; build and maintain the historical record; recognize and dispel misinformation and disinformation. <b>Denial</b> — disrupt or destroy the <span class=\"t\" data-t=\"information\">information</span> the <span class=\"t\" data-t=\"opponent\">opponent</span> needs to understand, decide, or <span class=\"t\" data-t=\"act\">act</span> in coordination; includes concealment, OPSEC, communication discipline, <span class=\"t\" data-t=\"signature management\">signature management</span>, <span class=\"t\" data-t=\"counterintelligence\">counterintelligence</span>. <b>Projection</b> — communicate, transmit, or deliver <span class=\"t\" data-t=\"information\">information</span> of any type to inform, influence, or deceive an observer or targeted system, by words, media, or observable physical action. Always planned in combination; projection always coordinated with denial."}, {"title": "The Information Environment and Its Characteristics", "body": "The global competitive space spanning the warfighting domains where all operations depend on <span class=\"t\" data-t=\"information\">information</span> — including <span class=\"t\" data-t=\"information\">information</span> itself and every social, cultural, psychological, technical, and physical factor bearing on decisions. Five characteristics: instant and persistent global visibility; compressed levels of warfare and battlespace; truth, trust, and belief (trust in the source is the primary basis for judging true or false; misinformation is false without intent to harm, disinformation is false with intent); volume, velocity, and value (velocity is a function of volume against bandwidth and noise; value is judged by contribution to the decision); thinking and non-thinking processes. Competitors treat this environment as permanent war — blurring peace and war, winning without fighting, controlling narrative (<span class=\"t\" data-t=\"three warfares\">Three Warfares</span>: public opinion/media, psychological, legal), manipulating perception (<span class=\"t\" data-t=\"reflexive control\">reflexive control</span>), and using technologies of decision advantage, disruption, and destruction."}, {"title": "Informational Power and the Attributes of War", "body": "Competition and war redistribute power through a contest of <span class=\"t\" data-t=\"will\">wills</span>; <span class=\"t\" data-t=\"informational power\">informational power</span> is the use of <span class=\"t\" data-t=\"information\">information</span>, narratives, and technical means to advance interests. The attributes of war are information-centric: ambiguity and <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> are <span class=\"t\" data-t=\"weapon\">weapons</span> that induce <span class=\"t\" data-t=\"friction\">friction</span> and hesitation, so Marines both defend against them and inject them into the <span class=\"t\" data-t=\"opponent\">opponent</span>; complexity and fluidity degrade the <span class=\"t\" data-t=\"opponent\">opponent</span>'s ability to link cause and effect; the human dimension means the aim is the <span class=\"t\" data-t=\"opponent\">opponent</span>'s <span class=\"t\" data-t=\"will\">will</span>; physical, moral, and mental factors interact — and the moral and mental (morale, leadership, esprit) are targets defended by tangible <span class=\"t\" data-t=\"information\">information</span> means."}, {"title": "Cognitive and Functional Components; Direct and Indirect Approach", "body": "Every objective has a cognitive component (the human operator's perception, decision, <span class=\"t\" data-t=\"will\">will</span>) and a functional component (the system's ability to process <span class=\"t\" data-t=\"information\">information</span>). Each is exploited directly or indirectly. Cognitive-direct: alter what the operator perceives (decoys on the radar display). Cognitive-indirect: erode the <span class=\"t\" data-t=\"will\">will</span> to stay in the fight (tailored propaganda). Functional-direct: render the system inoperable (electromagnetic attack). Functional-indirect: cut a supporting link the system depends on (denial of service against the C2 node). The direct approach is <span class=\"t\" data-t=\"strength\">strength</span> against <span class=\"t\" data-t=\"strength\">strength</span> (attrition); the indirect is <span class=\"t\" data-t=\"strength\">strength</span> against <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> (maneuver)."}, {"title": "Narrative Competition", "body": "Narratives are essential to every operation because they give meaning to facts, and people understand the world through stories translatable to real experience. Method: generate knowledge of the audience's mental and moral factors and of the pre-existing friendly, neutral, and <span class=\"t\" data-t=\"opponent\">opponent</span> narratives; nest a credible <span class=\"t\" data-t=\"command narrative\">command narrative</span> inside the existing cultural ones (some are too entrenched to replace — work within them); back every message with visible action; measure effectiveness with the intended audience; preserve by consistent, proactive messaging through multiple redundant channels and by archiving fact-based evidence (photo, video, audio, documents); deny the <span class=\"t\" data-t=\"opponent\">opponent</span>'s narrative by exposing the gap between their words and deeds and by disrupting their distribution. Expect credibility to be attacked the moment a message goes out. Projecting in a narrative contest is nearly everything you do."}, {"title": "Force Resiliency", "body": "Two kinds of disruption: cognitive (disinformation, propaganda aimed at how the <span class=\"t\" data-t=\"force\">force</span> perceives itself and its <span class=\"t\" data-t=\"situation\">situation</span>) and functional (attacks on the systems it uses). <span class=\"t\" data-t=\"commander\">Commanders</span> instill the \"assault through the ambush\" mentality, build individual and unit action drills, and train against them routinely. The <span class=\"t\" data-t=\"mindset\">mindset</span> is offensive; a running estimate of threats, vulnerabilities, and opportunities prevents complacency. Setback recovery: for a narrative setback — transparency, apology if applicable, re-affirm, <span class=\"t\" data-t=\"act\">act</span> consistently, showcase the correction; for a systems setback — isolate, disable, restore. <span class=\"t\" data-t=\"media literacy\">Media literacy</span> and awareness of one's own cognitive biases make the <span class=\"t\" data-t=\"force\">force</span> harder to influence. Continuing action on intent with a degraded capability preserves <span class=\"t\" data-t=\"tempo\">tempo</span> and <span class=\"t\" data-t=\"force\">forces</span> the <span class=\"t\" data-t=\"opponent\">opponent</span> to react."}, {"title": "Deception", "body": "All warfare is based on deception; <span class=\"t\" data-t=\"surprise\">surprise</span> is convincing the <span class=\"t\" data-t=\"opponent\">opponent</span> you <span class=\"t\" data-t=\"will\">will</span> do something other than what you <span class=\"t\" data-t=\"plan\">plan</span>, and the greater the <span class=\"t\" data-t=\"surprise\">surprise</span> the smaller the <span class=\"t\" data-t=\"force\">force</span> and the fewer the casualties. Three categories: tactical deception (any unit — feints, demonstrations, ruses, displays, decoys, camouflage), joint military deception (operational-level, within approved authorities, weighing effects on credibility), and deception in support of OPSEC (multiple false or confusing indicators aimed only at foreign <span class=\"t\" data-t=\"intelligence\">intelligence</span> collection). Adopt an ambush <span class=\"t\" data-t=\"mindset\">mindset</span> in competition as well as combat: deception at any scale is worth its cost in almost every <span class=\"t\" data-t=\"situation\">situation</span>."}, {"title": "Command Narrative, Nesting, and Information in Planning", "body": "The <span class=\"t\" data-t=\"command narrative\">command narrative</span> is distinct from and broader than <span class=\"t\" data-t=\"commander's intent\">commander's intent</span>: it anchors and guides all public communication, exercises, and operations a unit performs, serves internal and external audiences, provides enduring context for presence and mission, and when done well inspires allies and deters competitors. It is a staff process that begins during problem framing and runs concurrent with <span class=\"t\" data-t=\"planning\">planning</span> and design; it is nested under higher and strategic narratives and then developed into supporting themes and messages. In <span class=\"t\" data-t=\"planning\">planning</span>, any unit or element can be tasked to generate, preserve, deny, or project; an <span class=\"t\" data-t=\"information\">information</span> effect can be the <span class=\"t\" data-t=\"main effort\">main effort</span>; effects on audiences are monitored and actions adjusted. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> gives the philosophy; <span class=\"t\" data-t=\"training\">training</span> develops the proficiencies; <span class=\"t\" data-t=\"education\">education</span> develops the understanding of the daily <span class=\"t\" data-t=\"information\">information</span> contest. ---"}], "vocabulary": [{"term": "Information environment", "definition": "The global competitive space spanning the warfighting domains where all operations depend on <span class=\"t\" data-t=\"information\">information</span>, including all social, cultural, psychological, technical, and physical factors bearing on decisions"}, {"term": "Information advantage", "definition": "An exploitable condition resulting from one actor's ability to generate, preserve, deny, and project <span class=\"t\" data-t=\"information\">information</span> more effectively than another"}, {"term": "Information warfighting function", "definition": "The grouping of activities whose purpose is to create and exploit <span class=\"t\" data-t=\"information advantage\">information advantages</span> in pursuit of mission objectives"}, {"term": "Systems overmatch", "definition": "Technical advantage of one side over another, yielding fires, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, maneuver, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"force\">force</span> protection, or <span class=\"t\" data-t=\"command and control\">command and control</span> advantages"}, {"term": "Prevailing narrative", "definition": "The narrative that is credible and resonates most with the intended audience; a public opinion or perception advantage"}, {"term": "Force resiliency", "definition": "The ability to resist, counter, and prevail against reconnaissance, technical disruption, and malign activity such as misinformation, disinformation, and propaganda"}, {"term": "Information generation", "definition": "Gaining access, building awareness of threats and opportunities, holding systems at <span class=\"t\" data-t=\"risk\">risk</span>, creating the <span class=\"t\" data-t=\"information\">information</span> needed to <span class=\"t\" data-t=\"plan\">plan</span> and operate"}, {"term": "Information preservation", "definition": "Protecting and defending <span class=\"t\" data-t=\"information\">information</span>, systems, networks, the historical record, and the narrative against internal and external threats"}, {"term": "Information denial", "definition": "Disrupting, destroying, or concealing the <span class=\"t\" data-t=\"information\">information</span> the <span class=\"t\" data-t=\"opponent\">opponent</span> needs to understand, decide, or <span class=\"t\" data-t=\"act\">act</span> in coordination"}, {"term": "Information projection", "definition": "Communicating, transmitting, or delivering <span class=\"t\" data-t=\"information\">information</span> of any type to inform, influence, or deceive an observer or targeted system"}, {"term": "Informational power", "definition": "The use of <span class=\"t\" data-t=\"information\">information</span>, narratives, and technical means to advance interests and achieve objectives"}, {"term": "Competition continuum", "definition": "The constant interaction between competitors spanning every action below and above the threshold of armed conflict; war is a form of violent competition"}, {"term": "Opponent", "definition": "Any actual or potential competitor, adversary, or enemy at any point on the <span class=\"t\" data-t=\"competition continuum\">competition continuum</span>"}, {"term": "Misinformation / disinformation", "definition": "False <span class=\"t\" data-t=\"information\">information</span> without deliberate intent to harm / false <span class=\"t\" data-t=\"information\">information</span> deliberately intended to cause harm or create an effect"}, {"term": "Thinking / non-thinking processes", "definition": "Human perception, cognition, decision, behavior / pre-programmed, hard-wired, or algorithmic processing"}, {"term": "Cognitive / functional component", "definition": "The human (operator) aspect of an objective / the system's ability to function — each exploitable directly or indirectly"}, {"term": "Direct / indirect approach", "definition": "<span class=\"t\" data-t=\"strength\">Strength</span> against <span class=\"t\" data-t=\"strength\">strength</span> (attrition) / <span class=\"t\" data-t=\"strength\">strength</span> against <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> (maneuver)"}, {"term": "Command narrative", "definition": "The story that anchors all of a unit's public communication, exercises, and operations; broader than <span class=\"t\" data-t=\"commander's intent\">commander's intent</span>; for internal and external audiences"}, {"term": "Nesting", "definition": "Aligning a <span class=\"t\" data-t=\"command narrative\">command narrative</span> under higher, joint, and strategic narratives, and inside existing cultural narratives"}, {"term": "Signature management", "definition": "Selectively altering or suppressing visual, electromagnetic, administrative, and digital emanations — a passive form of denial"}, {"term": "Reflexive control", "definition": "An information-centric theory of manipulating perception to create confusion, paralysis, or a chosen behavior in the <span class=\"t\" data-t=\"opponent\">opponent</span>"}, {"term": "Three Warfares", "definition": "China's approach to competition: public opinion/media warfare, psychological warfare, legal warfare — to <span class=\"t\" data-t=\"control\">control</span> the narrative"}, {"term": "Volume / velocity / value", "definition": "Quantity of <span class=\"t\" data-t=\"information\">information</span> / <span class=\"t\" data-t=\"speed\">speed</span> and direction of its movement (volume against bandwidth and noise) / contribution to the decision at hand"}, {"term": "Media literacy", "definition": "Critical distinction between primary source, news, commentary, manipulated media, parody, satire, and opinion; a force-resiliency skill"}], "quotes": [{"quote": "Marines should never assume they <span class=\"t\" data-t=\"will\">will</span> benefit from a specific <span class=\"t\" data-t=\"information advantage\">information advantage</span> without competing and fighting for it.", "caption": ""}, {"quote": "Narratives are essential underpinnings to every operation and activity because they give meaning to a set of facts.", "caption": ""}, {"quote": "The fight for and with <span class=\"t\" data-t=\"information\">information</span> is a nonstop competition. <span class=\"t\" data-t=\"information\">Information</span> is not the realm of specialists.", "caption": ""}, {"quote": "Marines must remember that our competitors continually compete aggressively in this space—there is no turning off the <span class=\"t\" data-t=\"information environment\">information environment</span>.", "caption": ""}, {"quote": "All military activities are physically detectable and observable and can therefore communicate a message—whether intentional or unintentional.", "caption": ""}, {"quote": "Instead of trying to create a new and unfamiliar narrative, <span class=\"t\" data-t=\"commander\">commanders</span> and planners must find ways to nest a credible <span class=\"t\" data-t=\"command narrative\">command narrative</span> within the existing cultural narratives.", "caption": ""}, {"quote": "Projecting <span class=\"t\" data-t=\"information\">information</span> in a narrative contest refers to nearly everything that Marines do, because our actions either reinforce or weaken a particular narrative.", "caption": ""}, {"quote": "Some <span class=\"t\" data-t=\"information advantage\">information advantages</span> already exist, most are temporary, and all can be exploited by us or our enemy.", "caption": ""}, {"quote": "The main point is that deception of any kind, at any scale, is worth the cost (time and personnel) in almost all <span class=\"t\" data-t=\"situation\">situations</span>.", "caption": ""}], "doesnt_work": "Assuming <span class=\"t\" data-t=\"information\">information</span> superiority, treating <span class=\"t\" data-t=\"information\">information</span> as a specialist's job, adding <span class=\"t\" data-t=\"communications\">communications</span> after the <span class=\"t\" data-t=\"plan\">plan</span> is made, inventing a new narrative instead of <span class=\"t\" data-t=\"nesting\">nesting</span> in existing ones, messaging harder when actions contradict the message, non-credible narratives, treating any action as local or private, ignoring second- and third-order effects, using one function of <span class=\"t\" data-t=\"information\">information</span> in isolation, projecting without coordinating denial, strength-against-strength when a <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> is available, halting under disruption until the picture clears, skipping deception because it costs time, counting outputs instead of measuring effect on the audience, trusting the screen without <span class=\"t\" data-t=\"media literacy\">media literacy</span>, ignoring one's own cognitive biases, failing to archive the record, treating exercises as unobserved rehearsals, denying or delaying after a narrative misstep, the peace-or-war binary when the <span class=\"t\" data-t=\"opponent\">opponent</span> is in permanent competition, technology as a substitute for <span class=\"t\" data-t=\"judgment\">judgment</span> of trust and value.", "selfcheck": ["Does every <span class=\"t\" data-t=\"plan\">plan</span> state its narrative, its audiences, and what must be denied — developed at problem framing, not after?", "Do my visible actions match my stated narrative, and do I fix the action rather than the message when they diverge?", "Have I mapped the existing narratives my audience already holds and nested mine inside them?", "Am I generating and archiving the record — screenshots, documents, history — that preserves credibility later?", "Is my OPSEC a
