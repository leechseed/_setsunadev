lead": "Capabilities bound intentions; perception drives action.", "body": "Capabilities rest on facts and can be estimated; intentions exist only in the enemy's mind and are the less certain estimate. What governs the enemy's action is his perception of his own capabilities, not our assessment of them."}, {"lead": "Mindset is indispensable and dangerous.", "body": "Without preconceptions no one could sort signal from noise in the mass of contradictory <span class=\"t\" data-t=\"information\">information</span>; with them, <span class=\"t\" data-t=\"information\">information</span> consistent with the <span class=\"t\" data-t=\"mindset\">mindset</span> reads as signal and everything else reads as noise. The great failures — Korea 1950, Israel 1973 — were interpretation failures with the <span class=\"t\" data-t=\"information\">information</span> already in hand."}, {"lead": "Intelligence is a product, not a provision.", "body": "It is generated by your own headwork and legwork, not delivered by an omniscient outside source. Once execution begins, organic means are the most reliable and responsive; basing action on the timely arrival of external <span class=\"t\" data-t=\"intelligence\">intelligence</span> is dangerous."}], "heuristics": [{"situation": "Starting an <span class=\"t\" data-t=\"intelligence\">intelligence</span> effort", "do": "<span class=\"t\" data-t=\"commander\">Commander</span> states a small number of priority <span class=\"t\" data-t=\"intelligence requirement\">intelligence requirements</span>, each tied to a decision that critically affects the mission", "not": "Ask for everything about the enemy and let the <span class=\"t\" data-t=\"intelligence\">intelligence</span> section decide what matters"}, {"situation": "Evaluating any <span class=\"t\" data-t=\"intelligence\">intelligence</span> product", "do": "Ask \"What effect does this have on our ability to accomplish the mission?\" — the So what?", "not": "Judge by volume, polish, or whether the cycle was followed"}, {"situation": "Judging the <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer", "do": "Judge whether the estimates supported decisions; demand frank estimates of enemy <span class=\"t\" data-t=\"possibilities\">possibilities</span>", "not": "Judge by predictive accuracy, so only \"safe\" facts and figures get offered"}, {"situation": "Reporting the picture", "do": "State what is known, what is not known, and how reliable each part is; present it as an <span class=\"t\" data-t=\"image\">image</span>, not a list", "not": "Present a confident picture that hides the gaps"}, {"situation": "A piece of <span class=\"t\" data-t=\"information\">information</span> is critical and time-sensitive", "do": "Disseminate it immediately with minimal evaluation; let the unit that has it produce", "not": "Hold it until the comprehensive product is finished"}, {"situation": "Enemy behavior looks irrational", "do": "See the <span class=\"t\" data-t=\"situation\">situation</span> as the enemy sees it — his values, his perceived capabilities, the <span class=\"t\" data-t=\"information\">information</span> he had", "not": "Dismiss it as irrational and therefore impossible"}, {"situation": "Estimating enemy action", "do": "Offer several scenarios — most likely, most dangerous — with their effect on friendly <span class=\"t\" data-t=\"plan\">plans</span>", "not": "Offer one confident prediction"}, {"situation": "Choosing sources", "do": "Match the source to the requirement and to the enemy's sophistication; use redundant, mutually confirming sources", "not": "Default to the most sophisticated or expensive sensor"}, {"situation": "Security vs dissemination", "do": "Classify to the minimum essential, sanitize to protect sources, ask \"who really needs this most?\" and send by the most direct channel", "not": "Compartment by reflex and route everything up the hierarchy"}, {"situation": "Collection is overloading production", "do": "Rebalance toward processing and production; one <span class=\"t\" data-t=\"phase\">phase</span> overemphasized starves the rest", "not": "Collect more"}, {"situation": "<span class=\"t\" data-t=\"training\">Training</span>", "do": "Generate <span class=\"t\" data-t=\"intelligence\">intelligence</span> during opposed free-play exercises", "not": "Pre-script the <span class=\"t\" data-t=\"intelligence\">intelligence</span> and use the <span class=\"t\" data-t=\"intelligence\">intelligence</span> staff as scenario writers"}], "concepts": [{"title": "What Intelligence Is and Does", "body": "Knowledge about the enemy and environment needed to support decisionmaking — several pictures of possible realities, not a mass of data. Two objectives: reduce <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> about the hostile <span class=\"t\" data-t=\"situation\">situation</span> to a reasonable level, and protect the <span class=\"t\" data-t=\"force\">force</span> through <span class=\"t\" data-t=\"counterintelligence\">counterintelligence</span>. Four tasks under the first: identify existing conditions and enemy capabilities; estimate enemy courses of action; identify friendly vulnerabilities the enemy may exploit; assist in developing and evaluating friendly courses of action. <span class=\"t\" data-t=\"intelligence\">Intelligence</span> is both exploitative (uncovers what can be attacked) and protective (warns)."}, {"title": "Descriptive and Estimative; Capabilities and Intentions", "body": "Descriptive <span class=\"t\" data-t=\"intelligence\">intelligence</span> covers what has been and what is: <span class=\"t\" data-t=\"basic intelligence\">basic intelligence</span> (slow-changing background — geography, culture, order of battle; most reliable, least decisive) and <span class=\"t\" data-t=\"current intelligence\">current intelligence</span> (the existing <span class=\"t\" data-t=\"situation\">situation</span> — dispositions, movements; more specific, less reliable). <span class=\"t\" data-t=\"estimative intelligence\">Estimative intelligence</span> anticipates possible futures — the most important and least reliable class. Descriptive answers what the enemy can and cannot do; estimative answers what he might and probably <span class=\"t\" data-t=\"will\">will</span> do. Neither is usable without the other."}, {"title": "Signals, Noise, and Mindset", "body": "Signals are pieces of <span class=\"t\" data-t=\"information\">information</span> that, properly interpreted, yield insight; noise is <span class=\"t\" data-t=\"information\">information</span> that is false, stale, ambiguous, misleading, or irrelevant — sometimes enemy deception, often not. The two are rarely distinguishable at the time. <span class=\"t\" data-t=\"mindset\">Mindset</span> — the set of assumptions and preconceptions — is the filter that makes sorting possible and the bias that makes it fail. The aim is a balanced <span class=\"t\" data-t=\"mindset\">mindset</span>: discriminating <span class=\"t\" data-t=\"judgment\">judgment</span> not so entrenched that it deafens you to alternative signals. The most valuable service <span class=\"t\" data-t=\"intelligence\">intelligence</span> personnel provide is unbiased analysis against dangerous preconceptions."}, {"title": "Priority Intelligence Requirements", "body": "The effort begins with receipt of the mission and the <span class=\"t\" data-t=\"commander\">commander</span>'s guidance; on-hand <span class=\"t\" data-t=\"intelligence\">intelligence</span> is never sufficient; the gaps are <span class=\"t\" data-t=\"intelligence requirement\">intelligence requirements</span>. Since gaps far exceed capability, the <span class=\"t\" data-t=\"commander\">commander</span> designates the few requirements associated with decisions that critically affect mission success as priority <span class=\"t\" data-t=\"intelligence requirement\">intelligence requirements</span>. They are the <span class=\"t\" data-t=\"commander\">commander</span>'s — not the <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer's — and they govern collection, production, and dissemination. Three clear PIRs let a Marine expeditionary unit recover a downed pilot in the hours available."}, {"title": "The Intelligence Cycle", "body": "Six interdependent <span class=\"t\" data-t=\"phase\">phases</span> — a description, not a procedure: <span class=\"t\" data-t=\"planning\">planning</span> and direction (requirements set, effort supervised; the <span class=\"t\" data-t=\"commander\">commander</span> directs, the <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer manages); collection (varied, redundant, overlapping sources); processing and exploitation (raw data into usable form); production (evaluate, analyze, integrate, interpret — synthesis, the most important step, which arranges the pieces into a coherent <span class=\"t\" data-t=\"image\">image</span> and answers the So what?); dissemination (pushed to users or pulled from an accessible base, by whatever means gets it there on time in usable form); utilization (decision and action — <span class=\"t\" data-t=\"command\">command</span>'s job, not <span class=\"t\" data-t=\"intelligence\">intelligence</span>'s). Overemphasis on any one <span class=\"t\" data-t=\"phase\">phase</span> starves the others."}, {"title": "Six Functions", "body": "Support the <span class=\"t\" data-t=\"commander\">commander</span>'s estimate of the <span class=\"t\" data-t=\"situation\">situation</span> (before execution — basis for the <span class=\"t\" data-t=\"plan\">plan</span>); <span class=\"t\" data-t=\"situation\">situation</span> development (during execution — basis for adjusting and exploiting); <span class=\"t\" data-t=\"indications and warnings\">indications and warnings</span> (alarms against developments that contradict <span class=\"t\" data-t=\"planning\">planning</span> assumptions); <span class=\"t\" data-t=\"force\">force</span> protection (estimate enemy <span class=\"t\" data-t=\"intelligence\">intelligence</span>, terrorism, and sabotage capabilities, recommend countermeasures); targeting (locate, portray, and weigh the vulnerability and importance of targets — shared with operations); <span class=\"t\" data-t=\"combat assessment\">combat assessment</span> (effects of friendly action on the enemy — the link back to the first <span class=\"t\" data-t=\"phase\">phase</span>)."}, {"title": "The Command–Intelligence–Operations Connection", "body": "The <span class=\"t\" data-t=\"commander\">commander</span>–<span class=\"t\" data-t=\"intelligence\">intelligence</span> officer relationship must be as close as <span class=\"t\" data-t=\"commander\">commander</span>–operations officer, which it rarely is by default. The <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer is an operator — \"everything the operations officer does, only in red ink\" — who anticipates requirements from the <span class=\"t\" data-t=\"commander's intent\">commander's intent</span>, plays devil's advocate in <span class=\"t\" data-t=\"planning\">planning</span>, gives a candid estimate, then supports the decision while keeping the detachment to say when the estimate looks wrong. <span class=\"t\" data-t=\"intelligence\">Intelligence</span> drives operations toward enemy weakness (Tinian's undefended northern beaches); operations feed <span class=\"t\" data-t=\"intelligence\">intelligence</span> (every operation collects). Every Marine is a source and a <span class=\"t\" data-t=\"counterintelligence\">counterintelligence</span> asset."}, {"title": "Generating Tempo Through Intelligence", "body": "Six techniques: prioritization (few PIRs, understood throughout the <span class=\"t\" data-t=\"force\">force</span>); decentralization (task-organize <span class=\"t\" data-t=\"intelligence\">intelligence</span> assets to subordinate <span class=\"t\" data-t=\"commander\">commanders</span> by <span class=\"t\" data-t=\"main effort\">main effort</span> and PIRs); <span class=\"t\" data-t=\"immediate production\">immediate production</span> (a conscious decision to disseminate critical <span class=\"t\" data-t=\"information\">information</span> before full analysis); accessibility (classify to the minimum, sanitize, rely on open sources); <span class=\"t\" data-t=\"image\">image</span> form (a graphic with annotation beats a text report); <span class=\"t\" data-t=\"information\">information</span> management (flow by <span class=\"t\" data-t=\"alarm channel\">alarm channels</span> — lateral, diagonal — not only the hierarchical pipeline). A captured document, disseminated the same day, produced three successful actions in a week. ---"}], "vocabulary": [{"term": "Intelligence", "definition": "Knowledge about the enemy and the surrounding environment needed to support decisionmaking; the analysis and synthesis of <span class=\"t\" data-t=\"information\">information</span> into knowledge"}, {"term": "Information", "definition": "Unevaluated material of any kind — the raw material from which <span class=\"t\" data-t=\"intelligence\">intelligence</span> is derived"}, {"term": "Counterintelligence", "definition": "Active and passive measures denying the enemy knowledge of the friendly <span class=\"t\" data-t=\"situation\">situation</span>; countering espionage, subversion, terrorism"}, {"term": "Basic intelligence", "definition": "Background knowledge of established, slowly changing conditions — most reliable, least time-sensitive, rarely decisive"}, {"term": "Current intelligence", "definition": "Description of the existing <span class=\"t\" data-t=\"situation\">situation</span> — more specific, less reliable, harder to obtain"}, {"term": "Estimative intelligence", "definition": "Anticipation of possible and probable futures — the most important and least reliable class"}, {"term": "Capabilities / Intentions", "definition": "What the enemy can do (rests on facts) / what he <span class=\"t\" data-t=\"will\">will</span> do (exists in his mind); capabilities bound intentions"}, {"term": "Signals / Noise", "definition": "<span class=\"t\" data-t=\"information\">Information</span> that yields insight when interpreted / <span class=\"t\" data-t=\"information\">information</span> that is false, stale, ambiguous, or irrelevant"}, {"term": "Mindset", "definition": "The set of assumptions, biases, and preconceptions that filters signal from noise — indispensable and hazardous"}, {"term": "Intelligence requirement", "definition": "A question about the enemy or environment whose answer the <span class=\"t\" data-t=\"commander\">commander</span> needs to decide soundly — a gap"}, {"term": "Priority intelligence requirement (PIR)", "definition": "An <span class=\"t\" data-t=\"intelligence requirement\">intelligence requirement</span> tied to a decision that critically affects mission success; the <span class=\"t\" data-t=\"commander\">commander</span>'s guidance to the effort"}, {"term": "Intelligence cycle", "definition": "<span class=\"t\" data-t=\"planning\">Planning</span> and direction → collection → processing and exploitation → production → dissemination → utilization"}, {"term": "Production / Synthesis", "definition": "Converting processed <span class=\"t\" data-t=\"information\">information</span> into <span class=\"t\" data-t=\"intelligence\">intelligence</span> — evaluate, analyze, integrate, interpret; the step that creates meaning"}, {"term": "Push / Pull", "definition": "Dissemination direct to users / dissemination to an accessible base users draw from"}, {"term": "Indications and warnings", "definition": "Alarms of potential hostile action running counter to <span class=\"t\" data-t=\"planning\">planning</span> assumptions"}, {"term": "Combat assessment", "definition": "Determining the effects of friendly action on the enemy; links utilization back to direction"}, {"term": "Immediate production", "definition": "Disseminating critical, time-sensitive <span class=\"t\" data-t=\"information\">information</span> before full analysis — production decentralized to the unit that has it"}, {"term": "Alarm channel", "definition": "Lateral or diagonal dissemination outside the hierarchical pipeline, to whoever needs it most"}, {"term": "\"In red ink\"", "definition": "The <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer as operator working from the enemy's perspective"}], "quotes": [{"quote": "It is not that one general is more brilliant or experienced than the other; it is a question of which general has a better appreciation of the battlefield.", "caption": ""}, {"quote": "<span class=\"t\" data-t=\"intelligence\">Intelligence</span> that is not acted upon or that does not provide the potential for future action is useless.", "caption": ""}, {"quote": "Many mistakes in <span class=\"t\" data-t=\"intelligence\">intelligence</span> are not the result of a failure to collect the correct <span class=\"t\" data-t=\"information\">information</span>, but rather a failure to discern the correct meaning from the <span class=\"t\" data-t=\"information\">information</span> collected.", "caption": ""}, {"quote": "The enemy <span class=\"t\" data-t=\"will\">will</span> do what he/she thinks is possible, not what we think he/she can do.", "caption": ""}, {"quote": "Just as <span class=\"t\" data-t=\"judgment\">judgment</span> is no substitute for good <span class=\"t\" data-t=\"intelligence\">intelligence</span>, <span class=\"t\" data-t=\"intelligence\">intelligence</span> is no substitute for good <span class=\"t\" data-t=\"judgment\">judgment</span>. The two must go hand in hand.", "caption": ""}, {"quote": "<span class=\"t\" data-t=\"intelligence\">Intelligence</span> failures are failures of <span class=\"t\" data-t=\"command\">command</span>—just as operations failures are <span class=\"t\" data-t=\"command\">command</span> failures.", "caption": ""}, {"quote": "The <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer does everything the operations officer does, only in red ink—meaning from the enemy, rather than friendly perspective.", "caption": ""}, {"quote": "To lack <span class=\"t\" data-t=\"intelligence\">intelligence</span> is to be in the ring blindfolded.", "caption": ""}], "doesnt_work": "Treating <span class=\"t\" data-t=\"intelligence\">intelligence</span> as wizardry or the private province of specialists, mistaking <span class=\"t\" data-t=\"information\">information</span> for knowledge, collecting more when the failure is interpretation, judging <span class=\"t\" data-t=\"intelligence\">intelligence</span> by how accurately it predicted reality, expecting <span class=\"t\" data-t=\"certainty\">certainty</span>, single-outcome predictions, capabilities without intentions or intentions without capabilities, assuming the enemy reasons as you do, rigid preconceptions that turn signals into noise, manipulating the product to support a preferred decision, over-classification, dissemination only through the hierarchy, inundating <span class=\"t\" data-t=\"commander\">commanders</span> with unfocused data, scripted exercise <span class=\"t\" data-t=\"intelligence\">intelligence</span>, depending on national or theater assets once execution starts, an <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer with a personal stake in a course of action, technology as a substitute for headwork and legwork, offering \"safe\" facts instead of frank estimates.", "selfcheck": ["Have I stated a few priority <span class=\"t\" data-t=\"intelligence requirement\">intelligence requirements</span>, each tied to a decision I must make?", "Does every product I receive answer \"So what for the mission?\"", "Do I know what I do not know, and how reliable what I know is?", "Am I judging estimates by whether they helped me decide, not by whether they came true?", "Have I looked at the <span class=\"t\" data-t=\"situation\">situation</span> through the other side's eyes — their perceived capabilities and values?", "Is critical, time-sensitive <span class=\"t\" data-t=\"information\">information</span> moving immediately by the most direct channel?", "Am I generating <span class=\"t\" data-t=\"intelligence\">intelligence</span> with my own means rather than waiting on a provider?", "Did I <span class=\"t\" data-t=\"act\">act</span> on the last thing I learned — did the loop close in a decision?"], "selfcheck_note": "", "application": [{"lead": "Intelligence as problem-framing input → PIRs before research.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the effort begins with receipt of the mission and the <span class=\"t\" data-t=\"commander\">commander</span>'s guidance; gaps become requirements; a few PIRs tied to decisions <span class=\"t\" data-t=\"focus\">focus</span> everything. Translation: before the AI partner researches anything, the operator names the two or three questions whose answers would change the decision. Research without a PIR is collection without direction, and it produces overload."}, {"lead": "Commander owns the estimate → operator decides, partner recommends.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer gives a candid estimate and plays devil's advocate; the <span class=\"t\" data-t=\"commander\">commander</span> makes the final synthesis and owns the decision. Translation: the partner's job is the frank estimate, including \"most dangerous\" and \"what we don't know\"; the operator's job is the decision — the exact point where the recurring stall lives. An estimate that has been delivered and waits on a decision has done its work; the outstanding item is the decision."}, {"lead": "Intelligence cycle → the corpus and taxonomy pipeline.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: direction → collection → processing → production → dissemination → utilization, production (synthesis) being the step that creates meaning, all <span class=\"t\" data-t=\"phase\">phases</span> in balance. Translation: BVX-LEARN one-sheets are production, not collection; the CORE THESIS is the So what?; the <code>feeds:</code> block is dissemination to the layer that <span class=\"t\" data-t=\"will\">will</span> utilize it. More PDFs without more one-sheets is the imbalance the <span class=\"t\" data-t=\"doctrine\">doctrine</span> names."}, {"lead": "Sit rep and BOLO capture → pipeline and alarm.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: <span class=\"t\" data-t=\"intelligence\">intelligence</span> flows by hierarchical pipeline and by <span class=\"t\" data-t=\"alarm channel\">alarm channel</span> — lateral, immediate, to whoever needs it most. Translation: <i>sit rep</i> is the pipeline, delivered on request in the fixed block format; BOLO capture \"the same turn it is spoken\" is the <span class=\"t\" data-t=\"alarm channel\">alarm channel</span> — <span class=\"t\" data-t=\"immediate production\">immediate production</span>, disseminated before full analysis."}, {"lead": "Estimates not certainties → status language.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: report what is known, what is not, and the reliability of each; present coherent <span class=\"t\" data-t=\"image\">images</span> rather than lists. Translation: STATE.md carries active / blocked / unknown and never a false-complete picture; the house format's ten-second scan test is the <span class=\"t\" data-t=\"doctrine\">doctrine</span>'s \"meaningful <span class=\"t\" data-t=\"image\">image</span>, easily assimilated.\""}, {"lead": "Signals and noise → \"boresight\" the estimate.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: <span class=\"t\" data-t=\"information\">information</span> consistent with the <span class=\"t\" data-t=\"mindset\">mindset</span> reads as signal; the most valuable service is unbiased analysis against dangerous preconceptions. Translation: when a project \"has always been blocked on X,\" <i>boresight</i> means the partner tests whether X is still the block before anyone <span class=\"t\" data-t=\"act\">acts</span> on it. Israel 1973 is what a locked estimate costs."}, {"lead": "Product, not provision → read the sources.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: do not base action on the timely arrival of external <span class=\"t\" data-t=\"intelligence\">intelligence</span>; be self-sufficient with organic means. Translation: the operation reads its own texts — full pdftotext dumps, not summaries of summaries — and generates its own one-sheets."}], "marks": []}, {"id": "MIL.06", "bvx_id": "BVX.1116", "title": "MCDP 3 Expeditionary Operations", "author": "U.S. Marine Corps (HQMC)", "year": "1998", "edition": "Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "maneuver-warfare", "expeditionary", "crisis-response", "naval-power", "omfts", "adaptability"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997)", "🧬 MIL.05 — MCDP 2 Intelligence — USMC (1997)", "🧬 MIL.07 — MCDP 4 Logistics — USMC (2023)", "🧬 MIL.10 — MCDP 7 Learning — USMC (2020)"], "feeds": [{"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "Projection sequence (predeployment → deployment → entry → enabling → decisive → redeployment) is a project lifecycle; exit strategy decided at entry; closure of capable, sustainable force over first arrival; expandability; reconstitution."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "primary", "note": "Expeditionary is a mindset before it is an organization — bags packed, austere, no larger or heavier than necessary, a learning organization."}, {"layer": "01_NARRATIVE_FRAMEWORKS", "variable": "conflict_theory", "strength": "secondary", "note": "Disaster → disruption → dispute escalation ladder; fragmentation/integration coupling; nonstate actors and asymmetric means — a model of how instability becomes open contest."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Reconstitution and redeployment are the doctrine behind 'Oscar Mike' and 'sweep'; the rheostat of phased commitment governs how much to bring ashore."}], "file": "🧬 MIL.06 — MCDP 3 Expeditionary Operations — USMC (1998).md", "thesis": "In a post-Cold-War world of crises that are smaller, more frequent, more varied, and concentrated in the urbanized <span class=\"t\" data-t=\"littoral\">littorals</span> of the developing world, national interest requires a <span class=\"t\" data-t=\"force\">force</span> that is expeditionary first as a <span class=\"t\" data-t=\"mindset\">mindset</span> — bags packed, austere, adaptable, self-sustaining — and that projects power into a foreign setting quickly by sea, no larger or heavier than the mission requires, sets the conditions for decisive action, and withdraws or reconstitutes for the next mission; the Marine Corps is organized as that <span class=\"t\" data-t=\"force\">force</span>, and its capstone operating concept is <span class=\"t\" data-t=\"operational maneuver from the sea\">Operational Maneuver from the Sea</span>. ---", "invariants": [{"lead": "Expeditionary is a mindset before it is an organization, equipment, or tactic.", "body": "\"Bags packed\" — ready and willing to deploy on a moment's notice, any time, any place, any mission — with a Spartan pride in enduring austerity. The <span class=\"t\" data-t=\"mindset\">mindset</span> is a product of <span class=\"t\" data-t=\"training\">training</span> and institutional culture and must be continuously imparted."}, {"lead": "An expedition is temporary and austere by definition.", "body": "Temporary: the intent is to withdraw after the specified mission; a permanent or indefinite presence is a station, not an <span class=\"t\" data-t=\"expedition\">expedition</span>. Austere: no larger or heavier than necessary; supplies and infrastructure limited to operational necessity; operational considerations prevail over quality of life."}, {"lead": "Threats have decreased in magnitude and increased in number, frequency, and variety.", "body": "The environment is <span class=\"t\" data-t=\"disorder\">disorder</span> — disasters, disruptions, disputes — in the developing world's <span class=\"t\" data-t=\"littoral\">littorals</span>, driven increasingly by nonstate actors using asymmetric and cheap lethal means. A crisis-response <span class=\"t\" data-t=\"force\">force</span> is designed for range, not against one threat."}, {"lead": "There is no alternative to the sea for moving and sustaining sizable forces, or to naval power for global projection.", "body": "The sea is at once an avenue for friendly movement, a barrier to the enemy, a secure and retrievable base, and a means of avoiding disadvantageous engagement."}, {"lead": "What matters is how fast capable, sustainable forces close — not how fast the first forces arrive.", "body": "The initial <span class=\"t\" data-t=\"force\">force</span> at a crisis is rarely the decisive <span class=\"t\" data-t=\"force\">force</span>, so the organization must expand in theater without losing continuity of operational capability."}, {"lead": "Forcible-entry capability is a permanent requirement.", "body": "Environments fluctuate between permissive and hostile, the level of hostility changes quickly, and entry is the period of greatest <span class=\"t\" data-t=\"risk\">risk</span>."}, {"lead": "Exit is part of the entry decision.", "body": "Every <span class=\"t\" data-t=\"expedition\">expedition</span> redeploys; departure must maintain the desired political <span class=\"t\" data-t=\"situation\">situation</span>; the transition to a longer-lasting presence is often the hardest <span class=\"t\" data-t=\"phase\">phase</span>."}, {"lead": "Cost-effectiveness is economy of force, not cheapness.", "body": "Too small a commitment early leads at best to a larger commitment later and at worst to a failed mission; the standard is no greater cost or commitment than is necessary to accomplish the mission properly."}, {"lead": "Adaptability requires a learning organization.", "body": "Self-critical, changing quickly on experience, with innovation bubbling up from operating units as well as descending from programs. Leaders exercise <span class=\"t\" data-t=\"judgment\">judgment</span> on <span class=\"t\" data-t=\"situational awareness\">situational awareness</span> rather than applying techniques by rote."}], "heuristics": [{"situation": "Sizing the <span class=\"t\" data-t=\"force\">force</span>", "do": "Task-organize to the mission from modular building blocks; no larger or heavier than necessary; bring everything needed", "not": "Deploy the standard package; build the garrison"}, {"situation": "A crisis is developing", "do": "Close the nearest capable, sustainable <span class=\"t\" data-t=\"force\">force</span>; loiter offshore if needed; expand by echelon behind it", "not": "Wait until the decisive <span class=\"t\" data-t=\"force\">force</span> is assembled; send first-arrivers who cannot sustain themselves"}, {"situation": "Deciding to intervene", "do": "Decide the exit and the redeployment at the same time as the entry", "not": "Enter now and work out the departure later"}, {"situation": "Choosing how to enter", "do": "Use the sea as an avenue; land where the enemy is weak at the time and place of your choosing; maneuver ship-to-objective", "not": "Seize a beachhead, build up supplies, then fight a pitched battle to break out"}, {"situation": "Basing the <span class=\"t\" data-t=\"force\">force</span>", "do": "Sea-base what can be sea-based — aviation, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"command and control\">command and control</span> — to shrink the footprint, the rear-area security bill, and the redeployment burden", "not": "Establish large supply dumps ashore that dictate and limit operational direction and range"}, {"situation": "Mission complete, another emerging", "do": "Reconstitute — regenerate, reorganize, replenish, reorient from the forward position", "not": "Return to home base to reset"}, {"situation": "Operating short of war", "do": "Expect restrictive rules of engagement, host-nation coordination, and daily media; measure success by the political condition", "not": "Apply combat-optimized methods and search for a clean military objective that is not there"}, {"situation": "An <span class=\"t\" data-t=\"improvisation\">improvisation</span> works", "do": "Turn it into innovation — adopt, refine, institutionalize, pass on", "not": "Treat it as a one-off and wait for a formal program"}, {"situation": "Designing the organization", "do": "Balanced, general-purpose, routinely reorganized", "not": "Specialized single-mission units whose effectiveness reorganization degrades"}, {"situation": "Infrastructure is inadequate", "do": "Offload pierside or at sea; operate from austere sites; bring the support with you", "not": "Wait for a deep-draft port and a large airfield"}], "concepts": [{"title": "The Landscape — Disaster, Disruption, Dispute", "body": "Crises fall into three classes: disasters (calamities causing mass suffering, natural or manmade), disruptions (intentional <span class=\"t\" data-t=\"disorder\">disorder</span> — insurgency, terrorism, crime — sufficient to interfere with government function), and disputes (open clash between political groups, internal or external). They escalate: a disaster becomes a disruption when the response fails; a disruption becomes a dispute when the disruptive element can openly challenge authority. Drivers: simultaneous fragmentation and integration (\"<span class=\"t\" data-t=\"fragmegration\">fragmegration</span>\") producing a tightly coupled, sensitive global system; population growth, urbanization, and the youth bulge in the developing world; 60 percent of humanity within 100 kilometers of the sea; cheap, lethal, unregulable <span class=\"t\" data-t=\"weapon\">weapons</span>; nonstate actors who <span class=\"t\" data-t=\"will\">will</span> not fight on our terms."}, {"title": "Expeditionary Operations Defined", "body": "An <span class=\"t\" data-t=\"expedition\">expedition</span> is a military operation to accomplish a specific objective in a foreign country; its defining characteristic is the projection of <span class=\"t\" data-t=\"force\">force</span> into a foreign setting — deployment to the scene with the support to sustain it, some distance from home. Power projection is necessary but not sufficient; operations without actual deployment are not expeditionary. Presence works only because of demonstrated capability to land. <span class=\"t\" data-t=\"logistics\">Logistics</span> — mounting the <span class=\"t\" data-t=\"expedition\">expedition</span> — is central. Composition follows mission: aviation with a security <span class=\"t\" data-t=\"force\">force</span>, combat service support for relief, a battalion on two ships for an embassy evacuation, two million troops for a world war."}, {"title": "The Sequence of Projection", "body": "Predeployment (organize the deployment so <span class=\"t\" data-t=\"force\">forces</span> arrive in logical sequence with the right equipment and <span class=\"t\" data-t=\"sustainment\">sustainment</span>) → deployment (airlift fastest but needs a secure airhead; sealift the only way to move significant sustainable <span class=\"t\" data-t=\"force\">force</span>; prepositioning combines both) → entry (introduction onto foreign soil — greatest <span class=\"t\" data-t=\"risk\">risk</span>; needs an entry point; <span class=\"t\" data-t=\"forcible entry\">forcible entry</span> the hardest case) → enabling actions (seize the port or airfield, establish <span class=\"t\" data-t=\"logistics\">logistics</span>, restore initial order — set the stage) → decisive actions (create the conditions that accomplish the political objective) → redeployment (depart or transition to a longer-lasting presence in a way that maintains the political result). A framework for thinking, not prescribed <span class=\"t\" data-t=\"phase\">phases</span>."}, {"title": "The Expeditionary Mindset", "body": "Bags packed. Every Marine is part of an organization designed to project <span class=\"t\" data-t=\"force\">force</span> overseas, and all operating <span class=\"t\" data-t=\"force\">forces</span> — not selected ready units — stay deployable. Spartan attitude: embarkation boxes for bookcases even in garrison. Versatility and <span class=\"t\" data-t=\"adaptability\">adaptability</span> to respond without much preparation time to a broad range of circumstances, and a global perspective oriented to diverse threats rather than one region."}, {"title": "Requirements of an Expeditionary Force", "body": "Naval character (the sea for mobility, <span class=\"t\" data-t=\"sea basing\">sea basing</span>, <span class=\"t\" data-t=\"forcible entry\">forcible entry</span> — amphibious landing is the Marine Corps' specialty). Strategic mobility — <span class=\"t\" data-t=\"closure rate\">closure rate</span> and <span class=\"t\" data-t=\"reach\">reach</span> — through forward-deployed <span class=\"t\" data-t=\"magtf\">MAGTFs</span> afloat (continuous movement, indefinite loiter), maritime prepositioning, and rapid deployability by sea and air. Operational mobility along the coast, using the sea as an avenue of approach (Inchon). <span class=\"t\" data-t=\"competence\">Competence</span> — the consistent ability to get things done, built on experience above all. <span class=\"t\" data-t=\"sustainability\">Sustainability</span>, including self-contained <span class=\"t\" data-t=\"sustainment\">sustainment</span> until a theater system exists, and the advantage of a <span class=\"t\" data-t=\"force\">force</span> that can operate austerely. <span class=\"t\" data-t=\"adaptability\">Adaptability</span> through <span class=\"t\" data-t=\"improvisation\">improvisation</span> (an untested response to the unexpected) and innovation (systematic adoption of what works). <span class=\"t\" data-t=\"reconstitution\">Reconstitution</span> — regenerate and reorient for a new mission from forward without returning home. Cost-effectiveness through forward deployment, routine proficiency at deploying, and versatile equipment."}, {"title": "The MAGTF", "body": "The Marine air-ground task <span class=\"t\" data-t=\"force\">force</span> is the principal organization for every mission: a balanced combined-arms <span class=\"t\" data-t=\"force\">force</span> with four elements — <span class=\"t\" data-t=\"command\">command</span>, ground combat, aviation combat, combat service support — task-organized from building blocks so that reorganization is routine rather than degrading. Sizes: the Marine expeditionary <span class=\"t\" data-t=\"force\">force</span> (division, wing, <span class=\"t\" data-t=\"force\">force</span> service support group; 60 days' <span class=\"t\" data-t=\"sustainment\">sustainment</span>; deploys by echelon behind a MEF (Forward)); the MEU(SOC) (reinforced battalion, composite squadron, 15 days; the standing forward-deployed <span class=\"t\" data-t=\"force\">force</span>, often first on scene, conducting enabling actions for what follows); the special purpose <span class=\"t\" data-t=\"magtf\">MAGTF</span> for a narrow mission. Expandability without loss of continuity is the key design feature; sea-based <span class=\"t\" data-t=\"magtf\">MAGTFs</span> give decision-makers a <span class=\"t\" data-t=\"rheostat\">rheostat</span> of options for how much to put ashore."}, {"title": "Operational Maneuver from the Sea", "body": "The capstone concept: an amphibious operation that uses the sea as an avenue for maneuvering against an operational-level objective — a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> or <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> — at the time and place of our choosing, avoiding <span class=\"t\" data-t=\"strength\">strengths</span> and striking weakness. Two aspects: operational maneuver (turning the flank, threatening lines of operation — Inchon, the Marianas) and from the sea (move by sea, deploy near the crisis, project and sustain from the sea, redeploy to it). Implementing concepts: <span class=\"t\" data-t=\"ship-to-objective maneuver\">ship-to-objective maneuver</span>, which fuses the ship-to-shore movement and \"subsequent operations ashore\" into one decisive maneuver, eliminating the beachhead buildup that gave defenders time; and <span class=\"t\" data-t=\"sea basing\">sea basing</span> of aviation, <span class=\"t\" data-t=\"logistics\">logistics</span>, and most <span class=\"t\" data-t=\"command and control\">command and control</span>, which frees the landing <span class=\"t\" data-t=\"force\">force</span> from protecting dumps ashore and enlarges its freedom of action. Applies across the range of operations, not only high-end combat."}, {"title": "Supporting Concepts", "body": "Sustained operations ashore: <span class=\"t\" data-t=\"magtf\">MAGTFs</span> fighting essentially as land <span class=\"t\" data-t=\"force\">forces</span> within a joint <span class=\"t\" data-t=\"force\">force</span>, best employed as independent, self-contained combined-arms formations (Desert Storm). Military operations other than war: political constraints dominate, objectives are limited and hard to measure, host-nation and media coordination is daily, and most still apply <span class=\"t\" data-t=\"operational maneuver from the sea\">operational maneuver from the sea</span> principles (Eastern Exit: 466 nautical miles, two refuelings, less than 24 hours). <span class=\"t\" data-t=\"maritime prepositioning force\">Maritime prepositioning force</span> operations: a deployment concept — fly-in echelon linked with prepositioned ships (one squadron equals more than 3,000 airlift sorties; a MEF lead echelon ready within days); no forcible-entry capability alone; future pillars are at-sea <span class=\"t\" data-t=\"force\">force</span> closure, integration with the amphibious task <span class=\"t\" data-t=\"force\">force</span>, indefinite sea-based <span class=\"t\" data-t=\"sustainment\">sustainment</span>, and in-theater <span class=\"t\" data-t=\"reconstitution\">reconstitution</span>. ---"}], "vocabulary": [{"term": "Expedition", "definition": "A military operation by an armed <span class=\"t\" data-t=\"force\">force</span> to accomplish a specific objective in a foreign country"}, {"term": "Expeditionary mindset / \"bags packed\"", "definition": "Readiness and willingness to deploy on a moment's notice, anywhere, for any mission, with a Spartan acceptance of austerity"}, {"term": "Disaster / Disruption / Dispute", "definition": "Mass-suffering calamity / intentional <span class=\"t\" data-t=\"disorder\">disorder</span> interfering with government / open clash between political groups — the three crisis classes and their escalation ladder"}, {"term": "Fragmegration", "definition": "Simultaneous political fragmentation and economic integration producing a tightly coupled, disruption-sensitive global system"}, {"term": "Littoral", "definition": "Where land and sea meet — home to most population, trade, growth, and conflict"}, {"term": "Closure rate", "definition": "How quickly a <span class=\"t\" data-t=\"force\">force</span> can close on an objective area once tasked"}, {"term": "Reach", "definition": "The geographic limits to which a <span class=\"t\" data-t=\"force\">force</span> can deploy and sustain credible power"}, {"term": "Strategic / Operational / Tactical mobility", "definition": "Theater to theater / between engagements within a theater / in combat"}, {"term": "Forcible entry", "definition": "Introduction of <span class=\"t\" data-t=\"force\">forces</span> in the face of organized, armed resistance; seizing a lodgment by combat"}, {"term": "Entry / Enabling actions / Decisive actions", "definition": "Initial introduction onto foreign soil / preparatory actions that set the stage / actions that accomplish the political objective"}, {"term": "Exit strategy", "definition": "The planned redeployment that maintains the desired political <span class=\"t\" data-t=\"situation\">situation</span> — decided at entry"}, {"term": "Sustainability", "definition": "The ability to maintain the necessary level and duration of operational activity to achieve objectives"}, {"term": "Reconstitution", "definition": "Regenerating, reorganizing, replenishing, and reorienting for a new mission from the forward position without returning to home base"}, {"term": "Improvisation / Innovation", "definition": "An untested response to a specific unexpected condition / the systematic adoption of new methods, often an <span class=\"t\" data-t=\"improvisation\">improvisation</span> that proved general"}, {"term": "MAGTF", "definition": "Marine air-ground task <span class=\"t\" data-t=\"force\">force</span> — <span class=\"t\" data-t=\"command\">command</span>, ground combat, aviation combat, and combat service support elements, task-organized"}, {"term": "MEF / MEU(SOC) / SPMAGTF", "definition": "Principal warfighting organization (60 days) / standard forward-deployed unit (15 days) / narrow-mission <span class=\"t\" data-t=\"force\">force</span>"}, {"term": "Rheostat", "definition": "The sea-based <span class=\"t\" data-t=\"magtf\">MAGTF</span>'s ability to vary the composition, scope, and size of <span class=\"t\" data-t=\"force\">force</span> phased ashore"}, {"term": "Sea basing", "definition": "Keeping fires, <span class=\"t\" data-t=\"command and control\">command and control</span>, aviation, and <span class=\"t\" data-t=\"logistics\">logistics</span> afloat to shrink the footprint ashore and enlarge freedom of action"}, {"term": "Operational Maneuver from the Sea", "definition": "Capstone concept: using the sea to maneuver against an operational objective, striking weakness at the time and place of our choosing"}, {"term": "Ship-to-objective maneuver", "definition": "Fusing the ship-to-shore movement and subsequent operations into one decisive maneuver, skipping the beachhead buildup"}, {"term": "Maritime prepositioning force", "definition": "Prepositioned shipping plus a fly-in echelon — rapid assembly of a <span class=\"t\" data-t=\"magtf\">MAGTF</span> in a forward area"}, {"term": "MOOTW", "definition": "Military operations other than war — the use of military capability short of war, politically constrained"}], "quotes": [{"quote": "For the Marine Corps, being 'expeditionary' is, before anything else, a <span class=\"t\" data-t=\"mindset\">mindset</span>.", "caption": ""}, {"quote": "This does not mean that an expeditionary <span class=\"t\" data-t=\"force\">force</span> is necessarily small or lightly equipped, but that it is no larger or heavier than necessary to accomplish the mission.", "caption": ""}, {"quote": "What matters, however, is not just how quickly the first <span class=\"t\" data-t=\"force\">forces</span> can deploy; it is the <span class=\"t\" data-t=\"speed\">speed</span> at which capable, sustainable <span class=\"t\" data-t=\"force\">forces</span> can deploy.", "caption": ""}, {"quote": "An '<span class=\"t\" data-t=\"exit strategy\">exit strategy</span>' therefore must be an important consideration in both the initial decision to take <span class=\"t\" data-t=\"military action\">military action</span> and the conduct of operations.", "caption": ""}, {"quote": "Too small a commitment early may lead at best to an unnecessarily larger commitment later and at worst to a failed mission.", "caption": ""}, {"quote": "<span class=\"t\" data-t=\"adaptability\">Adaptability</span> requires a <span class=\"t\" data-t=\"learning organization\">learning organization</span>—an organization that is self-critical and is able to change quickly in response to its experiences.", "caption": ""}, {"quote": "While arguably threats to national security have decreased in magnitude, they have increased in number, frequency, and variety.", "caption": ""}, {"quote": "Word came on May 27 that another revolution was in full swing at Bluefields, on the east coast of Nicaragua. We received orders to leave at eight thirty in the morning and by eleven thirty were on our way—two hundred and fifty officers and men.", "caption": ""}], "doesnt_work": "Preparing against a single known enemy, garrison assumptions and permanent-station habits, heavy footprints ashore, beachhead buildup followed by breakout, measuring response by the arrival of the first units, undersizing the early commitment to save cost, deciding entry without exit, single-mission organizations that reorganization degrades, innovation only from formal top-down programs, waiting for deep-draft ports and large airfields, combat-optimized methods in operations short of war, expeditionary as equipment rather than <span class=\"t\" data-t=\"mindset\">mindset</span>, land-based staging dependent on host-nation permission, quality-of-life over operational considerations, selected ready units instead of a fully deployable <span class=\"t\" data-t=\"force\">force</span>, judging readiness by the scale of what can be brought rather than by what the mission needs.", "selfcheck": ["Are my bags packed — could I start the next mission on a moment's notice with what I already have?", "Is this <span class=\"t\" data-t=\"force\">force</span>, kit, or <span class=\"t\" data-t=\"plan\">plan</span> no larger or heavier than the mission needs?", "Do I know the exit condition before I enter?", "Am I closing a capable, sustainable capability rather than arriving fast and unsupported?", "Have I separated enabling actions from decisive actions in this effort?", "Can I reconstitute from where I am, or must I go home to reset?", "Is my support light and retrievable — sea-based — rather than piled ashore?", "When an <span class=\"t\" data-t=\"improvisation\">improvisation</span> works, do I institutionalize it?", "Am I designed for a range of crises, not one favorite threat?"], "selfcheck_note": "", "application": [{"lead": "Expeditionary mindset → launch light with what you have.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: expeditionary is a state of mind — bags packed, Spartan, versatile, global; embarkation boxes for bookcases. Translation: a project starts with the sources on hand and the kit already in the repo; the standard project flow (BOLO 25) must be runnable from a cold start with no assembly period; the working set stays portable."}, {"lead": "Sequence of projection → the project lifecycle.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: predeployment → deployment → entry → enabling → decisive → redeployment, a framework not <span class=\"t\" data-t=\"phase\">phases</span>; entry is the riskiest moment; enabling sets the stage, decisive accomplishes the objective. Translation: read STATE.md (predeployment), open the working set (deployment), first artifact committed (entry), format contract and scaffolding (enabling), the deliverable (decisive), cache note + STATE update + <code>_LOG/</code> move (redeployment). Naming the <span class=\"t\" data-t=\"phase\">phase</span> exposes the stall: most stalls are enabling actions mistaken for decisive ones."}, {"lead": "Exit strategy → define done at \"how copy.\"", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the exit is part of the entry decision and departure must preserve the political result. Translation: every line in STATE.md carries its exit condition; <i>how copy?</i> is the moment the exit condition is read back before execution starts."}, {"lead": "Closure of capable, sustainable force → the first deliverable must stand on its own.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: first arrival is not the metric; capable, sustainable <span class=\"t\" data-t=\"force\">force</span> closing is; the organization expands without losing continuity. Translation: a fast draft nobody can build on is first-arrivers without <span class=\"t\" data-t=\"sustainment\">sustainment</span>; the first artifact is the one later work expands — the template, the frontmatter schema, the <code>feeds:</code> wiring."}, {"lead": "Reconstitution → \"Oscar Mike\" and \"sweep.\"", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: regenerate, reorganize, replenish, and reorient for a new mission from the forward position without returning home. Translation: <i>Oscar Mike</i> parks the current work in place and moves to the next mission with the same kit; <i>sweep</i> is the redeployment that promotes and clears. The operation never returns to zero to reset."}, {"lead": "Sea basing and small footprint → retrievable support.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: keep <span class=\"t\" data-t=\"logistics\">logistics</span>, aviation, and <span class=\"t\" data-t=\"command and control\">command and control</span> afloat; reduce what must be protected ashore; simplify redeployment. Translation: scratchpad for working files, repo for the deliverable, nothing accumulating in the project that is not the mission; what is easily retrieved is easily left behind."}, {"lead": "Enabling vs decisive → sit rep Block IV.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the initial <span class=\"t\" data-t=\"force\">force</span> sets conditions; decisive actions accomplish the objective; a <span class=\"t\" data-t=\"force\">force</span> that only enables has not finished. Translation: the PMCS/BOLO block separates maintenance (enabling) from the <span class=\"t\" data-t=\"main effort\">main effort</span> (decisive); a sit rep that shows only enabling actions for several sessions is the warning the <span class=\"t\" data-t=\"doctrine\">doctrine</span> gives."}, {"lead": "Disaster → disruption → dispute → escalation ladder.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: a disaster becomes a disruption when the response fails; a disruption becomes a dispute when the disruptive element can openly challenge authority. Translation: for the collision engine, a three-rung model of how a story world's instability becomes open contest; for the operation, a triage for incoming problems — accident, sabotage, or contest — each with a different response."}], "marks": []}, {"id": "MIL.07", "bvx_id": "BVX.1117", "title": "MCDP 4 — Logistics", "author": "U.S. Marine Corps (HQMC)", "year": "2023", "edition": "2023 edition", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "logistics", "sustainment", "planning", "risk", "readiness", "maneuver-warfare"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997)", "🧬 MIL.06 — MCDP 3 Expeditionary Operations — USMC (1998)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)"], "feeds": [{"layer": "BOLO", "variable": "pmcs_readiness", "strength": "primary", "note": "Sustainment is the maintenance-and-resupply loop that keeps the force from culminating. The PMCS table is the operator's logistics visibility: demand (BOLO watchlist) against supply (readiness state). 'Logistics is like oxygen, transparent to the user unless in short supply.'"}, {"layer": "oscar-mike/lab-venture", "variable": "gates_sheet", "strength": "primary", "note": "Attainability is the doctrinal go/no-go gate: the commander judges that sufficient support exists to initiate at acceptable risk. Every venture gate is an attainability decision — runway, tooling, attention — made explicitly and communicated."}, {"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "secondary", "note": "Concept of operations is built on what can be done logistically, not the reverse. The flow gets a sustainment line at the brief stage (understand environment → develop options → shape → visibility → adjust → risk) and a culminating-point check at every phase boundary."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "secondary", "note": "Accrual is slower than expenditure; effectiveness and efficiency trade; every node is a target; demand discipline is a system property (the snowball effect)."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Logistics visibility = demand visibility + supply visibility, processed to shared understanding, not a stock snapshot. That is the content standard for sit rep Block IV."}], "file": "🧬 MIL.07 — MCDP 4 Logistics — USMC (2023).md", "thesis": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is both the engine and the governor of every operation — it sets the outer boundary of what is strategically achievable, operationally feasible, and tactically possible — so the <span class=\"t\" data-t=\"commander\">commander</span> who builds the concept of operations on what the <span class=\"t\" data-t=\"force\">force</span> can actually be moved and sustained to do, and who designs that <span class=\"t\" data-t=\"sustainment\">sustainment</span> to be responsive, simple, and survivable under attack, <span class=\"t\" data-t=\"reach\">reaches</span> the objective before the <span class=\"t\" data-t=\"force\">force</span> culminates. ---", "invariants": [{"lead": "Logistics enables and limits.", "body": "It gives a <span class=\"t\" data-t=\"force\">force</span> <span class=\"t\" data-t=\"reach\">reach</span>, freedom of action, and endurance, and it sets the parameters on all three. A <span class=\"t\" data-t=\"force\">force</span> attacking loses <span class=\"t\" data-t=\"strength\">strength</span> as it goes; every <span class=\"t\" data-t=\"plan\">plan</span> has a <span class=\"t\" data-t=\"culminating point\">culminating point</span>, and a <span class=\"t\" data-t=\"plan\">plan</span> that ignores <span class=\"t\" data-t=\"logistics\">logistics</span> capacity <span class=\"t\" data-t=\"reach\">reaches</span> it before the objective."}, {"lead": "Logistics is defined by results, not activities.", "body": "The measure is the supported <span class=\"t\" data-t=\"force\">force</span>'s ability to achieve advantage against a thinking <span class=\"t\" data-t=\"opponent\">opponent</span>, not tonnage moved or reports filed. Right support, right place, right time — or it did not happen."}, {"lead": "Accrual is slower than expenditure.", "body": "It takes longer and more effort to build supplies, relationships, places, and platforms than to consume them. <span class=\"t\" data-t=\"responsiveness\">Responsiveness</span> is therefore bought before the need, never at the moment of need."}, {"lead": "Every logistics node is a target.", "body": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is a critical requirement and therefore a focal point for attack. Disruption is not an anomaly to be handled if it occurs; it is the <span class=\"t\" data-t=\"planning\">planning</span> assumption. Survivability — avoidance, dispersion, hardening, mass, deception, regeneration — is designed in."}, {"lead": "Effectiveness and efficiency trade against each other.", "body": "Effectiveness is outcome-based regardless of cost; efficiency is minimum resources at acceptable <span class=\"t\" data-t=\"risk\">risk</span>. Every design (chain vs. web, push vs. pull, organic vs. outsourced) buys one with the other. The balance is a <span class=\"t\" data-t=\"judgment\">judgment</span>, and it is the art."}, {"lead": "Demand discipline is a system property.", "body": "One unit's \"little extra just in case\" is trivial; repeated across the <span class=\"t\" data-t=\"force\">force</span> it becomes the <span class=\"t\" data-t=\"logistics snowball effect\">logistics snowball effect</span> — cumulative false demand that undercuts prioritization and diverts support from real need. Discipline is trained in peace so it holds in crisis."}, {"lead": "The commander owns logistics; teams execute it on trust.", "body": "Responsibility cannot be delegated to the logistician. Unity of effort across many organizations with no single chain of <span class=\"t\" data-t=\"command\">command</span> runs on trust — the conviction that those requesting and providing support are capable, reliable, and dependable."}, {"lead": "Logistics is science inside art.", "body": "The science calculates requirements from usage data and densities. The art anticipates how enemy action changes the calculation and keeps multiple paths open. Calculation without anticipation is a <span class=\"t\" data-t=\"plan\">plan</span> for a war that <span class=\"t\" data-t=\"will\">will</span> not happen."}], "heuristics": [{"situation": "Building a concept of operations", "do": "Base it on what you know you can do logistically; run feasibility before committing", "not": "Design the operation, then hand it to <span class=\"t\" data-t=\"logistics\">logistics</span> to make work"}, {"situation": "Deciding whether to initiate", "do": "Judge <span class=\"t\" data-t=\"attainability\">attainability</span> — sufficient supplies and support at acceptable <span class=\"t\" data-t=\"risk\">risk</span> — as an explicit, communicated <span class=\"t\" data-t=\"commander\">commander</span>'s <span class=\"t\" data-t=\"risk\">risk</span> decision", "not": "Launch on enthusiasm and assume resupply catches up"}, {"situation": "Designing the distribution model", "do": "Build a web with multiple sourcing and transport options; accept the coordination and oversight cost", "not": "Optimize a single efficient chain that halts entirely when one link breaks"}, {"situation": "Choosing push vs. pull", "do": "Push routine, predictable consumption on a schedule; pull the unanticipated, rare, or specific", "not": "Pull everything (Kut, 1916) or push everything blind to actual consumption"}, {"situation": "Stating requirements", "do": "State actual need; validate against usage data and modeling", "not": "Pad \"just in case\" and feed the snowball"}, {"situation": "Allocating scarce support", "do": "Flow resources to the <span class=\"t\" data-t=\"main effort\">main effort</span> per the <span class=\"t\" data-t=\"commander\">commander</span>'s priorities; balance current operations against future needs", "not": "Spread evenly; serve whoever asks loudest"}, {"situation": "Writing the support concept", "do": "Simple, compelling concept built around the intent; <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span> for likely futures", "not": "Detailed, explicit instructions covering every eventuality"}, {"situation": "Timing preparation", "do": "Stage equipment, supplies, places, and relationships before they are required", "not": "Begin acquiring when the requirement materializes"}, {"situation": "Adopting new equipment or capability", "do": "Weigh operational benefit against the full support tail — <span class=\"t\" data-t=\"training\">training</span>, maintenance, power, transport", "not": "Adopt the capability and discover its tail in the field"}, {"situation": "The system takes a hit", "do": "Execute rehearsed contingency <span class=\"t\" data-t=\"plan\">plans</span>: alternate methods, <span class=\"t\" data-t=\"reserve\">reserves</span>, succession of <span class=\"t\" data-t=\"command\">command</span>; regenerate", "not": "Treat disruption as an exception with no rehearsed alternate"}, {"situation": "Reading <span class=\"t\" data-t=\"logistics\">logistics</span> <span class=\"t\" data-t=\"information\">information</span>", "do": "Process and analyze into shared understanding of demand against supply over time", "not": "Report a snapshot of current stock and call it visibility"}, {"situation": "Choosing organic vs. outsourced", "do": "Blend by mission, area, and guidance; know which end of the spectrum each class of need sits on", "not": "Assume full self-sufficiency or full dependency"}], "concepts": [{"title": "The Seven Logistics Principles", "body": "<span class=\"t\" data-t=\"responsiveness\">Responsiveness</span> (the keystone — right support, right place, right time), economy (minimum resources at acceptable <span class=\"t\" data-t=\"risk\">risk</span>), flexibility (adapt structure and <span class=\"t\" data-t=\"plan\">plans</span> to evolving <span class=\"t\" data-t=\"situation\">situations</span>), <span class=\"t\" data-t=\"attainability\">attainability</span> (sufficient support to initiate at acceptable <span class=\"t\" data-t=\"risk\">risk</span>), <span class=\"t\" data-t=\"sustainability\">sustainability</span> (maintain support for long-term objectives), simplicity (clear, standardized processes and relationships; fewest required actions), survivability (prevail despite attack). They are integrated into <span class=\"t\" data-t=\"plan\">plans</span> and consulted during execution. Resilience underpins all seven."}, {"title": "The Logistics Process and Functions", "body": "Four actions support any <span class=\"t\" data-t=\"force\">force</span> at any level: sourcing (obtain), distribution (move origin to need), <span class=\"t\" data-t=\"sustainment\">sustainment</span> (maintain and prolong until mission accomplished and redeployed), disposition (consume, return, dispose). Six functions organize the work: supply, maintenance, transportation, general engineering, health service support, services. Process says what must be done; functions organize it; a <span class=\"t\" data-t=\"concept of support\">concept of support</span> integrates every function against every warfighting function."}, {"title": "Attainability and Logistics Visibility", "body": "<span class=\"t\" data-t=\"attainability\">Attainability</span> is the <span class=\"t\" data-t=\"commander\">commander</span>'s <span class=\"t\" data-t=\"judgment\">judgment</span> that enough exists to start or continue. It rests on visibility, split into demand visibility (friendly need relative to the concept of operations) and supply visibility (available units, equipment, infrastructure, supplies). <span class=\"t\" data-t=\"information\">Information</span> is gathered, then processed and analyzed into a shared understanding of anticipated demand against expected ability to meet it. A data snapshot is not visibility."}, {"title": "Chain vs. Web; Places, Platforms, Procedures", "body": "A distribution model is places (nodes), platforms (lift), and procedures (how requirements are identified and delivered). A supply chain is efficient and breaks like a blocked road. A supply web has redundant sourcing and routes, resists blockage, costs more to maintain, and requires decision-making throughout. Expeditionary <span class=\"t\" data-t=\"force\">forces</span> in contested space need webs."}, {"title": "Push/Pull and Point/Unit/Blended Distribution", "body": "Push forecasts requirements and delivers on schedule: predictable, slow to adjust. Pull responds to requests: efficient, dependent on <span class=\"t\" data-t=\"communications\">communications</span> and on the requester's discipline. Point distribution makes the supported unit come get it; unit distribution delivers to them; blended shares the movement. Routine favors push; emergent favors pull; most <span class=\"t\" data-t=\"force\">forces</span> run both."}, {"title": "The Culminating Point", "body": "A <span class=\"t\" data-t=\"force\">force</span> loses <span class=\"t\" data-t=\"strength\">strength</span> as it attacks and eventually can no longer sustain the attack. <span class=\"t\" data-t=\"logistics\">Logistics</span> determines where that point falls. <span class=\"t\" data-t=\"plan\">Plans</span> that do not account for <span class=\"t\" data-t=\"logistics\">logistics</span> capability and capacity culminate before the objective. Tactical <span class=\"t\" data-t=\"logistics\">logistics</span> exists to keep the <span class=\"t\" data-t=\"force\">force</span> from a premature <span class=\"t\" data-t=\"culminating point\">culminating point</span>."}, {"title": "Engine, Steering Wheel, Gas Pedal", "body": "<span class=\"t\" data-t=\"command and control\">Command and control</span> establishes what <span class=\"t\" data-t=\"will\">will</span> be done, how, and by whom; <span class=\"t\" data-t=\"logistics\">logistics</span> sets what can and cannot be done. <span class=\"t\" data-t=\"logistics\">Logistics</span> is the engine (how fast, how far, how long); C2 is the steering wheel and gas pedal (where, how quickly). C2 shapes <span class=\"t\" data-t=\"logistics\">logistics</span> through priorities (order of need by mission), processes and procedures (stock levels, reorder thresholds, resupply means), and <span class=\"t\" data-t=\"information\">information</span> systems — with alternatives rehearsed for when connectivity fails."}, {"title": "Logistics Planning as a Sequence", "body": "Understand the environment through a movement-and-sustainment lens (threats, physical network, resources) → develop feasible options that maximize the ways a requirement can be met → shape before violence (set the theater, forward-position, build relationships) → maintain visibility and adjust from unit <span class=\"t\" data-t=\"feedback\">feedback</span> → make and communicate explicit <span class=\"t\" data-t=\"risk\">risk</span> decisions (avoid, accept, mitigate, transfer). Wargaming, modeling, rehearsal, and periodic deliberate assessment expose <span class=\"t\" data-t=\"risk\">risk</span> before the enemy does. ---"}], "vocabulary": [{"term": "Logistics", "definition": "<span class=\"t\" data-t=\"planning\">Planning</span> and executing the movement and support of <span class=\"t\" data-t=\"force\">forces</span>; the bridge between a nation's economy and its combat <span class=\"t\" data-t=\"force\">forces</span>"}, {"term": "Sustainment", "definition": "The broader category: provision of <span class=\"t\" data-t=\"logistics\">logistics</span> and personnel services to maintain and prolong operations until mission accomplishment and redeployment"}, {"term": "Culminating point", "definition": "The point at which a <span class=\"t\" data-t=\"force\">force</span> can no longer sustain the attack and reverts to defense; set by <span class=\"t\" data-t=\"logistics\">logistics</span>"}, {"term": "Responsiveness", "definition": "Right support, right place, right time; the keystone principle"}, {"term": "Attainability", "definition": "The <span class=\"t\" data-t=\"commander\">commander</span>'s <span class=\"t\" data-t=\"judgment\">judgment</span> that sufficient supplies and support exist to initiate operations at acceptable <span class=\"t\" data-t=\"risk\">risk</span>"}, {"term": "Logistics visibility", "definition": "Processed, analyzed awareness of demand (need vs. concept of operations) and supply (available resources)"}, {"term": "Supply chain / supply web", "definition": "Single efficient linear network that fails when blocked / redundant multi-path network that resists blockage at higher cost"}, {"term": "Push / pull", "definition": "Scheduled delivery from forecast / delivery on request from actual consumption"}, {"term": "Logistics snowball effect", "definition": "Cumulative false demand from padded requirements that undercuts prioritization"}, {"term": "Hybrid logistics", "definition": "Blending old, new, and emerging means; modular capability tailored to a distributed <span class=\"t\" data-t=\"force\">force</span>"}, {"term": "Setting the theater", "definition": "Operational-level <span class=\"t\" data-t=\"shaping\">shaping</span>: distribution network, <span class=\"t\" data-t=\"force\">force</span> posture, forward provisioning before conflict"}, {"term": "Concept of support", "definition": "The integrated <span class=\"t\" data-t=\"plan\">plan</span> for how every <span class=\"t\" data-t=\"logistics\">logistics</span> function supports every warfighting function"}, {"term": "Distribution node", "definition": "Any place where people or materiel are stored, reconfigured, or await movement; caches to sea bases"}, {"term": "Self-sufficiency / dependency", "definition": "Ends of the <span class=\"t\" data-t=\"sustainment\">sustainment</span> spectrum; <span class=\"t\" data-t=\"force\">forces</span> blend them by mission and area"}, {"term": "Warfighting functions", "definition": "<span class=\"t\" data-t=\"command and control\">Command and control</span>, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, fires, maneuver, <span class=\"t\" data-t=\"force\">force</span> protection, <span class=\"t\" data-t=\"information\">information</span>, <span class=\"t\" data-t=\"logistics\">logistics</span>"}], "quotes": [{"quote": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is the engine of <span class=\"t\" data-t=\"strategy\">strategy</span>.", "caption": "Ch. 1, The Nature of Logistics"}, {"quote": "In summary, <span class=\"t\" data-t=\"logistics\">logistics</span> is both an enabling and limiting factor in operations and sets the parameters for what is strategically achievable, operationally feasible, and tactically possible.", "caption": "Ch. 1, The Nature of Logistics"}, {"quote": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is defined by results rather than by activities.", "caption": "Ch. 1, Logistics Characteristics"}, {"quote": "In this data-rich environment, we need to ensure we do not become <span class=\"t\" data-t=\"information\">information</span> rich and knowledge poor.", "caption": "Ch. 1, The Evolution of Logistics"}, {"quote": "Since it takes longer and more effort to accrue supplies than to expend them, we improve <span class=\"t\" data-t=\"responsiveness\">responsiveness</span> by preparing equipment and staging supplies before they are required.", "caption": "Ch. 2, Responsiveness"}, {"quote": "A supply chain is like a road. If any part is blocked, movement along the entire road stops until it can be cleared.", "caption": "Ch. 2, Supply Chains and Supply Webs"}, {"quote": "Despite our best efforts, we <span class=\"t\" data-t=\"will\">will</span> be attacked and our operations <span class=\"t\" data-t=\"will\">will</span> be disrupted.", "caption": "Ch. 2, Defensive Actions"}, {"quote": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is complicated, but its design and execution does not need to be.", "caption": "Ch. 2, Simplicity"}, {"quote": "The essence of flexibility is in the mind of the <span class=\"t\" data-t=\"commander\">commander</span>; the substance of flexibility is <span class=\"t\" data-t=\"logistics\">logistics</span>.", "caption": "H. E. Eccles, epigraph to Ch. 4"}, {"quote": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is the engine of operations and <span class=\"t\" data-t=\"command and control\">command and control</span> is the gas pedal and steering wheel.", "caption": "Ch. 5, Command and Control"}, {"quote": "<span class=\"t\" data-t=\"plan\">Plans</span> are not complete unless they incorporate the means to mitigate threats.", "caption": "Ch. 5, Developing Options"}, {"quote": "<span class=\"t\" data-t=\"logistics\">Logistics</span> is like oxygen, transparent to the user unless in short supply.", "caption": "Ch. 5, Conclusion"}], "doesnt_work": "Designing the operation first and asking <span class=\"t\" data-t=\"logistics\">logistics</span> to catch up, single-chain distribution optimized for efficiency, pure pull with severed <span class=\"t\" data-t=\"communications\">communications</span>, pure push blind to consumption, padded requirements (\"a little extra just in case\"), stock snapshots mistaken for visibility, detailed support instructions covering every eventuality, treating disruption as an exception, adopting capability without costing its support tail, mountains of steel at fixed forward locations in contested space, commercial-efficient methods assumed to survive combat, top-down <span class=\"t\" data-t=\"directive\">directive</span> culture that discourages initiative in the supply system, total dependence on connectivity with no rehearsed offline alternate, ignoring the <span class=\"t\" data-t=\"force\">force</span>'s own <span class=\"t\" data-t=\"logistics\">logistics</span> signature.", "selfcheck": ["Is the current concept of operations built on what I know I can sustain, with the <span class=\"t\" data-t=\"culminating point\">culminating point</span> identified?", "Have I made the <span class=\"t\" data-t=\"attainability\">attainability</span> decision explicitly — enough support to start at a <span class=\"t\" data-t=\"risk\">risk</span> I have named and accepted?", "Can I see demand and supply as a processed picture over time, not a snapshot?", "Is support flowing to the <span class=\"t\" data-t=\"main effort\">main effort</span> by stated priority?", "Do I have more than one path for every critical class of need (a web, not a chain)?", "Is routine consumption on push and only the emergent on pull?", "Have I staged what the next <span class=\"t\" data-t=\"phase\">phase</span> needs before the <span class=\"t\" data-t=\"phase\">phase</span> begins?", "Is the support concept simple enough to state in a sentence and flexible enough to survive contact?", "Have I rehearsed what happens when a node or connection is lost?", "Are my stated requirements actual need, not padded?"], "selfcheck_note": "", "application": [{"lead": "Sustainment → runway.", "body": "For a solo creator-operator the classes of supply are cash, <span class=\"t\" data-t=\"energy\">energy</span>, attention, and tooling. MCDP 4's rule that the concept of operations is based \"on what they know they can do logistically\" means no project brief enters <code>project_flow</code> without a <span class=\"t\" data-t=\"sustainment\">sustainment</span> line: what it consumes, how long the runway holds, where the <span class=\"t\" data-t=\"culminating point\">culminating point</span> falls."}, {"lead": "Attainability → the gate.", "body": "The venture <code>gates_sheet</code> is a series of <span class=\"t\" data-t=\"attainability\">attainability</span> decisions. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> defines the gate precisely: sufficient supplies and support capabilities exist to initiate at an acceptable level of <span class=\"t\" data-t=\"risk\">risk</span>. The operator makes it explicitly, names the <span class=\"t\" data-t=\"risk\">risk</span> posture (avoid / accept / mitigate / transfer), and communicates it — to the AI partner in the brief, to the record in STATE.md."}, {"lead": "Logistics visibility → sit rep Block IV.", "body": "The PMCS table in BOLO.md is supply visibility (operator readiness, tool state, maintenance due); the BOLO watchlist is demand visibility (what upcoming work <span class=\"t\" data-t=\"will\">will</span> consume). Block IV must present both as a processed picture, not a stock count — \"shared understanding of the demands of anticipated operations and expected ability to meet those demands.\""}, {"lead": "Responsiveness → stage before need.", "body": "Templates, caches, reference decks, and canonical docs are pre-positioned stores. Build them in the quiet <span class=\"t\" data-t=\"phase\">phase</span>. The AI partner's pre-session preparation is forward provisioning; accrual is slower than expenditure, so the sprint is never the time to build the tooling the sprint needs."}, {"lead": "Chain vs. web → single points of failure.", "body": "One income source, one tool, one file that everything depends on is a supply chain. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> says webs cost more and survive. Audit critical dependencies for a second path; accept the coordination cost."}, {"lead": "Push/pull → PMCS cadence.", "body": "Scheduled maintenance (weekly reviews, backups, STATE.md updates at s
