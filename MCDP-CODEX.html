erm": "Center of gravity (strategic)", "definition": "A key source of enemy <span class=\"t\" data-t=\"strength\">strength</span> — <span class=\"t\" data-t=\"force\">forces</span>, a capital, a population, a leader, public support"}, {"term": "Critical vulnerability", "definition": "A weakness that (1) significantly undermines a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> and (2) we have the means to exploit"}, {"term": "Strategic concept", "definition": "The course of action accepted from the strategic estimate; the clear, compelling basis for all subsequent <span class=\"t\" data-t=\"planning\">planning</span>"}, {"term": "Balance of power", "definition": "A mechanism of shifting alliances that keeps any one entity from dominance; a strategic constant at every level"}, {"term": "Culminating point of victory", "definition": "The point at which one competitor's success prompts allies and others to withdraw support or turn against it"}, {"term": "Symmetrical / asymmetrical", "definition": "Matching the enemy <span class=\"t\" data-t=\"strength\">strength</span> for <span class=\"t\" data-t=\"strength\">strength</span> vs. applying a category of means to which the enemy cannot respond in kind"}, {"term": "Deterrence by denial / reprisal", "definition": "Convincing the enemy the action <span class=\"t\" data-t=\"will\">will</span> fail vs. convincing the enemy the cost <span class=\"t\" data-t=\"will\">will</span> exceed the gain"}, {"term": "Standardized / tailored strategy", "definition": "A pattern response to a recognized problem type vs. a response fitted to the specific problem"}, {"term": "Strategy by default", "definition": "A <span class=\"t\" data-t=\"strategy\">strategy</span> dictated by circumstance, ideology, or unconscious assumption rather than rational consideration"}, {"term": "Fait accompli", "definition": "An action whose political and military goals are identical and achieved in one blow, presenting an accomplished fact"}, {"term": "The trinity", "definition": "Clausewitz's three tendencies — primordial violence and emotion, chance and probability, subordination to reason — always all at work"}, {"term": "Complex adaptive system", "definition": "A system whose members co-evolve and generate their own rules; constrained but not determined by external factors; inherently unpredictable"}], "quotes": [{"quote": "Battlefield brilliance seldom rescues a bad <span class=\"t\" data-t=\"strategy\">strategy</span>.", "caption": ""}, {"quote": "Therefore, the military professional who says, 'Keep <span class=\"t\" data-t=\"politics\">politics</span> out of this. Just give us the <span class=\"t\" data-t=\"policy\">policy</span>, and we <span class=\"t\" data-t=\"will\">will</span> take care of the <span class=\"t\" data-t=\"strategy\">strategy</span>,' does not understand the fundamentals of <span class=\"t\" data-t=\"strategy\">strategy</span>.", "caption": ""}, {"quote": "One of the major problems of <span class=\"t\" data-t=\"strategy\">strategy</span> is to determine where and in what form real power lies and to identify those relatively rare points where military power can be applied effectively.", "caption": ""}, {"quote": "Political objectives describe, in a sense, where we want to go. Military objectives describe what we have to accomplish militarily in order to get there.", "caption": ""}, {"quote": "At war's end, a <span class=\"t\" data-t=\"strategy\">strategy</span> that has neither eliminated the enemy's ability to resist nor worn down the enemy's <span class=\"t\" data-t=\"will\">will</span> to continue the struggle is a <span class=\"t\" data-t=\"strategy\">strategy</span> that has failed.", "caption": ""}, {"quote": "Fighting the enemy should always be a means to an end, not become an end in itself.", "caption": ""}, {"quote": "Just as there is no strategic panacea, there is no optimal strategy-making process.", "caption": ""}, {"quote": "Paralysis is neither more nor less dangerous than blindly striking out in the face of either threat or opportunity.", "caption": ""}, {"quote": "The strategist's responsibility is to balance opportunity against <span class=\"t\" data-t=\"risk\">risk</span> and to balance both against <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>. Despite the obstacles to focusing on specific strategic problems and to taking effective action, we must <span class=\"t\" data-t=\"focus\">focus</span>, and we must <span class=\"t\" data-t=\"act\">act</span>.", "caption": ""}], "doesnt_work": "Treating the adversary as a unitary rational actor, \"keep <span class=\"t\" data-t=\"politics\">politics</span> out of this,\" strategic panaceas, process over product, assuming the <span class=\"t\" data-t=\"fait accompli\">fait accompli</span> is final, labeling whole wars limited or unlimited, confusing the scale of a war with its objectives, limiting means when the objective demands annihilation, pursuing annihilation without decisive superiority, relying on <span class=\"t\" data-t=\"surprise\">surprise</span> alone for the margin of <span class=\"t\" data-t=\"victory\">victory</span>, paralysis by analysis, reckless <span class=\"t\" data-t=\"bias for action\">bias for action</span>, dogmatic or ethnocentric assertions about national character, mirror-imaging the enemy, ambiguity of aim that reflects indecision rather than calculation, fighting as an end in itself, treating military <span class=\"t\" data-t=\"force\">force</span> as the solution to most political problems, ignoring the just-war test when the cause <span class=\"t\" data-t=\"will\">will</span> be argued against you.", "selfcheck": ["Have I stated the political objective — the <span class=\"t\" data-t=\"end state\">end state</span> — and classified it limited or unlimited?", "Have I defined what <span class=\"t\" data-t=\"survival\">survival</span> and <span class=\"t\" data-t=\"victory\">victory</span> mean for every participant, not only for me?", "Have I chosen annihilation or erosion explicitly, and do my military objectives follow from that choice?", "Have I run the assessment — environment, character, <span class=\"t\" data-t=\"balance of power\">balance of power</span>, value vs. cost, endurance — before choosing means?", "Have I located where real power lies and the few points where my means can <span class=\"t\" data-t=\"reach\">reach</span> it?", "Does the chosen objective actually achieve the political end without producing a worse political result?", "Am I using all instruments of power, not only the one I am most comfortable with?", "Have I tested the <span class=\"t\" data-t=\"plan\">plan</span> against the six pitfalls — panacea, process, <span class=\"t\" data-t=\"fait accompli\">fait accompli</span>, labels, paralysis, recklessness?", "Can I demonstrate why the cause is just, in terms the other side's sympathizers would have to answer?"], "selfcheck_note": "", "application": [{"lead": "Political objective and end state → the first line of every project charter.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: political objectives are the starting point; classify them limited or unlimited before anything else. Translation: the project flow (BOLO 25) opens with the <span class=\"t\" data-t=\"end state\">end state</span> in <span class=\"t\" data-t=\"policy\">policy</span> terms — what the finished thing changes in the world — and a declared class: limited (ship a version, adjust a process) or unlimited (replace the system). Every downstream task is a military objective in service of that line, and \"fighting the enemy\" — building for its own sake — is the named failure mode."}, {"lead": "Annihilation or erosion → declare the project mode.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: all military strategies are one or the other; an undeclared <span class=\"t\" data-t=\"strategy\">strategy</span> that ends having done neither has failed. Translation: an annihilation project finishes the artifact completely — conceptually simple, <span class=\"t\" data-t=\"victory\">victory</span> easily measured, <span class=\"t\" data-t=\"main effort\">main effort</span> is the build. An erosion project raises the cost of the status quo until it yields — <span class=\"t\" data-t=\"victory\">victory</span> flexibly defined, \"declare <span class=\"t\" data-t=\"victory\">victory</span> and go home,\" <span class=\"t\" data-t=\"main effort\">main effort</span> may be writing, comms, or process. The recurring stall pattern is a <span class=\"t\" data-t=\"strategy\">strategy</span> that did neither: designs finished, decision unmade, nothing broken and nothing worn down."}, {"lead": "The strategic assessment → sit rep Block I.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: assessment is the observe-orient half of the <span class=\"t\" data-t=\"ooda loop\">OODA loop</span>; without it, decision and action are seriously flawed. Translation: the sit rep runs the assessment on cadence before any gate decision — what each party values, what cost is bearable, how long endurance lasts, whether regular measurable progress is expected. Block 0 (session cache) and Block IV (BOLO watchlist) are its inputs."}, {"lead": "Ends and means adjust each other → the scope gate.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: when resources fall short, cut ambitions to match or seek more; when the <span class=\"t\" data-t=\"opponent\">opponent</span> proves weaker, expand. Translation: each <span class=\"t\" data-t=\"phase\">phase</span> gate is an explicit ends-means reconciliation, written down. A gate that passes without touching either the <span class=\"t\" data-t=\"end state\">end state</span> or the resource line was not a gate."}, {"lead": "Process over product → the flow is a departure point, not the strategy.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: standardized strategies buy time for tailoring; a process run purely by routine yields a predictable <span class=\"t\" data-t=\"strategy by default\">strategy by default</span>. Translation: the standard project flow is a standardized <span class=\"t\" data-t=\"strategy\">strategy</span>. Every project tailors it by the second <span class=\"t\" data-t=\"phase\">phase</span>, and any project running on the template alone is flagged as strategy-by-default in the sit rep."}, {"lead": "Paralysis and recklessness → decide at the right tempo for the level.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: strategic decisions warrant discipline to study; the strategic realm rarely demands instant action, and a strategic misstep is catastrophic where a tactical one is recoverable. Translation: name the level before deciding how long to deliberate. Gate decisions (strategic) get a study period; in-session execution (tactical) decides now on acceptable <span class=\"t\" data-t=\"risk\">risk</span>. The stall pattern is tactical paralysis masquerading as strategic caution."}, {"lead": "Who makes strategy → the operator/AI division of labor.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the political leadership answers \"what is the objective\" and \"which military objective achieves it\"; the military leadership comes to the fore on \"how,\" and its advice is ignored unless it understands the political leadership's real concerns. Translation: the operator owns the <span class=\"t\" data-t=\"end state\">end state</span> and the choice of objective; the AI partner leads on method, advises on capabilities and limitations, and asks the tough questions about objectives — but only lands that advice by understanding what the operator is actually protecting."}], "marks": []}, {"id": "MIL.03", "bvx_id": "BVX.1113", "title": "MCDP 1-2 Campaigning", "author": "U.S. Marine Corps (HQMC)", "year": "1997", "edition": "Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "maneuver-warfare", "operational-art", "campaign-design", "phasing", "end-state", "conflict-termination"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.02 — MCDP 1-1 Strategy — USMC (1997)", "🧬 MIL.04 — MCDP 1-3 Tactics — USMC (1997)", "🧬 MIL.07 — MCDP 4 Logistics — USMC (2023)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)"], "feeds": [{"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "The campaign is the project-shaped unit of doctrine: aim → annihilation/erosion → CoG/CV → single unifying concept → event-driven phases planned forward and backward → conceptual/functional/detailed planning → end state and termination → concise plan. This is the skeleton of BOLO 25's standard flow."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "primary", "note": "Tactical success does not produce strategic success; higher levels overpower lower; design and execution never separate; a plan that cannot be sustained is not a plan; every campaign ends and the end must be designed first."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Two-way information flow ('the fingers have to know what the brain is feeling for, and the brain has to know what the fingers are actually touching') is the doctrinal statement of how copy (intent down) and sit rep (ground truth up); 'request relaxation of either the aims or the limitations' is the blocker protocol."}], "file": "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997).md", "thesis": "Tactical success does not produce strategic success; the <span class=\"t\" data-t=\"campaign\">campaign</span> — a series of related operations connected by time, space, and purpose — is the operational-level discipline that converts tactical actions into a strategic result, and its design begins with the <span class=\"t\" data-t=\"military strategic aim\">military strategic aim</span>, targets the enemy's centers of gravity through <span class=\"t\" data-t=\"critical vulnerabilities\">critical vulnerabilities</span>, <span class=\"t\" data-t=\"phase\">phases</span> by <span class=\"t\" data-t=\"event\">events</span> rather than schedule, <span class=\"t\" data-t=\"plan\">plans</span> termination from the start, and stays concise enough to adapt while it is being executed. ---", "invariants": [{"lead": "Tactical success does not guarantee strategic success.", "body": "Battles won that do not lead to the strategic objective are wasted effort. Combat is a means to a larger end, never the end."}, {"lead": "The levels of war form a continuum, and higher levels overpower lower ones.", "body": "Strategic incompetence squanders operational and tactical success far more often than tactical brilliance overcomes strategic disadvantage. <span class=\"t\" data-t=\"tactics\">Tactics</span> that win the fight can defeat the <span class=\"t\" data-t=\"strategy\">strategy</span>."}, {"lead": "Campaign design begins with the military strategic aim.", "body": "<span class=\"t\" data-t=\"focus\">Focus</span> on that aim is the single most important element of design; without knowing whether the <span class=\"t\" data-t=\"strategy\">strategy</span> is annihilation or erosion, no coherent <span class=\"t\" data-t=\"campaign\">campaign</span> is possible and instruments of power work at cross-purposes."}, {"lead": "Combat is costly; economy governs its use.", "body": "Fight when it is strategically advantageous or necessary — something to gain by fighting or lose by not — and refuse battle otherwise. Tactical advantage alone is not sufficient reason."}, {"lead": "Design and execution are continuous and interdependent.", "body": "There is no point at which design ceases and execution begins; results of execution modify the design mid-stride."}, {"lead": "Uncertainty grows with distance; detail must shrink with it.", "body": "The initial <span class=\"t\" data-t=\"phase\">phase</span> may be planned with <span class=\"t\" data-t=\"certainty\">certainty</span>; later <span class=\"t\" data-t=\"phase\">phases</span> become increasingly general — an intent and a set of options."}, {"lead": "Logistics dictates what is operationally possible.", "body": "A <span class=\"t\" data-t=\"campaign plan\">campaign plan</span> that cannot be sustained is not a <span class=\"t\" data-t=\"plan\">plan</span>."}, {"lead": "Every campaign ends, and the end must be designed from the start.", "body": "The acceptable <span class=\"t\" data-t=\"end state\">end state</span>, the transition to what follows, and <span class=\"t\" data-t=\"reconstitution\">reconstitution</span> are campaign-design questions, not afterthoughts."}], "heuristics": [{"situation": "Handed a strategic aim", "do": "Determine annihilation or erosion; identify centers of gravity and <span class=\"t\" data-t=\"critical vulnerabilities\">critical vulnerabilities</span>; then build the <span class=\"t\" data-t=\"campaign concept\">campaign concept</span>", "not": "Jump to operations and sequencing"}, {"situation": "Running an erosion <span class=\"t\" data-t=\"campaign\">campaign</span>", "do": "Ask what the enemy leadership values and how to threaten it credibly", "not": "Inflict costs on the population or on units the leadership does not care about"}, {"situation": "<span class=\"t\" data-t=\"critical vulnerability\">Critical vulnerability</span> is not open to attack", "do": "Design a progressive sequence of actions to expose or isolate it, creating the opportunity over time", "not": "Attack the <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> head-on"}, {"situation": "Phasing the <span class=\"t\" data-t=\"campaign\">campaign</span>", "do": "Event-driven, natural subdivisions, each with its own intent; <span class=\"t\" data-t=\"plan\">plan</span> forward from now and backward from the <span class=\"t\" data-t=\"end state\">end state</span> and make the two mesh", "not": "Schedule-driven arbitrary chunks that produce a plodding, incremental approach and sacrifice <span class=\"t\" data-t=\"tempo\">tempo</span>"}, {"situation": "Deciding how much detail to <span class=\"t\" data-t=\"plan\">plan</span>", "do": "Detail the initial <span class=\"t\" data-t=\"phase\">phase</span>; leave later <span class=\"t\" data-t=\"phase\">phases</span> conceptual — general intent plus contingencies and options", "not": "Equal detail across every <span class=\"t\" data-t=\"phase\">phase</span>"}, {"situation": "Writing the <span class=\"t\" data-t=\"plan\">plan</span>", "do": "Concise: <span class=\"t\" data-t=\"end state\">end state</span>, intent and concept, tentative <span class=\"t\" data-t=\"phase\">phases</span> and objectives, <span class=\"t\" data-t=\"logistics\">logistics</span> concept, milestones as a measure of progress", "not": "Tactical detail for every <span class=\"t\" data-t=\"phase\">phase</span>; a schedule treated as immutable"}, {"situation": "Deciding whether to give battle", "do": "Fight when strategically advantageous or necessary, and accept battle even at tactical disadvantage if the result serves <span class=\"t\" data-t=\"strategy\">strategy</span>", "not": "Fight because the engagement is winnable"}, {"situation": "A tactical result arrives — win, lose, or draw", "do": "Exploit whatever the result to strategic advantage", "not": "Reset to the original <span class=\"t\" data-t=\"plan\">plan</span>; treat a defeat as the end"}, {"situation": "Strategic aim is unclear, or imposed conditions prevent attaining it", "do": "Seek clarification; convey the impact of ambiguity; request relaxation of either the aims or the limitations", "not": "Proceed silently; cite the constraints as an excuse afterward"}, {"situation": "Resources are insufficient", "do": "Seek additional resources or request modification of the aim", "not": "Absorb the shortfall and fail on schedule"}, {"situation": "Need to generate <span class=\"t\" data-t=\"tempo\">tempo</span>", "do": "Undertake multiple actions simultaneously; prepare sequels in advance; decentralize decisions inside a unifying intent; avoid unnecessary combat", "not": "Serial actions; centralized decisions; fighting every available engagement"}, {"situation": "Assessing the enemy", "do": "Understand their true character and capabilities; see your own actions from their viewpoint", "not": "A cardboard strawman, or an enemy ten feet tall; mirror-imaging"}, {"situation": "Approaching termination", "do": "Define the acceptable <span class=\"t\" data-t=\"end state\">end state</span>; check that it removes the seeds of further conflict; <span class=\"t\" data-t=\"plan\">plan</span> disengagement, <span class=\"t\" data-t=\"force\">force</span> protection, transition, <span class=\"t\" data-t=\"reconstitution\">reconstitution</span>", "not": "Stop abruptly; \"declare <span class=\"t\" data-t=\"victory\">victory</span>\" with no transition <span class=\"t\" data-t=\"plan\">plan</span>"}, {"situation": "Higher authority over-prescribes your concept", "do": "The concept \"should be born in the mind\" of the <span class=\"t\" data-t=\"commander\">commander</span> who directs it — push back", "not": "Become a mere executor of tactical tasks"}], "concepts": [{"title": "The Operational Level and the Campaign", "body": "The operational level is the link between <span class=\"t\" data-t=\"strategy\">strategy</span> and <span class=\"t\" data-t=\"tactics\">tactics</span>: its aim is to get strategically meaningful results from tactical efforts by deciding when, where, for what purpose, and under what conditions to give or refuse battle. The <span class=\"t\" data-t=\"campaign\">campaign</span> is its principal tool — related operations connected by time, space, and purpose toward a strategic objective. The level is not defined by echelon; if a tactical action directly achieves a strategic objective, it is operational, however small."}, {"title": "How Strategy Guides Operations", "body": "<span class=\"t\" data-t=\"strategy\">Strategy</span> shapes the <span class=\"t\" data-t=\"campaign\">campaign</span> in three ways: it establishes the <span class=\"t\" data-t=\"military strategic aim\">military strategic aim</span>, it allocates resources (tangible and intangible, including political support), and it imposes restraints (prohibitions) and constraints (obligations). The relationship runs both ways — <span class=\"t\" data-t=\"strategy\">strategy</span> must adapt to operational <span class=\"t\" data-t=\"event\">events</span>, and the <span class=\"t\" data-t=\"commander\">commander</span> must communicate <span class=\"t\" data-t=\"risk\">risk</span>, seek clarification of ambiguous aims, and request relief when conditions prevent success. No <span class=\"t\" data-t=\"commander\">commander</span> may use imposed conditions as an excuse for failure."}, {"title": "Campaigning Under Annihilation or Erosion", "body": "Under annihilation the <span class=\"t\" data-t=\"focus\">focus</span> is the enemy's armed <span class=\"t\" data-t=\"force\">forces</span>, the military is the <span class=\"t\" data-t=\"main effort\">main effort</span>, other instruments support it, and <span class=\"t\" data-t=\"victory\">victory</span> is easily measured. Under erosion there are many more variables: the <span class=\"t\" data-t=\"main effort\">main effort</span> may be diplomatic, economic, or informational; the target is whatever the leadership values; <span class=\"t\" data-t=\"victory\">victory</span> is flexibly defined and may be implicit. Political and military aims need not match — a limited political aim can be served by annihilation within the theater."}, {"title": "Strategic vs. Operational Centers of Gravity; Critical Vulnerabilities", "body": "A <span class=\"t\" data-t=\"strategic center of gravity\">strategic center of gravity</span> is an objective whose loss profoundly affects the enemy leadership's <span class=\"t\" data-t=\"will\">will</span> or ability to continue. An <span class=\"t\" data-t=\"operational center of gravity\">operational center of gravity</span> is normally the concentration of enemy military power most dangerous to us or standing between us and the mission. The two may coincide or differ. A <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> must undermine a key <span class=\"t\" data-t=\"strength\">strength</span> and be within our means to attack; often it must be created by a progressive sequence of actions. Expect the enemy to attack ours."}, {"title": "The Campaign Concept", "body": "A single unifying idea expressed in clear, concise, conceptual language: what we <span class=\"t\" data-t=\"plan\">plan</span> to accomplish and how, with intent explicitly stated and a general sense of when, where, and under what conditions battle <span class=\"t\" data-t=\"will\">will</span> be given or refused. It should be bold, creative, free of discernible patterns, rich in options so the enemy cannot read intentions, as simple as the <span class=\"t\" data-t=\"situation\">situation</span> allows, and built for <span class=\"t\" data-t=\"speed\">speed</span>. A simple superior idea has often been the basis of success."}, {"title": "Phasing, Branches, and Sequels", "body": "<span class=\"t\" data-t=\"phase\">Phases</span> organize dispersed activity into natural, event-driven subdivisions, each with an intermediate goal and its own intent. Each <span class=\"t\" data-t=\"phase\">phase</span> contains <span class=\"t\" data-t=\"decision point\">decision points</span> with branches (options at the point) and sequels (follow-ups to each outcome). <span class=\"t\" data-t=\"planning\">Planning</span> runs forward from the present and backward from the <span class=\"t\" data-t=\"end state\">end state</span>; the two sets must mesh. <span class=\"t\" data-t=\"logistical culmination\">Logistical culmination</span> and time-oriented resource availability must be reconciled with event-driven phasing — <span class=\"t\" data-t=\"logistics\">logistics</span> may dictate the purpose and sequence of <span class=\"t\" data-t=\"phase\">phases</span>."}, {"title": "Conceptual, Functional, and Detailed Planning", "body": "Conceptual <span class=\"t\" data-t=\"planning\">planning</span> produces the broad scheme; functional <span class=\"t\" data-t=\"planning\">planning</span> designs the supporting concepts for the six <span class=\"t\" data-t=\"warfighting functions\">warfighting functions</span> (<span class=\"t\" data-t=\"command and control\">command and control</span>, maneuver, fires, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"force\">force</span> protection) and tests feasibility; detailed <span class=\"t\" data-t=\"planning\">planning</span> coordinates specifics without inhibiting flexibility. The process runs both ways — the concept must adapt to functional realities. No amount of detail substitutes for a concept."}, {"title": "Conflict Termination and the Campaign Plan", "body": "Define the acceptable political and military <span class=\"t\" data-t=\"end state\">end state</span> early and update it; ask whether it ends the fundamental problem or leaves the seeds of further conflict, and whether the termination permits unilateral resumption. <span class=\"t\" data-t=\"plan\">Plan</span> disengagement, transition to post-conflict operations, and <span class=\"t\" data-t=\"reconstitution\">reconstitution</span> (reorganization or regeneration). The <span class=\"t\" data-t=\"campaign plan\">campaign plan</span> itself is the concise statement of design: <span class=\"t\" data-t=\"end state\">end state</span>, intent and concept, tentative <span class=\"t\" data-t=\"phase\">phases</span> and objectives, key functional concepts (above all <span class=\"t\" data-t=\"logistics\">logistics</span>), milestones as a measure of progress but never an immutable schedule, with the final decisive action clearly envisioned. ---"}], "vocabulary": [{"term": "Campaign", "definition": "A series of related military operations aimed at a strategic or operational objective within a given time and space"}, {"term": "Campaign plan", "definition": "The concise statement of design describing how time, space, and purpose connect the operations, leading to a well-defined <span class=\"t\" data-t=\"end state\">end state</span>"}, {"term": "Operational level of war", "definition": "The level that links <span class=\"t\" data-t=\"strategy\">strategy</span> and <span class=\"t\" data-t=\"tactics\">tactics</span>; the use of tactical results to attain strategic objectives; the art of winning <span class=\"t\" data-t=\"campaign\">campaigns</span>"}, {"term": "Military strategic aim", "definition": "The political effect military <span class=\"t\" data-t=\"force\">forces</span> must achieve, translated into military terms; the starting point of <span class=\"t\" data-t=\"campaign\">campaign</span> design"}, {"term": "Restraints / constraints", "definition": "Restraints prohibit or restrict actions; constraints obligate the <span class=\"t\" data-t=\"commander\">commander</span> to certain courses of action"}, {"term": "Battle / engagement", "definition": "A battle is a series of related tactical engagements for a significant objective; an engagement is a small tactical conflict"}, {"term": "Strategy of annihilation", "definition": "Eliminating the enemy's capacity to resist; military <span class=\"t\" data-t=\"force\">forces</span> are the <span class=\"t\" data-t=\"main effort\">main effort</span>; <span class=\"t\" data-t=\"victory\">victory</span> easily measured"}, {"term": "Strategy of erosion", "definition": "Raising the enemy leadership's costs above what they <span class=\"t\" data-t=\"will\">will</span> pay; <span class=\"t\" data-t=\"main effort\">main effort</span> variable; <span class=\"t\" data-t=\"victory\">victory</span> flexibly defined"}, {"term": "Strategic center of gravity", "definition": "An objective whose seizure, destruction, or neutralization profoundly affects the enemy leadership's <span class=\"t\" data-t=\"will\">will</span> or ability to continue"}, {"term": "Operational center of gravity", "definition": "The concentration of enemy military power most dangerous to us or standing between us and the strategic mission"}, {"term": "Critical vulnerability", "definition": "A weakness that undermines a key <span class=\"t\" data-t=\"strength\">strength</span> and that we are capable of attacking effectively; may have to be created"}, {"term": "Campaign concept", "definition": "The single unifying idea of the <span class=\"t\" data-t=\"campaign\">campaign</span> — what and how — with intent explicitly stated"}, {"term": "Phase", "definition": "A natural, event-driven subdivision of the <span class=\"t\" data-t=\"campaign\">campaign</span> with its own intermediate goal and intent"}, {"term": "Branch / sequel", "definition": "A branch is an option at a <span class=\"t\" data-t=\"decision point\">decision point</span>; a sequel is the follow-up action to a given outcome"}, {"term": "Forward and backward planning", "definition": "Envisioning <span class=\"t\" data-t=\"phase\">phases</span> from the present toward the <span class=\"t\" data-t=\"end state\">end state</span> and from the <span class=\"t\" data-t=\"end state\">end state</span> back to the present; the two must mesh"}, {"term": "Logistical culmination", "definition": "The point at which resources can no longer sustain the <span class=\"t\" data-t=\"force\">force</span>; may <span class=\"t\" data-t=\"force\">force</span> sequential phasing"}, {"term": "Conceptual / functional / detailed planning", "definition": "Broad scheme → supporting concepts for each warfighting function → specific coordination"}, {"term": "End state", "definition": "The acceptable political and military condition whose achievement justifies terminating combat operations"}, {"term": "Conflict termination", "definition": "The planned suspension or end of combat, including disengagement, transition, and <span class=\"t\" data-t=\"reconstitution\">reconstitution</span>"}, {"term": "Reconstitution", "definition": "Restoring units to required readiness through reorganization (internal shifts) or regeneration (large-scale replacement)"}, {"term": "Operational tempo", "definition": "The pace of <span class=\"t\" data-t=\"event\">events</span> between engagements; relative to the enemy"}, {"term": "Operational surprise", "definition": "Catching the enemy unprepared in a way that affects the <span class=\"t\" data-t=\"campaign\">campaign</span>, with or without tactical <span class=\"t\" data-t=\"surprise\">surprise</span>"}, {"term": "Warfighting functions", "definition": "<span class=\"t\" data-t=\"command and control\">Command and control</span>, maneuver, fires, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"force\">force</span> protection — harmonized for synergy"}, {"term": "Shaping", "definition": "Influencing <span class=\"t\" data-t=\"event\">events</span> to change the general conditions decisively to our advantage before the decisive action"}], "quotes": [{"quote": "Tactical success in combat does not of itself guarantee <span class=\"t\" data-t=\"victory\">victory</span> in war.", "caption": ""}, {"quote": "Put another way, our aim at the operational level is to get strategically meaningful results from tactical efforts.", "caption": ""}, {"quote": "To use a different metaphor, the fingers have to know what the brain is feeling for, and the brain has to know what the fingers are actually touching.", "caption": ""}, {"quote": "Nonetheless, no senior <span class=\"t\" data-t=\"commander\">commander</span> can use the conditions imposed by higher authority as an excuse for military failure.", "caption": ""}, {"quote": "This <span class=\"t\" data-t=\"focus\">focus</span> on the <span class=\"t\" data-t=\"military strategic aim\">military strategic aim</span> is the single most important element of <span class=\"t\" data-t=\"campaign\">campaign</span> design.", "caption": ""}, {"quote": "Generally speaking, the phasing of a <span class=\"t\" data-t=\"campaign\">campaign</span> should be event-driven rather than schedule-driven.", "caption": ""}, {"quote": "Above all, the <span class=\"t\" data-t=\"campaign plan\">campaign plan</span> should be concise.", "caption": ""}, {"quote": "Reduced to its essence, the art of campaigning consists of deciding who, when, and where to fight and for what purpose. Equally important, it involves deciding who, when, and where not to fight.", "caption": ""}, {"quote": "A <span class=\"t\" data-t=\"campaign plan\">campaign plan</span> that cannot be logistically supported is not a <span class=\"t\" data-t=\"plan\">plan</span> at all, but simply an expression of fanciful wishes.", "caption": ""}, {"quote": "Without an operational design which synthesizes tactical results into a coalescent whole, what passes for operations is simply the accumulation of tactical victories.", "caption": ""}], "doesnt_work": "Accumulating tactical victories without an operational design, defining the operational level by echelon, schedule-driven phasing, arbitrary incremental chunks that sacrifice <span class=\"t\" data-t=\"tempo\">tempo</span>, equal detail across every <span class=\"t\" data-t=\"phase\">phase</span>, long <span class=\"t\" data-t=\"campaign plan\">campaign plans</span>, fighting because it is tactically advantageous, viewing any tactical action in isolation, higher authority over-prescribing the concept of operations, using imposed constraints as an excuse, the strawman enemy and the ten-foot-tall enemy, mirror-imaging, <span class=\"t\" data-t=\"plan\">plans</span> without a <span class=\"t\" data-t=\"logistics\">logistics</span> concept, ignoring <span class=\"t\" data-t=\"conflict termination\">conflict termination</span> until the end, abrupt disengagement without transition, the operational <span class=\"t\" data-t=\"commander\">commander</span> absorbed in <span class=\"t\" data-t=\"tactics\">tactics</span>, unnecessary combat that saps <span class=\"t\" data-t=\"tempo\">tempo</span>, <span class=\"t\" data-t=\"tactics\">tactics</span> that alienate the population the <span class=\"t\" data-t=\"strategy\">strategy</span> needs, methodical deliberate battle against a faster <span class=\"t\" data-t=\"opponent\">opponent</span>.", "selfcheck": ["Have I stated the <span class=\"t\" data-t=\"military strategic aim\">military strategic aim</span> and confirmed whether the <span class=\"t\" data-t=\"strategy\">strategy</span> is annihilation or erosion?", "Have I identified the strategic and operational centers of gravity and a <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> I can actually attack?", "Do I have one unifying <span class=\"t\" data-t=\"campaign concept\">campaign concept</span>, with intent stated explicitly?", "Are my <span class=\"t\" data-t=\"phase\">phases</span> event-driven, each with its own intent, planned forward and backward so the two mesh?", "Is the current <span class=\"t\" data-t=\"phase\">phase</span> detailed and are the later <span class=\"t\" data-t=\"phase\">phases</span> conceptual — intent plus options?", "Have I defined the <span class=\"t\" data-t=\"end state\">end state</span> and planned termination, transition, and <span class=\"t\" data-t=\"reconstitution\">reconstitution</span>?", "Does the <span class=\"t\" data-t=\"plan\">plan</span> carry a <span class=\"t\" data-t=\"logistics\">logistics</span> concept that makes it feasible through to the end?", "Is the <span class=\"t\" data-t=\"plan\">plan</span> concise enough to be read, remembered, and adapted?", "Am I fighting only where it is strategically advantageous or necessary?", "Am I exploiting every tactical result — including defeats — toward the strategic aim?"], "selfcheck_note": "", "application": [{"lead": "Campaign = project; operation = session; engagement = task.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: without an operational design that synthesizes tactical results, what passes for operations is the accumulation of tactical victories. Translation: the operational level is the discipline missing from the recurring stall pattern — sessions accumulate finished designs (tactical victories) with no <span class=\"t\" data-t=\"campaign\">campaign</span> connecting them to the strategic aim. BOLO 25's standard flow is the <span class=\"t\" data-t=\"campaign plan\">campaign plan</span> template, and its first line is the aim."}, {"lead": "Event-driven phasing, planned forward and backward → the gate structure.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: <span class=\"t\" data-t=\"phase\">phases</span> are natural subdivisions ending on <span class=\"t\" data-t=\"event\">events</span>, each with its own intent; <span class=\"t\" data-t=\"plan\">plan</span> from now toward the <span class=\"t\" data-t=\"end state\">end state</span> and from the <span class=\"t\" data-t=\"end state\">end state</span> back to now, and mesh the two. Translation: a <span class=\"t\" data-t=\"phase\">phase</span> ends when a decision is made or an artifact ships, never on a date. The backward pass from the <span class=\"t\" data-t=\"end state\">end state</span> exposes the <span class=\"t\" data-t=\"phase\">phase</span> that has no <span class=\"t\" data-t=\"event\">event</span> closing it — that is where the stall lives."}, {"lead": "Near-detailed, far-conceptual → planning cadence.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: <span class=\"t\" data-t=\"plan\">plan</span> the initial <span class=\"t\" data-t=\"phase\">phase</span> with <span class=\"t\" data-t=\"certainty\">certainty</span>; later <span class=\"t\" data-t=\"phase\">phases</span> become increasingly general, \"perhaps consisting of no more than a general intent and several contingencies and options.\" Translation: detail only the current <span class=\"t\" data-t=\"phase\">phase</span> in the <span class=\"t\" data-t=\"plan\">plan</span>; carry intent and options for the rest. This stops the pattern of designing every <span class=\"t\" data-t=\"phase\">phase</span> in full, then discarding the lot when <span class=\"t\" data-t=\"phase\">phase</span> one changes the <span class=\"t\" data-t=\"situation\">situation</span>."}, {"lead": "Conflict termination and end state → definition of done, written first.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: define the acceptable <span class=\"t\" data-t=\"end state\">end state</span> from the earliest moment; check it removes the seeds of further conflict; <span class=\"t\" data-t=\"plan\">plan</span> disengagement, transition, and <span class=\"t\" data-t=\"reconstitution\">reconstitution</span>. Translation: before the last push, the <span class=\"t\" data-t=\"plan\">plan</span> states what justifies stopping, what hand-off or archive follows, and how the operator reconstitutes — Oscar Mike park-and-sweep and the <code>_CACHE/</code> session note are the <span class=\"t\" data-t=\"reconstitution\">reconstitution</span> and transition steps."}, {"lead": "Logistics concept → the resource line in every plan.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: a <span class=\"t\" data-t=\"plan\">plan</span> that cannot be logistically supported is fanciful wishes; at the operational level <span class=\"t\" data-t=\"logistics\">logistics</span> dictates what is possible, and failure to anticipate costs weeks, not hours. Translation: every project <span class=\"t\" data-t=\"plan\">plan</span> carries a line for time, attention, tokens, and money through to the <span class=\"t\" data-t=\"end state\">end state</span>, reconciled against the event-driven <span class=\"t\" data-t=\"phase\">phases</span>. The gate checks <span class=\"t\" data-t=\"logistical culmination\">logistical culmination</span> before it checks progress."}, {"lead": "Aims, resources, constraints → the sit rep's blocker block.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: when imposed conditions prevent the aim, the <span class=\"t\" data-t=\"commander\">commander</span> must request relaxation of the aims or the limitations — and may never use those conditions as an excuse. Translation: the sit rep surfaces a blocker as a formal request — relax the aim, or relax the constraint, or add resources — rather than working around it silently. Two-way flow: how copy pushes intent down to the AI partner; the sit rep pushes ground truth back up. \"The fingers have to know what the brain is feeling for, and the brain has to know what the fingers are actually touching.\""}, {"lead": "The four tempo generators → session design; boresight as the tempo check.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: <span class=\"t\" data-t=\"tempo\">tempo</span> comes from simultaneous actions, prepared sequels, decentralized decisions inside a unifying intent, and avoiding unnecessary combat. Translation: parallel subagents, the next step already queued before the current one lands, <span class=\"t\" data-t=\"mission-type order\">mission-type orders</span> to the partner, and refusal to do work that does not move the aim. \"Boresight\" is the check on the fourth generator — is this engagement strategically necessary, or merely winnable?"}, {"lead": "Main effort location depends on strategy → know when the build is supporting.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: under annihilation the armed <span class=\"t\" data-t=\"force\">forces</span> are the <span class=\"t\" data-t=\"main effort\">main effort</span>; under erosion the <span class=\"t\" data-t=\"main effort\">main effort</span> may be diplomatic, economic, or informational and the military supports. Translation: in a build-it project the artifact is <span class=\"t\" data-t=\"main effort\">main effort</span> and writing supports it; in a change-the-process project, the writing, comms, and cadence are <span class=\"t\" data-t=\"main effort\">main effort</span> and the build supports them. Naming which prevents the AI partner from optimizing the supporting effort."}], "marks": []}, {"id": "MIL.04", "bvx_id": "BVX.1114", "title": "MCDP 1-3 Tactics", "author": "U.S. Marine Corps (HQMC)", "year": "1997", "edition": "Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "maneuver-warfare", "tactics", "decision-making", "tempo", "main-effort", "ooda-loop"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997)", "🧬 MIL.05 — MCDP 2 Intelligence — USMC (1997)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)"], "feeds": [{"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "Main effort, decision cycle (OODA), speed-vs-haste launch criteria, the reserve, and friction-point drills are the skeleton of the standard project flow (BOLO 25)."}, {"layer": "01_NARRATIVE_FRAMEWORKS", "variable": "collision_engine", "strength": "primary", "note": "Battle as the collision of animate wills; combined arms as dilemma not problem; trapping vs pushing; cheng/ch'i — direct engines for scene-level conflict design."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Mission tactics, commander's intent, and implicit communication are the doctrine behind the 'how copy' and 'main effort' prowords."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "secondary", "note": "Probabilistic view of combat; no fixed rules but bounds; a decision must produce a result beyond itself."}], "file": "🧬 MIL.04 — MCDP 1-3 Tactics — USMC (1997).md", "thesis": "<span class=\"t\" data-t=\"tactics\">Tactics</span> is the art and science of achieving a decision — a result that <span class=\"t\" data-t=\"reach\">reaches</span> beyond the engagement itself — by focusing <span class=\"t\" data-t=\"combat power\">combat power</span> through a single <span class=\"t\" data-t=\"main effort\">main effort</span> against a <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span>, acting consistently faster than the <span class=\"t\" data-t=\"opponent\">opponent</span> can react, and ruthlessly exploiting every advantage until the issue is settled; no formula produces this, only <span class=\"t\" data-t=\"military judgment\">military judgment</span> built through study, drill, and free-play practice. ---", "invariants": [{"lead": "Combat is probabilistic, not deterministic.", "body": "Battle is the collision of animate, interactive, unpredictable <span class=\"t\" data-t=\"will\">wills</span>; <span class=\"t\" data-t=\"outcomes\">outcomes</span> are anticipated only as <span class=\"t\" data-t=\"probabilities\">probabilities</span>. Treating combat as a closed mechanical system produces centralized <span class=\"t\" data-t=\"control\">control</span>, prescriptive orders, and units that are overwhelmed the moment <span class=\"t\" data-t=\"event\">events</span> depart from the script."}, {"lead": "There are no fixed rules — but there are bounds.", "body": "No formula, process, acronym, or buzzword answers the tactical question; every <span class=\"t\" data-t=\"situation\">situation</span> is different. History is studied to build one's own <span class=\"t\" data-t=\"judgment\">judgment</span>, never to retrieve someone else's scheme."}, {"lead": "A decision must lead to a result beyond itself.", "body": "An engagement is decisive only if it feeds directly into <span class=\"t\" data-t=\"campaign\">campaign</span> or war success. Incremental gains that connect to nothing waste every life, hour, and round spent on them."}, {"lead": "Decisiveness is never sought for its own sake.", "body": "The deck is stacked before the cards are laid on the table — the <span class=\"t\" data-t=\"situation\">situation</span> is shaped so the battle goes your way. Seeking decision without that preparation is an irresponsible gamble."}, {"lead": "Speed is relative and must be continuous.", "body": "<span class=\"t\" data-t=\"speed\">Speed</span> matters only if you <span class=\"t\" data-t=\"act\">act</span> faster than the <span class=\"t\" data-t=\"opponent\">opponent</span>, and intermittent bursts hand the initiative back during every halt. Time is a <span class=\"t\" data-t=\"weapon\">weapon</span>; idleness is a cost paid to the enemy."}, {"lead": "Advantage does not finish the enemy; exploitation does.", "body": "The enemy does not surrender for being placed at a disadvantage. <span class=\"t\" data-t=\"victory\">Victory</span> is the product of small advantages exploited immediately and repeatedly until one becomes decisive and the action turns into a rout."}, {"lead": "Control in combat is a delusion; cooperation is what harmonizes.", "body": "Chaos breaks <span class=\"t\" data-t=\"control\">control</span> down, and attempts to impose it kill the initiative <span class=\"t\" data-t=\"tactics\">tactics</span> depends on. What keeps dispersed units working toward one result is <span class=\"t\" data-t=\"cooperation\">cooperation</span> — the union of self-discipline and initiative in pursuit of a common goal."}, {"lead": "Failure to act is worse than an honest error.", "body": "In <span class=\"t\" data-t=\"situation\">situations</span> clearly requiring independent decision the leader has a duty to make one. Inaction from a failure of moral courage breaks faith in the chain of <span class=\"t\" data-t=\"command\">command</span>; a <span class=\"t\" data-t=\"judgment\">judgment</span> error from sincere effort does not."}], "heuristics": [{"situation": "Any new <span class=\"t\" data-t=\"situation\">situation</span>", "do": "Ask \"In this <span class=\"t\" data-t=\"situation\">situation</span>, what efforts <span class=\"t\" data-t=\"will\">will</span> be decisive?\" — and keep asking as the <span class=\"t\" data-t=\"situation\">situation</span> changes", "not": "Retrieve what someone else did in a slightly similar <span class=\"t\" data-t=\"situation\">situation</span>"}, {"situation": "Choosing where to strike", "do": "Hit a <i>critical</i> vulnerability — the capability without which the enemy cannot function — <span class=\"t\" data-t=\"strength\">strength</span> against weakness, where attention is not focused", "not": "Attack a target because it is vulnerable, or attack the front because that is where the enemy is"}, {"situation": "Many actions competing for resources", "do": "Designate one <span class=\"t\" data-t=\"main effort\">main effort</span>; every other unit asks \"How can I best support the <span class=\"t\" data-t=\"main effort\">main effort</span>?\"; when a neighbor breaks through, shift the designation and move the support with it", "not": "Spread effort evenly; leave the original <span class=\"t\" data-t=\"main effort\">main effort</span> in place while the breakthrough goes unsupported"}, {"situation": "Time available before engagement", "do": "Analytical decisionmaking — generate and compare options", "not": "Rush an intuitive call when there is time to deliberate"}, {"situation": "Engaged, time short", "do": "Intuitive decisionmaking — recognize the pattern, <span class=\"t\" data-t=\"act\">act</span> on it", "not": "Stall for a complete comparison of options or for more <span class=\"t\" data-t=\"information\">information</span>"}, {"situation": "Enemy has a workable response", "do": "Build a dilemma (<span class=\"t\" data-t=\"combined arms\">combined arms</span>, fix-and-flank): every move to avoid one threat exposes them to another", "not": "Present a single problem they can solve by moving"}, {"situation": "You have just succeeded", "do": "Exploit — pour through the gap, pursue, disrupt in depth; consolidate only when the gain is worth surrendering the initiative", "not": "Stop to eat, consolidate by reflex, \"possess the field\""}, {"situation": "<span class=\"t\" data-t=\"situation\">Situation</span> still forming", "do": "Set the stage and wait — let the ambush fill, let the diversion take effect", "not": "Counterattack too soon and merely push back what could have been encircled"}, {"situation": "<span class=\"t\" data-t=\"planning\">Planning</span> under <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>", "do": "A few <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span>; modular, loosely coupled, simple <span class=\"t\" data-t=\"plan\">plans</span>; a <span class=\"t\" data-t=\"reserve\">reserve</span> sized to the <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>", "not": "Many tightly coupled branches no one can rehearse; everything committed at once"}, {"situation": "Pressure to move now", "do": "<span class=\"t\" data-t=\"speed\">Speed</span>: reconnaissance done, support arranged, every available person brought up, then launch on a predetermined <span class=\"t\" data-t=\"plan\">plan</span>", "not": "Haste: commit early without recon or support and finish very slowly"}, {"situation": "Approaching a transition", "do": "Drill the <span class=\"t\" data-t=\"friction point\">friction point</span> — assembly-to-attack, patrol-to-ambush, defense-to-counterattack; rehearse task-organization changes", "not": "Treat transitions as pauses and improvise the reorganization under fire"}], "concepts": [{"title": "Achieving a Decision — Military Judgment", "body": "<span class=\"t\" data-t=\"judgment\">Judgment</span> is understanding the <span class=\"t\" data-t=\"situation\">situation</span> plus acting decisively. Understanding: work METT-T (mission, enemy, terrain and weather, troops and support, time), assume the enemy's role, and ask what <span class=\"t\" data-t=\"will\">will</span> be decisive — repeatedly, as the <span class=\"t\" data-t=\"situation\">situation</span> changes. Acting: identify <span class=\"t\" data-t=\"critical vulnerabilities\">critical vulnerabilities</span>, shape the operating area to keep several options open, designate a <span class=\"t\" data-t=\"main effort\">main effort</span>, and pursue the goal with <span class=\"t\" data-t=\"boldness\">boldness</span> (dare to win big) and ruthlessness (increase the pressure once ahead), both tempered by <span class=\"t\" data-t=\"judgment\">judgment</span>. The core skill is pattern recognition — filling in the picture correctly from a few pieces (<span class=\"t\" data-t=\"coup d'oeil\">coup d'oeil</span>)."}, {"title": "Main Effort", "body": "Of every action under way, one is most critical to success at this moment; the unit assigned it is the <span class=\"t\" data-t=\"main effort\">main effort</span>, the focal point on which the <span class=\"t\" data-t=\"force\">force</span>'s <span class=\"t\" data-t=\"combat power\">combat power</span> converges. It receives priority for every kind of support and harmonizes subordinate initiative — faced with a decision, everyone asks how best to support it. <span class=\"t\" data-t=\"main effort\">Main effort</span> implies <span class=\"t\" data-t=\"economy of force\">economy of force</span>: not using as little as you can get away with, but wasting nothing — uncommitted <span class=\"t\" data-t=\"force\">forces</span> support indirectly through feints, demonstrations, and tying down enemy <span class=\"t\" data-t=\"reserve\">reserves</span>. The <span class=\"t\" data-t=\"main effort\">main effort</span> shifts as <span class=\"t\" data-t=\"event\">events</span> unfold, and a shift that does not move the support is merely nominal."}, {"title": "Leverage over Muscle", "body": "Advantage comes from using the <span class=\"t\" data-t=\"opponent\">opponent</span>'s <span class=\"t\" data-t=\"strength\">strength</span> and momentum against him, not from overpowering him. The tools: <span class=\"t\" data-t=\"combined arms\">combined arms</span> (a no-win dilemma across arms), maneuver in space and in time, exploiting terrain, weather, and darkness, complementary <span class=\"t\" data-t=\"force\">forces</span> (the cheng that fixes and the ch'i that bids for decision — interchangeable), <span class=\"t\" data-t=\"surprise\">surprise</span> through deception, stealth, and ambiguity, <span class=\"t\" data-t=\"trapping\">trapping</span> rather than pushing (a pushed enemy returns tomorrow; a trapped one is destroyed), and asymmetry — fighting on your terms with dissimilar means."}, {"title": "The Ambush Mentality", "body": "Turn every <span class=\"t\" data-t=\"situation\">situation</span> into an ambush. Five features: <span class=\"t\" data-t=\"surprise\">surprise</span> is the rule, not the exception; the enemy is drawn into the trap, usually by making one course of action look inviting; the ambush is invisible until it is too late to react (a visible ambush is a target); shock — hold fire until everything is in range, then open all at once; and the <span class=\"t\" data-t=\"focus\">focus</span> is the enemy, not the terrain. The reverse-slope defense, the artillery raid, the fastbreak, the trap block — all are ambushes."}, {"title": "Speed, Time, and Tempo", "body": "<span class=\"t\" data-t=\"speed\">Speed</span> is more than miles per hour. It is physical <span class=\"t\" data-t=\"speed\">speed</span> on the approach (cuts reaction time), through the enemy (changes the <span class=\"t\" data-t=\"situation\">situation</span> faster than he can react), and past him (makes reaction irrelevant); it is using every minute even while stationary; it is timing — knowing when not to <span class=\"t\" data-t=\"act\">act</span>; it is relative to the enemy; it must be continuous; and it is fast transitions, because transitions are where <span class=\"t\" data-t=\"friction\">friction</span> eats <span class=\"t\" data-t=\"tempo\">tempo</span>. Boyd's <span class=\"t\" data-t=\"ooda loop\">OODA loop</span> names the mechanism: while the enemy observes and orients on your first action you are acting on your second; the gap widens with each cycle; everything he does is too late."}, {"title": "Becoming Faster", "body": "Five levers. Simplicity in <span class=\"t\" data-t=\"plan\">plans</span>, staffs, <span class=\"t\" data-t=\"command and control\">command and control</span>, and action — large staffs are among war's greatest consumers of time. Decentralization through <span class=\"t\" data-t=\"mission tactics\">mission tactics</span> (assign the task and its purpose, not the how) and <span class=\"t\" data-t=\"commander's intent\">commander's intent</span> (so <span class=\"t\" data-t=\"subordinates\">subordinates</span> adapt without losing unity of effort). Experience — real or synthetic through decision games, sand tables, and rehearsals — which also yields <span class=\"t\" data-t=\"implicit communication\">implicit communication</span> (shared understanding needing few words) and lateral communication (leaders talking to leaders, not up and down the chain). The <span class=\"t\" data-t=\"commander\">commander</span> positioned at the point of <span class=\"t\" data-t=\"friction\">friction</span>. Fitness, so <span class=\"t\" data-t=\"speed\">speed</span> is sustained."}, {"title": "Adapting", "body": "<span class=\"t\" data-t=\"adaptability\">Adaptability</span> is shortening the time it takes to adjust to each new <span class=\"t\" data-t=\"situation\">situation</span>. Two modes: anticipation (<span class=\"t\" data-t=\"planning\">planning</span>, immediate-action drills, standing operating procedures — pre-designed responses that seize initiative until considered action is possible) and <span class=\"t\" data-t=\"improvisation\">improvisation</span> (creative, intuitive adjustment on the spot). Enablers: flexible <span class=\"t\" data-t=\"plan\">plans</span> with a few branches (options within the current operation) and sequels (what follows <span class=\"t\" data-t=\"victory\">victory</span>, defeat, or stalemate); modular, loosely coupled <span class=\"t\" data-t=\"plan\">plans</span>, so changing one part does not <span class=\"t\" data-t=\"force\">force</span> changing all; and decentralized authority to the <span class=\"t\" data-t=\"commander\">commander</span> closest to <span class=\"t\" data-t=\"event\">events</span>, always within the higher intent."}, {"title": "Exploiting Success and the Reserve", "body": "Casualty rates stay roughly even until one side tries to flee; the rout is where decisive results come from. Three modes of exploiting an advantage: consolidation (protect the gain, knowingly surrender initiative), exploitation (disorganize the enemy system in depth), pursuit (catch and destroy a <span class=\"t\" data-t=\"force\">force</span> that has lost cohesion). The <span class=\"t\" data-t=\"reserve\">reserve</span> is <span class=\"t\" data-t=\"combat power\">combat power</span> withheld to influence future action — the tool for both opportunity and crisis. The more uncertain the <span class=\"t\" data-t=\"situation\">situation</span>, the larger the <span class=\"t\" data-t=\"reserve\">reserve</span>; give it the best unit or the mobility assets; reconstitute it as soon as it is spent; once committed it usually becomes the <span class=\"t\" data-t=\"main effort\">main effort</span>. Intangibles — fatigue, morale, sortie rates, low-density munitions, fuel — are <span class=\"t\" data-t=\"reserve\">reserves</span> too. ---"}], "vocabulary": [{"term": "Tactics", "definition": "The art and science of winning engagements and battles — creative employment of <span class=\"t\" data-t=\"combat power\">combat power</span> (art) resting on mastered techniques and procedures (science)"}, {"term": "Combat power", "definition": "The total destructive and disruptive <span class=\"t\" data-t=\"force\">force</span> a unit can apply against the <span class=\"t\" data-t=\"opponent\">opponent</span> at a given time — physical, moral, and mental factors combined"}, {"term": "Decision (decisive)", "definition": "A battle or engagement whose result leads directly to larger success in the <span class=\"t\" data-t=\"campaign\">campaign</span> or war; the opposite of incremental gain"}, {"term": "Military judgment", "definition": "The developed ability to understand a <span class=\"t\" data-t=\"situation\">situation</span> and <span class=\"t\" data-t=\"act\">act</span> decisively; honed by experience, <span class=\"t\" data-t=\"education\">education</span>, and practice"}, {"term": "Pattern recognition / coup d'oeil", "definition": "Grasping the true significance of a <span class=\"t\" data-t=\"situation\">situation</span> from limited <span class=\"t\" data-t=\"information\">information</span> — \"stroke of the eye,\" tactical sense"}, {"term": "Critical vulnerability", "definition": "A vulnerability whose exploitation destroys a capability without which the enemy cannot function effectively"}, {"term": "Shaping", "definition": "Lethal and nonlethal actions that make the enemy vulnerable, dictate the time and place of battle, and preserve multiple friendly options"}, {"term": "Main effort", "definition": "The unit assigned the mission most critical to success at that moment; the focal point of the <span class=\"t\" data-t=\"force\">force</span>'s <span class=\"t\" data-t=\"combat power\">combat power</span> and support"}, {"term": "Economy of force", "definition": "Making effective use of every asset — <span class=\"t\" data-t=\"force\">forces</span> not directly supporting the <span class=\"t\" data-t=\"main effort\">main effort</span> support it indirectly"}, {"term": "Combined arms", "definition": "Integrating arms so that any action the enemy takes to avoid one threat increases vulnerability to another — a dilemma, not a problem"}, {"term": "Cheng / Ch'i", "definition": "Sun Tzu: the direct, fixing action / the unexpected, extraordinary action that bids for decision; interchangeable in battle"}, {"term": "Trapping", "definition": "Destroying the enemy's ability to think through a dilemma, as opposed to pushing him off ground he retakes tomorrow"}, {"term": "Ambush mentality", "definition": "Turning every <span class=\"t\" data-t=\"situation\">situation</span> into an ambush: <span class=\"t\" data-t=\"surprise\">surprise</span>, lure, invisibility, shock, <span class=\"t\" data-t=\"focus\">focus</span> on the enemy"}, {"term": "Tempo", "definition": "<span class=\"t\" data-t=\"speed\">Speed</span> plus timing — generating and maintaining a fast pace when it counts and recovering when it does not hurt"}, {"term": "Friction point", "definition": "A transition in time and space — formation to formation, posture to posture — where <span class=\"t\" data-t=\"tempo\">tempo</span> is lost or preserved"}, {"term": "OODA loop", "definition": "Boyd's observation–orientation–decision–action cycle; conflict as time-competitive cycles, maneuver as being consistently faster"}, {"term": "Mission tactics", "definition": "Assigning a mission and its purpose without specifying how it is to be accomplished"}, {"term": "Commander's intent", "definition": "The purpose behind the task, enabling <span class=\"t\" data-t=\"subordinates\">subordinates</span> to adapt without diffusion of effort"}, {"term": "Implicit communication", "definition": "Mutual understanding requiring little or no talk — faster and more reliable than explicit communication"}, {"term": "Branch / Sequel", "definition": "Branch: an option within the current operation for changing conditions. Sequel: the course of action following a probable outcome"}, {"term": "Coupling", "definition": "The degree to which parts of a <span class=\"t\" data-t=\"plan\">plan</span> depend on each other; loosely coupled <span class=\"t\" data-t=\"plan\">plans</span> change without cascading"}, {"term": "Reserve", "definition": "<span class=\"t\" data-t=\"combat power\">Combat power</span> initially withheld to influence future action — the tool for clinching <span class=\"t\" data-t=\"victory\">victory</span> or averting crisis"}, {"term": "Consolidation / Exploitation / Pursuit", "definition": "Protect the gain / disorganize the enemy in depth / catch and destroy a <span class=\"t\" data-t=\"force\">force</span> attempting to escape"}, {"term": "Cooperation", "definition": "The union of self-discipline and initiative in pursuit of a common goal; the component of <span class=\"t\" data-t=\"control\">control</span> that survives chaos"}], "quotes": [{"quote": "In <span class=\"t\" data-t=\"tactics\">tactics</span>, the most important thing is not whether you go left or right, but why you go left or right.", "caption": ""}, {"quote": "The leader who frantically strives to remember what someone else did in some slightly similar <span class=\"t\" data-t=\"situation\">situation</span> has already set his feet on a well-traveled road to ruin.", "caption": ""}, {"quote": "Identifying the <span class=\"t\" data-t=\"main effort\">main effort</span> is the principal and most important answer to the question, 'How do we achieve a decision?'", "caption": ""}, {"quote": "<span class=\"t\" data-t=\"victory\">Victory</span> in combat is rarely the product of the initial <span class=\"t\" data-t=\"plan\">plan</span>, but rather of ruthlessly exploiting any advantage, no matter how small, until it succeeds.", "caption": ""}, {"quote": "Not all activities support the mission. A unit's <span class=\"t\" data-t=\"energy\">energy</span> is not easily replenished and should be treated as a precious resource to be expended only towards decisive goals.", "caption": ""}, {"quote": "There is nothing 'orthodox' about failure due to an inability to adapt.", "caption": ""}, {"quote": "It is probably a mistake to speak of <span class=\"t\" data-t=\"control\">control</span> in combat.", "caption": ""}, {"quote": "The enemy <span class=\"t\" data-t=\"will\">will</span> not surrender simply by being placed at a disadvantage.", "caption": ""}], "doesnt_work": "Deterministic force-ratio prediction, centralized <span class=\"t\" data-t=\"control\">control</span> and micromanagement, overly prescriptive orders and <span class=\"t\" data-t=\"plan\">plans</span>, incrementalism and attrition (a hill here, a town there, body counts), pushing contests that let the enemy come back tomorrow, one-handed punching (one arm at a time), symmetrical fighting (tanks against tanks), seeking decision before the deck is stacked, <span class=\"t\" data-t=\"boldness\">boldness</span> without <span class=\"t\" data-t=\"judgment\">judgment</span> (recklessness) and ruthlessness without <span class=\"t\" data-t=\"judgment\">judgment</span> (cruelty), haste mistaken for <span class=\"t\" data-t=\"speed\">speed</span>, intermittent bursts of <span class=\"t\" data-t=\"speed\">speed</span> with long halts, large staffs, detailed tightly coupled <span class=\"t\" data-t=\"plan\">plans</span>, more <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span> than can be rehearsed, counterattacking too soon, consolidating by reflex, throwing in the last <span class=\"t\" data-t=\"reserve\">reserve</span> early, discipline that is imposed only, school solutions in critiques, damaging a leader's self-esteem in public, waiting for war to begin one's <span class=\"t\" data-t=\"education\">education</span>.", "selfcheck": ["Have I named one <span class=\"t\" data-t=\"main effort\">main effort</span> right now — and is every other effort actually supporting it?", "Have I asked \"what <span class=\"t\" data-t=\"will\">will</span> be decisive here?\" today, not only when the project began?", "Am I striking a <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span>, or the most visible target?", "Am I acting faster than the <span class=\"t\" data-t=\"situation\">situation</span> changes — continuously, not in bursts?", "Is the <span class=\"t\" data-t=\"plan\">plan</span> simple, loosely coupled, with a few rehearsable <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span>?", "Am I holding a <span class=\"t\" data-t=\"reserve\">reserve</span> proportional to the <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>?", "When something works, do I pour into it immediately rather than consolidate by reflex?", "Do the people I work with know the intent well enough to <span class=\"t\" data-t=\"act\">act</span> without asking?", "Am I positioned at the point of <span class=\"t\" data-t=\"friction\">friction</span>?", "Have I drilled the transitions?"], "selfcheck_note": "", "application": [{"lead": "Main effort → the one live line.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the unit whose mission is most critical right now gets priority for all support, and a redesignation that does not move the support is nominal. Translation: at any moment STATE.md names one <span class=\"t\" data-t=\"main effort\">main effort</span>; every other thread answers \"how does this support it?\"; when a side project breaks through, the AI partner's attention moves with the redesignation. The proword <i><span class=\"t\" data-t=\"main effort\">main effort</span></i> is this <span class=\"t\" data-t=\"doctrine\">doctrine</span> verbatim."}, {"lead": "Achieving a decision → the stall pattern's antidote.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: a result is decisive only if it produces something beyond the engagement; incremental gains that connect to nothing are waste. Translation: a finished design blocked on one unanswered decision is an indecisive battle. The standard project flow (BOLO 25) needs a decision gate — \"what result beyond this task does it produce, and what decision does it wait on?\" — and the decision gets made, not deferred and rebuilt."}, {"lead": "OODA / tempo → the sit rep cadence.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: conflict is time-competitive observe-orient-decide-act cycles; orientation is where the <span class=\"t\" data-t=\"plan\">plan</span> is built. Translation: <i>sit rep</i> is the observe-orient <span class=\"t\" data-t=\"phase\">phase</span> run on demand; the board it triggers (Block 0 cache, Block IV BOLO/PMCS) is the orientation product. A sit rep that does not end in a decision has not closed the loop."}, {"lead": "Mission tactics + commander's intent → \"how copy.\"", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: assign the mission and its purpose, leave the how to the subordinate; <span class=\"t\" data-t=\"implicit communication\">implicit communication</span> built on shared SOP is faster than explicit. Translation: <i>how copy?</i> ends orders; \"Good copy\" plus readback confirms the intent landed; execution is then decentralized to the AI partner without step-by-step approval. SOP.md is the shared experience that makes <span class=\"t\" data-t=\"implicit communication\">implicit communication</span> possible."}, {"lead": "Critical vulnerability + shaping → \"boresight.\"", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: a target is not worth attacking because it is vulnerable; find the capability whose loss stops the enemy from functioning, and shape so options stay open. Translation: <i>boresight</i> re-aims the current effort at the blocker that actually gates the project — usually the unanswered decision — rather than the most visible or most comfortable task."}, {"lead": "Speed vs haste → the launch gate.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: haste commits without reconnaissance or support and finishes slowly; <span class=\"t\" data-t=\"speed\">speed</span> does the reconnaissance, brings up every available asset, then launches on a predetermined <span class=\"t\" data-t=\"plan\">plan</span>. Translation: the project flow's start gate is Patton's list — sources gathered, format contract read, prowords set — after which the run does not pause for approvals."}, {"lead": "Reserve and friction points → uncommitted capacity and drilled transitions.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: withhold capacity to exploit opportunity or meet crisis, larger when <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> is higher; drill the transitions, because that is where <span class=\"t\" data-t=\"tempo\">tempo</span> is lost. Translation: never <span class=\"t\" data-t=\"plan\">plan</span> a session to 100 percent; session open (read STATE.md, challenge/countersign) and session close (cache note, STATE update, BOLO capture, <code>_LOG/</code> move) are the operation's battle drills."}], "marks": []}, {"id": "MIL.05", "bvx_id": "BVX.1115", "title": "MCDP 2 Intelligence", "author": "U.S. Marine Corps (HQMC)", "year": "1997", "edition": "Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "maneuver-warfare", "intelligence", "decision-support", "uncertainty", "signals-and-noise", "intelligence-cycle"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.04 — MCDP 1-3 Tactics — USMC (1997)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)", "🧬 MIL.11 — MCDP 8 Information — USMC (2022)"], "feeds": [{"layer": "_PRIVATE/taxonomy_engine", "variable": "intelligence_cycle", "strength": "primary", "note": "Six-phase cycle (direction → collection → processing → production → dissemination → utilization) maps onto the corpus pipeline; production-as-synthesis and the 'So what?' test are the quality gates; signals/noise is the tagging-error model."}, {"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "Priority intelligence requirements tied to decisions are the problem-framing step of a project; the commander (operator) owns the estimate and the decision; intelligence has no value until acted on."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Push/pull dissemination, pipeline vs alarm channels, 'who really needs this most?' — the doctrine behind sit rep and same-turn BOLO capture."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "secondary", "note": "Intelligence reduces but never eliminates uncertainty; estimates not certainties; knowledge exists as the basis for action."}], "file": "🧬 MIL.05 — MCDP 2 Intelligence — USMC (1997).md", "thesis": "<span class=\"t\" data-t=\"intelligence\">Intelligence</span> is knowledge of the enemy and the environment — synthesized from <span class=\"t\" data-t=\"information\">information</span>, not merely collected — produced for one purpose, supporting the <span class=\"t\" data-t=\"commander\">commander</span>'s decision; it is a <span class=\"t\" data-t=\"command\">command</span> responsibility inseparable from operations, it yields estimates rather than certainties because it faces an independent hostile <span class=\"t\" data-t=\"will\">will</span>, and it can reduce but never eliminate <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>, so its sole measure of quality is whether it gave the <span class=\"t\" data-t=\"commander\">commander</span> enough understanding to decide and <span class=\"t\" data-t=\"act\">act</span>. ---", "invariants": [{"lead": "Intelligence reduces uncertainty; it never eliminates it.", "body": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> is a fundamental attribute of war, and gaps in knowledge of the enemy are natural and unavoidable. A <span class=\"t\" data-t=\"commander\">commander</span> who expects <span class=\"t\" data-t=\"certainty\">certainty</span> has misunderstood the domain, and an <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer who fears being wrong <span class=\"t\" data-t=\"will\">will</span> offer only safe facts."}, {"lead": "Intelligence is knowledge, not information.", "body": "<span class=\"t\" data-t=\"information\">Information</span> is unevaluated raw material — reports, intercepts, photographs. <span class=\"t\" data-t=\"intelligence\">Intelligence</span> is that material combined, compared, analyzed, and given meaning and implication. More <span class=\"t\" data-t=\"information\">information</span> is not more <span class=\"t\" data-t=\"intelligence\">intelligence</span>; too much is as harmful as too little."}, {"lead": "Intelligence has no value until it is acted upon.", "body": "Knowledge exists as the basis for action, not for its own sake. Utilization — decision and execution — belongs to <span class=\"t\" data-t=\"command and control\">command and control</span>, and an <span class=\"t\" data-t=\"intelligence\">intelligence</span> effort whose product is ignored has served no purpose."}, {"lead": "Intelligence is a command responsibility.", "body": "<span class=\"t\" data-t=\"intelligence\">Intelligence</span> failures are failures of <span class=\"t\" data-t=\"command\">command</span> exactly as operations failures are. The <span class=\"t\" data-t=\"commander\">commander</span> states the requirements, makes the final synthesis, owns the estimate, and supervises the effort; the <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer manages it and advises."}, {"lead": "Intelligence is the one command-and-control function that faces an independent, hostile will.", "body": "Every question about the friendly <span class=\"t\" data-t=\"situation\">situation</span> has a cooperative source; the enemy denies, deceives, and changes his <span class=\"t\" data-t=\"plan\">plan</span> when he suspects you know it. Good <span class=\"t\" data-t=\"intelligence\">intelligence</span> can therefore invalidate itself — a correct warning that prompts action that cancels the threat looks wrong afterward."}, {"
