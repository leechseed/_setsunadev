<title>WARROOM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* WATCH register · DAY face — positive polarity for a lit room (MIL-STD-1472H 5.2.2.6; FAA HF-STD-001B 5.3.2.1.6) */
    --bg: #ECE5DF;
    --panel: #F5F0EC;
    --panel-2: #E2D9D3;
    --line: #CFC1BA;
    --line-2: #B8A79F;
    --ink: #372A2F;
    --ink-2: #5A4B51;
    --ink-3: #7E6E75;
    --accent: #8A1F44;
    --accent-soft: #EED4DD;
    --link: #2B5F9E;
    --link-soft: #D6E2F1;
    --good: #2E6B3F;
    --good-soft: #D7E6DA;
    --warn: #7A5D06;
    --warn-soft: #F0E4BF;
    --bad: #B03A22;
    --bad-soft: #F0D6CE;
    --help: #55627A;
    --mark: #F3E6B4;
    --focus: #2B5F9E;
    --shadow: 0 8px 24px rgba(34, 22, 25, 0.16);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --display: "Fraunces", "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    color-scheme: light dark;
  }
  /* contrast control (MIL-STD-1472H 5.2.2.7c): soft ≈7:1 · standard ≈10:1 · high ≈13:1 */
  :root[data-contrast="soft"] { --ink: #4A3C42; --ink-2: #6A5B61; }
  :root[data-contrast="high"] { --ink: #221619; --ink-2: #4A3B41; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      /* WATCH register · NIGHT face — negative polarity for a dark room; black ≤ 2 cd/m² (FAA 5.3.1.9.7), text ≈10:1, never white */
      --bg: #1C191B; --panel: #221E21; --panel-2: #2C2629; --line: #3C3539; --line-2: #4F464B;
      --ink: #CFC6C8; --ink-2: #A0959A; --ink-3: #7B7176;
      --accent: #D25A82; --accent-soft: #3B1E2B;
      --link: #6CC3D9; --link-soft: #1B3038;
      --good: #7EC38F; --good-soft: #1F3326;
      --warn: #D9B65A; --warn-soft: #3A3118;
      --bad: #E58A70; --bad-soft: #3D2119;
      --help: #9AA7B8; --mark: #4A3F1E; --focus: #6CC3D9;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    :root:not([data-theme="light"])[data-contrast="soft"] { --ink: #B5ABAE; --ink-2: #8E8388; }
    :root:not([data-theme="light"])[data-contrast="high"] { --ink: #E6DEE0; --ink-2: #B3A8AD; }
  }
  :root[data-theme="dark"] {
    --bg: #1C191B; --panel: #221E21; --panel-2: #2C2629; --line: #3C3539; --line-2: #4F464B;
      --ink: #CFC6C8; --ink-2: #A0959A; --ink-3: #7B7176;
      --accent: #D25A82; --accent-soft: #3B1E2B;
      --link: #6CC3D9; --link-soft: #1B3038;
      --good: #7EC38F; --good-soft: #1F3326;
      --warn: #D9B65A; --warn-soft: #3A3118;
      --bad: #E58A70; --bad-soft: #3D2119;
      --help: #9AA7B8; --mark: #4A3F1E; --focus: #6CC3D9;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
  }
  :root[data-theme="dark"][data-contrast="soft"] { --ink: #B5ABAE; --ink-2: #8E8388; }
  :root[data-theme="dark"][data-contrast="high"] { --ink: #E6DEE0; --ink-2: #B3A8AD; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--link); }
  code { font-family: var(--mono); font-size: 0.86em; background: var(--panel-2); padding: 0 4px; border-radius: 3px; }
  mark.rm { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- frame ---------- */
  .app {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 360px;
    grid-template-rows: 48px minmax(0, 1fr);
    height: 100vh;
  }
  header.top {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header.top h1 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
  header.top .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
  header.top .nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .ib {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
    font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 4px; cursor: pointer;
  }
  .ib:hover { border-color: var(--line-2); color: var(--ink); }
  .ib[disabled] { opacity: 0.4; cursor: default; }
  .ib kbd { color: var(--ink-3); margin-left: 5px; }

  /* ---------- outliner ---------- */
  nav.outliner { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px 0; }
  .o-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 6px 16px 4px; }
  .o-row {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; padding: 6px 12px 6px 10px; border: 0; border-left: 3px solid transparent;
    background: transparent; color: var(--ink-2); font-family: var(--serif); font-size: 14.5px; cursor: pointer;
  }
  .o-row:hover { background: var(--panel-2); color: var(--ink); }
  .o-row.active { border-left-color: var(--accent); color: var(--ink); background: var(--panel-2); }
  .o-row .mono-g {
    font-family: var(--mono); font-size: 11px; font-weight: 500; text-align: center;
    border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 0; color: var(--ink-2);
  }
  .o-row.active .mono-g { border-color: var(--accent); color: var(--accent); }
  .o-row .hk { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .o-row .t-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o-pins { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; }
  .o-pin { display: flex; align-items: center; gap: 8px; padding: 4px 16px; font-size: 13px; }
  .o-pin .t { flex: 1; }
  .o-pin button { appearance: none; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-family: var(--mono); font-size: 11px; }
  .o-pin.hl { background: var(--accent-soft); }
  .o-empty { padding: 4px 16px; font-size: 12px; color: var(--ink-3); font-style: italic; }

  /* ---------- the sheet ---------- */
  main.sheet { overflow-y: auto; padding: 28px 40px 80px; }
  .measure { max-width: 72ch; margin: 0 auto; }
  .identity { display: grid; grid-template-columns: 84px 1fr; gap: 20px; align-items: start; }
  .portrait {
    width: 84px; height: 84px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 30px; font-weight: 600; color: var(--accent);
    box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--line);
  }
  .portrait.small { width: 30px; height: 30px; font-size: 13px; box-shadow: none; border-radius: 4px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .title { font-family: var(--display); font-size: clamp(26px, 3.2vw, 34px); line-height: 1.1; margin: 4px 0 8px; text-wrap: balance; font-weight: 600; }
  .thesis { font-size: 18px; line-height: 1.55; margin: 0; color: var(--ink); }
  .ageline { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--help); display: flex; gap: 14px; flex-wrap: wrap; }
  .ageline b { color: var(--ink-2); font-weight: 500; }

  .row-label { margin: 28px 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .row-label h2 { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
  .row-label .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .row-label .hint { font-size: 14px; color: var(--help); font-style: italic; margin-left: auto; }

  .traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .trait {
    display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start;
    border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px; background: var(--panel);
    font-size: 14px; line-height: 1.3; cursor: default; text-align: left; color: var(--ink); font-family: var(--serif);
  }
  .trait:hover, .trait:focus-visible { border-color: var(--accent); }
  .trait .sq {
    width: 26px; height: 26px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
    font-family: var(--mono); font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;
  }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill {
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; background: var(--panel);
    font-size: 14px; color: var(--ink-2); cursor: default; display: inline-flex; gap: 6px; align-items: center; font-family: var(--serif);
  }
  .skill:hover, .skill:focus-visible { border-color: var(--link); color: var(--ink); }
  .skill i { font-style: normal; color: var(--link); font-family: var(--mono); font-size: 11px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 30px; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--ink-2); font-family: var(--serif);
    font-size: 14px; padding: 8px 12px 9px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab .n { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: 5px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--ink); }
  .pane { padding-top: 18px; }
  .pane[hidden] { display: none; }

  .concept { margin: 0 0 16px; }
  .concept h3 { margin: 0 0 3px; font-size: 16px; font-weight: 600; }
  .concept p { margin: 0; color: var(--ink); }
  .vtable { width: 100%; border-collapse: collapse; font-size: 16px; }
  .vtable th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--line); }
  .vtable td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .vtable td:first-child { white-space: nowrap; font-weight: 600; width: 1%; padding-right: 18px; }
  blockquote.q { margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-2); }
  blockquote.q p { margin: 0; font-size: 16px; }
  blockquote.q .cap { display: block; margin-top: 4px; font-size: 14px; color: var(--help); font-style: italic; }
  .app-item { margin: 0 0 12px; }
  .app-item b { font-weight: 600; }
  .more { appearance: none; border: 1px dashed var(--line-2); background: transparent; color: var(--ink-2); font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

  .check-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .signed { font-family: var(--mono); font-size: 20px; font-weight: 500; }
  .signed.pos { color: var(--good); } .signed.neg { color: var(--bad); } .signed.zero { color: var(--ink-3); }
  .check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .check input { margin: 4px 0 0; accent-color: var(--good); }
  .check.on { color: var(--ink-3); }
  .check.on span { text-decoration: line-through; text-decoration-color: var(--good); }
  .check-note { font-size: 14px; color: var(--help); font-style: italic; margin-top: 8px; }
  .redlist { display: flex; flex-direction: column; gap: 4px; }
  .red { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 16px; color: var(--ink); }
  .red i { font-style: normal; color: var(--bad); font-family: var(--mono); }

  .cited { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  .cited .list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 8px 3px 4px; background: var(--panel); font-size: 12.5px; color: var(--ink-2); cursor: pointer; font-family: var(--serif);
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip .g { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 4px; color: var(--ink-2); }
  .chip.feed .g { color: var(--accent); border-color: var(--accent); }

  /* ---------- terms + tooltips ---------- */
  .t { color: var(--link); cursor: pointer; border-bottom: 1px dotted transparent; }
  .t:hover, .t.open { border-bottom-color: var(--link); }
  .t.hl { background: var(--link-soft); }
  .tip {
    position: fixed; z-index: 50; max-width: 400px; min-width: 250px;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: var(--shadow);
    padding: 10px 12px 10px; font-size: 15px; line-height: 1.5; color: var(--ink);
  }
  .tip.locked { border-color: var(--accent); }
  .tip .th { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .tip .th b { font-size: 15px; font-weight: 600; }
  .tip .th .lock { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .tip .sense { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; padding: 4px 0; border-top: 1px solid var(--line); }
  .tip .sense:first-of-type { border-top: 0; }
  .tip .sense .g { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; text-align: center; padding: 1px 0; margin-top: 3px; }
  .tip .sense .g.reader { color: var(--accent); border-color: var(--accent); }
  .tip .appears { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tip .appears .lab { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 2px; }
  .tip .appears .g { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 5px; color: var(--ink-2); cursor: pointer; }
  .tip .appears .g:hover { border-color: var(--accent); color: var(--accent); }
  .tip .why { margin: 0; }
  .tip .why b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-top: 6px; }
  .tip .why b.do { color: var(--good); } .tip .why b.not { color: var(--bad); }
  .tip .openg { display: block; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--link); cursor: pointer; }

  /* ---------- glossary panel ---------- */
  aside.glossary { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .g-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .g-head .eyebrow { display: flex; justify-content: space-between; }
  .g-head input {
    width: 100%; font-family: var(--serif); font-size: 14px; padding: 7px 10px; border: 1px solid var(--line-2);
    border-radius: 4px; background: var(--bg); color: var(--ink);
  }
  .g-cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cat { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 3px; cursor: pointer; }
  .cat.on { border-color: var(--accent); color: var(--accent); }
  .g-body { overflow-y: auto; flex: 1; min-height: 0; }
  .g-list { padding: 6px 0; }
  .g-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 5px 14px; font-size: 15px; cursor: pointer; border-left: 3px solid transparent; }
  .g-row:hover { background: var(--panel-2); }
  .g-row.on { border-left-color: var(--accent); background: var(--panel-2); }
  .g-row .srcs { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .g-row .srcs.reader { color: var(--accent); }
  .g-count { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); padding: 6px 14px 0; }
  .g-entry { padding: 14px 14px 30px; }
  .g-entry h2 { font-family: var(--display); font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .g-entry .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .g-entry .meta button { appearance: none; border: 0; background: transparent; color: var(--link); font-family: var(--mono); font-size: 10.5px; cursor: pointer; padding: 0; }
  .g-entry .sense { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .g-entry .sense .g { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 3px; text-align: center; padding: 2px 0; color: var(--ink-2); height: fit-content; cursor: pointer; }
  .g-entry .sense .g.reader { color: var(--accent); border-color: var(--accent); }
  .g-entry .sense .kind { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-top: 3px; }
  .g-entry .appears { margin-top: 12px; }
  .g-entry .appears .lab { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
  .g-entry .list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .g-hist { display: flex; gap: 4px; flex-wrap: wrap; }
  .g-hist .hh { appearance: none; border: 0; background: var(--panel-2); color: var(--ink-2); font-family: var(--serif); font-size: 12px; padding: 2px 8px; border-radius: 3px; cursor: pointer; }

  .kbd-help { position: fixed; bottom: 10px; right: 372px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .kbd-help kbd { color: var(--ink-2); }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px minmax(0, 1fr) 300px; }
    .kbd-help { display: none; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto minmax(0, 1fr) auto; height: auto; min-height: 100vh; }
    nav.outliner { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding: 6px; gap: 4px; }
    .o-label, .o-pins, .o-row .hk, .o-row .t-name { display: none; }
    .o-row { grid-template-columns: 34px; padding: 4px; }
    main.sheet { padding: 20px 18px 40px; overflow: visible; }
    aside.glossary { border-left: 0; border-top: 1px solid var(--line); max-height: 60vh; }
    .tip { max-width: calc(100vw - 24px); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>WARROOM</h1>
    <span class="sub">MCDP 1 to 8 · eleven one-sheets · BVX-LEARN · 1.0 accepted 2026-09-06</span>
    <div class="nav">
      <button class="ib" id="back" type="button" title="Back">←<kbd>B</kbd></button>
      <button class="ib" id="fwd" type="button" title="Forward">→<kbd>N</kbd></button>
      <button class="ib" id="contrast" type="button" title="Text contrast: soft / standard / high">contrast</button>
      <button class="ib" id="theme" type="button" title="Day for a lit room, night for a dark one">theme</button>
    </div>
  </header>

  <nav class="outliner" id="outliner"></nav>

  <main class="sheet" id="sheet"><div class="measure" id="sheetBody"></div></main>

  <aside class="glossary">
    <div class="g-head">
      <div class="eyebrow"><span>Glossary · the register</span><span id="gCount"></span></div>
      <input id="gSearch" type="search" placeholder="Search terms   /" autocomplete="off">
      <div class="g-cats" id="gCats"></div>

<script>
var DATA = {"generated": "2026-09-06", "sheets": [{"id": "MIL.01", "bvx_id": "BVX.1111", "title": "MCDP 1 Warfighting", "author": "U.S. Marine Corps (HQMC)", "year": "1997", "edition": "Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "maneuver-warfare", "commanders-intent", "mission-tactics", "main-effort", "friction-uncertainty", "decentralized-command"], "related": ["🧬 MIL.02 — MCDP 1-1 Strategy — USMC (1997)", "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997)", "🧬 MIL.04 — MCDP 1-3 Tactics — USMC (1997)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)"], "feeds": [{"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "Commander's intent (task + 'in order to'), main effort, mission-type orders, and the planning-horizon rule (less precision the further out) are the load-bearing members of the standard project flow (BOLO 25)."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "primary", "note": "Implicit communication via 'a minimum of key, well-understood phrases' is the doctrinal basis for the proword set: how copy (readback of task + intent), sit rep (subordinate informs, does not wait for permission), main effort (unchanged), boresight (focus on the critical vulnerability)."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "primary", "note": "Friction, uncertainty, fluidity, disorder, and complexity as permanent conditions; the moral outweighs the physical; certainty is never a precondition for action."}, {"layer": "01_NARRATIVE_FRAMEWORKS", "variable": "conflict_theory", "strength": "secondary", "note": "Zweikampf — conflict as two independent wills in continuous mutual adaptation; centers of gravity and critical vulnerabilities as a model for what an antagonist protects and where they break."}], "file": "🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997).md", "thesis": "War is a contest between <mark class=\"rm\"><span class=\"t\" data-t=\"independent wills\">independent wills</span></mark> fought in permanent <mark class=\"rm\"><span class=\"t\" data-t=\"friction\">friction</span></mark>, <mark class=\"rm\"><span class=\"t\" data-t=\"uncertainty\">uncertainty</span></mark>, and <mark class=\"rm\"><span class=\"t\" data-t=\"disorder\">disorder</span></mark>, so <mark class=\"rm\"><span class=\"t\" data-t=\"certainty\">certainty</span></mark> and <mark class=\"rm\"><span class=\"t\" data-t=\"positive control\">positive control</span></mark> are impossible; the side that wins is the side that stops trying to <span class=\"t\" data-t=\"control\">control</span> <span class=\"t\" data-t=\"event\">events</span> and instead generates <mark class=\"rm\"><span class=\"t\" data-t=\"superior tempo\">superior tempo</span></mark> — <mark class=\"rm\"><span class=\"t\" data-t=\"decentralizing decisions\">decentralizing decisions</span></mark> to <mark class=\"rm\"><span class=\"t\" data-t=\"subordinates\">subordinates</span></mark> who <mark class=\"rm\"><span class=\"t\" data-t=\"act\">act</span></mark> on the <mark class=\"rm\"><span class=\"t\" data-t=\"commander's intent\">commander's intent</span></mark>, focusing <mark class=\"rm\"><span class=\"t\" data-t=\"strength\">strength</span></mark> against <mark class=\"rm\"><span class=\"t\" data-t=\"critical vulnerabilities\">critical vulnerabilities</span></mark>, and shattering the enemy's cohesion rather than grinding down their mass. ---", "invariants": [{"lead": "The enemy is an independent will, not an object.", "body": "War is a <mark class=\"rm\"><span class=\"t\" data-t=\"zweikampf\">Zweikampf</span></mark> — two wrestlers, each exerting <mark class=\"rm\"><span class=\"t\" data-t=\"force\">force</span></mark> and <mark class=\"rm\"><span class=\"t\" data-t=\"counterforce\">counterforce</span></mark>. Every <mark class=\"rm\"><span class=\"t\" data-t=\"plan\">plan</span></mark> meets a <mark class=\"rm\"><span class=\"t\" data-t=\"counter-plan\">counter-plan</span></mark>; the <mark class=\"rm\"><span class=\"t\" data-t=\"situation\">situation</span></mark> is a product of <mark class=\"rm\"><span class=\"t\" data-t=\"continuous mutual adaptation\">continuous mutual adaptation</span></mark>, not of one side's execution."}, {"lead": "Friction is permanent.", "body": "<span class=\"t\" data-t=\"friction\">Friction</span> resists all action and saps <mark class=\"rm\"><span class=\"t\" data-t=\"energy\">energy</span></mark>; it makes the simple difficult and the difficult seemingly impossible. <mark class=\"rm\"><span class=\"t\" data-t=\"self-induced friction\">Self-induced friction</span></mark> (<mark class=\"rm\"><span class=\"t\" data-t=\"unclear goals\">unclear goals</span></mark>, <mark class=\"rm\"><span class=\"t\" data-t=\"complicated plans\">complicated plans</span></mark>, <mark class=\"rm\"><span class=\"t\" data-t=\"complex organization\">complex organization</span></mark>) can be reduced; <mark class=\"rm\"><span class=\"t\" data-t=\"external friction\">external friction</span></mark> cannot be eliminated, only fought through by <mark class=\"rm\"><span class=\"t\" data-t=\"will\">will</span></mark> — while raising the enemy's."}, {"lead": "Certainty is unattainable; every action rests on incomplete information.", "body": "The <mark class=\"rm\"><span class=\"t\" data-t=\"fog of war\">fog of war</span></mark> is <mark class=\"rm\"><span class=\"t\" data-t=\"structural\">structural</span></mark>. <mark class=\"rm\"><span class=\"t\" data-t=\"nonlinearity\">Nonlinearity</span></mark> means <mark class=\"rm\"><span class=\"t\" data-t=\"minor incidents\">minor incidents</span></mark> produce <mark class=\"rm\"><span class=\"t\" data-t=\"decisive effects\">decisive effects</span></mark>. <mark class=\"rm\"><span class=\"t\" data-t=\"judgment\">Judgment</span></mark> estimates <mark class=\"rm\"><span class=\"t\" data-t=\"possibilities\">possibilities</span></mark> and <mark class=\"rm\"><span class=\"t\" data-t=\"probabilities\">probabilities</span></mark>; it never removes them."}, {"lead": "Disorder increases over time; only a general framework of order can be imposed.", "body": "<span class=\"t\" data-t=\"plan\">Plans</span> go awry, <mark class=\"rm\"><span class=\"t\" data-t=\"communications\">communications</span></mark> fail, and repeated <mark class=\"rm\"><span class=\"t\" data-t=\"improvisation\">improvisation</span></mark> carries actions far from the <mark class=\"rm\"><span class=\"t\" data-t=\"original scheme\">original scheme</span></mark>. The <mark class=\"rm\"><span class=\"t\" data-t=\"commander\">commander</span></mark> <mark class=\"rm\"><span class=\"t\" data-t=\"influences\">influences</span></mark> the <mark class=\"rm\"><span class=\"t\" data-t=\"general flow\">general flow</span></mark>; the <span class=\"t\" data-t=\"commander\">commander</span> does not <mark class=\"rm\"><span class=\"t\" data-t=\"control\">control</span></mark> each <mark class=\"rm\"><span class=\"t\" data-t=\"event\">event</span></mark>."}, {"lead": "War is a complex, distributed system; centralization contradicts its nature.", "body": "<mark class=\"rm\"><span class=\"t\" data-t=\"outcomes\">Outcomes</span></mark> emerge from countless <mark class=\"rm\"><span class=\"t\" data-t=\"local decisions\">local decisions</span></mark> made on <mark class=\"rm\"><span class=\"t\" data-t=\"local information\">local information</span></mark>. <mark class=\"rm\"><span class=\"t\" data-t=\"full centralization\">Full centralization</span></mark> under a <mark class=\"rm\"><span class=\"t\" data-t=\"single decisionmaker\">single decisionmaker</span></mark> is inconsistent with what war is."}, {"lead": "Moral and mental forces outweigh physical forces.", "body": "<mark class=\"rm\"><span class=\"t\" data-t=\"material factors\">Material factors</span></mark> are easier to measure and less decisive. Any <mark class=\"rm\"><span class=\"t\" data-t=\"doctrine\">doctrine</span></mark> that reduces war to ratios of <span class=\"t\" data-t=\"force\">forces</span> and equipment is inherently flawed. The greatest <mark class=\"rm\"><span class=\"t\" data-t=\"effect of fires\">effect of fires</span></mark> is on the enemy's <mark class=\"rm\"><span class=\"t\" data-t=\"moral strength\">moral strength</span></mark>, not on their <mark class=\"rm\"><span class=\"t\" data-t=\"matériel\">matériel</span></mark>."}, {"lead": "War must serve policy.", "body": "<mark class=\"rm\"><span class=\"t\" data-t=\"military action\">Military action</span></mark> is a <mark class=\"rm\"><span class=\"t\" data-t=\"political instrument\">political instrument</span></mark> and its conduct must support <mark class=\"rm\"><span class=\"t\" data-t=\"political aims\">political aims</span></mark>. Goals outside the means available must not be set; war tends to take its own course once begun."}, {"lead": "Relative speed and focus are the universal generators of combat power.", "body": "<mark class=\"rm\"><span class=\"t\" data-t=\"speed\">Speed</span></mark> is a <mark class=\"rm\"><span class=\"t\" data-t=\"weapon\">weapon</span></mark>; <mark class=\"rm\"><span class=\"t\" data-t=\"focus\">focus</span></mark> is the <mark class=\"rm\"><span class=\"t\" data-t=\"convergence of effects\">convergence of effects</span></mark> at the decisive time and place. <mark class=\"rm\"><span class=\"t\" data-t=\"focus\">Focus</span></mark> demands strict economy elsewhere and therefore the acceptance of <mark class=\"rm\"><span class=\"t\" data-t=\"prudent risk\">prudent risk</span></mark>. <mark class=\"rm\"><span class=\"t\" data-t=\"risk\">Risk</span></mark> is inherent in action and inaction alike."}], "heuristics": [{"situation": "Decision required, <span class=\"t\" data-t=\"information\">information</span> incomplete", "do": "Select a promising course of action with acceptable <span class=\"t\" data-t=\"risk\">risk</span> and execute it now — \"a good <span class=\"t\" data-t=\"plan\">plan</span> violently executed now is better than a perfect <span class=\"t\" data-t=\"plan\">plan</span> executed next week\"", "not": "Wait for more <span class=\"t\" data-t=\"information\">information</span>; agonize over a perfect solution that does not exist"}, {"situation": "Assigning a task to a subordinate", "do": "<span class=\"t\" data-t=\"mission tactics\">Mission tactics</span>: state the task and the intent (\"...in order to...\"), leave the method to the subordinate, intervene only by exception", "not": "Prescribe the method; require permission for every deviation"}, {"situation": "<span class=\"t\" data-t=\"situation\">Situation</span> changes and the assigned task becomes obsolete", "do": "<span class=\"t\" data-t=\"act\">Act</span> on the intent; intent outlasts the task and continues to guide action", "not": "Execute the obsolete task, or halt and wait for new orders"}, {"situation": "Choosing where to apply <span class=\"t\" data-t=\"strength\">strength</span>", "do": "Seek gaps (weakness), avoid surfaces (<span class=\"t\" data-t=\"strength\">strength</span>); direct the <span class=\"t\" data-t=\"main effort\">main effort</span> at a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> through a <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span>", "not": "Attack <span class=\"t\" data-t=\"strength\">strength</span> frontally because that is where the enemy is"}, {"situation": "<span class=\"t\" data-t=\"main effort\">Main effort</span> strikes a surface; another unit finds a gap", "do": "Redesignate the second unit as <span class=\"t\" data-t=\"main effort\">main effort</span> and pull <span class=\"t\" data-t=\"combat power\">combat power</span> through the gap (<span class=\"t\" data-t=\"reconnaissance pull\">reconnaissance pull</span>)", "not": "Reinforce failure; push per the <span class=\"t\" data-t=\"original scheme\">original scheme</span> (<span class=\"t\" data-t=\"command\">command</span> push)"}, {"situation": "Several efforts competing for support", "do": "Designate one <span class=\"t\" data-t=\"main effort\">main effort</span>; everything else supports it; strict economy elsewhere; ask \"How can I best support the <span class=\"t\" data-t=\"main effort\">main effort</span>?\"", "not": "Spread resources evenly; leave priority implicit"}, {"situation": "Junior leader errs through over-boldness", "do": "Deal leniently; counsel and critique; keep encouraging <span class=\"t\" data-t=\"boldness\">boldness</span> and initiative", "not": "Zero-defects punishment that stifles initiative"}, {"situation": "Junior leader errs through inaction or timidity", "do": "Deal severely; lack of orders is never a justification for inaction", "not": "Treat inaction as the safe default"}, {"situation": "<span class=\"t\" data-t=\"planning\">Planning</span> far ahead", "do": "Impose less precision the further out you look; lay groundwork and preserve several options", "not": "Build a detailed timetable for the whole operation"}, {"situation": "Communicating between key people (\"actuals\")", "do": "Talk directly, orally, in person; rely on <span class=\"t\" data-t=\"implicit communication\">implicit communication</span> built on shared philosophy and experience", "not": "Route through intermediaries; write long, detailed, explicit instructions"}, {"situation": "Disagreeing with a senior", "do": "Give an honest professional opinion until the decision is made; then support the decision as your own", "not": "Yes-man compliance before the decision; undermining after it"}, {"situation": "<span class=\"t\" data-t=\"training\">Training</span> or rehearsing", "do": "Opposed, free-play exercises with real <span class=\"t\" data-t=\"friction\">friction</span>; critique immediately afterward; <span class=\"t\" data-t=\"focus\">focus</span> on why actions were taken and why they produced their results", "not": "Canned scenarios; no critique; critique of actions only"}, {"situation": "New technology offers tighter <span class=\"t\" data-t=\"control\">control</span> over <span class=\"t\" data-t=\"subordinates\">subordinates</span>", "do": "Exercise discipline; do not use it to over-supervise", "not": "Use <span class=\"t\" data-t=\"information\">information</span> technology to reassert <span class=\"t\" data-t=\"positive control\">positive control</span>"}, {"situation": "<span class=\"t\" data-t=\"surprise\">Surprise</span> or an opening is achieved", "do": "Exploit it fully and immediately; commit every ounce of available power", "not": "Half-measures; pause to consolidate; wait for confirmation"}], "concepts": [{"title": "The Five Attributes of War", "body": "<span class=\"t\" data-t=\"friction\">Friction</span>, <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>, fluidity, <span class=\"t\" data-t=\"disorder\">disorder</span>, and complexity are inherent, not incidental. Each episode is unique, merges with those before and after it, and tends toward greater <span class=\"t\" data-t=\"disorder\">disorder</span> over time. Because war is a human enterprise, every attribute carries a psychological as well as a physical weight. A <span class=\"t\" data-t=\"doctrine\">doctrine</span> that pretends otherwise fails in contact."}, {"title": "Levels of War", "body": "Strategic (<span class=\"t\" data-t=\"policy\">policy</span> objectives — winning wars), operational (winning <span class=\"t\" data-t=\"campaign\">campaigns</span> — using tactical results to attain strategic objectives, including when and where to refuse battle), and tactical (winning engagements and battles). The boundaries blur; in small wars and operations other than war they compress until a small-unit action has direct strategic consequences."}, {"title": "Attrition vs. Maneuver", "body": "Attrition pursues cumulative destruction of the enemy's material through superior firepower: results proportional to effort, centralized <span class=\"t\" data-t=\"control\">control</span>, procedural <span class=\"t\" data-t=\"focus\">focus</span>, dependence on numerical superiority. Maneuver attacks the enemy system to incapacitate it as a coordinated whole: <span class=\"t\" data-t=\"strength\">strength</span> against selected weakness, <span class=\"t\" data-t=\"speed\">speed</span> and <span class=\"t\" data-t=\"surprise\">surprise</span> as prerequisites, results disproportionate to effort — and catastrophic failure when applied incompetently. All warfare mixes both; Marine <span class=\"t\" data-t=\"doctrine\">doctrine</span> is principally maneuver."}, {"title": "Speed, Focus, Surprise, Boldness", "body": "The four generators of <span class=\"t\" data-t=\"combat power\">combat power</span> beyond raw numbers. <span class=\"t\" data-t=\"speed\">Speed</span> over time is <span class=\"t\" data-t=\"tempo\">tempo</span>; only relative <span class=\"t\" data-t=\"speed\">speed</span> matters, and it follows a rhythm of fast-slow-fast. <span class=\"t\" data-t=\"focus\">Focus</span> converges effects at the decisive time and place. <span class=\"t\" data-t=\"surprise\">Surprise</span> is the enemy's disorientation, achieved by deception (greatest effect, hardest), ambiguity, or stealth; it is fleeting and must be exploited at once. <span class=\"t\" data-t=\"boldness\">Boldness</span> is the unhesitating pursuit of major results in the face of <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>, tempered by <span class=\"t\" data-t=\"judgment\">judgment</span> — a calculating patience can also be <span class=\"t\" data-t=\"boldness\">boldness</span>."}, {"title": "Centers of Gravity and Critical Vulnerabilities", "body": "A <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> is any important source of the enemy's <span class=\"t\" data-t=\"strength\">strength</span> — a capability, a locality, a relationship, a moral factor — without which the enemy cannot function. A <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> is a weakness whose exploitation does the most significant damage to the enemy's ability to resist. The two are complementary: the first looks for <span class=\"t\" data-t=\"strength\">strength</span>, the second for the pathway to it. Narrow the list as far as possible; expect to attack several in sequence."}, {"title": "Initiative and Response; Offense and Defense", "body": "All action is either taking the initiative or responding to it; only initiative imposes <span class=\"t\" data-t=\"will\">will</span>. Offense and defense are not separable — an effective defense is \"a shield made up of well-directed blows,\" and the offense weakens as it advances until it <span class=\"t\" data-t=\"reach\">reaches</span> a <span class=\"t\" data-t=\"culminating point\">culminating point</span> and must revert to defense. The transition is fluid and exists simultaneously at every level."}, {"title": "Philosophy of Command", "body": "<span class=\"t\" data-t=\"command\">Command</span> must be decentralized to generate <span class=\"t\" data-t=\"tempo\">tempo</span> and cope with <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>. It is based on human traits, not equipment or procedure. It exploits <span class=\"t\" data-t=\"implicit communication\">implicit communication</span> — mutual understanding through a minimum of key phrases, developed by familiarity and trust. <span class=\"t\" data-t=\"commander\">Commanders</span> <span class=\"t\" data-t=\"command\">command</span> from where they can best influence the action, normally forward, without over-supervising. This philosophy applies in garrison as in combat; <span class=\"t\" data-t=\"subordinates\">subordinates</span> over-supervised in peace <span class=\"t\" data-t=\"will\">will</span> not show initiative in war."}, {"title": "Mission Tactics and Commander's Intent", "body": "<span class=\"t\" data-t=\"mission tactics\">Mission tactics</span> assigns a mission without specifying how to accomplish it — a contract: the senior provides support and guidance without over-prescribing; the subordinate <span class=\"t\" data-t=\"act\">acts</span> within the intent, with \"<span class=\"t\" data-t=\"topsight\">topsight</span>\" (a grasp of how their action fits the larger <span class=\"t\" data-t=\"situation\">situation</span>). Every mission has two parts: the task (what) and the intent (why); the intent is predominant and outlasts the task. Intent is captured in an \"...in order to...\" phrase, kept brief and compelling, and understood two levels up. Intent flows top-down; initiative flows bottom-up inside it."}, {"title": "Main Effort", "body": "Of all actions in the <span class=\"t\" data-t=\"command\">command</span>, one is recognized as most critical to success at that moment; the unit responsible is the <span class=\"t\" data-t=\"main effort\">main effort</span> and receives priority for support of every kind. The decision says: this is how I <span class=\"t\" data-t=\"will\">will</span> achieve a decision; everything else is secondary. It <span class=\"t\" data-t=\"force\">forces</span> concentration and <span class=\"t\" data-t=\"force\">forces</span> <span class=\"t\" data-t=\"risk\">risk</span>. Every operation gets one; it shifts as the <span class=\"t\" data-t=\"situation\">situation</span> changes, always to exploit success rather than reinforce failure."}, {"title": "Surfaces, Gaps, Combined Arms, and Shaping", "body": "Surfaces are enemy <span class=\"t\" data-t=\"strength\">strengths</span>, gaps are enemy weaknesses — in space, time, or capability; gaps are fleeting and found by continuous, aggressive reconnaissance. <span class=\"t\" data-t=\"combined arms\">Combined arms</span> integrates capabilities so that countering one exposes the enemy to another: a dilemma, not a problem. <span class=\"t\" data-t=\"shaping\">Shaping</span> is the projection of thought forward in time and space to set conditions so that, when the moment of engagement arrives, the result is a matter of course — never a timetable, always a preservation of options. ---"}], "vocabulary": [{"term": "Friction", "definition": "The <span class=\"t\" data-t=\"force\">force</span> that resists all action and saps <span class=\"t\" data-t=\"energy\">energy</span>; external (enemy, terrain, chance) or self-induced (<span class=\"t\" data-t=\"unclear goals\">unclear goals</span>, <span class=\"t\" data-t=\"complicated plans\">complicated plans</span>, <span class=\"t\" data-t=\"complex organization\">complex organization</span>)"}, {"term": "Fog of war", "definition": "The atmosphere of <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> in which all action takes place; reducible, never eliminable"}, {"term": "Nonlinearity", "definition": "Causes and effects are disproportionate; <span class=\"t\" data-t=\"minor incidents\">minor incidents</span> can decide <span class=\"t\" data-t=\"outcomes\">outcomes</span>"}, {"term": "Tempo", "definition": "<span class=\"t\" data-t=\"speed\">Speed</span> over time — the consistent ability to operate quickly; a <span class=\"t\" data-t=\"weapon\">weapon</span> measured relative to the enemy"}, {"term": "Focus", "definition": "<span class=\"t\" data-t=\"convergence of effects\">Convergence of effects</span> in time and space on an objective; requires economy and <span class=\"t\" data-t=\"risk\">risk</span> elsewhere"}, {"term": "Surprise", "definition": "A state of disorientation from an unexpected <span class=\"t\" data-t=\"event\">event</span> that degrades the ability to resist; achieved by deception, ambiguity, or stealth"}, {"term": "Boldness", "definition": "Unhesitating exploitation of <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> to pursue major rather than marginal results; tempered by <span class=\"t\" data-t=\"judgment\">judgment</span>"}, {"term": "Center of gravity", "definition": "Any important source of <span class=\"t\" data-t=\"strength\">strength</span> — capability, locality, relationship, or moral factor — without which a <span class=\"t\" data-t=\"force\">force</span> cannot function"}, {"term": "Critical vulnerability", "definition": "A vulnerability that, if exploited, does the most significant damage to the enemy's ability to resist; the pathway to a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span>"}, {"term": "Maneuver warfare", "definition": "A philosophy that seeks to shatter the enemy's cohesion through rapid, focused, unexpected actions creating a <span class=\"t\" data-t=\"situation\">situation</span> with which the enemy cannot cope"}, {"term": "Attrition warfare", "definition": "<span class=\"t\" data-t=\"victory\">Victory</span> through cumulative destruction of material by superior firepower; results proportionate to effort"}, {"term": "Mission tactics", "definition": "Assigning a subordinate a mission without specifying how it must be accomplished; a contract between senior and subordinate"}, {"term": "Mission-type order", "definition": "An order to perform a mission without specifying how it is to be accomplished"}, {"term": "Commander's intent", "definition": "The purpose behind a task; the \"why\" that outlasts the \"what\" and permits initiative in harmony with the <span class=\"t\" data-t=\"commander\">commander</span>'s aims"}, {"term": "Main effort", "definition": "The unit assigned the mission most critical to success at that moment; the focal point of the <span class=\"t\" data-t=\"force\">force</span>'s <span class=\"t\" data-t=\"combat power\">combat power</span> and priority for all support"}, {"term": "Surfaces and gaps", "definition": "Enemy <span class=\"t\" data-t=\"strength\">strengths</span> and enemy weaknesses, in space, time, or capability"}, {"term": "Reconnaissance pull", "definition": "Pulling <span class=\"t\" data-t=\"combat power\">combat power</span> through gaps found by forward units, as opposed to <span class=\"t\" data-t=\"command\">command</span> push from the rear"}, {"term": "Combined arms", "definition": "Integration of arms such that to counter one the enemy must become more vulnerable to another — a dilemma"}, {"term": "Topsight", "definition": "A grasp of how one's own action fits into the larger <span class=\"t\" data-t=\"situation\">situation</span>; the bird's-eye view that reveals the whole"}, {"term": "Implicit communication", "definition": "Communication through mutual understanding using a minimum of key, well-understood phrases; built on shared philosophy and shared experience"}, {"term": "Culminating point", "definition": "The point at which an offense can no longer sustain itself and must revert to the defense"}, {"term": "Shaping", "definition": "Lethal and nonlethal actions that set the general conditions of war to advantage before the decisive moment"}, {"term": "Zero-defects mentality", "definition": "Punishing errors of <span class=\"t\" data-t=\"boldness\">boldness</span> so that initiative is stifled; expressly prohibited"}], "quotes": [{"quote": "<span class=\"t\" data-t=\"friction\">Friction</span> is the <span class=\"t\" data-t=\"force\">force</span> that resists all action and saps <span class=\"t\" data-t=\"energy\">energy</span>. It makes the simple difficult and the difficult seemingly impossible.", "caption": "Chapter 1, \"Friction.\" The permanent condition every plan must survive."}, {"quote": "The best we can hope for is to impose a general framework of order on the <span class=\"t\" data-t=\"disorder\">disorder</span>, to influence the <span class=\"t\" data-t=\"general flow\">general flow</span> of action rather than to try to <span class=\"t\" data-t=\"control\">control</span> each <span class=\"t\" data-t=\"event\">event</span>.", "caption": "Chapter 1, \"Disorder.\" The ceiling on control, stated flatly."}, {"quote": "Any <span class=\"t\" data-t=\"doctrine\">doctrine</span> which attempts to reduce warfare to ratios of <span class=\"t\" data-t=\"force\">forces</span>, <span class=\"t\" data-t=\"weapon\">weapons</span>, and equipment neglects the impact of the human <span class=\"t\" data-t=\"will\">will</span> on the conduct of war and is therefore inherently flawed.", "caption": "Chapter 1, \"The Human Dimension.\""}, {"quote": "The single most important thought to understand about our theory is that war must serve <span class=\"t\" data-t=\"policy\">policy</span>.", "caption": "Chapter 2, \"War As an Act of Policy.\""}, {"quote": "<span class=\"t\" data-t=\"tempo\">Tempo</span> is itself a <span class=\"t\" data-t=\"weapon\">weapon</span>—often the most important.", "caption": "Chapter 2, \"Styles of Warfare.\""}, {"quote": "<span class=\"t\" data-t=\"surprise\">Surprise</span> is not what we do; it is the enemy's reaction to what we do.", "caption": "Chapter 2, \"Surprise and Boldness.\" Surprise is measured at the receiver."}, {"quote": "In practical terms, this means that we must not strive for <span class=\"t\" data-t=\"certainty\">certainty</span> before we <span class=\"t\" data-t=\"act\">act</span>, for in so doing we <span class=\"t\" data-t=\"will\">will</span> surrender the initiative and pass up opportunities.", "caption": "Chapter 4, \"Philosophy of Command.\""}, {"quote": "Thus, as a basis for action, any decision is generally better than no decision.", "caption": "Chapter 4, \"Decisionmaking.\" Postponement is itself a decision — usually the wrong one."}, {"quote": "They inform the <span class=\"t\" data-t=\"commander\">commander</span> of what they have done, but they do not wait for permission.", "caption": "Chapter 4, \"Mission Tactics.\" The operating rule for subordinates under mission-type orders."}, {"quote": "Of the two, the intent is predominant. While a <span class=\"t\" data-t=\"situation\">situation</span> may change, making the task obsolete, the intent is more lasting and continues to guide our actions.", "caption": "Chapter 4, \"Commander's Intent.\""}, {"quote": "Faced with a decision, we ask ourselves: How can I best support the <span class=\"t\" data-t=\"main effort\">main effort</span>?", "caption": "Chapter 4, \"Main Effort.\" The tiebreaker question for every subordinate."}, {"quote": "The further ahead we think, the less our actual influence can be. Therefore, the further ahead we consider, the less precision we should attempt to impose.", "caption": "Chapter 4, \"Shaping the Action.\" The planning-horizon rule."}, {"quote": "We should deal with such errors leniently; there must be no 'zero defects' mentality.", "caption": "Chapter 3, \"Professionalism.\" Errors of over-boldness are a necessary part of learning; errors of inaction are dealt with severely."}], "doesnt_work": "Striving for <span class=\"t\" data-t=\"certainty\">certainty</span> before acting, centralized <span class=\"t\" data-t=\"positive control\">positive control</span>, detailed timetables, formularistic approaches and set patterns, reducing war to <span class=\"t\" data-t=\"force\">force</span> ratios, <span class=\"t\" data-t=\"zero-defects mentality\">zero-defects mentality</span>, yes-men, attacking <span class=\"t\" data-t=\"strength\">strength</span> frontally, reinforcing failure instead of exploiting success, prescribing method to <span class=\"t\" data-t=\"subordinates\">subordinates</span>, waiting for permission, inaction justified by lack of orders, timidity, agonizing over a perfect solution, half-measures after achieving <span class=\"t\" data-t=\"surprise\">surprise</span>, dissipating <span class=\"t\" data-t=\"combat power\">combat power</span> across unrelated efforts, over-reliance on technology, using <span class=\"t\" data-t=\"information\">information</span> technology to over-supervise, canned <span class=\"t\" data-t=\"training\">training</span> scenarios, critiques that examine what was done rather than why, over-supervision in garrison, rushing deliberate decisions when time is not the limiting factor.", "selfcheck": ["Does every task I assign carry an explicit intent — the \"in order to\"?", "Have I designated a single <span class=\"t\" data-t=\"main effort\">main effort</span> right now, and does everything else support it?", "Am I deciding on acceptable <span class=\"t\" data-t=\"risk\">risk</span> with the <span class=\"t\" data-t=\"information\">information</span> I have, rather than waiting for <span class=\"t\" data-t=\"certainty\">certainty</span>?", "Have I identified the <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> and the <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> that leads to it?", "Am I directing effort at gaps, not surfaces, and shifting the <span class=\"t\" data-t=\"main effort\">main effort</span> to exploit success?", "Are my near-term <span class=\"t\" data-t=\"plan\">plans</span> tight and my far-horizon <span class=\"t\" data-t=\"plan\">plans</span> loose, with options preserved?", "Am I minimizing <span class=\"t\" data-t=\"self-induced friction\">self-induced friction</span> — clear goal, simple <span class=\"t\" data-t=\"plan\">plan</span>, simple organization?", "Do I tolerate bold errors and censure inaction?", "Do I critique immediately after each effort, focusing on why, in open dialogue?", "Am I communicating through a shared vocabulary of key phrases rather than long explicit instructions?"], "selfcheck_note": "If any box is unchecked, that's your next priority — in the order listed.", "application": [{"lead": "Commander's intent → the intent line on every tasking.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: every mission is a task plus an \"...in order to...\" and the intent is predominant. Operational translation: every <span class=\"t\" data-t=\"phase\">phase</span> brief and every order to the AI partner opens with the task and closes with the intent; when the task goes obsolete mid-session, the partner <span class=\"t\" data-t=\"act\">acts</span> on the intent without a new order. The standard project flow (BOLO 25) makes the intent line mandatory at the top of each <span class=\"t\" data-t=\"phase\">phase</span>."}, {"lead": "Mission tactics → mission-type orders to the AI partner.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: assign the mission, not the method; the senior intervenes only by exception; the subordinate informs but does not wait for permission. Translation: orders specify the outcome and the intent, leave the method open, and the partner reports what it did. The \"how copy?\" / \"Good copy.\" exchange is the contract closing a <span class=\"t\" data-t=\"mission-type order\">mission-type order</span> — a readback of the task <i>and</i> the why, confirming understanding two levels up before execution."}, {"lead": "Main effort → one main effort per session, named in STATE.md.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: recognize the one action most critical to success at this moment; give it priority for all support; shift it to exploit success, never to reinforce failure. Translation: the operation's proword \"<span class=\"t\" data-t=\"main effort\">main effort</span>\" is this term unchanged. Every session names it; every other stream is a supporting effort under strict economy; the tiebreaker question is \"How can I best support the <span class=\"t\" data-t=\"main effort\">main effort</span>?\""}, {"lead": "General framework of order, not positive control → the sit rep board.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: influence the <span class=\"t\" data-t=\"general flow\">general flow</span>, do not <span class=\"t\" data-t=\"control\">control</span> each <span class=\"t\" data-t=\"event\">event</span>; <span class=\"t\" data-t=\"subordinates\">subordinates</span> inform the <span class=\"t\" data-t=\"commander\">commander</span> of what they have done. Translation: the sit rep is the periodic report that replaces minute-by-minute supervision — <span class=\"t\" data-t=\"situation\">situation</span>, <span class=\"t\" data-t=\"main effort\">main effort</span>, blockers, watchlist — a framework of order laid over the <span class=\"t\" data-t=\"disorder\">disorder</span> rather than an attempt to eliminate it."}, {"lead": "Focus on the critical vulnerability → boresight.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: <span class=\"t\" data-t=\"focus\">focus</span> is the <span class=\"t\" data-t=\"convergence of effects\">convergence of effects</span> at the decisive point; dissipation over several unrelated efforts violates <span class=\"t\" data-t=\"focus\">focus</span> and is counterproductive. Translation: \"boresight\" is the call to re-converge effort on the <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> of the current project — the one unanswered decision, the one blocking artifact — when effort has drifted across surfaces."}, {"lead": "Self-induced friction and \"any decision is better than no decision\" → the gate.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span> names <span class=\"t\" data-t=\"self-induced friction\">self-induced friction</span>: lack of a clearly defined goal, unclear or <span class=\"t\" data-t=\"complicated plans\">complicated plans</span>, complex task organization. Translation: the recurring stall pattern (finished designs blocked on one unanswered decision, then rebuilt) is <span class=\"t\" data-t=\"self-induced friction\">self-induced friction</span>. The gate at each <span class=\"t\" data-t=\"phase\">phase</span> is where that decision gets made on acceptable <span class=\"t\" data-t=\"risk\">risk</span>; postponing it is itself a decision, and the wrong one."}, {"lead": "Planning horizon → phase cadence.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: the further ahead, the less precision. Translation: detail the current <span class=\"t\" data-t=\"phase\">phase</span>; carry only intent and options for later <span class=\"t\" data-t=\"phase\">phases</span>. No project-length timetable. This is the <span class=\"t\" data-t=\"structural\">structural</span> fix for designing every <span class=\"t\" data-t=\"phase\">phase</span> in full and then discarding the design."}, {"lead": "Critique and no zero-defects → the session cache.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span>: critique immediately after, in open dialogue, focused on why; tolerate bold errors, censure inaction. Translation: the <code>_CACHE/</code> session note written at close is the critique — what was decided, why, what it produced — and its tone tolerates a bold miss while flagging a session that decided nothing."}], "marks": ["independent wills", "friction", "uncertainty", "disorder", "certainty", "positive control", "superior tempo", "decentralizing decisions", "subordinates", "act", "commander's intent", "strength", "critical vulnerabilities", "Zweikampf", "force", "counterforce", "plan", "counter-plan", "situation", "continuous mutual adaptation", "energy", "Self-induced friction", "unclear goals", "complicated plans", "complex organization", "external friction", "will", "fog of war", "structural", "Nonlinearity", "minor incidents", "decisive effects", "Judgment", "possibilities", "probabilities", "communications", "improvisation", "original scheme", "commander", "influences", "general flow", "control", "event", "Outcomes", "local decisions", "local information", "Full centralization", "single decisionmaker", "Material factors", "doctrine", "effect of fires", "moral strength", "matériel", "Military action", "political instrument", "political aims", "Speed", "weapon", "focus", "convergence of effects", "prudent risk", "Risk"]}, {"id": "MIL.02", "bvx_id": "BVX.1112", "title": "MCDP 1-1 Strategy", "author": "U.S. Marine Corps (HQMC)", "year": "1997", "edition": "Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "maneuver-warfare", "strategy", "ends-and-means", "annihilation-erosion", "political-objectives", "complex-adaptive-systems"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)"], "feeds": [{"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "The strategy-making sequence — assessment, political objective (limited/unlimited), military objective (annihilation/erosion), strategic concept — is the front end of the project flow: end state first, mode second, means third. Ends and means adjust each other at every gate."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "primary", "note": "Strategy serves policy and policy is made inside irrational politics; only two ends exist (survival, victory); a strategy that has neither broken the enemy's ability nor their will has failed; process never substitutes for product."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "The strategic assessment is the observe-orient half of the OODA loop run on cadence — the doctrinal function the sit rep performs before any decision is taken."}, {"layer": "01_NARRATIVE_FRAMEWORKS", "variable": "conflict_theory", "strength": "secondary", "note": "Limited vs. unlimited objectives, annihilation vs. erosion, and the trinity (emotion, chance, reason) give a clean taxonomy for what antagonists want, how far they will go, and what breaks them."}], "file": "🧬 MIL.02 — MCDP 1-1 Strategy — USMC (1997).md", "thesis": "<span class=\"t\" data-t=\"strategy\">Strategy</span> is the process and product of relating means to political ends inside a chaotic political environment, and the strategist's first job is to determine what <span class=\"t\" data-t=\"survival\">survival</span> and <span class=\"t\" data-t=\"victory\">victory</span> mean to every participant, whether the political objective is limited or unlimited, and therefore whether the <span class=\"t\" data-t=\"military strategy\">military strategy</span> is annihilation or erosion — because battlefield brilliance seldom rescues a bad <span class=\"t\" data-t=\"strategy\">strategy</span>. ---", "invariants": [{"lead": "War is politics with violence added, and strategy must serve policy — which is produced inside irrational politics.", "body": "<span class=\"t\" data-t=\"policy\">Policy</span> is the rational subcomponent; <span class=\"t\" data-t=\"politics\">politics</span> is the interactive, adversarial process that generates it. The strategist works within both. \"Keep <span class=\"t\" data-t=\"politics\">politics</span> out of this\" is a confession of not understanding <span class=\"t\" data-t=\"strategy\">strategy</span>."}, {"lead": "Political entities are complex adaptive systems, not unitary rational actors.", "body": "Their behavior derives from internal interplay of rational and irrational <span class=\"t\" data-t=\"force\">forces</span> and their own histories; it is constrained by external factors but not determined by them. Every enemy has fault lines. Every action has unintended effects."}, {"lead": "Constants and norms persist beneath the chaos.", "body": "The physical environment, national character, the state, and the balance-of-power mechanism operate in every strategic <span class=\"t\" data-t=\"situation\">situation</span>. Climate is predictable even when weather is not."}, {"lead": "There are only two fundamental ends: survival and victory.", "body": "They mean different things to each participant, and identifying what they mean is the hardest analytical task in <span class=\"t\" data-t=\"strategy\">strategy</span>."}, {"lead": "Political objectives are limited or unlimited; military strategies are annihilation or erosion.", "body": "An <span class=\"t\" data-t=\"unlimited political objective\">unlimited political objective</span> demands annihilation. A <span class=\"t\" data-t=\"limited political objective\">limited political objective</span> permits erosion but does not require it. A <span class=\"t\" data-t=\"strategy\">strategy</span> that at war's end has neither eliminated the enemy's ability to resist nor worn down their <span class=\"t\" data-t=\"will\">will</span> has failed."}, {"lead": "Military force is an inappropriate tool for most political problems.", "body": "At best it clears obstacles to more peaceful solutions. All instruments of power — diplomatic, economic, military, informational — interlock."}, {"lead": "Ends and means adjust each other continuously.", "body": "Resources, confidence, and enemy weakness expand goals; shortfalls cut them. Neither is fixed."}, {"lead": "Higher-level failure overpowers lower-level excellence.", "body": "A wrong <span class=\"t\" data-t=\"strategy\">strategy</span> makes tactical skill, valor, and battlefield <span class=\"t\" data-t=\"victory\">victory</span> \"fail of their effect.\""}], "heuristics": [{"situation": "Beginning a strategic assessment", "do": "Observe and orient: physical environment, national character, <span class=\"t\" data-t=\"balance of power\">balance of power</span>; then the value each side attaches to the objective and the cost each <span class=\"t\" data-t=\"will\">will</span> pay", "not": "Count units and equipment and call it analysis"}, {"situation": "Setting the objective", "do": "Decide whether it is limited or unlimited before choosing means; define <span class=\"t\" data-t=\"survival\">survival</span> and <span class=\"t\" data-t=\"victory\">victory</span> for every participant", "not": "Leave the objective ambiguous and wait to see how opportunities develop"}, {"situation": "Political objective is limited", "do": "Consider erosion — but do not assume the <span class=\"t\" data-t=\"military strategy\">military strategy</span> must also be limited; annihilation in-theater may be the fastest route", "not": "Automatically limit the military means"}, {"situation": "Enemy is too strong or too costly to annihilate", "do": "Erosion: raise the cost of resistance to the leadership above what they <span class=\"t\" data-t=\"will\">will</span> pay; target what the leadership values", "not": "Slug it out toward an unlimited aim without decisive superiority"}, {"situation": "Selecting a military objective", "do": "Verify it actually achieves the political objective; check its effect on allies, neutrals, and the <span class=\"t\" data-t=\"balance of power\">balance of power</span>", "not": "Fight the enemy as an end in itself"}, {"situation": "Analyzing an adversary or ally", "do": "Build a full character dossier — history, culture, <span class=\"t\" data-t=\"politics\">politics</span>, psychology — as one would on an enemy <span class=\"t\" data-t=\"commander\">commander</span>", "not": "Dogmatic assertions; mirror-imaging your own values onto them"}, {"situation": "Familiar problem, no time to tailor", "do": "Adopt a standardized <span class=\"t\" data-t=\"strategy\">strategy</span> as a point of departure to gain time, then tailor as the <span class=\"t\" data-t=\"situation\">situation</span> develops", "not": "Treat the standard response as the final <span class=\"t\" data-t=\"strategy\">strategy</span>, or freeze"}, {"situation": "Tempted by one neat decisive stroke", "do": "Ask what happens if it is not final; <span class=\"t\" data-t=\"plan\">plan</span> for the long commitment it may open", "not": "Assume the <span class=\"t\" data-t=\"fait accompli\">fait accompli</span> cannot be undone"}, {"situation": "High stakes, incomplete <span class=\"t\" data-t=\"information\">information</span>", "do": "Take the discipline to study; then <span class=\"t\" data-t=\"act\">act</span>. Avoid both paralysis by analysis and blind action", "not": "Hold the line and take no chances, or strike out reflexively"}, {"situation": "The strategy-making routine is running smoothly", "do": "Remember that process produces no <span class=\"t\" data-t=\"strategy\">strategy</span> by itself; routine yields predictable strategies by default", "not": "Trust the process to guarantee a sound product"}, {"situation": "Choosing symmetric or asymmetric means", "do": "No innate advantage either way; choose per <span class=\"t\" data-t=\"situation\">situation</span>, and create new asymmetries when advantageous", "not": "Bias toward matching the enemy <span class=\"t\" data-t=\"strength\">strength</span> for <span class=\"t\" data-t=\"strength\">strength</span>"}, {"situation": "Deterring an action", "do": "Combine denial (it <span class=\"t\" data-t=\"will\">will</span> fail) with reprisal (it <span class=\"t\" data-t=\"will\">will</span> cost)", "not": "Rely on one alone"}], "concepts": [{"title": "Politics, Policy, and Power", "body": "<span class=\"t\" data-t=\"politics\">Politics</span> is the process by which power is distributed in any society; it is interactive, competitive, and not rational in outcome. <span class=\"t\" data-t=\"policy\">Policy</span> is the conscious, reasoned use of power for a purpose — the rational subcomponent of <span class=\"t\" data-t=\"politics\">politics</span>, but produced through political compromise and therefore often ambiguous or contradictory. Power is material or psychological and distributed unevenly; a central strategic problem is locating where real power lies and the rare points where military <span class=\"t\" data-t=\"force\">force</span> applies to it."}, {"title": "The Complex Adaptive System", "body": "The correct model for a political entity is ecology, not Newtonian physics. Members co-evolve, adapt, and generate their own rules; small perturbations sometimes vanish and sometimes convulse the system. Prediction is difficult; explanation after the fact is easy. The model's payoff is that it reveals fault lines in every adversary and warns that every conscious action has effects beyond those intended."}, {"title": "Strategic Constants and Norms", "body": "Four factors are present in every strategic <span class=\"t\" data-t=\"situation\">situation</span>: the physical environment (geography, resources, lines of communication), national character (slow-changing, requiring a full dossier, never dogma), the state (the durable form that <span class=\"t\" data-t=\"will\">will</span> almost always become involved), and the balance-of-power mechanism (always at work, breaking down through rebellion against it — checked by the <span class=\"t\" data-t=\"culminating point of victory\">culminating point of victory</span> — or through power vacuums). These are the points of departure for analysis of any specific case."}, {"title": "The Ends Hierarchy and the Instruments of Power", "body": "Interests (<span class=\"t\" data-t=\"survival\">survival</span> and security, integrity, economic well-being, stability; some vital) → objectives (concrete conditions to attain) → <span class=\"t\" data-t=\"policy\">policy</span> (patterns of action) → commitments (pledges to <span class=\"t\" data-t=\"act\">act</span> at specific times and places). <span class=\"t\" data-t=\"national strategy\">National strategy</span> applies all instruments of power — diplomatic, economic, military, informational — and <span class=\"t\" data-t=\"military strategy\">military strategy</span> is subordinate to it. <span class=\"t\" data-t=\"military strategy\">Military strategy</span> starts from the political objective, derives a military objective, and develops a <span class=\"t\" data-t=\"strategic concept\">strategic concept</span>."}, {"title": "Survival, Victory, Limited and Unlimited", "body": "<span class=\"t\" data-t=\"survival\">Survival</span> is continued existence of the political entity, defined differently by each (a way of life, a ruling group, a legend). <span class=\"t\" data-t=\"victory\">Victory</span> is achievement of the <span class=\"t\" data-t=\"political aims\">political aims</span> plus an end to the war; it may mean only ending on less unfavorable terms, and it is emotion-laden. An <span class=\"t\" data-t=\"unlimited political objective\">unlimited political objective</span> removes the enemy leadership; a limited one leaves it in power with reduced assets. The classification is fundamental and drives everything downstream."}, {"title": "Annihilation and Erosion", "body": "Annihilation eliminates the enemy's ability to resist — not physical destruction of everything, but incapacitation; the military is the <span class=\"t\" data-t=\"main effort\">main effort</span>, <span class=\"t\" data-t=\"victory\">victory</span> is easily measured, and it requires decisive superiority. Erosion wears down the enemy leadership's <span class=\"t\" data-t=\"will\">will</span> by raising costs above what they <span class=\"t\" data-t=\"will\">will</span> pay; the <span class=\"t\" data-t=\"main effort\">main effort</span> may be any instrument, targets include <span class=\"t\" data-t=\"force\">forces</span>, valued assets, or the leadership's domestic position, and <span class=\"t\" data-t=\"victory\">victory</span> is flexibly defined. Political objective and <span class=\"t\" data-t=\"military strategy\">military strategy</span> need not match: a limited political aim can be pursued by an unlimited <span class=\"t\" data-t=\"military strategy\">military strategy</span>."}, {"title": "The Strategy-Making Process", "body": "Assessment (the observe-orient half of the <span class=\"t\" data-t=\"ooda loop\">OODA loop</span>: landscape, then nature of the conflict — value vs. cost, endurance, tolerance for setbacks) → political objectives (<span class=\"t\" data-t=\"survival\">survival</span>/<span class=\"t\" data-t=\"victory\">victory</span> definitions; limited/unlimited) → military objectives (via centers of gravity and <span class=\"t\" data-t=\"critical vulnerabilities\">critical vulnerabilities</span>; a <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> must both undermine a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> and be within our means to attack) → <span class=\"t\" data-t=\"strategic concept\">strategic concept</span> (the clear, compelling course of action that governs theaters, <span class=\"t\" data-t=\"campaign\">campaigns</span>, priorities, and resource allocation). Strategy-making is distributed and shared: political leadership answers what and which objective; military leadership leads on how; both advise the other."}, {"title": "The Six Pitfalls", "body": "Strategic panaceas (universal prescriptions that deny the uniqueness of each <span class=\"t\" data-t=\"situation\">situation</span>); process over product (believing routine guarantees sound <span class=\"t\" data-t=\"strategy\">strategy</span>, yielding predictable strategies by default); the <span class=\"t\" data-t=\"fait accompli\">fait accompli</span> (the neat surgical stroke that becomes the opening move of a long war); labeling wars limited or unlimited (confusing scale with objective, and tempting limited means where annihilation is required); paralysis; recklessness. The last two are equally dangerous; the cure is discipline to study and then the <span class=\"t\" data-t=\"will\">will</span> to <span class=\"t\" data-t=\"focus\">focus</span> and <span class=\"t\" data-t=\"act\">act</span>. ---"}], "vocabulary": [{"term": "Politics", "definition": "The process by which power is distributed in any society; interactive, competitive or cooperative, not rational in outcome"}, {"term": "Policy", "definition": "The conscious, reasoned use of power to accomplish a purpose; a rational subcomponent of <span class=\"t\" data-t=\"politics\">politics</span>, produced through <span class=\"t\" data-t=\"politics\">politics</span>"}, {"term": "Strategy", "definition": "The process of interrelating ends and means, and the product — a specific way of using specified means to achieve distinct ends"}, {"term": "National strategy", "definition": "Developing and using all <span class=\"t\" data-t=\"instruments of national power\">instruments of national power</span>, in peace and war, to secure the objectives of <span class=\"t\" data-t=\"policy\">policy</span> (also grand <span class=\"t\" data-t=\"strategy\">strategy</span>, national security <span class=\"t\" data-t=\"strategy\">strategy</span>)"}, {"term": "Military strategy", "definition": "Employing armed <span class=\"t\" data-t=\"force\">forces</span> to secure the objectives of national <span class=\"t\" data-t=\"policy\">policy</span> by <span class=\"t\" data-t=\"force\">force</span> or the threat of <span class=\"t\" data-t=\"force\">force</span>; subordinate to <span class=\"t\" data-t=\"national strategy\">national strategy</span>"}, {"term": "Instruments of national power", "definition": "Diplomatic, economic, military, informational (DIME)"}, {"term": "Vital interests", "definition": "Interests a nation <span class=\"t\" data-t=\"will\">will</span> not compromise and <span class=\"t\" data-t=\"will\">will</span> fight for"}, {"term": "Survival", "definition": "Continued existence of the political entity at war; the minimum goal and prerequisite for <span class=\"t\" data-t=\"victory\">victory</span>"}, {"term": "Victory", "definition": "Achievement of the <span class=\"t\" data-t=\"political aims\">political aims</span> plus an end to the war; may mean only ending on less unfavorable terms"}, {"term": "Limited political objective", "definition": "The enemy leadership survives and remains in power, with some of its power reduced"}, {"term": "Unlimited political objective", "definition": "The enemy leadership is removed as a political entity"}, {"term": "Strategy of annihilation", "definition": "Eliminating the enemy's military capacity to resist; incapacitation, not necessarily physical destruction"}, {"term": "Strategy of erosion", "definition": "Raising the enemy leadership's costs until settling is preferable to continuing; the classical \"<span class=\"t\" data-t=\"strategy\">strategy</span> of attrition\""}, {"t
