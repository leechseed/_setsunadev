ession end) is push. Emergent needs surfaced mid-session go to BOLO the same turn (pull). The snowball effect is the warning: padded \"nice to have\" items in BOLO are false demand that dilutes prioritization."}, {"lead": "Priorities drive allocation → main effort.", "body": "\"Aligning <span class=\"t\" data-t=\"logistics\">logistics</span> resources to the <span class=\"t\" data-t=\"main effort\">main effort</span> according to the <span class=\"t\" data-t=\"commander\">commander</span>'s priorities makes the greatest contribution.\" The proword <i><span class=\"t\" data-t=\"main effort\">main effort</span></i> is the allocation rule: runway goes there first, and everything else is <span class=\"t\" data-t=\"economy of force\">economy of force</span>."}, {"lead": "Simplicity → the support concept in one sentence.", "body": "Concept-of-support <span class=\"t\" data-t=\"plan\">plans</span> are \"built around simple, compelling concepts, with <span class=\"t\" data-t=\"focus\">focus</span> on the underlying intent,\" not instructions for every eventuality. The <span class=\"t\" data-t=\"sustainment\">sustainment</span> line in a brief is one sentence plus branches for the two most likely disruptions."}, {"lead": "Survivability → assume the hit.", "body": "<span class=\"t\" data-t=\"doctrine\">Doctrine</span> <span class=\"t\" data-t=\"plan\">plans</span> for disruption as normal. For the operation: offline alternates for every connected tool, a rehearsed recovery path when the AI partner or the workspace is unavailable, and session notes to <code>_CACHE/</code> so the system regenerates from the last known state rather than from scratch."}, {"lead": "Risk closes the publication → risk closes the brief.", "body": "\"Every operational decision must include an understanding of <span class=\"t\" data-t=\"logistics\">logistics</span> <span class=\"t\" data-t=\"risk\">risk</span>.\" ENDEX on any <span class=\"t\" data-t=\"phase\">phase</span> includes a periodic deliberate assessment: did we perform as anticipated, what changed in the environment, what is the runway now."}], "marks": []}, {"id": "MIL.08", "bvx_id": "BVX.1118", "title": "MCDP 5 — Planning", "author": "U.S. Marine Corps (HQMC)", "year": "1997", "edition": "1997; Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "planning", "decision-making", "project-management", "commanders-intent", "uncertainty", "maneuver-warfare"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.03 — MCDP 1-2 Campaigning — USMC (1997)", "🧬 MIL.04 — MCDP 1-3 Tactics — USMC (1997)", "🧬 MIL.07 — MCDP 4 Logistics — USMC (2023)", "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996)"], "feeds": [{"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "The PM core. Planning hierarchy (conceptual → functional → detailed) gives the phase structure; planning modes (commitment / contingency / orientation) give the horizon structure; components of a plan (outcome+intent, actions, resources, control process) give the brief template; 'much of planning is actually replanning' makes STATE.md the living plan."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "primary", "note": "Planning is continuous and subordinate to execution; a plan is an interim product; the measure of a plan is action, not forecast accuracy; detail trades against flexibility; synthesis cannot be proceduralized; planning must be done BY the organization, not for it."}, {"layer": "oscar-mike/lab-venture", "variable": "gates_sheet", "strength": "secondary", "note": "Commitment horizon / contingency horizon / orientation horizon map onto venture gates: commit resources only inside the horizon where forecasts hold; keep later phases as contingencies and orientation, not detailed plans. Decision points are designed into the plan."}, {"layer": "SOP", "variable": "comms_protocol", "strength": "secondary", "note": "Plans and orders: minimum instruction, intent brief enough to hold in mind, warning orders and partial instructions early, oral between principals. 'How copy' is the readback that closes a directive; 'boresight' is the shared situational awareness planning exists to produce."}], "file": "🧬 MIL.08 — MCDP 5 Planning — USMC (1997).md", "thesis": "<span class=\"t\" data-t=\"planning\">Planning</span> is a continuous <span class=\"t\" data-t=\"learning\">learning</span> process, subordinate to execution, whose object is not to predict or <span class=\"t\" data-t=\"control\">control</span> the future but to let the organization decide and <span class=\"t\" data-t=\"act\">act</span> effectively inside <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> — so a <span class=\"t\" data-t=\"plan\">plan</span> is an interim product that is always being revised, the <span class=\"t\" data-t=\"commander\">commander</span> is the single most important factor in it, and the measure of any <span class=\"t\" data-t=\"plan\">plan</span> is never whether it was executed as written but whether it provided the basis for faster and more effective action than the <span class=\"t\" data-t=\"opponent\">opponent</span>'s. ---", "invariants": [{"lead": "Planning is a process, not a procedure, and it does not stop.", "body": "It is a dynamic system of iterative, interdependent activities, too situation-dependent to be a routine sequence of steps. <span class=\"t\" data-t=\"planning\">Planning</span> for an action stops only with execution, and adaptation continues after that. Much of <span class=\"t\" data-t=\"planning\">planning</span> is replanning."}, {"lead": "A plan is an interim product.", "body": "It is the best configuration of actions in time and space given what is known at the moment, always subject to revision as <span class=\"t\" data-t=\"information\">information</span> and understanding change. A static <span class=\"t\" data-t=\"plan\">plan</span> is of no value to an adaptive organization in a fluid <span class=\"t\" data-t=\"situation\">situation</span>."}, {"lead": "Uncertainty and time define the problem.", "body": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> grows with the <span class=\"t\" data-t=\"planning horizon\">planning horizon</span> and with the rate of change. All <span class=\"t\" data-t=\"planning\">planning</span> takes time, and the <span class=\"t\" data-t=\"situation\">situation</span> changes while you <span class=\"t\" data-t=\"plan\">plan</span>. The object of <span class=\"t\" data-t=\"planning\">planning</span> is not to eliminate <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> but to decide and <span class=\"t\" data-t=\"act\">act</span> effectively in the midst of it."}, {"lead": "The measure of a plan is action, not accuracy.", "body": "How accurately a <span class=\"t\" data-t=\"plan\">plan</span> forecasts the future is not a measure of its effectiveness. The measure is whether it provides the basis for effective action and adaptation. Few <span class=\"t\" data-t=\"plan\">plans</span> are executed as designed; they are not meant to be."}, {"lead": "The commander is the single most important factor.", "body": "<span class=\"t\" data-t=\"planning\">Planning</span> is a fundamental responsibility of <span class=\"t\" data-t=\"command\">command</span>. The <span class=\"t\" data-t=\"commander\">commander</span> disciplines the process (time, horizon, detail, mode, simplicity) and the product (relevant to the moment, suitable to the subordinate), and personally drafts the intent."}, {"lead": "Detail trades against flexibility.", "body": "The less certain the <span class=\"t\" data-t=\"situation\">situation</span>, the less detail in which you can <span class=\"t\" data-t=\"plan\">plan</span>. Anxiety under <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> drives more detail, which drives more anxiety, which produces a <span class=\"t\" data-t=\"plan\">plan</span> that does not survive <span class=\"t\" data-t=\"friction\">friction</span> and constricts action. <span class=\"t\" data-t=\"plan\">Plans</span> contain only as much detail as <span class=\"t\" data-t=\"subordinates\">subordinates</span> need."}, {"lead": "Synthesis cannot be proceduralized.", "body": "Establishing aims, formulating intent, and devising a course of action are creative <span class=\"t\" data-t=\"judgment\">judgments</span>. Analysis structures and evaluates; it cannot make the creative decisions. Attempts to reduce synthesis to procedure restrict the creativity the process depends on."}, {"lead": "Planning must be done by the organization, not for it.", "body": "The main benefit of <span class=\"t\" data-t=\"planning\">planning</span> is the <span class=\"t\" data-t=\"learning\">learning</span> and shared understanding produced by engaging in it. Those who execute understand a <span class=\"t\" data-t=\"plan\">plan</span> only if they helped build it. Planners and executors are ideally the same people."}, {"lead": "Every plan carries the means of its own change.", "body": "A <span class=\"t\" data-t=\"plan\">plan</span>'s <span class=\"t\" data-t=\"control process\">control process</span> — coordination measures, <span class=\"t\" data-t=\"feedback\">feedback</span> mechanisms, <span class=\"t\" data-t=\"decision point\">decision points</span> — anticipates the need for change and the decisions to be made in execution. <span class=\"t\" data-t=\"plan\">Plans</span> that omit the signals of success or dysfunction are incomplete."}], "heuristics": [{"situation": "Entering a new, unfamiliar <span class=\"t\" data-t=\"situation\">situation</span>", "do": "Orientation <span class=\"t\" data-t=\"planning\">planning</span>: assess, learn, identify feasible objectives, design flexibility, commit only limited resources", "not": "Commit to a detailed <span class=\"t\" data-t=\"plan\">plan</span> before understanding the <span class=\"t\" data-t=\"situation\">situation</span>"}, {"situation": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> is high", "do": "Broad, loosely coupled, modular <span class=\"t\" data-t=\"plan\">plan</span>; near commitment horizon; more time in contingency and orientation modes", "not": "A detailed, integrated <span class=\"t\" data-t=\"plan\">plan</span> built to cover every possibility"}, {"situation": "Deciding how much detail", "do": "Only as much as gives <span class=\"t\" data-t=\"subordinates\">subordinates</span> necessary guidance while allowing maximum freedom of action", "not": "<span class=\"t\" data-t=\"planning\">Planning</span> one echelon below your own level of detail"}, {"situation": "Setting goals", "do": "General but not vague — few defining criteria, usable measures of success; <span class=\"t\" data-t=\"act\">act</span> on <span class=\"t\" data-t=\"unclear goals\">unclear goals</span> rather than wait", "not": "Vague goals with no criteria; or paralysis waiting for perfectly clear goals"}, {"situation": "Time is short", "do": "Rapid <span class=\"t\" data-t=\"planning\">planning</span> from current conditions; accept a workable <span class=\"t\" data-t=\"plan\">plan</span> over an optimal one; issue warning orders and partial instructions as they are ready", "not": "Compress the deliberate process; withhold everything until the complete order is done"}, {"situation": "Time is ample and <span class=\"t\" data-t=\"speed\">speed</span> buys nothing", "do": "<span class=\"t\" data-t=\"plan\">Plan</span> deliberately; there is no excuse not to", "not": "An ill-conceived hasty <span class=\"t\" data-t=\"plan\">plan</span> because \"we move fast here\""}, {"situation": "About to add a coordination or <span class=\"t\" data-t=\"control\">control</span> measure", "do": "Ask: do these actions need to be coupled? Prefer directing local coordination over designing it", "not": "Couple unrelated elements to feel in <span class=\"t\" data-t=\"control\">control</span>"}, {"situation": "Evaluating the <span class=\"t\" data-t=\"plan\">plan</span>", "do": "Embed evaluation throughout development; scrutinize on merits; surface <span class=\"t\" data-t=\"decision point\">decision points</span>, contingencies, <span class=\"t\" data-t=\"feedback\">feedback</span> signals; bring in an outsider for a post-hoc critique", "not": "A formal critique step after the <span class=\"t\" data-t=\"plan\">plan</span> is \"finished,\" which the team cannot honestly perform on its own work"}, {"situation": "<span class=\"t\" data-t=\"plan\">Plan</span> meets reality and departs", "do": "Adapt from the <span class=\"t\" data-t=\"plan\">plan</span> as the point of departure; stay inside the intent; inform others of the departure", "not": "Scrap and rebuild from scratch; or <span class=\"t\" data-t=\"force\">force</span> <span class=\"t\" data-t=\"event\">events</span> back to the <span class=\"t\" data-t=\"plan\">plan</span>"}, {"situation": "Fixed deadline", "do": "Reverse-plan from the <span class=\"t\" data-t=\"end state\">end state</span> to allocate preparation time; forward-plan the next feasible step", "not": "Forward-only <span class=\"t\" data-t=\"planning\">planning</span> that discovers the deadline is unreachable"}, {"situation": "Writing the <span class=\"t\" data-t=\"directive\">directive</span>", "do": "Minimum instruction; intent brief enough to hold in mind under stress; oral between principals when possible; format serves content", "not": "Elaborate detail, restated SOP, many contingencies, slavish format"}, {"situation": "Adopting a <span class=\"t\" data-t=\"planning\">planning</span> routine", "do": "Use it for repetitive tasks with little variation; protect the creative parts from it", "not": "Reduce intuition and creativity to steps; let the routine rigidify"}, {"situation": "Deciding how many contingencies", "do": "<span class=\"t\" data-t=\"branches and sequels\">Branches and sequels</span> for a few likely ones; preserve the ability to pursue unplanned options", "not": "So many contingencies that none is adequately prepared"}, {"situation": "Decision <span class=\"t\" data-t=\"planning\">planning</span> vs. execution <span class=\"t\" data-t=\"planning\">planning</span> under time pressure", "do": "Ask whether another course of action is worth the time it takes from preparing to execute the one you have", "not": "Generate options past the point where execution suffers"}], "concepts": [{"title": "The Planning Process", "body": "Assess the <span class=\"t\" data-t=\"situation\">situation</span> (orient, identify centers of gravity and <span class=\"t\" data-t=\"critical vulnerabilities\">critical vulnerabilities</span>, project developments, define the problem) → establish goals, objectives, and the underlying intent (the <span class=\"t\" data-t=\"commander\">commander</span>'s greatest contribution; resolve competing goals) → conceptualize a course of action (salient features and their interactions) → detail the course of action (execution <span class=\"t\" data-t=\"planning\">planning</span>, often deferred or passed down) → evaluate (embedded throughout, not a separate gate) → issue a <span class=\"t\" data-t=\"directive\">directive</span> → cycle again. <span class=\"t\" data-t=\"phase\">Phases</span> run in parallel, feed back to one another, and are distributed across echelons. It is a schematic, not a sequence."}, {"title": "The Planning Hierarchy: Conceptual / Functional / Detailed", "body": "Conceptual <span class=\"t\" data-t=\"planning\">planning</span> establishes aims, objectives, intent, and broad concepts; it is creative synthesis supported by analysis — the art of war — and the <span class=\"t\" data-t=\"commander\">commander</span> personally directs it. Detailed <span class=\"t\" data-t=\"planning\">planning</span> translates the concept into a practicable <span class=\"t\" data-t=\"plan\">plan</span>: scheduling, coordination, technical specifics — the science of war, analytical, decomposing concept into tasks, working to objectives assigned from above. Functional <span class=\"t\" data-t=\"planning\">planning</span> sits between: supporting <span class=\"t\" data-t=\"plan\">plans</span> for discrete functions (maneuver, fires, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"intelligence\">intelligence</span>). <span class=\"t\" data-t=\"planning\">Planning</span> progresses general to specific, but functional and detailed constraints feed back and reshape the concept."}, {"title": "Planning Modes and Horizons: Commitment / Contingency / Orientation", "body": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> sets the mode. Commitment <span class=\"t\" data-t=\"planning\">planning</span>: confident forecast, commit to one <span class=\"t\" data-t=\"plan\">plan</span> and its resources; most preparation, least flexibility. Contingency <span class=\"t\" data-t=\"planning\">planning</span>: several plausible futures, <span class=\"t\" data-t=\"plan\">plan</span> for each without committing; balances preparation and flexibility. Orientation <span class=\"t\" data-t=\"planning\">planning</span>: <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> too high to commit or even branch; assess, design <span class=\"t\" data-t=\"responsiveness\">responsiveness</span>, cultivate conditions; most flexibility, least preparation. The modes are also the sequence (orient → contingency → commit as execution nears) and correspond to horizons — commitment horizon near, contingency beyond it, orientation beyond that — planned simultaneously for different <span class=\"t\" data-t=\"phase\">phases</span>."}, {"title": "Analysis and Synthesis", "body": "Analysis decomposes a whole into parts and handles each: processing <span class=\"t\" data-t=\"information\">information</span>, testing feasibility, breaking a concept into tasks. Synthesis integrates elements into a cohesive whole through <span class=\"t\" data-t=\"judgment\">judgment</span> and creativity. The key <span class=\"t\" data-t=\"planning\">planning</span> <span class=\"t\" data-t=\"judgment\">judgments</span> — aims, intent, course of action — are synthesis. Analysis precedes (structuring the elements) and follows (scrutinizing and detailing the product) but cannot replace it."}, {"title": "Decision Planning and Execution Planning", "body": "<span class=\"t\" data-t=\"planning\">Planning</span> before the decision develops the estimate and generates, evaluates, and modifies courses of action — largely conceptual. <span class=\"t\" data-t=\"planning\">Planning</span> after the decision translates the approved course into an executable <span class=\"t\" data-t=\"directive\">directive</span> — largely functional and detailed. Execution <span class=\"t\" data-t=\"planning\">planning</span> at one echelon becomes decision <span class=\"t\" data-t=\"planning\">planning</span> at the next down. <span class=\"t\" data-t=\"planning\">Planning</span> is anticipatory decision-making: a <span class=\"t\" data-t=\"plan\">plan</span> is a system of interrelated tentative decisions, and decisions are <span class=\"t\" data-t=\"plan\">plans</span> put into effect."}, {"title": "Components of a Plan", "body": "Every <span class=\"t\" data-t=\"plan\">plan</span> has a desired outcome with the intent behind it (the basis for everything else; general is good, vague is not); actions arranged in time and space, usually as tasks to <span class=\"t\" data-t=\"subordinates\">subordinates</span>; resources — type, amount, allocation, and provision; and a <span class=\"t\" data-t=\"control process\">control process</span> — coordination measures plus <span class=\"t\" data-t=\"feedback\">feedback</span> mechanisms and <span class=\"t\" data-t=\"decision point\">decision points</span> that identify the need for change and provide for making it. The last is the most neglected."}, {"title": "Coupling, Modularity, and Simplicity", "body": "<span class=\"t\" data-t=\"coupling\">Coupling</span> is how closely actions in a <span class=\"t\" data-t=\"plan\">plan</span> interact. Tightly coupled (integrated, synchronized) <span class=\"t\" data-t=\"plan\">plans</span> are efficient and near-optimal under stable conditions but brittle: one disruption reverberates through the whole, and they are hard to repair. Loosely coupled (modular, asynchronous) <span class=\"t\" data-t=\"plan\">plans</span> tolerate <span class=\"t\" data-t=\"friction\">friction</span>, allow latitude, and can be repaired part by part. Most tactical <span class=\"t\" data-t=\"situation\">situations</span> favor loose <span class=\"t\" data-t=\"coupling\">coupling</span>. Simplicity comes from fewer actions, grouping related actions under one subordinate, <span class=\"t\" data-t=\"planning\">planning</span> broad but not vague, and embodying the <span class=\"t\" data-t=\"plan\">plan</span> in one compelling concept. Simple is not simplistic; the <span class=\"t\" data-t=\"plan\">plan</span> should be as simple as the <span class=\"t\" data-t=\"situation\">situation</span> allows."}, {"title": "The Five Functions of Planning", "body": "<span class=\"t\" data-t=\"plan\">Plans</span> direct and coordinate action; <span class=\"t\" data-t=\"planning\">planning</span> builds shared <span class=\"t\" data-t=\"situational awareness\">situational awareness</span>; <span class=\"t\" data-t=\"planning\">planning</span> generates expectations against which failure is recognized; <span class=\"t\" data-t=\"planning\">planning</span> supports initiative by giving a point of departure for adaptation; <span class=\"t\" data-t=\"planning\">planning</span> shapes the thinking of planners. The functions conflict: over-weighting direction breeds micromanagement; many contingencies add flexibility at the cost of initiative and shared awareness. The <span class=\"t\" data-t=\"commander\">commander</span> decides which function the <span class=\"t\" data-t=\"situation\">situation</span> demands."}, {"title": "Planning in Time and Planning as Shaping", "body": "Forward <span class=\"t\" data-t=\"planning\">planning</span> asks \"where can we get to next?\" and works from present feasibility; reverse <span class=\"t\" data-t=\"planning\">planning</span> asks \"where do we eventually want to get?\" and works back from an <span class=\"t\" data-t=\"end state\">end state</span> — possible only when the goal is stable, and used together. Deliberate <span class=\"t\" data-t=\"planning\">planning</span> runs on assumptions well ahead of execution; rapid <span class=\"t\" data-t=\"planning\">planning</span> runs on current conditions and revises it. <span class=\"t\" data-t=\"shaping\">Shaping</span> is taking action now for future advantage while preserving multiple options and avoiding irreversible commitment. The <span class=\"t\" data-t=\"end state\">end state</span> is an aiming point, not a fixed destination."}, {"title": "Planning Misused", "body": "Four pitfalls, one cause — refusal to accept <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>. Forecasting and dictating too far into the future (<span class=\"t\" data-t=\"plan\">plans</span> are overcome by <span class=\"t\" data-t=\"event\">events</span> sooner than planners expect; studies show <span class=\"t\" data-t=\"plan\">plans</span> last about 65 percent of their intended life). <span class=\"t\" data-t=\"planning\">Planning</span> in more detail than conditions warrant. <span class=\"t\" data-t=\"planning\">Planning</span> as scripting that prescribes friendly and enemy actions and turns <span class=\"t\" data-t=\"subordinates\">subordinates</span> toward meeting the <span class=\"t\" data-t=\"plan\">plan</span> rather than deciding effectively. Institutionalized rigidity — routines that harden and reduce <span class=\"t\" data-t=\"judgment\">judgment</span> to procedure, \"one of the gravest pathological characteristics of <span class=\"t\" data-t=\"planning\">planning</span> and of <span class=\"t\" data-t=\"plan\">plans</span>.\" ---"}], "vocabulary": [{"term": "Planning", "definition": "The art and science of envisioning a desired future and laying out effective ways of bringing it about; thinking before doing"}, {"term": "Plan", "definition": "Any product of <span class=\"t\" data-t=\"planning\">planning</span>; an interim configuration of actions in time and space, always subject to revision; the basis for action, <span class=\"t\" data-t=\"cooperation\">cooperation</span>, and adaptation"}, {"term": "Process vs. procedure", "definition": "A dynamic system of related activities vs. a prescribed sequence of steps; <span class=\"t\" data-t=\"planning\">planning</span> is the former"}, {"term": "Conceptual / functional / detailed planning", "definition": "Aims, intent, and broad concepts (art) / supporting <span class=\"t\" data-t=\"plan\">plans</span> by function / specifics of execution (science)"}, {"term": "Commitment / contingency / orientation planning", "definition": "Modes by <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>: commit resources to one <span class=\"t\" data-t=\"plan\">plan</span> / prepare several without committing / assess and design flexibility only"}, {"term": "Planning horizon", "definition": "How far into the future <span class=\"t\" data-t=\"planning\">planning</span> tries to shape <span class=\"t\" data-t=\"event\">events</span>; commitment, contingency, and orientation horizons run concurrently"}, {"term": "Decision planning / execution planning", "definition": "<span class=\"t\" data-t=\"planning\">Planning</span> before the decision (generate and evaluate courses) / after it (translate into an executable <span class=\"t\" data-t=\"directive\">directive</span>)"}, {"term": "Deliberate / rapid planning", "definition": "Well in advance on assumptions / time-sensitive on current conditions; rapid revises deliberate"}, {"term": "Forward / reverse planning", "definition": "From present toward next feasible step / from <span class=\"t\" data-t=\"end state\">end state</span> back toward present"}, {"term": "Tight / loose coupling", "definition": "Close, time-dependent interaction between <span class=\"t\" data-t=\"plan\">plan</span> elements / independent, asynchronous elements; integrated vs. modular"}, {"term": "Control process", "definition": "The <span class=\"t\" data-t=\"plan\">plan</span> component that supervises execution: coordination measures, <span class=\"t\" data-t=\"feedback\">feedback</span> mechanisms, <span class=\"t\" data-t=\"decision point\">decision points</span>"}, {"term": "Decision point", "definition": "A designed point in execution requiring a decision about how to proceed"}, {"term": "Branches and sequels", "definition": "Planned alternatives within a <span class=\"t\" data-t=\"phase\">phase</span> / planned follow-on <span class=\"t\" data-t=\"phase\">phases</span> for likely contingencies"}, {"term": "Directive", "definition": "Any communication establishing <span class=\"t\" data-t=\"policy\">policy</span> or ordering action; <span class=\"t\" data-t=\"plan\">plans</span> (conditional) and orders (obligation to execute)"}, {"term": "Warning order / fragmentary order", "definition": "Preliminary notice to begin preparation / abbreviated order that avoids restating the base order"}, {"term": "Commander's intent", "definition": "The purpose behind the mission; brief, unambiguous, compelling; drafted by the <span class=\"t\" data-t=\"commander\">commander</span> personally"}, {"term": "Anticipatory adaptation / improvisation", "definition": "Adapting in advance through <span class=\"t\" data-t=\"planning\">planning</span> / adapting in real time from the <span class=\"t\" data-t=\"plan\">plan</span> as point of departure"}, {"term": "General vs. vague goal", "definition": "Few criteria with broad latitude, good / no usable criteria for success, bad"}, {"term": "Simple vs. simplistic", "definition": "As simple as the <span class=\"t\" data-t=\"situation\">situation</span> allows / made simple by ignoring the <span class=\"t\" data-t=\"situation\">situation</span>'s real complications"}], "quotes": [{"quote": "<span class=\"t\" data-t=\"planning\">Planning</span> is the art and science of envisioning a desired future and laying out effective ways of bringing it about.", "caption": "Ch. 1, Planning and Plans Defined"}, {"quote": "<span class=\"t\" data-t=\"planning\">Planning</span> for a particular action only stops with execution, and even then adaptation continues during execution.", "caption": "Ch. 1, Planning and Plans Defined"}, {"quote": "Done poorly and inappropriately, <span class=\"t\" data-t=\"planning\">planning</span> can be worse than irrelevant and a waste of valuable time and <span class=\"t\" data-t=\"energy\">energy</span>.", "caption": "Ch. 1, The Value of Planning"}, {"quote": "How accurately a <span class=\"t\" data-t=\"plan\">plan</span> forecasts the future is not generally a measure of the <span class=\"t\" data-t=\"plan\">plan</span>'s effectiveness. Rather, the measure of effectiveness is how effectively <span class=\"t\" data-t=\"planning\">planning</span> allows us to adapt to an uncertain future.", "caption": "Ch. 1, Uncertainty and Time"}, {"quote": "Military problems simply are not amenable to engineered solutions.", "caption": "Ch. 1, Complexity: The Limits of Foresight and Design"}, {"quote": "The result can be an extremely detailed <span class=\"t\" data-t=\"plan\">plan</span> that does not survive the <span class=\"t\" data-t=\"friction\">friction</span> of the <span class=\"t\" data-t=\"situation\">situation</span> and that constricts effective action.", "caption": "Ch. 1, Planning Misused"}, {"quote": "An important aspect of this model of the <span class=\"t\" data-t=\"planning\">planning</span> process is that much of <span class=\"t\" data-t=\"planning\">planning</span> is actually replanning.", "caption": "Ch. 2, The Planning Process"}, {"quote": "<span class=\"t\" data-t=\"unclear goals\">Unclear goals</span> are generally better than no goals, and waiting for clear goals before acting can paralyze an organization.", "caption": "Ch. 2, Components of a Plan"}, {"quote": "In other words, the <span class=\"t\" data-t=\"plan\">plan</span> itself should contain the means for changing the <span class=\"t\" data-t=\"plan\">plan</span>.", "caption": "Ch. 2, Components of a Plan"}, {"quote": "The increasing complexity of a <span class=\"t\" data-t=\"plan\">plan</span> often reflects the increasing understanding of planners.", "caption": "Ch. 2, Simplicity and Complexity"}, {"quote": "The key is to develop <span class=\"t\" data-t=\"plan\">plans</span> that are broad but not vague.", "caption": "Ch. 3, Simple Plans"}, {"quote": "We should not think of a <span class=\"t\" data-t=\"plan\">plan</span> as an unalterable solution to a problem, but as an open architecture that allows us to pursue many <span class=\"t\" data-t=\"possibilities\">possibilities</span>.", "caption": "Ch. 3, Adaptive, Flexible Plans"}, {"quote": "We can think of <span class=\"t\" data-t=\"planning\">planning</span> as solution-by-evolution rather than solution-by-engineering.", "caption": "Ch. 3, Continuous, Evolutionary Planning"}, {"quote": "What matters most is not generating the best possible <span class=\"t\" data-t=\"plan\">plan</span> but achieving the best possible result.", "caption": "Ch. 3, Continuous, Evolutionary Planning"}, {"quote": "<span class=\"t\" data-t=\"planning\">Planning</span> cannot be done to or for an organization; it must be done by it.", "caption": "Ch. 3, Participatory Planning (quoting Ackoff)"}, {"quote": "<span class=\"t\" data-t=\"commander\">Commanders</span> should evaluate <span class=\"t\" data-t=\"plan\">plans</span> not on how much time and <span class=\"t\" data-t=\"energy\">energy</span> went into the preparation, but on whether they provide the basis for effective action.", "caption": "Ch. 3, Commanders and Planners"}, {"quote": "Orders should instruct only so far as conditions can reasonably be foreseen. Orders which attempt to arrange details too far in advance usually have to be countermanded.", "caption": "Ch. 3, Plans and Orders"}, {"quote": "The ultimate measure of effective <span class=\"t\" data-t=\"planning\">planning</span> is the answer to the following question: Can we <span class=\"t\" data-t=\"act\">act</span> faster and more effectively than the enemy?", "caption": "Ch. 3, Conclusion"}], "doesnt_work": "Treating <span class=\"t\" data-t=\"planning\">planning</span> as a procedure, forecasting and dictating too far into the future, <span class=\"t\" data-t=\"planning\">planning</span> in more detail than the <span class=\"t\" data-t=\"situation\">situation</span> warrants, adding detail to relieve the anxiety of <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>, scripting friendly and enemy actions, judging a <span class=\"t\" data-t=\"plan\">plan</span> by forecast accuracy or by effort spent, institutionalized routines that reduce intuition to steps and harden over time, tightly <span class=\"t\" data-t=\"coupling\">coupling</span> actions that do not need <span class=\"t\" data-t=\"coupling\">coupling</span>, <span class=\"t\" data-t=\"plan\">plans</span> without a <span class=\"t\" data-t=\"control process\">control process</span> or <span class=\"t\" data-t=\"feedback\">feedback</span> signals, vague goals with no success criteria, waiting for clear goals before acting, <span class=\"t\" data-t=\"planning\">planning</span> for every eventuality until none is prepared, an isolated <span class=\"t\" data-t=\"planning\">planning</span> staff that <span class=\"t\" data-t=\"plan\">plans</span> for executors instead of with them, a <span class=\"t\" data-t=\"commander\">commander</span> who delegates <span class=\"t\" data-t=\"planning\">planning</span> and misses the <span class=\"t\" data-t=\"learning\">learning</span>, <span class=\"t\" data-t=\"directive\">directives</span> that repeat SOP and restate higher's order, slavish order formats, withholding partial instructions until the whole order is complete, treating the <span class=\"t\" data-t=\"plan\">plan</span> as a solution to implement rather than a point of departure, rebuilding from scratch when the <span class=\"t\" data-t=\"plan\">plan</span> meets reality.", "selfcheck": ["Have I, the <span class=\"t\" data-t=\"commander\">commander</span>, personally drafted the intent and set the goals — and are they general, not vague?", "Does the <span class=\"t\" data-t=\"plan\">plan</span> state outcome + intent, actions, resources, and a <span class=\"t\" data-t=\"control process\">control process</span> with <span class=\"t\" data-t=\"feedback\">feedback</span> signals and <span class=\"t\" data-t=\"decision point\">decision points</span>?", "Am I <span class=\"t\" data-t=\"planning\">planning</span> in the right mode for the <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> — committing only inside the commitment horizon, holding later <span class=\"t\" data-t=\"phase\">phases</span> as contingency or orientation?", "Is the <span class=\"t\" data-t=\"plan\">plan</span> as simple as the <span class=\"t\" data-t=\"situation\">situation</span> allows, embodied in one compelling concept?", "Have I asked \"do these actions need to be coupled?\" before every coordination measure?", "Is the detail limited to what executors need, with the rest delegated down?", "Did the executors participate in building the <span class=\"t\" data-t=\"plan\">plan</span>?", "Am I treating the <span class=\"t\" data-t=\"plan\">plan</span> as an interim product — replanning continuously, updating as the <span class=\"t\" data-t=\"situation\">situation</span> moves?", "Have I issued warning orders and partial instructions early rather than waiting for a complete <span class=\"t\" data-t=\"directive\">directive</span>?", "When the <span class=\"t\" data-t=\"plan\">plan</span> departs from reality, am I adapting from it inside the intent rather than scrapping it or forcing reality back?", "Is the <span class=\"t\" data-t=\"plan\">plan</span> judged on whether it produced effective action, not on effort spent or fidelity of execution?"], "selfcheck_note": "", "application": [{"lead": "Planning hierarchy → the phases of <code>project_flow</code>.", "body": "Conceptual <span class=\"t\" data-t=\"planning\">planning</span> is the brief: <span class=\"t\" data-t=\"end state\">end state</span>, intent, one compelling concept — drafted by the operator personally, because that is the <span class=\"t\" data-t=\"commander\">commander</span>'s job and cannot be delegated to the AI partner. Functional <span class=\"t\" data-t=\"planning\">planning</span> is the workstream layer (content, tooling, runway, distribution). Detailed <span class=\"t\" data-t=\"planning\">planning</span> is the task list, and it belongs to whoever executes — the AI partner drafts it, the operator approves. Flow runs general to specific, but functional constraints (runway, time) feed back and reshape the concept."}, {"lead": "Planning modes → the horizon structure and the gates.", "body": "Commit resources only inside the commitment horizon where forecasts hold. Later <span class=\"t\" data-t=\"phase\">phases</span> sit as contingencies (two or three branches, not detailed) and beyond that as orientation (assess, keep options open). Each venture gate on the <code>gates_sheet</code> is the moment a <span class=\"t\" data-t=\"phase\">phase</span> moves from contingency to commitment — and <span class=\"t\" data-t=\"doctrine\">doctrine</span> says the horizon should be nearer the more uncertain the <span class=\"t\" data-t=\"situation\">situation</span> is."}, {"lead": "\"Much of planning is actually replanning\" → STATE.md is the living plan.", "body": "A <span class=\"t\" data-t=\"plan\">plan</span> is an interim product. STATE.md updated at session end is the doctrinal replan; the <code>_CACHE/</code> note is the record of what changed. A <span class=\"t\" data-t=\"plan\">plan</span> that is not updated after contact is a static document, \"of no value to an adaptive organization.\""}, {"lead": "Components of a plan → the brief template.", "body": "Every brief carries four things or it is not a <span class=\"t\" data-t=\"plan\">plan</span>: desired outcome with intent, actions, resources, and a <span class=\"t\" data-t=\"control process\">control process</span>. The <span class=\"t\" data-t=\"control process\">control process</span> is the piece operators skip and <span class=\"t\" data-t=\"doctrine\">doctrine</span> says is most neglected — for the operation it is the sit rep cadence, the <span class=\"t\" data-t=\"decision point\">decision points</span>, and the BOLO watchlist that tells you the <span class=\"t\" data-t=\"plan\">plan</span> is failing before the deadline does."}, {"lead": "The recurring stall pattern is Planning Misused, pitfalls two and four.", "body": "Finished designs blocked on one unanswered decision, then rebuilt from scratch, is detail-under-anxiety followed by solution-by-engineering. <span class=\"t\" data-t=\"doctrine\">Doctrine</span>'s counter: \"<span class=\"t\" data-t=\"unclear goals\">Unclear goals</span> are generally better than no goals, and waiting for clear goals before acting can paralyze an organization.\" Make the decision at acceptable <span class=\"t\" data-t=\"risk\">risk</span> and adapt from the <span class=\"t\" data-t=\"plan\">plan</span> as the point of departure."}, {"lead": "Tight vs. loose coupling → modular workstreams.", "body": "Before wiring two workstreams together, ask \"do these actions need to be coupled?\" Loosely coupled projects can be parked (Oscar Mike) and resumed without breaking the rest. Tightly coupled ones fail together and repair slowly."}, {"lead": "Commander's intent → the line the AI partner acts on when the task is overcome by events.", "body": "Slim: the intent \"should be worded by the <span class=\"t\" data-t=\"commander\">commander</span> himself.\" The operator writes one brief, unambiguous, compelling sentence the partner can hold in mind; everything else in the brief is subordinate to it. <span class=\"t\" data-t=\"mission-type order\">Mission-type orders</span> to the partner state task and intent, not method."}, {"lead": "Plans and orders → how copy and boresight.", "body": "<span class=\"t\" data-t=\"directive\">Directives</span> carry the minimum instruction, are issued orally between principals where possible, and go out as warning orders and partial instructions early. <i>How copy</i> is the readback that closes the <span class=\"t\" data-t=\"directive\">directive</span> and confirms the shared <span class=\"t\" data-t=\"image\">image</span>; <i>boresight</i> is the shared <span class=\"t\" data-t=\"situational awareness\">situational awareness</span> the <span class=\"t\" data-t=\"planning\">planning</span> process exists to produce before execution — \"the common understanding provides a basis for unity of effort.\""}, {"lead": "Participatory planning → the AI partner cannot plan for the operator.", "body": "\"<span class=\"t\" data-t=\"planning\">Planning</span> cannot be done to or for an organization; it must be done by it.\" A <span class=\"t\" data-t=\"plan\">plan</span> the partner generates and the operator consumes fails the <span class=\"t\" data-t=\"doctrine\">doctrine</span> on its face; the operator's understanding comes from building it. The partner facilitates: guidance, context, resources, options, analysis — and the operator synthesizes."}, {"lead": "Planning in time → sit rep cadence and ENDEX.", "body": "All <span class=\"t\" data-t=\"planning\">planning</span> is time-sensitive: <span class=\"t\" data-t=\"plan\">plan</span> deliberately when time allows, rapidly when it does not, and know when to stop <span class=\"t\" data-t=\"planning\">planning</span> and execute. The session is the planning-execution cycle; ENDEX is the point at which the latest version of the <span class=\"t\" data-t=\"plan\">plan</span> becomes the basis for action and the measure is applied — did it produce effective action, faster than the alternative."}], "marks": []}, {"id": "MIL.09", "bvx_id": "BVX.1119", "title": "MCDP 6 — Command and Control", "author": "U.S. Marine Corps (HQMC)", "year": "1996", "edition": "1996; Change 1, 2018", "domain": "MILITARY DOCTRINE", "tags": ["bvx-learn", "mcdp", "command-and-control", "decision-making", "feedback", "mission-command", "information", "implicit-communication"], "related": ["🧬 MIL.01 — MCDP 1 Warfighting — USMC (1997)", "🧬 MIL.05 — MCDP 2 Intelligence — USMC (1997)", "🧬 MIL.07 — MCDP 4 Logistics — USMC (2023)", "🧬 MIL.08 — MCDP 5 Planning — USMC (1997)", "🧬 MIL.11 — MCDP 8 Information — USMC (2022)"], "feeds": [{"layer": "SOP", "variable": "comms_protocol", "strength": "primary", "note": "Control IS feedback — the sit rep is the control mechanism, not the commander's directive. 'How copy' is explicit feedback confirming the shared image; 'boresight' is implicit understanding built before execution so less has to be said during it. Information hierarchy sets the sit rep standard: understanding and images, not data."}, {"layer": "05_OPERATIONS", "variable": "project_flow", "strength": "primary", "note": "The OODA loop is the session cycle; mission command (task + intent, intent predominant) is the order format to the AI partner; decision cycles pushed to the lowest level; the plan is a common starting point, not a script. Measure: does it help us act faster and more effectively."}, {"layer": "DOCTRINE_0", "variable": "invariants", "strength": "secondary", "note": "Uncertainty is a byproduct, never eliminated; time is the second absolute; certainty is knowledge and understanding, not data; only two responses to insufficient information exist — process more or need less; authority and responsibility travel together; intent outlives task."}, {"layer": "BOLO", "variable": "pmcs_readiness", "strength": "secondary", "note": "Feedback closes the loop on the plan. BOLO is the demand-pull queue; the PMCS table is supply-push of routine readiness to a local database the commander pulls from — the hybrid information system doctrine prescribes."}], "file": "🧬 MIL.09 — MCDP 6 Command and Control — USMC (1996).md", "thesis": "<span class=\"t\" data-t=\"command and control\">Command and control</span> is not a <span class=\"t\" data-t=\"commander\">commander</span> imposing <span class=\"t\" data-t=\"control\">control</span> downward but one system in which <span class=\"t\" data-t=\"command\">command</span> is the exercise of authority and <span class=\"t\" data-t=\"control\">control</span> is the <span class=\"t\" data-t=\"feedback\">feedback</span> returning from the action — and because <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> can never be eliminated and time can never be bought back, the winning system is the one designed to need less <span class=\"t\" data-t=\"information\">information</span> to <span class=\"t\" data-t=\"act\">act</span> (mission <span class=\"t\" data-t=\"command\">command</span>: intent, trust, implicit understanding, low-level initiative) and therefore cycles observe-orient-decide-act faster than the <span class=\"t\" data-t=\"opponent\">opponent</span>. ---", "invariants": [{"lead": "Uncertainty is a byproduct of the activity, not a condition to be removed.", "body": "War is a clash of <span class=\"t\" data-t=\"independent wills\">independent wills</span>; the interaction itself generates unknowns. <span class=\"t\" data-t=\"command and control\">Command and control</span> reduces <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> to a manageable level and then <span class=\"t\" data-t=\"act\">acts</span> on what is known. Pursuing <span class=\"t\" data-t=\"certainty\">certainty</span> is pursuing something the environment does not contain."}, {"lead": "Time is the second absolute.", "body": "Reducing <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> costs time; <span class=\"t\" data-t=\"information\">information</span> perishes while more is gathered; the <span class=\"t\" data-t=\"opponent\">opponent</span> <span class=\"t\" data-t=\"act\">acts</span> meanwhile. The requirement is to be fast relative to the enemy, and a small <span class=\"t\" data-t=\"speed\">speed</span> differential exploited repeatedly is decisive. The tension between coping with <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> and racing against time is the fundamental problem."}, {"lead": "Control is feedback, not imposition.", "body": "<span class=\"t\" data-t=\"command\">Command</span> is deciding and directing; <span class=\"t\" data-t=\"control\">control</span> is the continuous flow of <span class=\"t\" data-t=\"information\">information</span> about the unfolding <span class=\"t\" data-t=\"situation\">situation</span> returning to the <span class=\"t\" data-t=\"commander\">commander</span>, indicating the gap between goals and reality. The whole system comes \"under <span class=\"t\" data-t=\"control\">control</span>\" through <span class=\"t\" data-t=\"feedback\">feedback</span> from all directions. <span class=\"t\" data-t=\"command and control\">Command and control</span> is one reciprocal system, not a top-down channel."}, {"lead": "Certainty is a function of knowledge and understanding, not data.", "body": "Data become knowledge through cognition and understanding through <span class=\"t\" data-t=\"judgment\">judgment</span> — a human <span class=\"t\" data-t=\"act\">act</span> that cannot be reduced to procedure. More <span class=\"t\" data-t=\"information\">information</span> flow does not mean less <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>; too much <span class=\"t\" data-t=\"information\">information</span> is as bad as too little and more likely."}, {"lead": "Only two responses to insufficient information exist.", "body": "Increase the organization's information-processing capacity, or design the organization and the task to operate on less <span class=\"t\" data-t=\"information\">information</span>. These are exhaustive. Detailed <span class=\"t\" data-t=\"command\">command</span> chooses the first; mission <span class=\"t\" data-t=\"command\">command</span> chooses the second."}, {"lead": "Authority and responsibility travel together in like measure.", "body": "Where there is authority there must be responsibility; where results are required, the authority to <span class=\"t\" data-t=\"act\">act</span> must be present. Initiative distributed downward carries accountability downward with it."}, {"lead": "Intent outlives task.", "body": "A mission has a task (the action) and an intent (the desired result). The <span class=\"t\" data-t=\"situation\">situation</span> changes and makes tasks obsolete; the intent endures and continues to guide action. Without intent there is no mission <span class=\"t\" data-t=\"command\">command</span>."}, {"lead": "Trust is the precondition of decentralization.", "body": "Mutual trust — earned by <span class=\"t\" data-t=\"competence\">competence</span>, responsibility, loyalty, and self-discipline, and given in the form of latitude and support — is the cornerstone of <span class=\"t\" data-t=\"cooperation\">cooperation</span>. Organizations characterized by distrust drift toward detailed <span class=\"t\" data-t=\"control\">control</span>."}, {"lead": "The single measure is relative effectiveness.", "body": "Not efficiency of the process, not volume of <span class=\"t\" data-t=\"information\">information</span>, not sophistication of equipment: can it help us <span class=\"t\" data-t=\"act\">act</span> faster and more effectively than the enemy?"}], "heuristics": [{"situation": "Briefing the <span class=\"t\" data-t=\"commander\">commander</span>", "do": "Deliver meaning — what it means, what the enemy is doing, whether X is possible — as a picture", "not": "Facts, figures, lists, and printouts"}, {"situation": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> is blocking action", "do": "<span class=\"t\" data-t=\"act\">Act</span> on what is known; adopt a promising scheme at acceptable <span class=\"t\" data-t=\"risk\">risk</span>, faster than the foe", "not": "Wait for more <span class=\"t\" data-t=\"information\">information</span>; agonize toward the perfect solution"}, {"situation": "Assigning a mission", "do": "State the task and the intent; make the intent predominant and brief enough to hold in mind", "not": "Task only; or detailed direction on method"}, {"situation": "Subordinate's task is overcome by <span class=\"t\" data-t=\"event\">events</span>", "do": "<span class=\"t\" data-t=\"act\">Act</span> on intent, keeping the larger <span class=\"t\" data-t=\"situation\">situation</span> in mind; inform others of the departure", "not": "\"Wait out\" for new orders; or execute the obsolete task flawlessly"}, {"situation": "Technology shows every subordinate's position", "do": "Stay at the level of detail appropriate to your echelon; appreciate the flow of action", "not": "Micromanage because you can"}, {"situation": "Designing <span class=\"t\" data-t=\"information\">information</span> flow", "do": "Hybrid: push routine <span class=\"t\" data-t=\"information\">information</span> to a local base the <span class=\"t\" data-t=\"commander\">commander</span> pulls from; push truly critical, time-sensitive items direct, even skipping echelons, then inform intermediates", "not": "Pure broadcast (overload) or pure demand-pull (delay and <span class=\"t\" data-t=\"demand cascade\">demand cascade</span>)"}, {"situation": "Reports arrive nth-hand", "do": "Go see the critical <span class=\"t\" data-t=\"event\">event</span>; use a <span class=\"t\" data-t=\"directed telescope\">directed telescope</span>; rely on <span class=\"t\" data-t=\"implicit communication\">implicit communication</span>; decentralize the decision to the person on the spot", "not": "Trust the impressively displayed report; accept distortion and delay as given"}, {"situation": "Choosing procedure vs. <span class=\"t\" data-t=\"judgment\">judgment</span>", "do": "Procedures for rote, mechanical, repetitive tasks; <span class=\"t\" data-t=\"judgment\">judgment</span> for everything else; simple models expanded when time allows", "not": "Elaborate models compressed under time pressure; procedure standing in for <span class=\"t\" data-t=\"judgment\">judgment</span>"}, {"situation": "Deciding under time pressure", "do": "Intuitive: recognize the pattern, satisfice on the first workable solution, refine if time permits", "not": "Generate and compare many options to optimize"}, {"situation": "Deciding with time, needing documentation or computation", "do": "Analytical — supply rates, acquisition, justification, unfamiliar problems", "not": "Intuit what must be calculated"}, {"situation": "Subordinate makes a mistake of action", "do": "Tolerate it; tolerate no inaction", "not": "Zero-defects culture that penalizes initiative"}, {"situation": "Choosing where to be", "do": "Go to the critical spot for the critical <span class=\"t\" data-t=\"image\">image</span>; empower the staff to <span class=\"t\" data-t=\"act\">act</span> in your absence", "not": "Tied to the <span class=\"t\" data-t=\"command\">command</span> post for fear of missing a report"}, {"situation": "Sizing the staff", "do": "Keep it austere — so small it cannot exercise fully detailed <span class=\"t\" data-t=\"control\">control</span>", "not": "Grow the staff to process more <span class=\"t\" data-t=\"information\">information</span>, which demands a larger staff"}, {"situation": "<span class=\"t\" data-t=\"tempo\">Tempo</span> vs. patience", "do": "Bide time when the <span class=\"t\" data-t=\"situation\">situation</span> calls for it; the aim is meaningful action, not merely rapid action", "not": "<span class=\"t\" data-t=\"speed\">Speed</span> for its own sake"}, {"situation": "Communicating something important", "do": "Principal to principal, face to face or by voice, eliminating intermediaries; keep a record afterward", "not": "Route through operators and clerks; text only"}], "concepts": [{"title": "The Command and Control Problem: Uncertainty × Time", "body": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> is doubt that blocks or threatens to block action — about facts, about inferences from facts, about which eventuality <span class=\"t\" data-t=\"will\">will</span> occur. It can be reduced by gathering <span class=\"t\" data-t=\"information\">information</span>, but gathering costs time, knowledge perishes, the <span class=\"t\" data-t=\"opponent\">opponent</span> <span class=\"t\" data-t=\"act\">acts</span>, and modern <span class=\"t\" data-t=\"tempo\">tempo</span> limits what can be assimilated. The two <span class=\"t\" data-t=\"force\">forces</span> oppose each other and the <span class=\"t\" data-t=\"commander\">commander</span> resolves them by choosing how much <span class=\"t\" data-t=\"certainty\">certainty</span> to require before acting. The <span class=\"t\" data-t=\"opponent\">opponent</span> faces the same problem; the aim is relative advantage."}, {"title": "Command and Control as One System", "body": "The traditional view runs <span class=\"t\" data-t=\"command and control\">command and control</span> in the same direction, top-down. <span class=\"t\" data-t=\"doctrine\">Doctrine</span>'s view: <span class=\"t\" data-t=\"command\">command</span> is the exercise of authority (deciding what is to be done, directing or influencing), <span class=\"t\" data-t=\"control\">control</span> is <span class=\"t\" data-t=\"feedback\">feedback</span> (<span class=\"t\" data-t=\"information\">information</span> returning about effects), and the two interact in all directions — up, down, lateral, diagonal. <span class=\"t\" data-t=\"military action\">Military action</span> is a <span class=\"t\" data-t=\"complex adaptive system\">complex adaptive system</span>: open, organic, nonlinear, in continuous flux, where causes and effects cannot be isolated. The <span class=\"t\" data-t=\"commander\">commander</span> is inside the web of reciprocal influence, not above it; the fitting <span class=\"t\" data-t=\"image\">image</span> is a basketball team's willing <span class=\"t\" data-t=\"cooperation\">cooperation</span>, not a chess player's omnipotent direction. Precise <span class=\"t\" data-t=\"control\">control</span> is a delusion; the remarkable thing is that influence is possible at all."}, {"title": "The Three Elements: People, Information, Support Structure", "body": "People drive the system and the rest exists to serve them; <span class=\"t\" data-t=\"command\">command</span> is inseparable from leadership; the <span class=\"t\" data-t=\"commander\">commander</span> is the key individual. <span class=\"t\" data-t=\"information\">Information</span> is the representations of reality that inform decisions and direct action; its value exists in time; most of it is irrelevant, unusable, inaccurate, or misleading; the critical thing is key elements when needed in useful form. The <span class=\"t\" data-t=\"command and control support structure\">command and control support structure</span> — organization, procedures, equipment, facilities, <span class=\"t\" data-t=\"training\">training</span>, <span class=\"t\" data-t=\"education\">education</span>, <span class=\"t\" data-t=\"doctrine\">doctrine</span> — is not the system; it supports the people who are."}, {"title": "The OODA Loop", "body": "Observe (take in <span class=\"t\" data-t=\"information\">information</span>), orient (estimate, assume, analyze, judge — build a cohesive mental <span class=\"t\" data-t=\"image\">image</span> of what the <span class=\"t\" data-t=\"situation\">situation</span> means), decide (immediate reaction or deliberate <span class=\"t\" data-t=\"plan\">plan</span>), <span class=\"t\" data-t=\"act\">act</span> (disseminate, supervise, monitor <span class=\"t\" data-t=\"feedback\">feedback</span>), which returns to observe because acting has changed the <span class=\"t\" data-t=\"situation\">situation</span>. Multiple loops spin simultaneously at every echelon. The antagonist who cycles consistently faster gains compounding advantage; the slower one's actions grow less relevant each cycle until <span class=\"t\" data-t=\"command and control\">command and control</span> itself deteriorates."}, {"title": "The Information Hierarchy", "body": "Raw data (unprocessed signals) → processed data (formatted, plotted, correlated — a <span class=\"t\" data-t=\"situation\">situation</span> report, a call for fire) → knowledge (evaluated, integrated, analyzed — <span class=\"t\" data-t=\"intelligence\">intelligence</span>, an estimate) → understanding (synthesized and applied to the <span class=\"t\" data-t=\"situation\">situation</span> — <span class=\"t\" data-t=\"situational awareness\">situational awareness</span>, <span class=\"t\" data-t=\"coup d'oeil\">coup d'oeil</span>; we know what and understand why). Processing is procedural and machines do it well; cognition is <span class=\"t\" data-t=\"learning\">learning</span> what something means; <span class=\"t\" data-t=\"judgment\">judgment</span> is purely human. Integration reduces the number of pieces at each step so the <span class=\"t\" data-t=\"commander\">commander</span> is not overwhelmed. People think in <span class=\"t\" data-t=\"image\">images</span>, so <span class=\"t\" data-t=\"information\">information</span> should arrive as <span class=\"t\" data-t=\"image\">images</span> approaching final form. <span class=\"t\" data-t=\"commander\">Commanders</span> need three pictures: the closeup (feel for the action, personal observation), <span class=\"t\" data-t=\"topsight\">topsight</span> (the overall pattern and its distance from the <span class=\"t\" data-t=\"end state\">end state</span>), and the enemy's view. <span class=\"t\" data-t=\"information\">Information</span> passing through echelons is distorted and delayed at every node; remedies are personal observation, the <span class=\"t\" data-t=\"directed telescope\">directed telescope</span>, <span class=\"t\" data-t=\"implicit communication\">implicit communication</span>, and decentralization."}, {"title": "The Command and Control Spectrum: Detailed vs. Mission", "body": "<span class=\"t\" data-t=\"detailed command and control\">Detailed command and control</span> pursues <span class=\"t\" data-t=\"certainty\">certainty</span>: a powerful <span class=\"t\" data-t=\"information\">information</span> apparatus, centralized and formal, coercive unity of effort, detailed explicit orders, strict obedience, vertical linear flow (<span class=\"t\" data-t=\"information\">information</span> up, orders down), slow, brittle when the vertical flow is disrupted, technology-intensive. <span class=\"t\" data-t=\"mission command and control\">Mission command and control</span> accepts <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> and reduces the <span class=\"t\" data-t=\"certainty\">certainty</span> needed: spontaneous <span class=\"t\" data-t=\"cooperation\">cooperation</span> from shared understanding of the mission, decentralized and informal, brief simple orders, <span class=\"t\" data-t=\"subordinates\">subordinates</span> effecting coordination laterally, <span class=\"t\" data-t=\"implicit communication\">implicit communication</span>, faster, robust to disruption, demanding of leaders at every level. They are ends of a spectrum; detailed methods suit procedural and technical tasks; for the overall conduct of action under <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>, <span class=\"t\" data-t=\"doctrine\">doctrine</span> chooses mission <span class=\"t\" data-t=\"command\">command</span> as far as the <span class=\"t\" data-t=\"situation\">situation</span> allows."}, {"title": "The Four Pillars of Mission Command", "body": "Low-level initiative: authority to decide and <span class=\"t\" data-t=\"act\">act</span> distributed throughout; self-starting at every level; a special burden to <span class=\"t\" data-t=\"act\">act</span> in consonance with the senior's intent; a source of <span class=\"t\" data-t=\"energy\">energy</span> in crisis. <span class=\"t\" data-t=\"commander's intent\">Commander's intent</span>: task plus intent, intent predominant and enduring; provides <span class=\"t\" data-t=\"topsight\">topsight</span> and the logic that lets separate actions harmonize; a prime responsibility of <span class=\"t\" data-t=\"command\">command</span>. Mutual trust: seniors trust <span class=\"t\" data-t=\"subordinates\">subordinates</span> to accomplish the mission with minimal supervision, <span class=\"t\" data-t=\"act\">act</span> inside intent, report, and coordinate; <span class=\"t\" data-t=\"subordinates\">subordinates</span> trust seniors to guide and support them even in mistakes; discipline generated from within. Implicit understanding and communication: mutual understanding with minimal <span class=\"t\" data-t=\"information\">information</span> exchange, product of common ethos and repeated practice — a basketball team, a jazz band. The aim is not more <span class=\"t\" data-t=\"command and control\">command and control</span>; it is to need less."}, {"title": "Decision-Making Theory", "body": "Analytical decision-making generates options, compares them against criteria, and selects the best; methodical, time-consuming, reasoning over experience; appropriate when time is ample, computation is required, a decision must be documented, or the problem is unfamiliar. Intuitive decision-making assesses the <span class=\"t\" data-t=\"situation\">situation</span>, recognizes the pattern from experience, satisfices on the first workable solution, and refines if time permits; faster, and appropriate for the vast majority of tactical and operational decisions. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> makes intuitive the norm and analytical the reinforcement. Five principles: account for the enemy first; faster decisions win even by small margins; decisions require intuition, analysis, and creativity together; there is no perfect solution so do not agonize; the lower the echelon, the faster and more direct the decision — push the threshold down."}, {"title": "Information Management", "body": "Supply-push sends <span class=\"t\" data-t=\"information\">information</span> as available or on schedule — timely, no request needed, <span class=\"t\" data-t=\"risk\">risks</span> overload. Demand-pull waits for a request — tailored, but slow, blind to unidentified needs, and triggers <span class=\"t\" data-t=\"demand cascade\">demand cascades</span> down the chain. Broadcast <span class=\"t\" data-t=\"reach\">reaches</span> everyone fast but cannot be tailored and overloads. Point-to-point tailors and filters at each node but is slower and distorts with each hop. <span class=\"t\" data-t=\"doctrine\">Doctrine</span> prescribes a hybrid: push routine <span class=\"t\" data-t=\"information\">information</span> to an easily accessible local database that <span class=\"t\" data-t=\"commander\">commanders</span> pull from; push critical time-sensitive <span class=\"t\" data-t=\"information\">information</span> directly to principals, skipping echelons if necessary, then inform intermediates; keep <span class=\"t\" data-t=\"directed telescope\">directed telescopes</span> for needs no system anticipates. Filter (cull), fuse (integrate to usable form), prioritize (expedite by importance); <span class=\"t\" data-t=\"focus\">focus</span> on critical <span class=\"t\" data-t=\"information\">information</span> requirements."}, {"title": "Organization, Leadership, and the Support Structure", "body": "Organization establishes the chain of <span class=\"t\" data-t=\"command\">command</span>, <span class=\"t\" data-t=\"command\">command</span> and support relationships, <span class=\"t\" data-t=\"unity of command\">unity of command</span> (one mission, one <span class=\"t\" data-t=\"commander\">commander</span>, one superior), integrated teams, and <span class=\"t\" data-t=\"span of control\">span of control</span> (three to seven; wider means flatter and faster; narrower means deeper and slower). Task-organize the <span class=\"t\" data-t=\"command and control\">command and control</span> structure itself; flatten as far as span allows; keep staffs austere because staff size spirals with <span class=\"t\" data-t=\"information\">information</span> demand. Leadership under mission <span class=\"t\" data-t=\"command\">command</span> is persuasive and delegating, calibrated to subordinate maturity, leader-as-teacher, no zero-defects. <span class=\"t\" data-t=\"training\">Training</span>, <span class=\"t\" data-t=\"education\">education</span>, and <span class=\"t\" data-t=\"doctrine\">doctrine</span> build a shared ethos, pattern-recognition skills, and tolerance for mistakes of action; exercises include <span class=\"t\" data-t=\"disorder\">disorder</span>, disruption, and severe time limits. Procedures apply only to rote tasks and free <span class=\"t\" data-t=\"judgment\">judgment</span> for what only <span class=\"t\" data-t=\"judgment\">judgment</span> can do. Equipment enhances people and automates routine; it must connect principals directly, present <span class=\"t\" data-t=\"image\">images</span> not lists, and never enable micromanagement — \"just because our technology allows us to micromanage does not mean that we should.\" ---"}], "vocabulary": [{"term": "Command", "definition": "The exercise of authority: deciding what needs to be done and directing or influencing the conduct of others"}, {"term": "Control", "definition": "<span class=\"t\" data-t=\"feedback\">Feedback</span> — the continuous flow of <span class=\"t\" data-t=\"information\">information</span> about the unfolding <span class=\"t\" data-t=\"situation\">situation</span> returning to the <span class=\"t\" data-t=\"commander\">commander</span>, showing the gap between goal and reality"}, {"term": "Command and control", "definition": "As a noun, a system of people, <span class=\"t\" data-t=\"information\">information</span>, and support structure; as a verb, the process by which a <span class=\"t\" data-t=\"commander\">commander</span> recognizes what needs to be done and sees that it is done"}, {"term": "Feedback", "definition": "The mechanism by which the whole system adapts; may come from any direction and in any form"}, {"term": "OODA loop", "definition": "Observe–orient–decide–<span class=\"t\" data-t=\"act\">act</span>; the continuous, cyclic <span class=\"t\" data-t=\"command and control\">command and control</span> process; <span class=\"t\" data-t=\"tempo\">tempo</span> advantage compounds"}, {"term": "Tempo", "definition": "<span class=\"t\" data-t=\"speed\">Speed</span> of the decision-action cycle relative to the <span class=\"t\" data-t=\"opponent\">opponent</span>"}, {"term": "Uncertainty", "definition": "What is not known about the <span class=\"t\" data-t=\"situation\">situation</span>; doubt that blocks or threatens to block action; a byproduct of war"}, {"term": "Raw data / processed data / knowledge / understanding", "definition": "The <span class=\"t\" data-t=\"information\">information</span> hierarchy: signals → formatted form → evaluated and integrated meaning → synthesized <span class=\"t\" data-t=\"situational awareness\">situational awareness</span>"}, {"term": "Situational awareness", "definition": "Understanding applied to the <span class=\"t\" data-t=\"situation\">situation</span>; the basis for decision"}, {"term": "Image", "definition": "The embodiment of understanding of a <span class=\"t\" data-t=\"situation\">situation</span>; the form in which people think, understand, and are inspired"}, {"term": "Coup d'oeil", "definition": "\"Stroke of the eye\"; the gifted <span class=\"t\" data-t=\"commander\">commander</span>'s intuitive grasp of the <span class=\"t\" data-t=\"situation\">situation</span> through the fog"}, {"term": "Topsight", "definition": "The big-picture grasp of how the parts fit together, from a far-overhead vantage"}, {"term": "Directed telescope", "definition": "A dedicated observer or sensor reporting directly to the <span class=\"t\" data-t=\"commander\">commander</span> to bypass distortion and delay; augments, never replaces, the chain"}, {"term": "Detailed command and control", "definition": "Certainty-seeking, centralized, coercive, explicit, vertical, slow, brittle"}, {"term": "Mission command and control", "definition": "Uncertainty-accepting, decentralized, spontaneous, implicit, lateral, fast, robust"}, {"term": "Mission tactics", "definition": "Assigning a mission and explaining intent, leaving the subordinate free to choose the manner of accomplishment"}, {"term": "Commander's intent", "definition": "The desired result of the action; the enduring half of a mission; predominant over the task"}, {"term": "Implicit communication", "definition": "Mutual understanding and <span class=\"t\" data-t=\"cooperation\">cooperation</span> with minimal <span class=\"t\" data-t=\"information\">information</span> transmitted, from shared experience and common outlook"}, {"term": "Supply-push / demand-pull", "definition": "<span class=\"t\" data-t=\"information\">Information</span> sent as available or scheduled / <span class=\"t\" data-t=\"information\">information</span> sent on request"}, {"term": "Demand cascade", "definition": "A pull request filtering down the chain until it <span class=\"t\" data-t=\"reach\">reaches</span> the echelon that can gather it"}, {"term": "Broadcast / point-to-point", "definition": "Simultaneous transmission to a wide audience / sequential transmission to specific users, filtered at each node"}, {"term": "Satisficing", "definition": "Selecting the first solution that satisfactorily solves the problem rather than optimizing"}, {"term": "Intuitive / analytical decision-making", "definition": "Pattern recognition and <span class=\"t\" data-t=\"situation\">situation</span> assessment / concurrent comparison of multiple options against criteria"}, {"term": "Span of control", "definition": "Number of <span class=\"t\" data-t=\"subordinates\">subordinates</span> under one <span class=\"t\" data-t=\"commander\">commander</span>; three to seven as a rule of thumb"}, {"term": "Unity of command", "definition": "A given mission falls under one <span class=\"t\" data-t=\"commander\">commander</span> who receives orders from one superior"}, {"term": "Command and control support structure", "definition": "Organizations, procedures, equipment, facilities, <span class=\"t\" data-t=\"training\">training</span>, <span class=\"t\" data-t=\"education\">education</span>, <span class=\"t\" data-t=\"doctrine\">doctrine</span> that aid the people; not the system itself"}, {"term": "Complex system", "definition": "Multiple parts each acting on its own circumstances and thereby changing the circumstances of all the others; nonlinear, open, organic"}], "quotes": [{"quote": "I don't deal in data; I deal in pictures. Paint me a picture, got it?", "caption": "Operation VERBAL IMAGE (opening narrative)"}, {"quote": "This gear is great, as long as you don't trick yourself into thinking that it's actually smart.", "caption": "Operation VERBAL IMAGE (opening narrative)"}, {"quote": "Remember, the sign of a good <span class=\"t\" data-t=\"plan\">plan</span> is that it gives you both direction and flexibility.", "caption": "Operation VERBAL IMAGE (opening narrative)"}, {"quote": "We suggest a different and more dynamic view of <span class=\"t\" data-t=\"command and control\">command and control</span> which sees <span class=\"t\" data-t=\"command\">command</span> as the exercise of authority and <span class=\"t\" data-t=\"control\">control</span> as <span class=\"t\" data-t=\"feedback\">feedback</span> about the effects of the action taken.", "caption": "Ch. 1, What Is the Relationship Between \"Command\" and \"Control\"?"}, {"quote": "In such a <span class=\"t\" data-t=\"command and control\">command and control</span> system, <span class=\"t\" data-t=\"control\">control</span> is not strictly something that seniors impose on <span class=\"t\" data-t=\"subordinates\">subordinates</span>; rather, the entire system comes 'under <span class=\"t\" data-t=\"control\">control</span>' based on <span class=\"t\" data-t=\"feedback\">feedback</span> about the changing <span class=\"t\" data-t=\"situation\">situation</span>.", "caption": "Ch. 1, What Is the Relationship Between \"Command\" and \"Control\"?"}, {"quote": "The truth is that, given the nature of war, it is a delusion to think that we can be in <span class=\"t\" data-t=\"control\">control</span> with any sort of certitude or precision.", "caption": "Ch. 1, What Does It Mean to Be \"In Control\"?"}, {"quote": "In other words, too much <span class=\"t\" data-t=\"information\">information</span> is as bad as too little--and probably just as likely to occur.", "caption": "Ch. 1, What Makes Up Command and Control?"}, {"quote": "The defining problem of <span class=\"t\" data-t=\"command and control\">command and control</span> that overwhelms all others is the need to deal with <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>.", "caption": "Ch. 1, The Environment of Command and Control"}, {"quote": "<span class=\"t\" data-t=\"uncertainty\">Uncertainty</span> is not merely an existing environmental condition; it is a natural byproduct of war.", "caption": "Ch. 1, The Environment of Command and Control"}, {"quote": "<span class=\"t\" data-t=\"command and control\">Command and control</span> thus becomes a tense race against time.", "caption": "Ch. 1, The Environment of Command and Control"}, {"quote": "One is to increase its information-processing capacity, the other to design the organization, and indeed the task itself, in such a way as to enable it to operate on the basis of less <span class=\"t\" data-t=\"information\">information</span>. These approaches are exhaustive; no others are conceivable.", "caption": "Martin van Creveld, epigraph to Ch. 2"}, {"quote": "The aim is not merely rapid action, but also meaningful action.", "caption": "Ch. 2, Point of Departure: The OODA Loop"}, {"quote": "Knowledge and understanding result when human beings add meaning to data.", "caption": "Ch. 1, The Environment of Command and Control"}, {"quote": "Rather than increase the level of <span class=\"t\" data-t=\"certainty\">certainty</span> that we seek, by <span class=\"t\" data-t=\"mission command and control\">mission command and control</span> we reduce the degree of <span class=\"t\" data-t=\"certainty\">certainty</span> that we need.", "caption": "Ch. 2, The Command and Control Spectrum"}, {"quote": "A key phrase or a slight gesture can sometimes communicate more than a detailed order.", "caption": "Ch. 2, Communications Theory"}, {"quote": "It is not more <span class=\"t\" data-t=\"command and control\">command and control</span> that we are after. Instead, we seek to decrease the amount of <span class=\"t\" data-t=\"command and control\">command and control</span> that we need.", "caption": "Ch. 3, Mission Command and Control"}, {"quote": "Of the two, the intent is predominant. While a <span class=\"t\" data-t=\"situation\">situation</span> may change, making the task obsolete, the intent is more enduring and continues to guide our actions.", "caption": "Ch. 3, Commander's Intent"}, {"quote": "Trust is the cornerstone of <span class=\"t\" data-t=\"cooperation\">cooperation</span>.", "caption": "Ch. 3, Mutual Trust"}, {"quote": "In other words, the <span class=\"t\" data-t=\"planning\">planning</span> matters more than the <span class=\"t\" data-t=\"plan\">plan</span>.", "caption": "Ch. 3, Planning"}, {"quote": "The <span class=\"t\" data-t=\"commander\">commander</span> should do only those things which only the <span class=\"t\" data-t=\"commander\">commander</span> can do or which nobody else can do adequately. Routine tasks must be delegated to others.", "caption": "Ch. 3, Focusing Command and Control"}, {"quote": "<span class=\"t\" data-t=\"commander\">Commanders</span> who do not empower the staff to <span class=\"t\" data-t=\"act\">act</span> on their behalf <span class=\"t\" data-t=\"will\">will</span> become prisoners in their own headquarters, out of touch with reality and limited in their ability to influence <span class=\"t\" data-t=\"event\">events</span>.", "caption": "Ch. 3, Focusing Command and Control"}, {"quote": "This means that we must develop an institutional prejudice for tolerating mistakes of action but not inaction.", "caption": "Ch. 3, Training, Education, and Doctrine"}, {"quote": "The standard should be simple models which we can expand if time and circumstances permit, rather than inherently complicated models which we try to compress when time is short--which is likely to be most of the time.", "caption": "Ch. 3, Procedures"}, {"quote": "Just because our technology allows us to micromanage does not mean that we should.", "caption": "Ch. 3, Equipment and Technology"}], "doesnt_work": "Pursuing <span class=\"t\" data-t=\"certainty\">certainty</span> before acting, treating <span class=\"t\" data-t=\"control\">control</span> as something imposed downward, chess-player <span class=\"t\" data-t=\"command\">command</span> of human <span class=\"t\" data-t=\"subordinates\">subordinates</span>, more data as the cure for <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>, <span class=\"t\" data-t=\"information\">information</span> volume mistaken for understanding, briefings of facts and figures instead of meaning, detailed explicit orders and timetables for the overall conduct of action, \"synchroniz
