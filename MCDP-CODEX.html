der"}], "appears": ["MIL.01"]}, "prudent risk": {"term": "prudent risk", "senses": [{"sense": "<span class=\"t\" data-t=\"risk\">risk</span> accepted deliberately to achieve <span class=\"t\" data-t=\"focus\">focus</span>; economy everywhere else", "source": "MIL.01", "section": "INVARIANTS", "kind": "reader"}], "appears": ["MIL.01"]}, "risk": {"term": "Risk", "senses": [{"sense": "exposure to loss; inherent in action and inaction alike", "source": "MIL.01", "section": "INVARIANTS", "kind": "reader"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.06", "MIL.07", "MIL.08", "MIL.09", "MIL.10", "MIL.11"]}, "tempo": {"term": "Tempo", "senses": [{"sense": "<span class=\"t\" data-t=\"speed\">Speed</span> over time — the consistent ability to operate quickly; a <span class=\"t\" data-t=\"weapon\">weapon</span> measured relative to the enemy", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "<span class=\"t\" data-t=\"speed\">Speed</span> plus timing — generating and maintaining a fast pace when it counts and recovering when it does not hurt", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "<span class=\"t\" data-t=\"speed\">Speed</span> of the decision-action cycle relative to the <span class=\"t\" data-t=\"opponent\">opponent</span>", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.05", "MIL.09", "MIL.11"]}, "surprise": {"term": "Surprise", "senses": [{"sense": "A state of disorientation from an unexpected <span class=\"t\" data-t=\"event\">event</span> that degrades the ability to resist; achieved by deception, ambiguity, or stealth", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.10", "MIL.11"]}, "boldness": {"term": "Boldness", "senses": [{"sense": "Unhesitating exploitation of <span class=\"t\" data-t=\"uncertainty\">uncertainty</span> to pursue major rather than marginal results; tempered by <span class=\"t\" data-t=\"judgment\">judgment</span>", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.04", "MIL.10"]}, "center of gravity": {"term": "Center of gravity", "senses": [{"sense": "Any important source of <span class=\"t\" data-t=\"strength\">strength</span> — capability, locality, relationship, or moral factor — without which a <span class=\"t\" data-t=\"force\">force</span> cannot function", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.06"]}, "critical vulnerability": {"term": "Critical vulnerability", "senses": [{"sense": "A vulnerability that, if exploited, does the most significant damage to the enemy's ability to resist; the pathway to a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span>", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "A weakness that (1) significantly undermines a <span class=\"t\" data-t=\"center of gravity\">center of gravity</span> and (2) we have the means to exploit", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "A weakness that undermines a key <span class=\"t\" data-t=\"strength\">strength</span> and that we are capable of attacking effectively; may have to be created", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "A vulnerability whose exploitation destroys a capability without which the enemy cannot function effectively", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.06", "MIL.11"]}, "maneuver warfare": {"term": "Maneuver warfare", "senses": [{"sense": "A philosophy that seeks to shatter the enemy's cohesion through rapid, focused, unexpected actions creating a <span class=\"t\" data-t=\"situation\">situation</span> with which the enemy cannot cope", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.10", "MIL.11"]}, "attrition warfare": {"term": "Attrition warfare", "senses": [{"sense": "<span class=\"t\" data-t=\"victory\">Victory</span> through cumulative destruction of material by superior firepower; results proportionate to effort", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01"]}, "mission tactics": {"term": "Mission tactics", "senses": [{"sense": "Assigning a subordinate a mission without specifying how it must be accomplished; a contract between senior and subordinate", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Assigning a mission and its purpose without specifying how it is to be accomplished", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Assigning a mission and explaining intent, leaving the subordinate free to choose the manner of accomplishment", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Assigning a mission without specifying how it must be accomplished; the model for <span class=\"t\" data-t=\"self-directed learning\">self-directed learning</span>", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.04", "MIL.09", "MIL.10"]}, "mission-type order": {"term": "Mission-type order", "senses": [{"sense": "An order to perform a mission without specifying how it is to be accomplished", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.10"]}, "main effort": {"term": "Main effort", "senses": [{"sense": "The unit assigned the mission most critical to success at that moment; the focal point of the <span class=\"t\" data-t=\"force\">force</span>'s <span class=\"t\" data-t=\"combat power\">combat power</span> and priority for all support", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "The unit assigned the mission most critical to success at that moment; the focal point of the <span class=\"t\" data-t=\"force\">force</span>'s <span class=\"t\" data-t=\"combat power\">combat power</span> and support", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.05", "MIL.06", "MIL.07", "MIL.09", "MIL.10", "MIL.11"]}, "surfaces and gaps": {"term": "Surfaces and gaps", "senses": [{"sense": "Enemy <span class=\"t\" data-t=\"strength\">strengths</span> and enemy weaknesses, in space, time, or capability", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.10"]}, "reconnaissance pull": {"term": "Reconnaissance pull", "senses": [{"sense": "Pulling <span class=\"t\" data-t=\"combat power\">combat power</span> through gaps found by forward units, as opposed to <span class=\"t\" data-t=\"command\">command</span> push from the rear", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01"]}, "combined arms": {"term": "Combined arms", "senses": [{"sense": "Integration of arms such that to counter one the enemy must become more vulnerable to another — a dilemma", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Integrating arms so that any action the enemy takes to avoid one threat increases vulnerability to another — a dilemma, not a problem", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.04"]}, "topsight": {"term": "Topsight", "senses": [{"sense": "A grasp of how one's own action fits into the larger <span class=\"t\" data-t=\"situation\">situation</span>; the bird's-eye view that reveals the whole", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "The big-picture grasp of how the parts fit together, from a far-overhead vantage", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.09"]}, "implicit communication": {"term": "Implicit communication", "senses": [{"sense": "Communication through mutual understanding using a minimum of key, well-understood phrases; built on shared philosophy and shared experience", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Mutual understanding requiring little or no talk — faster and more reliable than explicit communication", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Mutual understanding and <span class=\"t\" data-t=\"cooperation\">cooperation</span> with minimal <span class=\"t\" data-t=\"information\">information</span> transmitted, from shared experience and common outlook", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.04", "MIL.09"]}, "culminating point": {"term": "Culminating point", "senses": [{"sense": "The point at which an offense can no longer sustain itself and must revert to the defense", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "The point at which a <span class=\"t\" data-t=\"force\">force</span> can no longer sustain the attack and reverts to defense; set by <span class=\"t\" data-t=\"logistics\">logistics</span>", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.07"]}, "shaping": {"term": "Shaping", "senses": [{"sense": "Lethal and nonlethal actions that set the general conditions of war to advantage before the decisive moment", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Influencing <span class=\"t\" data-t=\"event\">events</span> to change the general conditions decisively to our advantage before the decisive action", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Lethal and nonlethal actions that make the enemy vulnerable, dictate the time and place of battle, and preserve multiple friendly options", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.03", "MIL.04", "MIL.07", "MIL.08"]}, "zero-defects mentality": {"term": "Zero-defects mentality", "senses": [{"sense": "Punishing errors of <span class=\"t\" data-t=\"boldness\">boldness</span> so that initiative is stifled; expressly prohibited", "source": "MIL.01", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01"]}, "politics": {"term": "Politics", "senses": [{"sense": "The process by which power is distributed in any society; interactive, competitive or cooperative, not rational in outcome", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "policy": {"term": "Policy", "senses": [{"sense": "The conscious, reasoned use of power to accomplish a purpose; a rational subcomponent of <span class=\"t\" data-t=\"politics\">politics</span>, produced through <span class=\"t\" data-t=\"politics\">politics</span>", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.08"]}, "strategy": {"term": "Strategy", "senses": [{"sense": "The process of interrelating ends and means, and the product — a specific way of using specified means to achieve distinct ends", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02", "MIL.03", "MIL.06", "MIL.07"]}, "national strategy": {"term": "National strategy", "senses": [{"sense": "Developing and using all <span class=\"t\" data-t=\"instruments of national power\">instruments of national power</span>, in peace and war, to secure the objectives of <span class=\"t\" data-t=\"policy\">policy</span> (also grand <span class=\"t\" data-t=\"strategy\">strategy</span>, national security <span class=\"t\" data-t=\"strategy\">strategy</span>)", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "military strategy": {"term": "Military strategy", "senses": [{"sense": "Employing armed <span class=\"t\" data-t=\"force\">forces</span> to secure the objectives of national <span class=\"t\" data-t=\"policy\">policy</span> by <span class=\"t\" data-t=\"force\">force</span> or the threat of <span class=\"t\" data-t=\"force\">force</span>; subordinate to <span class=\"t\" data-t=\"national strategy\">national strategy</span>", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "instruments of national power": {"term": "Instruments of national power", "senses": [{"sense": "Diplomatic, economic, military, informational (DIME)", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "vital interests": {"term": "Vital interests", "senses": [{"sense": "Interests a nation <span class=\"t\" data-t=\"will\">will</span> not compromise and <span class=\"t\" data-t=\"will\">will</span> fight for", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "survival": {"term": "Survival", "senses": [{"sense": "Continued existence of the political entity at war; the minimum goal and prerequisite for <span class=\"t\" data-t=\"victory\">victory</span>", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "victory": {"term": "Victory", "senses": [{"sense": "Achievement of the <span class=\"t\" data-t=\"political aims\">political aims</span> plus an end to the war; may mean only ending on less unfavorable terms", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04"]}, "limited political objective": {"term": "Limited political objective", "senses": [{"sense": "The enemy leadership survives and remains in power, with some of its power reduced", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "unlimited political objective": {"term": "Unlimited political objective", "senses": [{"sense": "The enemy leadership is removed as a political entity", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "strategy of annihilation": {"term": "Strategy of annihilation", "senses": [{"sense": "Eliminating the enemy's military capacity to resist; incapacitation, not necessarily physical destruction", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Eliminating the enemy's capacity to resist; military <span class=\"t\" data-t=\"force\">forces</span> are the <span class=\"t\" data-t=\"main effort\">main effort</span>; <span class=\"t\" data-t=\"victory\">victory</span> easily measured", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02", "MIL.03"]}, "strategy of erosion": {"term": "Strategy of erosion", "senses": [{"sense": "Raising the enemy leadership's costs until settling is preferable to continuing; the classical \"<span class=\"t\" data-t=\"strategy\">strategy</span> of attrition\"", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Raising the enemy leadership's costs above what they <span class=\"t\" data-t=\"will\">will</span> pay; <span class=\"t\" data-t=\"main effort\">main effort</span> variable; <span class=\"t\" data-t=\"victory\">victory</span> flexibly defined", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02", "MIL.03"]}, "center of gravity (strategic)": {"term": "Center of gravity (strategic)", "senses": [{"sense": "A key source of enemy <span class=\"t\" data-t=\"strength\">strength</span> — <span class=\"t\" data-t=\"force\">forces</span>, a capital, a population, a leader, public support", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "strategic concept": {"term": "Strategic concept", "senses": [{"sense": "The course of action accepted from the strategic estimate; the clear, compelling basis for all subsequent <span class=\"t\" data-t=\"planning\">planning</span>", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "balance of power": {"term": "Balance of power", "senses": [{"sense": "A mechanism of shifting alliances that keeps any one entity from dominance; a strategic constant at every level", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "culminating point of victory": {"term": "Culminating point of victory", "senses": [{"sense": "The point at which one competitor's success prompts allies and others to withdraw support or turn against it", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "symmetrical / asymmetrical": {"term": "Symmetrical / asymmetrical", "senses": [{"sense": "Matching the enemy <span class=\"t\" data-t=\"strength\">strength</span> for <span class=\"t\" data-t=\"strength\">strength</span> vs. applying a category of means to which the enemy cannot respond in kind", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "deterrence by denial / reprisal": {"term": "Deterrence by denial / reprisal", "senses": [{"sense": "Convincing the enemy the action <span class=\"t\" data-t=\"will\">will</span> fail vs. convincing the enemy the cost <span class=\"t\" data-t=\"will\">will</span> exceed the gain", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "standardized / tailored strategy": {"term": "Standardized / tailored strategy", "senses": [{"sense": "A pattern response to a recognized problem type vs. a response fitted to the specific problem", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "strategy by default": {"term": "Strategy by default", "senses": [{"sense": "A <span class=\"t\" data-t=\"strategy\">strategy</span> dictated by circumstance, ideology, or unconscious assumption rather than rational consideration", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "fait accompli": {"term": "Fait accompli", "senses": [{"sense": "An action whose political and military goals are identical and achieved in one blow, presenting an accomplished fact", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "the trinity": {"term": "The trinity", "senses": [{"sense": "Clausewitz's three tendencies — primordial violence and emotion, chance and probability, subordination to reason — always all at work", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02"]}, "complex adaptive system": {"term": "Complex adaptive system", "senses": [{"sense": "A system whose members co-evolve and generate their own rules; constrained but not determined by external factors; inherently unpredictable", "source": "MIL.02", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02", "MIL.09"]}, "campaign": {"term": "Campaign", "senses": [{"sense": "A series of related military operations aimed at a strategic or operational objective within a given time and space", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03", "MIL.04"]}, "campaign plan": {"term": "Campaign plan", "senses": [{"sense": "The concise statement of design describing how time, space, and purpose connect the operations, leading to a well-defined <span class=\"t\" data-t=\"end state\">end state</span>", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "operational level of war": {"term": "Operational level of war", "senses": [{"sense": "The level that links <span class=\"t\" data-t=\"strategy\">strategy</span> and <span class=\"t\" data-t=\"tactics\">tactics</span>; the use of tactical results to attain strategic objectives; the art of winning <span class=\"t\" data-t=\"campaign\">campaigns</span>", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "military strategic aim": {"term": "Military strategic aim", "senses": [{"sense": "The political effect military <span class=\"t\" data-t=\"force\">forces</span> must achieve, translated into military terms; the starting point of <span class=\"t\" data-t=\"campaign\">campaign</span> design", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "restraints / constraints": {"term": "Restraints / constraints", "senses": [{"sense": "Restraints prohibit or restrict actions; constraints obligate the <span class=\"t\" data-t=\"commander\">commander</span> to certain courses of action", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "battle / engagement": {"term": "Battle / engagement", "senses": [{"sense": "A battle is a series of related tactical engagements for a significant objective; an engagement is a small tactical conflict", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "strategic center of gravity": {"term": "Strategic center of gravity", "senses": [{"sense": "An objective whose seizure, destruction, or neutralization profoundly affects the enemy leadership's <span class=\"t\" data-t=\"will\">will</span> or ability to continue", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "operational center of gravity": {"term": "Operational center of gravity", "senses": [{"sense": "The concentration of enemy military power most dangerous to us or standing between us and the strategic mission", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "campaign concept": {"term": "Campaign concept", "senses": [{"sense": "The single unifying idea of the <span class=\"t\" data-t=\"campaign\">campaign</span> — what and how — with intent explicitly stated", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "phase": {"term": "Phase", "senses": [{"sense": "A natural, event-driven subdivision of the <span class=\"t\" data-t=\"campaign\">campaign</span> with its own intermediate goal and intent", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.05", "MIL.06", "MIL.07", "MIL.08"]}, "branch / sequel": {"term": "Branch / sequel", "senses": [{"sense": "A branch is an option at a <span class=\"t\" data-t=\"decision point\">decision point</span>; a sequel is the follow-up action to a given outcome", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}, {"sense": "Branch: an option within the current operation for changing conditions. Sequel: the course of action following a probable outcome", "source": "MIL.04", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03", "MIL.04"]}, "forward and backward planning": {"term": "Forward and backward planning", "senses": [{"sense": "Envisioning <span class=\"t\" data-t=\"phase\">phases</span> from the present toward the <span class=\"t\" data-t=\"end state\">end state</span> and from the <span class=\"t\" data-t=\"end state\">end state</span> back to the present; the two must mesh", "source": "MIL.03", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03"]}, "logistical culmin  <span class=\"t\" data-t=\"intelligence\">intelligence</span> officer as operator working from the enemy's perspective", "source": "MIL.05", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.05"]}, "expedition": {"term": "Expedition", "senses": [{"sense": "A military operation by an armed <span class=\"t\" data-t=\"force\">force</span> to accomplish a specific objective in a foreign country", "source": "MIL.06", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06"]}, "expeditionary mindset / \"bags packed\"": {"term": "Expeditionary mindset / \"bags packed\"", "senses": [{"sense": "Readiness and willingness to deploy on a moment's notice, anywhere, for any mission, with a Spartan acceptance of austerity", "source": "MIL.06", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06"]}, "disaster / disruption / dispute": {"term": "Disaster / Disruption / Dispute", "senses": [{"sense": "Mass-suffering calamity / intentional <span class=\"t\" data-t=\"disorder\">disorder</span> interfering with government / open clash between political groups — the three crisis classes and their escalation ladder", "source": "MIL.06", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06"]}, "fragmegration": {"term": "Fragmegration", "senses": [{"sense": "Simultaneous political fragmentation and economic integration producing a tightly coupled, disruption-sensitive global system", "source": "MIL.06", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06"]}, "littoral": {"term": "Littoral", "senses": [{"sense": "Where land and sea meet — home to most population, trade, growth, and conflict", "source": "MIL.06", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06"]}, "closure rate": {"term": "Closure rate", "senses": [{"sense": "How quickly a <span class=\"t\" data-t=\"force\">force</span> can close on an objective area once tasked", "source":
