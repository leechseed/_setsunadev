07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07", "MIL.08"]}, "attainability": {"term": "Attainability", "senses": [{"sense": "The <span class=\"t\" data-t=\"commander\">commander</span>'s <span class=\"t\" data-t=\"judgment\">judgment</span> that sufficient supplies and support exist to initiate operations at acceptable <span class=\"t\" data-t=\"risk\">risk</span>", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "logistics visibility": {"term": "Logistics visibility", "senses": [{"sense": "Processed, analyzed awareness of demand (need vs. concept of operations) and supply (available resources)", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "supply chain / supply web": {"term": "Supply chain / supply web", "senses": [{"sense": "Single efficient linear network that fails when blocked / redundant multi-path network that resists blockage at higher cost", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "logistics snowball effect": {"term": "Logistics snowball effect", "senses": [{"sense": "Cumulative false demand from padded requirements that undercuts prioritization", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "hybrid logistics": {"term": "Hybrid logistics", "senses": [{"sense": "Blending old, new, and emerging means; modular capability tailored to a distributed <span class=\"t\" data-t=\"force\">force</span>", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "setting the theater": {"term": "Setting the theater", "senses": [{"sense": "Operational-level <span class=\"t\" data-t=\"shaping\">shaping</span>: distribution network, <span class=\"t\" data-t=\"force\">force</span> posture, forward provisioning before conflict", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "concept of support": {"term": "Concept of support", "senses": [{"sense": "The integrated <span class=\"t\" data-t=\"plan\">plan</span> for how every <span class=\"t\" data-t=\"logistics\">logistics</span> function supports every warfighting function", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "distribution node": {"term": "Distribution node", "senses": [{"sense": "Any place where people or materiel are stored, reconfigured, or await movement; caches to sea bases", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "self-sufficiency / dependency": {"term": "Self-sufficiency / dependency", "senses": [{"sense": "Ends of the <span class=\"t\" data-t=\"sustainment\">sustainment</span> spectrum; <span class=\"t\" data-t=\"force\">forces</span> blend them by mission and area", "source": "MIL.07", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07"]}, "planning": {"term": "Planning", "senses": [{"sense": "The art and science of envisioning a desired future and laying out effective ways of bringing it about; thinking before doing", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.02", "MIL.03", "MIL.04", "MIL.05", "MIL.07", "MIL.08", "MIL.09", "MIL.10", "MIL.11"]}, "process vs. procedure": {"term": "Process vs. procedure", "senses": [{"sense": "A dynamic system of related activities vs. a prescribed sequence of steps; <span class=\"t\" data-t=\"planning\">planning</span> is the former", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "commitment / contingency / orientation planning": {"term": "Commitment / contingency / orientation planning", "senses": [{"sense": "Modes by <span class=\"t\" data-t=\"uncertainty\">uncertainty</span>: commit resources to one <span class=\"t\" data-t=\"plan\">plan</span> / prepare several without committing / assess and design flexibility only", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "planning horizon": {"term": "Planning horizon", "senses": [{"sense": "How far into the future <span class=\"t\" data-t=\"planning\">planning</span> tries to shape <span class=\"t\" data-t=\"event\">events</span>; commitment, contingency, and orientation horizons run concurrently", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.08"]}, "decision planning / execution planning": {"term": "Decision planning / execution planning", "senses": [{"sense": "<span class=\"t\" data-t=\"planning\">Planning</span> before the decision (generate and evaluate courses) / after it (translate into an executable <span class=\"t\" data-t=\"directive\">directive</span>)", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "deliberate / rapid planning": {"term": "Deliberate / rapid planning", "senses": [{"sense": "Well in advance on assumptions / time-sensitive on current conditions; rapid revises deliberate", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "forward / reverse planning": {"term": "Forward / reverse planning", "senses": [{"sense": "From present toward next feasible step / from <span class=\"t\" data-t=\"end state\">end state</span> back toward present", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "tight / loose coupling": {"term": "Tight / loose coupling", "senses": [{"sense": "Close, time-dependent interaction between <span class=\"t\" data-t=\"plan\">plan</span> elements / independent, asynchronous elements; integrated vs. modular", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "control process": {"term": "Control process", "senses": [{"sense": "The <span class=\"t\" data-t=\"plan\">plan</span> component that supervises execution: coordination measures, <span class=\"t\" data-t=\"feedback\">feedback</span> mechanisms, <span class=\"t\" data-t=\"decision point\">decision points</span>", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08", "MIL.09"]}, "decision point": {"term": "Decision point", "senses": [{"sense": "A designed point in execution requiring a decision about how to proceed", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03", "MIL.08"]}, "branches and sequels": {"term": "Branches and sequels", "senses": [{"sense": "Planned alternatives within a <span class=\"t\" data-t=\"phase\">phase</span> / planned follow-on <span class=\"t\" data-t=\"phase\">phases</span> for likely contingencies", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.04", "MIL.07", "MIL.08", "MIL.10"]}, "directive": {"term": "Directive", "senses": [{"sense": "Any communication establishing <span class=\"t\" data-t=\"policy\">policy</span> or ordering action; <span class=\"t\" data-t=\"plan\">plans</span> (conditional) and orders (obligation to execute)", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07", "MIL.08"]}, "warning order / fragmentary order": {"term": "Warning order / fragmentary order", "senses": [{"sense": "Preliminary notice to begin preparation / abbreviated order that avoids restating the base order", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "anticipatory adaptation / improvisation": {"term": "Anticipatory adaptation / improvisation", "senses": [{"sense": "Adapting in advance through <span class=\"t\" data-t=\"planning\">planning</span> / adapting in real time from the <span class=\"t\" data-t=\"plan\">plan</span> as point of departure", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "general vs. vague goal": {"term": "General vs. vague goal", "senses": [{"sense": "Few criteria with broad latitude, good / no usable criteria for success, bad", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "simple vs. simplistic": {"term": "Simple vs. simplistic", "senses": [{"sense": "As simple as the <span class=\"t\" data-t=\"situation\">situation</span> allows / made simple by ignoring the <span class=\"t\" data-t=\"situation\">situation</span>'s real complications", "source": "MIL.08", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.08"]}, "command": {"term": "Command", "senses": [{"sense": "The exercise of authority: deciding what needs to be done and directing or influencing the conduct of others", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.03", "MIL.04", "MIL.05", "MIL.06", "MIL.07", "MIL.08", "MIL.09", "MIL.10", "MIL.11"]}, "command and control": {"term": "Command and control", "senses": [{"sense": "As a noun, a system of people, <span class=\"t\" data-t=\"information\">information</span>, and support structure; as a verb, the process by which a <span class=\"t\" data-t=\"commander\">commander</span> recognizes what needs to be done and sees that it is done", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.03", "MIL.04", "MIL.05", "MIL.06", "MIL.07", "MIL.09", "MIL.10", "MIL.11"]}, "feedback": {"term": "Feedback", "senses": [{"sense": "The mechanism by which the whole system adapts; may come from any direction and in any form", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.07", "MIL.08", "MIL.09", "MIL.10"]}, "raw data / processed data / knowledge / understanding": {"term": "Raw data / processed data / knowledge / understanding", "senses": [{"sense": "The <span class=\"t\" data-t=\"information\">information</span> hierarchy: signals → formatted form → evaluated and integrated meaning → synthesized <span class=\"t\" data-t=\"situational awareness\">situational awareness</span>", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "situational awareness": {"term": "Situational awareness", "senses": [{"sense": "Understanding applied to the <span class=\"t\" data-t=\"situation\">situation</span>; the basis for decision", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06", "MIL.08", "MIL.09"]}, "image": {"term": "Image", "senses": [{"sense": "The embodiment of understanding of a <span class=\"t\" data-t=\"situation\">situation</span>; the form in which people think, understand, and are inspired", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.05", "MIL.08", "MIL.09"]}, "coup d'oeil": {"term": "Coup d'oeil", "senses": [{"sense": "\"Stroke of the eye\"; the gifted <span class=\"t\" data-t=\"commander\">commander</span>'s intuitive grasp of the <span class=\"t\" data-t=\"situation\">situation</span> through the fog", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.04", "MIL.09"]}, "directed telescope": {"term": "Directed telescope", "senses": [{"sense": "A dedicated observer or sensor reporting directly to the <span class=\"t\" data-t=\"commander\">commander</span> to bypass distortion and delay; augments, never replaces, the chain", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "detailed command and control": {"term": "Detailed command and control", "senses": [{"sense": "Certainty-seeking, centralized, coercive, explicit, vertical, slow, brittle", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "mission command and control": {"term": "Mission command and control", "senses": [{"sense": "Uncertainty-accepting, decentralized, spontaneous, implicit, lateral, fast, robust", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "supply-push / demand-pull": {"term": "Supply-push / demand-pull", "senses": [{"sense": "<span class=\"t\" data-t=\"information\">Information</span> sent as available or scheduled / <span class=\"t\" data-t=\"information\">information</span> sent on request", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "demand cascade": {"term": "Demand cascade", "senses": [{"sense": "A pull request filtering down the chain until it <span class=\"t\" data-t=\"reach\">reaches</span> the echelon that can gather it", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "broadcast / point-to-point": {"term": "Broadcast / point-to-point", "senses": [{"sense": "Simultaneous transmission to a wide audience / sequential transmission to specific users, filtered at each node", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "satisficing": {"term": "Satisficing", "senses": [{"sense": "Selecting the first solution that satisfactorily solves the problem rather than optimizing", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "intuitive / analytical decision-making": {"term": "Intuitive / analytical decision-making", "senses": [{"sense": "Pattern recognition and <span class=\"t\" data-t=\"situation\">situation</span> assessment / concurrent comparison of multiple options against criteria", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "span of control": {"term": "Span of control", "senses": [{"sense": "Number of <span class=\"t\" data-t=\"subordinates\">subordinates</span> under one <span class=\"t\" data-t=\"commander\">commander</span>; three to seven as a rule of thumb", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "unity of command": {"term": "Unity of command", "senses": [{"sense": "A given mission falls under one <span class=\"t\" data-t=\"commander\">commander</span> who receives orders from one superior", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "command and control support structure": {"term": "Command and control support structure", "senses": [{"sense": "Organizations, procedures, equipment, facilities, <span class=\"t\" data-t=\"training\">training</span>, <span class=\"t\" data-t=\"education\">education</span>, <span class=\"t\" data-t=\"doctrine\">doctrine</span> that aid the people; not the system itself", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "complex system": {"term": "Complex system", "senses": [{"sense": "Multiple parts each acting on its own circumstances and thereby changing the circumstances of all the others; nonlinear, open, organic", "source": "MIL.09", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.09"]}, "learning": {"term": "Learning", "senses": [{"sense": "Developing knowledge, skills, and attitudes through study, experience, or instruction; includes both <span class=\"t\" data-t=\"training\">training</span> and <span class=\"t\" data-t=\"education\">education</span>", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.06", "MIL.08", "MIL.09", "MIL.10"]}, "training": {"term": "Training", "senses": [{"sense": "Learning-by-doing; prepares for the known factors of war", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.01", "MIL.05", "MIL.06", "MIL.07", "MIL.09", "MIL.10", "MIL.11"]}, "education": {"term": "Education", "senses": [{"sense": "Study and intellectual development; prepares for the unknown factors of war", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.04", "MIL.09", "MIL.10", "MIL.11"]}, "competence": {"term": "Competence", "senses": [{"sense": "Sufficient knowledge, <span class=\"t\" data-t=\"judgment\">judgment</span>, and skills to perform a particular duty, job, or function", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06", "MIL.09", "MIL.10"]}, "intellectual edge": {"term": "Intellectual edge", "senses": [{"sense": "Developed knowledge and experience that lets Marines recognize cues, make sense of <span class=\"t\" data-t=\"information\">information</span>, and respond faster than the enemy", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "bias for action": {"term": "Bias for action", "senses": [{"sense": "The disposition to decide and <span class=\"t\" data-t=\"act\">act</span> within <span class=\"t\" data-t=\"commander's intent\">commander's intent</span> without waiting to be told", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02", "MIL.10"]}, "learning friction": {"term": "Learning friction", "senses": [{"sense": "Lack of self-awareness, emotional regulation, humility, time management, or bias — the <span class=\"t\" data-t=\"force\">forces</span> that make <span class=\"t\" data-t=\"learning\">learning</span> harder than it looks", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "intrinsic / extrinsic feedback": {"term": "Intrinsic / extrinsic feedback", "senses": [{"sense": "<span class=\"t\" data-t=\"feedback\">Feedback</span> from your own perception vs. <span class=\"t\" data-t=\"feedback\">feedback</span> from an external source (instructor, peer, data)", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "adaptability": {"term": "Adaptability", "senses": [{"sense": "The quality of adjusting to new conditions; <span class=\"t\" data-t=\"learning\">learning</span> is itself a form of adaptive behavior", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.04", "MIL.06", "MIL.10"]}, "vicarious experience": {"term": "Vicarious experience", "senses": [{"sense": "<span class=\"t\" data-t=\"learning\">Learning</span> obtained by observing, reading, and studying what others experienced", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "mental imagery": {"term": "Mental imagery", "senses": [{"sense": "Visualization used to rehearse decisions, explore <span class=\"t\" data-t=\"branches and sequels\">branches and sequels</span>, and gain confidence before execution", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "growth / fixed mindset": {"term": "Growth / fixed mindset", "senses": [{"sense": "Belief that effort changes one's qualities vs. belief that qualities are innate; the first seeks <span class=\"t\" data-t=\"feedback\">feedback</span>, the second avoids it", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "intrinsic motivation": {"term": "Intrinsic motivation", "senses": [{"sense": "Engagement driven by internal reward; cultivated by attributing success to preparation, effort, persistence, practice", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "surfaces and gaps (learner)": {"term": "Surfaces and gaps (learner)", "senses": [{"sense": "Areas of existing understanding vs. weaknesses in knowledge, experience, or competency", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "main effort (learner)": {"term": "Main effort (learner)", "senses": [{"sense": "The learner is the <span class=\"t\" data-t=\"focus\">focus</span> of effort; leaders and instructors are in support", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "self-directed learning": {"term": "Self-directed learning", "senses": [{"sense": "Taking the initiative to identify <span class=\"t\" data-t=\"learning\">learning</span> needs, set goals, pursue them, and evaluate <span class=\"t\" data-t=\"outcomes\">outcomes</span>", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "diagnostic / formative / summative assessment": {"term": "Diagnostic / formative / summative assessment", "senses": [{"sense": "Before / during / after a <span class=\"t\" data-t=\"learning\">learning</span> activity; all are <span class=\"t\" data-t=\"feedback\">feedback</span> tools, not scores", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "coach–teach–mentor": {"term": "Coach–teach–mentor", "senses": [{"sense": "The instructional posture that delivers constructive <span class=\"t\" data-t=\"feedback\">feedback</span>", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "brilliance in the basics": {"term": "Brilliance in the basics", "senses": [{"sense": "Technical and tactical proficiency in fundamentals; the foundation of mastery", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "negative training": {"term": "Negative training", "senses": [{"sense": "Incorrect or unfocused practice that transfers bad habits to the battlespace", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "foot-locker education": {"term": "Foot-locker education", "senses": [{"sense": "Small-unit leaders and tested veterans teaching their people directly — where the greatest lessons pass", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "metacognition": {"term": "Metacognition", "senses": [{"sense": "Awareness and understanding of one's own thought processes", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "andragogy": {"term": "Andragogy", "senses": [{"sense": "Adult <span class=\"t\" data-t=\"learning\">learning</span> methods, techniques, and principles", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "learning organization": {"term": "Learning organization", "senses": [{"sense": "Develops new ideas, tests them, learns from success and failure, and assumes what worked before may not work next", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.06", "MIL.10"]}, "warrior-scholar": {"term": "Warrior-scholar", "senses": [{"sense": "A Marine who seizes the initiative to study the profession whenever and wherever the opportunity arises", "source": "MIL.10", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.10"]}, "information environment": {"term": "Information environment", "senses": [{"sense": "The global competitive space spanning the warfighting domains where all operations depend on <span class=\"t\" data-t=\"information\">information</span>, including all social, cultural, psychological, technical, and physical factors bearing on decisions", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "information advantage": {"term": "Information advantage", "senses": [{"sense": "An exploitable condition resulting from one actor's ability to generate, preserve, deny, and project <span class=\"t\" data-t=\"information\">information</span> more effectively than another", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "information warfighting function": {"term": "Information warfighting function", "senses": [{"sense": "The grouping of activities whose purpose is to create and exploit <span class=\"t\" data-t=\"information advantage\">information advantages</span> in pursuit of mission objectives", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "systems overmatch": {"term": "Systems overmatch", "senses": [{"sense": "Technical advantage of one side over another, yielding fires, <span class=\"t\" data-t=\"intelligence\">intelligence</span>, maneuver, <span class=\"t\" data-t=\"logistics\">logistics</span>, <span class=\"t\" data-t=\"force\">force</span> protection, or <span class=\"t\" data-t=\"command and control\">command and control</span> advantages", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "prevailing narrative": {"term": "Prevailing narrative", "senses": [{"sense": "The narrative that is credible and resonates most with the intended audience; a public opinion or perception advantage", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "force resiliency": {"term": "Force resiliency", "senses": [{"sense": "The ability to resist, counter, and prevail against reconnaissance, technical disruption, and malign activity such as misinformation, disinformation, and propaganda", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "information generation": {"term": "Information generation", "senses": [{"sense": "Gaining access, building awareness of threats and opportunities, holding systems at <span class=\"t\" data-t=\"risk\">risk</span>, creating the <span class=\"t\" data-t=\"information\">information</span> needed to <span class=\"t\" data-t=\"plan\">plan</span> and operate", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "information preservation": {"term": "Information preservation", "senses": [{"sense": "Protecting and defending <span class=\"t\" data-t=\"information\">information</span>, systems, networks, the historical record, and the narrative against internal and external threats", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "information denial": {"term": "Information denial", "senses": [{"sense": "Disrupting, destroying, or concealing the <span class=\"t\" data-t=\"information\">information</span> the <span class=\"t\" data-t=\"opponent\">opponent</span> needs to understand, decide, or <span class=\"t\" data-t=\"act\">act</span> in coordination", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "information projection": {"term": "Information projection", "senses": [{"sense": "Communicating, transmitting, or delivering <span class=\"t\" data-t=\"information\">information</span> of any type to inform, influence, or deceive an observer or targeted system", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "informational power": {"term": "Informational power", "senses": [{"sense": "The use of <span class=\"t\" data-t=\"information\">information</span>, narratives, and technical means to advance interests and achieve objectives", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "competition continuum": {"term": "Competition continuum", "senses": [{"sense": "The constant interaction between competitors spanning every action below and above the threshold of armed conflict; war is a form of violent competition", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "opponent": {"term": "Opponent", "senses": [{"sense": "Any actual or potential competitor, adversary, or enemy at any point on the <span class=\"t\" data-t=\"competition continuum\">competition continuum</span>", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.02", "MIL.03", "MIL.04", "MIL.07", "MIL.08", "MIL.09", "MIL.11"]}, "misinformation / disinformation": {"term": "Misinformation / disinformation", "senses": [{"sense": "False <span class=\"t\" data-t=\"information\">information</span> without deliberate intent to harm / false <span class=\"t\" data-t=\"information\">information</span> deliberately intended to cause harm or create an effect", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "thinking / non-thinking processes": {"term": "Thinking / non-thinking processes", "senses": [{"sense": "Human perception, cognition, decision, behavior / pre-programmed, hard-wired, or algorithmic processing", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "cognitive / functional component": {"term": "Cognitive / functional component", "senses": [{"sense": "The human (operator) aspect of an objective / the system's ability to function — each exploitable directly or indirectly", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "direct / indirect approach": {"term": "Direct / indirect approach", "senses": [{"sense": "<span class=\"t\" data-t=\"strength\">Strength</span> against <span class=\"t\" data-t=\"strength\">strength</span> (attrition) / <span class=\"t\" data-t=\"strength\">strength</span> against <span class=\"t\" data-t=\"critical vulnerability\">critical vulnerability</span> (maneuver)", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "command narrative": {"term": "Command narrative", "senses": [{"sense": "The story that anchors all of a unit's public communication, exercises, and operations; broader than <span class=\"t\" data-t=\"commander's intent\">commander's intent</span>; for internal and external audiences", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "nesting": {"term": "Nesting", "senses": [{"sense": "Aligning a <span class=\"t\" data-t=\"command narrative\">command narrative</span> under higher, joint, and strategic narratives, and inside existing cultural narratives", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "signature management": {"term": "Signature management", "senses": [{"sense": "Selectively altering or suppressing visual, electromagnetic, administrative, and digital emanations — a passive form of denial", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "reflexive control": {"term": "Reflexive control", "senses": [{"sense": "An information-centric theory of manipulating perception to create confusion, paralysis, or a chosen behavior in the <span class=\"t\" data-t=\"opponent\">opponent</span>", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "three warfares": {"term": "Three Warfares", "senses": [{"sense": "China's approach to competition: public opinion/media warfare, psychological warfare, legal warfare — to <span class=\"t\" data-t=\"control\">control</span> the narrative", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "volume / velocity / value": {"term": "Volume / velocity / value", "senses": [{"sense": "Quantity of <span class=\"t\" data-t=\"information\">information</span> / <span class=\"t\" data-t=\"speed\">speed</span> and direction of its movement (volume against bandwidth and noise) / contribution to the decision at hand", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}, "media literacy": {"term": "Media literacy", "senses": [{"sense": "Critical distinction between primary source, news, commentary, manipulated media, parody, satire, and opinion; a force-resiliency skill", "source": "MIL.11", "section": "KEY VOCABULARY (author)", "kind": "author"}], "appears": ["MIL.11"]}}};
</script>
<script>
(function () {
  'use strict';
  var sheets = DATA.sheets, terms = DATA.terms;
  var byId = {}; sheets.forEach(function (s) { byId[s.id] = s; });
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function store(k, v) { try { localStorage.setItem('codex.' + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem('codex.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }

  function mono(s) { var m = /MCDP\s+([\d-]+)/.exec(s.title || ''); return m ? m[1] : s.id.replace('MIL.', ''); }
  function shortTitle(s) { return (s.title || '').replace(/^MCDP\s+[\d-]+\s*[—–-]?\s*/, ''); }
  function plainText(h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }

  /* ---------- history ---------- */
  var hist = [], hpos = -1;
  function push(state) {
    if (hpos >= 0 && JSON.stringify(hist[hpos]) === JSON.stringify(state)) return;
    hist = hist.slice(0, hpos + 1); hist.push(state); hpos = hist.length - 1; syncNav();
  }
  function go(state) {
    if (state.type === 'sheet') showSheet(state.id, state.tab, true);
    else if (state.type === 'term') showTerm(state.key, true);
  }
  function back() { if (hpos > 0) { hpos--; go(hist[hpos]); syncNav(); } }
  function fwd() { if (hpos < hist.length - 1) { hpos++; go(hist[hpos]); syncNav(); } }
  function syncNav() { $('back').disabled = hpos <= 0; $('fwd').disabled = hpos >= hist.length - 1; }

  /* ---------- outliner ---------- */
  var HK = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-'];
  var pins = load('pins', []);
  function renderOutliner() {
    var h = '<div class="o-label">Publications</div>';
    sheets.forEach(function (s, i) {
      h += '<button class="o-row" data-id="' + s.id + '" type="button"><span class="mono-g">' + esc(mono(s)) + '</span><span class="t-name">' + esc(shortTitle(s)) + '</span><span class="hk">' + (HK[i] || '') + '</span></button>';
    });
    h += '<div class="o-pins"><div class="o-label">Pinned terms</div>';
    if (!pins.length) h += '<div class="o-empty">Pin a term from its entry.</div>';
    pins.forEach(function (k) {
      var t = terms[k]; if (!t) return;
      h += '<div class="o-pin" data-k="' + esc(k) + '"><span class="t" data-t="' + esc(k) + '">' + esc(t.term) + '</span><button type="button" data-unpin="' + esc(k) + '" title="Unpin">×</button></div>';
    });
    h += '</div>';
    $('outliner').innerHTML = h;
    markActive();
  }
  function markActive() {
    var rows = $('outliner').querySelectorAll('.o-row');
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('active', rows[i].getAttribute('data-id') === current);
  }
  $('outliner').addEventListener('click', function (e) {
    var un = e.target.closest('[data-unpin]');
    if (un) { pins = pins.filter(function (k) { return k !== un.getAttribute('data-unpin'); }); store('pins', pins); renderOutliner(); return; }
    var r = e.target.closest('.o-row'); if (r) { showSheet(r.getAttribute('data-id')); }
  });

  /* ---------- the sheet ---------- */
  var current = null, currentTab = load('tab', 'concepts');
  var TABS = [['concepts', 'Core concepts'], ['vocab', 'Key vocabulary'], ['quotes', 'Quotes'], ['application', 'Application'], ['check', 'Self-check'], ['not', 'What does not work']];

  function citedBy(s) {
    return sheets.filter(function (o) { return o.id !== s.id && o.related.some(function (r) { return r.indexOf(s.id) >= 0; }); });
  }
  function definesUsedElsewhere(s) {
    var out = [];
    s.vocabulary.forEach(function (v) {
      var t = terms[v.term.toLowerCase()]; if (!t) return;
      var others = t.appears.filter(function (id) { return id !== s.id; });
      if (others.length) out.push({ term: t.term, key: v.term.toLowerCase(), n: others.length });
    });
    return out.sort(function (a, b) { return b.n - a.n; }).slice(0, 12);
  }

  function showSheet(id, tab, silent) {
    var s = byId[id]; if (!s) return;
    current = id; if (tab) currentTab = tab;
    store('sheet', id);
    var checks = load('check.' + id, {});
    var h = '';
    h += '<div class="identity"><div class="portrait">' + esc(mono(s)) + '</div><div>';
    h += '<div class="eyebrow">' + esc(s.id) + ' · ' + esc(s.bvx_id) + ' · ' + esc(s.domain || 'MILITARY DOCTRINE') + '</div>';
    h += '<h1 class="title">' + esc(s.title) + '</h1>';
    h += '<p class="thesis">' + s.thesis + '</p>';
    h += '<div class="ageline"><span><b>' + esc(s.author) + '</b></span><span>' + esc(s.year) + (s.edition ? ' · ' + esc(s.edition) : '') + '</span><span>' + s.marks.length + ' reader marks</span></div>';
    h += '</div></div>';

    h += '<div class="row-label"><h2>Invariants</h2><span class="n">' + s.invariants.length + '</span><span class="hint">hover a badge for the full statement</span></div><div class="traits">';
    s.invariants.forEach(function (inv, i) {
      h += '<button class="trait" type="button" data-inv="' + i + '"><span class="sq">I' + (i + 1) + '</span><span>' + inv.lead + '</span></button>';
    });
    h += '</div>';

    h += '<div class="row-label"><h2>Heuristics</h2><span class="n">' + s.heuristics.length + '</span><span class="hint">hover for do this / not this</span></div><div class="skills">';
    s.heuristics.forEach(function (r, i) {
      h += '<button class="skill" type="button" data-heur="' + i + '"><i>▸</i>' + r.situation + '</button>';
    });
    h += '</div>';

    h += '<div class="tabs">';
    TABS.forEach(function (t) {
      var n = { concepts: s.concepts.length, vocab: s.vocabulary.length, quotes: s.quotes.length, application: s.application.length, check: s.selfcheck.length, not: '' }[t[0]];
      h += '<button class="tab' + (t[0] === currentTab ? ' active' : '') + '" type="button" data-tab="' + t[0] + '">' + t[1] + (n !== '' ? '<span class="n">' + n + '</span>' : '') + '</button>';
    });
    h += '</div>';

    h += '<div class="pane" data-pane="concepts"' + (currentTab !== 'concepts' ? ' hidden' : '') + '>';
    s.concepts.forEach(function (c, i) { h += '<div class="concept"><h3>' + (i + 1) + '. ' + c.title + '</h3><p>' + c.body + '</p></div>'; });
    h += '</div>';

    h += '<div class="pane" data-pane="vocab"' + (currentTab !== 'vocab' ? ' hidden' : '') + '><table class="vtable"><tr><th>Term</th><th>Definition in this publication</th></tr>';
    s.vocabulary.forEach(function (v) { h += '<tr><td><span class="t" data-t="' + esc(v.term.toLowerCase()) + '">' + esc(v.term) + '</span></td><td>' + v.definition + '</td></tr>'; });
    h += '</table></div>';

    h += '<div class="pane" data-pane="quotes"' + (currentTab !== 'quotes' ? ' hidden' : '') + '>';
    s.quotes.forEach(function (q, i) {
      h += '<blockquote class="q"' + (i >= 6 ? ' data-over="1" hidden' : '') + '><p>“' + q.quote + '”</p>' + (q.caption ? '<span class="cap">' + q.caption + '</span>' : '') + '</blockquote>';
    });
    if (s.quotes.length > 6) h += '<button class="more" type="button" data-more="quotes">' + (s.quotes.length - 6) + ' more</button>';
    h += '</div>';

    h += '<div class="pane" data-pane="application"' + (currentTab !== 'application' ? ' hidden' : '') + '>';
    s.application.forEach(function (a) { h += '<p class="app-item">' + (a.lead ? '<b>' + a.lead + '</b> ' : '') + a.body + '</p>'; });
    h += '</div>';

    var done = s.selfcheck.filter(function (_, i) { return checks[i]; }).length;
    var signed = done - (s.selfcheck.length - done);
    h += '<div class="pane" data-pane="check"' + (currentTab !== 'check' ? ' hidden' : '') + '>';
    h += '<div class="check-head"><span class="signed ' + (signed > 0 ? 'pos' : signed < 0 ? 'neg' : 'zero') + '" id="signed">' + (signed > 0 ? '+' : '') + signed + '</span><span class="hint">' + done + ' of ' + s.selfcheck.length + ' held · checked minus unchecked</span></div>';
    s.selfcheck.forEach(function (c, i) {
      h += '<label class="check' + (checks[i] ? ' on' : '') + '"><input type="checkbox" data-chk="' + i + '"' + (checks[i] ? ' checked' : '') + '><span>' + c + '</span></label>';
    });
    if (s.selfcheck_note) h += '<div class="check-note">' + s.selfcheck_note + '</div>';
    h += '</div>';

    h += '<div class="pane" data-pane="not"' + (currentTab !== 'not' ? ' hidden' : '') + '><div class="redlist">';
    splitRed(s.doesnt_work).forEach(function (x) { h += '<div class="red"><i>−</i><span>' + x + '</span></div>'; });
    h += '</div></div>';

    var cb = citedBy(s), du = definesUsedElsewhere(s);
    h += '<div class="cited"><div class="row-label"><h2>Cited by</h2><span class="n">' + cb.length + '</span></div><div class="list">';
    cb.forEach(function (o) { h += '<button class="chip" type="button" data-open="' + o.id + '"><span class="g">' + esc(mono(o)) + '</span>' + esc(shortTitle(o)) + '</button>'; });
    if (!cb.length) h += '<span class="o-empty">No other sheet lists this one as related.</span>';
    h += '</div>';
    if (du.length) {
      h += '<div class="row-label"><h2>Terms defined here, used elsewhere</h2><span class="n">' + du.length + '</span></div><div class="list">';
      du.forEach(function (d) { h += '<button class="chip" type="button" data-term="' + esc(d.key) + '"><span class="g">' + d.n + '</span>' + esc(d.term) + '</button>'; });
      h += '</div>';
    }
    if (s.feeds && s.feeds.length) {
      h += '<div class="row-label"><h2>Feeds the operation</h2><span class="n">' + s.feeds.length + '</span></div><div class="list">';
      s.feeds.forEach(function (f) { h += '<span class="chip feed" title="' + esc(f.note || '') + '"><span class="g">' + esc(f.strength || '') + '</span>' + esc(f.layer || '') + (f.variable ? ' · ' + esc(f.variable) : '') + '</span>'; });
      h += '</div>';
    }
    h += '</div>';

    $('sheetBody').innerHTML = h;
    $('sheet').scrollTop = 0;
    markActive();
    if (!silent) push({ type: 'sheet', id: id, tab: currentTab });
    document.title = s.title + ' · WARROOM';
  }
  function splitRed(text) {
    var t = plainText(text).replace(/\.$/, '');
    return t.split(/,\s+|;\s+/).map(function (x) { return x.trim(); }).filter(Boolean).map(esc);
  }

  $('sheetBody').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (tab) {
      currentTab = tab.getAttribute('data-tab'); store('tab', currentTab);
      var tabs = $('sheetBody').querySelectorAll('.tab'); for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i] === tab);
      var panes = $('sheetBody').querySelectorAll('.pane'); for (var j = 0; j < panes.length; j++) panes[j].hidden = panes[j].getAttribute('data-pane') !== currentTab;
      if (hpos >= 0 && hist[hpos].type === 'sheet') hist[hpos].tab = currentTab;
      return;
    }
    var more = e.target.closest('[data-more]');
    if (more) { var over = $('sheetBody').querySelectorAll('[data-over]'); for (var k = 0; k < over.length; k++) over[k].hidden = false; more.remove(); return; }
    var open = e.target.closest('[data-open]');
    if (open) { showSheet(open.getAttribute('data-open')); return; }
    var tm = e.target.closest('[data-term]');
    if (tm) { showTerm(tm.getAttribute('data-term')); return; }
    var chk = e.target.closest('[data-chk]');
    if (chk) {
      var st = load('check.' + current, {}); st[chk.getAttribute('data-chk')] = chk.checked; store('check.' + current, st);
      chk.closest('.check').classList.toggle('on', chk.checked);
      var s = byId[current], done = s.selfcheck.filter(function (_, i) { return st[i]; }).length, signed = done - (s.selfcheck.length - done);
      var el = $('signed'); el.textContent = (signed > 0 ? '+' : '') + signed; el.className = 'signed ' + (signed > 0 ? 'pos' : signed < 0 ? 'neg' : 'zero');
      el.nextElementSibling.textContent = done + ' of ' + s.selfcheck.length + ' held · checked minus unchecked';
      return;
    }
  });

  /* ---------- tooltips (CK3 contract: hover opens, nest to depth 3, lock by timer or key, Esc closes) ---------- */
  var tips = [], showTimer = null, hideTimer = null, lockTimer = null;
  function tipTerm(key, depth) {
    var t = terms[key]; if (!t) return '';
    var h = '<div class="th"><b>' + esc(t.term) + '</b><span class="lock">hover 1.5 s or Space to lock</span></div>';
    t.senses.slice(0, 3).forEach(function (x) {
      var s = byId[x.source];
      h += '<div class="sense"><span class="g' + (x.kind === 'reader' ? ' reader' : '') + '" title="' + esc(x.kind === 'reader' ? 'reader mark, ' + x.source : 'author definition, ' + x.source) + '">' + esc(s ? mono(s) : x.source) + '</span><span>' + (depth < 3 ? x.sense : plainText(x.sense)) + '</span></div>';
    });
    if (t.senses.length > 3) h += '<div class="sense"><span class="g">+' + (t.senses.length - 3) + '</span><span class="o-empty" style="padding:0">more senses in the glossary</span></div>';
    if (t.appears.length) {
      h += '<div class="appears"><span class="lab">appears in</span>';
      t.appears.forEach(function (id) { var s = byId[id]; if (s) h += '<span class="g" data-open="' + id + '" title="' + esc(s.title) + '">' + esc(mono(s)) + '</span>'; });
      h += '</div>';
    }
    h += '<span class="openg" data-term="' + esc(key) + '">Open in glossary →</span>';
    return h;
  }
  function tipInv(i) {
    var inv = byId[current].invariants[i]; if (!inv) return '';
    return '<div class="th"><b>I' + (i + 1) + ' · ' + plainText(inv.lead) + '</b><span class="lock">Space locks</span></div><p class="why">' + inv.body + '</p>';
  }
  function tipHeur(i) {
    var r = byId[current].heuristics[i]; if (!r) return '';
    return '<div class="th"><b>' + plainText(r.situation) + '</b><span class="lock">Space locks</span></div><p class="why"><b class="do">Do this</b>' + r.do + '<b class="not">Not this</b>' + r.not + '</p>';
  }
  function openTip(anchor, html, depth) {
    closeTipsFrom(depth);
    var el = document.createElement('div');
    el.className = 'tip'; el.setAttribute('data-depth', depth); el.innerHTML = html; el.tabIndex = -1;
    document.body.appendChild(el);
    var r = anchor.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
    var x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var y = r.bottom + 6; if (y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 6);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    tips.push({ el: el, anchor: anchor, locked: false });
    anchor.classList.add('open');
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () { lockTop(); }, 1500);
    el.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
    el.addEventListener('mouseleave', function () { scheduleHide(); });
    el.addEventListener('click', function (e) {
      var o = e.target.closest('[data-open]'); if (o) { closeTipsFrom(0); showSheet(o.getAttribute('data-open')); return; }
      var t = e.target.closest('[data-term]'); if (t) { closeTipsFrom(0); showTerm(t.getAttribute('data-term')); return; }
      var tt = e.target.closest('.t'); if (tt) { closeTipsFrom(0); showTerm(tt.getAttribute('data-t')); }
    });
  }
  function lockTop() { if (!tips.length) return; var top = tips[tips.length - 1]; top.locked = true; top.el.classList.add('locked'); top.el.querySelector('.lock').textContent = 'locked · Esc closes'; }
  function closeTipsFrom(depth) {
    while (tips.length > depth) { var t = tips.pop(); t.el.remove(); t.anchor.classList.remove('open'); }
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      for (var i = tips.length - 1; i >= 0; i--) { if (tips[i].locked) break; var t = tips.pop(); t.el.remove(); t.anchor.classList.remove('open'); }
    }, 220);
  }
  function depthOf(el) { var tip = el.closest('.tip'); return tip ? parseInt(tip.getAttribute('data-depth'), 10) + 1 : 0; }
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest('.t, .trait, .skill'); if (!a) return;
    clearTimeout(hideTimer); clearTimeout(showTimer);
    var depth = depthOf(a);
    if (depth > 3) return;
    showTimer = setTimeout(function () {
      var html = a.classList.contains('t') ? tipTerm(a.getAttribute('data-t'), depth) : a.hasAttribute('data-inv') ? tipInv(+a.getAttribute('data-inv')) : tipHeur(+a.getAttribute('data-heur'));
      if (html) openTip(a, html, depth);
      hlPin(a.classList.contains('t') ? a.getAttribute('data-t') : null);
    }, 140);
  });
  document.addEventListener('mouseout', function (e) {
    var a = e.target.closest('.t, .trait, .skill'); if (!a) return;
    clearTimeout(showTimer); scheduleHide(); hlPin(null);
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('.tip')) return;
    var t = e.target.closest('.t');
    if (t) { e.preventDefault(); closeTipsFrom(0); showTerm(t.getAttribute('data-t')); return; }
    if (!e.target.closest('.trait, .skill')) closeTipsFrom(0);
  });
  function hlPin(key) {
    var rows = $('outliner').querySelectorAll('.o-pin'); for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('hl', !!key && rows[i].getAttribute('data-k') === key);
  }

  /* ---------- glossary ---------- */
  var keys = Object.keys(terms).sort(function (a, b) { return terms[a].term.toLowerCase().localeCompare(terms[b].term.toLowerCase()); });
  var gFilter = load('gcat', 'all'), gQuery = '', gHist = load('ghist', []), gOpen = null;
  function renderCats() {
    var h = '<button class="cat' + (gFilter === 'all' ? ' on' : '') + '" data-cat="all" type="button">all</button><button class="cat' + (gFilter === 'reader' ? ' on' : '') + '" data-cat="reader" type="button">reader marks</button>';
    sheets.forEach(function (s) { h += '<button class="cat' + (gFilter === s.id ? ' on' : '') + '" data-cat="' + s.id + '" type="button" title="' + esc(s.title) + '">' + esc(mono(s)) + '</button>'; });
    $('gCats').innerHTML = h;
  }
  function filtered() {
    var q = gQuery.trim().toLowerCase();
    return keys.filter(function (k) {
      var t = terms[k];
      if (gFilter === 'reader' && !t.senses.some(function (x) { return x.kind === 'reader'; })) return false;
      if (gFilter !== 'all' && gFilter !== 'reader' && !t.senses.some(function (x) { return x.source === gFilter; }) && t.appears.indexOf(gFilter) < 0) return false;
      if (q && k.indexOf(q) < 0 && !t.senses.some(function (x) { return plainText(x.sense).toLowerCase().indexOf(q) >= 0; })) return false;
      return true;
    });
  }
  function renderList() {
    var f = filtered();
    $('gCount').textContent = f.length + ' / ' + keys.length;
    var h = '<div class="g-list">';
    f.slice(0, 400).forEach(function (k) {
      var t = terms[k], reader = t.senses.some(function (x) { return x.kind === 'reader'; });
      var srcs = []; t.senses.forEach(function (x) { var s = byId[x.source]; var m = s ? mono(s) : x.source; if (srcs.indexOf(m) < 0) srcs.push(m); });
      h += '<div class="g-row' + (k === gOpen ? ' on' : '') + '" data-k="' + esc(k) + '"><span>' + esc(t.term) + '</span><span class="srcs' + (reader ? ' reader' : '') + '">' + esc(srcs.slice(0, 4).join(' ')) + (srcs.length > 4 ? ' +' + (srcs.length - 4) : '') + '</span></div>';
    });
    if (f.length > 400) h += '<div class="g-count">' + (f.length - 400) + ' more · narrow the search</div>';
    h += '</div>';
    $('gBody').innerHTML = h;
  }
  function renderHist() {
    var h = ''; gHist.slice(-6).reverse().forEach(function (k) { if (terms[k]) h += '<button class="hh" type="button" data-k="' + esc(k) + '">' + esc(terms[k].term) + '</button>'; });
    $('gHist').innerHTML = h;
  }
  function showTerm(key, silent) {
    var t = terms[key]; if (!t) return;
    gOpen = key;
    gHist = gHist.filter(function (k) { return k !== key; }); gHist.push(key); if (gHist.length > 12) gHist.shift(); store('ghist', gHist);
    var pinned = pins.indexOf(key) >= 0;
    var h = '<div class="g-entry"><h2>' + esc(t.term) + '</h2><div class="meta"><span>' + t.senses.length + ' sense' + (t.senses.length === 1 ? '' : 's') + ' · appears in ' + t.appears.length + '</span><button type="button" data-pin="' + esc(key) + '">' + (pinned ? 'unpin' : 'pin to outliner') + '</button><button type="button" data-list="1">← list</button></div>';
    t.senses.forEach(function (x) {
      var s = byId[x.source];
      h += '<div class="sense"><span class="g' + (x.kind === 'reader' ? ' reader' : '') + '" data-open="' + esc(x.source) + '" title="' + esc(s ? s.title : x.source) + '">' + esc(s ? mono(s) : x.source) + '</span><span>' + x.sense + '<span class="kind">' + (x.kind === 'reader' ? 'reader mark · ' + esc(x.section) : 'author definition · key vocabulary') + '</span></span></div>';
    });
    if (t.appears.length) {
      h += '<div class="appears"><span class="lab">appears in</span><div class="list">';
      t.appears.forEach(function (id) { var s = byId[id]; if (s) h += '<button class="chip" type="button" data-open="' + id + '"><span class="g">' + esc(mono(s)) + '</span>' + esc(shortTitle(s)) + '</button>'; });
      h += '</div></div>';
    }
    h += '</div>';
    $('gBody').innerHTML = h;
    renderHist();
    if (!silent) push({ type: 'term', key: key });
  }
  $('gBody').addEventListener('click', function (e) {
    var row = e.target.closest('.g-row'); if (row) { showTerm(row.getAttribute('data-k')); return; }
    var o = e.target.closest('[data-open]'); if (o) { showSheet(o.getAttribute('data-open')); return; }
    var p = e.target.closest('[data-pin]');
    if (p) { var k = p.getAttribute('data-pin'); if (pins.indexOf(k) >= 0) pins = pins.filter(function (x) { return x !== k; }); else pins.push(k); store('pins', pins); renderOutliner(); showTerm(k, true); return; }
    if (e.target.closest('[data-list]')) { gOpen = null; renderList(); }
  });
  $('gCats').addEventListener('click', function (e) { var c = e.target.closest('.cat'); if (!c) return; gFilter = c.getAttribute('data-cat'); store('gcat', gFilter); renderCats(); gOpen = null; renderList(); });
  $('gHist').addEventListener('click', function (e) { var b = e.target.closest('.hh'); if (b) showTerm(b.getAttribute('data-k')); });
  $('gSearch').addEventListener('input', function () { gQuery = this.value; gOpen = null; renderList(); });

  /* ---------- keys + theme ---------- */
  document.addEventListener('keydown', function (e) {
    var inField = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Escape') { closeTipsFrom(0); if (inField) document.activeElement.blur(); return; }
    if (e.altKey && !e.ctrlKey && !e.metaKey) { var i = HK.indexOf(e.key); if (i >= 0 && sheets[i]) { e.preventDefault(); showSheet(sheets[i].id); } return; }
    if (inField) return;
    if (e.key === '/') { e.preventDefault(); $('gSearch').focus(); $('gSearch').select(); return; }
    if (e.key === ' ' || e.key === 'Enter') { if (tips.length) { e.preventDefault(); lockTop(); } return; }
    if (e.key === 'b' || e.key === 'B' || e.key === 'Backspace') { e.preventDefault(); back(); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); fwd(); return; }
  });
  $('back').addEventListener('click', back); $('fwd').addEventListener('click', fwd);
  var themeState = load('theme', 'system');
  function applyTheme() { if (themeState === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', themeState); $('theme').textContent = { system: 'auto', dark: 'night · dark room', light: 'day · lit room' }[themeState]; }
  var contrastState = load('contrast', 'standard');
  function applyContrast() { if (contrastState === 'standard') document.documentElement.removeAttribute('data-contrast'); else document.documentElement.setAttribute('data-contrast', contrastState); $('contrast').textContent = 'contrast · ' + contrastState; }
  $('contrast').addEventListener('click', function () { contrastState = contrastState === 'standard' ? 'soft' : contrastState === 'soft' ? 'high' : 'standard'; store('contrast', contrastState); applyContrast(); });
  $('theme').addEventListener('click', function () { themeState = themeState === 'system' ? 'dark' : themeState === 'dark' ? 'light' : 'system'; store('theme', themeState); applyTheme(); });
  window.addEventListener('resize', function () { closeTipsFrom(0); });

  /* ---------- boot ---------- */
  applyTheme(); applyContrast();
  renderOutliner(); renderCats(); renderList(); renderHist();
  showSheet(load('sheet', sheets[0].id));
})();
</script>
