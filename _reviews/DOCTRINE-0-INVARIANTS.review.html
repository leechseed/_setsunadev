<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Desk</title>
<style>
:root{--bg:#141016;--card:#1d1721;--line:#33283a;--tx:#e9e2ec;--mu:#9a8fa3;--or:#FF5A1F;--ok:#3fbf7f;--no:#e0455a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0f0b11;border-bottom:2px solid var(--or);z-index:2}
header b{color:var(--or)}header span{color:var(--mu);font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:var(--or);color:#141016;border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-bottom:6px}
@media(max-width:760px){.row{grid-template-columns:1fr}}
.p{white-space:pre-wrap;word-wrap:break-word;padding:4px 0}.p.tb{font:13px/1.4 ui-monospace,Consolas,monospace;overflow-x:auto;white-space:pre;color:var(--mu)}
mark{background:#FF5A1F33;color:var(--tx);border-bottom:2px solid var(--or);padding:0 2px}
del{color:var(--no)}ins{color:var(--ok);text-decoration:none}sup{color:var(--or);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--or);border-radius:8px;padding:12px;margin-bottom:10px}
.card.accept{border-left-color:var(--ok)}.card.reject{border-left-color:var(--no)}
.id{color:var(--or);font-weight:700;font-size:13px}.q{color:var(--mu);font-size:13px;margin:4px 0}
.ed{font-size:14px;margin:6px 0}.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;min-height:40px;background:#2a2030;color:var(--tx);border:1px solid var(--line)}
.btns .a.on{background:var(--ok);color:#0b1a12}.btns .r.on{background:var(--no);color:#fff}
</style></head><body>
<header><b>REVIEW DESK</b><span id="n">DOCTRINE-0-INVARIANTS</span><button id="x">Export decisions</button></header>

<script>
var B=[{"html": "---\nrung: policy \u00b7 NASA four, ruled 2026-09-15 (BOLO 50)\ntitle: DOCTRINE 0 \u2014 Touchstones on Touchstones (was Invariants on Invariants)\ntype: doctrine\ntrunk: BOTH\nstatus: v1.0 \u2014 RATIFIED 2026-09-03 (Chief, spoken: &quot;doctrine zero is good&quot;). <mark data-c=\"c1\">The seven stand. The rename ruling CLOSED 2026-09-24: <b>Touchstone<\/b><\/mark><sup>c1<\/sup> (Chief: &quot;call it the Touchstone&quot;) \u2014 ratification covers the rules, not the name\nupdated: 2026-09-24\nsources: Quartermaster promotion rule \u00b7 BVX-LEARN one-sheet Invariants field (20+ sets) \u00b7 Layer 0 Invariants 1\u20135 \u00b7 VICTORIA_MIDNIGHT ingest \u00a79 \u00b7 Non-Negotiable Invariants method (Arcane, Westworld) \u00b7 SSOT Writing Guide \u2014 Marine Corps Doctrine Standard v1.0.0 (2026-02-09)\nrelated: BVX-ULTRASIN-twin-track.md\n---", "ids": ["c1"], "table": false}, {"html": "# DOCTRINE 0 \u2014 TOUCHSTONES ON TOUCHSTONES <sup>c2<\/sup>", "ids": ["c2"], "table": false}, {"html": "*Formerly &quot;Invariants on Invariants.&quot; The name ruled 2026-09-24; see \u00a73.*", "ids": [], "table": false}, {"html": "This is the doctrine that governs the doctrine. Before the MCDP-shaped stack acquires its own capstone, the system requires rules for what qualifies as a rule. These are the invariants about invariants. Step one of the doctrine project.", "ids": [], "table": false}, {"html": "<mark data-c=\"c3\">Written to the Marine Corps Doctrine Standard: declarative, no hedging. States states.<\/mark><sup>c3<\/sup>", "ids": ["c3"], "table": false}, {"html": "---", "ids": [], "table": false}, {"html": "## 1 \u00b7 The seven", "ids": [], "table": false}, {"html": "<b>I. An invariant is earned, not declared.<\/b><sup>c4<\/sup>\nTwo concrete uses before promotion \u2014 the Quartermaster rule, already canon. A rule proposed at the moment of its first use is a hypothesis. The system promotes; the author does not anoint.", "ids": ["c4"], "table": false}, {"html": "<b>II. An invariant exists only in writing.<\/b>\nInherited from the registry rule: a decision that is not written down did not happen. An invariant held in memory is a mood the author is currently in.", "ids": [], "table": false}, {"html": "<b>III. An invariant names what it forbids.<\/b>\nEvery invariant is falsifiable in-scene: it points at a concrete thing that can no longer occur. An invariant that forbids nothing constrains nothing, and a constraint that constrains nothing is decoration.", "ids": [], "table": false}, {"html": "<b>IV. An invariant holds at every scale.<\/b>\nLine, scene, movement, series \u2014 sentence, document, system. This is the validation method already proven against *Arcane* and *Westworld*: coherence is the invariant surviving zoom. <mark data-c=\"c5\">A rule true at only one altitude is a local convention, and is filed as one.<\/mark><sup>c5<\/sup>", "ids": ["c5"], "table": false}, {"html": "<b>V. An invariant names its derivation.<\/b>\nEvery invariant carries a Derived From \u2014 the source, ruling, or observed pattern it was promoted out of. The VICTORIA_MIDNIGHT ingest already enforces this at \u00a79. An invariant with no lineage cannot be audited, and what cannot be audited cannot be trusted at scale.", "ids": [], "table": false}, {"html": "<b>VI. Invariants are few.<\/b><sup>c6<\/sup>\nA layer holding more than seven is holding preferences. Scarcity is the enforcement mechanism: each promotion past the seventh demands a demotion or a merger. The count is the quality gate.", "ids": ["c6"], "table": false}, {"html": "<b>VII. An invariant dies by countermand, never by neglect.<\/b>\nDemotion is explicit, dated, and written \u2014 the standing-order logic. A quietly violated invariant is not a revision; it is a breach, and it invalidates every downstream document that trusted it.", "ids": [], "table": false}, {"html": "---", "ids": [], "table": false}, {"html": "## 2 \u00b7 The existing corpus (census, 2026-08-21) <sup>c7<\/sup>", "ids": ["c7"], "table": false}, {"html": "The term is already load-bearing across the repo. Nothing below is new; this doc federates it.", "ids": [], "table": false}, {"html": "| Corpus | What it holds | Where |\n|---|---|---|\n| <b>Layer 0 Invariants 1\u20135<\/b> | Story-world physics: Ontology \u00b7 Causality \u00b7 Time/Accumulation \u00b7 Irreversibility/Cost \u00b7 Entropy/Decay \u2014 all Locked | Joplin sync vault |\n| <b>Narrative invariants (per character)<\/b> | 4 defined for Tori, validated 2.7 PASS; schema field `narrative_invariant` | `_OXO_SCHOOL_HANDOFF/sources/VICTORIA_MIDNIGHT_*` |\n| <b>Six Movements invariants<\/b> | One per movement: Equity \u00b7 Constraint \u00b7 Power \u00b7 The Ban \u00b7 Inequity \u00b7 Collapse | `_OXO_SCHOOL_HANDOFF/sources/SIX_MOVEMENTS_OF_RADICALIZATION.md` |\n| <b>Institutional Invariants (Ecclesial Laws)<\/b> | The Administration&#x27;s fixed laws | `_OXO_SCHOOL_HANDOFF/sources/THE_ADMINISTRATION.md` |\n| <b>Invariants of Power (KLK)<\/b> | Series-bible power framework | `_OXO_SCHOOL_HANDOFF/sources/SERIES_BIBLE_UPDATED.md` \u00a74 |\n| <b>Non-Negotiable Invariants extractions<\/b> | The method applied to reference media (*Arcane*, *Westworld*) \u2014 proof of Invariant IV | Joplin sync vault |\n| <b>BVX-LEARN one-sheet field<\/b> | 20+ extracted invariant sets, one field per source | `_0.1_BVX_LEARN/KNOWLEDGE_AREAS/` |\n| <b>Quartermaster promotion rule<\/b> | The 2+ uses gate \u2014 source of Invariant I | Twin-track doc \u00a7Doctrinal spine |", "ids": [], "table": true}, {"html": "---", "ids": [], "table": false}, {"html": "## 3 \u00b7 The name \u2014 RULED: Touchstone", "ids": [], "table": false}, {"html": "<b>RULED 2026-09-24, Chief: &quot;call it the Touchstone.&quot;<\/b> The name is <b>Touchstone<\/b> (plural Touchstones; cite as <b>TS 1:3<\/b>, book:number). Chief&#x27;s brief on the way there: it transcends every layer, both BLACK and ORANGE; it guides rather than commands (&quot;more of an axiom \u2026 not necessarily an obeying \u2026 it opens up the opportunity&quot;); common vernacular, not heady; spirit, not a catchphrase \u2014 &quot;that thing they slap on the way out of the locker&quot; (Notre Dame&#x27;s PLAY LIKE A CHAMPION TODAY sign). A touchstone is both the thing you touch before you go out and the stone goldsmiths tested gold against. <mark data-c=\"c8\">The bench below stands as history.<\/mark><sup>c8<\/sup> Machine fields keep the old term until the schema propagation runs (the constraint at the end of this section), which now rides BOLO 81, built last.", "ids": ["c8"], "table": false}, {"html": "&quot;Invariant&quot; is doing the work but the word is disliked. Chief&#x27;s spec (2026-08-21): not a saying, not a motto \u2014 the way a unit conducts itself; the purpose and reason a unit exists. Doctrine splits that into <b>two slots<\/b>: the rule that never changes (tenet / general order) and the identity-and-purpose of the unit (ethos / mission / intent). The ruling may fill both.", "ids": [], "table": false}, {"html": "| Candidate | Slot | Register | Case |\n|---|---|---|---|\n| <b>Tenet<\/b> \u2b50 | rule | Doctrinal | The actual term for a permanent operating truth inside a doctrine (&quot;tenets of maneuver warfare&quot;). &quot;The Seven Tenets&quot; reads as doctrine. <del>Strongest pure rename.<\/del> <ins>Lost to Touchstone, 9/24.<\/ins><sup>c9<\/sup> |\n| <b>Ethos<\/b> \u2b50 | set/identity | Doctrinal (warrior ethos) | The way a unit conducts itself because of what it is \u2014 the concept Chief described. Works as the name for the *set*: each rule a Tenet, the whole an Ethos. |\n| <b>Commander&#x27;s Intent<\/b> | identity | Doctrinal | The purpose that survives contact \u2014 plans die, intent endures. Precisely the invariant-vs-content relation. Two words, role-bound. |\n| <b>General Order<\/b> | rule | Marine | Memorized, universal, never changes \u2014 fixes the standing-order objection (standing orders get countermanded; the eleven General Orders do not). |\n| <b>Standing Order<\/b> | rule | Marine | Remains in effect until countermanded \u2014 Invariant VII for free. Chief&#x27;s objection: implies eventual change. |\n| <b>Creed<\/b> | identity | Marine (Rifleman&#x27;s Creed) | Identity stated as operating truths. Saying-adjacent \u2014 Chief excluded sayings. |\n| <b>Covenant<\/b> | rule/identity | Ecclesial | Fits The Administration&#x27;s Ecclesial Laws register; a binding that defines both parties and does not expire. |\n| <b>Mandate<\/b> | identity | Institutional | The reason-for-existing word. Clean noun, corporate at the edges. |\n| <b>Law<\/b> | rule | Ecclesial | Precedent exists (Ecclesial Laws). Collides with legal-layer language in the twin-track ruling. |", "ids": ["c9"], "table": true}, {"html": "<b>Constraint on the ruling:<\/b> machine fields (`narrative_invariant`, one-sheet `Invariants:`) keep the old term until schema-propagation decision #3 executes \u2014 renaming prose and schema in separate moments forks the SSOT. One ruling, one propagation pass.", "ids": [], "table": false}, {"html": "---", "ids": [], "table": false}, {"html": "## 4 \u00b7 MCDP acquisition status (feeds BVX-LEARN)", "ids": [], "table": false}, {"html": "<mark data-c=\"c10\">Ledger item 3 on the twin-track doc: <b>approved 2026-08-21.<\/b><\/mark><sup>c10<\/sup> The publications take the next ID block after BVX.1107 (Minto) when catalogued.", "ids": ["c10"], "table": false}, {"html": "Inbox: `Desktop\\_BVX_INBOX\\mcdp\\` (outside the public repo, standard intake pattern).", "ids": [], "table": false}, {"html": "| Pub | Status |\n|---|---|\n| MCDP 1 Warfighting | \u2705 in inbox \u2014 <b>read first, the capstone<\/b> |\n| MCDP 1-2 Campaigning | \u2705 in inbox |\n| MCDP 1-3 Tactics | \u2705 in inbox |\n| MCDP 5 Planning | \u2705 in inbox |\n| MCDP 1-1 Strategy \u00b7 2 Intelligence \u00b7 3 Expeditionary Ops \u00b7 4 Logistics \u00b7 6 Command &amp; Control \u00b7 7 Learning \u00b7 8 Information | \u2b1c pending \u2014 marines.mil blocks scripted clients (Akamai) and archive.org was degraded at acquisition time. <mark data-c=\"c11\">Grab-in-browser manifest: marines.mil \u2192 Publications \u2192 Doctrinal. Drop into the inbox; the catalog pass picks them up.<\/mark><sup>c11<\/sup> |", "ids": ["c11"], "table": true}, {"html": "Knowledgebase summaries of most MCDPs already exist in the Joplin vault (`.ASTRO7EX.SYNC.JOPLIN/`) \u2014 summaries are not sources. The PDFs are the sources.", "ids": [], "table": false}, {"html": "---", "ids": [], "table": false}],C={"c1": {"id": "c1", "text": "The status line holds four facts in one sentence. Split it: ratified (9/3), renamed (9/24), what the rename covers, what it does not.", "span": "The seven stand. The rename ruling CLOSED 2026-09-24: **Touchstone**", "old": null, "new": null}, "c2": {"id": "c2", "text": "The title says Touchstone. Every rule in section 1 still says \"invariant\". Chief ruled the prose may change; only machine fields keep the old term. Rename the prose, or say why not.", "span": "", "old": null, "new": null}, "c3": {"id": "c3", "text": "\"States states\" reads as a typo. It may be a joke. Pick one: cut it, or explain it in half a line.", "span": "Written to the Marine Corps Doctrine Standard: declarative, no hedging. States states.", "old": null, "new": null}, "c4": {"id": "c4", "text": "Tension with section 3. Chief said a Touchstone \"guides rather than commands\". Rule I is about promotion, so it holds. Rules III and VII use forbid and breach, which command. Decide which register wins.", "span": "", "old": null, "new": null}, "c5": {"id": "c5", "text": "Where is it filed? No such file or section exists in this doc. Name the place or drop the clause.", "span": "A rule true at only one altitude is a local convention, and is filed as one.", "old": null, "new": null}, "c6": {"id": "c6", "text": "Rule VI caps a layer at seven. This doc has seven rules and sits at the cap. Say so, or the next promotion forces a demotion here first.", "span": "", "old": null, "new": null}, "c7": {"id": "c7", "text": "The census is seven weeks old. Rows point at the Joplin vault by name only. Re-run the census and give a path or Zotero key per row.", "span": "", "old": null, "new": null}, "c8": {"id": "c8", "text": "Suggest: fold the nine-row candidate table into a closed block. The ruling is made. A reader now scrolls past eight rejected names to reach section 4.", "span": "The bench below stands as history.", "old": null, "new": null}, "c9": {"id": "c9", "text": "Suggested change. The table still markets Tenet as the winner. Mark the loser in the row, so no one reads it as live.", "span": "Strongest pure rename.", "old": "Strongest pure rename.", "new": "Lost to Touchstone, 9/24."}, "c10": {"id": "c10", "text": "Section 4 is a status table with no date. The \"pending\" rows were true at acquisition time. Add an \"as of\" date, or move the table to the BVX-LEARN record where it can be updated.", "span": "Ledger item 3 on the twin-track doc: **approved 2026-08-21.**", "old": null, "new": null}, "c11": {"id": "c11", "text": "Chief finds the PDFs (ruled 9/29). This line is the right handoff. Add the Find-list queue name so the line points at the live list.", "span": "Grab-in-browser manifest: marines.mil \u2192 Publications \u2192 Doctrinal. Drop into the inbox; the catalog pass picks them up.", "old": null, "new": null}},NAME="DOCTRINE-0-INVARIANTS",K="reviewdesk:"+NAME,S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function card(id){var c=C[id],v=S[id]||"";
return '<div class="card '+v+'" id="k'+id+'"><div class="id">'+id+(v?' - '+v:'')+'</div>'+(c.span?'<div class="q">"'+esc(c.span.slice(0,140))+'"</div>':'')+'<div>'+esc(c.text)+'</div>'+
(c.old?'<div class="ed"><del>'+esc(c.old)+'</del> <ins>'+esc(c.new)+'</ins></div>':'')+
'<div class="btns"><button class="a'+(v=="accept"?" on":"")+'" data-i="'+id+'" data-v="accept">Accept</button><button class="r'+(v=="reject"?" on":"")+'" data-i="'+id+'" data-v="reject">Reject</button></div></div>'}
function draw(){var n=0,t=Object.keys(C).length;for(var k in S)if(C[k])n++;
document.getElementById("n").textContent=NAME+" - "+n+" of "+t+" decided";
document.getElementById("m").innerHTML=B.map(function(b){return '<div class="row"><div class="p'+(b.table?' tb':'')+'">'+b.html+'</div><div>'+b.ids.map(card).join("")+'</div></div>'}).join("")}
document.getElementById("m").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var i=b.dataset.i;if(S[i]==b.dataset.v)delete S[i];else S[i]=b.dataset.v;save();draw()});
document.getElementById("x").onclick=function(){var o={document:NAME,exported:new Date().toISOString(),decisions:Object.keys(C).map(function(i){return{id:i,decision:S[i]||"undecided"}})};
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:"application/json"}));a.download=NAME+".decisions.json";a.click()};
draw();
</script></body></html>
