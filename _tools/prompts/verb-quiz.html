<title>Transitive or Not</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F4ECE6;
    --ink: #221619;
    --ink-3: #8C7A80;
    --line: #D9C9C3;
    --rose: #8A1F44;
    --rose-ink: #FFF4F7;
    --rose-soft: #F1D9E1;
    --good: #2F6B44;
    --bad: #A63D1F;
    --focus: #3F6BD9;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17111A;
      --ink: #F2E7EA;
      --ink-3: #8C7A83;
      --line: #3A2C34;
      --rose: #B03A62;
      --rose-ink: #FFF4F7;
      --rose-soft: #3B1E2B;
      --good: #6FBF87;
      --bad: #E27A58;
      --focus: #7FA3FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17111A;
    --ink: #F2E7EA;
    --ink-3: #8C7A83;
    --line: #3A2C34;
    --rose: #B03A62;
    --rose-ink: #FFF4F7;
    --rose-soft: #3B1E2B;
    --good: #6FBF87;
    --bad: #E27A58;
    --focus: #7FA3FF;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }
  .wrap {
    max-width: 640px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
  }
  .count {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .sentence {
    font-family: var(--serif);
    font-size: clamp(30px, 6vw, 42px);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  .sentence .v {
    font-style: normal;
    color: var(--rose);
    font-weight: 600;
    border-bottom: 3px solid var(--rose-soft);
  }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .btn {
    appearance: none;
    border: 2px solid var(--rose);
    background: var(--rose);
    color: var(--rose-ink);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.05em;
    padding: 30px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 80ms ease, background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .btn.false { background: transparent; color: var(--rose); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.show { border-color: var(--good); }
  .btn[disabled] { cursor: default; }

  .end { display: none; flex-direction: column; gap: 22px; }
  .end.show { display: flex; }
  .score {
    font-family: var(--serif);
    font-size: clamp(56px, 14vw, 96px);
    line-height: 1;
    font-weight: 600;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }
  .score span { font-size: 0.4em; color: var(--ink-3); font-weight: 400; }
  .misses { display: flex; flex-direction: column; gap: 6px; font-family: var(--serif); font-size: 20px; }
  .misses .v { color: var(--rose); font-weight: 600; font-style: normal; }
  .again {
    appearance: none;
    border: 2px solid var(--rose);
    background: var(--rose);
    color: var(--rose-ink);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.05em;
    padding: 22px 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .again:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div class="wrap">
  <div class="count" id="count">1 / 24</div>

  <section id="quiz" style="display:contents">
    <p class="sentence" id="sentence"></p>
    <div class="buttons">
      <button class="btn true" id="bTrue" type="button">TRUE</button>
      <button class="btn false" id="bFalse" type="button">FALSE</button>
    </div>
  </section>

  <section class="end" id="end">
    <p class="score"><span id="scoreN"></span> <span>/ 24</span></p>
    <div class="misses" id="misses"></div>
    <button class="again" id="again" type="button">AGAIN</button>
  </section>
</div>

<script>
(function () {
  var BANK = [
    ['The kids <em class="v">devoured</em> the pizza.', true],
    ['He <em class="v">turned</em> off the lights.', true],
    ['She <em class="v">ran</em> up a huge bill.', true],
    ['He <em class="v">felt</em> the wall for a switch.', true],
    ['They <em class="v">gave</em> the dog a bath.', true],
    ['She <em class="v">weighed</em> the box.', true],
    ['The dog <em class="v">chased</em> the mail truck.', true],
    ['We <em class="v">looked</em> up the word.', true],
    ['She <em class="v">told</em> him the truth.', true],
    ['I <em class="v">know</em> that she left.', true],
    ['He <em class="v">walked</em> the dog.', true],
    ['She <em class="v">hurt</em> herself.', true],
    ['She <em class="v">arrived</em> late.', false],
    ['The milk <em class="v">turned</em> sour.', false],
    ['The meeting <em class="v">lasted</em> two hours.', false],
    ['She <em class="v">ran</em> up the hill.', false],
    ['The soup <em class="v">smells</em> amazing.', false],
    ['The baby <em class="v">slept</em> all afternoon.', false],
    ['She <em class="v">read</em>.', false],
    ['He <em class="v">walked</em> to school.', false],
    ['The box <em class="v">weighs</em> ten pounds.', false],
    ['She <em class="v">relies</em> on her sister.', false],
    ['The glass <em class="v">broke</em>.', false],
    ['He <em class="v">seems</em> tired.', false]
  ];
  var N = BANK.length;
  var order = [], i = 0, score = 0, misses = [], locked = false;
  var $ = function (id) { return document.getElementById(id); };
  var elS = $('sentence'), elC = $('count'), bT = $('bTrue'), bF = $('bFalse');
  var elQ = $('quiz'), elE = $('end'), bA = $('again');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function shuffle() {
    var a = []; for (var k = 0; k < N; k++) a.push(k);
    for (var j = N - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[r]; a[r] = t; }
    return a;
  }
  function start() {
    order = shuffle(); i = 0; score = 0; misses = [];
    elE.className = 'end'; elQ.style.display = 'contents';
    show();
  }
  function show() {
    locked = false;
    elS.innerHTML = BANK[order[i]][0];
    elC.textContent = (i + 1) + ' / ' + N;
    bT.className = 'btn true'; bF.className = 'btn false';
    bT.disabled = false; bF.disabled = false;
  }
  function answer(val) {
    if (locked) return;
    locked = true;
    var q = BANK[order[i]];
    var ok = (val === q[1]);
    var pressed = val ? bT : bF, other = val ? bF : bT;
    if (ok) { score++; pressed.classList.add('good'); }
    else { misses.push(q[0]); pressed.classList.add('bad'); other.classList.add('show'); }
    bT.disabled = true; bF.disabled = true;
    setTimeout(function () {
      i++;
      if (i >= N) finish(); else show();
    }, reduce ? 250 : (ok ? 450 : 900));
  }
  function finish() {
    $('scoreN').textContent = score;
    var m = $('misses'); m.innerHTML = '';
    misses.forEach(function (s) { var d = document.createElement('div'); d.innerHTML = s; m.appendChild(d); });
    elQ.style.display = 'none';
    elE.className = 'end show';
    elC.textContent = '';
    bA.focus();
  }

  bT.addEventListener('click', function () { answer(true); });
  bF.addEventListener('click', function () { answer(false); });
  bA.addEventListener('click', start);
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (elE.className.indexOf('show') >= 0) { if (k === 'Enter' || k === ' ') { e.preventDefault(); start(); } return; }
    if (k === 't' || k === 'T' || k === 'ArrowLeft' || k === '1') { e.preventDefault(); answer(true); }
    else if (k === 'f' || k === 'F' || k === 'ArrowRight' || k === '2') { e.preventDefault(); answer(false); }
  });

  start();
})();
</script>
