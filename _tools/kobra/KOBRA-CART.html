<title>Kobra Cart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one thin strip with the running total, then one checklist block per phase. Dark only, the creator-cases orange. */
  :root { color-scheme: dark;
    --bg:#121110; --panel:#1B1A18; --panel-2:#24221F; --line:#34312C; --ink:#ECE7DF; --ink-2:#B7B0A5; --ink-3:#7F786E;
    --accent:#FF5A1F; --accent-soft:#3A1D10; --accent-ink:#FFB08F; --good:#5FBF8A;
    --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace; }
  html,body{background:var(--bg);color:var(--ink)} body{font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px} *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;margin-inline:-16px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .strip h1{margin:0;font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase} .strip h1 b{color:var(--accent)}
  .chip{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--line);border-radius:3px;color:var(--ink-2)}
  .spacer{flex:1} .tot{font:700 18px var(--display);font-variant-numeric:tabular-nums} .tot span{color:var(--accent)}
  .bar{height:4px;background:var(--panel-2);margin-inline:-16px} .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .wrap{max-width:860px;margin:0 auto;display:grid;gap:18px;padding-block:18px}
  .rules{font-size:13px;color:var(--ink-2);border-left:2px solid var(--accent);padding-left:10px;margin:0}
  section{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  section h2{margin:0;padding:10px 14px;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;border-bottom:1px solid var(--line)}
  section h2 .s{margin-left:auto;font:500 13px var(--mono);color:var(--ink-3);letter-spacing:0;text-transform:none}
  .item{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
  .item .no{font:500 12px var(--mono);color:var(--ink-3)} .item .d{min-width:0;overflow-wrap:anywhere} .item .d small{color:var(--ink-3)}
  .item .usd{font:700 16px var(--display);font-variant-numeric:tabular-nums;text-align:right;min-width:3.2em}
  .item a{font:500 12px var(--mono);color:var(--accent-ink);text-decoration:none;border:1px solid var(--line);padding:3px 7px;border-radius:3px} .item a:hover{border-color:var(--accent)}
  .item.done .d{color:var(--ink-3);text-decoration:line-through} .item.done .usd{color:var(--good)}
  .note{font-size:13px;color:var(--ink-3)}
  @media (max-width:520px){.item{grid-template-columns:24px minmax(0,1fr) auto;row-gap:4px}.item .no{display:none}.item a{grid-column:2}}
</style>
<header class="strip">
  <h1>Kobra <b>Cart</b></h1><span class="chip">BOLO 112</span><span class="spacer"></span>
  <span class="tot"><span id="got">$0</span> of <span id="all" style="color:inherit">$0</span> bought</span>
</header>
<div class="bar"><i id="bar"></i></div>
<main class="wrap">
  <p class="rules">1.75 mm only · plastic spools only in the ACE Pro · no matte PLA, no silk · official Anycubic hotends and plates only · TPU and CF feed direct · CF needs the hardened hotend. Prices are July estimates; each link opens an Amazon search.</p>
  <div id="list"></div>
  <p class="note" id="status">Ticks save to this page.</p>
</main>
<script>
(function(){
  const PHASES = [{"name": "Phase 1 · calibration", "items": [{"no": "101", "d": "PLA, light gray, 1 kg", "q": 1, "usd": 14, "link": "https://www.amazon.com/s?k=PLA+filament+1.75mm+light+gray+1kg+plastic+spool"}, {"no": "102", "d": "PLA, black, 1 kg", "q": 1, "usd": 14, "link": "https://www.amazon.com/s?k=PLA+filament+1.75mm+black+1kg+plastic+spool"}, {"no": "103", "d": "PETG, black, 1 kg", "q": 2, "usd": 34, "link": "https://www.amazon.com/s?k=PETG+filament+1.75mm+black+1kg"}, {"no": "104", "d": "PETG, OD green, 1 kg", "q": 1, "usd": 17, "link": "https://www.amazon.com/s?k=PETG+filament+1.75mm+olive+green+1kg"}, {"no": "105", "d": "Glue stick 2-pack", "q": 1, "usd": 4, "link": "https://www.amazon.com/s?k=Elmers+purple+glue+stick+2+pack"}, {"no": "106", "d": "IPA 91% + microfiber", "q": 1, "usd": 8, "link": "https://www.amazon.com/s?k=91%25+isopropyl+alcohol+quart"}, {"no": "107", "d": "Vacuum filament storage kit", "q": 1, "usd": 28, "link": "https://www.amazon.com/s?k=filament+vacuum+storage+bags+kit+pump+hygrometer"}, {"no": "108", "d": "Spare hotend 0.4 mm, official", "q": 1, "usd": 18, "link": "https://www.amazon.com/s?k=Anycubic+Kobra+S1+hotend+0.4mm"}]}, {"name": "Phase 2 · production core", "items": [{"no": "201", "d": "ASA, black, 1 kg", "q": 1, "usd": 23, "link": "https://www.amazon.com/s?k=ASA+filament+1.75mm+black+1kg"}, {"no": "202", "d": "ASA, OD green, 1 kg", "q": 1, "usd": 23, "link": "https://www.amazon.com/s?k=ASA+filament+1.75mm+olive+green+1kg"}, {"no": "203", "d": "Filament dryer, 70 °C (Sunlu S2 class)", "q": 1, "usd": 45, "link": "https://www.amazon.com/s?k=Sunlu+FilaDryer+S2"}, {"no": "204", "d": "Heat-set inserts M3, 100+", "q": 1, "usd": 18, "link": "https://www.amazon.com/s?k=M3+heat+set+inserts+brass+5mm+x+4mm+kit"}, {"no": "205", "d": "Heat-set tips, M3", "q": 1, "usd": 12, "link": "https://www.amazon.com/s?k=heat+set+insert+tip+M3+soldering+iron"}, {"no": "206", "d": "M3 screw assortment", "q": 1, "usd": 18, "link": "https://www.amazon.com/s?k=M3+socket+button+head+screw+assortment+kit+black"}, {"no": "207", "d": "Hotend 0.6 mm, official", "q": 1, "usd": 20, "link": "https://www.amazon.com/s?k=Anycubic+Kobra+S1+hotend+0.6mm"}, {"no": "208", "d": "Super Lube 21030", "q": 1, "usd": 10, "link": "https://www.amazon.com/s?k=Super+Lube+21030"}, {"no": "209", "d": "PTFE tube + cutter + couplings", "q": 1, "usd": 15, "link": "https://www.amazon.com/s?k=Capricorn+PTFE+tube+1.9mm+cutter+PC4-M6+kit"}]}, {"name": "Phase 3 · premium (now bought up front)", "items": [{"no": "301", "d": "Hardened hotend 0.4 mm, official", "q": 1, "usd": 28, "link": "https://www.amazon.com/s?k=Anycubic+Kobra+S1+hardened+steel+hotend"}, {"no": "302", "d": "PETG-CF, black, 1 kg", "q": 1, "usd": 28, "link": "https://www.amazon.com/s?k=PETG-CF+carbon+fiber+filament+1.75mm+1kg"}, {"no": "303", "d": "TPU 95A, black, 1 kg", "q": 1, "usd": 22, "link": "https://www.amazon.com/s?k=TPU+95A+filament+1.75mm+black+1kg"}, {"no": "304", "d": "Second build plate, official", "q": 1, "usd": 28, "link": "https://www.amazon.com/s?k=Anycubic+Kobra+S1+build+plate"}, {"no": "305", "d": "Smart plug + smoke detector", "q": 1, "usd": 25, "link": "https://www.amazon.com/s?k=Kasa+smart+plug+smoke+detector"}, {"no": "306", "d": "Carbon filter pellets (BentoBox)", "q": 1, "usd": 10, "link": "https://www.amazon.com/s?k=activated+carbon+pellets+3D+printer+bentobox"}]}, {"name": "Phase 4 · the full kit (new 10/6)", "items": [{"no": "401", "d": "Digital calipers, 6 in", "q": 1, "usd": 30, "link": "https://www.amazon.com/s?k=iGaging+digital+caliper+6+inch"}, {"no": "402", "d": "Finish kit: filler primer + matte black + red spray", "q": 1, "usd": 25, "link": "https://www.amazon.com/s?k=Rust-Oleum+filler+primer+spray"}, {"no": "403", "d": "Wet/dry sandpaper 220-2000 + sanding sponges", "q": 1, "usd": 12, "link": "https://www.amazon.com/s?k=wet+dry+sandpaper+assortment+220+to+2000"}, {"no": "404", "d": "ASA, red, 1 kg (the cyberdeck accent)", "q": 1, "usd": 23, "link": "https://www.amazon.com/s?k=ASA+filament+1.75mm+red+1kg"}, {"no": "405", "d": "Pinecil soldering iron (only if you have no iron)", "q": 1, "usd": 30, "link": "https://www.amazon.com/s?k=Pinecil+V2+soldering+iron"}]}];
  const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let checked={}, ref=null, version=0;
  function render(){
    let all=0,got=0,h="";
    for(const p of PHASES){
      let ps=0,pg=0,rows="";
      for(const it of p.items){ const on=!!checked[it.no]; ps+=it.usd; if(on)pg+=it.usd;
        rows+=`<label class="item${on?" done":""}" for="c${it.no}"><input type="checkbox" id="c${it.no}" data-no="${it.no}"${on?" checked":""}><span class="no">${it.no}</span><span class="d">${esc(it.d)}${it.q>1?" <small>× "+it.q+"</small>":""}</span><span class="usd">$${it.usd}</span><a href="${esc(it.link)}" target="_blank" rel="noopener">search</a></label>`; }
      all+=ps; got+=pg;
      h+=`<section><h2>${esc(p.name)}<span class="s">$${pg} / $${ps}</span></h2>${rows}</section>`;
    }
    document.getElementById("list").innerHTML=h;
    document.getElementById("got").textContent="$"+got; document.getElementById("all").textContent="$"+all;
    document.getElementById("bar").style.width=(all?got/all*100:0)+"%";
  }
  render();
  let saving=Promise.resolve();
  document.getElementById("list").addEventListener("change",(e)=>{
    const no=e.target.dataset&&e.target.dataset.no; if(!no)return;
    checked={...checked,[no]:e.target.checked}; render();
    if(!ref){document.getElementById("status").textContent="Storage is offline in this view; ticks won't save.";return;}
    saving=saving.then(()=>ref.set({checked})).catch(()=>{document.getElementById("status").textContent="Save failed. Tick it again.";});
  });
  (async()=>{
    const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db){document.getElementById("status").textContent="Storage is offline in this view; ticks won't save.";return;}
    ref=db.doc("cart/state");
    ref.onSnapshot((s)=>{ if(s.exists){checked={...(s.data().checked||{})}; render();} },()=>{});
  })();
})();
</script>
