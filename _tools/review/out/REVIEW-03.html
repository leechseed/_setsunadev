/* level 1 · CONTEXT: the ten systems */
function level1() {
  WIRES = [];
  DATA.systems.forEach(s => Object.entries(s.deps).forEach(([t, n]) => {
    const mine = s.id === META.key || t === META.key;
    WIRES.push({ a: 'sys:' + s.id, b: 'sys:' + t, cls: mine ? 'acc' : 'dim', title: `${s.id} → ${t}: ${n} dependency line(s) in frontmatter`, bend: 0.06 });
  }));
  const n = DATA.systems.length, k0 = Math.max(0, DATA.systems.findIndex(s => s.id === META.key));
  const boxes = DATA.systems.map((s, i) => {
    const me = s.id === META.key;
    const a = -Math.PI / 2 + 2 * Math.PI * ((i - k0 + n) % n) / n;
    const pos = `--x:${(50 + 41 * Math.cos(a)).toFixed(2)}%;--y:${(50 + 42 * Math.sin(a)).toFixed(2)}%`;
    const open = s.open ? `<span class="chip c-warn">⧗ ${s.open}</span>` : `<span class="chip c-ok">⧗ 0</span>`;
    return `<button class="box ${me ? 'focus' : 'mute'}" data-node="sys:${s.id}" data-t="sys:${s.id}" data-sys="${s.id}" style="${pos}">
      ${me ? '<span class="go">open ›</span>' : ''}
      <span class="id">${esc(s.id)}</span><span class="nm">${esc(s.name)}</span>
      <span class="meta"><span>${esc(s.vmin || '—')}${s.vmax && s.vmax !== s.vmin ? ' – ' + esc(s.vmax) : ''}</span>${open}<span>${s.docs.length} docs</span></span>
    </button>`;
  }).join('');
  const sel = M.sel ? sysNote(M.sel) : `<div class="note"><h3>Level 1 · the ten systems</h3>Each box is one SSOT folder: the version range of its docs, its open ⧗ marks and its doc count. A line runs from a system to one it depends on, read from each doc's <code class="inl">dependencies</code> frontmatter. Orange lines touch ${esc(META.short)}. Click ${esc(META.short)} to zoom in.</div>`;
  return `<div class="stage"><svg class="wires" aria-hidden="true"></svg><div class="grid g1 ring">${boxes}</div></div>
    <div class="legend"><span><i style="border-color:var(--acc)"></i>${esc(META.short)} depends / is depended on</span><span><i class="dash" style="border-color:#5a5049"></i>other dependencies</span><span>arrow points at the system depended on</span></div>${sel}`;
}
function sysNote(id) {

  return `<div class="note"><h3>${esc(s.id)} ${esc(s.name)}</h3>Not under review on this page; its review is <span class="pathref">python _tools/review/build.py ${esc(s.id)}</span> once its method closes. Folder <span class="pathref">${esc(s.folder)}</span>.<ul>${docs}</ul></div>`;

    (d.deps || []).forEach(t => { if (DOCS[t] && t !== d.module_of) WIRES.push({ a: id, b: t, cls: 'doc', title: `${shortDoc(id)} depends on ${shortDoc(t)}`, bend: 0.18 }); });
  });
  const box = d => {
    const ext = [...new Set([...(d.deps || []).filter(t => !DOCS[t]).map(t => (G['doc:' + t] ? t.slice(5, 7) : t)), ...(d.deps_sys || [])])];

      <span class="ln">${esc(d.purpose)}</span>

  const main = box(DOCS[META.main]);
  const sel = M.sel ? docNote(M.sel) : `<div class="note"><h3>Level 2 · the docs of ${esc(META.short)}</h3>The main doc and everything that is <code class="inl">module_of</code> it. Dashed grey lines = <code class="inl">module_of</code>; blue lines = <code class="inl">dependencies</code> between these docs; "→ 04 · 03" names systems outside. Click the main doc to open its twelve layers; click any other doc for its card.</div>`;
  return `<div class="stage"><svg class="wires" aria-hidden="true"></svg><div class="grid g2">${main}${grp('module', 'Modules')}${grp('synthesis module', 'Synthesis module')}${grp('template', 'Ingest templates')}${grp('doc', 'Other docs')}</div></div>

}

  return `<div class="note"><h3>${esc(shortDoc(d.id).replace(/_/g, ' '))} <span class="chip c-acc">${esc(d.role)}</span> <span class="chip c-dim">${esc(d.version)}</span></h3>

/* level 3 · COMPONENT: the twelve layers in their tiers */
const EDGE_CLS = { derives: 'acc', feeds: 'acc', fed: 'acc', reduces: 'warn', reads: 'mid', points: 'mid', shares: 'mid', 'stalls at': 'warn', 'path a': 'warn', 'path b': 'ok' };
function tierOf(n) { return (DATA.tiers || []).find(t => t.n === n) || {}; }
function level3() {
  WIRES = DATA.feeds.map(e => ({ a: e.from, b: e.to, cls: EDGE_CLS[e.kind] || 'mid', title: `${e.from} ${e.kind} ${e.to} · line ${e.cites.map(c => c.line).join(', ')}`, bend: e.kind.startsWith('path') ? 0.08 : 0.16 }));

  const th = (n, col, span) => { const t = tierOf(n); return `<div class="tierh" style="grid-column:${col} / span ${span};grid-row:1"><b>Tier ${n} · ${esc(t.layers || '')}</b><span>${esc(t.cls || '')} · ${esc(t.budget || '')}</span></div>`; };
  const hasSF = DATA.feeds.some(e => e.from === 'storyform'), hasFork = !!DATA.fork;

  const ext = (hasFork ? `<button class="box ext" data-node="fork" data-t="x:fork" style="grid-column:3;grid-row:${maxRow}"><span class="id">method rule · line ${DATA.fork.line}</span><span class="nm">${esc(DATA.fork.title)}</span><span class="ln">path (a) refused · path (b) faced</span></button>` : '') +
    (hasSF ? `<button class="box ext" data-node="storyform" data-t="storyform" style="grid-column:4;grid-row:${maxRow}"><span class="id">outside the stack</span><span class="nm">The storyform</span><span class="ln">feeds the last layer independently</span></button>` : '');
  const elist = DATA.feeds.map(e => `<div class="e"><div><b>${nodeLabel(e.from)} → ${nodeLabel(e.to)}</b><span class="k">${esc(e.kind)}</span></div><div>${e.cites.map(c => `<span class="lnum">line ${c.line}</span><q>${esc(c.text)}</q>`).join('<br>')}</div></div>`).join('');
  const derived = (DATA.derived || []).map(d => `<dt>${T(d.name.toLowerCase().replace(/\s+/g, '-'), esc(d.name))}</dt><dd>${esc(d.formula)}</dd>`).join('');
  return `<div class="stage"><svg class="wires" aria-hidden="true"></svg><div class="grid g3" style="grid-template-rows:repeat(${maxRow}, auto)">${[1, 2, 3].map(n => th(n, n, n === 3 ? 2 : 1) + LAYERS.filter(l => l.tier === n).map(lbox).join('')).join('')}${ext}</div></div>
  <div class="legend"><span><i style="border-color:var(--acc)"></i>derives · feeds</span><span><i class="dash" style="border-color:var(--warn)"></i>reduces · stalls (path a)</span><span><i class="dash" style="border-color:var(--ok)"></i>path b</span><span><i style="border-color:var(--dim)"></i>reads · points · shares</span><span>click a layer for its fields</span></div>
  <div class="cols2">
    <div class="card"><h3>Feed arrows <small>${DATA.feeds.length} parsed · each cites its line in <span class="pathref">${esc(shortDoc(META.main))}</span></small></h3><div class="edgelist">${elist}</div></div>
    <div class="stack" style="display:grid;gap:16px;align-content:start">
      ${DATA.binding ? `<div class="card"><h3>Binding rule <small>line ${DATA.binding.line}</small></h3><div class="prose">${DATA.binding.html}</div></div>` : ''}
      <div class="card"><h3>Derived statistics <small>computed, never entered</small></h3><dl class="kv">${derived}</dl></div>
      ${DATA.tier_note ? `<div class="card"><h3>The tiers</h3><div class="prose" style="color:var(--dim)">${esc(DATA.tier_note)}</div></div>` : ''}
    </div>
  </div>`;
}

/* level 4 · DETAIL: one layer */
function fieldRows(l) {
  const inL = new Set(l.fields);
  const top = l.fields.filter(f => !FIELDS[f].parent || !inL.has(FIELDS[f].parent));
  const out = [];
  top.forEach(f => { out.push([f, false]); l.fields.filter(c => FIELDS[c].parent === f).forEach(c => out.push([c, true])); });
  return out.map(([f, sub]) => {
    const r = FIELDS[f];
    const tag = r.tag ? `<span class="chip tag-${r.tag}">${esc(r.tag)}</span>` : `<span class="chip tag-none" title="${r.needs_tag ? 'needs a tag' : 'predates the tag table: the state module\'s Decision Test decides'}">${r.needs_tag ? 'untagged' : 'pre-tag'}</span>`;
    const notes = [r.note, r.layers.length > 1 ? 'also on ' + r.layers.filter(x => x !== l.id).join(', ') : '', r.scalar ? 'the layer\'s scalar' : ''].filter(Boolean).join(' · ');
    return `<tr class="${sub ? 'sub' : ''}"><td>${T('fld:' + f, `<code class="inl">${esc(f)}</code>`)}${notes ? `<span class="n">${esc(notes)}</span>` : ''}</td><td>${tag}</td><td class="v">${esc(r.intro)}</td><td class="v">${esc(r.origin === 'table' ? 'table' : 'decl.')}</td></tr>`;
  }).join('');
}
function level4() {
  WIRES = [];

  const i = LAYERS.indexOf(l), prev = LAYERS[i - 1], next = LAYERS[i + 1];
  const ins = DATA.feeds.filter(e => e.to === l.id), outs = DATA.feeds.filter(e => e.from === l.id);
  const fe = (e, dir) => `<div class="e"><div><b>${dir === 'in' ? nodeLabel(e.from) + ' →' : '→ ' + nodeLabel(e.to)}</b><span class="k">${esc(e.kind)}</span></div><div>${e.cites.map(c => `<span class="lnum">line ${c.line}</span><q>${esc(c.text)}</q>`).join('<br>')}</div></div>`;
  const libs = DATA.library.filter(b => b.feeds.includes(l.id));
  const tagged = l.fields.filter(f => FIELDS[f].tag).length;
  return `<div class="navrow">${prev ? `<button class="btn" data-goto="${prev.id}">‹ ${esc(prev.id)} ${esc(prev.name)}</button>` : ''}${next ? `<button class="btn" data-goto="${next.id}">${esc(next.id)} ${esc(next.name)} ›</button>` : ''}</div>
  <div class="panel-head"><h2>${layerT(l.id)}</h2><span class="sub">tier ${l.tier} · ${esc(tierOf(l.tier).cls || '')} · PART A line ${l.line}</span></div>
  <p class="l4 q" style="display:block">${esc(l.q)}</p>
  <div class="l4">
    <div class="card"><h3>Fields <small>${l.fields.length} · ${tagged} tagged static/dynamic · first-seen version from git</small></h3>
      <table class="fl"><thead><tr><th>Field</th><th>Tag</th><th>First in</th><th>From</th></tr></thead><tbody>${fieldRows(l)}</tbody></table></div>
    <div class="stack">
      <div class="card"><h3>Sources <small>PART A</small></h3><div class="prose">${l.src_html}</div>
        ${libs.length ? `<div style="margin-top:8px" class="lbl">feeds hardest (library)</div><div class="prose">${libs.map(b => T(b.id, esc(b.id)) + ' ' + b.book_html).join('<br>')}</div>` : ''}</div>
      <div class="card"><h3>Feeds <small>${ins.length} in · ${outs.length} out</small></h3><div class="edgelist">${ins.map(e => fe(e, 'in')).join('') + outs.map(e => fe(e, 'out')).join('') || '<span class="c-dim">The declarations state no feed for this layer.</span>'}</div></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Domain declaration <small>line ${l.decl_line || '—'}</small></h3><div class="prose">${l.decl_html || '<span class="c-dim">none parsed</span>'}</div></div>`;
}

$('#mapBody').addEventListener('click', e => {
  if (e.target.closest('.t')) return;
  const g = e.target.closest('[data-goto]'); if (g) { go(4, g.dataset.goto); return; }
  const b = e.target.closest('.box'); if (!b) return;
  if (M.lvl === 1) { if (b.dataset.sys === META.key) go(2); else { M.sel = b.dataset.sys; const st = $('#mapBody'); st.innerHTML = level1(); bindStage(); requestAnimationFrame(rewire); } }
  else if (M.lvl === 2) { if (b.dataset.doc === META.main) go(3); else { M.sel = b.dataset.doc; $('#mapBody').innerHTML = level2(); bindStage(); requestAnimationFrame(rewire); } }

/* =================================================================== GRAPH */
const KCOL = { system: '#e8e2db', doc: '#7aa2d6', layer: '#FF5A1F', field: '#9a9088', book: '#5fb3b3', external: '#e0a84a' };
const GN = DATA.graph.nodes, GL = DATA.graph.links;
const GBY = Object.fromEntries(GN.map(n => [n.id, n]));
const DEG = {}; GL.forEach(l => { DEG[l.s] = (DEG[l.s] || 0) + 1; DEG[l.t] = (DEG[l.t] || 0) + 1; });
const ADJ = {}; GL.forEach(l => { (ADJ[l.s] = ADJ[l.s] || []).push(l.t); (ADJ[l.t] = ADJ[l.t] || []).push(l.s); });
const HIDE = new Set();
let gReady = false, gCenter = null, sim = null, gSel = null, zoomB = null;
const rad = n => 3 + Math.sqrt(DEG[n.id] || 1) * 1.9 + (n.kind === 'system' ? 3 : 0);
function graphInit() {
  if (gReady) return; gReady = true;
  if (typeof d3 === 'undefined') { $('#gWrap').insertAdjacentHTML('beforeend', '<div class="msg">The graph needs d3 from cdnjs.cloudflare.com, which did not load. MAP, DONE and TRACE work without it.</div>'); return; }
  $('#gList').innerHTML = GN.map(n => `<option value="${esc(n.label)}">${esc(n.kind)}</option>`).join('');
  const kinds = [...new Set(GN.map(n => n.kind))];
  $('#gLeg').innerHTML = kinds.map(k => `<button aria-pressed="true" data-k="${k}"><i style="background:${KCOL[k]}"></i>${k} · ${GN.filter(n => n.kind === k).length}</button>`).join('');
  $('#gLeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k; if (HIDE.has(k)) HIDE.delete(k); else HIDE.add(k); b.setAttribute('aria-pressed', String(!HIDE.has(k))); draw(); });
  const svg = d3.select('#gSvg');
  gSel = svg.append('g');
  zoomB = d3.zoom().scaleExtent([0.15, 5]).on('zoom', ev => gSel.attr('transform', ev.transform));
  svg.call(zoomB).on('dblclick.zoom', null);
  draw();
}
function subgraph() {
  let keep;
  if (gCenter) {
    const depth = +$('#gDepth').value; keep = new Set([gCenter]); let front = [gCenter];
    for (let d = 0; d < depth; d++) { const nx = []; front.forEach(id => (ADJ[id] || []).forEach(o => { if (!keep.has(o) && !HIDE.has(GBY[o].kind)) { keep.add(o); nx.push(o); } })); front = nx; }
  } else keep = new Set(GN.filter(n => !HIDE.has(n.kind)).map(n => n.id));
  const nodes = GN.filter(n => keep.has(n.id)).map(n => ({ ...n }));
  const links = GL.filter(l => keep.has(l.s) && keep.has(l.t)).map(l => ({ source: l.s, target: l.t, k: l.k }));
  return { nodes, links };
}
function draw() {
  if (!gSel) return;
  if (sim) sim.stop();
  const { nodes, links } = subgraph();
  const box = $('#gWrap').getBoundingClientRect(), W = box.width || 800, H = box.height || 500;
  gSel.selectAll('*').remove();
  const link = gSel.append('g').attr('class', 'gl').selectAll('line').data(links).join('line').attr('class', d => 'k-' + d.k);
  const local = !!gCenter;
  const showLabel = d => local || ['system', 'layer', 'external'].includes(d.kind) || (d.kind === 'doc' && d.sys === META.key);
  const node = gSel.append('g').selectAll('g').data(nodes).join('g')
    .attr('class', d => `gn kind-${d.kind}${d.id === gCenter ? ' center' : ''}`)
    .attr('data-t', d => d.t && G[d.t] ? d.t : null).attr('tabindex', 0).attr('role', 'button').attr('aria-label', d => `${d.kind} ${d.label}`);
  node.append('circle').attr('r', rad).attr('fill', d => KCOL[d.kind] || '#888');
  node.filter(showLabel).append('text').attr('x', d => rad(d) + 3).attr('y', 3.5).text(d => d.label.length > 34 ? d.label.slice(0, 33) + '…' : d.label);
  node.on('click', (ev, d) => { ev.stopPropagation(); closeTips(1); focusNode(d.id); })
      .on('keydown', (ev, d) => { if (ev.key === 'Enter') { ev.preventDefault(); focusNode(d.id); } });
  const ticked = () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  };
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.k === 'layer-has-field' ? 26 : l.k === 'contains' ? 34 : 60).strength(l => l.k === 'contains' ? 0.6 : 0.4))
    .force('charge', d3.forceManyBody().strength(local ? -380 : -55).distanceMax(local ? 600 : 400))
    .force('collide', d3.forceCollide(d => rad(d) + (local ? 14 : 2)))
    .force('x', d3.forceX(W / 2).strength(0.045)).force('y', d3.forceY(H / 2).strength(0.06))
    .force('center', d3.forceCenter(W / 2, H / 2));
  if (gCenter) { const c = nodes.find(n => n.id === gCenter); if (c) { c.fx = W / 2; c.fy = H / 2; } }
  const drag = d3.drag()
    .on('start', (ev, d) => { if (!REDUCE && !ev.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; if (REDUCE) { d.x = ev.x; d.y = ev.y; ticked(); } })
    .on('end', (ev, d) => { if (!REDUCE && !ev.active) sim.alphaTarget(0); if (d.id !== gCenter) { d.fx = null; d.fy = null; } });
  node.call(drag);
  if (REDUCE) { sim.stop(); for (let i = 0; i < 320; i++) sim.tick(); ticked(); fit(nodes, W, H, false); }
  else { sim.on('tick', ticked).on('end', () => fit(nodes, W, H, true)); setTimeout(() => fit(nodes, W, H, true), 900); }
  $('#gStat').textContent = `${nodes.length} nodes · ${links.length} edges${gCenter ? ` · local: ${GBY[gCenter].label} · depth ${$('#gDepth').value}` : ' · global'}`;
  $('#gGlobal').setAttribute('aria-pressed', String(!gCenter));
}
function fit(nodes, W, H, anim) {
  if (!nodes.length) return;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min(...xs) - 40, x1 = Math.max(...xs) + 120, y0 = Math.min(...ys) - 30, y1 = Math.max(...ys) + 30;
  const k = Math.max(0.15, Math.min(1.25, Math.min(W / (x1 - x0), H / (y1 - y0))));
  const t = d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k);
  const svg = d3.select('#gSvg');
  (anim && !REDUCE ? svg.transition().duration(350) : svg).call(zoomB.transform, t);
}
function focusNode(id) { gCenter = id; draw(); }
$('#gGlobal').addEventListener('click', () => { gCenter = null; draw(); });
$('#gDepth').addEventListener('input', () => { $('#gDepthV').textContent = $('#gDepth').value; if (gCenter) draw(); });
$('#gSearch').addEventListener('change', () => searchGo());
$('#gSearch').addEventListener('keydown', e => { if (e.key === 'Enter') searchGo(); });
function searchGo() {
  const q = $('#gSearch').value.trim().toLowerCase(); if (!q) return;
  const n = GN.find(n => n.label.toLowerCase() === q) || GN.find(n => n.label.toLowerCase().startsWith(q)) || GN.find(n => n.label.toLowerCase().includes(q) || (n.title || '').toLowerCase().includes(q));
  if (n) { HIDE.delete(n.kind); $$('#gLeg button').forEach(b => b.setAttribute('aria-pressed', String(!HIDE.has(b.dataset.k)))); focusNode(n.id); }
  else $('#gStat').textContent = `no node matches “${$('#gSearch').value}”`;
}
window.addEventListener('resize', () => { if (gReady && TAB === 'graph') { clearTimeout(window.__gT); window.__gT = setTimeout(draw, 150); } });

/* =================================================================== DONE */

    <div class="checks">${checks}</div>

})();

/* =================================================================== TRACE */
(function renderTrace() {
  const cols = DATA.trace.cols, cells = DATA.trace.cells, fc = DATA.trace.fcells;
  const libBy = Object.fromEntries(DATA.library.map(b => [b.id, b]));
  const author = id => { const d = document.createElement('div'); d.innerHTML = libBy[id].book_html; return d.textContent.split(',')[0]; };
  const head = `<tr><th class="rh"><span class="lbl">layer · field</span></th>${cols.map(c => `<th class="bk">${T(c, esc(c))}<small title="${esc(author(c))}">${esc(author(c))}</small></th>`).join('')}<th class="bk"><span class="lbl">n</span></th></tr>`;
  const rows = LAYERS.map(l => {
    let n = 0;
    const cs = cols.map(c => { const x = cells[l.id + '|' + c]; if (!x) return '<td class="c"></td>'; n++; return `<td class="c ${x.strong ? 's' : 'w'}" title="${esc(c)} → ${esc(l.id)}: ${esc(x.how.join(', '))}">${x.strong ? '●' : '○'}</td>`; }).join('');
    const frows = l.fields.map(f => { let m = 0; const fcs = cols.map(c => fc[f + '|' + c] ? (m++, '<td class="c f" title="cited in the same sentence of the declaration">■</td>') : '<td class="c"></td>').join(''); return `<tr class="fr" data-of="${l.id}" hidden><td class="rh">${T('fld:' + f, `<code class="inl">${esc(f)}</code>`)}</td>${fcs}<td class="n">${m || ''}</td></tr>`; }).join('');
    return `<tr class="lr"><td class="rh"><button class="x" data-x="${l.id}" aria-expanded="false" aria-label="Show ${esc(l.id)} fields">▸</button><button class="jump" data-jump="${l.id}" title="Open ${esc(l.id)} on the MAP">${esc(l.id)} ${esc(l.name)}</button></td>${cs}<td class="n">${n}</td></tr>${frows}`;
  }).join('');
  const tot = cols.map(c => LAYERS.filter(l => cells[l.id + '|' + c]).length);
  $('#p-trace').innerHTML = `<div class="panel-head"><h2>Traceability</h2><span class="sub">${LAYERS.length} layers × ${cols.length} books of the library table · ● the library row says it feeds hardest · ○ cited in PART A or the declaration · ▸ opens a layer's fields (■ = the book is cited in the same declaration sentence) · click a layer to open it on the MAP</span></div>
    <div class="navrow"><button class="btn" id="trAll" aria-pressed="false">expand all fields</button></div>
    <div class="twrap"><table class="tr"><thead>${head}</thead><tbody>${rows}</tbody><tfoot><tr><td class="rh">layers fed</td>${tot.map(t => `<td>${t}</td>`).join('')}<td></td></tr></tfoot></table></div>`;
  const toggle = (id, open) => { const b = $(`button[data-x="${id}"]`); const o = open != null ? open : b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', String(o)); b.textContent = o ? '▾' : '▸'; $$(`tr.fr[data-of="${id}"]`).forEach(r => r.hidden = !o); };
  $('#p-trace').addEventListener('click', e => {
    const x = e.target.closest('button[data-x]'); if (x) { toggle(x.dataset.x); return; }
    const j = e.target.closest('button[data-jump]'); if (j) { setTab('map'); go(4, j.dataset.jump); return; }
    if (e.target.closest('#trAll')) { const b = $('#trAll'); const o = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(o)); b.textContent = o ? 'collapse all fields' : 'expand all fields'; LAYERS.forEach(l => toggle(l.id, o)); }
  });
})();

/* =================================================================== tooltips: the TM engine
   hover opens · hold 1.5 s or Space locks · nested to depth 3 · Esc closes · click pins */
let tips = [], openTimer = null, closeTimer = null;
function mdInline(s) {
  s = esc(s);
  return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => { const g = G[k]; const label = l || (g ? g.t : k); return g ? `<a class="t" data-t="${k}" tabindex="0">${label}</a>` : label; });
}
function tipFor(target, depth) {
  const k = target.dataset.t; const g = G[k]; if (!g) return null;
  const el = document.createElement('div'); el.className = 'tip'; el.dataset.depth = depth; el.setAttribute('role', 'tooltip');
  const deep = depth >= 3;
  const plain = s => esc(String(s || '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kk, l) => l || (G[kk] ? G[kk].t : kk)));
  el.innerHTML = `<div class="th"><b>${esc(g.t)}</b><span class="k">${esc(g.k)}</span></div><p>${deep ? plain(g.d) : mdInline(g.d)}</p>${g.w ? `<div class="w">${esc(g.w)}</div>` : ''}<div class="lock"><b></b></div><div class="hint">hold 1.5 s or Space to lock · Esc closes · click pins</div>`;
  document.body.appendChild(el);
  const r = target.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  const x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12); let y = r.bottom + 8; if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const rec = { el, target, depth, locked: false, timer: null };
  const bar = $('.lock b', el);
  if (!REDUCE) requestAnimationFrame(() => { bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%'; });
  rec.timer = setTimeout(() => lock(rec), 1500);
  el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
  el.addEventListener('mouseleave', () => scheduleClose(depth));
  target.classList.add('on'); tips.push(rec); return rec;
}
function lock(rec) { rec.locked = true; rec.el.classList.add('locked'); }
function closeTips(d) { tips.filter(t => t.depth >= d).forEach(t => { clearTimeout(t.timer); t.el.remove(); t.target.classList.remove('on'); }); tips = tips.filter(t => t.depth < d); }
function scheduleClose(depth) { clearTimeout(closeTimer); closeTimer = setTimeout(() => { const un = tips.filter(t => t.depth >= depth && !t.locked); if (un.length) closeTips(Math.min(...un.map(t => t.depth))); }, 220); }
function depthOf(t) { const p = t.closest('.tip'); return p ? +p.dataset.depth + 1 : 1; }
function onEnter(t) {
  clearTimeout(openTimer); clearTimeout(closeTimer);
  const d = depthOf(t);
  if (tips.some(x => x.target === t && x.depth === d)) return;
  openTimer = setTimeout(() => { closeTips(d); tipFor(t, d); }, 120);
}
const termOf = e => { const t = e.target.closest && e.target.closest('[data-t]'); return t && t.dataset.t && G[t.dataset.t] ? t : null; };
document.addEventListener('mouseover', e => { const t = termOf(e); if (t) onEnter(t); });
document.addEventListener('mouseout', e => { const t = termOf(e); if (t && !t.contains(e.relatedTarget)) { clearTimeout(openTimer); scheduleClose(depthOf(t)); } });
document.addEventListener('focusin', e => { const t = termOf(e); if (t) onEnter(t); });
document.addEventListener('focusout', e => { const t = termOf(e); if (t) scheduleClose(depthOf(t)); });
document.addEventListener('click', e => {
  const t = e.target.closest('.t');
  if (t && t.dataset.t && G[t.dataset.t]) {
    e.preventDefault(); clearTimeout(openTimer);
    const d = depthOf(t); let rec = tips.find(x => x.target === t);
    if (!rec) { closeTips(d); rec = tipFor(t, d); }
    if (rec) lock(rec);
    return;
  }
  if (!e.target.closest('.tip')) closeTips(1);
});

/* ---- keys ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ' && tips.length) { e.preventDefault(); lock(tips[tips.length - 1]); return; }
  if (e.key === 'Escape') {
    if (tips.length) { closeTips(1); return; }
    if (!$('#about').hidden) { toggleAbout(false); return; }
    if (TAB === 'map') { if (M.sel) { M.sel = null; renderMap(); } else back(); return; }
    if (TAB === 'graph' && gCenter) { gCenter = null; draw(); }
    return;
  }
  if (e.key === 'Backspace') { if (TAB === 'map' && back()) e.preventDefault(); else if (TAB === 'graph' && gCenter) { e.preventDefault(); gCenter = null; draw(); } return; }
  if (/^[1-4]$/.test(e.key)) { setTab(['map', 'graph', 'done', 'trace'][+e.key - 1]); }
});

/* ---- at rest: MAP level 1 ---- */
renderMap();
</script>
