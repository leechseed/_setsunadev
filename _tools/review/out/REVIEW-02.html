<title>Character System Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- SYSTEM REVIEW · the close-out page every story system ends with (BOLO 100) ----
     DARK only, no toggle. Creator-cases palette, accent orange. Thin chrome: one 44px strip.
     Built by _tools/review/build.py from the system's docs; nothing on this page is hand-typed. */
  :root {
    --bg: #141210; --panel: #1c1916; --panel-2: #24201c; --line: #2e2925; --line-2: #403933;
    --ink: #e8e2db; --dim: #9a9088; --dim-2: #6f665f;
    --acc: #FF5A1F; --acc-ink: #ff8a5c; --acc-soft: #3a1e12;
    --ok: #7fc98a; --ok-soft: #17291a; --warn: #e0a84a; --warn-soft: #33270f;
    --k-system: #e8e2db; --k-doc: #7aa2d6; --k-layer: #FF5A1F; --k-field: #9a9088; --k-book: #5fb3b3; --k-external: #e0a84a;
    --display: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: #141210; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  ::selection { background: var(--acc-soft); }
  .mono { font-family: var(--mono); }
  .lbl { font-family: var(--display); font-weight: 600; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .t { color: var(--acc-ink); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--acc-ink) 60%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }
  code.inl { font-family: var(--mono); font-size: .88em; background: var(--panel-2); padding: 0 4px; color: var(--ink); }
  a.t code.inl { color: inherit; }
  .pathref { font-family: var(--mono); font-size: .9em; color: var(--dim); border-bottom: 1px dashed var(--line-2); overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border: 1px solid currentColor; line-height: 1.6; white-space: nowrap; }
  .c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-acc { color: var(--acc-ink); } .c-dim { color: var(--dim); } .c-doc { color: var(--k-doc); }

  /* ---- the strip ---- */
  header.hd { position: sticky; top: 0; z-index: 30; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: color-mix(in srgb, var(--panel) 94%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .hd h1 { margin: 0; min-width: 0; flex: 0 1 auto; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd h1 b { color: var(--acc); font-weight: 700; }
  .hd .ver { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; }
  .badge { font-family: var(--display); font-weight: 700; font-size: 12.5px; letter-spacing: .14em; padding: 2px 9px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.done { color: var(--ok); background: var(--ok-soft); }
  .badge.open { color: var(--warn); background: var(--warn-soft); }
  .hd .sp { flex: 1; }
  .hd .about-btn { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border: 1px solid var(--line-2); color: var(--dim); white-space: nowrap; }
  .hd .about-btn:hover, .hd .about-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--acc); }
  .about { position: fixed; z-index: 45; top: 50px; right: 16px; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 70px); overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--acc); box-shadow: var(--shadow); padding: 14px 16px; font-size: 13px; }
  .about dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
  .about dt { font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }
  .about dd { margin: 0; overflow-wrap: anywhere; color: var(--ink); }
  .about p { margin: 10px 0 0; color: var(--dim); font-size: 12.5px; }

  nav.tabs { position: sticky; top: 44px; z-index: 29; display: flex; gap: 2px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: flex; align-items: baseline; gap: 7px; padding: 9px 14px 8px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); border-bottom: 2px solid transparent; }
  .tab small { font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: 0; color: var(--dim-2); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }

  main { padding: 14px 16px 64px; max-width: 1440px; margin: 0 auto; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 0 12px; }
  .panel-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
  .panel-head .sub { color: var(--dim); font-size: 13px; }

  /* ---- MAP ---- */
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 0 0 10px; font-family: var(--display); font-weight: 600; font-size: 13.5px; letter-spacing: .1em; text-transform: uppercase; }
  .crumb button { color: var(--dim); padding: 2px 4px; }
  .crumb button:hover { color: var(--ink); }
  .crumb .here { color: var(--ink); padding: 2px 4px; }
  .crumb .sep { color: var(--dim-2); }
  .crumb .lvl { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--dim-2); }
  .stage { position: relative; overflow-x: clip; }
  .stage > svg.wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 0; }
  .stage > .grid { position: relative; z-index: 1; display: grid; gap: 34px 40px; }
  path.w { fill: none; stroke-width: 1.4; opacity: .55; }
  path.w.acc { stroke: var(--acc); } path.w.dim { stroke: var(--line-2); stroke-dasharray: 4 4; opacity: .9; }
  path.w.mid { stroke: var(--dim); } path.w.warn { stroke: var(--warn); stroke-dasharray: 5 3; } path.w.ok { stroke: var(--ok); stroke-dasharray: 5 3; } path.w.doc { stroke: var(--k-doc); }
  .stage.hl path.w { opacity: .12; } .stage.hl path.w.on { opacity: 1; stroke-width: 2.2; }
  .box { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line-2); padding: 9px 11px 10px; min-width: 0; display: flex; flex-direction: column; gap: 3px; transition: border-color .12s; }
  @media (prefers-reduced-motion: reduce) { .box { transition: none; } }
  .box:hover { border-color: var(--dim); }
  .box.focus { border-color: var(--acc); box-shadow: inset 3px 0 0 var(--acc); }
  .box.mute { opacity: .82; }
  .box .id { font-family: var(--mono); font-size: 11px; color: var(--acc-ink); }
  .box .nm { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.12; letter-spacing: .04em; text-transform: uppercase; overflow-wrap: anywhere; }
  .box .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .box .ln { font-size: 12.5px; color: var(--dim); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .box .go { position: absolute; top: 8px; right: 10px; font-family: var(--mono); font-size: 11px; color: var(--acc-ink); }
  .g1 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (min-width: 1000px) {
    .g1.ring { display: block; height: 600px; }
    .g1.ring > .box { position: absolute; left: var(--x); top: var(--y); width: 196px; transform: translate(-50%, -50%); }
  }
  .g2 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g2 .main { grid-column: 1 / -1; max-width: 560px; justify-self: center; width: 100%; }
  .g2 .grp { grid-column: 1 / -1; margin: 0 0 -24px; }
  .g3 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 46px; }
  .g3 .tierh { border-top: 2px solid var(--line-2); padding-top: 5px; margin-bottom: -8px; }
  .g3 .tierh b { display: block; font-family: var(--display); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .g3 .tierh span { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .box.ext { border-style: dashed; border-color: var(--k-external); background: color-mix(in srgb, var(--warn-soft) 55%, var(--panel)); }
  .box.ext .nm { color: var(--warn); font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 14px 0 0; font-size: 12px; color: var(--dim); align-items: center; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
  .legend i.dash { border-top-style: dashed; }
  .note { margin-top: 16px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line-2); border-left: 3px solid var(--acc); font-size: 13.5px; }
  .note h3 { margin: 0 0 6px; font-family: var(--display); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
  .note ul { margin: 6px 0 0; padding-left: 18px; color: var(--dim); }
  .cols2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-top: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; }
  .card h3 small { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--dim); }
  .edgelist { display: grid; gap: 7px; font-size: 13px; }
  .edgelist .e { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .edgelist .e:last-child { border-bottom: 0; padding-bottom: 0; }
  .edgelist .e b { font-family: var(--mono); font-weight: 500; font-size: 12px; }
  .edgelist .e .k { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
  .edgelist .e q { color: var(--dim); quotes: none; }
  .edgelist .e .lnum { font-family: var(--mono); font-size: 10.5px; color: var(--dim-2); margin-right: 6px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; font-size: 13px; }
  .kv dt { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--dim); }

  /* level 4 */
  .l4 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  .l4 .q { font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
  .l4 .stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
  table.fl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.fl th { text-align: left; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding: 4px 6px; border-bottom: 1px solid var(--line-2); }
  table.fl td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.fl td.v { font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  table.fl tr.sub td:first-child { padding-left: 22px; }
  table.fl tr.sub td:first-child::before { content: "└ "; color: var(--dim-2); font-family: var(--mono); }
  table.fl td .n { display: block; font-size: 11.5px; color: var(--dim); }
  .tag-static { color: var(--k-doc); } .tag-dynamic { color: var(--acc-ink); } .tag-none { color: var(--dim-2); }
  .prose { font-size: 14px; line-height: 1.6; color: var(--ink); }
  .prose p { margin: 0; }
  .lnref { font-family: var(--mono); font-size: 11px; color: var(--dim-2); }
  .navrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .btn { font-family: var(--mono); font-size: 11.5px; padding: 4px 10px; border: 1px solid var(--line-2); color: var(--dim); background: var(--panel); white-space: nowrap; }
  .btn:hover { color: var(--ink); border-color: var(--acc); }
  .btn[aria-pressed="true"] { color: var(--ink); border-color: var(--acc); background: var(--acc-soft); }

  /* ---- GRAPH ---- */
  .gbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 10px; }
  .gbar input[type="search"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); padding: 5px 9px; width: 240px; max-width: 100%; }
  .gbar input[type="search"]:focus { border-color: var(--acc); outline: none; }
  .gbar label { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .gbar input[type="range"] { accent-color: var(--acc); width: 90px; }
  .gbar .stat { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-left: auto; }
  .gleg { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
  .gleg button { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--line-2); color: var(--ink); }
  .gleg button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .gleg button[aria-pressed="false"] { opacity: .4; }
  #gWrap { position: relative; border: 1px solid var(--line); background: radial-gradient(color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1px) 0 0 / 22px 22px, var(--panel); height: max(420px, calc(100vh - 210px)); overflow: hidden; }
  #gWrap svg { display: block; width: 100%; height: 100%; touch-action: none; }
  #gWrap .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; padding: 20px; text-align: center; }
  .gl line { stroke: var(--line-2); stroke-width: 1; }
  .gl line.k-layer-feeds-layer { stroke: var(--acc); stroke-width: 1.6; opacity: .8; }
  .gl line.k-source-feeds-layer { stroke: color-mix(in srgb, var(--k-book) 55%, transparent); }
  .gl line.k-depends-on { stroke: color-mix(in srgb, var(--k-doc) 55%, transparent); }
  .gl line.k-module-of { stroke: var(--k-doc); stroke-dasharray: 3 3; }
  .gn { cursor: pointer; }
  .gn circle { stroke: var(--bg); stroke-width: 1.5; }
  .gn.center circle { stroke: var(--ink); stroke-width: 2.5; }
  .gn text { font-family: var(--mono); font-size: 10px; fill: var(--dim); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .gn.kind-layer text, .gn.kind-system text, .gn.center text { fill: var(--ink); font-size: 11px; }
  .gn:focus-visible circle { stroke: var(--acc); stroke-width: 3; }
  .gn:hover circle { stroke: var(--ink); }

  /* ---- DONE ---- */
  .verdict { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 16px; margin: 0 0 14px; border: 1px solid var(--line-2); background: var(--panel); }
  .verdict .big { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .14em; line-height: 1; padding: 6px 14px; border: 2px solid currentColor; }
  .verdict p { margin: 0; color: var(--dim); font-size: 13.5px; max-width: 70ch; }
  .checks { display: grid; gap: 10px; margin: 0 0 22px; }
  .chk { border: 1px solid var(--line); background: var(--panel); }
  .chk summary { list-style: none; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 10px 12px; cursor: pointer; }
  .chk summary::-webkit-details-marker { display: none; }
  .chk .mk { font-family: var(--mono); font-weight: 500; font-size: 17px; line-height: 1; }
  .chk .lb { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
  .chk .sm { display: block; font-family: var(--body); font-weight: 400; font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
  .chk .ct { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
  .chk .ev { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 14px; padding: 4px 12px 12px 50px; font-size: 12px; }
  .chk .ev div { display: flex; gap: 6px; min-width: 0; align-items: baseline; }
  .chk .ev .k { font-family: var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chk .ev .v { font-family: var(--mono); color: var(--dim); white-space: nowrap; margin-left: auto; padding-left: 6px; }
  @media (max-width: 760px) { .chk .ev .v { white-space: normal; text-align: right; overflow-wrap: anywhere; } .chk .ev .k { flex: 0 1 auto; } }
  .closed { display: grid; gap: 12px; }
  .closed .vh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .closed .vh b { font-family: var(--mono); font-size: 15px; color: var(--acc-ink); }
  .closed .vh span { font-size: 13px; color: var(--dim); }
  .closed ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13.5px; }

  /* ---- TRACE ---- */
  .twrap { overflow: auto; max-height: calc(100vh - 190px); border: 1px solid var(--line); background: var(--panel); }
  table.tr { border-collapse: separate; border-spacing: 0; font-size: 12.5px; min-width: 100%; }
  table.tr th, table.tr td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px 6px; }
  table.tr thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); vertical-align: bottom; font-weight: 400; }
  table.tr thead th.bk { min-width: 54px; text-align: center; }
  table.tr thead th.bk .t { font-family: var(--mono); font-size: 11px; }
  table.tr thead th.bk small { display: block; font-size: 10.5px; color: var(--dim); white-space: nowrap; max-width: 76px; overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
  table.tr .rh { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; white-space: nowrap; min-width: 190px; }
  table.tr thead .rh { z-index: 3; background: var(--panel-2); }
  table.tr td.c { text-align: center; font-size: 14px; line-height: 1; }
  table.tr td.c.s { color: var(--acc); }
  table.tr td.c.w { color: var(--dim); }
  table.tr td.c.f { color: var(--k-book); font-size: 11px; }
  table.tr td.n { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }
  table.tr tr.lr .rh { font-family: var(--display); font-weight: 700; font-size: 13.5px; letter-spacing: .06em; }
  table.tr tr.lr .rh .x { width: 18px; display: inline-block; color: var(--dim); font-family: var(--mono); }
  table.tr tr.lr .rh .jump { text-transform: uppercase; color: var(--ink); text-align: left; }
  table.tr tr.lr .rh .jump:hover { color: var(--acc-ink); }
  table.tr tr.fr .rh { padding-left: 30px; font-size: 12px; }
  table.tr tr.fr td { background: color-mix(in srgb, var(--bg) 40%, var(--panel)); }
  table.tr tr.fr .rh { background: color-mix(in srgb, var(--bg) 40%, var(--panel)); }
  table.tr tfoot td { position: sticky; bottom: 0; background: var(--panel-2); font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: center; }
  table.tr tfoot td.rh { text-align: left; }

  /* ---- tooltips (the TM engine) ---- */
  .tip { position: fixed; z-index: 60; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--acc); box-shadow: var(--shadow); padding: 11px 13px 9px; font-size: 13.5px; line-height: 1.45; }
  .tip .th { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .tip .th b { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }

": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a>, <a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a> the Big Five, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri's psychology dimension, <a class=\"t\" data-t=\"PSY.05\" tabindex=\"0\">PSY.05<\/a> neurotype", "src_ids": ["BVX.0075", "BVX.0233", "BVX.1123", "PSY.05"], "src_links": [], "line": 97, "fields": ["CORE", "psychology_stack", "assigned_labels", "neurotype", "identity_frame", "label", "known_to_self"], "decl_html": "Cognitive and psychological mass. Governs all mental skill defaults, ideological frameworks, and problem-solving capacity. Default value: 10. Point cost: 20 pts per level above 10 (IQ equivalent). Carries <a class=\"t\" data-t=\"fld:psychology_stack\" tabindex=\"0\"><code class=\"inl\">psychology_stack<\/code><\/a> (call 12, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri — APPLIED 2.1.0): the psychology third of Egri's bone structure (moral standards, ambition, frustrations, temperament, attitude toward life, complexes, extrovert/introvert, abilities, qualities, IQ) as an auditable text checklist beneath the number, not replacing it. <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:identity_frame\" tabindex=\"0\"><code class=\"inl\">identity_frame<\/code><\/a> (the frame he names himself by: gender persona, orientation label, era category, and the gender script he plays for each audience). <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:assigned_labels\" tabindex=\"0\"><code class=\"inl\">assigned_labels<\/code><\/a> under <a class=\"t\" data-t=\"fld:identity_frame\" tabindex=\"0\"><code class=\"inl\">identity_frame<\/code><\/a> (CL5, Dynamic): list of {label: text, by: law | medicine | church | state | buyer | family | peers, year: integer, accepted: bool}. It holds the label an institution or buyer gives him, beside the one he names himself. <strong>Added 3.3.0 (RULED 2026-10-04, BOLO 100 follow-up, &quot;rec&quot;, CH-5):<\/strong> <a class=\"t\" data-t=\"fld:neurotype\" tabindex=\"0\"><code class=\"inl\">neurotype<\/code><\/a> (Static for <a class=\"t\" data-t=\"fld:label\" tabindex=\"0\"><code class=\"inl\">label<\/code><\/a> and <a class=\"t\" data-t=\"fld:known_to_self\" tabindex=\"0\"><code class=\"inl\">known_to_self<\/code><\/a>, Dynamic for the rest): {label: text, known_to_self: bool, masked_by: novelty | effort | none, attention_pattern: hyperfocus | scattered | mixed}. It records a stable cognitive pattern that shapes attention, follow-through and desire (PSY.05). The first months hide it behind novelty and hyperfocus. Later it surfaces as drift, forgotten tasks and resentment. Method line: store the condition as one cause among others, never as the explanation. The condition is never the only problem.", "decl_line": 190}, {"id": "L2", "name": "VITAL", "q": "How much physical and energetic presence does the body carry?", "tier": 1, "term": "l2-vital", "src_html": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a>, <a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a> the stress-response cascade, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri's physiology dimension", "src_ids": ["BVX.0075", "BVX.0233", "BVX.1123"], "src_links": [], "line": 98, "fields": ["VITAL", "physiology_stack", "body_capital"], "decl_html": "Physical and energetic presence. Governs body precision, endurance, reaction capacity, and physical expressiveness. Default value: 10. Point cost: 20 pts per level above 10 (DX equivalent). Carries <a class=\"t\" data-t=\"fld:physiology_stack\" tabindex=\"0\"><code class=\"inl\">physiology_stack<\/code><\/a> (call 12, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri — APPLIED 2.1.0): the physiology third of <a class=\"t\" data-t=\"the-bone-structure\" tabindex=\"0\">the bone structure<\/a> (heredity, appearance, defects, posture, health) as the same kind of text checklist. Heredity itself resolved to L7's <a class=\"t\" data-t=\"fld:hereditary_predisposition\" tabindex=\"0\"><code class=\"inl\">hereditary_predisposition<\/code><\/a>, not here — see L7. <strong>Added 3.0.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100, &quot;all rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:body_capital\" tabindex=\"0\"><code class=\"inl\">body_capital<\/code><\/a>, adults only: what the body is worth in the character's world, and to whom. <strong>Defined 3.2.0 (CL14, RULED 2026-10-04, BOLO 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:body_capital\" tabindex=\"0\"><code class=\"inl\">body_capital<\/code><\/a> (Dynamic, adults only) is {price_factors: list of {factor: masculinity | build | race | role, direction: up | down}, window: {curve, start_age, end_age}, venue_tier: integer, trust_signal: text, working_body_gap: text, embodied_cost: text}.", "decl_line": 192}, {"id": "L3", "name": "SOCIAL", "q": "How does the character project into and read the social world?", "tier": 1, "term": "l3-social", "src_html": "<a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a> <a class=\"t\" data-t=\"interpersonal-circumplex\" tabindex=\"0\">the interpersonal circumplex<\/a> (optional scored dial, 3.0.0), <a class=\"t\" data-t=\"BVX.0061\" tabindex=\"0\">Card (Characters and Viewpoint)<\/a> reputation, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri's sociology dimension, <a class=\"t\" data-t=\"MSX.12\" tabindex=\"0\">MSX.12<\/a> and <a class=\"t\" data-t=\"MSX.13\" tabindex=\"0\">MSX.13<\/a> standing by conduct", "src_ids": ["BVX.0233", "BVX.0061", "BVX.1123", "MSX.12", "MSX.13"], "src_links": [], "line": 99, "fields": ["SOCIAL", "sociology_stack", "community_membership", "standing", "circumplex", "pair_register", "civic_standing", "disclosure_posture", "voice_sheet", "knowledge_map", "agreement_style", "risk_management_practice", "self_presentation", "cover", "noticing_filter"], "decl_html": "Relational interface. Governs projection into the world, reception of others, social legibility, and reaction modifier math. Default value: 10. Point cost: 10 pts per level above 10 (HT equivalent). Carries <a class=\"t\" data-t=\"fld:sociology_stack\" tabindex=\"0\"><code class=\"inl\">sociology_stack<\/code><\/a> (call 12, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri — APPLIED 2.1.0): the sociology third of <a class=\"t\" data-t=\"the-bone-structure\" tabindex=\"0\">the bone structure<\/a> (class, occupation, education, home life, political affiliation) as text. <strong>Promoted 3.0.0 (RULED 2026-10-04, call 8):<\/strong> <a class=\"t\" data-t=\"interpersonal-circumplex\" tabindex=\"0\">the interpersonal circumplex<\/a> (<a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a>) is now an optional scored dial, <a class=\"t\" data-t=\"fld:circumplex\" tabindex=\"0\"><code class=\"inl\">circumplex<\/code><\/a> {agency, communion}, each −5..+5 (agency: yielding to dominant; communion: cold to warm). It is null by default. Victoria's stays null with the ⏸ marker. <strong>Added 2.4.0 (RULED 2026-10-04, wave 3, &quot;all rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:knowledge_map\" tabindex=\"0\"><code class=\"inl\">knowledge_map<\/code><\/a> (Sedgwick, <a class=\"t\" data-t=\"MSX.68\" tabindex=\"0\">MSX.68<\/a>), per relationship: what each knows, what each knows the other knows, and who may claim not to know; reveal, near-reveal and refusal scenes come from changes in the map. Shared with L9. <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:community_membership\" tabindex=\"0\"><code class=\"inl\">community_membership<\/code><\/a> (the chosen community, its places, press and codes, and the rooms he belongs in, with each room's code) · <a class=\"t\" data-t=\"fld:agreement_style\" tabindex=\"0\"><code class=\"inl\">agreement_style<\/code><\/a> (relationship agreements: fuzzy or legalistic, open or closed) · <a class=\"t\" data-t=\"fld:risk_management_practice\" tabindex=\"0\"><code class=\"inl\">risk_management_practice<\/code><\/a> (the safety rules he makes and keeps; shared with L6) · <a class=\"t\" data-t=\"fld:self_presentation\" tabindex=\"0\"><code class=\"inl\">self_presentation<\/code><\/a> (the desirable self he builds for a public: apps, sites, a brand). <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> Four fields accept a list of {ref, value} (CL1; see Library-pass rules). <a class=\"t\" data-t=\"fld:pair_register\" tabindex=\"0\"><code class=\"inl\">pair_register<\/code><\/a> (CL1, Dynamic): list keyed by character_id, each {attachment_dimensions {anxiety, avoidance}, pacing: slow | goal, rules: list of {rule: text, form: spoken | tacit, status: kept | bent | broken}, rule_gap: text or null}. <a class=\"t\" data-t=\"fld:agreement_style\" tabindex=\"0\"><code class=\"inl\">agreement_style<\/code><\/a> gains form: spoken | unspoken_pretense; symmetry: symmetric | asymmetric; veto: held | given | none, plus a cost note; reopen_triggers: list of text (CL3). Per-pair rule text lives in <code class=\"inl\">pair_register.rules<\/code>. <a class=\"t\" data-t=\"fld:civic_standing\" tabindex=\"0\"><code class=\"inl\">civic_standing<\/code><\/a> (CL6, Dynamic): {category: text, rank_or_score: number or null, rights_held: list, what_can_be_taken: list, by_whom: text, exemptions: list, last_reranked: story_beat}. Class modifies it. L3 <a class=\"t\" data-t=\"fld:disclosure_posture\" tabindex=\"0\"><code class=\"inl\">disclosure_posture<\/code><\/a> (CL7, Dynamic) is outness: list of {audience, concealed_trait, strategy: open | selective | covering | double_living | none, stake: text}, plus stages: list of {stage: self_recognition | circle | public, year}, cost_ledger: list of text, hiding_incentive: text or null. It is a view onto <a class=\"t\" data-t=\"fld:knowledge_map\" tabindex=\"0\"><code class=\"inl\">knowledge_map<\/code><\/a>, not a second store. L9 keeps its own <a class=\"t\" data-t=\"fld:disclosure_posture\" tabindex=\"0\"><code class=\"inl\">disclosure_posture<\/code><\/a> for the sexual-health register. <a class=\"t\" data-t=\"fld:knowledge_map\" tabindex=\"0\"><code class=\"inl\">knowledge_map<\/code><\/a> gains <a class=\"t\" data-t=\"fld:cover\" tabindex=\"0\"><code class=\"inl\">cover<\/code><\/a> (CL8, Dynamic): list of {kind: overcompensation | double_life | passing | hidden_in_plain_view, sized_to: text, cost: text}. For a double life, the writer picks one home per case, <a class=\"t\" data-t=\"fld:cover\" tabindex=\"0\"><code class=\"inl\">cover<\/code><\/a> or <a class=\"t\" data-t=\"fld:shadow_content\" tabindex=\"0\"><code class=\"inl\">shadow_content<\/code><\/a>. <a class=\"t\" data-t=\"fld:voice_sheet\" tabindex=\"0\"><code class=\"inl\">voice_sheet<\/code><\/a> (CL28, Dynamic): {register: text, dialect: text, native_pace: slow | even | fast, tic_with_reason: text, noticing_filter: list}. Derive <a class=\"t\" data-t=\"fld:noticing_filter\" tabindex=\"0\"><code class=\"inl\">noticing_filter<\/code><\/a> from <a class=\"t\" data-t=\"fld:sociology_stack\" tabindex=\"0\"><code class=\"inl\">sociology_stack<\/code><\/a> and L8 <a class=\"t\" data-t=\"fld:conditional_patterns\" tabindex=\"0\"><code class=\"inl\">conditional_patterns<\/code><\/a>. Texture keeps how the voice is narrated. <strong>Added 3.3.0 (RULED 2026-10-04, BOLO 100 follow-up, &quot;rec&quot;, CH-3):<\/strong> <a class=\"t\" data-t=\"fld:standing\" tabindex=\"0\"><code class=\"inl\">standing<\/code><\/a> on <a class=\"t\" data-t=\"fld:community_membership\" tabindex=\"0\"><code class=\"inl\">community_membership<\/code><\/a> (Dynamic): {earned_by: list of dated acts, vouched_by: list of character_ids, cost_to_lose: text}. It is the rank he earned inside the community, built on reliable conduct (MSX.12, MSX.13). Keep it apart from <a class=\"t\" data-t=\"fld:civic_standing\" tabindex=\"0\"><code class=\"inl\">civic_standing<\/code><\/a>, which is what the state assigns. A reputation he can lose is a plot handle.", "decl_line": 194}, {"id": "L4", "name": "WILL", "q": "How much resistance holds under pressure, and where does the capacity to decide bend?", "tier": 2, "term": "l4-will", "src_html": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a> <a class=\"t\" data-t=\"counter-will\" tabindex=\"0\">counter-will<\/a>, <a class=\"t\" data-t=\"BVX.0045\" tabindex=\"0\">Schmidt (45 Master Characters)<\/a> coping strategy, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> <a class=\"t\" data-t=\"strength-of-will\" tabindex=\"0\">strength of will<\/a>", "src_ids": ["BVX.0075", "BVX.0045", "BVX.1123"], "src_links": [], "line": 100, "fields": ["WILL", "coping_strategy", "locus_of_control", "system_stance", "resistance_mode"], "decl_html": "Redefined 2026-09-29 (call 13, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> <a class=\"t\" data-t=\"strength-of-will\" tabindex=\"0\">strength of will<\/a>): the capacity to decide under pressure, not raw toughness. Psychological resistance to coercion, manipulation, and systemic pressure is still what it governs, but the number measures whether a choice can be made at all, not how much punishment the character can absorb before bending. Derives from CORE by default (<code class=\"inl\">WILL = CORE<\/code>). Buyable up or down at 5 pts per level. Carries <a class=\"t\" data-t=\"fld:coping_strategy\" tabindex=\"0\"><code class=\"inl\">coping_strategy<\/code><\/a> (call 10, <a class=\"t\" data-t=\"BVX.0045\" tabindex=\"0\">Schmidt (45 Master Characters)<\/a> Schmidt's five strategies — APPLIED 2.1.0, sited on L4 rather than L8 per the 2026-09-29 ruling). <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:resistance_mode\" tabindex=\"0\"><code class=\"inl\">resistance_mode<\/code><\/a> (everyday tactics against a system: dress, space, passing, hidden worlds; 17 distills). <strong>Added 3.0.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100, &quot;all rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:locus_of_control\" tabindex=\"0\"><code class=\"inl\">locus_of_control<\/code><\/a> (internal ↔ external, −5..+5; −5 is fully internal, +5 fully external). <strong>Added 3.2.0 (RULED 2026-10-04, BOLO 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:system_stance\" tabindex=\"0\"><code class=\"inl\">system_stance<\/code><\/a> (CL25, Dynamic): cog | believer | mask | bystander | resister, plus offstage_audience: text. <a class=\"t\" data-t=\"fld:resistance_mode\" tabindex=\"0\"><code class=\"inl\">resistance_mode<\/code><\/a> covers how he resists. This field covers how he sits inside a system he does not resist.", "decl_line": 196}, {"id": "L5", "name": "WOUND", "q": "What accumulated damage failed to resolve, and how severe is it?", "tier": 2, "term": "l5-wound", "src_html": "<a class=\"t\" data-t=\"BVX.0209\" tabindex=\"0\">Puglisi & Ackerman (The Emotional Wound Thesaurus)<\/a> <a class=\"t\" data-t=\"wound-card\" tabindex=\"0\">the wound card<\/a>, <a class=\"t\" data-t=\"BVX.0196\" tabindex=\"0\">Corbett (The Art of Character)<\/a> <a class=\"t\" data-t=\"ghost\" tabindex=\"0\">the ghost<\/a>, <a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a> back-story placement", "src_ids": ["BVX.0209", "BVX.0196", "BVX.0075"], "src_links": [], "line": 101, "fields": ["WOUND", "severity", "triggers", "relational_refs", "mentor_state", "wound_kind", "wound_work", "setting_ref"], "decl_html": "Accumulated psychological damage that failed to resolve. Assigned during character history entry. High WOUND reduces effective WILL and SOCIAL under trigger conditions. Scale: 0 (undamaged) to 10 (functional collapse threshold) — this scale is now named <a class=\"t\" data-t=\"fld:severity\" tabindex=\"0\"><code class=\"inl\">severity<\/code><\/a> (call 6, <a class=\"t\" data-t=\"BVX.0209\" tabindex=\"0\">Puglisi & Ackerman (The Emotional Wound Thesaurus)<\/a> <a class=\"t\" data-t=\"wound-card\" tabindex=\"0\">the wound card<\/a>'s severity dial — APPLIED 2.1.0), the same number under Puglisi &amp; Ackerman's name for it, not a second value. Carries <a class=\"t\" data-t=\"fld:triggers\" tabindex=\"0\"><code class=\"inl\">triggers<\/code><\/a> (call 6, a list of the conditions that fire the wound) and <a class=\"t\" data-t=\"fld:relational_refs\" tabindex=\"0\"><code class=\"inl\">relational_refs<\/code><\/a> (call 1 folded into call 15, <a class=\"t\" data-t=\"BVX.0196\" tabindex=\"0\">Corbett (The Art of Character)<\/a> ghost/revenant — APPLIED 2.1.0): a list of <code class=\"inl\">{kind: ghost|revenant|mentor|shapeshifter, character_id, note}<\/code> entries, one relational field for every meaning this layer keys to another character, superseding the separate <code class=\"inl\">ghost_ref<\/code>/<code class=\"inl\">revenant_ref<\/code> fields originally proposed. <strong>Added 3.0.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100, &quot;all rec&quot;):<\/strong> <code class=\"inl\">minority_stress<\/code> is a trigger TYPE under <a class=\"t\" data-t=\"fld:triggers\" tabindex=\"0\"><code class=\"inl\">triggers<\/code><\/a>, not a field; a trigger of that type fires the wound through the strain of belonging to a stigmatized group. <strong>Added 3.2.0 (RULED 2026-10-04, BOLO 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:wound_kind\" tabindex=\"0\"><code class=\"inl\">wound_kind<\/code><\/a> (CL22, Static): injury_suffered | error_committed | loss_unrecognized, plus a note. <a class=\"t\" data-t=\"fld:wound_work\" tabindex=\"0\"><code class=\"inl\">wound_work<\/code><\/a> (CL22, Dynamic): none | avoided | reenacted_in_play | processed, plus terminating: bool. <a class=\"t\" data-t=\"fld:relational_refs\" tabindex=\"0\"><code class=\"inl\">relational_refs<\/code><\/a> kind also takes helper | opponent | sender | receiver | rival | beloved (CL15). <a class=\"t\" data-t=\"fld:mentor_state\" tabindex=\"0\"><code class=\"inl\">mentor_state<\/code><\/a> (CL15, Dynamic): present | absent | flawed. Each <a class=\"t\" data-t=\"fld:triggers\" tabindex=\"0\"><code class=\"inl\">triggers<\/code><\/a> entry takes an optional <a class=\"t\" data-t=\"fld:setting_ref\" tabindex=\"0\"><code class=\"inl\">setting_ref<\/code><\/a> {setting_id, S-layer} (CL30).", "decl_line": 198}, {"id": "L6", "name": "DRIVE", "q": "What fuels the active goal-pursuit, and from what source?", "tier": 2, "term": "l6-drive", "src_html": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a> super-objective, <a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a> the fifteen motivations, <a class=\"t\" data-t=\"BVX.0045\" tabindex=\"0\">Schmidt (45 Master Characters)<\/a> cares-about/motivates", "src_ids": ["BVX.0075", "BVX.0233", "BVX.0045"], "src_links": [], "line": 102, "fields": ["DRIVE", "futurity_stance", "want_need", "motivation_stack", "drive_texture", "false_belief", "wound_belief_set", "audience"], "decl_html": "Narrative motivation fuel. Derives from VITAL by default (<code class=\"inl\">DRIVE = VITAL<\/code>). Spent on active goal-pursuit; recovered through narrative <a class=\"t\" data-t=\"resolution\" tabindex=\"0\">resolution<\/a>. Buyable at 3 pts per level. <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:motivation_stack\" tabindex=\"0\"><code class=\"inl\">motivation_stack<\/code><\/a> (ordered motives, stated versus real) · <a class=\"t\" data-t=\"fld:drive_texture\" tabindex=\"0\"><code class=\"inl\">drive_texture<\/code><\/a> (the felt shape of the drive: more, risk, novelty, abundance). <strong>Added 3.0.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100, &quot;all rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:futurity_stance\" tabindex=\"0\"><code class=\"inl\">futurity_stance<\/code><\/a> (how the character holds the future: planned, hoped, foreclosed, or none). <strong>Added 3.2.0 (RULED 2026-10-04, BOLO 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:want_need\" tabindex=\"0\"><code class=\"inl\">want_need<\/code><\/a> (CL16, Dynamic): {want: text, need: text, false_belief: text, need_kind: psychological | moral, cost: text, fusion_beat: story_beat or null}. <a class=\"t\" data-t=\"fld:false_belief\" tabindex=\"0\"><code class=\"inl\">false_belief<\/code><\/a> links to L5 <a class=\"t\" data-t=\"fld:wound_belief_set\" tabindex=\"0\"><code class=\"inl\">wound_belief_set<\/code><\/a>, so one belief is stored once. <a class=\"t\" data-t=\"fld:motivation_stack\" tabindex=\"0\"><code class=\"inl\">motivation_stack<\/code><\/a> entries gain <a class=\"t\" data-t=\"fld:audience\" tabindex=\"0\"><code class=\"inl\">audience<\/code><\/a> (CL17, Dynamic): list of {who, named: bool}. <a class=\"t\" data-t=\"fld:futurity_stance\" tabindex=\"0\"><code class=\"inl\">futurity_stance<\/code><\/a> gains the values refused and horizon (CL27): planned, hoped, foreclosed, none, refused, horizon. Foreclosed means taken. Refused means he turns it down. <strong>Added 3.3.0 (RULED 2026-10-04, BOLO 100 follow-up, &quot;rec&quot;, CH-5):<\/strong> a note on <a class=\"t\" data-t=\"fld:drive_texture\" tabindex=\"0\"><code class=\"inl\">drive_texture<\/code><\/a>. Where the drive is hyperfocus, record when it fades. Write the fade as a state diff keyed to a checkpoint.", "decl_line": 200}, {"id": "L7", "name": "ORIGIN", "q": "What birth context and formation set the starting conditions?", "tier": 3, "term": "l7-origin", "src_html": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a> birth marks, <a class=\"t\" data-t=\"BVX.0061\" tabindex=\"0\">Card (Characters and Viewpoint)<\/a> justification, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> heredity", "src_ids": ["BVX.0075", "BVX.0061", "BVX.1123"], "src_links": [], "line": 103, "fields": ["origin_class", "origin_stability", "family_coherence", "origin_wound_seed", "tech_level", "system_exposure", "layers", "hereditary_predisposition", "life_script", "origin_disciplinary_formation", "setting_ref", "source", "version", "stance", "cost"], "decl_html": "Birth context, socioeconomic class, family architecture, environmental formation, and system exposure timing. Numeric variables feed WOUND base and SOCIAL defaults. Carries <a class=\"t\" data-t=\"fld:hereditary_predisposition\" tabindex=\"0\"><code class=\"inl\">hereditary_predisposition<\/code><\/a> (call 12, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> Egri's one homeless field — APPLIED 2.1.0; &quot;provisional&quot; dropped 3.0.0, RULED 2026-10-04, a full L7 field): the trait or tendency inherited rather than formed, the field that fit neither ORIGIN nor VITAL cleanly and is parked here on the origin side of that seam. <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:origin_disciplinary_formation\" tabindex=\"0\"><code class=\"inl\">origin_disciplinary_formation<\/code><\/a> (the institution that bonded and policed him: team, unit, club, church). <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:layers\" tabindex=\"0\"><code class=\"inl\">layers<\/code><\/a> under <a class=\"t\" data-t=\"fld:system_exposure\" tabindex=\"0\"><code class=\"inl\">system_exposure<\/code><\/a> (CL6, Static): list of {regime: text, years: range, trace_still_showing: bool}. <a class=\"t\" data-t=\"fld:system_exposure\" tabindex=\"0\"><code class=\"inl\">system_exposure<\/code><\/a> holds when he met the system. L3 <a class=\"t\" data-t=\"fld:civic_standing\" tabindex=\"0\"><code class=\"inl\">civic_standing<\/code><\/a> holds the standing it gives him now. <a class=\"t\" data-t=\"fld:life_script\" tabindex=\"0\"><code class=\"inl\">life_script<\/code><\/a> (CL29): {source: text, version: text, stance: accept | bend | refuse, cost: text}. <a class=\"t\" data-t=\"fld:source\" tabindex=\"0\"><code class=\"inl\">source<\/code><\/a> and <a class=\"t\" data-t=\"fld:version\" tabindex=\"0\"><code class=\"inl\">version<\/code><\/a> are Static. <a class=\"t\" data-t=\"fld:stance\" tabindex=\"0\"><code class=\"inl\">stance<\/code><\/a> and <a class=\"t\" data-t=\"fld:cost\" tabindex=\"0\"><code class=\"inl\">cost<\/code><\/a> are Dynamic. L11 <a class=\"t\" data-t=\"fld:growth_requirement\" tabindex=\"0\"><code class=\"inl\">growth_requirement<\/code><\/a> may read <a class=\"t\" data-t=\"fld:stance\" tabindex=\"0\"><code class=\"inl\">stance<\/code><\/a>. <a class=\"t\" data-t=\"fld:origin_class\" tabindex=\"0\"><code class=\"inl\">origin_class<\/code><\/a> and <a class=\"t\" data-t=\"fld:origin_disciplinary_formation\" tabindex=\"0\"><code class=\"inl\">origin_disciplinary_formation<\/code><\/a> entries take an optional <a class=\"t\" data-t=\"fld:setting_ref\" tabindex=\"0\"><code class=\"inl\">setting_ref<\/code><\/a> {setting_id, S-layer} (CL30).", "decl_line": 202}, {"id": "L8", "name": "IMPRINT", "q": "What formative conditioning locked in before the story began?", "tier": 3, "term": "l8-imprint", "src_html": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a>, <a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a> life-stage emotional concerns, <a class=\"t\" data-t=\"BVX.1127\" tabindex=\"0\">Levine & Heller (Attached)<\/a> attachment theory", "src_ids": ["BVX.0075", "BVX.0233", "BVX.1127"], "src_links": [], "line": 104, "fields": ["attachment_style", "attachment_style_score", "attachment_dimensions", "protest_behaviors", "deactivating_strategies", "emotional_range", "conditional_patterns", "imprint_flexibility", "secure_base_object", "appeasement_strategies", "vandalism_event", "somatic_archive", "sexual_script_acquisition", "polarity_role"], "decl_html": "Formative emotional conditioning. Attachment architecture, emotional range, and operational belief patterns established prior to story entry. The field list is now <a class=\"t\" data-t=\"BVX.1127\" tabindex=\"0\">Levine & Heller (Attached)<\/a> Levine &amp; Heller, <em>Attached<\/em> (call 14, APPLIED 2.1.0): <a class=\"t\" data-t=\"fld:attachment_style\" tabindex=\"0\"><code class=\"inl\">attachment_style<\/code><\/a> as a four-way enum (secure · anxious · avoidant · fearful_avoidant), a two-dimension <a class=\"t\" data-t=\"fld:attachment_dimensions\" tabindex=\"0\"><code class=\"inl\">attachment_dimensions<\/code><\/a> {anxiety, avoidance} beside the existing scalar <a class=\"t\" data-t=\"fld:attachment_style_score\" tabindex=\"0\"><code class=\"inl\">attachment_style_score<\/code><\/a>, and new list fields <a class=\"t\" data-t=\"fld:protest_behaviors\" tabindex=\"0\"><code class=\"inl\">protest_behaviors<\/code><\/a> and <a class=\"t\" data-t=\"fld:deactivating_strategies\" tabindex=\"0\"><code class=\"inl\">deactivating_strategies<\/code><\/a>. <code class=\"inl\">primary_attachment_object<\/code> is renamed <a class=\"t\" data-t=\"fld:secure_base_object\" tabindex=\"0\"><code class=\"inl\">secure_base_object<\/code><\/a>; the old name is kept as a read alias, the only rename in this bump. <strong>Added 2.3.0 (RULED 2026-10-04, wave 2, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:vandalism_event\" tabindex=\"0\"><code class=\"inl\">vandalism_event<\/code><\/a> (Money, <a class=\"t\" data-t=\"PSY.54\" tabindex=\"0\">PSY.54<\/a>): the dated early event that bent the lovemap, paired with L9's <a class=\"t\" data-t=\"fld:template_origin\" tabindex=\"0\"><code class=\"inl\">template_origin<\/code><\/a>; <a class=\"t\" data-t=\"fld:somatic_archive\" tabindex=\"0\"><code class=\"inl\">somatic_archive<\/code><\/a> (Paasonen, <a class=\"t\" data-t=\"MSX.67\" tabindex=\"0\">MSX.67<\/a>): what the body has learned to answer, built up by habit, with no trauma story required. <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:sexual_script_acquisition\" tabindex=\"0\"><code class=\"inl\">sexual_script_acquisition<\/code><\/a> (who and what taught him what sex means, and at which level). <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:vandalism_event\" tabindex=\"0\"><code class=\"inl\">vandalism_event<\/code><\/a> gains Static sub-fields (CL21): valence: taught | rewired | wounded | mixed; what_it_taught: text; what_it_still_powers: text; place; year. Adult formative scenes live here, per the 10/4 merge. <a class=\"t\" data-t=\"fld:appeasement_strategies\" tabindex=\"0\"><code class=\"inl\">appeasement_strategies<\/code><\/a> (CL23, Dynamic): list of text, beside <a class=\"t\" data-t=\"fld:protest_behaviors\" tabindex=\"0\"><code class=\"inl\">protest_behaviors<\/code><\/a> and <a class=\"t\" data-t=\"fld:deactivating_strategies\" tabindex=\"0\"><code class=\"inl\">deactivating_strategies<\/code><\/a>. It covers self-erasure by submission. Cross-reference L9 <a class=\"t\" data-t=\"fld:polarity_role\" tabindex=\"0\"><code class=\"inl\">polarity_role<\/code><\/a>, so a chosen submissive role is told apart from a defense.", "decl_line": 204}, {"id": "L9", "name": "EROS", "q": "How is desire structured, armored, and made safe?", "tier": 3, "term": "l9-eros", "src_html": "<a class=\"t\" data-t=\"BVX.0075\" tabindex=\"0\">Davis (Creating Compelling Characters)<\/a> sexuality as attitude, the L9 v2 doc, <span class=\"pathref\" title=\"../../../../_CANON_NODES/victoria-midnight-L9-eros.md\">victoria-midnight-L9-eros.md<\/span>, the 3.3.0 craft and exchange books (<a class=\"t\" data-t=\"MSX.11\" tabindex=\"0\">MSX.11<\/a>–<a class=\"t\" data-t=\"MSX.15\" tabindex=\"0\">MSX.15<\/a>, <a class=\"t\" data-t=\"PSY.02\" tabindex=\"0\">PSY.02<\/a>), and the <a class=\"t\" data-t=\"l9-eros\" tabindex=\"0\">L9 EROS<\/a> synthesis (RULED 2026-09-29, MSX.18–MSX.36, PSY.08–PSY.13), <span class=\"pathref\" title=\"📐%20ssot_02_l9_eros_synthesis.md\">ssot_02_l9_eros_synthesis.md<\/span>", "src_ids": ["BVX.0075", "MSX.11", "MSX.15", "PSY.02", "MSX.18", "MSX.19", "MSX.20", "MSX.21", "MSX.22", "MSX.23", "MSX.24", "MSX.25", "MSX.26", "MSX.27", "MSX.28", "MSX.29", "MSX.30", "MSX.31", "MSX.32", "MSX.33", "MSX.34", "MSX.35", "MSX.36", "PSY.08", "PSY.09", "PSY.10", "PSY.11", "PSY.12", "PSY.13"], "src_links": ["../../../../_CANON_NODES/victoria-midnight-L9-eros.md", "📐 ssot_02_l9_eros_synthesis.md"], "line": 105, "fields": ["erotic_blueprint_type", "arousal_curve", "desire_vector", "resolution_type", "group_size", "group_position", "erotic_craft", "power_exchange", "consent_posture", "client_script", "signal_fluency", "shame_index", "exposure_shame", "role_shame", "armor_index", "satisfaction_cycle_truncation", "erotic_safety_precondition", "erotic_safety_precondition_scope", "intimacy_mode", "disclosure_posture", "template_origin", "compersion", "fantasy_ledger", "desire_object", "pleasure_evidence", "sex_creed", "touch_rule", "dissolution", "compartment_practice", "attraction_channels", "risk_role", "risk_account", "orientation_dimensions", "charmed_circle_position", "resonance_profile", "knowledge_map", "core_erotic_theme", "negotiation", "signals", "debrief", "agreement_style", "risk_management_practice", "sexual_script_acquisition", "polarity_role", "love_lust_cleft", "training", "stage", "character_id", "container", "triangle_position"], "decl_html": "Psycho-sexual conditioning. Desire structure, erotic patterning, shame architecture, body armor, satisfaction-cycle integrity, safety preconditions, and intimacy mode. Nine sub-fields added 2026-09-29 (the <a class=\"t\" data-t=\"l9-eros\" tabindex=\"0\">L9 EROS<\/a> synthesis, RULED 2026-09-29, Chief: &quot;Rex&quot; — APPLIED 2.2.0), read against the 9/29 sexuality distill shelf (MSX.18–MSX.36, PSY.08–PSY.13), full derivation in <span class=\"pathref\" title=\"📐%20ssot_02_l9_eros_synthesis.md\">ssot_02_l9_eros_synthesis.md<\/span>: <a class=\"t\" data-t=\"fld:consent_posture\" tabindex=\"0\"><code class=\"inl\">consent_posture<\/code><\/a> alongside <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a>, distinct from <a class=\"t\" data-t=\"fld:erotic_safety_precondition\" tabindex=\"0\"><code class=\"inl\">erotic_safety_precondition<\/code><\/a> — a &quot;yes&quot; and a want are different facts (cites MSX.18, MSX.22, MSX.27, PSY.11); <a class=\"t\" data-t=\"fld:client_script\" tabindex=\"0\"><code class=\"inl\">client_script<\/code><\/a> — scripted↔spontaneous, revisable mid-scene, for staged or paid intimacy (cites MSX.18, MSX.19, MSX.27); <a class=\"t\" data-t=\"fld:signal_fluency\" tabindex=\"0\"><code class=\"inl\">signal_fluency<\/code><\/a> — fluent / functional / illiterate, nonverbal desire-and-consent literacy independent of desire's content (cites MSX.21, MSX.22, MSX.29); <a class=\"t\" data-t=\"fld:resolution_type\" tabindex=\"0\"><code class=\"inl\">resolution_type<\/code><\/a> under <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a> — terminating / additive, for desire that accumulates without a finish line (cites MSX.24, MSX.32, PSY.13); <a class=\"t\" data-t=\"fld:exposure_shame\" tabindex=\"0\"><code class=\"inl\">exposure_shame<\/code><\/a> and <a class=\"t\" data-t=\"fld:role_shame\" tabindex=\"0\"><code class=\"inl\">role_shame<\/code><\/a> splitting <a class=\"t\" data-t=\"fld:shame_index\" tabindex=\"0\"><code class=\"inl\">shame_index<\/code><\/a>, both 0–10, same convention — <a class=\"t\" data-t=\"fld:shame_index\" tabindex=\"0\"><code class=\"inl\">shame_index<\/code><\/a> kept as a read alias for <a class=\"t\" data-t=\"fld:exposure_shame\" tabindex=\"0\"><code class=\"inl\">exposure_shame<\/code><\/a>, the same pattern as L8's <a class=\"t\" data-t=\"fld:secure_base_object\" tabindex=\"0\"><code class=\"inl\">secure_base_object<\/code><\/a> rename (cites MSX.23, MSX.25, MSX.34); <a class=\"t\" data-t=\"fld:arousal_curve\" tabindex=\"0\"><code class=\"inl\">arousal_curve<\/code><\/a> under <a class=\"t\" data-t=\"fld:erotic_blueprint_type\" tabindex=\"0\"><code class=\"inl\">erotic_blueprint_type<\/code><\/a> — spike / plateau / current (cites MSX.23, MSX.30, MSX.32); <a class=\"t\" data-t=\"fld:erotic_safety_precondition_scope\" tabindex=\"0\"><code class=\"inl\">erotic_safety_precondition_scope<\/code><\/a> on <a class=\"t\" data-t=\"fld:erotic_safety_precondition\" tabindex=\"0\"><code class=\"inl\">erotic_safety_precondition<\/code><\/a> — internal / external, for a chemical or structural precondition invisible to the scene itself, e.g. PrEP, U=U (cites MSX.18, MSX.24, MSX.29); <a class=\"t\" data-t=\"fld:disclosure_posture\" tabindex=\"0\"><code class=\"inl\">disclosure_posture<\/code><\/a> on L9 — the sexual-health disclosure register, cross-linked to but distinct from L3's own <a class=\"t\" data-t=\"fld:disclosure_posture\" tabindex=\"0\"><code class=\"inl\">disclosure_posture<\/code><\/a> (cites MSX.28, MSX.29, MSX.31, MSX.35); and <a class=\"t\" data-t=\"fld:template_origin\" tabindex=\"0\"><code class=\"inl\">template_origin<\/code><\/a>, a relational pointer from L9 to the <a class=\"t\" data-t=\"l8-imprint\" tabindex=\"0\">L8 imprint<\/a> event a character's adult desire is downstream of, echoing L5's <a class=\"t\" data-t=\"fld:relational_refs\" tabindex=\"0\"><code class=\"inl\">relational_refs<\/code><\/a> pattern (cites PSY.08, PSY.13, MSX.23). <code class=\"inl\">erotic_pacing<\/code> (MSX.26, MSX.33) is adopted as a Core Methodology writing rule above, not a field. <strong>Added 2.3.0 (RULED 2026-10-04, wave 2, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:orientation_dimensions\" tabindex=\"0\"><code class=\"inl\">orientation_dimensions<\/code><\/a> (Laumann, <a class=\"t\" data-t=\"PSY.53\" tabindex=\"0\">PSY.53<\/a>): behavior · desire · identity as three separate settings, so a character can want and never act, or act and never name it; Kinsey's 0–6 rides along as a per-age score (<a class=\"t\" data-t=\"PSY.50\" tabindex=\"0\">PSY.50<\/a>). <a class=\"t\" data-t=\"fld:template_origin\" tabindex=\"0\"><code class=\"inl\">template_origin<\/code><\/a> now also holds the lovemap design itself, the fixed erotic template (Money, <a class=\"t\" data-t=\"PSY.54\" tabindex=\"0\">PSY.54<\/a>). <a class=\"t\" data-t=\"fld:charmed_circle_position\" tabindex=\"0\"><code class=\"inl\">charmed_circle_position<\/code><\/a> (Rubin, <a class=\"t\" data-t=\"MSX.46\" tabindex=\"0\">MSX.46<\/a>): for each act the character wants, which side of the world's good-sex line it falls on and how they carry it; it reads beside <a class=\"t\" data-t=\"fld:consent_posture\" tabindex=\"0\"><code class=\"inl\">consent_posture<\/code><\/a>; adults only. <a class=\"t\" data-t=\"fld:resonance_profile\" tabindex=\"0\"><code class=\"inl\">resonance_profile<\/code><\/a> (Paasonen, <a class=\"t\" data-t=\"MSX.67\" tabindex=\"0\">MSX.67<\/a>): what lands now, how it shifts, and how it goes stale through habit. <strong>Added 2.4.0 (RULED 2026-10-04, wave 3, &quot;all rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:template_origin\" tabindex=\"0\"><code class=\"inl\">template_origin<\/code><\/a> gains <a class=\"t\" data-t=\"fld:core_erotic_theme\" tabindex=\"0\"><code class=\"inl\">core_erotic_theme<\/code><\/a>, one sentence per lead, worded from its wound (Morin, <a class=\"t\" data-t=\"PSY.63\" tabindex=\"0\">PSY.63<\/a>); <a class=\"t\" data-t=\"fld:arousal_curve\" tabindex=\"0\"><code class=\"inl\">arousal_curve<\/code><\/a> gains an excitation/inhibition setting, SES · SIS1 · SIS2 (Bancroft, <a class=\"t\" data-t=\"PSY.58\" tabindex=\"0\">PSY.58<\/a>); <a class=\"t\" data-t=\"fld:consent_posture\" tabindex=\"0\"><code class=\"inl\">consent_posture<\/code><\/a> gains three sub-fields, <a class=\"t\" data-t=\"fld:negotiation\" tabindex=\"0\"><code class=\"inl\">negotiation<\/code><\/a> · <a class=\"t\" data-t=\"fld:signals\" tabindex=\"0\"><code class=\"inl\">signals<\/code><\/a> · <a class=\"t\" data-t=\"fld:debrief\" tabindex=\"0\"><code class=\"inl\">debrief<\/code><\/a>, plus the consent model the character works from (Wiseman, <a class=\"t\" data-t=\"MSX.80\" tabindex=\"0\">MSX.80<\/a>; Barker, <a class=\"t\" data-t=\"PSY.65\" tabindex=\"0\">PSY.65<\/a>), kept inside the one variable; L9 reads L3's <a class=\"t\" data-t=\"fld:knowledge_map\" tabindex=\"0\"><code class=\"inl\">knowledge_map<\/code><\/a>. <strong>Added 2.5.0 (RULED 2026-10-04, the schema pass, &quot;all recommendations&quot;):<\/strong> <a class=\"t\" data-t=\"fld:polarity_role\" tabindex=\"0\"><code class=\"inl\">polarity_role<\/code><\/a> (top · bottom · switch · dom · sub, chosen or assigned) · <a class=\"t\" data-t=\"fld:love_lust_cleft\" tabindex=\"0\"><code class=\"inl\">love_lust_cleft<\/code><\/a> (how he settles saintly love against sinful lust). <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:intimacy_mode\" tabindex=\"0\"><code class=\"inl\">intimacy_mode<\/code><\/a> values (CL2): partnered_merge | parallel_presence | solo_directed | bounded_no_strings. The separate {mode, context} pairs are dropped, because the {ref, value} list does that job. L9 <a class=\"t\" data-t=\"fld:disclosure_posture\" tabindex=\"0\"><code class=\"inl\">disclosure_posture<\/code><\/a> is the sexual-health register only (MSX.28). L3 holds outness (CL7). <a class=\"t\" data-t=\"fld:consent_posture\" tabindex=\"0\"><code class=\"inl\">consent_posture<\/code><\/a> gains (CL4, all Dynamic): scope: per_act | per_scene | standing; redefended_per_scene: bool; enthusiasm_standard: required | not_required; precommitments: list of text; veto_points: list of named checkpoints; limits: {hard: list, soft: list}; recall: match | diverge. The consent-model values extend to affirmative | SSC | RACK | negotiated_safety | <a class=\"t\" data-t=\"limit-dynamic\" tabindex=\"0\">limit<\/a> | consensual_minimalism. <a class=\"t\" data-t=\"fld:compersion\" tabindex=\"0\"><code class=\"inl\">compersion<\/code><\/a> under <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a> (CL3, Dynamic): {level 0–10, kind: erotic | emotional | none, learned: bool}. <a class=\"t\" data-t=\"fld:exposure_shame\" tabindex=\"0\"><code class=\"inl\">exposure_shame<\/code><\/a> gains direction: self | partner | group | down_hierarchy | none, and coping_style: attack_self | withdrawal | attack_other | avoidance. <a class=\"t\" data-t=\"fld:role_shame\" tabindex=\"0\"><code class=\"inl\">role_shame<\/code><\/a> gains target: erection | orgasm | pretense | receiving | initiative | femininity | other (CL10). <a class=\"t\" data-t=\"fld:resonance_profile\" tabindex=\"0\"><code class=\"inl\">resonance_profile<\/code><\/a> holds fantasy and practice as two registers that may differ, plus type_tags: list of text and exceeds_type: bool (CL11). <a class=\"t\" data-t=\"fld:fantasy_ledger\" tabindex=\"0\"><code class=\"inl\">fantasy_ledger<\/code><\/a> under <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a> (CL11, Dynamic): list of {theme, told_to: list, acted: yes | no, real_vs_imagined: text}. Theme values (PSY.62): multipartner | power_control | novelty | taboo | partner_sharing | passion_romance | non_conventional. A fantasy that fails the consent or risk test stays fantasy. CL12 moves <a class=\"t\" data-t=\"fld:pleasure_evidence\" tabindex=\"0\"><code class=\"inl\">pleasure_evidence<\/code><\/a> out of <a class=\"t\" data-t=\"fld:resonance_profile\" tabindex=\"0\"><code class=\"inl\">resonance_profile<\/code><\/a> to a sub-field of <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a>: {asks_for: text, accepts: text}. Beside it, <a class=\"t\" data-t=\"fld:desire_object\" tabindex=\"0\"><code class=\"inl\">desire_object<\/code><\/a>: pleasure | activity | being_wanted | the_others_pleasure; and <a class=\"t\" data-t=\"fld:sex_creed\" tabindex=\"0\"><code class=\"inl\">sex_creed<\/code><\/a>: reproductive | romantic | pleasure | communication. All three are Dynamic. <a class=\"t\" data-t=\"fld:polarity_role\" tabindex=\"0\"><code class=\"inl\">polarity_role<\/code><\/a> gains reason: proof | giving | release | rank | market; reversal_wish: text (feeds <a class=\"t\" data-t=\"fld:shadow_content\" tabindex=\"0\"><code class=\"inl\">shadow_content<\/code><\/a> as denied_wish); history: list of {role, when, taught_by, <a class=\"t\" data-t=\"outcome-dynamic\" tabindex=\"0\">outcome<\/a>}; stage: beginner | working | fluent (CL13). <a class=\"t\" data-t=\"fld:touch_rule\" tabindex=\"0\"><code class=\"inl\">touch_rule<\/code><\/a> {gives: text, receives: text, no_touch: bool} and <a class=\"t\" data-t=\"fld:dissolution\" tabindex=\"0\"><code class=\"inl\">dissolution<\/code><\/a> {depth 0–10, with: text} join it, both Dynamic. <a class=\"t\" data-t=\"fld:arousal_curve\" tabindex=\"0\"><code class=\"inl\">arousal_curve<\/code><\/a> stays Static (CL19). Its Static sub-fields: signature {amplitude 0–10, areas: list, speed: slow | medium | fast, time_to_peak_min: integer, spasm_size 0–10} and climb_rule (a closing signal drops the climb one step). Its Dynamic sub-fields: concordance: aligned | decoupled | variable; refractory_minutes: integer or null. <a class=\"t\" data-t=\"fld:erotic_safety_precondition\" tabindex=\"0\"><code class=\"inl\">erotic_safety_precondition<\/code><\/a> gains <a class=\"t\" data-t=\"fld:risk_role\" tabindex=\"0\"><code class=\"inl\">risk_role<\/code><\/a> (CL20, Dynamic): precondition | spark | trust_token. <a class=\"t\" data-t=\"fld:risk_management_practice\" tabindex=\"0\"><code class=\"inl\">risk_management_practice<\/code><\/a> gains <a class=\"t\" data-t=\"fld:risk_account\" tabindex=\"0\"><code class=\"inl\">risk_account<\/code><\/a> (CL20, Dynamic): justification | excuse | informed_consent_frame | none. <a class=\"t\" data-t=\"fld:compartment_practice\" tabindex=\"0\"><code class=\"inl\">compartment_practice<\/code><\/a> (CL24, Dynamic): {technique: schedule | dissociation | ritual_boundary | rule_set, reserved_act: text, leak_point: text}. The leak point feeds SHADOW. <a class=\"t\" data-t=\"fld:attraction_channels\" tabindex=\"0\"><code class=\"inl\">attraction_channels<\/code><\/a> under <a class=\"t\" data-t=\"fld:orientation_dimensions\" tabindex=\"0\"><code class=\"inl\">orientation_dimensions<\/code><\/a> (CL26, Dynamic): sexual, romantic, sensual, platonic, aesthetic, each integer 0–10 or null, each with its own target gender. A null sexual channel makes <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a> run non-terminating. <strong>Added 3.3.0 (RULED 2026-10-04, BOLO 100 follow-up, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:erotic_craft\" tabindex=\"0\"><code class=\"inl\">erotic_craft<\/code><\/a> (CH-1, Static for <a class=\"t\" data-t=\"fld:training\" tabindex=\"0\"><code class=\"inl\">training<\/code><\/a>, Dynamic for the rest): {domains: list, level: novice | competent | expert | master, training: self | partner | teacher | tradition, flow_access: reliable | sometimes | blocked}. It records how good he is at the acts and whether he can reach the absorbed state that makes skill work (MSX.11, MSX.14, MSX.15). Read it beside <a class=\"t\" data-t=\"fld:sexual_script_acquisition\" tabindex=\"0\"><code class=\"inl\">sexual_script_acquisition<\/code><\/a>, which says who taught him what sex means. <a class=\"t\" data-t=\"fld:power_exchange\" tabindex=\"0\"><code class=\"inl\">power_exchange<\/code><\/a> (CH-2, Static, with <a class=\"t\" data-t=\"fld:stage\" tabindex=\"0\"><code class=\"inl\">stage<\/code><\/a> Dynamic): a list keyed by <a class=\"t\" data-t=\"fld:character_id\" tabindex=\"0\"><code class=\"inl\">character_id<\/code><\/a>, like <a class=\"t\" data-t=\"fld:pair_register\" tabindex=\"0\"><code class=\"inl\">pair_register<\/code><\/a>. Each entry is {scope: [physical, mental, financial], protocol: list of named rules, container: {space, ritual, time_bound}, duration: scene_bound | standing, stage: trial | trained | owned, function: free text, role_integrity: the rule against slipping out of role}. Cite <span class=\"pathref\" title=\"../01_NARRATIVE_FRAMEWORKS/📐%20ssot_01_touchstones_register.md\">Touchstone 1:1<\/span>, the bounded container, on <a class=\"t\" data-t=\"fld:container\" tabindex=\"0\"><code class=\"inl\">container<\/code><\/a>. <code class=\"inl\">polarity_role.reason<\/code> gains the top's rewards as values: empathy, creativity, bigness, nurturing, bullying, control, competence. Role bleed keeps its home in <a class=\"t\" data-t=\"fld:compartment_practice\" tabindex=\"0\"><code class=\"inl\">compartment_practice<\/code><\/a>, which walls off what <a class=\"t\" data-t=\"fld:power_exchange\" tabindex=\"0\"><code class=\"inl\">power_exchange<\/code><\/a> structures. <strong>CH-4, narrow fix (3.3.0, merge kept):<\/strong> the <a class=\"t\" data-t=\"fld:triangle_position\" tabindex=\"0\"><code class=\"inl\">triangle_position<\/code><\/a> merge into <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a> stands. Two sub-fields under <a class=\"t\" data-t=\"fld:desire_vector\" tabindex=\"0\"><code class=\"inl\">desire_vector<\/code><\/a> carry the group parts the books need (PSY.02). <a class=\"t\" data-t=\"fld:group_size\" tabindex=\"0\"><code class=\"inl\">group_size<\/code><\/a> (Dynamic) is the number of people in the group, with 3 as a triad. <a class=\"t\" data-t=\"fld:group_position\" tabindex=\"0\"><code class=\"inl\">group_position<\/code><\/a> (Dynamic) is {structure: couple_plus_third | triad | group, standing: primary | equal | guest | disposable, rule_setter: character_id, motives: list of identity | novelty | partner_wish | relationship_test | power, script_followed: FFM | MMF | other | none}. Pair <a class=\"t\" data-t=\"fld:group_position\" tabindex=\"0\"><code class=\"inl\">group_position<\/code><\/a> with the veto and symmetry rules in <a class=\"t\" data-t=\"fld:agreement_style\" tabindex=\"0\"><code class=\"inl\">agreement_style<\/code><\/a> and with <a class=\"t\" data-t=\"fld:compersion\" tabindex=\"0\"><code class=\"inl\">compersion<\/code><\/a>.", "decl_line": 206}, {"id": "L10", "name": "SHADOW", "q": "What is repressed, projected, or denied, and what does it generate?", "tier": 3, "term": "l10-shadow", "src_html": "<a class=\"t\" data-t=\"BVX.0064\" tabindex=\"0\">McKee (Character)<\/a> <a class=\"t\" data-t=\"true-character\" tabindex=\"0\">true character<\/a> vs characterization, <a class=\"t\" data-t=\"BVX.0196\" tabindex=\"0\">Corbett (The Art of Character)<\/a> secrets and the adaptation hierarchy, <a class=\"t\" data-t=\"BVX.0045\" tabindex=\"0\">Schmidt (45 Master Characters)<\/a> <a class=\"t\" data-t=\"shadow-face\" tabindex=\"0\">the shadow face<\/a>, <a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a> <a class=\"t\" data-t=\"dark-triad\" tabindex=\"0\">the Dark Triad<\/a> and Light Triad (optional scored dials, 3.0.0)", "src_ids": ["BVX.0064", "BVX.0196", "BVX.0045", "BVX.0233"], "src_links": [], "line": 106, "fields": ["shadow_density", "projection_tendency", "regression_pattern", "shadow_content", "dark_triad", "light_triad", "disinhibition_context", "moral_incongruence", "polarity_role", "reversal_wish"], "decl_html": "Repressed, projected, and denied content. High SHADOW values generate active disadvantage clusters and modify stress-state behavior. <strong>Promoted 3.0.0 (RULED 2026-10-04, call 8):<\/strong> <a class=\"t\" data-t=\"BVX.0233\" tabindex=\"0\">Pelican (The Science of Writing Characters)<\/a>'s Dark Triad is now an optional scored dial, <a class=\"t\" data-t=\"fld:dark_triad\" tabindex=\"0\"><code class=\"inl\">dark_triad<\/code><\/a> {narcissism, machiavellianism, psychopathy}, each 0–10. The Light Triad joins it as <a class=\"t\" data-t=\"fld:light_triad\" tabindex=\"0\"><code class=\"inl\">light_triad<\/code><\/a> {kantianism, humanism, faith_in_humanity}, each 0–10. Both are null by default. Victoria's stay null with the ⏸ marker. <strong>Added 2.4.0 (RULED 2026-10-04, wave 3, &quot;all rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:moral_incongruence\" tabindex=\"0\"><code class=\"inl\">moral_incongruence<\/code><\/a> (Burke, <a class=\"t\" data-t=\"MSX.84\" tabindex=\"0\">MSX.84<\/a>): <a class=\"t\" data-t=\"the-gap\" tabindex=\"0\">the gap<\/a> between what a character believes about his desire and what he does; a ready-made secret for scenes to test. <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> Each <a class=\"t\" data-t=\"fld:shadow_content\" tabindex=\"0\"><code class=\"inl\">shadow_content<\/code><\/a> entry carries a kind (CL9): denied_wish | assigned_by_world | feared_double | standing_alarm | scrubbed_bond | imposed_self_image. The tag stays as it was. <a class=\"t\" data-t=\"fld:reversal_wish\" tabindex=\"0\"><code class=\"inl\">reversal_wish<\/code><\/a> (L9 <a class=\"t\" data-t=\"fld:polarity_role\" tabindex=\"0\"><code class=\"inl\">polarity_role<\/code><\/a>) feeds denied_wish. <a class=\"t\" data-t=\"fld:disinhibition_context\" tabindex=\"0\"><code class=\"inl\">disinhibition_context<\/code><\/a> (CL18, Dynamic): {triggers: list of travel | venue | peers | substance | sanctioned_alter_state, scope: self_permitted | shadow_driven, authentic: bool}. Chemical effects on the body stay in <a class=\"t\" data-t=\"fld:arousal_curve\" tabindex=\"0\"><code class=\"inl\">arousal_curve<\/code><\/a>.", "decl_line": 208}, {"id": "L11", "name": "DESTINY", "q": "What is the character building toward, not where they stand?", "tier": 3, "term": "l11-destiny", "src_html": "<a class=\"t\" data-t=\"BVX.0045\" tabindex=\"0\">Schmidt (45 Master Characters)<\/a> the two journeys, <a class=\"t\" data-t=\"BVX.0196\" tabindex=\"0\">Corbett (The Art of Character)<\/a> <a class=\"t\" data-t=\"growth-vs-transformation\" tabindex=\"0\">growth vs transformation<\/a>, <a class=\"t\" data-t=\"BVX.0061\" tabindex=\"0\">Card (Characters and Viewpoint)<\/a> the four causes of change", "src_ids": ["BVX.0045", "BVX.0196", "BVX.0061"], "src_links": [], "line": 107, "fields": ["growth_axis", "resistance_index", "soul_evolution_archetype", "karmic_memory", "growth_requirement", "arc_type", "change_cause", "catalyst_archetype"], "decl_html": "Directional growth vector. The MC Solution element, growth requirement, resistance index, and soul evolution archetype. Describes what the character is building toward, not where they currently stand. Carries <a class=\"t\" data-t=\"fld:arc_type\" tabindex=\"0\"><code class=\"inl\">arc_type<\/code><\/a> and <a class=\"t\" data-t=\"fld:change_cause\" tabindex=\"0\"><code class=\"inl\">change_cause<\/code><\/a> (call 2, <a class=\"t\" data-t=\"BVX.0196\" tabindex=\"0\">Corbett (The Art of Character)<\/a> <a class=\"t\" data-t=\"growth-vs-transformation\" tabindex=\"0\">growth vs transformation<\/a>, <a class=\"t\" data-t=\"BVX.0061\" tabindex=\"0\">Card (Characters and Viewpoint)<\/a> the four causes of change — APPLIED 2.1.0) and <a class=\"t\" data-t=\"fld:catalyst_archetype\" tabindex=\"0\"><code class=\"inl\">catalyst_archetype<\/code><\/a> (call 10, <a class=\"t\" data-t=\"BVX.0045\" tabindex=\"0\">Schmidt (45 Master Characters)<\/a> growth-pairing — APPLIED 2.1.0).", "decl_line": 210}, {"id": "L12", "name": "FUNCTION", "q": "What narrative role and mechanical function does the character discharge?", "tier": 3, "term": "l12-function", "src_html": "<a class=\"t\" data-t=\"BVX.0089\" tabindex=\"0\">Dramatica<\/a> the eight archetypes, <a class=\"t\" data-t=\"BVX.0061\" tabindex=\"0\">Card (Characters and Viewpoint)<\/a> <a class=\"t\" data-t=\"card-hierarchy\" tabindex=\"0\">the hierarchy<\/a>, <a class=\"t\" data-t=\"BVX.0064\" tabindex=\"0\">McKee (Character)<\/a> <a class=\"t\" data-t=\"cast-map\" tabindex=\"0\">the cast map<\/a>, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> <a class=\"t\" data-t=\"the-pivotal-character\" tabindex=\"0\">the pivotal character<\/a>", "src_ids": ["BVX.0089", "BVX.0061", "BVX.0064", "BVX.1123"], "src_links": [], "line": 108, "fields": ["dramatica_archetype", "mc_problem_element", "methodology_element", "evaluation_element", "purpose_element", "narrative_invariant", "story_outcome", "story_judgement", "limit_type", "resolve", "convention_role"], "decl_html": "<a class=\"t\" data-t=\"BVX.0089\" tabindex=\"0\">Dramatica<\/a> narrative role, objective story function, throughline assignment, and mechanical purpose in the story engine. Bridges psychological construction to narrative mechanics. Rule (call 13, <a class=\"t\" data-t=\"BVX.1123\" tabindex=\"0\">Egri (The Art of Dramatic Writing)<\/a> <a class=\"t\" data-t=\"the-pivotal-character\" tabindex=\"0\">the pivotal character<\/a> — APPLIED 2.1.0): a Protagonist assignment requires a documented necessity, not just a storyform assignment — the character must be shown forced into the role, not merely placed there. <strong>Added 3.2.0 (RULED 2026-10-04, <a class=\"t\" data-t=\"bolo\" tabindex=\"0\">BOLO<\/a> 100 library pass, &quot;rec&quot;):<\/strong> <a class=\"t\" data-t=\"fld:convention_role\" tabindex=\"0\"><code class=\"inl\">convention_role<\/code><\/a> (CL15, Static, advisory): {genre_role: text, actant_slot: subject | object | sender | receiver | helper | opponent}. It stays blank when no genre applies. It never overrides <a class=\"t\" data-t=\"fld:dramatica_archetype\" tabindex=\"0\"><code class=\"inl\">dramatica_archetype<\/code><\/a>. The <span class=\"pathref\" title=\"🔮%20ssot_02_dramatica_integration_protocol.md\">Dramatica integration protocol<\/span> defines it.", "decl_line": 212}], "tiers": [{"n": 1, "layers": "L1–L3", "cls": "Flat", "budget": "~75 pts"}, {"n": 2, "layers": "L4–L6", "cls": "Standard", "budget": "~140 pts"}, {"n": 3, "layers": "L7–L12", "cls": "Deep", "budget": "Uncapped"}], "tier_note": "The 12-Layer system is modular. Tier depth determines character complexity and database weight. Tier 1 is sufficient for background characters. Tier 2 is sufficient for recurring supporting characters. Tier 3 is mandatory for all protagonists and antagonists.", "fields": {"CORE": {"name": "CORE", "layers": ["L
