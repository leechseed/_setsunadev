|Throughlines]]. The Command's RULED story spine; every rival plot model in the library maps onto it as a lens.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0089.md", "src": "BVX.0089"}, "BVX.0175": {"t": "McKee (Story)", "k": "book", "d": "Robert McKee's *Story*: the scene-level engine beneath Dramatica's signpost floor. Source of [[the-gap|the Gap]], the [[value-turn|value turn]], and the [[controlling-idea|Controlling Idea]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0175.md", "src": "BVX.0175"}, "BVX.0236": {"t": "Coyne (Story Grid)", "k": "book", "d": "Shawn Coyne's editorial X-ray: the [[five-commandments|Five Commandments]] recurring fractally at every unit from beat to global story, plus the [[foolscap|Foolscap]] intake and the genre [[genre-clover|five-leaf clover]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0236.md", "src": "BVX.0236"}, "BVX.0193": {"t": "Truby (Anatomy of Story)", "k": "book", "d": "John Truby's organic-body model: a story grows from one [[designing-principle|designing principle]] through the [[twenty-two-steps|22 steps]] to a hero's [[self-revelation|self-revelation]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0193.md", "src": "BVX.0193"}, "BVX.0163": {"t": "Snyder (Save the Cat!)", "k": "book", "d": "Blake Snyder's page-keyed commercial template: the [[beat-sheet|Beat Sheet]] (BS2), 15 fixed beats over ~110 pages, laid out on [[the-board|the Board]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0163.md", "src": "BVX.0163"}, "BVX.0191": {"t": "Truby (Anatomy of Genres)", "k": "book", "d": "John Truby's genre theory: fourteen [[the-fourteen-genres|fourteen genres]], each a [[moral-argument|moral argument]] proved through a fixed chapter schema, hero, opponent, and story world.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0191.md", "src": "BVX.0191"}, "BVX.0576": {"t": "Selbo (Film Genre for the Screenwriter)", "k": "book", "d": "Jule Selbo's screenwriting-craft genre text: genre as a contract built from [[the-icm|the ICM]], one [[overriding-genre|overriding genre]] stacking [[supporting-genre|supporting genres]], scored by percentage of scenes.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0576.md", "src": "BVX.0576"}, "BVX.0580": {"t": "Neale (Genre and Hollywood)", "k": "book", "d": "Steve Neale's institutional counter-weight: genre as a process among industry, critics, and audience, run through [[the-inter-textual-relay|the inter-textual relay]] and [[two-verisimilitudes|the two verisimilitudes]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0580.md", "src": "BVX.0580"}, "BVX.0581": {"t": "Bawarshi & Reiff (Genre)", "k": "book", "d": "The field's own reference guide: three incompatible traditions for what a genre is, resolving in Miller's [[typified-social-action|typified social action]], [[uptake|uptake]], and [[meta-genre|meta-genre]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0581.md", "src": "BVX.0581"}, "BVX.0614": {"t": "Todorov (The Fantastic)", "k": "book", "d": "Tzvetan Todorov's structuralist account of genre by reader position: [[the-hesitation|the hesitation]] between a natural and supernatural explanation, and its [[resolution-mode|resolution mode]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0614.md", "src": "BVX.0614"}, "BVX.0599": {"t": "Mendlesohn (Rhetorics of Fantasy)", "k": "book", "d": "Farah Mendlesohn's four categories, sorted by [[delivery-mode|delivery mode]]: [[portal-quest|portal-quest]], [[immersive-fantasy|immersive fantasy]], intrusion, liminal.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0599.md", "src": "BVX.0599"}, "grand-argument-story": {"t": "the Grand Argument", "k": "source-term", "d": "A story conceptually complete: every approach to one problem tried through four [[throughlines|throughlines]] until one is proven best. Dramatica's scope claim, not every story qualifies ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "story-mind": {"t": "the Story Mind", "k": "source-term", "d": "The premise that a complete story models one mind's problem-solving process, holistic not sequential. The generative claim under the [[grand-argument-story|Grand Argument]] ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "storyform": {"t": "the Storyform", "k": "source-term", "d": "The complete, locked blueprint of structural and dynamic answers, independent of the specific events that dramatize it. Two unrelated plots can share one storyform ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "throughlines": {"t": "the Four Throughlines", "k": "source-term", "d": "Overall Story (they), Main Character (I), Impact Character (you), Relationship Story (we): four seats around one problem, each holding a different Class. No rival model has all four ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "signpost": {"t": "Signpost", "k": "source-term", "d": "A fixed structural checkpoint, one per throughline, four per form, sixteen across a complete storyform. A [[journey|Journey]] carries a throughline between two signposts ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "journey": {"t": "Journey", "k": "source-term", "d": "The transition between two [[signpost|Signposts]] on one throughline; three journeys per throughline complete the four-signpost chain ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "driver-dynamic": {"t": "Driver", "k": "source-term", "d": "Action or Decision: which kind of event precipitates a turn. A story's driver matches at both the inciting event and the resolving event ([[BVX.0089]]). OXO's ruled story-level Driver is Action.", "w": "BVX.0089", "src": "BVX.0089"}, "limit-dynamic": {"t": "Limit", "k": "source-term", "d": "Timelock or Optionlock: whether tension comes from a closing clock or a shrinking set of options ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "outcome-dynamic": {"t": "Outcome", "k": "source-term", "d": "Success or Failure, measured objectively against the Overall Story goal, independent of [[judgment-dynamic|Judgment]]. OXO is ruled Failure ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "judgment-dynamic": {"t": "Judgment", "k": "source-term", "d": "Good or Bad, measured subjectively against the Main Character's personal fulfillment. Combines with [[outcome-dynamic|Outcome]] into one of four endings. OXO is ruled Good ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "crucial-element": {"t": "the Crucial Element", "k": "source-term", "d": "The single Element the Main Character shares with the Overall Story, the hinge between the objective and subjective arguments. Structural position, not plot centrality ([[BVX.0089]]).", "w": "BVX.0089", "src": "BVX.0089"}, "the-gap": {"t": "the Gap", "k": "source-term", "d": "McKee's engine: a minimal action provokes a world reaction bigger than expected, and the gap between what was expected and what was necessary is where the [[value-turn|turn]] lives. It does not close, it reopens bigger ([[BVX.0175]]).", "w": "BVX.0175", "src": "BVX.0175"}, "value-turn": {"t": "value turn", "k": "source-term", "d": "A value-charged condition flips polarity, plus to minus or the reverse. No turn, no scene. The scene-level minimum, R2 floor of the [[ladder|scale ladder]] ([[BVX.0175]]).", "w": "BVX.0175", "src": "BVX.0175"}, "controlling-idea": {"t": "Controlling Idea", "k": "source-term", "d": "One sentence, Value plus Cause, describing how and why life changes from the story's beginning condition to its end. Provable backward from the [[climax|Climax]] ([[BVX.0175]]).", "w": "BVX.0175", "src": "BVX.0175"}, "turning-point": {"t": "Turning Point", "k": "source-term", "d": "A scene's reversal, producing surprise, curiosity, insight and new direction. Coyne's taxonomy splits it into action or revelation ([[BVX.0175]], [[BVX.0236]]).", "w": "BVX.0175", "src": "BVX.0175"}, "crisis": {"t": "Crisis", "k": "source-term", "d": "The Obligatory Scene: an irreconcilable-goods decision at maximum pressure, no second chance. Never an easy choice ([[BVX.0175]], [[BVX.0236]]).", "w": "BVX.0175", "src": "BVX.0175"}, "climax": {"t": "Climax", "k": "source-term", "d": "A value swing at maximum charge, absolute and irreversible, with or without irony. The protagonist's choice must happen on stage ([[BVX.0175]], [[BVX.0236]]).", "w": "BVX.0175", "src": "BVX.0175"}, "resolution": {"t": "Resolution", "k": "source-term", "d": "The unit's close: subplot cleanup, spread of effects, or a courtesy to the audience. Must state what the [[climax|Climax]] means, not recap what happened ([[BVX.0175]], [[BVX.0236]]).", "w": "BVX.0175", "src": "BVX.0175"}, "inciting-incident": {"t": "Inciting Incident", "k": "source-term", "d": "The event that radically upsets life's balance, causal or coincidental, opening the chain the [[five-commandments|Five Commandments]] complete ([[BVX.0175]], [[BVX.0236]]).", "w": "BVX.0175", "src": "BVX.0175"}, "progressive-complications": {"t": "Progressive Complications", "k": "source-term", "d": "The Gap reopening at increasing risk, passing points of no return; complications must trend up, never retreat to a spent magnitude ([[BVX.0175]]).", "w": "BVX.0175", "src": "BVX.0175"}, "five-commandments": {"t": "the Five Commandments", "k": "source-term", "d": "[[inciting-incident|Inciting Incident]] → Progressive Complication → [[crisis|Crisis]] → [[climax|Climax]] → [[resolution|Resolution]]: every unit of story from beat to global story carries all five, fractally ([[BVX.0236]]).", "w": "BVX.0236", "src": "BVX.0236"}, "foolscap": {"t": "the Foolscap", "k": "source-term", "d": "A one-page diagnostic: Genre, conventions and obligatory scenes, point of view, objects of desire, controlling idea, and the Hook/Build/Payoff arc. Six questions, one screen ([[BVX.0236]]).", "w": "BVX.0236", "src": "BVX.0236"}, "obligatory-scene": {"t": "obligatory scene", "k": "source-term", "d": "A must-happen beat that pays off a genre's promise. Missing one means the story hasn't fulfilled its contract with the reader, no exemption for literary ambition ([[BVX.0236]]).", "w": "BVX.0236", "src": "BVX.0236"}, "genre-clover": {"t": "the five-leaf clover", "k": "source-term", "d": "Time, Reality, Style, Structure and Content genres: five independent audience-expectation axes nourishing one Global Story. Missing any leaf's promise breaks the contract ([[BVX.0236]]).", "w": "BVX.0236", "src": "BVX.0236"}, "best-bad-choice": {"t": "Best Bad Choice", "k": "source-term", "d": "One of Coyne's two crisis shapes: choosing the least-bad of two negatives. The other is [[crisis|irreconcilable goods]] ([[BVX.0236]]).", "w": "BVX.0236", "src": "BVX.0236"}, "designing-principle": {"t": "designing principle", "k": "source-term", "d": "A one-line strategy, not a genre template, that the whole story grows from: story process plus original execution. Distinguishes a premise (what happens) from what makes a story original ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "self-revelation": {"t": "self-revelation", "k": "source-term", "d": "The hero's awareness of his own need; the hero cannot know it at the start, or the story is already over. Strongest when paired with a [[ghost|double reversal]] in the opponent ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "ghost": {"t": "the ghost", "k": "source-term", "d": "An unresolved event from the hero's past acting as a counterdesire, \"sailing with a corpse in the cargo.\" Truby's name for the WOUND layer, dramatized structurally rather than dumped as backstory ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "character-web": {"t": "character web", "k": "source-term", "d": "All characters connect via four channels: story function, archetype, theme, opposition. A character is defined by who he is not, never built in isolation ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "four-corner-opposition": {"t": "four-corner opposition", "k": "source-term", "d": "Hero plus three opponents pushed to distinct value-corners, each attacking the hero's weakness a different way. Multiplies conflict from linear to a web ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "twenty-two-steps": {"t": "the 22 steps", "k": "source-term", "d": "The seven key steps (weakness/need → desire → opponent → plan → battle → self-revelation → new equilibrium) expanded to production detail. Every 22-step story is still a seven-step story underneath ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "revelations-sequence": {"t": "revelations sequence", "k": "source-term", "d": "Reveals must be logical, build in intensity, and come at increasing pace; the strongest reveal is a reversal. Plot's real spine is what the audience learns and when ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "passageway": {"t": "the passageway", "k": "source-term", "d": "A liminal threshold between subworlds (rabbit hole, wardrobe, mirror) that signals a rules-change on crossing. Has no home in the setting system's four axes or twelve layers yet, flagged OPEN ([[BVX.0193]]).", "w": "BVX.0193", "src": "BVX.0193"}, "the-board": {"t": "the Board", "k": "source-term", "d": "A four-row corkboard divided by act (Act One / Act Two-A / Act Two-B / Act Three), index cards per scene, roughly 40 cards. A pre-writing planning tool, not the script itself ([[BVX.0163]]).", "w": "BVX.0163", "src": "BVX.0163"}, "beat-sheet": {"t": "the Beat Sheet (BS2)", "k": "source-term", "d": "Fifteen beats pinned to specific pages of a ~110-page script: Opening Image, [[theme-stated|Theme Stated]], Catalyst, Break Into Two, Midpoint, All Is Lost, Break Into Three, Final Image and more ([[BVX.0163]]).", "w": "BVX.0163", "src": "BVX.0163"}, "theme-stated": {"t": "Theme Stated", "k": "source-term", "d": "Beat 2, page 5: an offhand line voicing the want-versus-need argument the rest of the script proves or disproves, before the hero understands it ([[BVX.0163]]).", "w": "BVX.0163", "src": "BVX.0163"}, "midpoint-all-is-lost": {"t": "Midpoint / All Is Lost", "k": "source-term", "d": "A matched, opposite-charge pair at pages 55 and 75: a false victory pairs with a false defeat and vice versa. All Is Lost always carries a whiff of death ([[BVX.0163]]).", "w": "BVX.0163", "src": "BVX.0163"}, "ten-genres": {"t": "the 10 genres", "k": "source-term", "d": "Snyder's mechanism-based genre wheel: Monster in the House, Golden Fleece, Out of the Bottle, Dude with a Problem, Rites of Passage, Buddy Love, Whydunit, Fool Triumphant, Institutionalized, Superhero ([[BVX.0163]]).", "w": "BVX.0163", "src": "BVX.0163"}, "ladder": {"t": "the scale ladder", "k": "rung", "d": "The Command's container hierarchy for plot units: [[r1-beat|R1 BEAT]] → [[r2-scene|R2 SCENE]] → [[r3-sequence|R3 SEQUENCE]] → [[r4-act|R4 ACT]] → [[r5-story|R5 STORY]]. plot_systems occupies these containers, it never invents a second hierarchy.", "w": "ssot_01_scale_ladder.md"}, "r1-beat": {"t": "R1 BEAT", "k": "rung", "d": "One exchange, action met by reaction: something tried, something answered, something now slightly different. Only the value micro-shift is required here, not the full [[five-commandments|Five Commandments]].", "w": "ssot_01_scale_ladder.md"}, "r2-scene": {"t": "R2 SCENE", "k": "rung", "d": "The smallest container that turns: a [[value-turn|value turn]] and all five commandments present. The scene-level floor of plot ([[BVX.0175]], [[BVX.0236]]).", "w": "ssot_01_scale_ladder.md"}, "r3-sequence": {"t": "R3 SEQUENCE", "k": "rung", "d": "A chain of scenes answering one dramatic question, usually replaced by a worse one when it resolves.", "w": "ssot_01_scale_ladder.md"}, "r4-act": {"t": "R4 ACT / MOVEMENT", "k": "rung", "d": "One throughline's [[signpost|signpost]], turned by a [[driver-dynamic|driver]]; all four throughlines advance one signpost per act.", "w": "ssot_01_scale_ladder.md"}, "r5-story": {"t": "R5 STORY", "k": "rung", "d": "The whole storyform: all four throughlines complete, [[outcome-dynamic|Outcome]] and [[judgment-dynamic|Judgment]] delivered.", "w": "ssot_01_scale_ladder.md"}, "p1-address": {"t": "P1 ADDRESS", "k": "layer", "d": "Where a plot unit sits on the [[ladder|scale ladder]]: IP.form.act.sequence.scene.beat. Writes the `address` field.", "w": "ssot_04_plot_system.md"}, "p2-driver": {"t": "P2 DRIVER", "k": "layer", "d": "What precipitates the turn, an action or a decision. Fed by Dramatica's [[driver-dynamic|Driver]] dynamic and McKee's inciting incident / crisis decision.", "w": "ssot_04_plot_system.md"}, "p3-value-in": {"t": "P3 VALUE-IN", "k": "layer", "d": "What value is charged, at what polarity, entering the unit. Fed by McKee's value-charged condition and Coyne's [[inciting-incident|Inciting Incident]].", "w": "ssot_04_plot_system.md"}, "p4-turn": {"t": "P4 TURN", "k": "layer", "d": "The mechanism that flips the value: [[the-gap|the Gap]], the [[five-commandments|commandment chain]], or Truby's plan/battle step.", "w": "ssot_04_plot_system.md"}, "p5-value-out": {"t": "P5 VALUE-OUT", "k": "layer", "d": "The value's polarity on exit, and whether the charge is ironic. Fed by McKee's [[value-turn|value turn]].", "w": "ssot_04_plot_system.md"}, "p6-signpost-seat": {"t": "P6 SIGNPOST/JOURNEY SEAT", "k": "layer", "d": "Which throughline's [[signpost|signpost]] or [[journey|journey]] this unit serves, in which act. Fed by Dramatica and the [[ladder|ladder]]'s R4.", "w": "ssot_04_plot_system.md"}, "p7-reveal": {"t": "P7 REVEAL", "k": "layer", "d": "What the audience or a character learns here, and whether it reverses expectation. Fed by Truby's [[revelations-sequence|revelations sequence]] and Coyne's [[turning-point|turning-point taxonomy]].", "w": "ssot_04_plot_system.md"}, "p8-collision": {"t": "P8 COLLISION", "k": "layer", "d": "Which character times setting (or character times character) row fires to produce this unit's friction. Writes `collision_row`, e.g. L9xS9. See [[collision-engine|the collision engine]].", "w": "ssot_04_plot_system.md"}, "p9-stakes": {"t": "P9 STAKES/ESCALATION", "k": "layer", "d": "How this unit's risk or cost compares to the last one; must trend up. Fed by McKee's [[progressive-complications|progressive complications]] and Coyne's invariant 5.", "w": "ssot_04_plot_system.md"}, "p10-genre-obligation": {"t": "P10 GENRE OBLIGATION", "k": "layer", "d": "Which reader-contract obligation this unit discharges, if any. Fed by Coyne's [[obligatory-scene|obligatory scenes]] and Snyder's [[ten-genres|10 genres]] and 15 beats.", "w": "ssot_04_plot_system.md"}, "p11-time": {"t": "P11 TIME", "k": "layer", "d": "The order told versus the order happened; the discourse texture. Genette's duration, carried in the [[scene-card|Scene Card]].", "w": "ssot_04_plot_system.md"}, "p12-function": {"t": "P12 FUNCTION", "k": "layer", "d": "What this unit does for the [[grand-argument-story|Grand Argument]], independent of P1 to P11. Fed independently from the storyform, keyed by [[storyform-id|storyform_id]]; mirrors L12 and S12 FUNCTION.", "w": "ssot_04_plot_system.md"}, "plot-axis-scale": {"t": "Axis 1 SCALE", "k": "axis", "d": "Plot units occupy the containers already ruled on the [[ladder|scale ladder]]; plot_systems adds only what happens inside a container, never a new size class.", "w": "ssot_04_plot_system.md"}, "plot-axis-turn": {"t": "Axis 2 THE TURN", "k": "axis", "d": "What changes inside a unit: McKee's [[value-turn|value turn]], Coyne's polarity, and [[the-gap|the Gap]] as the mechanism forcing it.", "w": "ssot_04_plot_system.md"}, "plot-axis-function": {"t": "Axis 3 FUNCTION", "k": "axis", "d": "What a plot unit does for the argument: Signpost, Journey, Setup/Payoff, [[p7-reveal|Reveal]], Reversal, Escalation.", "w": "ssot_04_plot_system.md"}, "plot-axis-drive": {"t": "Axis 4 DRIVE", "k": "axis", "d": "Drivers and act turns: Dramatica's [[driver-dynamic|Driver]], McKee's Inciting Incident / Crisis, Coyne's fractal recurrence, Snyder's page-keyed beats.", "w": "ssot_04_plot_system.md"}, "plot-card": {"t": "PLOT CARD", "k": "card", "d": "The notation slot for one plot unit, paired to the [[scene-card|Scene Card]]: driver, value-in, turn, value-out, signpost seat, reveal, collision, stakes delta, genre obligation, time, function.", "w": "ssot_04_plot_system.md"}, "plot-slice": {"t": "PLOT SLICE", "k": "card", "d": "The twelve-layer P1 through P12 schema, mirror of the 12-Layer Character Database and the [[setting-slice|Setting Slice]]. See [[p1-address|P1]] through [[p12-function|P12]].", "w": "ssot_04_plot_system.md"}, "collision-engine": {"t": "the collision engine", "k": "source-term", "d": "The mechanism producing a scene's friction from a character-layer times setting-layer row, e.g. L9 EROS times S9 ALLURE. Fires [[p8-collision|P8 COLLISION]] and the [[scene-card|Scene Card]]'s `collision` field.", "w": "collision engine (dependency of ssot_04)"}, "storyform-id": {"t": "storyform_id", "k": "source-term", "d": "The key binding P12/L12/S12 FUNCTION records to one locked [[storyform|storyform]]. A plot unit with no storyform link may run P1 through P11 only.", "w": "ssot_04_plot_system.md"}, "s1-body": {"t": "S1 BODY", "k": "layer", "d": "Physical fabric: geography, terrain, architecture, dimensions, materials, layout. Mirrors L1 CORE.", "w": "ssot_03_setting_system.md"}, "s2-weather": {"t": "S2 WEATHER", "k": "layer", "d": "Climate, seasons, light, temperature, atmosphere; the place's rhythms. Mirrors L2 VITAL. A canon-thin, authorable gap for DCUS.", "w": "ssot_03_setting_system.md"}, "s3-sensorium": {"t": "S3 SENSORIUM", "k": "layer", "d": "How a place meets the senses: soundscape, smellscape, texture, palette, the presentation surface. Mirrors L3 SOCIAL.", "w": "ssot_03_setting_system.md"}, "s4-law": {"t": "S4 LAW", "k": "layer", "d": "The rules that bind: governance, institutional mechanics, permission and forbiddance systems. Mirrors L4 WILL.", "w": "ssot_03_setting_system.md"}, "s5-scar": {"t": "S5 SCAR", "k": "layer", "d": "Damage in the fabric: ruins, erasures, renames, sanded-off strata, what was demolished. Mirrors L5 WOUND.", "w": "ssot_03_setting_system.md"}, "s6-economy": {"t": "S6 ECONOMY", "k": "layer", "d": "What fuels a place: resources, money, flows, traffic, who feeds and powers it. Mirrors L6 DRIVE.", "w": "ssot_03_setting_system.md"}, "s7-founding": {"t": "S7 FOUNDING", "k": "layer", "d": "Origin: who built it, why, the founding stack, the deep history. Mirrors L7 ORIGIN.", "w": "ssot_03_setting_system.md"}, "s8-habit": {"t": "S8 HABIT", "k": "layer", "d": "Attachment architecture: patterned life, rituals, routines, belonging gradients, insider/outsider. Mirrors L8 IMPRINT.", "w": "ssot_03_setting_system.md"}, "s9-allure": {"t": "S9 ALLURE", "k": "layer", "d": "A place's erotics: what it promises, what draws people in, its glamour and seduction. Mirrors L9 EROS.", "w": "ssot_03_setting_system.md"}, "s10-underside": {"t": "S10 UNDERSIDE", "k": "layer", "d": "What a place represses: hidden zones, the unspoken, basements literal and social, what surfaces under pressure. Mirrors L10 SHADOW.", "w": "ssot_03_setting_system.md"}, "s11-vector": {"t": "S11 VECTOR", "k": "layer", "d": "Trajectory: where a place is going, bloom, rot, collapse, redemption; feeds the setting arc. Mirrors L11 DESTINY.", "w": "ssot_03_setting_system.md"}, "s12-function": {"t": "S12 FUNCTION", "k": "layer", "d": "Storyform binding, fed from the spine independent of S1 to S11: which throughline Domain the place embodies, its argument role, its charge, and its narrative_invariant set. Mirrors L12 FUNCTION.", "w": "ssot_03_setting_system.md"}, "setting-axis-scale": {"t": "Setting Axis 1 SCALE", "k": "axis", "d": "Places nest: spot to room to site to locale to settlement to region to world to cosmos. Address form DCUS.campus.hall3.room12.", "w": "ssot_03_setting_system.md"}, "setting-axis-strata": {"t": "Setting Axis 2 STRATA", "k": "axis", "d": "What a place is made of: the twelve layers of the [[setting-slice|Setting Slice]], S1 through S12.", "w": "ssot_03_setting_system.md"}, "setting-axis-function": {"t": "Setting Axis 3 FUNCTION", "k": "axis", "d": "What setting does: Anchor, Characterize, Pressure, Mood, Argue, Afford. A scene deploys one or two modes deliberately.", "w": "ssot_03_setting_system.md"}, "setting-axis-time": {"t": "Setting Axis 4 TIME", "k": "axis", "d": "A slice is the baseline; states are dated overlays keyed to ladder addresses. The setting arc is the sequence of states.", "w": "ssot_03_setting_system.md"}, "scene-card": {"t": "SCENE CARD", "k": "card", "d": "The R2 notation, ten fields on one screen: address, setting, active strata, function mode, sensorium, commandments, [[value-turn|value turn]], duration, telling, threads, invariants, collision, exit state. Paired to the [[plot-card|Plot Card]].", "w": "ssot_03_setting_system.md"}, "setting-slice": {"t": "SETTING SLICE", "k": "card", "d": "The twelve-layer S1 through S12 schema, architectural twin of the 12-Layer Character Database. See [[s1-body|S1]] through [[s12-function|S12]].", "w": "ssot_03_setting_system.md"}, "sitrep": {"t": "sit rep", "k": "proword", "d": "The full board, cold start. Spoken, it flushes the Ready Rack and delivers blocks 0 to VII in fixed order.", "w": "SOP.md §1-2", "st": "ruled"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO, the five-paragraph order with the next action on top, plus the log. This TM page is a sibling standing-page type beside it.", "w": "SOP.md §0-1 · _tools/bolostatus/"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until it clears.", "w": "SOP.md §1", "st": "ruled"}, "soi": {"t": "SOI", "k": "noun", "d": "Signal Operating Instructions: the BREVITY's book, search, A to Z, by section, the dictation codebook.", "w": "SOP.md §0 · _tools/soi/", "st": "ruled"}, "sop": {"t": "SOP", "k": "noun", "d": "SOP.md, the canonical home of every comms code and session protocol. On any conflict with memory, the file wins.", "w": "SOP.md"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "Situation, Mission, Execution, Administration and Logistics, Command and Signal. A BOLO status page and this TM page's calls table both borrow its shape.", "w": "MIL.05 · MCDP 5 Planning"}, "bolo": {"t": "BOLO", "k": "proword", "d": "A tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas.", "w": "BOLO.md", "st": "ruled"}, "command": {"t": "the Command", "k": "noun", "st": "ruled", "d": "The whole operation under HOTLINE ACTUAL: BLACK, ORANGE and OPERATOR together.", "w": "SOP.md §2 · §5"}, "plot-systems-domain": {"t": "plot_systems", "k": "source-term", "d": "The sibling top-layer domain beside the setting system: events, turns, the twelve-layer [[plot-slice|PLOT SLICE]], and the [[plot-card|PLOT CARD]] notation. See TM 04.", "w": "ssot_04_plot_system.md"}, "l1-core": {"t": "L1 CORE", "k": "layer", "d": "The first character layer: cognition and identity, how the person thinks and who they take themselves to be. Chart feed: Sun and Mercury.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l2-vital": {"t": "L2 VITAL", "k": "layer", "d": "The second layer: the body and its presentation, energy, health, how the person reads at first sight. Chart feed: Mars and the Ascendant.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l3-social": {"t": "L3 SOCIAL", "k": "layer", "d": "The third layer: the person in public, status, manners, the mask worn among others.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l4-will": {"t": "L4 WILL", "k": "layer", "d": "The fourth layer: discipline, agency, what the person can make themselves do. Chart feed: Saturn.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l5-wound": {"t": "L5 WOUND", "k": "layer", "d": "The fifth layer: the formative injury and the armor built over it; the loss that explains the [[l6-drive|drive]]. Chart feed: the Moon and Chiron.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l6-drive": {"t": "L6 DRIVE", "k": "layer", "d": "The sixth layer: want versus need, the super-objective, what the person is reaching for and why. Chart feed: the Sun's house and Jupiter.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l7-origin": {"t": "L7 ORIGIN", "k": "layer", "d": "The seventh layer: birth context, family, class, the place and time the person came from. Chart feed: the IC and the fourth house.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l8-imprint": {"t": "L8 IMPRINT", "k": "layer", "d": "The eighth layer: acquired habits, passions, pastimes, the marks experience left.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l9-eros": {"t": "L9 EROS", "k": "layer", "d": "The ninth layer: sexuality and intimacy, desire profile, shame index, the erotic register. Chart feed: Venus, Mars and the eighth house.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l10-shadow": {"t": "L10 SHADOW", "k": "layer", "d": "The tenth layer: what the person cannot see in themselves, the self-delusion gap, the counter-will. Chart feed: the twelfth house and Pluto.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l11-destiny": {"t": "L11 DESTINY", "k": "layer", "d": "The eleventh layer: trajectory and vector, where the arc is taking the person, the transit calendar. Chart feed: the Midheaven and the nodes.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "l12-function": {"t": "L12 FUNCTION", "k": "layer", "d": "The twelfth layer: the person's job in the story, the Dramatica archetype or function, the throughline seat. Binds the character to the [[grand-argument|argument]].", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "twelve-layer-character": {"t": "the 12-layer character database", "k": "command-term", "d": "The Command's character system: twelve layers from [[l1-core|CORE]] to [[l12-function|FUNCTION]], three tiers (primary layers, secondary derivations, numeric variables), derived statistics and flag triggers, instanced per character as a vertical slice. The setting slice (S1 to S12) and the plot slice (P1 to P12) mirror its form.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "vertical-slice": {"t": "vertical slice", "k": "command-term", "d": "One character instanced through all twelve layers and three tiers, with its structured data block; Victoria Midnight is the proof instance.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "tier-1": {"t": "Tier 1", "k": "command-term", "d": "The primary layers of the character slice, sourced directly from canon and ruled by Chief.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "tier-2": {"t": "Tier 2", "k": "command-term", "d": "The secondary layers, derived from Tier 1 by the integration protocol.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "tier-3": {"t": "Tier 3", "k": "command-term", "d": "The numeric variables and flags computed from Tiers 1 and 2 (the derived statistics, the flag trigger conditions).", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "derived-statistic": {"t": "derived statistic", "k": "command-term", "d": "A number computed from the slice's variables by a stated formula, such as armor index or satisfaction cycle truncation.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "flag-trigger": {"t": "flag trigger", "k": "command-term", "d": "A condition over the slice's variables that, when met, raises a flag the story engine reads.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "structured-data-block": {"t": "structured data block", "k": "command-term", "d": "The machine-readable block at the end of a character slice: every variable and derived statistic as fields.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md · 00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md", "src": "SSOT 02"}, "BVX.0196": {"t": "Corbett (The Art of Character)", "k": "book", "d": "David Corbett's five cornerstones (desire, desire denied, wounds, secrets, contradictions) and the [[tyranny-of-motive|Tyranny of Motive]]: the [[ghost|ghost]] anchors an unresolved failure, a [[revenant|revenant]] forces it into the present, and the choice between them is [[growth-vs-transformation|growth or transformation]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0196.md", "src": "BVX.0196"}, "BVX.0061": {"t": "Card (Characters and Viewpoint)", "k": "book", "d": "Orson Scott Card's characterization budget: the MICE quotient sets a story's appetite, [[card-hierarchy|the Hierarchy]] allocates it per character, and elaboration of motive spends it. Viewpoint (person, tense, penetration) is declared the telling, not the person.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0061.md", "src": "BVX.0061"}, "BVX.0209": {"t": "Puglisi & Ackerman (The Emotional Wound Thesaurus)", "k": "book", "d": "The wound-to-lie-to-fear-to-shielding chain: an emotional wound seeds [[the-lie|a lie]], the lie manufactures fear, fear builds shielding, and shielding blocks an unmet need until the story forces a choice. Ships as [[wound-card|a fixed eleven-field card]] with a nine-factor [[severity-dial|severity dial]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0209.md", "src": "BVX.0209"}, "BVX.0233": {"t": "Pelican (The Science of Writing Characters)", "k": "book", "d": "Kira-Anne Pelican's six-subfield synthesis: a Big Five profile runs an evolutionary motivation, converted from external to internal by a dated life event. Supplies [[interpersonal-circumplex|the interpersonal circumplex]] and the [[dark-triad|Dark]] and Light Triads.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0233.md", "src": "BVX.0233"}, "BVX.0045": {"t": "Schmidt (45 Master Characters)", "k": "book", "d": "Victoria Lynn Schmidt's sixteen mythic archetypes, each a [[light-face|light face]] and [[shadow-face|shadow face]] pair, plus two nine-stage growth vectors, [[feminine-journey|the feminine journey]] and [[masculine-journey|the masculine journey]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0045.md", "src": "BVX.0045"}, "BVX.0064": {"t": "McKee (Character)", "k": "book", "d": "Robert McKee's cast-design method: [[true-character|true character]] versus characterization versus subconscious, held together by contradiction, cast across concentric rings by weight on [[cast-map|the Cast Map]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0064.md", "src": "BVX.0064"}, "BVX.0075": {"t": "Davis (Creating Compelling Characters)", "k": "book", "d": "Rib Davis's nature-plus-nurture build, then the want: a [[super-objective|super-objective]] meets its [[counter-will|counter-will]], and the conflict between the two, forced into choice, reveals rather than develops character.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0075.md", "src": "BVX.0075"}, "revenant": {"t": "the revenant", "k": "source-term", "d": "A present character who forces the reckoning the [[ghost|ghost]] left open. Corbett's pairing is a relational mechanism, a pointer to another character, not an attribute of one ([[BVX.0196]]).", "w": "BVX.0196", "src": "BVX.0196"}, "tyranny-of-motive": {"t": "the Tyranny of Motive", "k": "source-term", "d": "Corbett's warning, built on McKee's line that explaining a character kills her: no single stated cause should ever be presented as *the* reason for an action ([[BVX.0196]]).", "w": "BVX.0196", "src": "BVX.0196"}, "card-hierarchy": {"t": "the Hierarchy", "k": "source-term", "d": "Card's rule that a character's importance is never assigned directly; eight controllable levers (time, choices, focus, frequency, action, sympathy, viewpoint, strangeness) accumulate into walk-on, minor, or major ([[BVX.0061]]).", "w": "BVX.0061", "src": "BVX.0061"}, "mice-quotient": {"t": "the MICE quotient", "k": "source-term", "d": "Card's four story-shape factors, milieu, idea, character, event; whichever dominates sets the story's structural shape and its appetite for characterization ([[BVX.0061]]).", "w": "BVX.0061", "src": "BVX.0061"}, "wound-card": {"t": "the wound card", "k": "source-term", "d": "Puglisi and Ackerman's fixed eleven-field entry: category, examples, needs compromised, [[the-lie|the lie]], fears, behavioral fallout, traits formed, triggers, and opportunities to overcome ([[BVX.0209]]).", "w": "BVX.0209", "src": "BVX.0209"}, "the-lie": {"t": "the lie", "k": "source-term", "d": "A self-blaming false belief reached through flawed logic while a character is vulnerable. Not the wounding event itself, the lie is what a change arc must actually resolve ([[BVX.0209]]).", "w": "BVX.0209", "src": "BVX.0209"}, "severity-dial": {"t": "the severity dial", "k": "source-term", "d": "Nine tunable factors, proximity, responsibility, support, recurrence, compounding events among them, that set how debilitating a given wound is, instead of a flat damage count ([[BVX.0209]]).", "w": "BVX.0209", "src": "BVX.0209"}, "interpersonal-circumplex": {"t": "the interpersonal circumplex", "k": "source-term", "d": "A two-axis grid, agency (status, dominance, control) crossed with communion (warmth, connectedness), giving a character a plottable, context-dependent social position ([[BVX.0233]]).", "w": "BVX.0233", "src": "BVX.0233"}, "dark-triad": {"t": "the Dark Triad", "k": "source-term", "d": "Machiavellianism, narcissism, and subclinical psychopathy, scored against a Light Triad of Kantianism, humanism, and faith in humanity; complex characters carry both, never one pole alone ([[BVX.0233]]).", "w": "BVX.0233", "src": "BVX.0233"}, "light-face": {"t": "the light face", "k": "source-term", "d": "An archetype's healthy expression, paired with its own [[shadow-face|shadow face]] and asset list; the same archetype, not a different one, under a met versus a denied fear ([[BVX.0045]]).", "w": "BVX.0045", "src": "BVX.0045"}, "shadow-face": {"t": "the shadow face", "k": "source-term", "d": "An archetype curdled by a threatened cared-about thing and a denied fear; carries its own named flaw list, the same archetype as its [[light-face|light face]] under pressure ([[BVX.0045]]).", "w": "BVX.0045", "src": "BVX.0045"}, "feminine-journey": {"t": "the feminine journey", "k": "source-term", "d": "Schmidt's nine-stage growth vector, illusion through betrayal, descent, and rebirth, moving a character toward gaining power ([[BVX.0045]]).", "w": "BVX.0045", "src": "BVX.0045"}, "masculine-journey": {"t": "the masculine journey", "k": "source-term", "d": "Schmidt's nine-stage growth vector, the call through trials to a death-fork and awaken-or-rebel, moving a character toward surrendering power ([[BVX.0045]]).", "w": "BVX.0045", "src": "BVX.0045"}, "growth-vs-transformation": {"t": "growth vs transformation", "k": "source-term", "d": "Corbett's typed distinction for [[l11-destiny|DESTINY]]: growth digs deeper and wins through will, transformation tears down a wall and wins through insight ([[BVX.0196]]).", "w": "BVX.0196", "src": "BVX.0196"}, "counter-will": {"t": "counter-will", "k": "source-term", "d": "Boal's internal-conflict engine by way of Davis: a want meets its own opposite, and the forced choice between them is what reveals [[l4-will|WILL]] rather than growing it ([[BVX.0075]]).", "w": "BVX.0075", "src": "BVX.0075"}, "super-objective": {"t": "the super-objective", "k": "source-term", "d": "Stanislavski's term, by way of Davis: the single, densest want driving a character's active goal-pursuit, [[l6-drive|DRIVE]]'s fuel source ([[BVX.0075]]).", "w": "BVX.0075", "src": "BVX.0075"}, "true-character": {"t": "true character", "k": "source-term", "d": "McKee's middle level of self, the choice made under pressure when it costs something, distinct from characterization (the surface) and the subconscious (the buried) ([[BVX.0064]]).", "w": "BVX.0064", "src": "BVX.0064"}, "cast-map": {"t": "the cast map", "k": "source-term", "d": "McKee's concentric-circle allocation: dimensional weight concentrates at the protagonist and thins to nothing at the periphery, a time budget rather than an oversight ([[BVX.0064]]).", "w": "BVX.0064", "src": "BVX.0064"}, "stress-threshold": {"t": "Stress Threshold", "k": "command-term", "d": "Derived statistic, `WILL - WOUND`. How much pressure a character absorbs before the [[l5-wound|wound]]'s lie starts speaking louder than resolve.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md", "src": "SSOT 02"}, "collapse-risk": {"t": "Collapse Risk", "k": "command-term", "d": "Derived statistic, `(WOUND + SHADOW.shadow_density) / 2`. How close a character sits to behavioral collapse under sustained pressure.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md", "src": "SSOT 02"}, "truth-exposure-index": {"t": "Truth Exposure Index", "k": "command-term", "d": "Derived statistic, `SOCIAL + (10 - EROS.shame_index)`. The primary systemic legibility metric: a score above 15 means the character cannot manage their own signal visibility.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md", "src": "SSOT 02"}, "expressive-range": {"t": "Expressive Range", "k": "command-term", "d": "Derived statistic, `10 - EROS.armor_index`. What a character can intentionally send, as against Truth Exposure Index, what leaks regardless of intent.", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS/📐 ssot_02_character_systems_vertical_slice.md", "src": "SSOT 02"}, "t1-voice": {"t": "T1 VOICE", "k": "layer", "d": "Who speaks: person (homodiegetic vs heterodiegetic), level (extra- to metadiegetic), reliability, and time of narration. The TELLING PROFILE's first line; [[BVX.0596]] supplies the CN/EN vocabulary.", "w": "ssot_01_texture_system.md"}, "t2-focalization": {"t": "T2 FOCALIZATION", "k": "layer", "d": "Who sees: zero, internal (fixed/variable/multiple), or external focalization, plus the perceptual and informational sub-fields [[BVX.0598]] and [[BVX.0596]] argue T2 should carry. The law: [[who-speaks-vs-who-sees|who speaks is not who sees]].", "w": "ssot_01_texture_system.md"}, "t3-order": {"t": "T3 ORDER", "k": "layer", "d": "Story-time vs discourse-time: analepsis and prolepsis, each with reach and extent. The telling's rearrangement of the ladder's signpost order.", "w": "ssot_01_texture_system.md"}, "t4-duration": {"t": "T4 DURATION", "k": "layer", "d": "The five speeds: scene, summary, stretch, pause, ellipsis. Already wired into the SCENE CARD's `duration` field; [[BVX.0273|Hall]] operationalizes its mimetic end as [[the-distance-dial|the distance dial]].", "w": "ssot_01_texture_system.md"}, "t5-frequency": {"t": "T5 FREQUENCY", "k": "layer", "d": "How often: singulative, repetitive, iterative. Repetitive is trauma's signature, iterative is habit's, mirroring S8 HABIT.", "w": "ssot_01_texture_system.md"}, "t6-words": {"t": "T6 WORDS", "k": "layer", "d": "In what words: diction, syntax, distance policy (cinematic/light/deep), and [[free-indirect-discourse|free indirect discourse]]. Fed hardest by [[BVX.0273]], [[BVX.0084]], and [[BVX.0061]].", "w": "ssot_01_texture_system.md"}, "t7-feeling": {"t": "T7 FEELING", "k": "layer", "d": "With what feeling: tone (the implied author's attitude) and mood (the reader-side atmosphere), recorded as [[the-mood-curve|the mood curve]] per [[BVX.0279]].", "w": "ssot_01_texture_system.md"}, "t8-thresholds": {"t": "T8 THRESHOLDS", "k": "layer", "d": "Through what thresholds: paratext, titles, chapter heads, epigraphs, in-world documents. A design surface for movement names and Administration memos.", "w": "ssot_01_texture_system.md"}, "t9-frames": {"t": "T9 FRAMES", "k": "layer", "d": "Breaking which frames: metalepsis and the unnatural, narrator-level violations. Normalized as direct address in M9 PORN per the medium grammars.", "w": "ssot_01_texture_system.md"}, "t10-narratee": {"t": "T10 NARRATEE", "k": "layer", "d": "To whom: the narratee inside the text and the implied reader the text assumes. [[BVX.0279]] supplies the reader-facing half, [[the-three-vs|the three V's]].", "w": "ssot_01_texture_system.md"}, "t11-medium": {"t": "T11 MEDIUM", "k": "layer", "d": "New T-layer: which channel's grammar re-instruments the telling, M1 to M10 from the medium grammars. Writes `medium`, `grammar_overrides`.", "w": "ssot_01_texture_system.md"}, "t12-function": {"t": "T12 FUNCTION", "k": "layer", "d": "New T-layer: storyform binding, which throughline the telling serves and its argument role, fed independently from the storyform exactly as L12 and S12 are. Writes `story_point`, `storyform_id`.", "w": "ssot_01_texture_system.md"}, "BVX.0598": {"t": "Hühn, Schmid & Schönert (Focalization)", "k": "book", "d": "The reference-shelf battlefield map of mediation vocabulary: fourteen essays converging on one law, [[who-speaks-vs-who-sees|who speaks is not who sees]]. Source of [[the-mediation-chain|the mediation chain]] (the DNS) and [[the-reflection-axis|the reflection axis]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0598.md", "src": "BVX.0598"}, "BVX.0596": {"t": "Bal (Narratology in Practice)", "k": "book", "d": "Mieke Bal's fabula/story/text cut and her [[the-focalizor|focalizor]] apparatus: [[ef-cf|EF/CF]], perceptible/non-perceptible marking, and [[narrator-focalizer-discrepancy|narrator/focalizer discrepancy]] as a manipulation diagnostic.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0596.md", "src": "BVX.0596"}, "BVX.0273": {"t": "Hall (Writing Deep Point of View)", "k": "book", "d": "Rayne Hall's technique inventory for pushing T2 and T6 to their mimetic ceiling: [[barrier-words|barrier words]] removed, [[the-distance-dial|the distance dial]] named cinematic/light/deep alongside Card ([[BVX.0061]]).", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0273.md", "src": "BVX.0273"}, "BVX.0084": {"t": "Kempton (Dialogue)", "k": "book", "d": "Gloria Kempton's [[the-seven-function-test|seven-function test]] for a line of dialogue, plus [[viewpoint-silence|viewpoint silence]] and strategic tagging as subtext's unnamed mechanism.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0084.md", "src": "BVX.0084"}, "BVX.0279": {"t": "Iglesias (Writing for Emotional Impact)", "k": "book", "d": "Karl Iglesias's seven-emotion taxonomy and [[the-three-vs|the three V's]]: reader emotion, not character emotion, is the target. Supplies [[the-mood-curve|the mood curve]] and [[the-payoff-owed|the payoff owed]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0279.md", "src": "BVX.0279"}, "BVX.0349": {"t": "Kennedy (Against Worldbuilding)", "k": "book", "d": "Alexis Kennedy's counter-voice: distinctiveness over expansiveness, the gutter of implication over inventory. Feeds the setting shelf directly; keyed texture-adjacent here for its microtext and paratext essays.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.0349.md", "src": "BVX.0349"}, "focalization": {"t": "focalization", "k": "source-term", "d": "Who sees, as distinct from who speaks: a fictive entity's subjective view ([[BVX.0596|Bal]]) or, in Genette's second sense, what the reader is denied ([[BVX.0598]]). T2's governing concept.", "w": "BVX.0596", "src": "BVX.0596"}, "the-focalizor": {"t": "the focalizor", "k": "source-term", "d": "Bal's term for whoever's vision colors the story: EF (external) or CF (character), marked perceptible or non-perceptible. The narrator never touches the focalized object directly, only through the focalizor.", "w": "BVX.0596", "src": "BVX.0596"}, "ef-cf": {"t": "EF/CF", "k": "source-term", "d": "Bal's split of [[the-focalizor|the focalizor]]: EF, an external focalizer outside the story, or CF, a character-focalizer inside it. Proposed as a T2 sub-field alongside the perceptible/non-perceptible marking.", "w": "BVX.0596", "src": "BVX.0596"}, "free-indirect-discourse": {"t": "free indirect discourse", "k": "source-term", "d": "Narrator and character voice fused with no clear marker of the switch; prose's signature instrument (T6), and M1 PROSE's native grammar per the medium grammars.", "w": "BVX.0596", "src": "BVX.0596"}, "the-distance-dial": {"t": "the distance dial", "k": "source-term", "d": "T6's diegesis-to-mimesis scale, named cinematic, light, or deep by both [[BVX.0273|Hall]] and [[BVX.0061|Card]]. Show, don't tell is a setting on this dial, not a commandment.", "w": "BVX.0273", "src": "BVX.0273"}, "barrier-words": {"t": "barrier words", "k": "source-term", "d": "Hall's closed verb list, think, wonder, realize, know, that announces a thought is being reported. Removing them is deep PoV's most repeatable technique, and a candidate countable instrument for [[the-distance-dial|the distance dial]].", "w": "BVX.0273", "src": "BVX.0273"}, "the-mediation-chain": {"t": "the mediation chain", "k": "source-term", "d": "The DNS's three simultaneous dimensions, perception, reflection, and mediation proper, running fabula to focalizor to narrator to words to narratee. Changing one dimension predisposes the other two ([[BVX.0598]]).", "w": "BVX.0598", "src": "BVX.0598"}, "the-reflection-axis": {"t": "the reflection axis", "k": "source-term", "d": "The DNS's third dimension: a narrator's or character's cognitive, emotive, and normative mark-up of what is perceived, distinct from T1 voice and T2 focalization. No clean home among the Ten Questions; OPEN call 4 asks whether T7 absorbs it.", "w": "BVX.0598", "src": "BVX.0598"}, "viewpoint-silence": {"t": "viewpoint silence", "k": "source-term", "d": "Kempton's tension technique: the viewpoint character visibly not saying what she's thinking. Neither zero, internal, nor external focalization, a focalized character's deliberate non-report, proposed as a T2 sub-value.", "w": "BVX.0084", "src": "BVX.0084"}, "the-seven-function-test": {"t": "the seven-function test", "k": "source-term", "d": "Kempton's audit: a line of dialogue must characterize, set mood, intensify conflict, move plot, pace the scene, carry setting, or state theme, or it earns no place in the scene.", "w": "BVX.0084", "src": "BVX.0084"}, "the-mood-curve": {"t": "the mood curve", "k": "source-term", "d": "Iglesias's per-unit sequence of named reader emotions, interest, curiosity, anticipation, suspense, surprise, thrill, empathy, each with a technique and, if anticipation, [[the-payoff-owed|the payoff owed]]. T7's working content.", "w": "BVX.0279", "src": "BVX.0279"}, "the-three-vs": {"t": "the three V's", "k": "source-term", "d": "Iglesias's taxonomy of why a reader feels anything: Voyeuristic (curiosity about new worlds), Vicarious (identification), Visceral (raw thrill). T10's reader-construction half.", "w": "BVX.0279", "src": "BVX.0279"}, "the-payoff-owed": {"t": "the payoff owed", "k": "source-term", "d": "Anticipation must resolve into surprise, disappointment, or relief; an unpaid promise reads as broken. Part of [[the-mood-curve|the mood curve]]'s entry format.", "w": "BVX.0279", "src": "BVX.0279"}, "narrator-focalizer-discrepancy": {"t": "narrator/focalizer discrepancy", "k": "source-term", "d": "Bal's diagnostic: a gap between what is narrated (T1) and what is focalized (T2) is where a text manipulates its reader. Proposed as a flag on the TELLING PROFILE.", "w": "BVX.0596", "src": "BVX.0596"}, "telling-profile": {"t": "the TELLING PROFILE", "k": "source-term", "d": "The discourse twin of the storyform: a work's fixed configuration of the Ten Questions' answers, recorded per ladder address, overridable per unit. Instanced by the texture system's twelve-line profile block.", "w": "ssot_01_texture_layer.md"}, "the-telling-line": {"t": "the telling line", "k": "source-term", "d": "The SCENE CARD's per-scene override of [[telling-profile|the TELLING PROFILE]], T1 plus T2 plus T4 for that scene; the texture system proposes adding a register slot per [[BVX.0084]].", "w": "ssot_01_texture_layer.md"}, "who-speaks-vs-who-sees": {"t": "who speaks is not who sees", "k": "source-term", "d": "The load-bearing law of the texture layer: a heterodiegetic narrator (T1) can see through one character only (T2 internal fixed). Collapsing the two is the most common craft confusion; [[BVX.0598]] and [[BVX.0596]] both name it the field's central error.", "w": "ssot_01_texture_layer.md"}, "the-translation-grid": {"t": "TRANSLATION GRID", "k": "source-term", "d": "The texture layer's table of craft vocabulary as compressed T1 x T2 (and T3, T4, T6) configurations: third limited, deep PoV, show don't tell. Not reproduced in the texture system; see the layer doc.", "w": "ssot_01_texture_layer.md"}, "the-ten-questions": {"t": "the Ten Questions", "k": "source-term", "d": "The texture layer's taxonomy, T1 through T10, every telling as a configuration of ten answers. The texture system restates them as PART B's axes and adds T11 and T12.", "w": "ssot_01_texture_layer.md"}, "g1-label": {"t": "G1 LABEL", "k": "layer", "d": "Industry label, marketing label, and critical label, three independent fields, never one slot. Fed by [[BVX.0580]]'s finding that the three routinely diverge.", "w": "ssot_01_genre_system.md"}, "g2-family": {"t": "G2 FAMILY", "k": "layer", "d": "Which family a genre belongs to and its polar opposite. Fed by Truby's genre families ([[BVX.0191]]) and Coyne's [[genre-clover|five-leaf clover]] ([[BVX.0236]]).", "w": "ssot_01_genre_system.md"}, "g3-contract": {"t": "G3 CONTRACT", "k": "layer", "d": "The conventions a genre owes the reader: a component list, criteria steps, [[obligatory-scene|obligatory scenes]]. Fed by [[BVX.0576]], [[BVX.0236]], and [[BVX.0163]].", "w": "ssot_01_genre_system.md"}, "g4-argument": {"t": "G4 ARGUMENT", "k": "layer", "d": "The [[moral-argument|moral argument]] and [[core-binary|core binary]] a genre's whole structure exists to prove, restated as a Thematic Recipe ([[BVX.0191]]).", "w": "ssot_01_genre_system.md"}, "g5-stance": {"t": "G5 STANCE", "k": "layer", "d": "The reader's epistemic position and [[resolution-mode|resolution mode]]: sustained [[the-hesitation|hesitation]], resolves natural, resolves supernatural, or normalized from the start ([[BVX.0614]]).", "w": "ssot_01_genre_system.md"}, "g6-delivery": {"t": "G6 DELIVERY", "k": "layer", "d": "How the strange enters the text and whether it is explained: [[delivery-mode|delivery mode]], [[portal-quest|portal-quest]], [[immersive-fantasy|immersive]], intrusion, liminal ([[BVX.0599]]).", "w": "ssot_01_genre_system.md"}, "g7-verisimilitude": {"t": "G7 VERISIMILITUDE", "k": "layer", "d": "[[two-verisimilitudes|The two verisimilitudes]] a genre is judged against, the generic regime it licenses internally and the cultural regime everyday belief still holds it to ([[BVX.0580]]).", "w": "ssot_01_genre_system.md"}, "g8-world": {"t": "G8 WORLD", "k": "layer", "d": "The story-world a genre promises to build, [[genre-setting-contract|the genre-setting contract]]: Southern Gothic, western, space opera as setting promises ([[BVX.0191]]).", "w": "ssot_01_genre_system.md"}, "g9-uptake": {"t": "G9 UPTAKE", "k": "layer", "d": "What this genre calls forth and what answers it next, a [[uptake|genre system]] in Bawarshi and Reiff's sense: pitch calls treatment calls greenlight ([[BVX.0581]]).", "w": "ssot_01_genre_system.md"}, "g10-audience": {"t": "G10 AUDIENCE", "k": "layer", "d": "[[the-icm|The ICM]] a genre builds in an audience before a scene is drafted, plus Dramatica's audience appreciations ([[BVX.0576]], [[BVX.0089]]).", "w": "ssot_01_genre_system.md"}, "g11-market": {"t": "G11 MARKET", "k": "layer", "d": "Cycle, budget tier, and risk position, the industrial planning units Neale finds routinely outrank genre itself ([[BVX.0580]]).", "w": "ssot_01_genre_system.md"}, "g12-function": {"t": "G12 FUNCTION", "k": "layer", "d": "What this genre does for the Grand Argument, independent of G1 through G11. Fed independently from the storyform, keyed by [[storyform-id|storyform_id]]; mirrors L12, S12, P12, and T12 FUNCTION.", "w": "ssot_01_genre_system.md"}, "genre-card": {"t": "the genre card", "k": "source-term", "d": "One per genre in the Command's register: Truby's chapter schema merged with Selbo's field list, name and labels through transcending variants.", "w": "ssot_01_genre_system.md"}, "genre-contract-instrument": {"t": "the genre contract", "k": "source-term", "d": "One per work: primary genre, overriding and supporting mix, delivery mode, resolution mode, register, and the obligations owed the plot card's P10 line discharges one by one.", "w": "ssot_01_genre_system.md"}, "moral-argument": {"t": "the moral argument", "k": "source-term", "d": "Truby's claim: each of the fourteen genres is a stated philosophy a story's whole structure exists to prove, never a plot template alone ([[BVX.0191]]).", "w": "BVX.0191", "src": "BVX.0191"}, "core-binary": {"t": "the core binary", "k": "source-term", "d": "A genre's single fundamental-concern sentence (Horror: Religion, Love: the Art of Happiness), doubling as chapter title and rung on Truby's enlightenment ladder ([[BVX.0191]]).", "w": "BVX.0191", "src": "BVX.0191"}, "the-hesitation": {"t": "the hesitation", "k": "source-term", "d": "Todorov's fantastic: the reader's sustained, undecided state between a natural and supernatural account of one event. A relation, not a content ([[BVX.0614]]).", "w": "BVX.0614", "src": "BVX.0614"}, "resolution-mode": {"t": "resolution mode", "k": "source-term", "d": "How a genre's hesitation settles: sustained, resolves natural (the uncanny), resolves supernatural (the marvelous), or normalized from the start (Kafka's generalized fantastic) ([[BVX.0614]]).", "w": "BVX.0614", "src": "BVX.0614"}, "delivery-mode": {"t": "delivery mode", "k": "source-term", "d": "Mendlesohn's variable: how the fantastic enters the narrated world and whether it is explained, distinct from focalization or grammatical person ([[BVX.0599]]).", "w": "BVX.0599", "src": "BVX.0599"}, "immersive-fantasy": {"t": "immersive fantasy", "k": "source-term", "d": "Mendlesohn's second category: the reader is already of the world, no portal, no explanation; a fantasy of thinning rather than discovery ([[BVX.0599]]).", "w": "BVX.0599", "src": "BVX.0599"}, "portal-quest": {"t": "portal-quest", "k": "source-term", "d": "Mendlesohn's first category: the reader is led through by a guide-narrator, gradual explanation, reward and restoration at the end ([[BVX.0599]]).", "w": "BVX.0599", "src": "BVX.0599"}, "two-verisimilitudes": {"t": "the two verisimilitudes", "k": "source-term", "d": "Neale's pair: generic verisimilitude (plausible by the genre's own rules) and cultural verisimilitude (plausible by everyday belief). Every genre balances both ([[BVX.0580]]).", "w": "BVX.0580", "src": "BVX.0580"}, "the-inter-textual-relay": {"t": "the inter-textual relay", "k": "source-term", "d": "Posters, trailers, stills, reviews, credit sequences: the industry's own machinery for a film's narrative image, and the primary evidence for what a genre actually was ([[BVX.0580]]).", "w": "BVX.0580", "src": "BVX.0580"}, "typified-social-action": {"t": "typified social action", "k": "source-term", "d": "Miller's founding definition: a genre is a typified rhetorical action that helps constitute the recurrent situation it responds to, not a container for texts ([[BVX.0581]]).", "w": "BVX.0581", "src": "BVX.0581"}, "uptake": {"t": "uptake", "k": "source-term", "d": "Freadman's mechanism: the conditioned, memoried way one genre's move calls forth a specific genre in response, like a played tennis shot. Selective, not causal ([[BVX.0581]]).", "w": "BVX.0581", "src": "BVX.0581"}, "genre-system-term": {"t": "genre system", "k": "source-term", "d": "Several genre sets coordinated toward one overarching function (Devitt, Bazerman), one scale in a nested taxonomy running set to system to repertoire to a whole culture's context of genres ([[BVX.0581]]).", "w": "BVX.0581", "src": "BVX.0581"}, "meta-genre": {"t": "meta-genre", "k": "source-term", "d": "Giltrow's term: an atmosphere-level text or talk, a style bible, a showrunner's tone memo, that teaches and stabilizes how a genre gets used, sitting above genre and register both ([[BVX.0581]]).", "w": "BVX.0581", "src": "BVX.0581"}, "the-icm": {"t": "the ICM", "k": "source-term", "d": "Selbo's idealized cognitive model: an audience's mental space for a genre, built from schematic, specific, and relevant knowledge, before a scene is drafted ([[BVX.0576]]).", "w": "BVX.0576", "src": "BVX.0576"}, "overriding-genre": {"t": "overriding genre", "k": "source-term", "d": "The genre that dominates a story's frame and must fully satisfy its own criteria; other genres support it (Neale's genre hybrid) ([[BVX.0576]]).", "w": "BVX.0576", "src": "BVX.0576"}, "supporting-genre": {"t": "supporting genre", "k": "source-term", "d": "A genre stacked beneath the overriding genre; counts toward a hybrid only if its own criteria are substantially met, not merely gestured at ([[BVX.0576]]).", "w": "BVX.0576", "src": "BVX.0576"}, "the-fourteen-genres": {"t": "the fourteen genres", "k": "source-term", "d": "Truby's set: Horror, Action, Myth, Memoir/Coming-of-Age, Fantasy, Detective/Thriller, Love, Science Fiction, Crime, Comedy, Western, Gangster, each a moral argument proved through a fixed schema ([[BVX.0191]]).", "w": "BVX.0191", "src": "BVX.0191"}, "mode-vs-genre": {"t": "mode vs genre", "k": "source-term", "d": "Bordwell's distinction, via Selbo: mode is the delivery vehicle (animation, documentary, mini-series); it says nothing about content. Mode is never genre ([[BVX.0576]]).", "w": "BVX.0576", "src": "BVX.0576"}, "genre-setting-contract": {"t": "the genre-setting contract", "k": "source-term", "d": "The spine's L7-to-setting touchpoint: Southern Gothic, western, space opera are genres that ARE setting promises, not decoration on top of one ([[BVX.0191]]).", "w": "ssot_01_story_spine_comparative_tree.md"}, "the-four-vocabularies": {"t": "the four vocabularies", "k": "source-term", "d": "Snyder's ten, Coyne's clover, Selbo's sixteen, and Truby's fourteen genres: four independently arrived-at genre lists for one reader-contract territory, none substituting for another.", "w": "ssot_01_genre_system.md"}, "BVX.1123": {"t": "Egri (The Art of Dramatic Writing)", "k": "book", "d": "Lajos Egri's 1946 craft book: a character is [[the-bone-structure|the bone structure]], physiology, sociology, psychology; [[the-premise|the premise]] is the one sentence the whole play must prove; [[strength-of-will|strength of will]] defines [[the-pivotal-character|the pivotal character]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.1123.md", "src": "BVX.1123"}, "BVX.1124": {"t": "Vogler (The Writer's Journey)", "k": "book", "d": "Campbell's monomyth compressed into [[the-twelve-stages|twelve stages]] and eight archetypes as [[archetypes-as-masks|masks]], including [[the-ordeal|the Ordeal]]'s death-and-rebirth and [[the-repeat-turn|a second, harder Resurrection]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.1124.md", "src": "BVX.1124"}, "BVX.1125": {"t": "Brody (Save the Cat! Writes a Novel)", "k": "book", "d": "Snyder's fifteen beats re-keyed to percentages of manuscript length, wrapped in an A Story/B Story want-need split and [[the-ingredient-triad|the ingredient triad]], exactly three required elements per genre.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.1125.md", "src": "BVX.1125"}, "BVX.1126": {"t": "Aristotle (Poetics)", "k": "book", "d": "The rival map's root ancestor, read from the primary text (trans. Sachs): [[hamartia|hamartia]], [[peripeteia|peripeteia]], and [[anagnorisis|anagnorisis]] drive the tragic plot, and [[catharsis|catharsis]] is completed eighteen chapters later in [[wonder-telos|wonder]].", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.1126.md", "src": "BVX.1126"}, "BVX.1127": {"t": "Levine & Heller (Attached)", "k": "book", "d": "Adult attachment theory as three styles, secure, anxious, avoidant, run by one evolved system; [[protest-behaviors|protest behaviors]], [[deactivating-strategies|deactivating strategies]], and [[the-secure-base|the secure base]]'s buffering effect.", "w": "_0.1_BVX_LEARN/KNOWLEDGE_AREAS/BVX.1127.md", "src": "BVX.1127"}, "the-bone-structure": {"t": "the bone structure", "k": "source-term", "d": "Egri's tridimensional outline, physiology, sociology, psychology, 27 named fields under three headings; the character shelf's earliest complete checklist ([[BVX.1123]]).", "w": "BVX.1123", "src": "BVX.1123"}, "strength-of-will": {"t": "strength of will", "k": "source-term", "d": "Not toughness, the capacity to decide and act; a weak character is one who cannot make a decision, Egri's clearest ancestor of [[l4-will|L4 WILL]] ([[BVX.1123]]).", "w": "BVX.1123", "src": "BVX.1123"}, "the-pivotal-character": {"t": "the pivotal character", "k": "source-term", "d": "The protagonist, forced into the role by necessity, not choice; grows less than other characters because the decision predates the curtain ([[BVX.1123]]).", "w": "BVX.1123", "src": "BVX.1123"}, "the-premise": {"t": "the premise", "k": "source-term", "d": "One sentence, character, conflict, conclusion, that the whole play must prove; one generation before Davis's [[super-objective|super-objective]] ([[BVX.1123]]).", "w": "BVX.1123", "src": "BVX.1123"}, "hamartia": {"t": "hamartia", "k": "source-term", "d": "Missing the mark, archery imagery, never badness of character; corrects the tragic-flaw tradition traced to Butcher's 1895 mistranslation ([[BVX.1126]]).", "w": "BVX.1126", "src": "BVX.1126"}, "peripeteia": {"t": "peripeteia", "k": "source-term", "d": "The change to the opposite of the things being done, the oldest named reversal mechanism the house holds, mapping onto [[p4-turn|P4 TURN]] ([[BVX.1126]]).", "w": "BVX.1126", "src": "BVX.1126"}, "anagnorisis": {"t": "anagnorisis", "k": "source-term", "d": "A change from ignorance to recognition, best when simultaneous with a reversal; Ch.16 ranks discovery forms least to most artful, mapping onto [[p7-reveal|P7 REVEAL]] ([[BVX.1126]]).", "w": "BVX.1126", "src": "BVX.1126"}, "catharsis": {"t": "catharsis", "k": "source-term", "d": "The washing-away of pity and fear, named once and never explained until [[wonder-telos|wonder]] completes it eighteen chapters later; a live scholarly problem, not a settled house term ([[BVX.1126]]).", "w": "BVX.1126", "src": "BVX.1126"}, "wonder-telos": {"t": "wonder", "k": "source-term", "d": "Ekplexis, the knocking-away of habitual judgment; Sachs's central claim that tragedy's actual telos is wonder, not a guaranteed lesson ([[BVX.1126]]).", "w": "BVX.1126", "src": "BVX.1126"}, "protest-behaviors": {"t": "protest behaviors", "k": "source-term", "d": "The anxious response to perceived threat, silent treatment, monitoring, manufactured jealousy, aimed at restoring attention ([[BVX.1127]]).", "w": "BVX.1127", "src": "BVX.1127"}, "deactivating-strategies": {"t": "deactivating strategies", "k": "source-term", "d": "The avoidant response: focusing on a partner's flaws, idealizing an ex, comparing to alternatives, creating distance; regulation, not disinterest ([[BVX.1127]]).", "w": "BVX.1127", "src": "BVX.1127"}, "the-secure-base": {"t": "the secure base", "k": "source-term", "d": "A consistently available partner as a base to return to and a shield against outside stress; Coan's fMRI hand-holding study anchors the buffering effect experimentally ([[BVX.1127]]).", "w": "BVX.1127", "src": "BVX.1127"}, "archetypes-as-masks": {"t": "archetypes as masks", "k": "source-term", "d": "Vogler's own phrase, from Propp: the eight archetypes worn temporarily as needed, not fixed roles; any character, including the Hero, can trade masks mid-scene ([[BVX.1124]]).", "w": "BVX.1124", "src": "BVX.1124"}, "the-twelve-stages": {"t": "the twelve stages", "k": "source-term", "d": "Vogler's compression of Campbell's monomyth into a practical map any story can shuffle, skip, or merge, from Ordinary World to Return with the Elixir ([[BVX.1124]]).", "w": "BVX.1124", "src": "BVX.1124"}, "the-ordeal": {"t": "the Ordeal", "k": "source-term", "d": "A literal or symbolic death confronting the hero's greatest fear, staged so the hero 'must die or appear to die'; Resurrection stages a second, harder pass before Return ([[BVX.1124]]).", "w": "BVX.1124", "src": "BVX.1124"}, "the-ingredient-triad": {"t": "the ingredient triad", "k": "source-term", "d": "Every one of Brody's ten genres reduces to exactly three required ingredients; a fast completeness check against a genre draft ([[BVX.1125]]).", "w": "BVX.1125", "src": "BVX.1125"}, "the-repeat-turn": {"t": "the repeat turn", "k": "source-term", "d": "Vogler's Resurrection forcing a second full value-in/turn/value-out pass before Return, a need [[p9-stakes|P9 STAKES/ESCALATION]]'s single 'trend up' rule doesn't yet name ([[BVX.1124]]).", "w": "BVX.1124", "src": "BVX.1124"}, "multi-pov": {"t": "multi-POV", "k": "source-term", "d": "Brody's allowance for one full fifteen-beat instance per POV hero, layered on a shared timeline, proven on the Institutionalized/Help worked example ([[BVX.1125]]).", "w": "BVX.1125", "src": "BVX.1125"}, "sys:00": {"t": "00 EPISTEMOLOGY", "k": "system", "d": "8 docs · versions 1.0.0 to 2.0.0 · 0 open ⧗ marks. Depends on [[sys:02|02 CHARACTER]].", "w": "ShroomsQ/_CANON/_SSOT/00_EPISTEMOLOGY"}, "sys:01": {"t": "01 NARRATIVE FRAMEWORKS", "k": "system", "d": "13 docs · versions 0.9.0 to 1.2.0 · 0 open ⧗ marks. Depends on [[sys:02|02 CHARACTER]], [[sys:03|03 SETTING]], [[sys:04|04 PLOT]], [[sys:07|07 THEME]], [[sys:08|08 TRACKING]].", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS"}, "sys:02": {"t": "02 CHARACTER", "k": "system", "d": "10 docs · versions 1.0.0 to 3.3.1 · 0 open ⧗ marks. Depends on [[sys:03|03 SETTING]], [[sys:04|04 PLOT]], [[sys:05|05 OPERATIONS]], [[sys:08|08 TRACKING]].", "w": "ShroomsQ/_CANON/_SSOT/02_CHARACTER_SYSTEMS"}, "sys:03": {"t": "03 SETTING", "k": "system", "d": "3 docs · versions 1.0.0 to 1.10.0 · 0 open ⧗ marks. Depends on [[sys:01|01 NARRATIVE FRAMEWORKS]], [[sys:02|02 C logical, intuitive, consensual, and pragmatic methods ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/00_EPISTEMOLOGY/📐 ssot epistemology truth verification.md"}, "doc:ssot_00_base_60_number_system": {"t": "ssot_00_base_60_number_system", "k": "doc · 1.0.0", "d": "Defines the base 60 (sexagesimal) number system as the foundational source for all integers in the LEECHSEED character pipeline. Establishes the divisor lattice, valid scale classes, pattern catalog, scale assignments, point budget recalibration, derived stat recalibration, and flag threshold recalibration. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/00_EPISTEMOLOGY/📐 ssot_00_base_60_number_system.md"}, "doc:ssot_00_bold_venture_design_system": {"t": "ssot_00_bold_venture_design_system", "k": "doc · 2.0.0", "d": "Defines ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/00_EPISTEMOLOGY/📐 ssot_00_bold_venture_design_system.md"}, "doc:ssot_00_module_architecture": {"t": "ssot_00_module_architecture", "k": "doc · 1.0.0", "d": "Defines the Layer-Locked Module system — the plugin/extension architecture for attaching new capability to the 12-Layer Character Database without expanding the core schema. Establishes the module API contract, attachment protocol, data access rules, and the registry format for all current and planned modules. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/00_EPISTEMOLOGY/📐 ssot_00_module_architecture.md"}, "doc:ssot_00_module_registry": {"t": "ssot_00_module_registry", "k": "doc · 1.0.0", "d": "The complete registry of all Layer-Locked Modules — current, planned, and conceptual. Each entry defines the module's attachment point, variable set, access pattern, and development status. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/00_EPISTEMOLOGY/📐 ssot_00_module_registry.md"}, "doc:ssot_00_process_illustration_character_pipeline": {"t": "ssot_00_process_illustration_character_pipeline", "k": "doc · 1.0.0", "d": "Illustrates the complete LEECHSEED character pipeline as four sequential flows with decision points, inputs, outputs, and embedded Mermaid ics", "k": "doc · 1.0.1", "d": "The prescriptive half of the lattice — what house stories MUST BE. The lattice describes what a story is; this doc commands what ours are for. Canonized from the May-2025 Leechseed Manifesto (16 docs, imported-Joplin) + three native principles coined 2026-08-31. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_modern_poetics.md"}, "doc:ssot_01_scale_ladder": {"t": "ssot_01_scale_ladder", "k": "doc · 1.0.0", "d": "THE SCALE LADDER — the container hierarchy from beat to universe: what each unit IS, its completion test, its address, and how multiple stories nest inside one series. Lattice limb 1 of 4. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_scale_ladder.md"}, "doc:ssot_01_spine_house_inventory": {"t": "ssot_01_spine_house_inventory", "k": "doc · 1.0.1", "d": "Every processed in-house material keyed to its spine level(s) L0–L7 — the repo's own holdings as spine shelves. Stage 2 (the 353-source library feeds: sweep) keys the external catalog the same way. Module of [[doc:ssot_01_story_spine_comparative_tree|ssot_01_story_spine_comparative_tree]]. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_spine_house_inventory.md"}, "doc:ssot_01_story_registry": {"t": "ssot_01_story_registry", "k": "doc · 1.0.0", "d": "THE STORY REGISTRY: the one place that lists every story in the universe, its aliases, genre, era, medium, status, nodes, and storyform. The workspace's stories: filter and every doc's applies_to read from here. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_story_registry.md"}, "doc:ssot_01_story_spine_comparative_tree": {"t": "ssot_01_story_spine_comparative_tree", "k": "doc · 1.0.0", "d": "THE STORY SPINE — the canonical tree of what makes a story. The reference Chief designs IPs against, and the keying structure the BVX-LEARN library (CRE/LIT holdings) organizes onto. Front door to the BVX reference system. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_story_spine_comparative_tree.md"}, "doc:ssot_01_texture_layer": {"t": "ssot_01_texture_layer", "k": "doc · 1.0.1", "d": "THE TEXTURE LAYER — the discourse side of narrative: the critical-writing categories (narratology) organized as the Ten Questions of the Telling, the craft-term translation grid, and the TELLING PROFILE instrument. Lattice limb 3 of 4. Module of [[doc:ssot_01_texture_system|ssot_01_texture_system]]. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_texture_layer.md"}, "doc:ssot_01_texture_system": {"t": "ssot_01_texture_system", "k": "doc · 1.0.0", "d": "THE TEXTURE SYSTEM: the fourth top-layer model beside character (02), setting (03), and plot (04); the Ten Questions of the Telling promoted to a twelve-layer TEXTURE SLICE, the TELLING PROFILE instrument, and the OXO telling profile parked by name for phase 2. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_texture_system.md"}, "doc:ssot_01_three_check_pass": {"t": "ssot_01_three_check_pass", "k": "doc · 1.0.1", "d": "The P8–P10 application pass (Modern Poetics): Fantasy Drive · Sexy Check · Aesthetic Check over the flagship canon roster. Three sweeps, never bundled per element. Module of [[doc:ssot_01_modern_poetics|ssot_01_modern_poetics]]. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_three_check_pass.md"}, "doc:ssot_01_touchstones_register": {"t": "ssot_01_touchstones_register", "k": "doc · 0.9.0", "d": "THE TOUCHSTONES REGISTER: the one home for every Touchstone, the rules the story can never break. A bootstrap until the other systems reach stable releases. ⧗ 0.", "w": "ShroomsQ/_CANON/_SSOT/01_NARRATIVE_FRAMEWORKS/📐 ssot_01_touchstones_register.md"}, "doc:ssot_01_trope_register": {"t": "ssot_01_trope_register", "k": "doc · 1.0.0", "d": "THE TROPE REGISTER: one trope layer under every system. 4,948 TV Tropes tropes, each tagged with the domains it serves and keyed to a layer of that domain's slic /* level 1 · CONTEXT: the ten systems */

    </button>`;

/* level 4 · DETAIL: one layer */
function fieldRows(l) {
  const inL = new Set(l.fields);
  const top = l.fields.filter(f => !FIELDS[f].parent || !inL.has(FIELDS[f].parent));
  const out = [];
  top.forEach(f => { out.push([f, false]); l.fields.filter(c => FIELDS[c].parent === f).forEach(c => out.push([c, true])); });
  return out.map(([f, sub]) => {
    const r = FIELDS[f];
    const tag = r.tag ? `<span class="chip tag-${r.tag}">${esc(r.tag)}</span>` : `<span class="chip tag-none" title="${r.needs_tag ? 'needs a tag' : 'predates the tag table: the state module\'s Decision Test decides'}">${r.needs_tag ? 'untagged' : 'pre-tag'}</span>`;
    const notes = [r.note, r.layers.length > 1 ? 'also on ' + r.layers.filter(x => x !== l.id).join(', ') : '', r.scalar ? 'the layer\'s scalar' : ''].filter(Boolean).join(' · ');
    return `<tr class="${sub ? 'sub' : ''}"><td>${T('fld:' + f, `<code class="inl">${esc(f)}</code>`)}${notes ? `<span class="n">${esc(notes)}</span>` : ''}</td><td>${tag}</td><td class="v">${esc(r.intro)}</td><td class="v">${esc(r.origin === 'table' ? 'table' : 'decl.')}</td></tr>`;
  }).join('');
}

        ${libs.length ? `<div style="margin-top:8px" class="lbl">feeds hardest (library)</div><div class="prose">${libs.map(b => T(b.id, esc(b.id)) + ' ' + b.book_html).join('<br>')}</div>` : ''}</div>
      <div class="card"><h3>Feeds <small>${ins.length} in · ${outs.length} out</small></h3><div class="edgelist">${ins.map(e => fe(e, 'in')).join('') + outs.map(e => fe(e, 'out')).join('') || '<span class="c-dim">The declarations state no feed for this layer.</span>'}</div></div>
