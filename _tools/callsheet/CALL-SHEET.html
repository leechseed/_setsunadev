<title>Call Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: thin strip with the ruled count and "take all recs", then one card per open call, grouped by thread. Dark only, the creator-cases orange. */
  :root { color-scheme: dark;
    --bg:#121110; --panel:#1B1A18; --panel-2:#24221F; --line:#34312C; --ink:#ECE7DF; --ink-2:#B7B0A5; --ink-3:#7F786E;
    --accent:#FF5A1F; --accent-soft:#3A1D10; --accent-ink:#FFB08F; --good:#5FBF8A; --good-soft:#16261C;
    --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace; }
  html,body{background:var(--bg);color:var(--ink)} body{font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px} *{box-sizing:border-box}
  button,input,textarea{font:inherit;color:inherit} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;margin-inline:-16px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .strip h1{margin:0;font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase} .strip h1 b{color:var(--accent)}
  .spacer{flex:1} .count{font:500 12px var(--mono);color:var(--ink-2)}
  .btn{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:7px 12px;font-weight:700;font-size:13px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#140A05}
  .wrap{max-width:820px;margin:0 auto;display:grid;gap:22px;padding-block:18px}
  .group h2{margin:0 0 8px;font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .group .cards{display:grid;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px}
  .card.ruled{border-color:var(--good)}
  .q{display:flex;gap:10px;align-items:baseline} .q .id{font:500 12px var(--mono);color:var(--ink-3)} .q h3{margin:0;font:700 17px/1.3 var(--body)}
  .ctx{margin:0;font-size:13.5px;color:var(--ink-2);max-width:68ch}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:7px 11px;font-size:14px;text-align:left}
  .opt .rec{font:700 10px var(--mono);letter-spacing:.1em;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .opt[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft)}
  .note{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:14px;min-height:38px;resize:vertical}
  .ruledline{font:500 12px var(--mono);color:var(--good)}
  .msg{font-size:13px;color:var(--ink-3)}
</style>
<header class="strip">
  <h1>Call <b>Sheet</b></h1>
  <span class="count" id="count">0 of 0 ruled</span>
  <span class="spacer"></span>
  <button class="btn primary" id="all" type="button">Take all recs</button>
</header>
<main class="wrap" id="wrap"></main>
<p class="msg" id="msg" style="max-width:820px;margin:0 auto">Each pick saves when you click it. JUDY reads the sheet and executes.</p>
<script>
(function(){
  const CALLS = [
    { g:"BOLO 109 · Riley Moss, the gonzo POV", id:"R1", q:"Who is the other girl, Vivian's opposite?",
      ctx:"You said \"Vivian and God, the other girl's name.\" No canon file names Vivian's opposite. Old notes have Fiona meeting Vivian \"as an equal, both queens of different ruins.\"",
      opts:["Fiona","Someone else (name her in the note)"], rec:0, note:true },
    { g:"BOLO 109 · Riley Moss, the gonzo POV", id:"R2", q:"Where does Vivian live in time?",
      ctx:"Canon puts Vivian in era 4, ASTRO7EX, on the Moon. You placed her origin before DCUS. Keeping era 4 lets the quasar beam be the bridge, and Riley works across eras as the witness.",
      opts:["Keep era 4","Move her origin to era 1 or 2"], rec:0, note:true },
    { g:"BOLO 109 · Riley Moss, the gonzo POV", id:"R3", q:"How old is Riley?",
      ctx:"Canon doesn't state it. She drinks in the Derby-table scene, so she reads 21 or older. The rec makes her a press-pass witness, like Thompson at the Derby.",
      opts:["Adult, mid-20s","Another age (note it; 21+)"], rec:0, note:true },
    { g:"Deep clean · the 15 stale BOLO rows", id:"D1", q:"Close the three that are finished?",
      ctx:"BOLO 33 (MCDP browser, v0 delivered 9/6) · BOLO 47 (dashboard consult; the sit rep page took its picks) · BOLO 49 (Massive presets, shortlist delivered).",
      opts:["Close all three","Keep them open"], rec:0, note:true },
    { g:"Deep clean · the 15 stale BOLO rows", id:"D2", q:"Fold seven into the rows that now own them?",
      ctx:"15 BVX multimedia ingestion → 107 the intake · 23 physique set → 113 the actress lane · 30 Trash Land → 100 systems first · 36 music · 40 cuisine · 41 locus → 108 the research loop · 53 dev standard → 51 the audit.",
      opts:["Fold all seven","Fold some (list them in the note)"], rec:0, note:true },
    { g:"Deep clean · the 15 stale BOLO rows", id:"D3", q:"Park the five that wait on you?",
      ctx:"BOLO 8 (GitHub purge ticket, yours to file) · 12 (the shoot set) · 16 (music-video grammar) · 20 (Forza tracker, resumes on a callout) · 45 (creator-case sweep). Parked rows leave the stale count and stay on the board.",
      opts:["Park all five","Keep them open"], rec:0, note:true },
    { g:"BOLO 113 · the actress reference lane", id:"A1", q:"Your first five actresses?",
      ctx:"Each name becomes a reference card: look, build, screen personality, the roles that show it, scene citations. One per line, plus a word on why if you want.",
      opts:[], rec:null, note:true, big:true }
  ];
  let picks={}, col=null;
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function render(){
    // keep the note being typed: its text, focus and cursor survive every re-render (Chief 10/6: "it keeps defocusing")
    const a=document.activeElement; const keep=(a&&a.classList&&a.classList.contains("note"))?{id:a.id,val:a.value,s:a.selectionStart,e:a.selectionEnd,top:a.scrollTop}:null;
    const groups=[...new Set(CALLS.map(c=>c.g))];
    $("wrap").innerHTML=groups.map(g=>`<section class="group"><h2>${esc(g)}</h2><div class="cards">${
      CALLS.filter(c=>c.g===g).map(c=>{ const p=picks[c.id]||{}; const ruled=p.choice!=null||!!(p.note&&p.note.trim());
        return `<article class="card${ruled?" ruled":""}" data-id="${c.id}">
          <div class="q"><span class="id">${c.id}</span><h3>${esc(c.q)}</h3></div>
          <p class="ctx">${esc(c.ctx)}</p>
          ${c.opts.length?`<div class="opts">${c.opts.map((o,i)=>`<button type="button" class="opt" data-i="${i}" aria-pressed="${p.choice===i}">${esc(o)}${i===c.rec?'<span class="rec">REC</span>':""}</button>`).join("")}</div>`:""}
          ${c.note?`<textarea class="note" id="n-${c.id}" placeholder="${c.big?"One name per line":"Note (optional)"}" rows="${c.big?5:1}">${esc(p.note||"")}</textarea>`:""}
          ${ruled?`<div class="ruledline">RULED · ${esc(p.at?new Date(p.at).toLocaleString():"")}</div>`:""}
        </article>`;}).join("")}</div></section>`).join("");
    const n=CALLS.filter(c=>{const p=picks[c.id]||{};return p.choice!=null||!!(p.note&&p.note.trim());}).length;
    $("count").textContent=`${n} of ${CALLS.length} ruled`;
    if(keep){ const t=$(keep.id); if(t){ t.value=keep.val; t.focus({preventScroll:true}); try{t.setSelectionRange(keep.s,keep.e);}catch(_){} t.scrollTop=keep.top; } }
  }
  async function save(id,patch){
    picks={...picks,[id]:{...(picks[id]||{}),...patch,at:new Date().toISOString()}}; render();
    if(!col){$("msg").textContent="Storage is offline in this view, so picks won't reach JUDY.";return;}
    try{ await col.doc(id).set(picks[id]); $("msg").textContent="Saved."; }catch(e){ $("msg").textContent="Save failed. Click it again."; }
  }
  $("wrap").addEventListener("click",(e)=>{const b=e.target.closest(".opt"); if(!b)return; const id=b.closest(".card").dataset.id; save(id,{choice:+b.dataset.i,label:CALLS.find(c=>c.id===id).opts[+b.dataset.i]});});
  const timers={};
  $("wrap").addEventListener("input",(e)=>{const t=e.target; if(!t.classList.contains("note"))return; const id=t.closest(".card").dataset.id; clearTimeout(timers[id]); timers[id]=setTimeout(()=>save(id,{note:t.value}),700);});
  $("all").addEventListener("click",async()=>{ for(const c of CALLS){ if(c.rec!=null && (picks[c.id]||{}).choice==null) await save(c.id,{choice:c.rec,label:c.opts[c.rec]}); } });
  render();
  (async()=>{
    const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db){$("msg").textContent="Storage is offline in this view, so picks won't reach JUDY.";return;}
    col=db.collection("picks");
    col.onSnapshot((s)=>{ const next={}; s.docs.forEach(d=>{next[d.id]=d.data();}); picks=next; render(); },()=>{});
  })();
})();
</script>
