<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>DOPE SHEET 44</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- DOPE SHEET · the document layout (RULED 9/16, BOLO 55: one page · the rail kept, narrow · the default for every sheet) ----
     Modeled on the NASA NPR and the DoD Instruction: a compact masthead, a boxed front-matter table,
     then the body as numbered sections in one scroll. The center column is the page; everything else is a margin.
     Colorway: the ruled default (creator-cases palette, DARK only; E-INK light face when the viewer forces light). */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320; --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B; --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; font-family: var(--body); font-size: 16.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }
  .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- frame: masthead / toc · doc · rail / foot ---- */
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 224px minmax(0, 1fr) 248px; grid-template-areas: "head head head" "toc doc rail" "foot foot foot"; }

  /* the masthead: one strip. Number · title · state · version. Nothing else lives up here. */
  header.mast { grid-area: head; display: flex; align-items: center; gap: 16px; padding: 0 18px; min-height: 52px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); }
  .mast .num { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .mast .num small { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); }
  .mast .num b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .mast h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.1; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .mast .ver { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .mast .soi { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; background: var(--accent); color: #fff; text-decoration: none; }
  .mast .soi:hover { background: var(--accent-ink); }

  /* the table of contents */
  nav.toc { grid-area: toc; border-right: 1px solid var(--line-2); padding: 16px 0 18px; overflow-y: auto; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.toc .lbl { display: block; padding: 0 18px 8px; }
  .toc-row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; padding: 7px 14px 7px 18px; color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
  .toc-row.sub { padding-left: 30px; grid-template-columns: 30px 1fr; font-size: 13.5px; }
  .toc-row .no { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
  .toc-row .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .toc-row.sub .nm { font-family: var(--body); font-weight: 400; font-size: 13.5px; text-transform: none; }
  .toc-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .toc-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  nav.toc .kv { padding: 14px 18px 0; margin: 12px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-family: var(--mono); font-size: 11px; }
  nav.toc .kv dt { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
  nav.toc .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }

  /* the document: the one scroll */
  main.doc { grid-area: doc; overflow-y: auto; padding: 28px 44px 96px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { main.doc { scroll-behavior: auto; } }
  .page { max-width: 84ch; }
  .page h1.dt { margin: 0 0 14px; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 3.6vw, 44px); line-height: .98; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  .page h1.dt small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .18em; color: var(--accent-ink); margin-bottom: 8px; }

  /* front matter: the boxed field table (the DoDI cover block, the NPR preface) */
  .fm { display: grid; grid-template-columns: max-content 1fr; margin: 0; border: 1px solid var(--line-2); background: var(--panel); font-size: 14.5px; }
  .fm > * { padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .fm > *:nth-last-child(-n+2) { border-bottom: 0; }
  .fm dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); background: color-mix(in srgb, var(--panel-2) 70%, transparent); border-right: 1px solid var(--line); padding-top: 9px; }
  .fm dd { margin: 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .fm dd.st { color: var(--ink); }

  /* sections */
  section.sec { padding-top: 24px; margin-top: 28px; border-top: 1px solid var(--line-2); scroll-margin-top: 8px; }
  section.sec.pre { border-top: 0; margin-top: 22px; padding-top: 0; }
  .sh { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px; }
  .sh .no { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--accent-ink); min-width: 34px; }
  .sh h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
  .sh .src { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  p.plain { margin: 0 0 16px; font-size: 16.5px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }
  .sub { margin-top: 18px; scroll-margin-top: 8px; }
  .sub > .lbl { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .sub > .lbl .no { font-family: var(--mono); color: var(--accent-ink); letter-spacing: .08em; }

  /* P.1 purpose · P.2 the order */
  .purpose { font-size: 17.5px; line-height: 1.5; margin: 0; max-width: 70ch; }
  .order { margin-top: 6px; padding: 18px 22px; border: 1px solid var(--line-2); background: var(--panel); position: relative; }
  .order::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .order .big { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.05; text-transform: uppercase; }
  .order .big strong { color: var(--accent-ink); }
  .order .default { margin: 10px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }

  /* P.3 the calls · the decisions table, the working surface */
  .tblwrap { overflow-x: auto; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 14.5px; border: 1px solid var(--line-2); }
  table.calls th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
  table.calls td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.calls tr:last-child td { border-bottom: 0; }
  table.calls td.n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--accent-ink); width: 40px; text-align: right; }
  table.calls td.q { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; text-transform: uppercase; min-width: 140px; }
  table.calls td.o { color: var(--ink-2); font-size: 13.5px; line-height: 1.4; }
  table.calls td.o .rul { display: block; margin-top: 6px; color: var(--good); font-size: 13.5px; }
  table.calls td.d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); min-width: 160px; }
  table.calls td.d em { font-style: normal; color: var(--accent-ink); font-weight: 500; }
  table.calls td.s { white-space: nowrap; }
  table.calls tr.ruled td.q, table.calls tr.ruled td.n { color: var(--ink-3); }

  /* P.4 the three */
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); }
  .three > div { padding: 10px 14px; border-right: 1px solid var(--line); }
  .three > div:last-child { border-right: 0; }
  .three .w { font-family: var(--display); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
  .three p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }

  /* items */
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); min-width: 28px; text-align: right; padding-top: 2px; }
  .item .text { font-size: 16px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 5px; }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .st-hot i { animation: none; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr span + span { margin-left: -1px; }

  /* mission */
  .msn { padding: 20px 24px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 80ch; }
  .msn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .msn .task { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; text-transform: uppercase; margin: 0; }
  .msn .intent { font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.1; color: var(--accent-ink); margin: 6px 0 0; }
  .msn .spoken { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); font-style: italic; color: var(--ink-2); font-size: 15px; }
  .end ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 5px; font-size: 15.5px; }

  /* execution */
  .me { margin: 0 0 14px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 15.5px; }
  .me .lbl { display: block; color: var(--accent-ink); margin-bottom: 4px; }
  .ph { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .ph:last-child { border-bottom: 0; }
  .ph .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); text-align: right; padding-top: 2px; }
  .ph.done .n { color: var(--good); }
  .ph .text { font-size: 15.5px; line-height: 1.5; }
  .ph .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .coord ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }

  /* files */
  table.files { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.files th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.files td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.files td.p { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .cost { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
  .cost > div { display: flex; flex-direction: column; }
  .cost b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .cost span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

  /* log */
  .lg { display: grid; grid-template-columns: 56px 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
  .lg:last-child { border-bottom: 0; }
  .lg .who { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .lg.claude .who { color: var(--ink-3); }

  /* related */
  .rel { display: grid; gap: 6px; font-size: 15px; }
  .rel b { font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; margin-right: 6px; }

  /* the rail: where you are (follows the scroll) · term detail on click */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 18px 18px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 16px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .02em; }
  .rail h4 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: .14em; color: var(--accent-ink); margin-bottom: 2px; }
  .ctx { display: grid; gap: 12px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 3px; color: var(--accent-ink); }
  .ctx .c p { margin: 0; font-size: 14.5px; line-height: 1.45; }
  aside.rail.gl .ctxwrap { display: none; }
  .glos { display: none; flex-direction: column; gap: 10px; }
  aside.rail.gl .glos { display: flex; }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  .gl-detail { padding: 12px 14px; border: 1px solid var(--line-2); background: var(--panel); }
  .gl-detail h5 { margin: 0 0 6px; font-family: var(--display); font-size: 21px; font-weight: 700; text-transform: uppercase; }
  .gl-detail p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .gl-detail .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* footer key strip */
  footer.foot { grid-area: foot; border-top: 1px solid var(--line-2); padding: 7px 18px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 85%, transparent); }
  footer.foot kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-right: 3px; }
  footer.foot .r { margin-left: auto; }

  /* tooltips */
  .tip { position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); box-shadow: var(--shadow); padding: 12px 14px 10px; font-size: 14.5px; line-height: 1.45; }
  .tip .th { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tip .th b { font-family: var(--display); font-weight: 700; font-size: 19px; text-transform: uppercase; }
  .tip .th .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .tip p { margin: 0; }
  .tip .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .tip .lock { height: 2px; background: var(--line); margin-top: 10px; position: relative; }
  .tip .lock b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  .tip.locked .lock b { width: 100%; }
  .tip.locked { border-top-color: var(--ink); }
  .tip .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px; letter-spacing: .06em; }

  @media (max-width: 1080px) { .app { grid-template-columns: 200px minmax(0, 1fr) 0; } aside.rail { display: none; } aside.rail.gl { display: flex; position: fixed; right: 0; top: 52px; bottom: 0; width: min(320px, 90vw); z-index: 40; box-shadow: var(--shadow); } }

nalized, STATE updated, the day's journal appended, the reply ends with the OUT block. Nothing is parked into a card any more; every BOLO's resume order lives on its [[dope-sheet|DOPE SHEET]]. [[charlie-mike|Charlie Mike]] resumes; [[rtb|RTB]] sends the old parked cards home.", "w": "SOP.md §1 · §7 rule 9"}, "sweep": {"t": "sweep", "k": "proword", "d": "Retired 9/10, replaced by [[rtb|RTB]]. Was: promote the parked keepers to their real homes and clear oscar-mike/.", "w": "SOP.md §1", "st": "retired"}, "how-copy": {"t": "how copy?", "k": "proword", "d": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one question.", "w": "SOP.md §1", "st": "ruled"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X aims it at one item.", "w": "SOP.md §1", "st": "ruled"}, "bolo": {"t": "BOLO", "k": "proword", "d": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighting, wraps, holds. The board noun is the watchlist itself.", "w": "BOLO.md", "st": "ruled"}, "pmcs": {"t": "PMCS", "k": "noun", "d": "Preventive Maintenance Checks and Services. The operator is equipment: body, medical, life admin. Never mixed with projects.", "w": "BOLO.md · PMCS table"}, "ivory-tower": {"t": "ivory tower", "k": "proword", "d": "Academic mode: published literature only, every claim cited inline, established versus contested marked.", "w": "SOP.md §1", "st": "ruled"}, "break-break": {"t": "break-break", "k": "proword", "d": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it.", "w": "SOP.md §1", "st": "ruled"}, "buttonhook": {"t": "buttonhook back", "k": "proword", "d": "Close the detour and return to the parked thread unprompted, restating where  card (SOP §0), Block VII of every board, and since 9/11 its own page — search, A to Z, by section, the dictation codebook. \"Glossary\" is retired as a word (Papi, 9/11); every button and key says SOI.", "w": "SOP.md §0 · _tools/soi/ · the SOI page", "st": "ruled"}, "sop": {"t": "SOP", "k": "noun", "d": "SOP.md, the canonical home of every comms code and session protocol. On any conflict with memory, the file wins.", "w": "SOP.md"}, "trunk-black": {"t": "BLACK", "k": "noun", "d": "BLACK = Bold Venture (BVX): creative, IP, systems. Everything you make lands in one of two trunks; this is the first.", "w": "SOP.md §2"}, "trunk-orange": {"t": "ORANGE", "k": "noun", "d": "ORANGE = Ultrasin: venture, body, sexuality. The second house.", "w": "SOP.md §2"}, "trunk-operator": {"t": "OPERATOR", "k": "noun", "d": "OPERATOR = you as equipment: [[pmcs|PMCS]], tooling, readiness. Not a house; the person who runs both.", "w": "SOP.md §2"}, "stall-pattern": {"t": "the stall pattern", "k": "ruling", "d": "The recurring failure: a finished design blocked on one unanswered decision, then rebuilt from scratch later. The fix is the ruling, not more structure.", "w": "memory · STATE.md"}, "d9": {"t": "D-9", "k": "item", "d": "Ledger item D-9 on the [[bolo24|BOLO 24]] charter: the [[boresight]] HOLD from 9/3, converted 9/4, undated for twelve days and named by five boards running. **RULED GO 2026-09-16** (\"rule D9 go\"), staged clear: the no-dependency items deliver, the rest as their gates (D-5 · D-6 · D-7) clear.", "w": "_PRIVATE/BOLO-24-charter.md · STATE Blocked #10", "st": "ruled"}, "bolo24": {"t": "BOLO 24", "k": "item", "d": "The zero-budget ORANGE launch: 3D erotica stills in Blender, DARKROOM-fed, Ultrasin as the studio, a first signing with an arc. Charter in _PRIVATE/. Gated by [[d9|D-9]]; the next proposed gate is [[r9|R9]].", "w": "BOLO.md #24"}, "r9": {"t": "R9", "k": "item", "d": "Synthesis recommendation 9: thirty days on a fresh X account before any platform commit. Zero cost. Metric: follower growth against Kirenes' no-funnel rate and Variety Itsol's studio-promoted year one.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "r10": {"t": "R10", "k": "item", "d": "Fill reference seats 4 to 8 with the same agent template: a disclosed-AI creator on Fanvue, a Patreon 3D still artist, a Reddit-native grower, the itsmemphishxe reference.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "cam-line": {"t": "the cam line", "k": "item", "d": "The Lab-venture question: live cam access is Siswet's moat, and a rendered persona cannot stand in a live room. Board it as the difference between the two ORANGE plays, or rule it irrelevant.", "w": "oscar-mike/creator-cases.md"}, "ultra-dark": {"t": "ULTRA DARK", "k": "system", "d": "BOLO 27: the curation imprint under Ultrasin. A rating scale plus a written line on every post; commissioned edits as the first-dollar line. A funnel, never the asset.", "w": "oscar-mike/ultradark-walkthrough.md · _PRIVATE/ULTRADARK-*.md"}, "block-c": {"t": "Block C", "k": "item", "d": "The [[ultra-dark|ULTRA DARK]] walkthrough's third step: you mark 12 to 16 clips in [[stash|Stash]], say marked, the pull script fires, Resolve builds the 12-second blurb. Blocks A and B have been done since 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON_NODES/oxo-telling-profile.md"}, "series": {"t": "SERIES", "k": "ruling", "d": "Ruling R9 of 9/9: The Outliers is a series, not a feature and not prose. Recorded in the storyform frontmatter. It unblocked the first scene card and the first Fountain pages.", "w": "_CANON_NODES/oxo-storyform.md"}, "outliers": {"t": "The Outliers", "k": "system", "d": "OVEREXITOUT / The Outliers: the flagship BLACK IP. Storyform ruled 8/24, DCUS instanced 8/26, medium ruled [[series]] 9/9, first pages 9/10. Anna still has no node.", "w": "_CANON_NODES/ · OUTLIERS_FINAL_DRAFT/"}, "warroom": {"t": "WARROOM", "k": "system", "d": "The MCDP doctrine browser: MIL.01 to MIL.11 as a game encyclopedia on the [[ck3-rules|CK3 rules]]. Version 1.1 wears the [[watch-register|WATCH register]]. Name provisional; paused by you on 9/6.", "w": "MCDP-CODEX.html"}, "watch-register": {"t": "the WATCH register", "k": "system", "d": "One grammar, two faces keyed to room light: DAY paper for the lit desk, NIGHT near-black for the dark one. Seven hues, every ratio contrast-checked against the long-watch standards. WARROOM wears it; this page moved to the creator-cases colorway on 9/10 by your ruling.", "w": "_0.1_BVX_LEARN/_meta/WATCH-REGISTER.md"}, "ck3-rules": {"t": "the CK3 rules", "k": "system", "d": "Nineteen rules derived from Crusader Kings III's interface: concept links with nested tooltips capped at depth 3, timer or key lock, a character-sheet layout, an outliner plus an encyclopedia, one semantic color set. This page runs on them.", "w": "_0.1_BVX_LEARN/_meta/CK3-IA-STUDY.md"}, "bolo45": {"t": "BOLO 45", "k": "item", "d": "The creator-case sweep and the manager path. Ruled 9/10: [[natasha-teen|Natasha Teen]] is the referent; everything public unless you specify; the management recon ordered. Its three files never landed; relaunched this evening.", "w": "BOLO.md #45"}, "the-take": {"t": "THE TAKE", "k": "item", "d": "The placeholder name for the lessons block on each creator case. Ruled [[ttp|TTP]] on 9/10.", "w": "explainer page · BOLO 45", "st": "retired"}, "creator-case": {"t": "creator case", "k": "noun", "d": "One file about one creator: how they started, how they run it, how they get paid. Public record only, filed beside the [[register|performer register]]. Seven exist; two more are running.", "w": "_CANON_NODES/creator-case-*.md"}, "register": {"t": "the performer register", "k": "system", "d": "138 names, any sex, 21 in the stable core. Lanes: performer · e-girl · creator case · Stash name. Built 9/8 from nine of your lists; widened 9/9.", "w": "_CANON_NODES/performer-register.md"}, "nasa-girl": {"t": "the NASA girl", "k": "item", "d": "The performer you recalled by story (used to be an engineer, NASA, then did this). Two candidates were built on 9/10; you named her this evening: Rebel Rhyder. Her case is running; the candidates stay as receipts.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "natasha-teen": {"t": "Natasha Teen", "k": "person", "d": "Register row, lane P, starred by you 9/9. The referent for like Natasha Teen did; her case verifies whether she built an agency or roster.", "w": "_CANON_NODES/performer-register.md"}, "explainer": {"t": "the explainer register", "k": "ruling", "d": "The elementary landing-page voice you liked on 9/10: what we did last, what the plan was, what you did, in plain words. This board's right rail speaks it on every block.", "w": "https://claude.ai/code/artifact/68adc31f-f644-45de-881f-6d17a355021f"}, "modmigrate": {"t": "modmigrate", "k": "item", "d": "_tools/modmigrate/: the 9/7 Minecraft modpack migration (Modrinth Fabric 1.21.11 to NeoForge 1.21.11). Real work with no STATE row, no BOLO, no journal. Surfaced on three boards running.", "w": "_tools/modmigrate/"}, "bolo37": {"t": "BOLO 37", "k": "item", "d": "The proword selection loop: five candidates, pick three ranked, ten a day, Claude's sealed pick revealed after. Name bench MINT (rec). Three spec gaps; gap 3, placement, is answered by this page.", "w": "BOLO.md #37 · SOP.md §5"}, "bolo38": {"t": "BOLO 38", "k": "item", "d": "The sit rep as a front page, the CK3 save-load screen. Captured 9/6; fired 9/10 evening on your order; v0.5 on 9/10 night. Charlie Mike'd 9/11: OPORD retitle, the SOI published, both pages re-pointed. Its OPORD page carries the rest.", "w": "BOLO.md #38"}, "the-box": {"t": "the box", "k": "system", "d": "The machine's servers: [[stash|Stash]] on :9999 and [[darkroom|DARKROOM]] on :8484. Both up this evening, the first time at a board since 9/4.", "w": "localhost"}, "bolo29": {"t": "BOLO 29", "k": "item", "d": "The SFW TikTok channel: owned Fortnite skins doing the emotes, faceless, BLACK. Research banked; held on one question, the reward-versus-risk reading.", "w": "oscar-mike/bolo29-tiktok.md"}, "bolo35": {"t": "BOLO 35", "k": "item", "d": "The story timeline tool and its theory: sound synthesis against the conservatory score. Read delivered 9/6; four questions held.", "w": "oscar-mike/story-timeline.md"}, "bolo41": {"t": "BOLO 41", "k": "item", "d": "The locus system: research filed by neighborhood. Convention provisional in _0.1_BVX_LEARN/LOCI/; needs your ratification.", "w": "_0.1_BVX_LEARN/LOCI/README.md"}, "numbering": {"t": "the 03/03 numbering", "k": "item", "d": "Two domains share the 03 prefix: 03_SETTING_SYSTEMS (stood up 8/25) and the empty pre-reserved 03_PLOT_SYSTEMS. One rename either way.", "w": "ShroomsQ/_CANON/_SSOT/"}, "trash-land": {"t": "Trash Land", "k": "item", "d": "BOLO 30: the man-made trash DMZ between the southern and northern US, mountain-range scale. Seed node written 9/6; seven rulings open, name bench recommends The Midden.", "w": "_CANON_NODES/oxo-trash-land-seed.md"}, "main-effort": {"t": "the main effort", "k": "proword", "d": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep's Block VI rename rides on it. On this board it has been [[block-c|Block C]] plus [[d9|D-9]] since 9/4.", "w": "SOP.md §5", "st": "provisional"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "The Marine Corps operations order: Situation · Mission · Execution · Administration and Logistics · Command and Signal. Mission first, then how. A BOLO status page is written in this shape.", "w": "MIL.05 · MCDP 5 Planning"}, "speed": {"t": "speed", "k": "ruling", "d": "MCDP 1: speed over time is tempo, and tempo is itself a weapon. On a page: read in ten seconds, the order on top, the story underneath. One of the three that govern the status page, with [[focus]] and [[boldness]].", "w": "MIL.01 §4 · invariant 8"}, "focus": {"t": "focus", "k": "ruling", "d": "MCDP 1: the convergence of effects at the decisive time and place, which demands strict economy everywhere else. On a page: one [[main-effort|main effort]] named, everything else supporting it and kept short.", "w": "MIL.01 §4 · invariant 8"}, "boldness": {"t": "boldness", "k": "ruling", "d": "MCDP 1: unhesitating exploitation of uncertainty to pursue major rather than marginal results; do not strive for certainty before you act. On a page: every call carries a default that runs if you say nothing.", "w": "MIL.01 §4 · quotes"}, "commanders-intent": {"t": "commander's intent", "k": "ruling", "d": "The purpose behind a task, stated as task plus in order to. The why outlasts the what, so a subordinate can act without asking. The Mission paragraph of every status page carries it.", "w": "MIL.01 §8"}, "mission-tactics": {"t": "mission tactics", "k": "ruling", "d": "Assign the task and the intent, leave the method to the one doing it, intervene only by exception. It is why a status page states defaults instead of asking questions.", "w": "MIL.01 §8"}, "ofm": {"t": "OFM agency", "k": "noun", "d": "The fansite-era management agency: an operations vendor running messages, traffic and posting on the creator's own account for 20 to 50 percent or more. A different business from the licensed booking agent of the studio era (10 to 15 percent).", "w": "_CANON_NODES/creator-management-recon.md §0"}, "ash": {"t": "A.S.H.", "k": "item", "d": "Riley Reid's creator-first agency, launched April 2021 because friends were paying up to 30 percent. The verified item behind the recon's creator-first list; the earlier Clubhouse Media Group line was a conflation and is corrected.", "w": "_CANON_NODES/creator-management-recon.md"}, "fla-468": {"t": "Florida ch. 468", "k": "item", "d": "Florida's talent-agency licensing statute: anyone who, for compensation, procures engagements for an artist, and artist includes a model. Running a creator's own account is not obviously procuring; booking that creator into a shoot or brand deal plainly is. An attorney question the moment a second human is booked.", "w": "_CANON_NODES/creator-management-recon.md §0"}, "management-recon": {"t": "the management recon", "k": "item", "d": "The sourced read on the manager path, 171 URLs: two businesses share the word agency; Fanvue is the only platform with a real agency structure; creator-first is the documented origin of the lane; reputation, not capital, is the barrier.", "w": "_CANON_NODES/creator-management-recon.md"}, "management-voices": {"t": "the management voices", "k": "item", "d": "Twenty-two first-person accounts of people who became managers, agency owners or house-builders. Nobody credible started with a roster; they started with one relationship. The commission number is the ethics map. Account control is the line.", "w": "_CANON_NODES/creator-management-voices.md"}, "bolo42": {"t": "BOLO 42", "k": "item", "d": "The admired-performers table, delivered 9/8 as the [[register|performer register]]; widened 9/9 to any sex; the creator-case nodes link from its rows.", "w": "BOLO.md #42"}, "rebel-rhyder": {"t": "Rebel Rhyder", "k": "person", "d": "The [[nasa-girl|NASA girl]], named by you 9/10 evening. Her case landed the same night: an electrical engineer who worked in aerospace for two years, in her own words; NASA is Rocco Siffredi's word only. Register row added, lane P, source S.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "challenge": {"t": "the challenge phrase", "k": "proword", "st": "ruled", "d": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is never explained.", "w": "STATE.md header · SOP.md §1"}, "out-block": {"t": "the OUT block", "k": "proword", "st": "ruled", "d": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing after it: OSCAR MIKE · OUT · OUT · OUT. A visible seam between what was parked and what starts next. Coded 9/6 on your order.", "w": "SOP.md §7 rule 9"}, "status-on-bolo": {"t": "status on BOLO N", "k": "proword", "st": "ruled", "d": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO, which is the update, not the page.", "w": "SOP.md §1 · §8"}, "recon": {"t": "recon", "k": "proword", "st": "benched", "d": "Benched 9/6: the [[boresight]] protocol aimed outside the wire (web and literature) instead of at the vault. \"Napkin recon\" would be the one-pass form. Waits in the [[bolo37|selection loop]].", "w": "SOP.md §5"}, "napkin": {"t": "napkin", "k": "proword", "st": "benched", "d": "Benched 9/6 as a modifier: back-of-the-napkin, one pass, rough numbers, no question loop. Spoken as a prefix: \"napkin boresight\", \"napkin recon\".", "w": "SOP.md §5"}, "syllabus": {"t": "syllabus", "k": "proword", "st": "benched", "d": "Benched 9/6: \"pull the syllabus on X\" = the tier-one 101 textbooks of a field, [[ivory-tower|ivory tower]], one per field to start.", "w": "SOP.md §5"}, "distill": {"t": "distill", "k": "proword", "st": "benched", "d": "Benched 9/6: make the BVX-LEARN one-sheet. The doctrine's own word: distill, don't summarize.", "w": "SOP.md §5"}, "grammar": {"t": "grammar", "k": "proword", "st": "benched", "d": "Benched 9/6: \"write the grammar\" = derive a system's operating language from its sources.", "w": "SOP.md §5"}, "mint": {"t": "MINT", "k": "proword", "st": "benched", "d": "Recommended name for the proword selection loop ([[bolo37|BOLO 37]]): where the lexicon gets struck, beside DARKROOM and WARROOM. Bench: BREVITY · SOI · CALLSIGN · LEXICON. Your ruling.", "w": "BOLO.md #37 · SOP.md §5"}, "readyroom": {"t": "READYROOM", "k": "proword", "st": "benched", "d": "Recommended name for the sit rep front page program: the Navy's briefing room, sibling of DARKROOM and WARROOM. Bench: OPSROOM · FRONTPAGE · THE BOARD. Your ruling.", "w": "BOLO.md #38"}, "ttp": {"t": "TTP", "k": "item", "d": "Tactics, Techniques and Procedures. Section 10 of every [[creator-case|creator case]]: the one mechanic worth studying, three to five transferable tips, what does not transfer, and which venture it feeds. Named by Papi 9/10 from the Corps bench (GOUGE was the provisional header); struck alternatives THE TAKE, LESSONS LEARNED, HOT WASH.", "w": "SOP.md §5 · _CANON_NODES/creator-case-*.md §10", "st": "ruled"}, "rtb": {"t": "RTB", "k": "proword", "d": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, the folder cleared. Papi's own coinage 9/10; replaces the retired [[sweep|sweep]]. Third movement of the park trio with [[oscar-mike|Oscar Mike]] and [[charlie-mike|Charlie Mike]]. 9/11: one meaning only — the pass that sends a parked card home and clears it; retires itself when oscar-mike/ is empty. The end of the sortie is Oscar Mike.", "w": "SOP.md §1", "st": "ruled"}, "charlie-mike": {"t": "Charlie Mike", "k": "proword", "d": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The park trio is Oscar Mike (park), Charlie Mike (resume), [[rtb|RTB]] (return to base).", "w": "SOP.md §1", "st": "ruled"}, "gouge": {"t": "GOUGE", "k": "item", "d": "Navy and Marine slang for the essential distilled information. Recommended 9/10 as the name for the creator-case lessons block and used as its provisional header for a few hours; Papi ruled [[ttp|TTP]] instead. Bench only.", "w": "SOP.md §5", "st": "retired"}, "frago": {"t": "FRAGO", "k": "proword", "st": "ruled", "d": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Papi's clarification 9/10 late (\"FRAGO is just the update after we've made the BOLO status page\"). \"FRAGO 45\" folds what changed since the last build into [[opord|OPORD 45]] and republishes; only what changed, everything not mentioned stands as ordered; the page's Log keeps every FRAGO.", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "opord": {"t": "OPORD (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 after twelve hours (\"there has to be a better name than that, something much cooler\"). The thing it named is the [[dope-sheet|DOPE SHEET]].", "w": "SOP.md §5"}, "bolo46": {"t": "BOLO 46", "k": "item", "d": "The OXO series follow-through: the [[telling-profile|Telling Profile]]'s 12 rulings · Anna's node · the pilot's page one. Captured 9/11 at priority one on Papi's word; it had no BOLO before.", "w": "BOLO.md #46"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRAGOs]]. RULED 9/11: header \"DOPE SHEET N\"; spoken \"give me the dope on N\", \"status report on N\", \"the situation on N\" all read the same. From the Scout Sniper's DOPE book: Data On Previous Engagements, everything known on the target and every prior engagement in one book. Replaced OPORD (retired the same morning).", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "bolo47": {"t": "BOLO 47", "k": "item", "d": "The dashboard consult: eight ranked ideas from current Claude Code / VS Code operator boards for the [[sitrep|sit rep]] page. Captured 9/11; none taken yet.", "w": "BOLO.md #47"}, "bolo48": {"t": "BOLO 48", "k": "item", "d": "The name bench: every unruled word with its bench on one sheet. Ruled 9/11: DOPE SHEET · ADORNED · ABORT (the cancel word) · BREVITY (what the SOI holds) · HOTLINE / HOTLINE ACTUAL (the operator's callsign). Closed 9/11: the close-out is Oscar Mike, ENDEX retired. Open: READYROOM · MINT. Pool: \"caught up\" · INTEL.", "w": "BOLO.md #48 · SOP §5"}, "bolo49": {"t": "BOLO 49", "k": "item", "d": "The Massive presets: the best free banks for Native Instruments Massive, verified 9/11; the shortlist is on its sheet.", "w": "BOLO.md #49"}, "eink": {"t": "E-INK", "k": "ruling", "st": "provisional", "d": "The light face of every internal page, provisional 9/11: Kindle-gray paper (#D8D8D2 ground, #E4E4DE surface), never white — \"like an old Kindle… digital ink.\" Shown only when a viewer forces light; DARK is the only theme and the toggle is gone.", "w": "SOP.md §2 · the three templates"}, "adorned": {"t": "ADORNED", "k": "ruling", "st": "ruled", "d": "DARKROOM dress-state value, RULED 9/11 (\"let's do adorned\"): naked except for an accessory — socks, heels, jewelry, glasses, a hat, a harness; the r/WhyWearAnythingAtAll read. Replaced implied (retired 9/11: no garment and nothing shown). Vocab edited, zero-shot rerun, probes retrained the same morning; 42 old human confirmations still say implied and are left as Papi's record.", "w": "_PRIVATE/taxonomy_engine/vocab.json · BOLO 44"}, "actual": {"t": "ACTUAL", "k": "proword", "st": "ruled", "d": "The suffix for the commander in person on the net (\"Six Actual\"). RULED 9/11 as the formal form of the operator's callsign: [[hotline|HOTLINE ACTUAL]]. Never alone.", "w": "SOP.md §5"}, "bolo50": {"t": "BOLO 50", "k": "item", "d": "The standards campaign: every level of the operation as a standards organization; a networked library of outside and Command-made standards. Research phase: the harvest banked as a locus, the register pulled by agent. Opened 9/11 on a break-break.", "w": "BOLO.md #50 · _0.1_BVX_LEARN/LOCI/standards.locus.md"}, "abort": {"t": "ABORT", "k": "proword", "st": "ruled", "d": "The cancel word, RULED 9/11: \"abort abort abort\" spoken three times, then the correction. Cancels the immediately preceding order; the record keeps the abort line, not the order. Aircrew and JTAC lineage: the call not to release. First live use the same minute: \"abort abort abort the index process\" (the ENDEX). Replaced belay.", "w": "SOP.md §0–1 · §5"}, "brevity": {"t": "BREVITY", "k": "noun", "st": "ruled", "d": "What the [[soi|SOI]] holds, RULED 9/11 (\"I do like brevity better\"): the Command's word list, after the Multi-Service Brevity Codes, the list that makes radio short. The SOI's subtitle on every page. Replaced \"the lexicon\" (provisional) and \"the house tongue\" (retired). BREVITY leaves MINT's bench; MINT stands for the loop.", "w": "SOP.md §0 · §6 · the SOI page"}, "hotline": {"t": "HOTLINE", "k": "proword", "st": "ruled", "d": "The operator's callsign, RULED 9/11. Casual: \"Hotline\", \"word from Hotline\". On the net and on every page: **HOTLINE ACTUAL**. The point: the word comes from on high, detached from the person, the way CENTCOM ACTUAL speaks for the command, not for a man (\"remove the artist from the art\"). Replaces \"you\" on the explainer rail.", "w": "SOP.md §0–1 · §5 · const WHO in the templates"}, "bolo51": {"t": "BOLO 51", "k": "item", "d": "The logistics front: one standing audit, quality, and improvement function over every system in daily use, plus the token offload onto hooks, skills, subagents, routines, and the design canvas. Standards pulled from BOLO 50's register. Opened 9/12.", "w": "BOLO.md #51 · DOPE SHEET 51"}, "proword": {"t": "proword", "k": "noun", "st": "ruled", "d": "Procedure word. Radiotelephony's fixed words that stand for a whole instruction: ROGER, WILCO, OUT, SAY AGAIN. NATO's book for them is ACP 125. The Command's prowords are the same idea aimed at the protocol: say one and the procedure fires.", "w": "SOP.md §0–1 · ACP 125"}, "gear": {"t": "gear N", "k": "proword", "st": "provisional", "d": "The agent ceiling for the current task, spoken as a number. Gear 1 = 3 agents (the default; silence means gear 1) · 2 = 6 · 3 = 9 · 4 = 12 · 5 = 15, never used: the ceiling exists to be named. A shift lasts one task, then back to gear 1. At every gear, fetch-and-extract agents run haiku, write-ups sonnet, fable on the main line only. Working name (Papi 9/12: \"let's just call them gears for now\"); warps and DEFCON aborted in the same breath. Part of [[gearbox|the gearbox]].", "w": "SOP.md §1 · §5 · BOLO 52"}, "gearbox": {"t": "the gearbox", "k": "system", "st": "provisional", "d": "The sustainable-speed system, opened 9/12 as BOLO 52: the [[gear|gears]] (the agent ceiling), the gauge (_tools/usage/, weighted tokens per day from the local transcripts), and the weekly budget the week must fit. Lineage: the 9/10 sixteen-agent run spent half a week in one session. Never sixteen again.", "w": "_tools/usage/ · BOLO 52 · SOP.md §1"}, "bolo52": {"t": "BOLO 52", "k": "item", "d": "The gearbox: the sustainable-speed system. Gears 1–5 as the agent ceiling, the gauge, the weekly budget. Spun out of BOLO 51 on 9/12; name provisional.", "w": "BOLO.md #52"}, "bolo53": {"t": "BOLO 53", "k": "item", "d": "The Command's own development standard: the boresight → how-copy → build → FRAGO → Oscar Mike loop read as an iterative-incremental life cycle, filed beside the project flow. Tabled 9/12; OPENED 9/15 by Papi's \"Open 53\"; v0.1 working draft on disk.", "w": "BOLO.md #53 · DOPE SHEET 53 · ShroomsQ/_CANON/_SSOT/05_OPERATIONS/📐 ssot_05_operations_development_standard.md"}, "bolo54": {"t": "BOLO 54", "k": "item", "d": "The sit rep formation: orchestrator, independent specialists, one reviewer at the fan-in. Papi's doctrine 9/12 (Amdahl · Brooks · context is the cost unit · review at the merge). Built the same turn: prep.py · assemble.py · the sitrep skill. The main line's read drops from ~211 KB to ~3 KB.", "w": "BOLO.md #54 · DOPE SHEET 54 · .claude/skills/sitrep/"}, "formation": {"t": "the formation", "k": "system", "st": "provisional", "d": "How agents are laid out on any multi-agent job (BOLO 54, 9/12): hub and spoke. The main line decomposes into pieces that share no state; specialists run independently on disjoint inputs; they sync only at named handoff points; one reviewer, a script where it can be, sits at the fan-in. No peer cross-checks. Rides the [[gearbox|gearbox]]: the gear says how many, the formation says how they stand.", "w": "SOP.md §1 (the gear row) · BOLO 54"}, "bolo55": {"t": "BOLO 55", "k": "item", "d": "The DOPE SHEET format — the document layout. Captured 9/16.", "w": "BOLO.md #55 · DOPE SHEET 55"}, "command": {"t": "the Command", "k": "noun", "st": "ruled", "d": "The whole operation under HOTLINE ACTUAL: BLACK, ORANGE and OPERATOR together. RULED 2026-09-16 (\"let's go with command\") from a bench of ten on BOLO 48; \"the house\" is retired as the word. Marine usage: the authority a unit answers to. Command standard, the Command's ladder, Command-native; \"organic\" replaces in-house.", "w": "SOP.md §2 · §5 · BOLO 48"}}};
const B = DATA.board, G = DATA.glossary;

const SOI_URL = "https://claude.ai/code/artifact/4c2fc9c7-e0d2-4626-8142-9740ff8ee0e5";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code style="font-family:var(--mono);font-size:.9em">$1</code>');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => { const g = G[k]; const label = l || (g ? g.t : k); return g ? `<a class="t" data-t="${k}" tabindex="0">${label}</a>` : label; });
  return s;
}
const ST = { hot: ['●', 'hot'], open: ['○', 'open'], held: ['◐', 'held'], gated: ['◇', 'on your go'], parked: ['▭', 'parked'], done: ['✓', 'done'], ruled: ['✓', 'ruled'], good: ['●', 'up'], bad: ['▲', 'stalled'], missing: ['▲', 'no record'], corrected: ['↺', 'corrected'], new: ['✦', 'new'] };
const chip = s => { if (!s) return ''; const d = ST[s] || ['·', s]; return `<span class="chip st-${s}">${s === 'hot' ? '<i></i>' : d[0]} ${d[1]}</span>`; };
function trunk(t) { if (!t) return ''; const one = x => x === 'BLACK' ? `<span class="b">BLACK</span>` : x === 'ORANGE' ? `<span class="o">ORANGE</span>` : `<span class="p">${esc(x)}</span>`; return `<span class="tr">${t.split('/').map(one).join('')}</span>`; }

const K = B.bolo, F = B.frago, P = B.paragraphs;

/* ---- masthead: the one strip ---- */

$('#mTitle').title = K.title;

$('#mVer').textContent = `${K.version || ''} · as of ${K.asof}`;

/* ---- the document ---- */
const secNo = i => String(i + 1);
const itemHTML = it => `<li class="item"><span class="n num">${it.n != null ? it.n : ''}</span><div><div class="text">${md(it.t)}</div><div class="meta">${chip(it.s)}${it.when ? `<span class="when">${esc(it.when)}</span>` : ''}</div></div></li>`;
const groupsHTML = (groups, no) => groups.map((g, j) => `<div class="sub"><span class="lbl"><span class="no">${no}.${j + 1}</span>${esc(g.label)}</span><ul class="items">${g.items.map(itemHTML).join('')}</ul></div>`).join('');
function bodyHTML(p, no) {
  if (p.kind === 'list' && p.groups) return groupsHTML(p.groups, no);
  if (p.kind === 'mission') return `<div class="msn"><p class="task">${md(p.task)}</p><p class="intent">${md(p.intent)}</p>${p.spoken ? `<p class="spoken">${md(p.spoken)}</p>` : ''}</div>
    <div class="sub end"><span class="lbl"><span class="no">${no}.1</span>End state · done means</span><ol>${(p.endstate || []).map(e => `<li>${md(e)}</li>`).join('')}</ol></div>`;
  if (p.kind === 'phases') return `${p.main_effort ? `<div class="me"><span class="lbl">Main effort</span>${md(p.main_effort)}</div>` : ''}
    <div class="sub"><span class="lbl"><span class="no">${no}.1</span>Phases</span>${(p.phases || []).map(ph => `<div class="ph ${ph.s}"><span class="n num">${ph.n}</span><div class="text">${md(ph.t)}</div><div class="right">${chip(ph.s)}<span class="when">${esc(ph.when)}</span></div></div>`).join('')}</div>
    <div class="sub coord"><span class="lbl"><span class="no">${no}.2</span>Coordinating instructions</span><ul>${(p.coord || []).map(c => `<li>${md(c)}</li>`).join('')}</ul></div>
    <div class="sub coord"><span class="lbl"><span class="no">${no}.3</span>Running now</span><ul>${(p.running && p.running.length) ? p.running.map(c => `<li>${md(c)}</li>`).join('') : '<li>Nothing on this BOLO. It waits on you.</li>'}</ul></div>`;
  if (p.kind === 'files') return `<div class="tblwrap"><table class="files"><thead><tr><th>Where</th><th>What</th><th>State</th></tr></thead><tbody>${(p.files || []).map(f => `<tr><td class="p">${/^https?:/.test(f.path) ? `<a href="${esc(f.path)}" target="_blank" rel="noopener">${esc(f.path.replace('https://', ''))}</a>` : esc(f.path)}</td><td>${md(f.what)}</td><td>${chip(f.s)}</td></tr>`).join('')}</tbody></table></div>
    ${p.cost && p.cost.length ? `<div class="cost">${p.cost.map(c => `<div><b>${esc(c.v)}</b><span>${esc(c.k)}</span></div>`).join('')}</div>` : ''}`;
  if (p.kind === 'log') return `<div class="log">${(p.entries || []).map(e => `<div class="lg ${/claude|agent/i.test(e.who) ? 'claude' : ''}"><span class="when">${esc(e.when)}</span><span class="who">${esc(e.who)}</span><span>${md(e.t)}</span></div>`).join('')}</div>`;
  if (p.groups) return groupsHTML(p.groups, no);

  return '';
}
const callRow = (c, i) => `<tr class="${c.s}"><td class="n">${i + 1}</td><td class="q">${esc(c.q)}</td><td class="o">${esc(c.options)}${c.ruling ? `<span class="rul">${md(c.ruling)}</span>` : ''}</td><td class="d">default <em>${esc(c.default)}</em></td><td class="s">${chip(c.s)}</td></tr>`;

$('#page').innerHTML = `

    <div class="sub" id="sec-P2"><span class="lbl"><span class="no">P.2</span>The order · next action</span><div class="order"><p class="big">${md(F.order)}</p><p class="default">${md(F.default)}</p></div></div>
    <div class="sub" id="sec-P3"><span class="lbl"><span class="no">P.3</span>${WHO}'s calls · defaults run if silent</span><div class="tblwrap"><table class="calls"><thead><tr><th></th><th>The call</th><th>Options</th><th>Default</th><th>State</th></tr></thead><tbody>${F.calls.map(callRow).join('')}</tbody></table></div></div>
    <div class="sub" id="sec-P4"><span class="lbl"><span class="no">P.4</span>The three</span><div class="three">${B.mantra.map(m => `<div><span class="w"><a class="t" data-t="${m.k}" tabindex="0">${esc(m.w)}</a></span><p>${md(m.line)}</p></div>`).join('')}</div></div>
  </section>
  ${P.map((p, i) => `<section class="sec" id="sec-${i + 1}" data-i="${i}"><div class="sh"><span class="no">${secNo(i)}</span><h2>${esc(p.name)}</h2><span class="src">¶ ${esc(p.id)}</span></div><p class="plain">${md(p.plain)}</p>${bodyHTML(p, secNo(i))}</section>`).join('')}
  <section class="sec" id="sec-A"><div class="sh"><span class="no">A</span><h2>Related</h2><span class="src">BOLOs this one leans on</span></div><div class="rel">${(K.related || []).map(r => `<div><b>BOLO ${r.n}</b>${md(r.why)}</div>`).join('')}</div></section>`;

/* ---- contents ---- */
const TOC = [
  { id: 'sec-P', no: 'P', nm: 'Preface' },
  { id: 'sec-P2', no: 'P.2', nm: 'The order', sub: true },

$('#tocRows').innerHTML = TOC.map(t => `<a class="toc-row ${t.sub ? 'sub' : ''}" href="#${t.id}" data-id="${t.id}"><span class="no">${esc(t.no)}</span><span class="nm">${esc(t.nm)}</span></a>`).join('');
$('#tocKv').innerHTML = `<dt>row</dt><dd>${esc(K.home || '')}</dd><dt>card</dt><dd>${esc(K.card || '')}</dd><dt>page</dt><dd>_tools/bolostatus/out/BOLO-${K.n}.html</dd>`;
$('#tocRows').addEventListener('click', e => { const a = e.target.closest('.toc-row'); if (!a) return; e.preventDefault(); jump(a.dataset.id); });
function jump(id) { const el = document.getElementById(id); if (el) { el.scrollIntoView({ block: 'start' }); setCurrent(id); } }

/* ---- where you are: follows the scroll ---- */
function strandFor(id) {

  const i = top && top.dataset.i != null ? +top.dataset.i : null;
  const p = i != null ? P[i] : null;
  const ruled = F.calls.filter(c => c.s === 'ruled').length;
  const s = p ? p.strand : { last: F.mission, plan: F.order, you: ruled ? `${ruled} of ${F.calls.length} calls ruled.` : 'No call ruled yet.', next: F.default };
  const head = p ? `${secNo(i)} · ${p.name}` : 'Preface';
  $('#ctx').innerHTML = `<h4><small>Where you are</small>${esc(head)}</h4><div class="ctx">

}
const topOf = id => document.getElementById(id).closest('section').id;

  strandFor(id);
}
const spy = new IntersectionObserver(entries => {
  const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
  if (vis.length) setCurrent(vis[0].target.id);
}, { root: $('#doc'), rootMargin: '0px 0px -70% 0px', threshold: 0 });
TOC.forEach(t => spy.observe(document.getElementById(t.id)));
setCurrent('sec-P');

/* ---- tooltips: hover → open · 1.5 s or Space → lock · nested to depth 3 · Esc closes ---- */
let tips = [], openTimer = null, closeTimer = null;
function tipFor(target, depth) {
  const k = target.dataset.t; const g = G[k]; if (!g) return null; const el = document.createElement('div'); el.className = 'tip'; el.dataset.depth = depth;
  const deep = depth >= 3;
  el.innerHTML = `<div class="th"><b>${esc(g.t)}</b><span class="k">${esc(g.k)}</span></div><p>${deep ? esc(g.d.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kk, l) => l || (G[kk] ? G[kk].t : kk))) : md(g.d)}</p>${deep ? `<div class="w"><a href="#" class="glopen" data-k="${k}">Open in SOI →</a></div>` : `<div class="w">${esc(g.w || '')}</div>`}<div class="lock"><b></b></div><div class="hint">hold 1.5 s or press Space to lock · Esc closes · click opens the term</div>`;
  document.body.appendChild(el);
  const r = target.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12); let y = r.bottom + 8; if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const rec = { el, target, depth, locked: false, timer: null };
  const bar = $('.lock b', el); requestAnimationFrame(() => { bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%'; });
  rec.timer = setTimeout(() => lock(rec), 1500);
  el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
  el.addEventListener('mouseleave', () => scheduleClose(depth));
  el.addEventListener('click', e => { const a = e.target.closest('.glopen'); if (a) { e.preventDefault(); openTerm(a.dataset.k); } });
  target.classList.add('on'); tips.push(rec); return rec;
}
function lock(rec) { rec.locked = true; rec.el.classList.add('locked'); }
function closeTips(d) { tips.filter(t => t.depth >= d).forEach(t => { clearTimeout(t.timer); t.el.remove(); t.target.classList.remove('on'); }); tips = tips.filter(t => t.depth < d); }
function scheduleClose(depth) { clearTimeout(closeTimer); closeTimer = setTimeout(() => { const un = tips.filter(t => t.depth >= depth && !t.locked); if (un.length) closeTips(Math.min(...un.map(t => t.depth))); }, 220); }
function depthOf(t) { const p = t.closest('.tip'); return p ? +p.dataset.depth + 1 : 1; }
function onEnter(t) { clearTimeout(openTimer); clearTimeout(closeTimer); const d = depthOf(t); openTimer = setTimeout(() => { closeTips(d); tipFor(t, d); }, 120); }
document.addEventListener('mouseover', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.t'); if (t) { clearTimeout(openTimer); scheduleClose(depthOf(t)); } });
document.addEventListener('focusin', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('focusout', e => { const t = e.target.closest('.t'); if (t) scheduleClose(depthOf(t)); });
document.addEventListener('click', e => { const t = e.target.closest('.t'); if (t && t.dataset.t) { e.preventDefault(); openTerm(t.dataset.t); return; } if (!e.target.closest('.tip')) closeTips(1); });
function openTerm(k) { const g = G[k]; if (!g) return; $('#rail').classList.add('gl'); closeTips(1); $('#glDetail').innerHTML = `<h5>${esc(g.t)}</h5>${g.st ? chip(g.st === 'ruled' ? 'ruled' : g.st === 'benched' ? 'parked' : 'open') : ''}<p style="margin-top:6px">${md(g.d)}</p><div class="w">${esc(g.k)} · ${esc(g.w || '')}</div>`; }
function closeTerm() { $('#rail').classList.remove('gl'); }
$('#glClose').addEventListener('click', closeTerm);

/* ---- keys ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const up = e.key.toUpperCase();
  if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < P.length) jump(`sec-${i + 1}`); return; }
  if (up === 'P') { jump('sec-P'); return; }
  if (up === 'A') { jump('sec-A'); return; }
  if (up === 'G') { window.open(SOI_URL, '_blank', 'noopener'); return; }
  if (e.key === 'Escape') { if (tips.length) closeTips(1); else if ($('#rail').classList.contains('gl')) closeTerm(); return; }
  if (e.key === ' ' && tips.length) { e.preventDefault(); lock(tips[tips.length - 1]); return; }
});
</script>
