<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>BORESIGHT 64</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- DOPE SHEET · the document layout (RULED 9/16, BOLO 55: one page · the rail kept, narrow · the default for every sheet) ----
     Modeled on the NASA NPR and the DoD Instruction: a compact masthead, a boxed front-matter table,
     then the body as numbered sections in one scroll. The center column is the page; everything else is a margin.
     Colorway: the ruled default (creator-cases palette, DARK only; E-INK light face when the viewer forces light). */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320; --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B; --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; font-family: var(--body); font-size: 16.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }
  .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- frame: masthead / toc · doc · rail / foot ---- */
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 224px minmax(0, 1fr) 248px; grid-template-areas: "head head head" "toc doc rail" "foot foot foot"; }

  /* the masthead: one strip. Number · title · state · version. Nothing else lives up here. */
  header.mast { grid-area: head; display: flex; align-items: center; gap: 16px; padding: 0 18px; min-height: 52px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); }
  .mast .num { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .mast .num small { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); }
  .mast .num b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .mast h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.1; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .mast .ver { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .mast .soi { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; background: var(--accent); color: #fff; text-decoration: none; }
  .mast .soi:hover { background: var(--accent-ink); }

  /* the table of contents */
  nav.toc { grid-area: toc; border-right: 1px solid var(--line-2); padding: 16px 0 18px; overflow-y: auto; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.toc .lbl { display: block; padding: 0 18px 8px; }
  .toc-row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; padding: 7px 14px 7px 18px; color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
  .toc-row.sub { padding-left: 30px; grid-template-columns: 30px 1fr; font-size: 13.5px; }
  .toc-row .no { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
  .toc-row .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .toc-row.sub .nm { font-family: var(--body); font-weight: 400; font-size: 13.5px; text-transform: none; }
  .toc-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .toc-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  nav.toc .kv { padding: 14px 18px 0; margin: 12px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-family: var(--mono); font-size: 11px; }
  nav.toc .kv dt { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
  nav.toc .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }

  /* the document: the one scroll */
  main.doc { grid-area: doc; overflow-y: auto; padding: 28px 44px 96px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { main.doc { scroll-behavior: auto; } }
  .page { max-width: 84ch; }
  .page h1.dt { margin: 0 0 14px; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 3.6vw, 44px); line-height: .98; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  .page h1.dt small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .18em; color: var(--accent-ink); margin-bottom: 8px; }

  /* front matter: the boxed field table (the DoDI cover block, the NPR preface) */
  .fm { display: grid; grid-template-columns: max-content 1fr; margin: 0; border: 1px solid var(--line-2); background: var(--panel); font-size: 14.5px; }
  .fm > * { padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .fm > *:nth-last-child(-n+2) { border-bottom: 0; }
  .fm dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); background: color-mix(in srgb, var(--panel-2) 70%, transparent); border-right: 1px solid var(--line); padding-top: 9px; }
  .fm dd { margin: 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .fm dd.st { color: var(--ink); }

  /* sections */
  section.sec { padding-top: 24px; margin-top: 28px; border-top: 1px solid var(--line-2); scroll-margin-top: 8px; }
  section.sec.pre { border-top: 0; margin-top: 22px; padding-top: 0; }
  .sh { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px; }
  .sh .no { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--accent-ink); min-width: 34px; }
  .sh h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
  .sh .src { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  p.plain { margin: 0 0 16px; font-size: 16.5px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }
  .sub { margin-top: 18px; scroll-margin-top: 8px; }
  .sub > .lbl { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .sub > .lbl .no { font-family: var(--mono); color: var(--accent-ink); letter-spacing: .08em; }

  /* P.1 purpose · P.2 the order */
  .purpose { font-size: 17.5px; line-height: 1.5; margin: 0; max-width: 70ch; }
  .order { margin-top: 6px; padding: 18px 22px; border: 1px solid var(--line-2); background: var(--panel); position: relative; }
  .order::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .order .big { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.05; text-transform: uppercase; }
  .order .big strong { color: var(--accent-ink); }
  .order .default { margin: 10px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }

  /* P.3 the calls · the decisions table, the working surface */
  .tblwrap { overflow-x: auto; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 14.5px; border: 1px solid var(--line-2); }
  table.calls th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
  table.calls td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.calls tr:last-child td { border-bottom: 0; }
  table.calls td.n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--accent-ink); width: 40px; text-align: right; }
  table.calls td.q { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; text-transform: uppercase; min-width: 140px; }
  table.calls td.o { color: var(--ink-2); font-size: 13.5px; line-height: 1.4; }
  table.calls td.o .rul { display: block; margin-top: 6px; color: var(--good); font-size: 13.5px; }
  table.calls td.d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); min-width: 160px; }
  table.calls td.d em { font-style: normal; color: var(--accent-ink); font-weight: 500; }
  table.calls td.s { white-space: nowrap; }
  table.calls tr.ruled td.q, table.calls tr.ruled td.n { color: var(--ink-3); }

  /* P.4 the three */
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); }
  .three > div { padding: 10px 14px; border-right: 1px solid var(--line); }
  .three > div:last-child { border-right: 0; }
  .three .w { font-family: var(--display); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
  .three p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }

  /* items */
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); min-width: 28px; text-align: right; padding-top: 2px; }
  .item .text { font-size: 16px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 5px; }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .st-hot i { animation: none; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr span + span { margin-left: -1px; }

  /* mission */
  .msn { padding: 20px 24px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 80ch; }
  .msn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .msn .task { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; text-transform: uppercase; margin: 0; }
  .msn .intent { font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.1; color: var(--accent-ink); margin: 6px 0 0; }
  .msn .spoken { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); font-style: italic; color: var(--ink-2); font-size: 15px; }
  .end ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 5px; font-size: 15.5px; }

  /* execution */
  .me { margin: 0 0 14px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 15.5px; }
  .me .lbl { display: block; color: var(--accent-ink); margin-bottom: 4px; }
  .ph { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .ph:last-child { border-bottom: 0; }
  .ph .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); text-align: right; padding-top: 2px; }
  .ph.done .n { color: var(--good); }
  .ph .text { font-size: 15.5px; line-height: 1.5; }
  .ph .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .coord ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }

  /* files */
  table.files { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.files th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.files td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.files td.p { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .cost { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
  .cost > div { display: flex; flex-direction: column; }
  .cost b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .cost span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

  /* log */
  .lg { display: grid; grid-template-columns: 56px 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
  .lg:last-child { border-bottom: 0; }
  .lg .who { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .lg.claude .who { color: var(--ink-3); }

  /* related */
  .rel { display: grid; gap: 6px; font-size: 15px; }
  .rel b { font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; margin-right: 6px; }

  /* the rail: where you are (follows the scroll) · term detail on click */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 18px 18px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 16px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .02em; }
  .rail h4 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: .14em; color: var(--accent-ink); margin-bottom: 2px; }
  .ctx { display: grid; gap: 12px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 3px; color: var(--accent-ink); }
  .ctx .c p { margin: 0; font-size: 14.5px; line-height: 1.45; }
  aside.rail.gl .ctxwrap { display: none; }
  .glos { display: none; flex-direction: column; gap: 10px; }
  aside.rail.gl .glos { display: flex; }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  .gl-detail { padding: 12px 14px; border: 1px solid var(--line-2); background: var(--panel); }
  .gl-detail h5 { margin: 0 0 6px; font-family: var(--display); font-size: 21px; font-weight: 700; text-transform: uppercase; }
  .gl-detail p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .gl-detail .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* footer key strip */
  footer.foot { grid-area: foot; border-top: 1px solid var(--line-2); padding: 7px 18px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 85%, transparent); }
  footer.foot kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-right: 3px; }
  footer.foot .r { margin-left: auto; }

  /* tooltips */
  .tip { position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); box-shadow: var(--shadow); padding: 12px 14px 10px; font-size: 14.5px; line-height: 1.45; }
  .tip .th { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tip .th b { font-family: var(--display); font-weight: 700; font-size: 19px; text-transform: uppercase; }
  .tip .th .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .tip p { margin: 0; }
  .tip .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .tip .lock { height: 2px; background: var(--line); margin-top: 10px; position: relative; }
  .tip .lock b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  .tip.locked .lock b { width: 100%; }
  .tip.locked { border-top-color: var(--ink); }
  .tip .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px; letter-spacing: .06em; }

  @media (max-width: 1080px) { .app { grid-template-columns: 200px minmax(0, 1fr) 0; } aside.rail { display: none; } aside.rail.gl { display: flex; position: fixed; right: 0; top: 52px; bottom: 0; width: min(320px, 90vw); z-index: 40; box-shadow: var(--shadow); } }

dness", "line": "Severe means severe: an SOP rule with nothing running it reads PARTIAL, not DONE. Fourteen ORGANIC rows say the Command already covers the need its own way — that is a different claim than fourteen more DONEs, and this board does not blur the two."}], "frago": {"mission": "Grade the Command's four-step workflow and every adjacent Claude Code practice against the docs, in order to give Chief a literal, severe gap table to rule on rather than a vibe.", "order": "**Rule the five fixes and the gate question (Calls 1 and 2); then Claude writes the four steps into SOP §1 and the six skill headers and hands the gap rows to BOLO 51's audit.** One word each; \"take the recs\" closes all four.", "default": "Silence: no gate is added; the five fixes wait; the rows sit in this table unread by the audit.", "calls": [{"q": "Call 1 · the hook-gate question (ruling 1's condition)", "options": "no gates, the read shows no step skipped (rec) · one PreToolUse hook for the no-probing rule, a fix not a gate · gates on all four steps", "default": "no gates (rec)", "s": "open", "why": "The four steps read explore DONE · plan PARTIAL · implement DONE · commit PARTIAL. Neither PARTIAL is a skipped step: plan is done through DOPE SHEETs and briefs instead of plan mode, commit runs every turn but with a generic message. Ruling 1 said gates only where a step is skipped. None is."}, {"q": "Call 2 · the top five fixes, all cost S or M", "options": "take all five (rec) · pick by id (A6/F1 · A7 · D4 · B2/B9/C10 · A19/D18/E1/E2) · none", "default": "all five (rec)", "s": "open", "why": "Each closes a GAP row with one script or one file: a root CLAUDE.md pointer · the Bash allowlist · descriptive autocommit messages · one PreToolUse hook behind the no-probing rule · worktree isolation for the second session."}]}, "paragraphs": [{"id": "S", "name": "Situation", "kind": "list", "plain": "The gap table itself, one group per doc page (A best-practices · B hooks-guide · C sub-agents · D common-workflows · E git-worktrees · F memory), one item per doc row (83 total). Status is graded severe: an SOP rule with nothing running it reads PARTIAL, never DONE; a habit-only memory rule reads the same way.", "strand": {"last": "docs.md (83 rows, what the Claude Code docs recommend) and command.md (54 rows, what the Command does today and what enforces it) were fetched and inventoried before this board was written.", "plan": "Walk the six pages in order below; each item names its doc id, its practice, its status, what the doc says, what the Command does today (citing command.md's C-ids), and the gap or the cheapest fix.", "you": "The four rulings that frame this read: vocabulary first, no hook gates until a skipped step is shown; the whole workflow set gets read in one pass; findings fold into BOLO 51's standing audit, no new SOP section; the NASA crew-grade layer (CDR · MS · PS · RANGE) stays, no Space Force.", "next": "Read the six groups, then the Execution paragraph for what happens with the findings."}, "groups": [{"label": "Page A · best-practices", "items": [{"t": "**A1 Manage context window as primary resource** — ORGANIC · Track context usage and reduce token consumption strategically as the window fills. · the Command: The Command keeps the main line's context small a different way: a SessionStart digest replaces raw reads [C1] and every formation front-loads a zero-token prep script [C2] before agents ever run. · No status line tracks percent-used; the substitute is structural (small inputs) rather than measured (a visible gauge).", "s": "ruled", "when": "9/23"}, {"t": "**A2 Give Claude verification criteria** — ORGANIC · Give Claude something pass/fail (tests, builds, screenshots) so it can iterate without supervision. · the Command: Formations get pass/fail from RANGE reviewer scripts that check board structure and block on failure [C52][C53], the closest thing this repo has to a test suite. · The check is structural (keys present, links resolve) not behavioral (tests/build/screenshot), because this repo has no software to test.", "s": "ruled", "when": "9/23"}, {"t": "**A3 Separate exploration from implementation with plan mode** — PARTIAL · Use plan mode (Shift+Tab) so Claude reads and answers without editing, then you approve the plan before execution. · the Command: No plan-mode gate exists anywhere in the Command [C40]; separation is structural instead — prep scripts and read-only specialists run before any write, and the main line only writes at the fan-in [C2][C12]. · The separation is real but implicit in formation order, not an explicit approve-before-edit gate Chief can invoke on demand outside a formation.", "s": "open", "when": "9/23"}, {"t": "**A4 Provide specific context and constraints** — DONE · Reference specific files, name constraints, point to example patterns so Claude needs fewer corrections. · the Command: Every specialist's entire prompt is a script-written brief file naming exact sources and the one output file to write [C9], with a fixed named-output contract [C38]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**A5 Use @ to reference files directly** — ORGANIC · Type @path/to/file so Claude reads it before responding, instead of describing where code lives. · the Command: The Command's equivalent is the brief file: a script names the exact source paths and pastes them in, so no one has to type @ mentions by hand [C9]. · Chief doesn't get the live @ suggestion menu inside a formation run; the brief is prepared ahead of time instead of composed interactively.", "s": "ruled", "when": "9/23"}, {"t": "**A6 Write effective CLAUDE.md files** — GAP · CLAUDE.md loads at session start and carries persistent instructions; keep it short and pruned. · the Command: No CLAUDE.md exists at the repo root at all [C42]; only an unrelated one under ShroomsQ was found. · Session-start context comes only from the digest hook and MEMORY.md; there is no short, checked-in file naming code style, testing, or workflow rules for this repo.", "s": "hot", "when": "9/23"}, {"t": "**A7 Configure permissions with allowlists** — PARTIAL · Allowlist specific tools (npm, git) via /permissions to cut approval interruptions; combine with sandboxing. · the Command: Project settings preauthorize exactly two Bash patterns, `find:*` and `claude config set:*` [C50]; everything else still prompts. · The allowlist is real but thin — the routine commands this repo actually runs (python scripts, git status/diff, bash tool calls under _tools/) aren't on it, so most turns still prompt.", "s": "open", "when": "9/23"}, {"t": "**A8 Use CLI tools like gh for external services** — GAP · Install and use the gh CLI; Claude knows how to open issues, PRs, and read comments with it. · the Command: Nothing in the Command's settings, hooks, or skills references gh or any PR workflow [C24][C50]. · The repo is public and commits happen every turn, but there is no path from a local autosave to an issue or PR — gh is simply unused.", "s": "hot", "when": "9/23"}, {"t": "**A9 Connect MCP servers for external integrations** — GAP · Run `claude mcp add` to connect MCP servers (Notion, Figma, databases) for integrated tool access. · the Command: The user-level settings file carries no MCP configuration relevant to this repo's own tooling — only effortLevel, theme, model, and one env var [C34][C51]. · Anything an MCP server would give (structured DB access, ticketing) is instead done by hand-rolled scripts per formation; no integration is missing that's currently blocking work.", "s": "hot", "when": "9/23"}, {"t": "**A10 Set up hooks for deterministic actions** — DONE · Hooks run scripts automatically at lifecycle points and guarantee the action happens every time. · the Command: Exactly two hooks are configured project-wide: Stop runs autocommit [C32], SessionStart runs the digest [C33], per the settings file [C31]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**A11 Create skills for domain knowledge** — DONE · Skills in `.claude/skills/SKILL.md` give reusable domain workflows, applied automatically or invoked by name. · the Command: Seven skills are registered under `.claude/skills/`, each firing on named spoken phrases in its own frontmatter [C47]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**A12 Define subagents for specialized tasks** — DONE · Create subagents in `.claude/agents/` with specific tools and prompts, running in isolated contexts. · the Command: Crew grades (CDR/MS/PS/RANGE) fix each formation seat by function and model [C13][C35], and every formation actually launches typed specialists per skill [C16]-[C21]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**A13 Install plugins for bundled extensions** — N/A · Plugins bundle skills, hooks, subagents, and MCP servers into installable units; code-intelligence plugins add symbol navigation. · the Command: The Command has no plugin installed and doesn't need to package for reuse elsewhere — it is a single private repo, not distributed across projects. · Plugins solve portability across repos; this operation has one repo and already bundles behavior directly in SOP.md + skills + scripts.", "s": "parked", "when": "9/23"}, {"t": "**A14 Course-correct early and often** — GAP · Use Esc to stop, Esc+Esc or /rewind to restore to a previous checkpoint; tight feedback loops beat drift. · the Command: Nothing in command.md documents rewind/checkpoint use; the closest analog, autocommit, is a forward-only safety net [C23], not a mid-turn correction tool. · If a specialist or the main line drifts mid-turn, there's no documented habit of using Esc/rewind to back out cleanly — the fallback is finish-then-fix.", "s": "hot", "when": "9/23"}, {"t": "**A15 Use /clear between unrelated tasks** — PARTIAL · Run /clear to reset context between unrelated tasks so old context doesn't drag on performance. · the Command: The Stop hook's matcher explicitly fires on `/clear` alongside startup/resume [C32], so /clear is wired into the autosave+digest cycle when used, but nothing shows it's used as a habit between unrelated tasks. · The hook plumbing supports /clear; whether Chief actually clears between unrelated asks (vs. one long thread) isn't established by anything in command.md.", "s": "open", "when": "9/23"}, {"t": "**A16 Delegate investigation to subagents** — DONE · Use subagents to keep large-scale exploration out of the main context; they report back summaries only. · the Command: Every formation's H0 prep script plus its read-only specialists keep exploration in a subagent's own context, reporting one named file back [C2][C12][C16]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**A17 Use rewind checkpoints for safety** — ORGANIC · Every prompt creates a checkpoint; use /rewind to restore conversation, code, or both without losing work. · the Command: The Command's safety net is different: the Stop hook autocommits every turn to local git regardless of outcome [C23][C24], so any turn can be rolled back with git instead of /rewind. · Git checkpoints are coarser (one per turn, code-only) than /rewind's conversation+code checkpoints, and require a manual `git reset` rather than a slash command.", "s": "ruled", "when": "9/23"}, {"t": "**A18 Resume conversations across sessions** — DONE · Run `claude --continue`/`--resume` to pick up where you left off; name sessions with /rename to find them later. · the Command: The SessionStart hook fires on its `startup|resume|clear` matcher and re-seeds context with the digest on resume [C31][C33], so resuming lands with the current state already loaded. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**A19 Run multiple parallel sessions** — GAP · Use --worktree to run isolated sessions in separate git checkouts so parallel edits don't collide. · the Command: No reference to git worktrees or any multi-checkout workflow appears anywhere in SOP.md, the skills, or the hooks/scripts read [C41]. · Chief is known to run two sessions at once against the same working tree; without worktree isolation those sessions can collide on the same files with no structural guard, only session-id discipline.", "s": "hot", "when": "9/23"}, {"t": "**A20 Run Claude non-interactively in CI pipelines** — N/A · Use `claude -p \"prompt\"` for CI, pre-commit hooks, or scripts, with `--output-format stream-json` for parsing. · the Command: The Command has no CI pipeline; it's a personal-ops repo run interactively, not built/tested by an external system. · Non-interactive CI mode has nothing to attach to here — there is no build or test stage this would gate.", "s": "parked", "when": "9/23"}]}, {"label": "Page B · hooks-guide", "items": [{"t": "**B1 Set up hooks for automation** — DONE · Hooks are user-defined shell commands run at lifecycle points, giving deterministic control. · the Command: Two hooks exist and run every session: Stop (autocommit) and SessionStart (digest) [C31][C32][C33]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**B2 Use PreToolUse hooks to validate commands** — GAP · PreToolUse fires before a tool call and can block it — e.g. restricting DB access to read-only. · the Command: No PreToolUse hook is configured; the settings file has exactly two hooks and neither is PreToolUse [C31]. · Nothing can deterministically block a tool call before it runs — e.g. the no-unasked-probing rule [C3] is enforced only by habit, not by a hook that could refuse the scan.", "s": "hot", "when": "9/23"}, {"t": "**B3 Use PostToolUse hooks for formatting** — GAP · PostToolUse fires after a tool succeeds; use it to run formatters, linters, or notifications. · the Command: No PostToolUse hook exists [C31]; formatting/linting isn't part of this repo's toolchain (mostly markdown/JSON/python utility scripts). · A malformed JSON board or a script with a syntax error could land without any automatic check running right after the edit.", "s": "hot", "when": "9/23"}, {"t": "**B4 Use Stop hooks as deterministic gates** — PARTIAL · A Stop hook can block the turn from ending until a check passes, guaranteeing verification before Claude moves on. · the Command: The Command's Stop hook exists but is deliberately non-blocking: it always exits 0 so a git failure can never stop the session [C23][C24]; real gating happens elsewhere, in RANGE reviewer scripts at each formation's fan-in [C52]. · The one Stop hook that runs on every turn is explicitly not a verification gate; if it were, an autosave failure would incorrectly block the session, so this is a deliberate tradeoff rather than an oversight.", "s": "open", "when": "9/23"}, {"t": "**B5 Use prompt-based hooks for judgment** — GAP · Prompt-based hooks use Claude to evaluate conditions needing reasoning, complementing deterministic script hooks. · the Command: Both configured hooks are plain shell/python scripts [C31][C32][C33]; no prompt-based hook exists anywhere. · Any judgment-call enforcement (e.g. \"is this a probing scan?\") currently has no hook path at all, deterministic or prompt-based — it's pure habit [C46].", "s": "hot", "when": "9/23"}, {"t": "**B6 Use agent-based hooks for complex validation** — GAP · Agent-based hooks delegate to a subagent for complex multi-step validation needing its own context. · the Command: No agent-based hook exists; the closest analog is RANGE, which is always a script by doctrine, never an agent, even at the fan-in [C13][C52]. · There's no hook-triggered agent validation step; the formation doctrine's own rule against agent-based checking (never a checker agent) [C15] makes this an intentional non-fit, not an oversight.", "s": "hot", "when": "9/23"}, {"t": "**B7 Hook events include SessionStart and SessionEnd** — PARTIAL · SessionStart fires at session begin/resume; SessionEnd fires at session termination, for setup and cleanup. · the Command: SessionStart is configured and runs the digest [C31][C33]; no SessionEnd hook exists anywhere in the settings. · Session open is automated; session close still depends on Chief saying \"Oscar Mike\" and the skill running by hand [C25], not a SessionEnd hook that fires no matter how the session ends.", "s": "open", "when": "9/23"}, {"t": "**B8 Hook events include UserPromptSubmit and Stop** — PARTIAL · UserPromptSubmit fires before Claude processes a prompt; Stop fires after Claude finishes responding. · the Command: Stop is configured and runs autocommit [C31][C32]; no UserPromptSubmit hook exists. · Nothing can inspect or gate an incoming prompt before Claude processes it — e.g. auto-detecting a proword or garble before the turn starts has to happen in-context instead.", "s": "open", "when": "9/23"}, {"t": "**B9 Hook events include PreToolUse and PostToolUse** — GAP · These events fire around tool calls, letting you validate or react to tool execution. · the Command: Neither is configured; the settings file has exactly two hooks, Stop and SessionStart [C31]. · Same underlying gap as B2/B3 — no tool-call-level hook exists at all.", "s": "hot", "when": "9/23"}, {"t": "**B10 Hook events include FileChanged and ConfigChange** — GAP · FileChanged fires on a watched file changing; ConfigChange fires when a config file changes mid-session. · the Command: Neither event is used anywhere; the only two hooks are Stop and SessionStart [C31]. · A change to `.claude/settings.local.json` or a board JSON mid-session triggers nothing automatically.", "s": "hot", "when": "9/23"}, {"t": "**B11 Hook events include WorktreeCreate and WorktreeRemove** — N/A · WorktreeCreate fires when a worktree is created; WorktreeRemove fires on removal at session exit or deletion. · the Command: The Command uses no worktrees anywhere [C41], so these events have nothing to attach to. · Moot until worktrees are adopted (see A19/E1-E3); these events only exist to hook a workflow the Command doesn't run.", "s": "parked", "when": "9/23"}]}, {"label": "Page C · sub-agents", "items": [{"t": "**C1 Use subagents to preserve context** — DONE · Subagents run in isolated context windows; high-volume exploration stays there, only the summary returns. · the Command: Every formation keeps specialist reads out of the main line's context by design — the main line only ever reads the digest or the specialists' named output files [C1][C2][C12]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**C2 Keep subagent descriptions under 15,000 tokens** — PARTIAL · Description tokens load at startup for delegation decisions; detailed behavior belongs in the system prompt instead. · the Command: The Command doesn't define reusable named subagents at all — specialists are generic Agent-tool calls carrying a brief file as the whole prompt [C9]; skill files themselves run 1.9–4.8 KB, well under budget by accident rather than by rule. · Nothing in command.md shows a deliberate token budget being tracked for any agent description — it's small because the format is small, not because a limit is enforced.", "s": "open", "when": "9/23"}, {"t": "**C3 Enforce tool restrictions with tools field** — GAP · Use `tools:` or `disallowedTools:` so a subagent's access matches its job (read-only reviewer vs. Bash-capable fixer). · the Command: No `.claude/agents/` definitions with a `tools:`/`disallowedTools:` field are referenced anywhere in command.md; specialists are scoped by brief-file instruction (\"read nothing else, write only X\") [C36], not by an enforced tool allowlist. · A PS or MS specialist could technically call any tool available to the Agent type it runs under; the \"read nothing else\" boundary is convention, not a config-enforced restriction.", "s": "hot", "when": "9/23"}, {"t": "**C4 Use @ mentions to guarantee subagent delegation** — ORGANIC · Type @\"agent-name\" to force a specific subagent to run, bypassing automatic delegation. · the Command: The Command guarantees which agent runs a different way: each skill's H1 step names the exact agent type and pastes a brief file as its entire prompt [C36], and skills themselves fire on named spoken phrases rather than @ mentions [C47]. · The guarantee is procedural (skill text says which agent) rather than syntactic (@ mention in the message), so it depends on the operator following the skill's steps.", "s": "ruled", "when": "9/23"}, {"t": "**C5 Set permission modes per subagent** — GAP · Use `permissionMode:` (default, acceptEdits, plan, dontAsk) to control how a subagent handles permission prompts. · the Command: No permission-mode configuration for any subagent appears in command.md; formations run under whatever the main session's permission mode is. · A PS/MS specialist doing pure fetch-and-write work still prompts (or auto-accepts) at the session's default rather than a mode scoped to its narrow, disjoint job.", "s": "hot", "when": "9/23"}, {"t": "**C6 Choose model for cost and performance** — DONE · Set `model: sonnet/haiku/opus` per subagent to trade off cost and capability. · the Command: Crew grades fix the model by seat every time: PS=Haiku, MS=Sonnet, CDR=Fable/main-line-only, RANGE=script-never-a-model [C13][C35], applied identically across every formation's skill text [C16]-[C21]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**C7 Isolate subagents in git worktrees** — GAP · Set `isolation: worktree` so a subagent works an isolated repo copy and can't touch the main checkout. · the Command: No worktree isolation exists for any subagent anywhere [C41]; every specialist writes directly into the shared working tree. · A specialist that mis-writes has no structural containment — the fixed-output-contract convention [C38] is the only guard, not filesystem isolation.", "s": "hot", "when": "9/23"}, {"t": "**C8 Preload skills into subagent context** — ORGANIC · List skills in a `skills:` field to inject domain knowledge at subagent startup without requiring discovery. · the Command: The Command preloads a different way: the brief file itself IS the preload, pasted verbatim as the specialist's entire prompt [C9], with the boundary \"read nothing else\" stated in skill text [C36]. · This works for narrow, single-purpose specialists; it wouldn't scale to a subagent needing several skills' worth of standing knowledge at once, which the `skills:` field is built for.", "s": "ruled", "when": "9/23"}, {"t": "**C9 Enable persistent memory for subagents** — GAP · Set `memory: user/project/local` so a subagent keeps a directory that survives across conversations. · the Command: No subagent in the Command has persistent memory; every specialist is one-shot with a fixed input brief and a fixed output file [C38], gone once the formation ends. · A PS/MS that runs the same kind of extraction repeatedly (e.g. EXTRACT-k in collect) starts cold every time — no accumulated pattern knowledge carries between runs.", "s": "hot", "when": "9/23"}, {"t": "**C10 Use PreToolUse hooks in subagents** — GAP · Define PreToolUse hooks scoped to a subagent to conditionally allow or block its operations. · the Command: No PreToolUse hooks exist anywhere in the Command, for the main session or any subagent [C31]. · Same root cause as B2/B9 — no PreToolUse hook exists to scope, whether at session or subagent level.", "s": "hot", "when": "9/23"}, {"t": "**C11 Organize subagent files hierarchically** — GAP · Create subfolders under `.claude/agents/` to organize agents by domain; identity comes from `name`, not path. · the Command: No `.claude/agents/` directory is referenced anywhere in command.md; specialists exist only as generic Agent-tool invocations described in skill text, never as named files on disk [C36]. · There's nothing to organize because named subagent files were never created — crew-grade identity lives in SOP prose, not in a `name:` field on a checked-in file.", "s": "hot", "when": "9/23"}, {"t": "**C12 Run subagents in background** — PARTIAL · Subagents run in the background in interactive sessions by default, letting you keep working while they finish. · the Command: Formations launch multiple specialists together in one message so they run independently and concurrently [C37]; this matches the platform default rather than a Command-specific setting. · Concurrent, background-style launch is described in skill text, but nothing in command.md confirms it's deliberately configured rather than just the tool's out-of-the-box behavior.", "s": "open", "when": "9/23"}, {"t": "**C13 Resume subagents to continue work** — GAP · Use SendMessage with the agent's ID or name to resume a subagent without spawning a fresh instance. · the Command: No mention of resuming a subagent appears anywhere in command.md; every formation spawns fresh specialists per run [C16]-[C21]. · If a specialist's draft needs a second pass, current doctrine says rerun it fresh with the finding pasted under its brief [C22], not resume its own history — cheaper to write, more expensive in tokens than a true resume.", "s": "hot", "when": "9/23"}, {"t": "**C14 Limit subagent nesting depth** — GAP · Use `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH` to cap how deeply subagents can spawn their own subagents. · the Command: No env var or setting limiting nesting depth appears in command.md; the formation rule already discourages deep nesting by having specialists report to the main line only, never spawn their own subagents [C12]. · Nesting depth isn't config-capped, only convention-capped by the flat hub-and-spoke shape; a specialist that did try to spawn its own subagent wouldn't be technically blocked.", "s": "hot", "when": "9/23"}, {"t": "**C15 Cap concurrent subagents** — ORGANIC · Use `CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS` to prevent resource exhaustion past 20 running agents. · the Command: Gear N is the Command's own concurrency cap: gear 1 = 3 agents (default) up to gear 5 = 15 (never used), one shift per task then reverting to gear 1 [C14]. · Gear N is enforced by SOP text and habit, not a hard platform-level env var — it could in principle be exceeded if the rule were ignored.", "s": "ruled", "when": "9/23"}, {"t": "**C16 Scope MCP servers to subagents** — N/A · Use `mcpServers:` to give a subagent access to MCP tools unavailable in the main conversation. · the Command: The Command connects no MCP servers of its own at all [C34], so there is nothing to scope to a subagent. · This depends on A9 (connect MCP servers) being true first; since no MCP server is wired in, per-subagent scoping doesn't apply yet.", "s": "parked", "when": "9/23"}, {"t": "**C17 Run entire session as subagent** — N/A · Pass `claude --agent <name>` or set `\"agent\"` in settings to run the whole session under a subagent's constraints. · the Command: Crew grades fix CDR as the main line only, by design never spawned as a subagent [C13][C35]; running the whole session as a subagent contradicts that seat definition. · Doesn't fit the doctrine: CDR's identity IS being the main line, not a subagent role that could be assumed session-wide.", "s": "parked", "when": "9/23"}, {"t": "**C18 Omit CLAUDE.md for lightweight subagents** — N/A · Set `omitClaudeMd: true` to launch a subagent without CLAUDE.md files, cutting context overhead. · the Command: Moot: no CLAUDE.md exists anywhere in the repo to omit [C42]. · This flag only matters once a root CLAUDE.md exists (see A6/F1's fix); until then there's nothing for a subagent to skip.", "s": "parked", "when": "9/23"}, {"t": "**C19 Deny specific subagents in permissions** — GAP · Add `Agent(subagent-name)` to `permissions.deny` to prevent Claude from using specific subagents. · the Command: The permissions block only lists two allowed Bash patterns [C50]; no deny list for any agent exists. · There's no config-level block on an unwanted agent type running; the only control is the main line choosing not to invoke it.", "s": "hot", "when": "9/23"}, {"t": "**C20 Use fork mode to inherit parent state** — N/A · A fork inherits the parent conversation's full context, tools, and history instead of starting fresh. · the Command: The formation rule requires the opposite: specialists share no state and sync only at named handoff points [C12]; fork mode's whole-history inheritance runs against that doctrine on purpose. · Fork mode solves a problem (continuing with full context) the Command's doctrine deliberately avoids creating (disjoint inputs, no shared state).", "s": "parked", "when": "9/23"}, {"t": "**C21 Set effort level per subagent** — GAP · Use `effort: low/medium/high/max` to override the session's effort level for a specific subagent. · the Command: Effort is fixed globally at the user-settings layer (`effortLevel: high`) [C51]; no per-subagent override is used anywhere in command.md. · Every specialist runs at the same global effort regardless of how simple its job is (a PS fetch-and-extract likely doesn't need high effort), leaving cost on the table.", "s": "hot", "when": "9/23"}]}, {"label": "Page D · common-workflows", "items": [{"t": "**D1 Explore phase of four-step workflow** — ORGANIC · Enter plan mode (Shift+Tab) so Claude reads files and answers questions without making changes. · the Command: The explore step isn't skipped, it's just not plan-mode: a SessionStart digest [C1], per-formation prep scripts [C2], the no-unasked-probing rule [C3], and link-harvest-before-read [C4] all place a read-only pass before any write. · No literal plan-mode toggle exists [C40]; the read-before-write guarantee is structural (formation order) rather than an interactive gate Chief can invoke mid-conversation.", "s": "ruled", "when": "9/23"}, {"t": "**D2 Plan phase of four-step workflow** — ORGANIC · Ask Claude to draft a detailed plan in plan mode; open it in your editor (Ctrl+G) to edit directly before proceeding. · the Command: Planning happens on paper instead of in an editable plan-mode doc: a DOPE SHEET carries the five-paragraph order [C6], a FRAGO patches it by script [C7], and a spoken tasking must be written into BOLO.md the same turn or it \"didn't happen\" [C11]. · There's no Ctrl+G-style direct edit of an ephemeral plan; the plan artifact is a persistent JSON/markdown file edited through its own formation (dope-sheet/frago), which is slower per edit but leaves a durable record plan mode wouldn't.", "s": "ruled", "when": "9/23"}, {"t": "**D3 Implement phase of four-step workflow** — DONE · Exit plan mode, let Claude code, verify against the plan, run tests and fix failures. · the Command: Implementation runs through the formation rule (disjoint specialists, one reviewer at the fan-in) [C12], with RANGE reviewer scripts actually blocking a bad write until fixed [C52][C53]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**D4 Commit phase of four-step workflow** — PARTIAL · Ask Claude to commit with a descriptive message and open a PR, completing explore→plan→implement→commit. · the Command: Every turn auto-commits via the Stop hook, but with a generic \"autosave <date/time> · N file(s)\" message [C23], never a descriptive one, and never a PR — pushing is a deliberate act kept separate from commits [C24]. · Commits happen every turn without fail, which is better-than-doc reliability, but the messages carry no information about what changed or why, and there's no PR step at all.", "s": "open", "when": "9/23"}, {"t": "**D5 Get quick codebase overview** — ORGANIC · Start with broad questions, then narrow down; ask about conventions, patterns, and key data models. · the Command: The SessionStart digest hook already front-loads a ~40-line overview (rack, Blocked rows, newest BOLOs, PMCS red, box probe, tree status, main effort) automatically at open [C1], instead of Chief having to ask broad-to-narrow questions. · The digest is a fixed shape, not a conversational broad-to-narrow drill-down; a genuinely novel question about the codebase still needs to be asked by hand.", "s": "ruled", "when": "9/23"}, {"t": "**D6 Find relevant code by domain** — GAP · Be specific using project domain language; install code-intelligence plugins for precise go-to-definition. · the Command: No code-intelligence plugin is installed or referenced [C47]; domain-language search relies on grep/glob and the skill/SOP vocabulary rather than symbol navigation. · This repo is mostly markdown/JSON/python utility scripts rather than a large typed codebase, so go-to-definition matters less, but there's still no tooling for it if a script layer grows.", "s": "hot", "when": "9/23"}, {"t": "**D7 Fix bugs efficiently** — GAP · Share the error, ask for fix recommendations, then apply; give the reproduce command and steps. · the Command: No documented bug-fix workflow or repro-command convention appears in command.md for the many `_tools/*.py` scripts that run the formations. · When a formation script errors (e.g. `check.py` or `assemble.py` failing), there's no stated habit of pasting the exact repro command — it likely happens ad hoc each time.", "s": "hot", "when": "9/23"}, {"t": "**D8 Refactor code safely** — N/A · Identify legacy code, get recommendations, apply changes while maintaining behavior, verify with tests. · the Command: No test suite exists for any of the `_tools/*.py` scripts, and no refactor workflow is documented; scripts are small, single-purpose utilities rather than a codebase under active refactor. · Refactor-safety-via-tests doesn't fit single-purpose utility scripts with no behavior contract beyond \"produces this one file\"; RANGE reviewer scripts already catch output-shape regressions where it matters [C52].", "s": "parked", "when": "9/23"}, {"t": "**D9 Work with tests** — ORGANIC · Identify untested code, generate test scaffolding, add meaningful cases, run and verify. · the Command: No test files or framework exist anywhere in command.md; verification instead runs through RANGE reviewer scripts (`check.py`, `assemble.py`) that structurally validate each formation's output before it's allowed to publish [C52][C53]. · This covers structural correctness of generated boards, not general code correctness — a genuine software test suite for the python utilities themselves still doesn't exist.", "s": "ruled", "when": "9/23"}, {"t": "**D10 Create pull requests step-by-step** — GAP · Summarize changes, generate a PR, then refine the description; use `--from-pr` to find linked sessions. · the Command: No PR is ever created — commits stay local by design and pushing is treated as a separate, deliberate act [C24]. · There is currently no path from a batch of autosave commits to a reviewable PR, even though the repo is public.", "s": "hot", "when": "9/23"}, {"t": "**D11 Handle documentation** — ORGANIC · Identify undocumented code, generate docs (JSDoc/docstrings), review for standards, request examples. · the Command: The Command's documentation IS its operating model: SOP.md (57 KB) declares itself canonical [C43], each SKILL.md opens by naming the SOP section it runs [C48], and every BOLO gets a standing DOPE SHEET [C6]. · This covers process/doctrine documentation extensively; it does not cover docstrings or inline comments for the `_tools/*.py` scripts themselves, which the doc's practice is actually aimed at.", "s": "ruled", "when": "9/23"}, {"t": "**D12 Work in non-code folders** — DONE · Claude Code works fine in notes vaults or markdown collections; .claude/ sits alongside other tools' configs. · the Command: This is already the Command's native shape — SOP.md, BOLO.md, and every board are markdown/JSON, not application code [C6][C47]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**D13 Work with images in codebase** — GAP · Drag, paste, or path images to Claude for error analysis, UI matching, schema work, or component generation. · the Command: No image-based workflow is described anywhere in command.md for this repo's operations. · If a board or a design needed visual review (a screenshot of a published sit-rep page, say), there's no stated convention for handing Claude the image.", "s": "hot", "when": "9/23"}, {"t": "**D14 Reference files and directories with @** — ORGANIC · Use @file or @directory to include content directly; can reference multiple files and MCP resources at once. · the Command: Brief files serve the same purpose — a script names and pastes the exact sources a specialist needs [C9] — rather than Chief typing @ mentions live. · Multi-file/MCP-resource referencing in one live @ gesture isn't available this way; the brief has to be assembled by the prep script ahead of time.", "s": "ruled", "when": "9/23"}, {"t": "**D15 Run Claude on recurring schedule** — GAP · Use Routines (cloud), Desktop scheduled tasks, GitHub Actions, or /loop for recurring runs with explicit success criteria. · the Command: No recurring/scheduled automation is referenced anywhere in command.md — every formation is triggered by a spoken phrase, not a clock. · Nothing runs on its own cadence (a nightly digest refresh, a weekly RTB sweep); every run needs a live prompt from Chief.", "s": "hot", "when": "9/23"}, {"t": "**D16 Ask Claude about its own capabilities** — N/A · Claude has built-in access to its own documentation and can answer questions about Claude Code's features. · the Command: This is a platform capability, not something the Command configures or could be missing. · Not an operational practice of the Command; it's a base Claude Code feature independent of this repo's setup.", "s": "parked", "when": "9/23"}, {"t": "**D17 Resume previous conversations** — DONE · Run `--continue` for the most recent session or `--resume` to choose from a list; sessions persist locally. · the Command: The SessionStart hook's `startup|resume|clear` matcher re-seeds the digest on resume [C31][C33], so a resumed session opens with current state already loaded. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**D18 Run parallel sessions with worktrees** — GAP · Use `--worktree feature-auth` for an isolated session on its own branch, useful for Writer/Reviewer patterns. · the Command: No worktree usage exists anywhere in the Command [C41]; Chief's two-at-once sessions run without this isolation. · Same underlying gap as A19/E1/E2 — parallel sessions currently share one working tree with no filesystem-level collision guard.", "s": "hot", "when": "9/23"}, {"t": "**D19 Delegate research to subagents** — DONE · Say \"use a subagent to investigate X\" to keep exploration out of the main conversation; it reports a summary. · the Command: Every formation's prep script plus disjoint specialists do exactly this on every run [C1][C2][C16]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**D20 Pipe Claude into scripts** — N/A · Run `claude -p \"prompt\"` non-interactively for CI, pre-commit hooks, or batch processing. · the Command: No non-interactive/headless pipeline exists; the Command has no CI to pipe into. · Same underlying absence as A20 — there's no external pipeline stage this would feed.", "s": "parked", "when": "9/23"}]}, {"label": "Page E · git-worktrees", "items": [{"t": "**E1 Create isolated worktrees with --worktree flag** — GAP · Run `claude --worktree feature-auth` for a parallel session in its own git checkout on its own branch. · the Command: No worktree has ever been created in this repo per command.md [C41]. · Same root gap as A19/D18 — no isolated checkout exists for any parallel work.", "s": "hot", "when": "9/23"}, {"t": "**E2 Worktrees prevent edit collisions** — GAP · Each worktree is a separate checkout on its own branch, so a feature session and a bugfix session can't collide. · the Command: Chief runs two sessions at once against the same tree with no worktree isolation [C41]; the only guard is closing sessions by id per the parallel-sessions memory rule, which command.md doesn't independently confirm. · Two live sessions editing the same files at once have no structural collision guard — only operator discipline (closing by session id) stands between them and a stomped edit.", "s": "hot", "when": "9/23"}, {"t": "**E3 Monitor parallel sessions from one screen** — GAP · Use the Desktop app or `claude agents` to manage multiple local sessions visually, each optionally in its own worktree. · the Command: No mention of the Desktop app or `claude agents` view appears anywhere in command.md; parallel sessions are tracked by convention (closing by session id) rather than a visual multi-session view. · There's no single-screen view of what each concurrent session is doing; state has to be inferred from STATE.md/BOLO.md separately per session.", "s": "hot", "when": "9/23"}]}, {"label": "Page F · memory", "items": [{"t": "**F1 Use CLAUDE.md for persistent instructions** — GAP · CLAUDE.md loads at session start and carries knowledge across conversations; keep it short and pruned. · the Command: No CLAUDE.md exists at the repo root [C42]; session-start context comes only from the digest hook [C33] and the user-level MEMORY.md [C44]. · There is no short, project-scoped, checked-in file naming this repo's own conventions — everything either lives in the much larger SOP.md or in cross-conversation user memory that isn't project-specific.", "s": "hot", "when": "9/23"}, {"t": "**F2 CLAUDE.md files can import additional files** — N/A · Use `@path/to/import` syntax in CLAUDE.md to import additional files; checked-in files let teams compound value. · the Command: Moot — there is no CLAUDE.md to import from [C42]. · This only becomes relevant once a root CLAUDE.md exists (see F1's fix).", "s": "parked", "when": "9/23"}, {"t": "**F3 Auto memory notes Claude's learnings** — DONE · Claude accumulates learnings automatically from corrections and preferences, complementing CLAUDE.md. · the Command: The user-level MEMORY.md index holds roughly 45 one-line rulings, each linking to its own detail file, actively used and cited throughout command.md [C44]. · closed — nothing outstanding.", "s": "done", "when": "9/23"}, {"t": "**F4 Use AGENTS.md alongside or instead of CLAUDE.md** — ORGANIC · AGENTS.md provides an alternative or complement to CLAUDE.md for project conventions. · the Command: The Command's chosen equivalent is SOP.md, which self-declares itself the canonical protocol that even Claude's own agent memory mirrors and defers to on conflict [C43]. · SOP.md is one large file (57 KB) rather than a small, dedicated conventions file the way AGENTS.md/CLAUDE.md are meant to be; it does the job at the cost of being loaded in full rather than pruned.", "s": "ruled", "when": "9/23"}, {"t": "**F5 Scope rules with .claude/rules/ directory** — GAP · Use `.claude/rules/` with multiple RULE.md files to scope instructions to specific file types or contexts. · the Command: No `.claude/rules/` directory exists; SOP.md carries all standing rules as one monolithic file rather than scoped per context [C43]. · Every rule in SOP.md applies everywhere by default; there's no way to scope a rule to, say, only the `_tools/bolostatus/` boards without it being one more paragraph in the same 57 KB file.", "s": "hot", "when": "9/23"}, {"t": "**F6 Configure auto memory settings** — PARTIAL · Auto memory is configurable in settings; Claude writes notes based on corrections, persisting across sessions. · the Command: Auto memory is functioning (MEMORY.md has ~45 entries [C44]), but the user-level settings file doesn't show any deliberate auto-memory configuration — only effortLevel, theme, model, autoUpdatesChannel, and one env var are set [C51]. · It isn't clear whether auto-memory's settings (what gets captured, how aggressively) have ever been reviewed or tuned versus just left at default.", "s": "open", "when": "9/23"}, {"t": "**F7 CLAUDE.md treats context and enforcement differently** — GAP · CLAUDE.md content is advisory, not enforced; use a PreToolUse hook instead to actually block an action. · the Command: This is the Command's central weak point: a long list of standing behavioral rules (no-unasked-probing [C3], go-means-the-order [C8], spoken-tasking-capture [C11], OUT-block format [C30], and more generally [C46]) exist only as SOP text or memory files, checked by nothing but habit each reply. · None of these rules are hook-enforced; per this read's own framing, that's not itself a problem to fix with a gate — the ruling for this BOLO is vocabulary first, no hook gates until a step is shown to actually get skipped, and this read found no step that is skipped, only steps enforced by habit rather than config.", "s": "hot", "when": "9/23"}, {"t": "**F8 Keep CLAUDE.md rules concise and specific** — N/A · Ask \"would removing this cause mistakes?\" for every line; bloated files cause Claude to ignore instructions. · the Command: Moot for CLAUDE.md itself since none exists [C42]; the analogous question hasn't been asked of SOP.md's 57 KB or MEMORY.md's ~45 entries [C44]. · No CLAUDE.md exists to prune; the comparable pruning discipline for SOP.md/MEMORY.md is out of scope for this specific doc practice.", "s": "parked", "when": "9/23"}]}]}, {"id": "M", "name": "Mission", "kind": "mission", "plain": "A mission is a task plus the reason for it. This read's reason is ruling 1: name the steps, gate nothing, unless the read shows a step the Command skips.", "strand": {"last": "Chief ruled the four questions on 9/23 and said do it.", "plan": "Six doc pages against SOP §1 to §7, the six skills and the two hooks; every recommendation placed once.", "you": "You gave the four rulings. One PS fetched the docs, one MS inventoried the Command, one MS wrote the table, a script checked every id and every citation.", "next": "Rule the gate question and the five fixes on DOPE SHEET 64."}, "task": "Place every recommendation in the Claude Code workflow docs against the Command's standing practice,", "intent": "in order to show what already holds, what is missing, and what the Command does its own way at least as well.", "spoken": "\"Research first, explore before anything is built.\" (9/17) · \"All recommendeds are good. Do it.\" (9/23)", "endstate": ["83 doc rows placed: 14 done · 10 partial · 33 gap · 14 organic · 12 not applicable.", "The four steps read: explore DONE · plan PARTIAL · implement DONE · commit PARTIAL. No step is skipped, so ruling 1 adds no gate.", "Five fixes named, each one script or one file, cost S or M.", "The GAP and PARTIAL rows ready for BOLO 51's audit."]}, {"id": "E", "name": "Execution", "kind": "phases", "plain": "The four rulings, the fetch, and the inventory are done; the gap table is done. What's left is folding the findings into BOLO 51's standing audit, naming the four-step vocabulary in SOP §1 and every skill header, and clearing the five cheapest fixes one at a time.", "strand": {"last": "Chief ruled the four framing decisions on 2026-09-23: vocabulary first (no hook gates until a skipped step is shown), the whole workflow set read in one pass, findings fold into BOLO 51 rather than a new SOP section, and the NASA crew-grade layer stays.", "plan": "Close the four done phases, then run the two open doctrine phases, then clear the five named fixes in cost order (S before M).", "you": "You asked for the vocabulary named, not a new enforcement layer bolted on before it's earned.", "next": "Fold this board's findings into BOLO 51, then add the four-step names to SOP §1 and each skill header."}, "main_effort": "Fold the findings into BOLO 51's standing audit — everything else on this board is either already closed or downstream of that fold.", "phases": [{"n": 1, "t": "**The four rulings.** Vocabulary first, no hook gates until a skipped step is shown · the whole workflow set in one pass · findings fold into BOLO 51, no new SOP section · the NASA crew-grade layer stays, no Space Force.", "s": "done", "when": "9/23"}, {"n": 2, "t": "**The fetch.** docs.md pulled: 83 rows across best-practices, hooks-guide, sub-agents, common-workflows, git-worktrees, and memory.", "s": "done", "whe  inventoried, gaps.json written against all 83 doc ids, this board built. 14 DONE · 10 PARTIAL · 33 GAP · 12 N/A · 14 ORGANIC; no workflow step found skipped."}]}]}, "glossary": {"sitrep": {"t": "sit rep", "k": "proword", "d": "The full board, cold start. Spoken, it flushes the [[ready-rack|Ready Rack]] and delivers blocks 0 to VII in fixed order. From 9/10 it also lands as this page.", "w": "SOP.md §1–2", "st": "ruled"}, "oscar-mike": {"t": "Oscar Mike", "k": "proword", "st": "ruled", "d": "The close-out, all in one — RULED 9/11 (\"when I say we're Oscar Mike, I wanna close out the session… just one thing\"). Spoken, it ends the session: the Ready Rack note is finalized, STATE updated, the day's journal appended, the reply ends with the OUT block. Nothing is parked into a card any more; every BOLO's resume order lives on its [[dope-sheet|DOPE SHEET]]. [[charlie-mike|Charlie Mike]] resumes; [[rtb|RTB]] sends the old parked cards home.", "w": "SOP.md §1 · §7 rule 9"}, "sweep": {"t": "sweep", "k": "proword", "d": "Retired 9/10, replaced by [[rtb|RTB]]. Was: promote the parked keepers to their real homes and clear oscar-mike/.", "w": "SOP.md §1", "st": "retired"}, "how-copy": {"t": "how copy?", "k": "proword", "d": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one question.", "w": "SOP.md §1", "st": "ruled"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X aims it at one item.", "w": "SOP.md §1", "st": "ruled"}, "bolo": {"t": "BOLO", "k": "proword", "d": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighting, wraps, holds. The board noun is the watchlist itself.", "w": "BOLO.md", "st": "ruled"}, "pmcs": {"t": "PMCS", "k": "noun", "d": "Preventive Maintenance Checks and Services. The operator is equipment: body, medical, life admin. Never mixed with projects.", "w": "BOLO.md · PMCS table"}, "ivory-tower": {"t": "ivory tower", "k": "proword", "d": "Academic mode: published literature only, every claim cited inline, established versus contested marked.", "w": "SOP.md §1", "st": "ruled"}, "break-break": {"t": "break-break", "k": "proword", "d": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it.", "w": "SOP.md §1", "st": "ruled"}, "buttonhook": {"t": "buttonhook back", "k": "proword", "d": "Close the detour and return to the parked thread unprompted, restating where we were.", "w": "SOP.md §1", "st": "ruled"}, "run-the-darkroom": {"t": "run the darkroom", "k": "proword", "d": "Launch [[darkroom|DARKROOM]] in the background, no questions. The garbles black room and dark room read the same.", "w": "SOP.md §1", "st": "ruled"}, "belay": {"t": "belay (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 for [[abort|ABORT]]. Was: cancel the preceding order. Naval lineage: belay = stop, make fast.", "w": "SOP.md §5"}, "endex": {"t": "ENDEX (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11: it collided with \"index\" in dictation and was one process too many. The close-out is [[oscar-mike|Oscar Mike]].", "w": "SOP.md §5"}, "ready-rack": {"t": "Ready Rack", "k": "noun", "d": "_CACHE/. Session notes staged for the next sit rep. Flushed into the [[magazine|Magazine]] on every board; an empty Rack proves the handoff completed.", "w": "_CACHE/"}, "magazine": {"t": "Magazine", "k": "noun", "d": "_LOG/. Deep storage for flushed session notes. Append-only; nothing is deleted, it is stowed.", "w": "_LOG/"}, "fresh-ten": {"t": "Fresh Ten", "k": "noun", "d": "Block I: the ten projects touched most recently, newest first, each with its last-touched date and a concrete next step.", "w": "SOP.md §2"}, "ancients": {"t": "The Ancients", "k": "noun", "d": "Block II: the nce 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md · DOPE SHEET 44 https://claude.ai/artifact/6uRCbniv1JNj5a4B6wFR6b"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON
