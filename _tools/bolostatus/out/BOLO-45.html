<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>DOPE SHEET 45</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- the BRIEF colorway (ruled 2026-09-10): the creator-cases explainer palette, the default for every internal board ---- */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light; /* E-INK: the light face, provisional 9/11 — Kindle gray, never white; shown only when the viewer forces light */
  }
  /* DARK is the only theme (RULED 9/11: "there's only one theme, and that's dark"); the toggle is gone */
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320;
    --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B; --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2;
    --panel: #E4E4DE;
    --panel-2: #CBCBC4;
    --ink: #1B1B19;
    --ink-2: #44453F;
    --ink-3: #6B6C65;
    --accent: #E04E18;
    --accent-ink: #A83409;
    --accent-soft: #E9D5CA;
    --link: #A83409;
    --good: #1F6B45;
    --good-soft: #CFE0D3;
    --warn: #5E4F22;
    --warn-soft: #E2D9BE;
    --bad: #962C37;
    --bad-soft: #E6CCCF;
    --help: #44453F;
    --mark: #E2D9BE;
    --orange: #A83409;
    --orange-soft: #E9D5CA;
    --line: #B5B5AE;
    --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; font-family: var(--body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }
  .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- frame: head (identity + mantra + frago) / ol · panel · rail / foot ---- */
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 236px minmax(0, 1fr) 316px; grid-template-areas: "head head head" "ol panel rail" "foot foot foot"; }
  header.head { grid-area: head; display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px); }
  header.head > .row { display: flex; flex: 1 0 100%; align-items: stretch; }
  .brand { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-right: 1px solid var(--line); min-width: 236px; }
  .brand .mono-n { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: .01em; }
  .brand .mono-n small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); font-weight: 500; margin-bottom: 2px; }
  .ttl { display: flex; flex-direction: column; justify-content: center; padding: 10px 18px; flex: 1; min-width: 0; }
  .ttl h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
  .ttl .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .ttl .meta .k { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; margin-right: 4px; }
  .box { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-left: 1px solid var(--line); }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  .gloss { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 6px 16px; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; border: 2px solid var(--accent); }
  .gloss small { font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; margin-top: 3px; }
  .gloss:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  a.gloss { text-decoration: none; }
  .gloss.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  /* the three: speed · focus · boldness */
  .mantra { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
  .mantra > div { padding: 8px 18px; border-right: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; }
  .mantra > div:last-child { border-right: 0; }
  .mantra .w { font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .04em; }
  .mantra .w .t { border-bottom-width: 2px; }
  .mantra p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }

  /* the FRAGO strip: mission · the order · your calls — always visible, action first */
  .frago { display: grid; grid-template-columns: 1.2fr 1fr 1fr; border-top: 1px solid var(--line-2); background: var(--panel); }
  .frago > div { padding: 14px 18px 16px; border-right: 1px solid var(--line); min-width: 0; }
  .frago > div:last-child { border-right: 0; }
  .frago .lbl { display: block; margin-bottom: 6px; color: var(--accent-ink); }
  .frago .mission { font-size: 17px; line-height: 1.45; }
  .frago .order { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; margin: 2px 0 8px; }
  .frago .default { font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
  .frago .order strong { color: var(--accent-ink); }
  .call { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .call:last-child { border-bottom: 0; }
  .call b { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; }
  .call .opts { color: var(--ink-2); font-size: 13.5px; }
  .call .def { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .call .def em { font-style: normal; color: var(--accent-ink); font-weight: 500; }

  /* ---- outliner (the five paragraphs + log + glossary) ---- */
  nav.ol { grid-area: ol; border-right: 1px solid var(--line-2); padding: 18px 0; overflow-y: auto; position: relative; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.ol .lbl { padding: 0 18px 10px; display: block; }
  .ol-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 14px 9px 18px; position: relative; color: var(--ink-2); border-left: 3px solid transparent; }
  .ol-row .node { width: 30px; display: flex; align-items: center; justify-content: center; }
  .ol-row .node i { width: 9px; height: 9px; border: 1.5px solid var(--ink-3); border-radius: 50%; background: var(--bg); position: relative; z-index: 1; }
  .ol-row .name { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .ol-row .id { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-3); display: block; margin-bottom: 2px; }
  .ol-row .key { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line-2); padding: 1px 5px; }
  .ol-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .ol-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  .ol-row.on .node i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .ol-row.gl-row { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  nav.ol .strand { position: absolute; left: 32.5px; top: 46px; bottom: 30px; width: 1px; background: var(--line-2); }
  nav.ol .foot { padding: 18px 18px 0; font-family: var(--mono); font-size: 11px; color: var(--ink-3); line-height: 1.7; }
  nav.ol .foot b { color: var(--ink-2); font-weight: 500; }

  /* ---- panel ---- */
  main.panel { grid-area: panel; overflow-y: auto; padding: 26px 34px 40px; position: relative; }
  .frame { position: relative; padding-top: 4px; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 16px; height: 16px; border: 1px solid var(--ink-3); pointer-events: none; }
  .frame::before { top: -6px; left: -14px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -8px; right: -14px; border-left: 0; border-top: 0; }
  .bh { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .bh .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-ink); }
  .bh .src { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
  h2.bt { margin: 0 0 12px; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 4.2vw, 52px); line-height: .95; text-transform: uppercase; text-wrap: balance; }
  p.plain { margin: 0 0 22px; font-size: 18px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }
  .grp { margin-top: 18px; }
  .grp > .lbl { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .grp > .lbl em { font-style: normal; color: var(--ink-3); letter-spacing: 0; text-transform: none; font-size: 12px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; color: var(--ink-3); min-width: 30px; text-align: right; padding-top: 2px; }
  .item .text { font-size: 17px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr span + span { margin-left: -1px; }

  /* mission paragraph */
  .msn { margin-top: 8px; padding: 26px 30px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 80ch; }
  .msn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .msn .task { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.05; text-transform: uppercase; margin: 0; }
  .msn .intent { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.1; color: var(--accent-ink); margin: 8px 0 0; }
  .msn .spoken { margin: 18px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); font-style: italic; color: var(--ink-2); font-size: 16px; }
  .end { margin-top: 20px; }
  .end ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 6px; font-size: 16.5px; }

  /* execution: phases */
  .me { margin: 6px 0 18px; padding: 14px 18px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 16.5px; }
  .me .lbl { display: block; color: var(--accent-ink); margin-bottom: 4px; }
  .ph { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .ph .n { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--ink-3); text-align: right; }
  .ph.done .n { color: var(--good); } .ph.open .n { color: var(--accent); }
  .ph .text { font-size: 16.5px; }
  .ph .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .coord { margin-top: 18px; }
  .coord ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15.5px; color: var(--ink-2); }

  /* admin: files + cost */
  .tblwrap { overflow-x: auto; }
  table.files { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
  table.files th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.files td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.files td.p { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .cost { display: flex; flex-wrap: wrap; gap: 0; margin-top: 18px; border-top: 2px solid var(--ink); }
  .cost div { padding: 12px 26px 12px 0; margin-right: 26px; }
  .cost b { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .cost span { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 5px; }

  /* log */
  .log { border-left: 3px solid var(--line); margin-top: 8px; }
  .lg { display: grid; grid-template-columns: 130px 130px 1fr; gap: 16px; padding: 12px 0 12px 22px; border-bottom: 1px solid var(--line); position: relative; font-size: 15.5px; }
  .lg::before { content: ""; position: absolute; left: -8px; top: 19px; width: 11px; height: 11px; background: var(--accent); border: 3px solid var(--bg); box-sizing: content-box; }
  .lg.claude::before { background: var(--ink-3); }
  .lg .when { padding-top: 3px; }
  .lg .who { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); padding-top: 3px; }

  /* ---- rail ---- */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 20px 20px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 18px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .ctx { display: grid; gap: 14px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 4px; color: var(--accent-ink); }
  .ctx .c p { margin: 0; font-size: 15.5px; line-height: 1.5; }
  .rail .sec { border-top: 1px solid var(--line); padding-top: 14px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-family: var(--mono); font-size: 12px; margin-top: 8px; }
  .kv dt { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; padding-top: 2px; }
  .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  aside.rail.gl .ctxwrap { display: none; }
  .glos { display: none; flex-direction: column; gap: 12px; }
  aside.rail.gl .glos { display: flex; }
  .gl-detail { padding: 12px 14px; border: 1px solid var(--line-2); background: var(--panel); }
  .gl-detail h5 { margin: 0 0 6px; font-family: var(--display); font-size: 22px; font-weight: 700; text-transform: uppercase; }
  .gl-detail p { margin: 0; font-size: 15px; line-height: 1.5; }
  .gl-detail .w { margin-top: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* glossary page view */
  .gsearch { width: 100%; max-width: 520px; font: 16px var(--body); padding: 9px 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); margin-bottom: 6px; }
  .gpage { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 22px; margin-top: 6px; }
  .gent { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
  .gent .gw { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .gent .gw .t { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; border-bottom-width: 2px; }
  .gent p { margin: 0; font-size: 15.5px; line-height: 1.45; }
  .gent .w { margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* ---- footer ---- */
  footer.foot { grid-area: foot; border-top: 1px solid var(--line-2); padding: 8px 18px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 80%, transparent); }
  footer.foot kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-right: 4px; }
  footer.foot .r { margin-left: auto; }

  /* ---- tooltips ---- */
  .tip { position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); box-shadow: var(--shadow); padding: 12px 14px 10px; font-size: 15px; line-height: 1.45; }
  .tip .th { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tip .th b { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; }
  .tip .th .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .tip p { margin: 0; }
  .tip .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }

s|PMCS]], tooling, readiness. Not a house; the person who runs both.", "w": "SOP.md §2"}, "stall-pattern": {"t": "the stall pattern", "k": "ruling", "d": "The recurring failure: a finished design blocked on one unanswered decision, then rebuilt from scratch later. The fix is the ruling, not more structure.", "w": "memory · STATE.md"}, "d9": {"t": "D-9", "k": "item", "d": "Ledger item D-9 on the [[bolo24|BOLO 24]] charter: the [[boresight]] HOLD from 9/3, converted 9/4, carrying no date. Three legal answers under the project flow: clear delivery · re-hold with a date · NO-GO. An undated hold is the [[stall-pattern|stall pattern]].", "w": "_PRIVATE/BOLO-24-charter.md · STATE Blocked #10"}, "bolo24": {"t": "BOLO 24", "k": "item", "d": "The zero-budget ORANGE launch: 3D erotica stills in Blender, DARKROOM-fed, Ultrasin as the studio, a first signing with an arc. Charter in _PRIVATE/. Gated by [[d9|D-9]]; the next proposed gate is [[r9|R9]].", "w": "BOLO.md #24"}, "r9": {"t": "R9", "k": "item", "d": "Synthesis recommendation 9: thirty days on a fresh X account before any platform commit. Zero cost. Metric: follower growth against Kirenes' no-funnel rate and Variety Itsol's studio-promoted year one.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "r10": {"t": "R10", "k": "item", "d": "Fill reference seats 4 to 8 with the same agent template: a disclosed-AI creator on Fanvue, a Patreon 3D still artist, a Reddit-native grower, the itsmemphishxe reference.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "cam-line": {"t": "the cam line", "k": "item", "d": "The Lab-venture question: live cam access is Siswet's moat, and a rendered persona cannot stand in a live room. Board it as the difference between the two ORANGE plays, or rule it irrelevant.", "w": "oscar-mike/creator-cases.md"}, "ultra-dark": {"t": "ULTRA DARK", "k": "system", "d": "BOLO 27: the curation imprint under Ultrasin. A rating scale plus a written line on every post; commissioned edits as the first-dollar line. A funnel, never the asset.", "w": "oscar-mike/ultradark-walkthrough.md · _PRIVATE/ULTRADARK-*.md"}, "block-c": {"t": "Block C", "k": "item", "d": "The [[ultra-dark|ULTRA DARK]] walkthrough's third step: you mark 12 to 16 clips in [[stash|Stash]], say marked, the pull script fires, Resolve builds the 12-second blurb. Blocks A and B have been done since 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON_NODES/oxo-telling-profile.md"}, "series": {"t": "SERIES", "k": "ruling", "d": "Ruling R9 of 9/9: The Outliers is a series, not a feature and not prose. Recorded in the storyform frontmatter. It unblocked the first scene card and the first Fountain pages.", "w": "_CANON_NODES/oxo-storyform.md"}, "outliers": {"t": "The Outliers", "k": "system", "d": "OVEREXITOUT / The Outliers: the flagship BLACK IP. Storyform ruled 8/24, DCUS instanced 8/26, medium ruled [[series]] 9/9, first pages 9/10. Anna still has no node.", "w": "_CANON_NODES/ · OUTLIERS_FINAL_DRAFT/"}, "warroom": {"t": "WARROOM", "k": "system", "d": "The MCDP doctrine browser: MIL.01 to MIL.11 as a game encyclopedia on the [[ck3-rules|CK3 rules]]. Version 1.1 wears the [[watch-register|WATCH register]]. Name provisional; paused by you on 9/6.", "w": "MCDP-CODEX.html"}, "watch-register": {"t": "the WATCH register", "k": "system", "d": "One grammar, two faces keyed to room light: DAY paper for the lit desk, NIGHT near-black for the dark one. Seven hues, every ratio contrast-checked against the long-watch standards. WARROOM wears it; this page moved to the creator-cases colorway on 9/10 by your ruling.", "w": "_0.1_BVX_LEARN/_meta/WATCH-REGISTER.md"}, "ck3-rules": {"t": "the CK3 rules", "k": "system", "d": "Nineteen rules derived from Crusader Kings III's interface: concept links with nested tooltips capped at depth 3, timer or key lock, a character-sheet layout, an outliner plus an encyclopedia, one semantic color set. This page runs on them.", "w": "_0.1_BVX_LEARN/_meta/CK3-IA-STUDY.md"}, "bolo45": {"t": "BOLO 45", "k": "item", "d": "The creator-case sweep and the manager path. Ruled 9/10: [[natasha-teen|Natasha Teen]] is the referent; everything public unless you specify; the management recon ordered. Its three files never landed; relaunched this evening.", "w": "BOLO.md #45"}, "the-take": {"t": "THE TAKE", "k": "item", "d": "The placeholder name for the lessons block on each creator case. Ruled [[ttp|TTP]] on 9/10.", "w": "explainer page · BOLO 45", "st": "retired"}, "creator-case": {"t": "creator case", "k": "noun", "d": "One file about one creator: how they started, how they run it, how they get paid. Public record only, filed beside the [[register|performer register]]. Seven exist; two more are running.", "w": "_CANON_NODES/creator-case-*.md"}, "register": {"t": "the performer register", "k": "system", "d": "138 names, any sex, 21 in the stable core. Lanes: performer · e-girl · creator case · Stash name. Built 9/8 from nine of your lists; widened 9/9.", "w": "_CANON_NODES/performer-register.md"}, "nasa-girl": {"t": "the NASA girl", "k": "item", "d": "The performer you recalled by story (used to be an engineer, NASA, then did this). Two candidates were built on 9/10; you named her this evening: Rebel Rhyder. Her case is running; the candidates stay as receipts.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "natasha-teen": {"t": "Natasha Teen", "k": "person", "d": "Register row, lane P, starred by you 9/9. The referent for like Natasha Teen did; her case verifies whether she built an agency or roster.", "w": "_CANON_NODES/performer-register.md"}, "explainer": {"t": "the explainer register", "k": "ruling", "d": "The elementary landing-page voice you liked on 9/10: what we did last, what the plan was, what you did, in plain words. This board's right rail speaks it on every block.", "w": "https://claude.ai/code/artifact/68adc31f-f644-45de-881f-6d17a355021f"}, "modmigrate": {"t": "modmigrate", "k": "item", "d": "_tools/modmigrate/: the 9/7 Minecraft modpack migration (Modrinth Fabric 1.21.11 to NeoForge 1.21.11). Real work with no STATE row, no BOLO, no journal. Surfaced on three boards running.", "w": "_tools/modmigrate/"}, "bolo37": {"t": "BOLO 37", "k": "item", "d": "The proword selection loop: five candidates, pick three ranked, ten a day, Claude's sealed pick revealed after. Name bench MINT (rec). Three spec gaps; gap 3, placement, is answered by this page.", "w": "BOLO.md #37 · SOP.md §5"}, "bolo38": {"t": "BOLO 38", "k": "item", "d": "The sit rep as a front page, the CK3 save-load screen. Captured 9/6; fired 9/10 evening on your order; v0.5 on 9/10 night. Charlie Mike'd 9/11: OPORD retitle, the SOI published, both pages re-pointed. Its OPORD page carries the rest.", "w": "BOLO.md #38"}, "the-box": {"t": "the box", "k": "system", "d": "The machine's servers: [[stash|Stash]] on :9999 and [[darkroom|DARKROOM]] on :8484. Both up this evening, the first time at a board since 9/4.", "w": "localhost"}, "bolo29": {"t": "BOLO 29", "k": "item", "d": "The SFW TikTok channel: owned Fortnite skins doing the emotes, faceless, BLACK. Research banked; held on one question, the reward-versus-risk reading.", "w": "oscar-mike/bolo29-tiktok.md"}, "bolo35": {"t": "BOLO 35", "k": "item", "d": "The story timeline tool and its theory: sound synthesis against the conservatory score. Read delivered 9/6; four questions held.", "w": "oscar-mike/story-timeline.md"}, "bolo41": {"t": "BOLO 41", "k": "item", "d": "The locus system: research filed by neighborhood. Convention provisional in _0.1_BVX_LEARN/LOCI/; needs your ratification.", "w": "_0.1_BVX_LEARN/LOCI/README.md"}, "numbering": {"t": "the 03/03 numbering", "k": "item", "d": "Two domains share the 03 prefix: 03_SETTING_SYSTEMS (stood up 8/25) and the empty pre-reserved 03_PLOT_SYSTEMS. One rename either way.", "w": "ShroomsQ/_CANON/_SSOT/"}, "trash-land": {"t": "Trash Land", "k": "item", "d": "BOLO 30: the man-made trash DMZ between the southern and northern US, mountain-range scale. Seed node written 9/6; seven rulings open, name bench recommends The Midden.", "w": "_CANON_NODES/oxo-trash-land-seed.md"}, "main-effort": {"t": "the main effort", "k": "proword", "d": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep's Block VI rename rides on it. On this board it has been [[block-c|Block C]] plus [[d9|D-9]] since 9/4.", "w": "SOP.md §5", "st": "provisional"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "The Marine Corps operations order: Situation · Mission · Execution · Administration and Logistics · Command and Signal. Mission first, then how. A BOLO status page is written in this shape.", "w": "MIL.05 · MCDP 5 Planning"}, "speed": {"t": "speed", "k": "ruling", "d": "MCDP 1: speed over time is tempo, and tempo is itself a weapon. On a page: read in ten seconds, the order on top, the story underneath. One of the three that govern the status page, with [[focus]] and [[boldness]].", "w": "MIL.01 §4 · invariant 8"}, "focus": {"t": "focus", "k": "ruling", "d": "MCDP 1: the convergence of effects at the decisive time and place, which demands strict economy everywhere else. On a page: one [[main-effort|main effort]] named, everything else supporting it and kept short.", "w": "MIL.01 §4 · invariant 8"}, "boldness": {"t": "boldness", "k": "ruling", "d": "MCDP 1: unhesitating exploitation of uncertainty to pursue major rather than marginal results; do not strive for certainty before you act. On a page: every call carries a default that runs if you say nothing.", "w": "MIL.01 §4 · quotes"}, "commanders-intent": {"t": "commander's intent", "k": "ruling", "d": "The purpose behind a task, stated as task plus in order to. The why outlasts the what, so a subordinate can act without asking. The Mission paragraph of every status page carries it.", "w": "MIL.01 §8"}, "mission-tactics": {"t": "mission tactics", "k": "ruling", "d": "Assign the task and the intent, leave the method to the one doing it, intervene only by exception. It is why a status page states defaults instead of asking questions.", "w": "MIL.01 §8"}, "ofm": {"t": "OFM agency", "k": "noun", "d": "The fansite-era management agency: an operations vendor running messages, traffic and posting on the creator's own account for 20 to 50 percent or more. A different business from the licensed booking agent of the studio era (10 to 15 percent).", "w": "_CANON_NODES/creator-management-recon.md §0"}, "ash": {"t": "A.S.H.", "k": "item", "d": "Riley Reid's creator-first agency, launched April 2021 because friends were paying up to 30 percent. The verified item behind the recon's creator-first list; the earlier Clubhouse Media Group line was a conflation and is corrected.", "w": "_CANON_NODES/creator-management-recon.md"}, "fla-468": {"t": "Florida ch. 468", "k": "item", "d": "Florida's talent-agency licensing statute: anyone who, for compensation, procures engagements for an artist, and artist includes a model. Running a creator's own account is not obviously procuring; booking that creator into a shoot or brand deal plainly is. An attorney question the moment a second human is booked.", "w": "_CANON_NODES/creator-management-recon.md §0"}, "management-recon": {"t": "the management recon", "k": "item", "d": "The sourced read on the manager path, 171 URLs: two businesses share the word agency; Fanvue is the only platform with a real agency structure; creator-first is the documented origin of the lane; reputation, not capital, is the barrier.", "w": "_CANON_NODES/creator-management-recon.md"}, "management-voices": {"t": "the management voices", "k": "item", "d": "Twenty-two first-person accounts of people who became managers, agency owners or house-builders. Nobody credible started with a roster; they started with one relationship. The commission number is the ethics map. Account control is the line.", "w": "_CANON_NODES/creator-management-voices.md"}, "bolo42": {"t": "BOLO 42", "k": "item", "d": "The admired-performers table, delivered 9/8 as the [[register|performer register]]; widened 9/9 to any sex; the creator-case nodes link from its rows.", "w": "BOLO.md #42"}, "rebel-rhyder": {"t": "Rebel Rhyder", "k": "person", "d": "The [[nasa-girl|NASA girl]], named by you 9/10 evening. Her case landed the same night: an electrical engineer who worked in aerospace for two years, in her own words; NASA is Rocco Siffredi's word only. Register row added, lane P, source S.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "challenge": {"t": "the challenge phrase", "k": "proword", "st": "ruled", "d": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is never explained.", "w": "STATE.md header · SOP.md §1"}, "out-block": {"t": "the OUT block", "k": "proword", "st": "ruled", "d": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing after it: OSCAR MIKE · OUT · OUT · OUT. A visible seam between what was parked and what starts next. Coded 9/6 on your order.", "w": "SOP.md §7 rule 9"}, "status-on-bolo": {"t": "status on BOLO N", "k": "proword", "st": "ruled", "d": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO, which is the update, not the page.", "w": "SOP.md §1 · §8"}, "recon": {"t": "recon", "k": "proword", "st": "benched", "d": "Benched 9/6: the [[boresight]] protocol aimed outside the wire (web and literature) instead of at the vault. \"Napkin recon\" would be the one-pass form. Waits in the [[bolo37|selection loop]].", "w": "SOP.md §5"}, "napkin": {"t": "napkin", "k": "proword", "st": "benched", "d": "Benched 9/6 as a modifier: back-of-the-napkin, one pass, rough numbers, no question loop. Spoken as a prefix: \"napkin boresight\", \"napkin recon\".", "w": "SOP.md §5"}, "syllabus": {"t": "syllabus", "k": "proword", "st": "benched", "d": "Benched 9/6: \"pull the syllabus on X\" = the tier-one 101 textbooks of a field, [[ivory-tower|ivory tower]], one per field to start.", "w": "SOP.md §5"}, "distill": {"t": "distill", "k": "proword", "st": "benched", "d": "Benched 9/6: make the BVX-LEARN one-sheet. The doctrine's own word: distill, don't summarize.", "w": "SOP.md §5"}, "grammar": {"t": "grammar", "k": "proword", "st": "benched", "d": "Benched 9/6: \"write the grammar\" = derive a system's operating language from its sources.", "w": "SOP.md §5"}, "mint": {"t": "MINT", "k": "proword", "st": "benched", "d": "Recommended name for the proword selection loop ([[bolo37|BOLO 37]]): where the lexicon gets struck, beside DARKROOM and WARROOM. Bench: BREVITY · SOI · CALLSIGN · LEXICON. Your ruling.", "w": "BOLO.md #37 · SOP.md §5"}, "readyroom": {"t": "READYROOM", "k": "proword", "st": "benched", "d": "Recommended name for the sit rep front page program: the Navy's briefing room, sibling of DARKROOM and WARROOM. Bench: OPSROOM · FRONTPAGE · THE BOARD. Your ruling.", "w": "BOLO.md #38"}, "ttp": {"t": "TTP", "k": "item", "d": "Tactics, Techniques and Procedures. Section 10 of every [[creator-case|creator case]]: the one mechanic worth studying, three to five transferable tips, what does not transfer, and which venture it feeds. Named by Papi 9/10 from the Corps bench (GOUGE was the provisional header); struck alternatives THE TAKE, LESSONS LEARNED, HOT WASH.", "w": "SOP.md §5 · _CANON_NODES/creator-case-*.md §10", "st": "ruled"}, "rtb": {"t": "RTB", "k": "proword", "d": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, the folder cleared. Papi's own coinage 9/10; replaces the retired [[sweep|sweep]]. Third movement of the park trio with [[oscar-mike|Oscar Mike]] and [[charlie-mike|Charlie Mike]].", "w": "SOP.md §1", "st": "ruled"}, "charlie-mike": {"t": "Charlie Mike", "k": "proword", "d": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The park trio is Oscar Mike (park), Charlie Mike (resume), [[rtb|RTB]] (return to base).", "w": "SOP.md §1", "st": "ruled"}, "gouge": {"t": "GOUGE", "k": "item", "d": "Navy and Marine slang for the essential distilled information. Recommended 9/10 as the name for the creator-case lessons block and used as its provisional header for a few hours; Papi ruled [[ttp|TTP]] instead. Bench only.", "w": "SOP.md §5", "st": "retired"}, "frago": {"t": "FRAGO", "k": "proword", "st": "ruled", "d": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Papi's clarification 9/10 late (\"FRAGO is just the update after we've made the BOLO status page\"). \"FRAGO 45\" folds what changed since the last build into [[opord|OPORD 45]] and republishes; only what changed, everything not mentioned stands as ordered; the page's Log keeps every FRAGO.", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "opord": {"t": "OPORD (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 after twelve hours (\"there has to be a better name than that, something much cooler\"). The thing it named is the [[dope-sheet|DOPE SHEET]].", "w": "SOP.md §5"}, "bolo46": {"t": "BOLO 46", "k": "item", "d": "The OXO series follow-through: the [[telling-profile|Telling Profile]]'s 12 rulings · Anna's node · the pilot's page one. Captured 9/11 at priority one on Papi's word; it had no BOLO before.", "w": "BOLO.md #46"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRAGOs]]. RULED 9/11: header \"DOPE SHEET N\"; spoken \"give me the dope on N\", \"status report on N\", \"the situation on N\" all read the same. From the Scout Sniper's DOPE book: Data On Previous Engagements, everything known on the target and every prior engagement in one book. Replaced OPORD (retired the same morning).", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "bolo47": {"t": "BOLO 47", "k": "item", "d": "The dashboard consult: eight ranked ideas from current Claude Code / VS Code operator boards for the [[sitrep|sit rep]] page. Captured 9/11; none taken yet.", "w": "BOLO.md #47"}, "bolo48": {"t": "BOLO 48", "k": "item", "d": "The name bench: every unruled word with its bench on one sheet — the cancel word (belay's successor), the dress-state value that replaces implied, READYROOM, MINT; \"caught up\" and INTEL in the pool.", "w": "BOLO.md #48 · SOP §5"}, "bolo49": {"t": "BOLO 49", "k": "item", "d": "The Massive presets: the best free banks for Native Instruments Massive, verified 9/11; the shortlist is on its sheet.", "w": "BOLO.md #49"}, "eink": {"t": "E-INK", "k": "ruling", "st": "provisional", "d": "The light face of every internal page, provisional 9/11: Kindle-gray paper (#D8D8D2 ground, #E4E4DE surface), never white — \"like an old Kindle… digital ink.\" Shown only when a viewer forces light; DARK is the only theme and the toggle is gone.", "w": "SOP.md §2 · the three templates"}}};
const B = DATA.board, G = DATA.glossary;
const SOI_URL = "https://claude.ai/code/artifact/4c2fc9c7-e0d2-4626-8142-9740ff8ee0e5";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => { const g = G[k]; const label = l || (g ? g.t : k); return g ? `<a class="t" data-t="${k}" tabindex="0">${label}</a>` : label; });
  return s;
}
const ST = { hot: ['●', 'hot'], open: ['○', 'open'], held: ['◐', 'held'], gated: ['◇', 'on your go'], parked: ['▭', 'parked'], done: ['✓', 'done'], ruled: ['✓', 'ruled'], good: ['●', 'up'], bad: ['▲', 'stalled'], missing: ['▲', 'no record'], corrected: ['↺', 'corrected'], new: ['✦', 'new'] };
const chip = s => { const d = ST[s] || ['·', s]; return `<span class="chip st-${s}">${s === 'hot' ? '<i></i>' : d[0]} ${d[1]}</span>`; };
function trunk(t) { if (!t) return ''; const one = x => x === 'BLACK' ? `<span class="b">BLACK</span>` : x === 'ORANGE' ? `<span class="o">ORANGE</span>` : `<span class="p">${esc(x)}</span>`; return `<span class="tr">${t.split('/').map(one).join('')}</span>`; }

/* ---- header: identity block · the three · the FRAGO strip ---- */
const K = B.bolo;
$('#mono').innerHTML = `<small>DOPE SHEET · BOLO</small>${K.n}`;
$('#title').textContent = K.title;
$('#meta').innerHTML = `${chip(K.s)} ${trunk(K.trunk)} <span><span class="k">issued</span>${esc(K.issued)}</span><span><span class="k">as of</span>${esc(K.asof)}</span><span><span class="k">decider</span>${esc(K.decider)}</span><span><span class="k">feeds</span>${md(K.feeds)}</span><span><span class="k">status</span>${esc(K.status)}</span>`;
$('#mantra').innerHTML = B.mantra.map(m => `<div><span class="w"><a class="t" data-t="${m.k}" tabindex="0">${esc(m.w)}</a></span><p>${md(m.line)}</p></div>`).join('');
const F = B.frago;
$('#frago').innerHTML = `<div><span class="lbl">Mission · task, in order to</span><p class="mission">${md(F.mission)}</p></div>
  <div><span class="lbl">The order · next action</span><p class="order">${md(F.order)}</p><p class="default">${md(F.default)}</p></div>
  <div><span class="lbl">Your calls · defaults run if silent</span>${F.calls.map(c => `<div class="call"><b>${esc(c.q)}</b><span class="opts">${esc(c.options)}</span><span></span><span class="def">default <em>${esc(c.default)}</em> · ${chip(c.s)}</span></div>`).join('')}</div>`;
$('#footR').textContent = `BOLO ${K.n} · ${K.home} · ${K.version}`;

/* ---- outliner ---- */
const P = B.paragraphs;
const KEYS = P.map(p => p.id);
$('#olRows').innerHTML = P.map((p, i) => `<button class="ol-row" data-i="${i}"><span class="node"><i></i></span><span><span class="id">¶ ${esc(p.id)}</span><span class="name">${esc(p.name)}</span></span><span class="key">${esc(p.id)}</span></button>`).join('')
  ;
$('#olFoot').innerHTML = `related: ${K.related.map(r => `<b>BOLO ${r.n}</b> ${esc(r.why)}`).join('<br>')}`;

/* ---- renderers ---- */
function itemHTML(it) {
  return `<li class="item"><span class="n num">${it.n != null ? it.n : ''}</span><div><div class="text">${md(it.t)}</div><div class="meta">${it.s ? chip(it.s) : ''}${it.when ? `<span class="when">${esc(it.when)}</span>` : ''}</div></div></li>`;
}
const groupsHTML = groups => groups.map(g => `<div class="grp"><span class="lbl">${esc(g.label)}</span><ul class="items">${g.items.map(itemHTML).join('')}</ul></div>`).join('');
function render(p) {
  let body = '';
  if (p.kind === 'list') body = groupsHTML(p.groups);
  else if (p.kind === 'mission') body = `<div class="msn"><p class="task">${md(p.task)}</p><p class="intent">${md(p.intent)}</p><p class="spoken">${md(p.spoken)}</p></div>
    <div class="end"><span class="lbl">End state · done means</span><ol>${p.endstate.map(e => `<li>${md(e)}</li>`).join('')}</ol></div>`;
  else if (p.kind === 'phases') body = `<div class="me"><span class="lbl">Main effort</span>${md(p.main_effort)}</div>
    ${p.phases.map(ph => `<div class="ph ${ph.s}"><span class="n num">${ph.n}</span><div class="text">${md(ph.t)}</div><div class="right">${chip(ph.s)}<span class="when">${esc(ph.when)}</span></div></div>`).join('')}
    <div class="coord"><span class="lbl">Coordinating instructions</span><ul>${p.coord.map(c => `<li>${md(c)}</li>`).join('')}</ul></div>
    ${p.running.length ? `<div class="coord"><span class="lbl">Running now</span><ul>${p.running.map(c => `<li>${md(c)}</li>`).join('')}</ul></div>` : `<div class="coord"><span class="lbl">Running now</span><ul><li>Nothing on this BOLO. It waits on you.</li></ul></div>`}`;
  else if (p.kind === 'files') body = `<div class="tblwrap"><table class="files"><thead><tr><th>Where</th><th>What</th><th>State</th></tr></thead><tbody>${p.files.map(f => `<tr><td class="p">${/^https?:/.test(f.path) ? `<a href="${esc(f.path)}" target="_blank" rel="noopener">${esc(f.path.replace('https://', ''))}</a>` : esc(f.path)}</td><td>${md(f.what)}</td><td>${chip(f.s)}</td></tr>`).join('')}</tbody></table></div>
    <div class="cost">${p.cost.map(c => `<div><b>${esc(c.v)}</b><span>${esc(c.k)}</span></div>`).join('')}</div>`;
  else if (p.kind === 'log') body = `<div class="log">${p.entries.map(e => `<div class="lg ${/claude|agent/i.test(e.who) ? 'claude' : ''}"><span class="when">${esc(e.when)}</span><span class="who">${esc(e.who)}</span><span>${md(e.t)}</span></div>`).join('')}</div>`;
  $('#panel').innerHTML = `<div class="frame"><div class="bh"><span class="eyebrow">Paragraph ${esc(p.id)}</span><span class="src">${esc(p.name)}</span></div><h2 class="bt">${esc(p.name)}</h2><p class="plain">${md(p.plain)}</p>${body}</div>`;
  $('#panel').scrollTop = 0;
  const s = p.strand;
  $('#ctx').innerHTML = `<h4>Where you are</h4><div class="ctx">
    <div class="c"><span class="lbl">What we did last</span><p>${md(s.last)}</p></div>
    <div class="c"><span class="lbl">What the plan was</span><p>${md(s.plan)}</p></div>
    <div class="c"><span class="lbl">What you did</span><p>${md(s.you)}</p></div>
    <div class="c"><span class="lbl">What's next</span><p>${md(s.next)}</p></div></div>
    <div class="sec"><span class="lbl">Where this lives</span><dl class="kv"><dt>row</dt><dd>${esc(K.home)}</dd><dt>card</dt><dd>${esc(K.card)}</dd><dt>page</dt><dd>_tools/bolostatus/out/BOLO-${K.n}.html</dd></dl></div>`;
}
let cur = 0, glossaryOpen = false;
function go(i) {
  cur = Math.max(0, Math.min(P.length - 1, i)); glossaryOpen = false;
  document.querySelectorAll('.ol-row').forEach(r => r.classList.toggle('on', !r.dataset.g && +r.dataset.i === cur));
  $('#glossBtn').classList.remove('on'); closeTips(0); render(P[cur]);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
const KIND_ORDER = ['proword', 'noun', 'ruling', 'system', 'item', 'person'];
const KIND_LABEL = { proword: 'Prowords · say one and the protocol fires', noun: 'Board nouns', ruling: 'Rulings and doctrine', system: 'Systems and programs', item: 'Items on the board', person: 'People' };
const stChip = st => st ? `<span class="chip st-${st === 'ruled' ? 'ruled' : st === 'benched' ? 'parked' : 'open'}">${st}</span>` : '';
function showGlossaryPage() { window.open(SOI_URL, '_blank', 'noopener'); }
$('#olRows').addEventListener('click', e => { const r = e.target.closest('.ol-row'); if (!r) return; if (r.dataset.g) showGlossaryPage(); else go(+r.dataset.i); });
/* the SOI button is an outbound link */

/* ---- tooltips: hover → open · 1.5 s or Space → lock · nested to depth 3 · Esc closes ---- */
let tips = [], openTimer = null, closeTimer = null;
function tipFor(target, depth) {
  const k = target.dataset.t; const g = G[k]; const el = document.createElement('div'); el.className = 'tip'; el.dataset.depth = depth;
  const deep = depth >= 3;
  el.innerHTML = `<div class="th"><b>${esc(g.t)}</b><span class="k">${esc(g.k)}</span></div><p>${deep ? esc(g.d.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kk, l) => l || (G[kk] ? G[kk].t : kk))) : md(g.d)}</p>${deep ? `<div class="w"><a href="#" class="glopen" data-k="${k}">Open in SOI →</a></div>` : `<div class="w">${esc(g.w || '')}</div>`}<div class="lock"><b></b></div><div class="hint">hold 1.5 s or press Space to lock · Esc closes · click opens the term</div>`;
  document.body.appendChild(el);
  const r = target.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12); let y = r.bottom + 8; if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const rec = { el, target, depth, locked: false, timer: null };
  const bar = $('.lock b', el); requestAnimationFrame(() => { bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%'; });
  rec.timer = setTimeout(() => lock(rec), 1500);
  el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
  el.addEventListener('mouseleave', () => scheduleClose(depth));
  el.addEventListener('click', e => { const a = e.target.closest('.glopen'); if (a) { e.preventDefault(); openTerm(a.dataset.k); } });
  target.classList.add('on'); tips.push(rec); return rec;
}
function lock(rec) { rec.locked = true; rec.el.classList.add('locked'); }
function closeTips(d) { tips.filter(t => t.depth >= d).forEach(t => { clearTimeout(t.timer); t.el.remove(); t.target.classList.remove('on'); }); tips = tips.filter(t => t.depth < d); }
function scheduleClose(depth) { clearTimeout(closeTimer); closeTimer = setTimeout(() => { const un = tips.filter(t => t.depth >= depth && !t.locked); if (un.length) closeTips(Math.min(...un.map(t => t.depth))); }, 220); }
function depthOf(t) { const p = t.closest('.tip'); return p ? +p.dataset.depth + 1 : 1; }
function onEnter(t) { clearTimeout(openTimer); clearTimeout(closeTimer); const d = depthOf(t); openTimer = setTimeout(() => { closeTips(d); tipFor(t, d); }, 120); }
document.addEventListener('mouseover', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.t'); if (t) { clearTimeout(openTimer); scheduleClose(depthOf(t)); } });
document.addEventListener('focusin', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('focusout', e => { const t = e.target.closest('.t'); if (t) scheduleClose(depthOf(t)); });
document.addEventListener('click', e => { const t = e.target.closest('.t'); if (t && t.dataset.t) { e.preventDefault(); openTerm(t.dataset.t); return; } if (!e.target.closest('.tip')) closeTips(1); });

/* ---- term detail in the rail ---- */
function openTerm(k) { const g = G[k]; if (!g) return; $('#rail').classList.add('gl'); closeTips(1); $('#glDetail').innerHTML = `<h5>${esc(g.t)}</h5>${stChip(g.st)}<p style="margin-top:6px">${md(g.d)}</p><div class="w">${esc(g.k)} · ${esc(g.w || '')}</div>`; }
function closeTerm() { $('#rail').classList.remove('gl'); }
$('#glClose').addEventListener('click', closeTerm);

/* ---- theme ---- */
/* theme toggle removed 9/11: dark only */

/* ---- keys ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) { if (e.key === 'Escape') { e.target.blur(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const up = e.key.toUpperCase();
  if (KEYS.includes(up) && e.key.length === 1) { go(KEYS.indexOf(up)); return; }
  if (e.key === 'ArrowRight') { go(cur + 1); return; }
  if (e.key === 'ArrowLeft') { go(cur - 1); return; }
  if (e.key === 'Escape') { if (tips.length) closeTips(1); else if ($('#rail').classList.contains('gl')) closeTerm(); else if (glossaryOpen) go(cur); return; }
  if (e.key === ' ' && tips.length) { e.preventDefault(); lock(tips[tips.length - 1]); return; }
  if (up === 'G') { showGlossaryPage(); return; }
});
go(0);
</script>
