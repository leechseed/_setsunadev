<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>DOPE SHEET 24</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- DOPE SHEET · the document layout (RULED 9/16, BOLO 55: one page · the rail kept, narrow · the default for every sheet) ----
     Modeled on the NASA NPR and the DoD Instruction: a compact masthead, a boxed front-matter table,
     then the body as numbered sections in one scroll. The center column is the page; everything else is a margin.
     Colorway: the ruled default (creator-cases palette, DARK only; E-INK light face when the viewer forces light). */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320; --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B; --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; font-family: var(--body); font-size: 16.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }
  .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- frame: masthead / toc · doc · rail / foot ---- */
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 224px minmax(0, 1fr) 248px; grid-template-areas: "head head head" "toc doc rail" "foot foot foot"; }

  /* the masthead: one strip. Number · title · state · version. Nothing else lives up here. */
  header.mast { grid-area: head; display: flex; align-items: center; gap: 16px; padding: 0 18px; min-height: 52px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); }
  .mast .num { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .mast .num small { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); }
  .mast .num b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .mast h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.1; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .mast .ver { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .mast .soi { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; background: var(--accent); color: #fff; text-decoration: none; }
  .mast .soi:hover { background: var(--accent-ink); }

  /* the table of contents */
  nav.toc { grid-area: toc; border-right: 1px solid var(--line-2); padding: 16px 0 18px; overflow-y: auto; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.toc .lbl { display: block; padding: 0 18px 8px; }
  .toc-row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; padding: 7px 14px 7px 18px; color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
  .toc-row.sub { padding-left: 30px; grid-template-columns: 30px 1fr; font-size: 13.5px; }
  .toc-row .no { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
  .toc-row .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .toc-row.sub .nm { font-family: var(--body); font-weight: 400; font-size: 13.5px; text-transform: none; }
  .toc-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .toc-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  nav.toc .kv { padding: 14px 18px 0; margin: 12px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-family: var(--mono); font-size: 11px; }
  nav.toc .kv dt { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
  nav.toc .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }

  /* the document: the one scroll */
  main.doc { grid-area: doc; overflow-y: auto; padding: 28px 44px 96px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { main.doc { scroll-behavior: auto; } }
  .page { max-width: 84ch; }
  .page h1.dt { margin: 0 0 14px; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 3.6vw, 44px); line-height: .98; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  .page h1.dt small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .18em; color: var(--accent-ink); margin-bottom: 8px; }

  /* front matter: the boxed field table (the DoDI cover block, the NPR preface) */
  .fm { display: grid; grid-template-columns: max-content 1fr; margin: 0; border: 1px solid var(--line-2); background: var(--panel); font-size: 14.5px; }
  .fm > * { padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .fm > *:nth-last-child(-n+2) { border-bottom: 0; }
  .fm dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); background: color-mix(in srgb, var(--panel-2) 70%, transparent); border-right: 1px solid var(--line); padding-top: 9px; }
  .fm dd { margin: 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .fm dd.st { color: var(--ink); }

  /* sections */
  section.sec { padding-top: 24px; margin-top: 28px; border-top: 1px solid var(--line-2); scroll-margin-top: 8px; }
  section.sec.pre { border-top: 0; margin-top: 22px; padding-top: 0; }
  .sh { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px; }
  .sh .no { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--accent-ink); min-width: 34px; }
  .sh h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
  .sh .src { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  p.plain { margin: 0 0 16px; font-size: 16.5px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }
  .sub { margin-top: 18px; scroll-margin-top: 8px; }
  .sub > .lbl { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .sub > .lbl .no { font-family: var(--mono); color: var(--accent-ink); letter-spacing: .08em; }

  /* P.1 purpose · P.2 the order */
  .purpose { font-size: 17.5px; line-height: 1.5; margin: 0; max-width: 70ch; }
  .order { margin-top: 6px; padding: 18px 22px; border: 1px solid var(--line-2); background: var(--panel); position: relative; }
  .order::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .order .big { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.05; text-transform: uppercase; }
  .order .big strong { color: var(--accent-ink); }
  .order .default { margin: 10px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }

  /* P.3 the calls · the decisions table, the working surface */
  .tblwrap { overflow-x: auto; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 14.5px; border: 1px solid var(--line-2); }
  table.calls th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
  table.calls td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.calls tr:last-child td { border-bottom: 0; }
  table.calls td.n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--accent-ink); width: 40px; text-align: right; }
  table.calls td.q { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; text-transform: uppercase; min-width: 140px; }
  table.calls td.o { color: var(--ink-2); font-size: 13.5px; line-height: 1.4; }
  table.calls td.o .rul { display: block; margin-top: 6px; color: var(--good); font-size: 13.5px; }
  table.calls td.d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); min-width: 160px; }
  table.calls td.d em { font-style: normal; color: var(--accent-ink); font-weight: 500; }
  table.calls td.s { white-space: nowrap; }
  table.calls tr.ruled td.q, table.calls tr.ruled td.n { color: var(--ink-3); }

  /* P.4 the three */
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); }
  .three > div { padding: 10px 14px; border-right: 1px solid var(--line); }
  .three > div:last-child { border-right: 0; }
  .three .w { font-family: var(--display); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
  .three p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }

  /* items */
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); min-width: 28px; text-align: right; padding-top: 2px; }
  .item .text { font-size: 16px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 5px; }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .st-hot i { animation: none; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr span + span { margin-left: -1px; }

  /* mission */
  .msn { padding: 20px 24px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 80ch; }
  .msn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .msn .task { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; text-transform: uppercase; margin: 0; }
  .msn .intent { font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.1; color: var(--accent-ink); margin: 6px 0 0; }
  .msn .spoken { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); font-style: italic; color: var(--ink-2); font-size: 15px; }
  .end ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 5px; font-size: 15.5px; }

  /* execution */
  .me { margin: 0 0 14px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 15.5px; }
  .me .lbl { display: block; color: var(--accent-ink); margin-bottom: 4px; }
  .ph { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .ph:last-child { border-bottom: 0; }
  .ph .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); text-align: right; padding-top: 2px; }
  .ph.done .n { color: var(--good); }
  .ph .text { font-size: 15.5px; line-height: 1.5; }
  .ph .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .coord ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }

  /* files */
  table.files { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.files th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.files td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.files td.p { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .cost { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
  .cost > div { display: flex; flex-direction: column; }
  .cost b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .cost span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

  /* log */
  .lg { display: grid; grid-template-columns: 56px 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
  .lg:last-child { border-bottom: 0; }
  .lg .who { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .lg.claude .who { color: var(--ink-3); }

  /* related */
  .rel { display: grid; gap: 6px; font-size: 15px; }
  .rel b { font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; margin-right: 6px; }

  /* the rail: where you are (follows the scroll) · term detail on click */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 18px 18px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 16px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .02em; }
  .rail h4 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: .14em; color: var(--accent-ink); margin-bottom: 2px; }
  .ctx { display: grid; gap: 12px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 3px; color: var(--accent-ink); }
  .ctx .c p { margin: 0; font-size: 14.5px; line-height: 1.45; }
  aside.rail.gl .ctxwrap { display: none; }
  .glos { display: none; flex-direction: column; gap: 10px; }
  aside.rail.gl .glos { display: flex; }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  .gl-detail { padding: 12px 14px; border: 1px solid var(--line-2); background: var(--panel); }
  .gl-detail h5 { margin: 0 0 6px; font-family: var(--display); font-size: 21px; font-weight: 700; text-transform: uppercase; }
  .gl-detail p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .gl-detail .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* footer key strip */
  footer.foot { grid-area: foot; border-top: 1px solid var(--line-2); padding: 7px 18px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 85%, transparent); }
  footer.foot kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-right: 3px; }
  footer.foot .r { margin-left: auto; }

  /* tooltips */
  .tip { position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); box-shadow: var(--shadow); padding: 12px 14px 10px; font-size: 14.5px; line-height: 1.45; }
  .tip .th { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tip .th b { font-family: var(--display); font-weight: 700; font-size: 19px; text-transform: uppercase; }
  .tip .th .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .tip p { margin: 0; }
  .tip .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .tip .lock { height: 2px; background: var(--line); margin-top: 10px; position: relative; }
  .tip .lock b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  .tip.locked .lock b { width: 100%; }
  .tip.locked { border-top-color: var(--ink); }
  .tip .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px; letter-spacing: .06em; }

  @media (max-width: 1080px) { .app { grid-template-columns: 200px minmax(0, 1fr) 0; } aside.rail { display: none; } aside.rail.gl { display: flex; position: fixed; right: 0; top: 52px; bottom: 0; width: min(320px, 90vw); z-index: 40; box-shadow: var(--shadow); } }

 then save as `subject_v1.blend`. Judge through the S4-01 camera at 85 mm, not the viewport."}, "main_effort": "D-9. Then the design set (Gate 2), then the vertical slice (Gate 3).", "phases": [{"n": 0, "t": "**Boresight walked** over four transmissions; PIRs answered; holdings mapped.", "s": "done", "when": "9/3"}, {"n": 1, "t": "**The brief ruled** — D-9 cleared GO 9/16, staged. D-10 still drafted, not worded; the draft stands.", "s": "done", "when": "9/16"}, {"n": 2, "t": "**The design set** — benchmark read · Blender COA · reference-pull spec · the character sheet v0.2 (name + chart ruled) · the Season 1 beat sheet + shoot list (8 sets / 38 stills) · **the gates table with the nut as a range (D-5, provisional) · attainability stated.** Gate 2 passed on the provisional number; Chief's figure re-reads it.", "s": "done", "when": "9/16"}, {"n": 3, "t": "**The vertical slice** — the sculpt is DONE and scripted (9/23): the ruled macro, 30 face targets, the hazel iris, the tuned skin, the relit set and a `--facecheck` framing all live in `_tools/blender/slice_set4.py`, so the subject rebuilds from one command and a change is a value edit plus a re-render, not an evening. **The skin row of the AAR clears.** Left in the chain: hair (row 2 failing), pose, dressing, the remaining four stills, the posting week, the rest of the AAR.", "s": "hot", "when": "9/16 → Oct 2026"}, {"n": 4, "t": "**Launch** — library banked (the back-plan runs the conservative floor: 20 pieces plus a 60-day buffer), accounts live, Season 1 begins. **Dated 9/23: banking runs December and January at up to four evenings a still, launch lands February 2027.** The 40-piece ceiling only applies if the October test clears its top threshold.", "s": "gated", "when": "Dec 2026 → Feb 2027"}, {"n": 5, "t": "**Monthly gates** for three months; first on-target month.", "s": "gated", "when": "after 4"}, {"n": 6, "t": "**Exit threshold or kill criterion**; AAR; the Season 2 decision.", "s": "gated", "when": "later"}], "coord": ["Workstreams: W1 character · W2 season · W3 studio frame · W4 look · W5 pipeline · W6 numbers · W7 distribution.", "Out of scope: video, live streaming, any real-performer content, spend beyond the stretch, undisclosed passing as human, anyone under 18 in canon or render.", "Deny list: ACTUAL's identity, location, employer history, finances; the real reference accounts' identities (composite, never clone); the studio's internal tooling; anything under _PRIVATE/.", "Disruptions planned: platform action → second platform live from day one plus an owned hub; discovery throttle → SFW funnel account."], "running": ["Nothing. Held."], "groups": [{"label": "Running · 9/23", "items": [{"t": "**The 30-day reference pull is live (D-8 confirmed).** One fresh X account, bookmarks only, five core seats and twenty-five wide, by hand, zero cost. It runs alongside the Gate 3 evenings and feeds the posting grammar that Season 1 needs at launch.", "s": "hot"}, {"t": "**Seat 1 of the reference pull is filled: Rebel Rhyder.** The look reference had been open since 9/3 waiting on D-6, then on the render style; D-6 ruled yes on 9/16 and D-17 ruled stylized on 9/23, so nothing was left to wait on. What the seat takes: pose, light, composition, set and prop vocabulary as DARKROOM tags, plus the performance register Chief named — intensity and duration as a quality bar for what a scene should read like. **What it never takes: a face.** Rail 4 holds — composite, never clone.", "s": "hot"}]}, {"label": "Unblocked · 9/23", "items": [{"t": "**The sex-menu sign-off and the W7 platform pick are released.** Both were held behind the lane; the lane is ruled. The sign-off is §9 call 7 on the character sheet; W7 feeds D-13's platform set.", "s": "open"}]}, {"label": "Reopened by D-17 · 9/23", "items": [{"t": "**The Gate 3 AAR row 1 is now the wrong test.** It asks whether S4-01's skin reads natural against the DARKROOM pull at arm's length — a photorealism check. Under a stylized ruling the question becomes whether the render reads as a deliberate painted style rather than a failed real one, which is a different pass condition and a different failure mode. **Rewrite row 1 before the skin evening.**", "s": "hot"}]}, {"label": "Before the sculpt · 9/23", "items": [{"t": "**The sculpt has no physical brief.** The character sheet is twelve layers of psychology, chart and register; its L2 line — \"presentation is direct, armored, coiled, reads as a dare\" — is a register, not a face. There is no face shape, no build, no height, no hair anywhere in it. The slice order sends the sculpt at \"the character sheet's register\", which cannot be sculpted against. **The spec is one short evening: the L2b morphology chain (SKELETON → MUSCLE → FAT → CONDITION) from BOLO 43, the sixteen Set 4 thumbs in `refs/set4/`, and Sakimichan's register as the stylized target.**", "s": "hot"}, {"t": "**The spec closed the gap it found.** Two findings came out of building it and both are on the record: **the L2b morphology system is body-only — it has no facial layer at all**, so the face runs on the Sakimichan register instead; and **MPFB2's exact face-target names could not be verified from disk**, so the face section gives regions and directions to read off the panel labels rather than names to type blind. The macro slider names and ranges were verified and are safe to set.", "s": "done"}, {"t": "**The face is typeable.** `SPEC-SUBJECT.md` §8 now maps the ruled face onto sixteen verified MPFB2 target names with a direction and magnitude each — `head-oval`, `l-cheek-bones-incr`, `l-eye-scale-incr`, `mouth-upperlip-volume-incr` and the rest. **One correction to the earlier warning: no finalize step destroys the shape keys in this addon**, so the targets stay editable and the 'do not apply the mesh' caution does not apply. The real constraint is order: targets before `.mhclo` assets.", "s": "done"}, {"t": "**The baseline smirk is not a sculpt value.** MPFB2's `expression/` folder carries pose presets rather than static targets, so call 11 lands on the rig in the pose evening, not tonight.", "s": "open"}]}, {"label": "Gate 3 · the sculpt, 9/23", "items": [{"t": "**The face is built and scripted.** `_tools/blender/slice_set4.py` now carries the ruled macro block, 30 face targets, `apply_face()`, `set_iris()`, `tune_skin()` and a `--facecheck` framing (105 mm at 1 m) for judging the sculpt without touching S4-01's ruled framing. The whole subject rebuilds from one command, so a change is a value edit and a re-render, not an evening.", "s": "done"}, {"t": "**The archetype was the fix.** Passes 1–3 kept reading soft because the targets were building **the Impost** — long narrow face, soft round jaw, the face that invites. Chief asked what she embodies rather than who; the answer came out of `_CANON_NODES/L2b-morphology-face.md` §4: **the Transom**, wide and short with a sharp gonial angle and wide-set eyes, the horizontal band read. Reversing `chin-bones-decr` to `chin-bones-incr` was the single largest change.", "s": "ruled"}, {"t": "**AAR row 2 fails and it is not close.** `long01` intersects the head mesh — a hard wedge across her left cheek in every frame — and reads as a moulded shell rather than hair. The slice order predicted this as the likeliest tell. It needs a real groom or a better asset; no target value reaches it.", "s": "bad"}]}]}, {"id": "A", "name": "Admin & Logistics", "kind": "files", "plain": "What the launch runs on. Zero dollars base; the numbers are the one thing the brief cannot derive.", "strand": {"last": "The nut sat unanswered from 9/3 to 9/23, twenty days, while every plan around it ran provisional.", "plan": "GPU time and attention; no money before Gate 3.", "you": "You pay in rulings first, then in full-time attention.", "next": "Nothing bought before the AAR. The evenings are the whole budget."}, "files": [{"path": "_PRIVATE/BOLO-24-charter.md", "what": "the brief v0.1 on the project flow; the decision ledger D-1 to D-11", "s": "done"}, {"path": "_PRIVATE/BOLO-24-studio-launch.md", "what": "the walked state of the boresight; the decision context for D-5, D-7, D-9", "s": "done"}, {"path": "_PRIVATE/BOLO-24-benchmarks.md", "what": "the benchmark read, delivered 9/16 on the staged clear (compiled 9/3)", "s": "done"}, {"path": "_PRIVATE/BOLO-24-creator-cases-synthesis.md", "what": "the seven read together, R1 to R12", "s": "done"}, {"path": "_CANON_NODES/creator-case-*.md × 15", "what": "the playbook, public", "s": "done"}, {"path": "oscar-mike/lab-venture.md", "what": "the persona-to-studio endgame; six decisions queued", "s": "parked"}, {"path": "_PRIVATE/BOLO-24-blender-pipeline-coa.md", "what": "the Blender pipeline COA: three courses, COA A recommended (MPFB2 · Cycles · free HDRIs), skin-shader spend held for Gate 3; four open questions, one closed by D-6", "s": "done"}, {"path": "_PRIVATE/BOLO-24-reference-pull-spec.md", "what": "the reference-pull spec (D-8): five core seats by role, three filled from the register (itsmemphishxe for posting grammar · Sulbas3D and 3DessJeez for the 3D still artist · Kirenes and Variety Itsol as the growth floor and ceiling), the 30-day bookmark procedure, the per-post record, the derivations; four open questions, one closed by D-6", "s": "done"}, {"path": "_PRIVATE/BOLO-24-character-sheet.md", "what": "the character sheet v0.2 — name Remi Slate ruled; chart ruled (\"chart go\") and corrected to the sky: born the night of Aug 11, 2005, Sun Leo · Moon Scorpio · Aries rising · Mars Taurus opposing the Moon; 2020 Uranus transit on both; §9 four calls open (death month · handle · TCVM · sex menu) + the Season 2 seed", "s": "done"}, {"path": "_PRIVATE/BOLO-24-season-1-beats.md", "what": "Season 1 beat sheet + shoot list v0.1: the five beats expanded · the 90-day calendar anchored on the April grief season · 8 sets / 38 stills (28 launch + 10 buffer), every set renderable on COA A · the sad-post spine · the Season 2 seed · six calls", "s": "done"}, {"path": "_PRIVATE/BOLO-24-gates-table.md", "what": "W6: the number block (Chief's), the branch ruled on the record, the gates table (three values, months 1–12), the rules that ride on it, the monthly review sheet, attainability", "s": "done"}, {"path": "_PRIVATE/BOLO-24-slice.md", "what": "the Gate 3 order: what stood up, Set 4's five stills and the light, the DARKROOM pull, the six evenings, the posting week with the disclosure copy, the AAR table (COA B trigger on the skin row), the log", "s": "done"}, {"path": "_tools/blender/slice_set4.py", "what": "the Set 4 scene scaffold: MPFB2 subject + CC0 skin and body parts, bed/wall, the NOIR warm low-key rig, five cameras, Cycles OptiX AgX; --smoke and --render", "s": "done"}, {"path": "Q:/fun/_BOLO24/ (off the repo)", "what": "hdri/ (three Poly Haven 2k) · refs/set4/ (16 DARKROOM thumbs + manifest) · renders/blend/ (five scenes) · renders/full_S4-01.png · mpfb_assets/", "s": "done"}, {"path": "_tools/bolostatus/work/24/backplan/BACKPLAN.md", "what": "the February 2027 back-plan: the date, the backwards table, the critical path, the slack, the open calls, the evening budget", "s": "done"}, {"path": "_tools/bolostatus/work/24/backplan/CALLS.md", "what": "D-8 · D-10 · D-11 drawn for one-word rulings — evidence, options, a recommendation each, and what each unblocks", "s": "done"}, {"path": "_tools/bolostatus/work/24/backplan/", "what": "the ten source extracts the back-plan was built from (gates · slice · season1 · charter · pipeline · comparables · d8-reference · character · boresight · status)", "s": "done"}, {"path": "_tools/bolostatus/work/24/backplan/D11-LANE.md", "what": "the D-11 lane paper: category versus framing, the four evidence reads, four positions drawn concretely, Position B recommended, the flip condition", "s": "done"}, {"path": "_tools/bolostatus/work/24/backplan/SPEC-SUBJECT.md", "what": "the face-and-body spec: the five-line brief, the macro block as settable MPFB2 values, the face region by region, the body in the L2b chain, the twelve appearance calls with recommendations, the four-check pass condition, the unknowns", "s": "done"}, {"path": "_CANON_NODES/L2b-morphology-face.md", "what": "the L2b facial layer — the four-stage chain applied to the face, a 27-cell FI·G·E coordinate system, six named architectural reads, the cell-call procedure, sources marked; the system's missing half, built 9/23", "s": "done"}, {"path": "_tools/bolostatus/work/24/backplan/gap-mpfb-targets.md", "what": "MPFB2's verified target inventory read off the installed addon — macro controls, every face target by region, every body target by region, the set_target_value call, the safe order of operations", "s": "done"}], "cost": [{"k": "base", "v": "$0"}, {"k": "stretch", "v": "$100 to 200"}, {"k": "the design set", "v": "one session on the clear"}, {"k": "the slice", "v": "one week"}], "groups": [{"label": "The pace", "items": [{"t": "**Six evenings a week is the planning rate (RULED 9/23).** The margin is 2.3 weeks at six and negative at five, so the difference between the two is the difference between February and March. The income search competes for the same nights and no figure exists for it yet — that is the one number still missing from the plan.", "s": "ruled"}, {"t": "**The COA B skin-shader spend ($120–150) may now be unnecessary.** It was the trigger attached to failing the photoreal skin row. A stylized target does not need a photoreal skin bundle, so the stretch budget probably stays unspent — confirm at the AAR rather than before it.", "s": "open"}, {"t": "**The stretch budget is effectively zero** and the income search competes with the six evenings for the same nights. That competition is the plan's largest unquantified risk — no hours-per-week figure exists for it.", "s": "open"}, {"t": "**The rewritten Gate 3 skin row is four yes/no checks**, not a judgement call: suppressed micro-texture with soft falloff · a rim pass visibly distinct from the key · exaggeration below the neck while the face stays legible · pastel-plus-accent rather than full-gamut colour. Four yeses clears it. That replaces \"does she read natural at arm's length\", which the stylized ruling made the wrong question.", "s": "open"}, {"t": "**Two findings on the set, both invisible until rendered.** The floor carried **no material at all**, so it rendered at Blender's default grey and was the real fill through passes 1 and 2 — lowering the world strength never touched it. And the skin banding was **not** fixed by adding pore detail: at 0.62 the pores read photoreal and fought the stylized ruling. The lever is the subsurface radius, not the pores; the settled values are pore 0.26 with SSS 0.42 at radius scale 0.32.", "s": "done"}]}]}, {"id": "C", "name": "Command & Signal", "kind": "list", "plain": "Who calls what. This whole sheet is one call.", "strand": {"last": "Three calls stood open this morning; all three are closed or running on a default by tonight.", "plan": "One decider, three legal answers.", "you": "You are the gate and the only one who can open it.", "next": "No call. The sculpt."}, "groups": [{"label": "Who decides", "items": [{"t": "**ACTUAL** — D-9 and the six behind it; scope, money, persona, platform. **Claude** — drafts, research, pipeline, boards, the numbers; spends nothing, opens nothing, publishes nothing without the word.", "s": "held"}]}, {"label": "The gate", "items": [{"t": "**HOLD, undated, since 9/4.** Replan trigger in the brief: the hold converts to a call at the next sit rep. It has not. This sheet is that call, worked.", "s": "bad"}, {"t": "**Nothing on this sheet blocks the evenings any more.** D-8 confirmed, D-10 cleared with the redraft standing, D-11 ruled. What remains is not a ruling but the work: the sculpt, the skin pass, hair, pose, dressing, the five renders, the posting week, the AAR.", "s": "hot"}]}, {"label": "Prowords in play", "items": [{"t": "[[boresight]] — the loop this hold came from · [[d9|D-9]] — the item · **DOPE SHEET 24** — this page · the [[leverage-line|leverage line]] on every board since 9/8.", "s": "open"}]}]}, {"id": "L", "name": "Log", "kind": "log", "plain": "Every transmission on the launch.", "strand": {"last": "Six entries; the last three are boards naming the same word.", "plan": "One per transmission.", "you": "Two are yours; the rest are the board asking.", "next": "Your word."}, "entries": [{"when": "9/3", "who": "ACTUAL", "t": "BOLO 24 spoken on a break-break: the zero-budget launch, 3D stills, DARKROOM-fed. The boresight addendum: the unbuffered-cohort baddie, the studio shape, the season."}, {"when": "9/3", "who": "Claude", "t": "Boresight walked over four transmissions; the brief v0.1 written on the project flow; D-1 to D-4 ruled; D-5 to D-11 opened."}, {"when": "9/4", "who": "ACTUAL", "t": "The boresight converted to a HOLD. No date."}, {"when": "9/8 · 9/10 · 9/10", "who": "the board", "t": "Three sit reps name D-9 as the leverage line. Fifteen cases, a register, a tag rail and three dashboards are built around it meanwhile."}, {"when": "9/11", "who": "ACTUAL", "t": "\"Let's go ahead and work on the leverage line. Give me a dope sheet on that.\""}, {"when": "9/11", "who": "Claude", "t": "DOPE SHEET 24 built. Recommendation: staged clear."}, {"when": "9/16", "who": "Chief", "t": "\"Rule D9 go.\" GO, staged clear, after twelve days and five boards."}, {"when": "9/16", "who": "Claude", "t": "FRAGO 24: D-9 ruled on the charter, STATE Blocked #10, BOLO row 24 and the SOI; phase 2 unlocked; two specialists launched for the Blender pipeline COA and the reference-pull spec; the benchmark read un-held."}, {"when": "9/16", "who": "Chief", "t": "\"D6 yes.\" The disclosed-persona frame ruled."}, {"when": "9/16", "who": "Claude", "t": "FRAGO 24 v0.3: D-6 ruled on the charter and the sheet; the Blender pipeline COA landed (COA A recommended) and its D-6 question closed; the benchmark read marked delivered."}, {"when": "9/16", "who": "Claude", "t": "FRAGO 24 v0.4: the reference-pull spec landed (SPEC on sonnet); its seat-1 question closed by D-6; all three no-dependency deliverables of the staged clear are on disk the same session D-9 was ruled."}, {"when": "9/16", "who": "Chief", "t": "\"D7 go\" — the loss ruled as recommended: mother · 2020 · overdose · she is 15."}, {"when": "9/16", "who": "Claude", "t": "D-7 written to the charter ledger (D-7, A-007), the studio-launch doc, STATE, BOLO row 24; sheet FRAGO'd v0.4 → v0.5. Character sheet unlocked."}, {"when": "9/16", "who": "Chief", "t": "\"Build the sheet.\""}, {"when": "9/16", "who": "Claude", "t": "Character sheet v0.1 written on a sonnet specialist (2,149 words): recommended Aug 8 2005 · Remi Slate · @itsremislate · Uranus-opposite-Moon as the death transit; names checked clear on a first web pass. Eight ⧗ calls in §9."}, {"when": "9/16", "who": "Chief", "t": "\"Let's go with Remy Slate for now.\" The persona's name ruled; spelling provisional (Remi on the sheet)."}, {"when": "9/16", "who": "Chief", "t": "\"Chart go. Publish 24.\""}, {"when": "9/16", "who": "Claude", "t": "Chart ruled and corrected against an ephemeris the same turn: the MS's block had Aug 8 (Moon Virgo) and three placements impossible in 2005; moved to Aug 11 night, intent kept (Sun Leo · Moon Scorpio · Aries rising · Uranus opposing the Moon in 2020). Sheet v0.2. Republished on Chief's word."}, {"when": "9/16", "who": "Chief", "t": "\"Beats go.\""}, {"when": "9/16", "who": "Claude", "t": "Season 1 beat sheet + shoot list v0.1 on an MS (1,978 words, 8 sets / 38 stills); phase 2 near complete, phase 3 named; sheet v0.9 republished."}, {"when": "9/16", "who": "Chief", "t": "\"D5 go.\""}, {"when": "9/16", "who": "Claude", "t": "FRAGO 24: D-5 ruled provisional on the structure and the record (first-dollar-first); the gates table and the monthly review sheet written to _PRIVATE; charter A-001 assumed false, §6 attainability stated; BOLO row 24 and STATE updated. Gate 2 passed; Gate 3, the slice, is the next build."}, {"when": "9/16", "who": "Chief", "t": "\"Slice go.\""}, {"when": "9/16", "who": "Claude", "t": "Gate 3 opened: the COA A pipeline stood up in the hour at $0 (Blender 4.5 LTS, MPFB2, the CC0 assets, HDRIs, the DARKROOM pull, the Set 4 scaffold); S4-01 rendered smoke and full on the 3090; the slice order written with the five stills, the evenings, the posting week and the AAR. FRAGO 24 v0.11."}, {"when": "9/23", "who": "Chief", "t": "Ruled the launch month: February 2027. Then, on the back-plan order: \"unlock the amount of agents you can use up to 16, so we can speed it up.\" Gear 6 written into SOP §1 — the ceiling is 16, with the 9/10 incident kept attached to it as the warning."}, {"when": "9/23", "who": "Claude", "t": "Back-plan built at gear 6: ten PS extractors on disjoint sources, two MS writers at the handoff, a script reviewer at the fan-in (zero findings). BACKPLAN.md and CALLS.md written. February holds at five to six evenings a week; the extra month over the boresight's January recommendation is recommended into library-banking. D-8, D-10 and D-11 drawn for one-word rulings."}, {"when": "9/23", "who": "Chief", "t": "On the back-plan's one open figure: \"I should be able to sustain, like, five, six nights a week.\" The evening rate ruled."}, {"when": "9/23", "who": "Claude", "t": "Ran the arithmetic and wrote it to the sheet: at six evenings a week February holds with 2.3 weeks in hand; at five it slips a week past February. Six is the planning rate. The back-plan's last 'not stated' is closed; the income search's hours remain the only unquantified competitor for the same nights."}, {"when": "9/23", "who": "Chief", "t": "\"8 confirm\" — the reference method ruled. On D-10: \"what's the boresight on D-10, I don't understand what you need.\" On D-11: \"we do need to develop the 11 more.\""}, {"when": "9/23", "who": "Claude", "t": "D-8 written ruled; the 30-day pull opened as a running item and dated against the Gate 3 window. D-10 put under a boresight, the draft standing meanwhile. D-11 sent back for a development pass rather than a one-word ruling."}, {"when": "9/23", "who": "Chief", "t": "D-10 boresight answered: \"Question one, it remains unchanged. Ultrason is a point. A thing that exists that keeps going for number three.\" Then: \"Go 11.\""}, {"when": "9/23", "who": "Claude", "t": "The §1 sentence redrafted on the three answers — the 9/3 draft named a purpose Chief has now ruled false. The D-11 lane paper built at gear 2 (five PS on the register, the fifteen cases, the policy read, her limits, the funnel; one MS writing): four positions, Position B recommended on durability. Two consequences of the purpose ruling written to §2 — the library-size trade-off now leans to forty unless the nut says otherwise, and the Season 2 signing becomes part of the definition of success."}, {"when": "9/23", "who": "Chief", "t": "\"D-11 B, the recommended.\" The content lane ruled: funnel-adjacent, her channel, her frame."}, {"when": "9/23", "who": "Claude", "t": "D-11 written ruled on Position B with its flip condition on the record; the sex-menu sign-off and the W7 platform pick released. The sheet's call list is clear — the next thing on BOLO 24 is the first Gate 3 evening, not another decision."}, {"when": "9/23", "who": "Chief", "t": "\"D-10 will also take it.\" The redrafted §1 sentence taken as written. Every call on the sheet is ruled."}, {"when": "9/23", "who": "Claude", "t": "D-10 written ruled; the mission's intent half replaced with the redraft and the durability consequence recorded with it. Brief v1.0; M-002 closed. The sheet has no open call left — the next thing on BOLO 24 is the first Gate 3 evening."}, {"when": "9/23", "who": "Chief", "t": "\"If Fansly bans photoreal, then let's totally do stylized.\" D-17 ruled. Style reference named: Sakimichan, off the KDA pinups — \"a good interesting place to have their inspiration for the style.\""}, {"when": "9/23", "who": "Claude", "t": "D-17 written ruled with the platform reasoning and the reference held to register-not-clone. Two consequences recorded: the AAR's skin row was written against a photoreal bar and needs rewriting before the skin evening, and the COA B skin-shader spend it triggered is probably moot."}, {"when": "9/23", "who": "Claude", "t": "Correction to the record: the D-ledger closing did not close BOLO 24's calls. The BOLO row has carried three more since 9/16 — the library size, the explicit/suggestive/SFW split, and the Gate 3 skin test — which lived on the beat sheet and the gates table and had never been pulled onto this sheet. They are on it now as L-1, L-2 and L-3, each with a recommendation. One ledger from here."}, {"when": "9/23", "who": "Chief", "t": "The nut answered: the runway is short, the income is $70 a week from his mother and that is the whole of it. Figures written to _PRIVATE only; the repo is public."}, {"when": "9/23", "who": "Claude", "t": "L-1 resolved to the twenty-piece floor off D-5's existing structure rather than as a new call — the nut overrode the durability recommendation written earlier the same day. First-dollar-first confirmed; the stretch budget treated as zero. Separately flagged before the first evening: the character sheet carries no physical description, so the sculpt has nothing to aim at until a face-and-body spec is written."}, {"when": "9/23", "who": "Chief", "t": "\"Go spec.\""}, {"when": "9/23", "who": "Claude", "t": "The subject spec built at gear 2: five PS on the morphology system, the Set 4 reference manifest, the Sakimichan register, the character sheet's appearance record and MPFB2's controls; one MS writing. `SPEC-SUBJECT.md` delivered — macro values, the face by region, the body in the L2b chain, twelve calls with recommendations, four pass checks. Two gaps found and recorded rather than papered over: L2b has no facial layer, and MPFB2's face-target names are unverified from disk."}, {"when": "9/23", "who": "Chief", "t": "\"Take the 12. Yes, yes, yes, yes.\" The twelve appearance calls taken as written and the four-check pass condition confirmed. Then: work the two gaps the spec found — the missing facial layer in the L2b morphology system, and MPFB2's unverified target names."}, {"when": "9/23", "who": "Claude", "t": "The twelve written ruled into the subject spec and the four checks written as Gate 3's skin row, replacing the photoreal test and its COA B trigger. The two gaps opened as their own job."}, {"when": "9/23", "who": "Chief", "t": "\"Take the 12. Yes, yes, yes, yes. So let's work on that morphology system then — let's figure out these two gaps.\""}, {"when": "9/23", "who": "Claude", "t": "Both gaps closed at gear 3. The facial layer written as a canon node in the body system's own idiom, carrying two honest deviations the anatomy forced — the mimetic and masticatory muscle split, and fat that is compartmentalised and bidirectional rather than uniform — and flagging the popular oval/round/square face-shape family as styling convention that failed cross-population validation. The MPFB2 addon was found on disk and its full target inventory verified, turning the face spec from directions into sixteen named targets."}, {"when": "9/23", "who": "Chief", "t": "Ran the sculpt live: \"push it\" · \"pass three\" · the archetype question · \"make the main window focus on her face so I can tell\" · \"fix the skin\". Named Sakimichan as the register and, separately, a real TikTok personality as a face reference."}, {"when": "9/23", "who": "Claude", "t": "Five render passes. The likeness request was declined against the charter's own rail (\"composite only, never a clone\") and redirected to the archetype, which is what produced the Transom and the actual fix. Check 1 now passes by design rather than by absence; the cool rim is the one check still failing."}, {"when": "9/23", "who": "Chief", "t": "\"Okay, do the rim.\""}, {"when": "9/23", "who": "Claude", "t": "The rim was failing on placement, not power: 2.5 m out, small, and aimed by a hand-set rotation, so inverse square ate it before it reached the jaw. Pulled in to 1.0 m, aimed with a constraint at the head, run hot at 95 W to prove it, then trimmed to 58 W once it blew the hair edge and shoulder. Gate 3's skin row clears on all four checks; the hairline row fails on sight."}, {"when": "9/23", "who": "Chief", "t": "Named Rebel Rhyder the inspiration bar — the standard for intensity, endurance and look — and put her on the reference list."}, {"when": "9/23", "who": "Claude", "t": "Filled seat 1 (the look reference) with her in the reference-pull spec and noted it on her register row. Four of five core seats now filled; only the disclosed-AI seat stays open. Separately: built her playlists off Stash (28 scenes, 23.2 h, five-star first), and fixed nine scenes whose title field carried one bogus string across six studios."}]}]}, "glossary": {"sitrep": {"t": "sit rep", "k": "proword", "d": "The full board, cold start. Spoken, it flushes the [[ready-rack|Ready Rack]] and delivers blocks 0 to VII in fixed order. From 9/10 it also lands as this page.", "w": "SOP.md §1–2", "st": "ruled"}, "oscar-mike": {"t": "Oscar Mike", "k": "proword", "st": "ruled", "d": "The close-out, all in one — RULED 9/11 (\"when I say we're Oscar Mike, I wanna close out the session… just one thing\"). Spoken, it ends the session: the Ready Rack note is finalized, STATE updated, the day's journal appended, the reply ends with the OUT block. Nothing is parked into a card any more; every BOLO's resume order lives on its [[dope-sheet|DOPE SHEET]]. [[charlie-mike|Charlie Mike]] resumes; [[rtb|RTB]] sends the old parked cards home.", "w": "SOP.md §1 · §7 rule 9"}, "sweep": {"t": "sweep", "k": "proword", "d": "Retired 9/10, replaced by [[rtb|RTB]]. Was: promote the parked keepers to their real homes and clear oscar-mike/.", "w": "SOP.md §1", "st": "retired"}, "how-copy": {"t": "how copy?", "k": "proword", "d": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one question.", "w": "SOP.md §1", "st": "ruled"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X aims it at one item.", "w": "SOP.md §1", "st": "ruled"}, "bolo": {"t": "BOLO", "k": "proword", "d": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighting, wraps, holds. The board noun is the watchlist itself.", "w": "BOLO.md", "st": "ruled"}, "pmcs": {"t": "PMCS", "k": "noun", "d": "Preventive Maintenance Checks and Services. The operator is equipment: body, medical, life admin. Never mixed with projects.", "w": "BOLO.md · PMCS table"}, "ivory-tower": {"t": "ivory tower", "k": "proword", "d": "Academic mode: published literature only, every claim cited inline, established versus contested marked.", "w": "SOP.md §1", "st": "ruled"}, "break-break": {"t": "break-break", "k": "proword", "d": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it.", "w": "SOP.md §1", "st": "ruled"}, "buttonhook": {"t": "buttonhook back", "k": "proword", "d": "Close the detour and return to the parked thread unprompted, restating where we were.", "w": "SOP.md §1", "st": "ruled"}, "run-the-darkroom": {"t": "run the darkroom", "k": "proword", "d": "Launch [[darkroom|DARKROOM]] in the background, no questions. The garbles black room and dark room read the same.", "w": "SOP.md §1", "st": "ruled"}, "belay": {"t": "belay (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 for [[abort|ABORT]]. Was: cancel the preceding order. Naval lineage: belay = stop, make fast.", "w": "SOP.md §5"}, "endex": {"t": "ENDEX (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11: it collided with \"index\" in dictation and was one process too many. The close-out is [[oscar-mike|Oscar Mike]].", "w": "SOP.md §5"}, "ready-rack": {"t": "Ready Rack", "k": "noun", "d": "_CACHE/. Session notes staged for the next sit rep. Flushed into the [[magazine|Magazine]] on every board; an empty Rack proves the handoff completed.", "w": "_CACHE/"}, "magazine": {"t": "Magazine", "k": "noun", "d": "_LOG/. Deep storage for flushed session notes. Append-only; nothing is deleted, it is stowed.", "w": "_LOG/"}, "fresh-ten": {"t": "Fresh Ten", "k": "noun", "d": "Block I: the ten projects touched most recently, newest first, each with its last-touched date and a concrete next step.", "w": "SOP.md §2"}, "ancients": {"t": "The Ancients", "k": "noun", "d": "Block II: the longest-untouched work in three tiers, each item with what it is waiting on.", "w": "SOP.md §2"}, "deep-stacks": {"t": "Deep Stacks", "k": "noun", "d": "Block III: projects ranked by volume of thought spent, from PROJECTS.md. Volume is characters of conversation, a proxy for thinking, not value.", "w": "PROJECTS.md"}, "leverage-line": {"t": "the leverage line", "k": "noun", "d": "Block VI: the single highest-leverage next action. Provisional rename pending: the Main Effort, MCDP 1's term for the one point everything else supports.", "w": "SOP.md §2"}, "soi": {"t": "SOI", "k": "noun", "d": "Signal Operating Instructions: the [[brevity|BREVITY]]'s book. The proword card (SOP §0), Block VII of every board, and since 9/11 its own page — search, A to Z, by section, the dictation codebook. \"Glossary\" is retired as a word (Chief, 9/11); every button and key says SOI.", "w": "SOP.md §0 · _tools/soi/ · the SOI page", "st": "ruled"}, "sop": {"t": "SOP", "k": "noun", "d": "SOP.md, the canonical home of every comms code and session protocol. On any conflict with memory, the file wins.", "w": "SOP.md"}, "trunk-black": {"t": "BLACK", "k": "noun", "d": "BLACK = Bold Venture (BVX): creative, IP, systems. Everything you make lands in one of two trunks; this is the first.", "w": "SOP.md §2"}, "trunk-orange": {"t": "ORANGE", "k": "noun", "d": "ORANGE = Ultrasin: venture, body, sexuality. The second house.", "w": "SOP.md §2"}, "trunk-operator": {"t": "OPERATOR", "k": "noun", "d": "OPERATOR = you as equipment: [[pmcs|PMCS]], tooling, readiness. Not a house; the person who runs both.", "w": "SOP.md §2"}, "stall-pattern": {"t": "the stall pattern", "k": "ruling", "d": "The recurring failure: a finished design blocked on one unanswered decision, then rebuilt from scratch later. The fix is the ruling, not more structure.", "w": "memory · STATE.md"}, "d9": {"t": "D-9", "k": "item", "d": "Ledger item D-9 on the [[bolo24|BOLO 24]] charter: the [[boresight]] HOLD from 9/3, converted 9/4, undated for twelve days and named by five boards running. **RULED GO 2026-09-16** (\"rule D9 go\"), staged clear: the no-dependency items deliver, the rest as their gates (D-5 · D-6 · D-7) clear.", "w": "_PRIVATE/BOLO-24-charter.md · STATE Blocked #10", "st": "ruled"}, "bolo24": {"t": "BOLO 24", "k": "item", "d": "The zero-budget ORANGE launch: 3D erotica stills in Blender, DARKROOM-fed, Ultrasin as the studio, a first signing with an arc. Charter in _PRIVATE/. Gated by [[d9|D-9]]; the next proposed gate is [[r9|R9]].", "w": "BOLO.md #24 · BORESIGHT 24: https://claude.ai/artifact/Km31pQKccwtmT5UZfVdUa1"}, "r9": {"t": "R9", "k": "item", "d": "Synthesis recommendation 9: thirty days on a fresh X account before any platform commit. Zero cost. Metric: follower growth against Kirenes' no-funnel rate and Variety Itsol's studio-promoted year one.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "r10": {"t": "R10", "k": "item", "d": "Fill reference seats 4 to 8 with the same agent template: a disclosed-AI creator on Fanvue, a Patreon 3D still artist, a Reddit-native grower, the itsmemphishxe reference.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "cam-line": {"t": "the cam line", "k": "item", "d": "The Lab-venture question: live cam access is Siswet's moat, and a rendered persona cannot stand in a live room. Board it as the difference between the two ORANGE plays, or rule it irrelevant.", "w": "oscar-mike/creator-cases.md"}, "ultra-dark": {"t": "ULTRA DARK", "k": "system", "d": "BOLO 27: the curation imprint under Ultrasin. A rating scale plus a written line on every post; commissioned edits as the first-dollar line. A funnel, never the asset.", "w": "oscar-mike/ultradark-walkthrough.md · _PRIVATE/ULTRADARK-*.md"}, "block-c": {"t": "Block C", "k": "item", "d": "The [[ultra-dark|ULTRA DARK]] walkthrough's third step: you mark 12 to 16 clips in [[stash|Stash]], say marked, the pull script fires, Resolve builds the 12-second blurb. Blocks A and B have been done since 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md · DOPE SHEET 44 https://claude.ai/artifact/6uRCbniv1JNj5a4B6wFR6b"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON_NODES/oxo-telling-profile.md"}, "series": {"t": "SERIES", "k": "ruling", "d": "Ruling R9 of 9/9: The Outliers is a series, not a feature and not prose. Recorded in the storyform frontmatter. It unblocked the first scene card and the first Fountain pages.", "w": "_CANON_NODES/oxo-storyform.md"}, "outliers": {"t": "The Outliers", "k": "system", "d": "OVEREXITOUT / The Outliers: the flagship BLACK IP. Storyform ruled 8/24, DCUS instanced 8/26, medium ruled [[series]] 9/9, first pages 9/10. Anna still has no node.", "w": "_CANON_NODES/ · OUTLIERS_FINAL_DRAFT/"}, "warroom": {"t": "WARROOM", "k": "system", "d": "The MCDP doctrine browser: MIL.01 to MIL.11 as a game encyclopedia on the [[ck3-rules|CK3 rules]]. Version 1.1 wears the [[watch-register|WATCH register]]. Name provisional; paused by you on 9/6.", "w": "MCDP-CODEX.html"}, "watch-register": {"t": "the WATCH register", "k": "system", "d": "One grammar, two faces keyed to room light: DAY paper for the lit desk, NIGHT near-black for the dark one. Seven hues, every ratio contrast-checked against the long-watch standards. WARROOM wears it; this page moved to the creator-cases colorway on 9/10 by your ruling.", "w": "_0.1_BVX_LEARN/_meta/WATCH-REGISTER.md"}, "ck3-rules": {"t": "the CK3 rules", "k": "system", "d": "Nineteen rules derived from Crusader Kings III's interface: concept links with nested tooltips capped at depth 3, timer or key lock, a character-sheet layout, an outliner plus an encyclopedia, one semantic color set. This page runs on them.", "w": "_0.1_BVX_LEARN/_meta/CK3-IA-STUDY.md"}, "bolo45": {"t": "BOLO 45", "k": "item", "d": "The creator-case sweep and the manager path. Ruled 9/10: [[natasha-teen|Natasha Teen]] is the referent; everything public unless you specify; the management recon ordered. Its three files never landed; relaunched this evening.", "w": "BOLO.md #45"}, "the-take": {"t": "THE TAKE", "k": "item", "d": "The placeholder name for the lessons block on each creator case. Ruled [[ttp|TTP]] on 9/10.", "w": "explainer page · BOLO 45", "st": "retired"}, "creator-case": {"t": "creator case", "k": "noun", "d": "One file about one creator: how they started, how they run it, how they get paid. Public record only, filed beside the [[register|performer register]]. Seven exist; two more are running.", "w": "_CANON_NODES/creator-case-*.md"}, "register": {"t": "the performer register", "k": "system", "d": "138 names, any sex, 21 in the stable core. Lanes: performer · e-girl · creator case · Stash name. Built 9/8 from nine of your lists; widened 9/9.", "w": "_CANON_NODES/performer-register.md"}, "nasa-girl": {"t": "the NASA girl", "k": "item", "d": "The performer you recalled by story (used to be an engineer, NASA, then did this). Two candidates were built on 9/10; you named her this evening: Rebel Rhyder. Her case is running; the candidates stay as receipts.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "natasha-teen": {"t": "Natasha Teen", "k": "person", "d": "Register row, lane P, starred by you 9/9. The referent for like Natasha Teen did; her case verifies whether she built an agency or roster.", "w": "_CANON_NODES/performer-register.md"}, "explainer": {"t": "the explainer register", "k": "ruling", "d": "The elementary landing-page voice you liked on 9/10: what we did last, what the plan was, what you did, in plain words. This board's right rail speaks it on every block.", "w": "https://claude.ai/code/artifact/68adc31f-f644-45de-881f-6d17a355021f"}, "modmigrate": {"t": "modmigrate", "k": "item", "d": "_tools/modmigrate/: the 9/7 Minecraft modpack migration (Modrinth Fabric 1.21.11 to NeoForge 1.21.11). Real work with no STATE row, no BOLO, no journal. Surfaced on three boards running.", "w": "_tools/modmigrate/"}, "bolo37": {"t": "BOLO 37", "k": "item", "d": "The proword selection loop, named BREVITY 9/23: each open bench shows five, Chief picks three ranked, the picks write to disk on submit, the back five are the reserve. Placement: a panel of the sit rep page (BOLO 38). Build fires on \"go 37\".", "w": "BOLO.md #37 · SOP.md §5 · DOPE SHEET 37 https://claude.ai/artifact/GgA7zgN42aMWiJQqbKGGso"}, "bolo38": {"t": "BOLO 38", "k": "item", "d": "The sit rep as a front page, the CK3 save-load screen. Captured 9/6; fired 9/10 evening on your order; v0.5 on 9/10 night. Charlie Mike'd 9/11: OPORD retitle, the SOI published, both pages re-pointed. Its OPORD page carries the rest.", "w": "BOLO.md #38"}, "the-box": {"t": "the box", "k": "system", "d": "The machine's servers: [[stash|Stash]] on :9999 and [[darkroom|DARKROOM]] on :8484. Both up this evening, the first time at a board since 9/4.", "w": "localhost"}, "bolo29": {"t": "BOLO 29", "k": "item", "d": "The SFW TikTok channel: owned Fortnite skins doing the emotes, faceless, BLACK. Research banked; held on one question, the reward-versus-risk reading.", "w": "oscar-mike/bolo29-tiktok.md"}, "bolo35": {"t": "BOLO 35", "k": "item", "d": "The story timeline tool and its theory: sound synthesis against the conservatory score. Read delivered 9/6; four questions held.", "w": "oscar-mike/story-timeline.md"}, "bolo41": {"t": "BOLO 41", "k": "item", "d": "The locus system: research filed by neighborhood. Convention provisional in _0.1_BVX_LEARN/LOCI/; needs your ratification.", "w": "_0.1_BVX_LEARN/LOCI/README.md"}, "numbering": {"t": "the 03/03 numbering", "k": "item", "d": "Two domains share the 03 prefix: 03_SETTING_SYSTEMS (stood up 8/25) and the empty pre-reserved 03_PLOT_SYSTEMS. One rename either way.", "w": "ShroomsQ/_CANON/_SSOT/"}, "trash-land": {"t": "Trash Land", "k": "item", "d": "BOLO 30: the man-made trash DMZ between the southern and northern US, mountain-range scale. Seed node written 9/6; seven rulings open, name bench recommends The Midden.", "w": "_CANON_NODES/oxo-trash-land-seed.md"}, "main-effort": {"t": "the main effort", "k": "proword", "d": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep's Block VI rename rides on it. On this board it has been [[block-c|Block C]] plus [[d9|D-9]] since 9/4.", "w": "SOP.md §5", "st": "provisional"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "The Marine Corps operations order: Situation · Mission · Execution · Administration and Logistics · Command and Signal. Mission first, then how. A BOLO status page is written in this shape.", "w": "MIL.05 · MCDP 5 Planning"}, "speed": {"t": "speed", "k": "ruling", "d": "MCDP 1: speed over time is tempo, and tempo is itself a weapon. On a page: read in ten seconds, the order on top, the story underneath. One of the three that govern the status page, with [[focus]] and [[boldness]].", "w": "MIL.01 §4 · invariant 8"}, "focus": {"t": "focus", "k": "ruling", "d": "MCDP 1: the convergence of effects at the decisive time and place, which demands strict economy everywhere else. On a page: one [[main-effort|main effort]] named, everything else supporting it and kept short.", "w": "MIL.01 §4 · invariant 8"}, "boldness": {"t": "boldness", "k": "ruling", "d": "MCDP 1: unhesitating exploitation of uncertainty to pursue major rather than marginal results; do not strive for certainty before you act. On a page: every call carries a default that runs if you say nothing.", "w": "MIL.01 §4 · quotes"}, "commanders-intent": {"t": "commander's intent", "k": "ruling", "d": "The purpose behind a task, stated as task plus in order to. The why outlasts the what, so a subordinate can act without asking. The Mission paragraph of every status page carries it.", "w": "MIL.01 §8"}, "mission-tactics": {"t": "mission tactics", "k": "ruling", "d": "Assign the task and the intent, leave the method to the one doing it, intervene only by exception. It is why a status page states defaults instead of asking questions.", "w": "MIL.01 §8"}, "ofm": {"t": "OFM agency", "k": "noun", "d": "The fansite-era management agency: an operations vendor running messages, traffic and posting on the creator's own account for 20 to 50 percent or more. A different business from the licensed booking agent of the studio era (10 to 15 percent).", "w": "_CANON_NODES/creator-management-recon.md §0"}, "ash": {"t": "A.S.H.", "k": "item", "d": "Riley Reid's creator-first agency, launched April 2021 because friends were paying up to 30 percent. The verified item behind the recon's creator-first list; the earlier Clubhouse Media Group line was a conflation and is corrected.", "w": "_CANON_NODES/creator-management-recon.md"}, "fla-468": {"t": "Florida ch. 468", "k": "item", "d": "Florida's talent-agency licensing statute: anyone who, for compensation, procures engagements for an artist, and artist includes a model. Running a creator's own account is not obviously procuring; booking that creator into a shoot or brand deal plainly is. An attorney question the moment a second human is booked.", "w": "_CANON_NODES/creator-management-recon.md §0"}, "management-recon": {"t": "the management recon", "k": "item", "d": "The sourced read on the manager path, 171 URLs: two businesses share the word agency; Fanvue is the only platform with a real agency structure; creator-first is the documented origin of the lane; reputation, not capital, is the barrier.", "w": "_CANON_NODES/creator-management-recon.md"}, "management-voices": {"t": "the management voices", "k": "item", "d": "Twenty-two first-person accounts of people who became managers, agency owners or house-builders. Nobody credible started with a roster; they started with one relationship. The commission number is the ethics map. Account control is the line.", "w": "_CANON_NODES/creator-management-voices.md"}, "bolo42": {"t": "BOLO 42", "k": "item", "d": "The admired-performers table, delivered 9/8 as the [[register|performer register]]; widened 9/9 to any sex; the creator-case nodes link from its rows.", "w": "BOLO.md #42"}, "rebel-rhyder": {"t": "Rebel Rhyder", "k": "person", "d": "The [[nasa-girl|NASA girl]], named by you 9/10 evening. Her case landed the same night: an electrical engineer who worked in aerospace for two years, in her own words; NASA is Rocco Siffredi's word only. Register row added, lane P, source S.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "challenge": {"t": "the challenge phrase", "k": "proword", "st": "ruled", "d": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is never explained.", "w": "STATE.md header · SOP.md §1"}, "out-block": {"t": "the OUT block", "k": "proword", "st": "ruled", "d": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing after it: OSCAR MIKE · OUT · OUT · OUT. A visible seam between what was parked and what starts next. Coded 9/6 on your order.", "w": "SOP.md §7 rule 9"}, "status-on-bolo": {"t": "status on BOLO N", "k": "proword", "st": "ruled", "d": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO, which is the update, not the page.", "w": "SOP.md §1 · §8"}, "recon": {"t": "recon", "k": "proword", "st": "benched", "d": "Benched 9/6: the [[boresight]] protocol aimed outside the wire (web and literature) instead of at the vault. \"Napkin recon\" would be the one-pass form. Waits in the [[bolo37|selection loop]].", "w": "SOP.md §5"}, "napkin": {"t": "napkin", "k": "proword", "st": "benched", "d": "Benched 9/6 as a modifier: back-of-the-napkin, one pass, rough numbers, no question loop. Spoken as a prefix: \"napkin boresight\", \"napkin recon\".", "w": "SOP.md §5"}, "syllabus": {"t": "syllabus", "k": "proword", "st": "benched", "d": "Benched 9/6: \"pull the syllabus on X\" = the tier-one 101 textbooks of a field, [[ivory-tower|ivory tower]], one per field to start.", "w": "SOP.md §5"}, "distill": {"t": "distill", "k": "proword", "st": "benched", "d": "Benched 9/6: make the BVX-LEARN one-sheet. The doctrine's own word: distill, don't summarize.", "w": "SOP.md §5"}, "grammar": {"t": "grammar", "k": "proword", "st": "benched", "d": "Benched 9/6: \"write the grammar\" = derive a system's operating language from its sources.", "w": "SOP.md §5"}, "mint": {"t": "MINT", "k": "proword", "st": "retired", "d": "Retired 9/23: was the recommended name for the proword selection loop; Chief named it BREVITY.", "w": "BOLO.md #37 · SOP.md §5"}, "readyroom": {"t": "READYROOM", "k": "proword", "st": "benched", "d": "Recommended name for the sit rep front page program: the Navy's briefing room, sibling of DARKROOM and WARROOM. Bench: OPSROOM · FRONTPAGE · THE BOARD. Your ruling.", "w": "BOLO.md #38"}, "ttp": {"t": "TTP", "k": "item", "d": "Tactics, Techniques and Procedures. Section 10 of every [[creator-case|creator case]]: the one mechanic worth studying, three to five transferable tips, what does not transfer, and which venture it feeds. Named by Chief 9/10 from the Corps bench (GOUGE was the provisional header); struck alternatives THE TAKE, LESSONS LEARNED, HOT WASH.", "w": "SOP.md §5 · _CANON_NODES/creator-case-*.md §10", "st": "ruled"}, "rtb": {"t": "RTB", "k": "proword", "d": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, the folder cleared. Chief's own coinage 9/10; replaces the retired [[sweep|sweep]]. Third movement of the park trio with [[oscar-mike|Oscar Mike]] and [[charlie-mike|Charlie Mike]]. 9/11: one meaning only — the pass that sends a parked card home and clears it; retires itself when oscar-mike/ is empty. The end of the sortie is Oscar Mike.", "w": "SOP.md §1", "st": "ruled"}, "charlie-mike": {"t": "Charlie Mike", "k": "proword", "d": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The park trio is Oscar Mike (park), Charlie Mike (resume), [[rtb|RTB]] (return to base).", "w": "SOP.md §1", "st": "ruled"}, "gouge": {"t": "GOUGE", "k": "item", "d": "Navy and Marine slang for the essential distilled information. Recommended 9/10 as the name for the creator-case lessons block and used as its provisional header for a few hours; Chief ruled [[ttp|TTP]] instead. Bench only.", "w": "SOP.md §5", "st": "retired"}, "frago": {"t": "FRAGO", "k": "proword", "st": "ruled", "d": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Chief's clarification 9/10 late (\"FRAGO is just the update after we've made the BOLO status page\"). \"FRAGO 45\" folds what changed since the last build into [[opord|OPORD 45]] and republishes; only what changed, everything not mentioned stands as ordered; the page's Log keeps every FRAGO.", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "opord": {"t": "OPORD (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 after twelve hours (\"there has to be a better name than that, something much cooler\"). The thing it named is the [[dope-sheet|DOPE SHEET]].", "w": "SOP.md §5"}, "bolo46": {"t": "BOLO 46", "k": "item", "d": "The OXO series follow-through: the [[telling-profile|Telling Profile]]'s 12 rulings · Anna's node · the pilot's page one. Captured 9/11 at priority one on Chief's word; it had no BOLO before.", "w": "BOLO.md #46"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRAGOs]]. RULED 9/11: header \"DOPE SHEET N\"; spoken \"give me the dope on N\", \"status report on N\", \"the situation on N\" all read the same. From the Scout Sniper's DOPE book: Data On Previous Engagements, everything known on the target and every prior engagement in one book. Replaced OPORD (retired the same morning).", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "bolo47": {"t": "BOLO 47", "k": "item", "d": "The dashboard consult: eight ranked ideas from current Claude Code / VS Code operator boards for the [[sitrep|sit rep]] page. Captured 9/11; none taken yet.", "w": "BOLO.md #47"}, "bolo48": {"t": "BOLO 48", "k": "item", "d": "The name bench: every unruled word with its bench on one sheet. Ruled 9/11: DOPE SHEET · ADORNED · ABORT (the cancel word) · BREVITY (what the SOI holds) · HOTLINE / HOTLINE ACTUAL (the operator's callsign). Closed 9/11: the close-out is Oscar Mike, ENDEX retired. Open: READYROOM · MINT. Pool: \"caught up\" · INTEL.", "w": "BOLO.md #48 · SOP §5"}, "bolo49": {"t": "BOLO 49", "k": "item", "d": "The Massive presets: the best free banks for Native Instruments Massive, verified 9/11; the shortlist is on its sheet.", "w": "BOLO.md #49"}, "eink": {"t": "E-INK", "k": "ruling", "st": "provisional", "d": "The light face of every internal page, provisional 9/11: Kindle-gray paper (#D8D8D2 ground, #E4E4DE surface), never white — \"like an old Kindle… digital ink.\" Shown only when a viewer forces light; DARK is the only theme and the toggle is gone.", "w": "SOP.md §2 · the three templates"}, "adorned": {"t": "ADORNED", "k": "ruling", "st": "ruled", "d": "DARKROOM dress-state value, RULED 9/11 (\"let's do adorned\"): naked except for an accessory — socks, heels, jewelry, glasses, a hat, a harness; the r/WhyWearAnythingAtAll read. Replaced implied (retired 9/11: no garment and nothing shown). Vocab edited, zero-shot rerun, probes retrained the same morning; 42 old human confirmations still say implied and are left as Chief's record.", "w": "_PRIVATE/taxonomy_engine/vocab.json · BOLO 44"}, "actual": {"t": "ACTUAL", "k": "proword", "st": "ruled", "d": "The suffix for the commander in person on the net (\"Six Actual\"). RULED 9/11 as the formal form of the operator's callsign: [[hotline|HOTLINE ACTUAL]]. Never alone.", "w": "SOP.md §5"}, "bolo50": {"t": "BOLO 50", "k": "item", "d": "The standards campaign: every level of the operation as a standards organization; a networked library of outside and Command-made standards. Research phase: the harvest banked as a locus, the register pulled by agent. Opened 9/11 on a break-break.", "w": "BOLO.md #50 · _0.1_BVX_LEARN/LOCI/standards.locus.md"}, "abort": {"t": "ABORT", "k": "proword", "st": "ruled", "d": "The cancel word, RULED 9/11: \"abort abort abort\" spoken three times, then the correction. Cancels the immediately preceding order; the record keeps the abort line, not the order. Aircrew and JTAC lineage: the call not to release. First live use the same minute: \"abort abort abort the index process\" (the ENDEX). Replaced belay.", "w": "SOP.md §0–1 · §5"}, "brevity": {"t": "BREVITY", "k": "noun", "st": "ruled", "d": "What the [[soi|SOI]] holds, RULED 9/11 (\"I do like brevity better\"): the Command's word list, after the Multi-Service Brevity Codes, the list that makes radio short. The SOI's subtitle on every page. Replaced \"the lexicon\" (provisional) and \"the house tongue\" (retired). RULED 9/23: BREVITY also names the proword selection loop ([[bolo37|BOLO 37]]), the pass that mints the list; MINT retired.", "w": "SOP.md §0 · §6 · the SOI page"}, "hotline": {"t": "HOTLINE", "k": "proword", "st": "ruled", "d": "The operator's callsign, RULED 9/11. Casual: \"Hotline\", \"wo
