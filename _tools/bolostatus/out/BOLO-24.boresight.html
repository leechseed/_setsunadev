<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>BORESIGHT 24</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- DOPE SHEET · the document layout (RULED 9/16, BOLO 55: one page · the rail kept, narrow · the default for every sheet) ----
     Modeled on the NASA NPR and the DoD Instruction: a compact masthead, a boxed front-matter table,
     then the body as numbered sections in one scroll. The center column is the page; everything else is a margin.
     Colorway: the ruled default (creator-cases palette, DARK only; E-INK light face when the viewer forces light). */
  :root {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --grid: color-mix(in srgb, var(--ink) 6%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  :root {
    --bg: #0F1216; --panel: #171B21; --panel-2: #1F242C;
    --ink: #E8EAEE; --ink-2: #A9B0BC; --ink-3: #7B8492;
    --accent: #FF6B35; --accent-ink: #FF8F62; --accent-soft: #3A2117;
    --link: #FF8F62; --good: #5CC48A; --good-soft: #16301F; --warn: #D9C48A; --warn-soft: #3A3320; --bad: #E9788A; --bad-soft: #3A1B20; --help: #A9B0BC;
    --mark: #3A3320; --orange: #FF8F62; --orange-soft: #3A2117;
    --line: #2B313B; --line-2: #3C4452;
    --grid: color-mix(in srgb, var(--ink) 8%, transparent);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #D8D8D2; --panel: #E4E4DE; --panel-2: #CBCBC4;
    --ink: #1B1B19; --ink-2: #44453F; --ink-3: #6B6C65;
    --accent: #E04E18; --accent-ink: #A83409; --accent-soft: #E9D5CA;
    --link: #A83409; --good: #1F6B45; --good-soft: #CFE0D3; --warn: #5E4F22; --warn-soft: #E2D9BE; --bad: #962C37; --bad-soft: #E6CCCF; --help: #44453F;
    --mark: #E2D9BE; --orange: #A83409; --orange-soft: #E9D5CA;
    --line: #B5B5AE; --line-2: #97978F;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; font-family: var(--body); font-size: 16.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: var(--link); }
  strong { font-weight: 700; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, .t:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--mark); }
  .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .t { color: var(--link); text-decoration: none; border-bottom: 1px dotted color-mix(in srgb, var(--link) 55%, transparent); cursor: help; }
  .t:hover, .t.on { border-bottom-style: solid; }

  /* ---- frame: masthead / toc · doc · rail / foot ---- */
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 224px minmax(0, 1fr) 248px; grid-template-areas: "head head head" "toc doc rail" "foot foot foot"; }

  /* the masthead: one strip. Number · title · state · version. Nothing else lives up here. */
  header.mast { grid-area: head; display: flex; align-items: center; gap: 16px; padding: 0 18px; min-height: 52px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); }
  .mast .num { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .mast .num small { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); }
  .mast .num b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .mast h1 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.1; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .mast .ver { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .mast .soi { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; background: var(--accent); color: #fff; text-decoration: none; }
  .mast .soi:hover { background: var(--accent-ink); }

  /* the table of contents */
  nav.toc { grid-area: toc; border-right: 1px solid var(--line-2); padding: 16px 0 18px; overflow-y: auto; background: color-mix(in srgb, var(--panel) 55%, transparent); }
  nav.toc .lbl { display: block; padding: 0 18px 8px; }
  .toc-row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; padding: 7px 14px 7px 18px; color: var(--ink-2); text-decoration: none; border-left: 3px solid transparent; }
  .toc-row.sub { padding-left: 30px; grid-template-columns: 30px 1fr; font-size: 13.5px; }
  .toc-row .no { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-3); }
  .toc-row .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
  .toc-row.sub .nm { font-family: var(--body); font-weight: 400; font-size: 13.5px; text-transform: none; }
  .toc-row:hover { color: var(--ink); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .toc-row.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--accent); }
  nav.toc .kv { padding: 14px 18px 0; margin: 12px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-family: var(--mono); font-size: 11px; }
  nav.toc .kv dt { color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
  nav.toc .kv dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }

  /* the document: the one scroll */
  main.doc { grid-area: doc; overflow-y: auto; padding: 28px 44px 96px; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { main.doc { scroll-behavior: auto; } }
  .page { max-width: 84ch; }
  .page h1.dt { margin: 0 0 14px; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 3.6vw, 44px); line-height: .98; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
  .page h1.dt small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .18em; color: var(--accent-ink); margin-bottom: 8px; }

  /* front matter: the boxed field table (the DoDI cover block, the NPR preface) */
  .fm { display: grid; grid-template-columns: max-content 1fr; margin: 0; border: 1px solid var(--line-2); background: var(--panel); font-size: 14.5px; }
  .fm > * { padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .fm > *:nth-last-child(-n+2) { border-bottom: 0; }
  .fm dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); background: color-mix(in srgb, var(--panel-2) 70%, transparent); border-right: 1px solid var(--line); padding-top: 9px; }
  .fm dd { margin: 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .fm dd.st { color: var(--ink); }

  /* sections */
  section.sec { padding-top: 24px; margin-top: 28px; border-top: 1px solid var(--line-2); scroll-margin-top: 8px; }
  section.sec.pre { border-top: 0; margin-top: 22px; padding-top: 0; }
  .sh { display: flex; align-items: baseline; gap: 14px; margin: 0 0 6px; }
  .sh .no { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--accent-ink); min-width: 34px; }
  .sh h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
  .sh .src { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  p.plain { margin: 0 0 16px; font-size: 16.5px; line-height: 1.5; color: var(--ink-2); max-width: 66ch; }
  .sub { margin-top: 18px; scroll-margin-top: 8px; }
  .sub > .lbl { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; color: var(--ink-2); }
  .sub > .lbl .no { font-family: var(--mono); color: var(--accent-ink); letter-spacing: .08em; }

  /* P.1 purpose · P.2 the order */
  .purpose { font-size: 17.5px; line-height: 1.5; margin: 0; max-width: 70ch; }
  .order { margin-top: 6px; padding: 18px 22px; border: 1px solid var(--line-2); background: var(--panel); position: relative; }
  .order::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .order .big { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.05; text-transform: uppercase; }
  .order .big strong { color: var(--accent-ink); }
  .order .default { margin: 10px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }

  /* P.3 the calls · the decisions table, the working surface */
  .tblwrap { overflow-x: auto; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 14.5px; border: 1px solid var(--line-2); }
  table.calls th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line-2); background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
  table.calls td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.calls tr:last-child td { border-bottom: 0; }
  table.calls td.n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--accent-ink); width: 40px; text-align: right; }
  table.calls td.q { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; text-transform: uppercase; min-width: 140px; }
  table.calls td.o { color: var(--ink-2); font-size: 13.5px; line-height: 1.4; }
  table.calls td.o .rul { display: block; margin-top: 6px; color: var(--good); font-size: 13.5px; }
  table.calls td.d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); min-width: 160px; }
  table.calls td.d em { font-style: normal; color: var(--accent-ink); font-weight: 500; }
  table.calls td.s { white-space: nowrap; }
  table.calls tr.ruled td.q, table.calls tr.ruled td.n { color: var(--ink-3); }

  /* P.4 the three */
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); }
  .three > div { padding: 10px 14px; border-right: 1px solid var(--line); }
  .three > div:last-child { border-right: 0; }
  .three .w { font-family: var(--display); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; }
  .three p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }

  /* items */
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); min-width: 28px; text-align: right; padding-top: 2px; }
  .item .text { font-size: 16px; line-height: 1.5; }
  .item .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 5px; }
  .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid currentColor; line-height: 1.5; white-space: nowrap; }
  .st-hot { color: var(--accent); } .st-hot i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
  .st-open { color: var(--warn); } .st-held { color: var(--warn); border-style: dashed; }
  .st-gated, .st-parked { color: var(--ink-3); }
  .st-done, .st-ruled, .st-good { color: var(--good); }
  .st-bad, .st-missing { color: var(--bad); }
  .st-corrected, .st-new { color: var(--help); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .st-hot i { animation: none; } }
  .tr { display: inline-flex; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.5; }
  .tr span { padding: 2px 7px; border: 1px solid var(--ink); }
  .tr .b { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tr .o { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
  .tr .p { color: var(--ink-2); border-color: var(--ink-3); border-style: dashed; }
  .tr span + span { margin-left: -1px; }

  /* mission */
  .msn { padding: 20px 24px; border: 1px solid var(--line-2); background: var(--panel); position: relative; max-width: 80ch; }
  .msn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .msn .task { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; text-transform: uppercase; margin: 0; }
  .msn .intent { font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2.2vw, 26px); line-height: 1.1; color: var(--accent-ink); margin: 6px 0 0; }
  .msn .spoken { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); font-style: italic; color: var(--ink-2); font-size: 15px; }
  .end ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 5px; font-size: 15.5px; }

  /* execution */
  .me { margin: 0 0 14px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 15.5px; }
  .me .lbl { display: block; color: var(--accent-ink); margin-bottom: 4px; }
  .ph { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .ph:last-child { border-bottom: 0; }
  .ph .n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--ink-3); text-align: right; padding-top: 2px; }
  .ph.done .n { color: var(--good); }
  .ph .text { font-size: 15.5px; line-height: 1.5; }
  .ph .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .coord ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }

  /* files */
  table.files { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.files th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
  table.files td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.files td.p { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .cost { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; }
  .cost > div { display: flex; flex-direction: column; }
  .cost b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .cost span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }

  /* log */
  .lg { display: grid; grid-template-columns: 56px 64px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
  .lg:last-child { border-bottom: 0; }
  .lg .who { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .lg.claude .who { color: var(--ink-3); }

  /* related */
  .rel { display: grid; gap: 6px; font-size: 15px; }
  .rel b { font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; margin-right: 6px; }

  /* the rail: where you are (follows the scroll) · term detail on click */
  aside.rail { grid-area: rail; border-left: 1px solid var(--line-2); overflow-y: auto; padding: 18px 18px 24px; background: color-mix(in srgb, var(--panel) 55%, transparent); display: flex; flex-direction: column; gap: 16px; }
  .rail h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .02em; }
  .rail h4 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: .14em; color: var(--accent-ink); margin-bottom: 2px; }
  .ctx { display: grid; gap: 12px; }
  .ctx .c { padding-left: 12px; border-left: 2px solid var(--line-2); }
  .ctx .c .lbl { display: block; margin-bottom: 3px; color: var(--accent-ink); }
  .ctx .c p { margin: 0; font-size: 14.5px; line-height: 1.45; }
  aside.rail.gl .ctxwrap { display: none; }
  .glos { display: none; flex-direction: column; gap: 10px; }
  aside.rail.gl .glos { display: flex; }
  .theme { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .theme:hover { border-color: var(--accent); color: var(--ink); }
  .gl-detail { padding: 12px 14px; border: 1px solid var(--line-2); background: var(--panel); }
  .gl-detail h5 { margin: 0 0 6px; font-family: var(--display); font-size: 21px; font-weight: 700; text-transform: uppercase; }
  .gl-detail p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .gl-detail .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }

  /* footer key strip */
  footer.foot { grid-area: foot; border-top: 1px solid var(--line-2); padding: 7px 18px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); background: color-mix(in srgb, var(--panel) 85%, transparent); }
  footer.foot kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-2); color: var(--ink-2); margin-right: 3px; }
  footer.foot .r { margin-left: auto; }

  /* tooltips */
  .tip { position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 24px); background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); box-shadow: var(--shadow); padding: 12px 14px 10px; font-size: 14.5px; line-height: 1.45; }
  .tip .th { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .tip .th b { font-family: var(--display); font-weight: 700; font-size: 19px; text-transform: uppercase; }
  .tip .th .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .tip p { margin: 0; }
  .tip .w { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .tip .lock { height: 2px; background: var(--line); margin-top: 10px; position: relative; }
  .tip .lock b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  .tip.locked .lock b { width: 100%; }
  .tip.locked { border-top-color: var(--ink); }
  .tip .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px; letter-spacing: .06em; }

  @media (max-width: 1080px) { .app { grid-template-columns: 200px minmax(0, 1fr) 0; } aside.rail { display: none; } aside.rail.gl { display: flex; position: fixed; right: 0; top: 52px; bottom: 0; width: min(320px, 90vw); z-index: 40; box-shadow: var(--shadow); } }

<script>
const DATA = {"board": {"bolo": {"n": 24, "kind": "BORESIGHT", "title": "The launch month, the volcano, and the market — the distill Chief asked for", "trunk": "ORANGE/OPERATOR", "issued": "2026-09-17", "asof": "2026-09-17", "s": "hot", "status": "BORESIGHT v0.2, 9/17 late · **D-12 RULED: [[route-b|Route B]]**, local AI image-to-video on the render · the Steam record corrected (theme-based, not AI) · **the lewd line read: [[lewd-line|lewd-first]] wins the opening** (mainstream rails, Instagram and TikTok reach, no [[age-verification|age-verification net]]) · the 2026 rails mapped · recommendation stands: launch January 2027 · **six calls open, D-13 to D-18**", "decider": "HOTLINE ACTUAL", "feeds": "[[bolo24|DOPE SHEET 24]] (the sheet this boresight serves) · the [[register|register]] · [[bolo29|BOLO 29]] (the reward-vs-risk ranking, Blocked #11) · [[bolo57|BOLO 57]] (voices, the fourth venture) · [[main-effort|the main effort]]", "related": [{"n": 24, "why": "the sheet: this boresight answers its Call 1 (launch month) and adds five calls"}, {"n": 29, "why": "the four-way venture ranking waits on a read like this one for each candidate"}, {"n": 57, "why": "ElevenLabs voices — the persona will need one; the Fanvue lane rewards a voiced life"}, {"n": 27, "why": "ULTRA DARK, the funnel; Block C is the discovery engine this read names as the vulnerability"}], "home": "_PRIVATE/_boresight-24/ (facts · market-supply · market-demand · method) · BOLO.md row 24 · STATE Blocked #10", "card": "none — this is a read, not a stall; the calls go to DOPE SHEET 24 by FRAGO on Chief's rulings", "version": "v0.2 · BORESIGHT"}, "mantra": [{"k": "speed", "w": "Speed", "line": "The render is thirty seconds. The audience is the year. Every hour spent past target quality on the art is an hour stolen from [[d9|the discovery engine]]."}, {"k": "focus", "w": "Focus", "line": "Nobody documented broke in on quality alone. They attached to an audience and shipped motion. [[character-moat|Character is the moat]]; motion is the fuse."}, {"k": "boldness", "w": "Boldness", "line": "The volcano is a bet, and a bet has a price and a test. Thirty days on X in October tells us whether it pays before a library is banked against it."}], "frago": {"mission": "Answer Call 1 of [[bolo24|DOPE SHEET 24]] with a dated launch month and an honest expectation, **in order to** stop [[main-effort|the main effort]]'s thirteen-day idle with a decision that is measured, not guessed.", "order": "**Rule D-14 (January 2027), D-15 (the October test) and D-18 ([[lewd-line|lewd-first]]).** D-18 sets what the October test posts and where; the other two set the calendar. D-17 rides on the [[bolo24|Gate 3]] skin test this week.", "default": "Silence: the plan runs as charted toward February with stills only, the ladder plan; nothing in this read is adopted and [[volcano|the volcano]] stays a word.", "calls": [{"q": "D-12 · the motion lane", "options": "YES, add short loops (5–15 s) as the viral unit beside the stills (rec) · NO, stills only as charted · LATER, after the stills library ships", "default": "YES (rec)", "s": "ruled", "ruling": "RULED 2026-09-17, Chief: \"we're going to be doing [[route-b|Route B]].\" The motion lane is local AI image-to-video on the finished render (ComfyUI + Wan 2.2 / LTX on the 3090, NSFW loops and beginner workflows already on Civitai), not hand animation. Route A, the Spine-style living picture NIKKE actually uses, is the later splash asset if the loops travel in October. Route C, light Blender motion, is the fallback."}, {"q": "D-13 · the platform set", "options": "lewd-first: Instagram + TikTok as the feeds, Instagram Subscriptions or Fanfix/Passes as the paid tier, Fanvue as the backend if the explicit ladder is climbed (rec) · the charted adult trio (Patreon SFW-tier + SubscribeStar Adult + Fansly) · Fanvue-first", "default": "lewd-first with Fanvue as the backend (rec)", "s": "open", "ruling": "Open, re-cut 9/17 late on the lewd read. Fansly's photoreal-AI ban and Patreon's hyperrealistic rule both bite a [[route-b|Route B]] persona; [[fanvue|Fanvue]] welcomes disclosed synthetic and runs a lewd public layer over an explicit paywall on one account. [[processor-risk|Processors, not platforms]], are the chokepoint (rails sheet §B)."}, {"q": "D-14 · the launch month", "options": "January 2027 (rec) · December 2026 · February 2027 (the beats doc's pick) · later", "default": "January 2027 (rec)", "s": "open", "ruling": "Open. January gives [[volcano-sequence|the Volcano Sequence]] its calendar (framing 9/18–9/23 · design and war-game by 9/30 · the [[thirty-day-test|thirty-day test]] in October · the splash asset and the twenty-piece library in November) and puts the April grief anchor inside the sixty-day buffer, close to the beats doc's intent. February costs a sixth month of unemployment for no evidence gain; December is eaten by the banking."}, {"q": "D-15 · the thirty-day test as the go/no-go", "options": "GO: run R9 on X 10/1–10/31 with the slice + the first loop, thresholds written before posting (rec) · skip it and bank the library on faith · run it after launch", "default": "GO (rec)", "s": "open", "ruling": "Open. The discovery engine is the critical vulnerability (benchmarks §6; [[trl|TRL]] 3–4 against a TRL 6–7 pipeline). Threshold: follower growth at or above the Variety Itsol rate (~1,300 a month) = [[volcano|the volcano]] is live, bank forty; the Kirenes rate (~470) = the ladder, bank twenty and keep the income search first; under 250 = replan the positioning before spending November."}, {"q": "D-16 · the category sentence", "options": "Chief words it (rec) · the studio's draft: \"a studio signed a girl who does not exist, and she is the only one in the lane with a life\" · defer to the splash brief", "default": "Chief words it (rec)", "s": "open", "ruling": "Open. The [[lightning-strike|Lightning Strike]] needs one sentence the whole launch carries. [[aitana|Aitana]]'s mechanism was a press-ready sentence, not a render; [[remi|Remi]]'s is the disclosed studio signing. The draft is a placeholder, not a ruling."}, {"q": "D-17 · the render style", "options": "stylized-real (rec) · photoreal · decide at the Gate 3 skin test", "default": "stylized-real (rec)", "s": "open", "ruling": "Open. [[route-b|Route B]] animates the render with AI, and the policy line everywhere is stylized versus photoreal-of-a-real-person: Patreon allows stylized AI, Fansly bans photoreal AI, TikTok and YouTube auto-label photoreal. Stylized-real also carries the human-made premium against the AI flood and matches D-6's disclosed frame. The [[bolo24|Gate 3]] skin test this week is where the look is chosen; choose it with this lane in mind."}, {"q": "D-18 · the explicitness line", "options": "lewd-first, the two-account ladder later (rec) · explicit from day one as charted · lewd only, ever", "default": "lewd-first, ladder later (rec)", "s": "open", "ruling": "Open. Chief asked: do I have to go full NSFW, can I just be lewd? The read says [[lewd-line|lewd-first]] is the correct opening — mainstream distribution, the brand-deal ceiling, no [[age-verification|age-verification net]], rails under 5 percent — and the standard ladder is a second, separated account on [[fanvue|Fanvue]] once the free audience is large enough to convert, with the account-linking mitigations (separate device, email, IP; no direct adult links from the SFW feed) mandatory from day one of the second account. This re-cuts the beats doc's 45/35/20 split (Call 3): the launch library goes suggestive-heavy, explicit banks behind the ladder."}]}, "paragraphs": [{"id": "S", "name": "Situation", "kind": "list", "plain": "What the market is doing in September 2026, what the money actually looks like, what the documented fast breakouts did, and where BOLO 24 stands against all of it. Four specialists read 118 sources and eleven private docs; the main line read only their four sheets. Nothing here is a ruling.", "strand": {"last": "[[bolo24|DOPE SHEET 24]] has carried Call 1, the launch month, since 9/11 with a bare 'February' from the beats doc and no market read behind it. This morning Chief asked for the whole distill: the timeline, a method, and the audience.", "plan": "Four disjoint reads in [[formation|the formation]] — the private docs, the supply side, the demand side, the method — then one synthesis on the main line.", "you": "You said the edge is utmost quality and a splash: be [[volcano|the volcano]] while everyone else climbs ladders, the unexpected and immediately a contender. You asked whether SFM and game-character content was a passing thing and whether there are better areas.", "next": "Read the four groups below in order: the market, the money, [[volcano|the volcano]] evidence, the state of the sheet. Then the Execution paragraph carries the dated answer."}, "groups": [{"label": "The market · active, not passing", "items": [{"t": "**It is not a passing thing; it plateaued high and keeps growing.** Pornhub's 2025 year in review: hentai the number-one global search for the fifth straight year, 'animation' up 28 percent and '3D' up 19 percent year over year, anime the seventh most-searched term overall. Rule34's aggregator layer sat near 500 million visits in December 2025, flat with normal noise.", "s": "open"}, {"t": "**The game-character wave still fires on fresh IP.** Genshin Impact took the number-one searched game in 2025; Marvel Rivals, a 2025 release, broke straight into the top ten beside decade-old Overwatch. The 2016 mechanism (big cast, new character drop, new content wave) is intact. It is also the most crowded tag on every board, exactly as you read it: futa and video-game girls.", "s": "open"}, {"t": "**The [[the-ai-shock|AI shock]] split the lane instead of killing it.** Civitai lost [[processor-risk|card processing]] in May 2025 and went to crypto; 'slop' was Merriam-Webster's 2025 word of the year; the counter-trend is a 'human-made' premium. The policy line everywhere is stylized versus photoreal-of-a-real-person, not AI versus hand. A consistent, hand-posed 3D character reads as 'real 3D' against the flood. That is the opening, not a guarantee.", "s": "open"}, {"t": "**The disclosed 3D persona lane is forming and institutionalizing.** [[fanvue|Fanvue]] ran the first 'AI Personality of the Year' in June 2026; [[aitana|Aitana]] Lopez cleared roughly ten thousand a month in brand deals before two hundred thousand followers on the same mechanism (a small team, a maintained life, a press-ready story). Adult CGI-persona accounts are reported at three to thirty thousand a month once they hit volume — directional, not audited.", "s": "open"}, {"t": "**[[better-areas|Better areas]] for the same Blender skill:** VTuber model commissions (1,300 to 3,800 dollars entry, five to ten thousand rigged; Hololive's parent did 43 billion yen in FY2025), adult VR (projected 19 billion dollars by 2026, the fastest-growing format, 97 percent subscription), AI-hybrid pipelines with the human finish sold as the product, and 3D visual novels (top adult-VN creators averaged about five thousand a month in 2023). Each is a real lane; none is the one on the sheet.", "s": "open"}]}, {"label": "The money · stills cap, motion and games compound", "items": [{"t": "**The top of the lane is animators and game devs, not still artists.** Graphtreon today: RadRoachHD 41,500 a month on 10,148 patrons; CyanCapsule 24,900 after eleven years; wildeer studio 15,400; a band of 3D Blender names at 3,800 to 9,300 a month on one to three thousand patrons. Every one of them ships loops, episodes, or builds.", "s": "open"}, {"t": "**The [[stills-ceiling|stills-only ceiling]] is low.** The best stills-only page found, Mr. Vargas, sits near a thousand a month on 177 patrons after four years and a prior studio apprenticeship. Dreamrider3D: six years, nine paid patrons, 31 dollars a month. Platform-wide, 98 percent of Patreon creators never clear a thousand a month; the median is under a hundred.", "s": "open"}, {"t": "**Time to first dollar, documented:** nobody in the pass reached 500 a month inside ninety days from zero. The fastest breakout to visibility was about five months (Amazonium3D, now 7,300 a month four years on). Galaad1800's first real income was direct commissions, not subscriptions: full-time money with six patrons. The gates table already says this; it is not news, it is confirmation.", "s": "open"}, {"t": "**Conversion and funnel:** half a percent to two and a half percent of a fanbase converts to paid; X is a link-out channel only (adult content excluded from recommendations, no on-platform monetization); Bluesky formalized fictional adult art in September 2025 with an organized starter-pack scene; the boorus are discovery by osmosis, uncontrolled. A working estimate for a single commissioned still off an existing rig is 30 to 150 dollars.", "s": "open"}]}, {"label": "The volcano · what the fast breakouts actually did", "items": [{"t": "**None of the five documented fast breakouts won on quality alone.** Amplected (Newgrounds, August 2023, now near 200 thousand on Instagram alone) and suoiresnu (a 4K One Piece short, 'immediately viral') both attached to a known IP and shipped short, polished motion across several platforms at once. Marvel Rivals rode a launch window. [[aitana|Aitana]] rode a press sentence. Soraya Thorne rode a category with an award circuit.", "s": "open"}, {"t": "**The three cautionary cases are the plan as charted.** Skilled Blender artists with an original character, a standard Patreon page and no hook plateau at niche income; paid adult games on itch.io lost their rails overnight in July 2025 when Stripe and PayPal would not carry them (free adult content was re-indexed within days, paid is still dead there in 2026), while [[steam-record|Steam's same-month purge]] was **theme-based, not AI-based** — incest, non-consent, torture — and adult games broadly still sell there under the Adult Only tag; and experienced generic 3D artists are being compressed by AI. High craft plus generic positioning is the ladder.", "s": "open"}, {"t": "**The common thread, stated once:** an attached audience (an IP or a press-ready sentence), a shareable motion unit, and timing to a moment. Character is what the cautionary cases lack, and it is the one thing BOLO 24 already has on paper. It is the moat, not the fuse.", "s": "open"}, {"t": "**The read for [[remi|Remi]]:** the IP route conflicts with the studio's original-persona strategy and carries DMCA risk; the press route is native to it — 'a studio signed a girl who does not exist' is the [[aitana|Aitana]] sentence with a wound and an arc behind it. That is [[volcano|the volcano]]'s only honest path here, and it needs motion to travel.", "s": "open"}]}, {"label": "The sheet · where BOLO 24 stands today", "items": [{"t": "**Built and ruled:** D-5 provisional, D-6, D-7, D-9 ruled 9/16; character sheet v0.2 ([[remi|Remi]] Slate, 21, born August 11 2005, the loss in 2020), Season 1 beats v0.1 (five beats, eight sets, 38 stills), pipeline COA A fully free (Blender 4.5, MPFB2, Cycles), the slice's five Set 4 files with S4-01 rendered at 2048 by 2560 in under a minute. [[bolo24|Gate 3]] is open; its six evenings are this week.", "s": "done"}, {"t": "**The five calls on the sheet:** launch month (February, no read behind it) · library size (28 plus 10) · the split (45/35/20) · the [[bolo24|Gate 3]] skin test (this week) · the death month (May 2020). [[boresight|This boresight]] answers the first with evidence and adds five more.", "s": "open"}, {"t": "**The numbers the sheet already carries:** on-target month three 150 to 200; month six 400 to 600; month twelve 1,000 to 1,500, which is the top three percent platform-wide. The blocker read: month-six net under conservative and X growth under 500 a month means [[d9|the discovery engine]], not the art. The market read confirms every one of those lines.", "s": "open"}]}, {"label": "The lewd line and the rails · 9/17 late", "items": [{"t": "**[[lewd-line|Lewd-first]] wins the opening.** The disclosed AI-persona money is lewd, not nude: Lu do Magalu about 34 thousand a sponsored post, Milla Sofia 10 to 25 thousand a post, [[aitana|Aitana]] about 30 thousand a month on [[fanvue|Fanvue]] plus brand deals, Emily Pellegrini 6 to 23 thousand a month solo. Disclosed personas keep full Instagram and TikTok reach in 2026; only undisclosed ones are suppressed (Meta's 'AI-generated profile' label, August 2026).", "s": "open"}, {"t": "**What explicit costs:** the mainstream feeds (no Instagram, no TikTok, X only), every brand deal, [[processor-risk|adult processors]] at 10.8 to 14.5 percent, and the [[age-verification|age-verification net]] — 26 US states as of June 2026 and the UK Online Safety Act with penalties up to ten percent of revenue. What it adds is per-fan revenue with no hard number behind it. Nobody has quantified lewd versus nude for the same persona.", "s": "open"}, {"t": "**The [[close-friends|'Close Friends' pattern]] is two things.** Instagram Subscriptions is the real rail: zero Meta commission through 2026, app-store cut on top, needs ten thousand followers. The informal version — a Close Friends story tier paid by Venmo, Cash App or PayPal friends-and-family — inherits the payment app's adult ban: PayPal can hold funds 180 days, 46 percent of adult creators lost a financial account in one year. Cheap until the day it is not.", "s": "open"}, {"t": "**The [[boring-rails|boring rails]] that hold under 5 percent:** Instagram Subscriptions, Fanfix (20 percent, brand-safe, no nudity and no AI nudes), Passes (flat 10 percent), Ko-fi and Buy Me a Coffee as tip jars, Throne wishlists. None is legally an adult platform, so none triggers an ID wall. [[fanvue|Fanvue]] is the one place a single account runs a lewd public layer over an explicit paywall.", "s": "open"}, {"t": "**The adult tier and the crypto route:** CCBill, Segpay and Epoch take a solo creator but charge 500 to 1,950 dollars a year in setup and hold reserves of up to 20 percent for 90 to 180 days; crypto checkout (Civitai's NowPayments precedent, USDC and USDT) exists and the GENIUS Act licensing lands around January 2027. There is no cheap middle once content is sold as explicit.", "s": "open"}]}]}, {"id": "M", "name": "Mission", "kind": "mission", "plain": "What this boresight is for, in one task and one intent, and the end state it serves.", "strand": {"last": "The sheet's mission stands: stand up a paying creative operation on what is in hand, in order to convert the unemployment window into the studio's founding season.", "plan": "This read does not change the mission. It dates it and prices [[volcano|the volcano]].", "you": "You named the standard: bleeding edge, viral-esque, immediately a contender. You also said there is more development to do first. Both are in the Execution paragraph.", "next": "Rule D-14 and D-15. The calendar starts the day you do."}, "task": "Deliver the launch month with a method and a market behind it,", "intent": "in order to replace the sheet's bare 'February' with a dated sequence Chief can rule on, and to price [[volcano|the volcano]] as a bet with a test instead of a wish.", "spoken": "\"Give me the boresight on the actual timeline and actual reasonable deadline and expectation. We need to be the volcano. I need the whole distill.\"", "endstate": ["A launch month ruled, with the calendar of phases behind it and the review that closes each.", "The volcano defined as a mechanism (character as moat, motion as fuse, a press sentence as the attached audience) with a [[thirty-day-test|thirty-day test]] that says GO or ladder before a library is banked.", "The market question answered on the record: active, growing modestly, money in motion and games, the disclosed-persona lane forming, processors the chokepoint.", "The method ([[volcano-sequence|the Volcano Sequence]]) slotted into M-002 through M-005 without renaming a phase."]}, {"id": "E", "name": "Execution", "kind": "phases", "plain": "The dated answer. The Volcano Sequence is the method brief's fused paradigm: NASA's reviews and [[conops|ConOps]], the Marines' [[mcpp|problem framing]] and war game, the Double Diamond and Jobs-to-be-Done for the audience, and category design's [[lightning-strike|Lightning Strike]] for the splash. It slots into the sheet's M-002 to M-005 as they stand. The dates assume Chief working roughly full-time from 9/18.", "strand": {"last": "The method brief audited the charter: the NASA four is real and already applied; what is missing is research inside the design phase (no [[conops|ConOps]], no competitive read, no launch campaign distinct from the product, no second decision point between the slice and the library).", "plan": "Five phases, each closed by a review the charter did not have: MCR · SDR/PDR · CDR/SIR/ORR · FRR · Gate 4.", "you": "You asked for a design-research paradigm and a project-management timeline paradigm from NASA or the Marines. Both exist; this is them, fused, with dates.", "next": "Phase 1 starts tomorrow and takes under a week; this boresight is its first half."}, "main_effort": "The [[thirty-day-test|thirty-day test]] in October. Everything before it feeds it; everything after it is sized by it.", "phases": [{"n": 1, "t": "**Problem framing and [[conops|ConOps]] — 9/18 to 9/23.** The category map (fifteen to twenty accounts tagged for what each is known for), the [[category-sentence|gap sentence]], the subscriber jobs list ranked, the ConOps walked from a follower's first thirty seconds through a missed-gate month and a platform review. Closes at an MCR: is the concept, positioned this way, worth the design set. [[boresight|This boresight]] is the first half of it.", "s": "hot", "when": "9/18–9/23"}, {"n": 2, "t": "**Design and [[mcpp|war game]] — by 9/30.** W1 to W6 as charted (most already in hand) plus one sitting to play the launch three moves out against the algorithm, the platform's trust and safety, and a rival account; name the [[character-moat|center of gravity]] (the bible) and the critical vulnerability (discovery) on paper. The [[bolo24|Gate 3]] evenings (skin, hair, pose, set, render) run in parallel this week. Closes at Gate 2 (SDR/PDR).", "s": "open", "when": "by 9/30"}, {"n": 3, "t": "**The slice and the [[thirty-day-test|thirty-day test]] — October.** The slice plus the first AI-animated loop ([[route-b|Route B]], D-12) posted 10/1 to 10/31 under the disclosed frame — lewd on Instagram and TikTok as the feeds, the spicier edge on X and Bluesky — with the hypothesis and the thresholds written before the first post (D-15). Early access to the set sells from day one on a [[boring-rails|boring rail]] (Instagram Subscriptions once eligible, Fanfix or Passes before that). Closes at [[bolo24|Gate 3]] (CDR/SIR/ORR) with the audience-signal report.", "s": "open", "when": "10/1–10/31"}, {"n": 4, "t": "**The splash — W8, November, in parallel.** The [[lightning-strike|Lightning Strike]] brief: the [[category-sentence|category sentence]] (D-16), one asset built to carry it (a loop, better than the library on purpose), the day-one sequence with tempo and surprise named. Closes at an FRR: is this specific launch moment cleared, independent of whether the library is banked.", "s": "gated", "when": "11/1–11/30"}, {"n": 5, "t": "**Banking — November.** Twenty stills plus two loops at the compressed library size (forty if the October test reads volcano), sixty-day buffer, two platforms and a mailing list live, Season 1 captions to the bible. Two to four evenings a still is the binding number, not the render; full-time that is three to five weeks.", "s": "gated", "when": "11/1–12/15"}, {"n": 6, "t": "**Launch — January 2027 (D-14).** Season 1 begins; the thirteen-week core runs January to March; the April grief anchor lands in the buffer. Expectation on the record: month three on-target is 150 to 200 a month; [[volcano|the volcano]] shows up first as follower growth, not dollars. Month six is the first replan check; the kill rule is three conservative misses.", "s": "gated", "when": "1/2027"}], "coord": ["The income search runs in parallel from today on [[pmcs|PMCS]] (Employment, red since 9/3); the venture is the daytime build only while runway holds, per D-5.", "Out of scope stands: real performers, any character under 18, spend beyond the stretch budget before [[bolo24|Gate 3]]'s AAR. The IP route (game-character content) is out: it conflicts with the original-persona studio and carries DMCA exposure.", "Where volcano quality costs calendar time: the framing week, the war-game sitting, the splash asset. Where it does not: rendering (thirty seconds a frame) and generating options.", "[[route-b|Route B]]'s tooling is a one-evening install: ComfyUI, Wan 2.2 or LTX, a Civitai workflow. It joins the [[bolo24|Gate 3]] evenings as evening seven."], "running": ["[[bolo24|Gate 3]]'s six evenings (this week). The [[darkroom|DARKROOM]] reference pull. The income search."]}, {"id": "A", "name": "Admin & Logistics", "kind": "files", "plain": "What this read cost, what it produced, and where the four inputs live. Everything stays in _PRIVATE.", "strand": {"last": "Four specialists in [[formation|the formation]] (three MS on sonnet, one PS on haiku), 118 web sources plus eleven private docs, one main-line synthesis.", "plan": "The inputs stay as working files; the board is the record; the calls go to [[bolo24|DOPE SHEET 24]] by [[frago|FRAGO]] once ruled.", "you": "Nothing to pay. The stretch budget is untouched.", "next": "If Chief wants the numbers re-baselined, the supply sheet's Graphtreon ranks are live pages and can be re-pulled in a day."}, "files": [{"path": "_PRIVATE/_boresight-24/facts.md", "what": "the BOLO 24 fact sheet — state, the five calls, pipeline numbers, the gates, positioning, six comparables, risks (PS, eleven docs)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/market-supply.md", "what": "who earns, the distribution, platforms and policy 2025–26, the funnel, commissions, time to first dollar (MS, 44 sources)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/market-demand.md", "what": "the arc, the [[the-ai-shock|AI shock]], what sells now, the format shift, [[volcano|the volcano]] cases, better areas (MS, 49 sources)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/method.md", "what": "the audit of the charter, NASA's life cycle and reviews, MCPP and MCDP 1, five design-research paradigms, [[volcano-sequence|the Volcano Sequence]], the time table (MS, 14 sources)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/motion-lane.md", "what": "NIKKE runs on Spine; the adult Live2D lane; tools and cost; local AI image-to-video on the 3090; the three routes (MS, 30 sources)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/merch-lane.md", "what": "zero-inventory lewd merch: who accepts it, the processor tax, the age wall, first-year money (PS)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/lewd-lane.md", "what": "the lewd-not-nude AI personas, the mechanics platform by platform, AI-persona policy 2026, lewd versus explicit (MS)", "s": "done"}, {"path": "_PRIVATE/_boresight-24/rails.md", "what": "the Steam and itch.io record corrected; the 2026 rails: Close Friends, the boring platforms, the adult tier, crypto, the age-verification net (MS)", "s": "done"}, {"path": "_tools/bolostatus/boards/24.boresight.json", "what": "this board", "s": "done"}], "cost": [{"k": "base", "v": "$0"}, {"k": "the read", "v": "eight specialists across two passes, about 720k tokens off the main line; the main line read seven sheets"}, {"k": "phase 1", "v": "under a week, this boresight being half of it"}, {"k": "the test", "v": "thirty days of calendar in October, near-zero GPU"}]}, {"id": "C", "name": "Command & Signal", "kind": "list", "plain": "Who decides, what closes each phase, and the signals that tell us in October whether [[volcano|the volcano]] is real.", "strand": {"last": "Every call on the sheet has been Chief's; this adds five (D-12 to D-16), two of which set the calendar.", "plan": "Rule the two calendar calls first; the format, the platform set and the sentence can follow inside Phase 1.", "you": "You decide. The thresholds are written so that October decides the size of November, not a feeling.", "next": "The signals are on X and Bluesky from 10/1; the review that reads them is [[bolo24|Gate 3]]'s AAR."}, "groups": [{"label": "The reviews that close each phase", "items": [{"t": "**MCR** (9/23) — is the concept, positioned by the [[category-sentence|gap sentence]], worth the design set. Chief's word after reading this board and the [[conops|ConOps]].", "s": "open"}, {"t": "**Gate 2 / SDR-PDR** (9/30) — the design set locked and the launch [[mcpp|war-gamed]]; a NO-GO here is legal and cheap.", "s": "open"}, {"t": "**[[bolo24|Gate 3]] / CDR-SIR-ORR** (10/31) — the slice's AAR read against the written thresholds; sizes the library.", "s": "gated"}, {"t": "**FRR** (December) — the splash cleared as its own moment; a ready library never launches on a dead moment.", "s": "gated"}, {"t": "**Gate 4** (January) — accounts live, Season 1 begins.", "s": "gated"}]}, {"label": "The signals · October, written before the first post", "items": [{"t": "**Follower growth** on the persona account: at or above 1,300 a month reads volcano (bank forty); about 470 reads ladder (bank twenty, income search first); under 250 reads replan the positioning before November.", "s": "open"}, {"t": "**Delight over reach:** saves, replies and DMs on arc posts versus look-only posts. This is the A-004 test the charter already names, now with a threshold.", "s": "open"}, {"t": "**First dollar:** early access to the Set 4 slice sells from 10/1. Any sale is the Galaad pattern (direct before subscription) and is expected; none by 10/31 is a signal, not a failure.", "s": "open"}, {"t": "**The loop travels or it does not:** shares and reposts of the first loop versus the stills. If the loop does not out-travel the stills by a wide margin, D-12 is re-opened.", "s": "open"}, {"t": "**The feeds decide the format:** if the Instagram and TikTok reach on the disclosed persona out-runs X, [[lewd-line|lewd-first]] is confirmed by the audience, not the read, and the explicit ladder waits for the numbers.", "s": "open"}]}, {"label": "Signal", "items": [{"t": "The calls ride to DOPE SHEET 24 by [[frago|FRAGO]] as each is ruled. The board republishes at the MCR and at [[bolo24|Gate 3]]. Silence past 9/23 means Phase 1 ran without a ruling and the calendar slips a week for each week of silence.", "s": "open"}]}]}, {"id": "L", "name": "Log", "kind": "log", "plain": "The record of the read.", "strand": {"last": "Spoken this morning after the first live launch sequence and the send-pad fix.", "plan": "One board, four inputs, five calls.", "you": "You said: you got this, baby.", "next": "Your word on D-14, D-15 and D-18. D-17 rides on the skin test this week."}, "entries": [{"when": "9/17", "who": "ACTUAL", "t": "\"Let's move on to BOLO 24, launch months. I need [[boresight|the boresight]] on the actual timeline and reasonable deadline. We need to be [[volcano|the volcano]]. Some design research paradigm, NASA or Marines. And a distillation of the audience: SFM, cosplay, video-game NSFW — is it an active market, are things moving, better areas? I need the whole distill.\""}, {"when": "9/17", "who": "CDR", "t": "Four specialists launched on disjoint inputs: the private docs (PS), the supply side (MS), the demand side (MS), the method (MS). 118 sources. The main line read the four sheets and wrote this board."}, {"when": "9/17", "who": "CDR", "t": "Recommendation on the record: launch January 2027 (D-14); the [[thirty-day-test|thirty-day test]] in October as the go/no-go (D-15); add the [[motion-lane|motion lane]] (D-12); three platforms plus a [[fanvue|Fanvue]] test (D-13); Chief words the [[category-sentence|category sentence]] (D-16)."}, {"when": "9/17", "who": "ACTUAL", "t": "\"What am I actually doing here? I'm not good at animation at all. Is the NIKKE-style moving picture an angle? Is anybody doing that?\" Then: \"we're going to be doing [[route-b|Route B]].\" Then: \"update your data on the Steam thing — there's a lot more adult content still on Steam. The [[close-friends|Close Friends]], direct-to-consumer processing people are doing. Do I have to go full NSFW? Can I just be lewd?\""}, {"when": "9/17", "who": "CDR", "t": "Four more reads: the motion lane (NIKKE is Spine; local AI image-to-video is the shortcut), merch, the lewd lane, the rails. D-12 ruled [[route-b|Route B]]. The Steam line corrected: theme-based, not AI. D-17 (render style) and D-18 (the explicitness line) opened; D-13 re-cut [[lewd-line|lewd-first]]. Board v0.2 republished."}]}]}, "glossary": {"sitrep": {"t": "sit rep", "k": "proword", "d": "The full board, cold start. Spoken, it flushes the [[ready-rack|Ready Rack]] and delivers blocks 0 to VII in fixed order. From 9/10 it also lands as this page.", "w": "SOP.md §1–2", "st": "ruled"}, "oscar-mike": {"t": "Oscar Mike", "k": "proword", "st": "ruled", "d": "The close-out, all in one — RULED 9/11 (\"when I say we're Oscar Mike, I wanna close out the session… just one thing\"). Spoken, it ends the session: the Ready Rack note is finalized, STATE updated, the day's journal appended, the reply ends with the OUT block. Nothing is parked into a card any more; every BOLO's resume order lives on its [[dope-sheet|DOPE SHEET]]. [[charlie-mike|Charlie Mike]] resumes; [[rtb|RTB]] sends the old parked cards home.", "w": "SOP.md §1 · §7 rule 9"}, "sweep": {"t": "sweep", "k": "proword", "d": "Retired 9/10, replaced by [[rtb|RTB]]. Was: promote the parked keepers to their real homes and clear oscar-mike/.", "w": "SOP.md §1", "st": "retired"}, "how-copy": {"t": "how copy?", "k": "proword", "d": "End of orders. The reply opens Good copy plus a readback, then executes. Solid copy means nothing to add. Bad copy on an item means one question.", "w": "SOP.md §1", "st": "ruled"}, "boresight": {"t": "boresight", "k": "proword", "d": "The understanding check before delivery: readback, the read, clarifying questions only. Nothing builds until you clear it. Boresight in on X aims it at one item.", "w": "SOP.md §1", "st": "ruled"}, "bolo": {"t": "BOLO", "k": "proword", "d": "\"BOLO that\" / \"put that down\": a tasking captured in BOLO.md the turn it is spoken. Be On the Lookout, named for the bolas: thrown on sighting, wraps, holds. The board noun is the watchlist itself.", "w": "BOLO.md", "st": "ruled"}, "pmcs": {"t": "PMCS", "k": "noun", "d": "Preventive Maintenance Checks and Services. The operator is equipment: body, medical, life admin. Never mixed with projects.", "w": "BOLO.md · PMCS table"}, "ivory-tower": {"t": "ivory tower", "k": "proword", "d": "Academic mode: published literature only, every claim cited inline, established versus contested marked.", "w": "SOP.md §1", "st": "ruled"}, "break-break": {"t": "break-break", "k": "proword", "d": "Open a detour; the main thread parks where it stands. [[buttonhook|Buttonhook back]] closes it.", "w": "SOP.md §1", "st": "ruled"}, "buttonhook": {"t": "buttonhook back", "k": "proword", "d": "Close the detour and return to the parked thread unprompted, restating where we were.", "w": "SOP.md §1", "st": "ruled"}, "run-the-darkroom": {"t": "run the darkroom", "k": "proword", "d": "Launch [[darkroom|DARKROOM]] in the background, no questions. The garbles black room and dark room read the same.", "w": "SOP.md §1", "st": "ruled"}, "belay": {"t": "belay (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 for [[abort|ABORT]]. Was: cancel the preceding order. Naval lineage: belay = stop, make fast.", "w": "SOP.md §5"}, "endex": {"t": "ENDEX (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11: it collided with \"index\" in dictation and was one process too many. The close-out is [[oscar-mike|Oscar Mike]].", "w": "SOP.md §5"}, "ready-rack": {"t": "Ready Rack", "k": "noun", "d": "_CACHE/. Session notes staged for the next sit rep. Flushed into the [[magazine|Magazine]] on every board; an empty Rack proves the handoff completed.", "w": "_CACHE/"}, "magazine": {"t": "Magazine", "k": "noun", "d": "_LOG/. Deep storage for flushed session notes. Append-only; nothing is deleted, it is stowed.", "w": "_LOG/"}, "fresh-ten": {"t": "Fresh Ten", "k": "noun", "d": "Block I: the ten projects touched most recently, newest first, each with its last-touched date and a concrete next step.", "w": "SOP.md §2"}, "ancients": {"t": "The Ancients", "k": "noun", "d": "Block II: the longest-untouched work in three tiers, each item with what it is waiting on.", "w": "SOP.md §2"}, "deep-stacks": {"t": "Deep Stacks", "k": "noun", "d": "Block III: projects ranked by volume of thought spent, from PROJECTS.md. Volume is characters of conversation, a proxy for thinking, not value.", "w": "PROJECTS.md"}, "leverage-line": {"t": "the leverage line", "k": "noun", "d": "Block VI: the single highest-leverage next action. Provisional rename pending: the Main Effort, MCDP 1's term for the one point everything else supports.", "w": "SOP.md §2"}, "soi": {"t": "SOI", "k": "noun", "d": "Signal Operating Instructions: the [[brevity|BREVITY]]'s book. The proword card (SOP §0), Block VII of every board, and since 9/11 its own page — search, A to Z, by section, the dictation codebook. \"Glossary\" is retired as a word (Chief, 9/11); every button and key says SOI.", "w": "SOP.md §0 · _tools/soi/ · the SOI page", "st": "ruled"}, "sop": {"t": "SOP", "k": "noun", "d": "SOP.md, the canonical home of every comms code and session protocol. On any conflict with memory, the file wins.", "w": "SOP.md"}, "trunk-black": {"t": "BLACK", "k": "noun", "d": "BLACK = Bold Venture (BVX): creative, IP, systems. Everything you make lands in one of two trunks; this is the first.", "w": "SOP.md §2"}, "trunk-orange": {"t": "ORANGE", "k": "noun", "d": "ORANGE = Ultrasin: venture, body, sexuality. The second house.", "w": "SOP.md §2"}, "trunk-operator": {"t": "OPERATOR", "k": "noun", "d": "OPERATOR = you as equipment: [[pmcs|PMCS]], tooling, readiness. Not a house; the person who runs both.", "w": "SOP.md §2"}, "stall-pattern": {"t": "the stall pattern", "k": "ruling", "d": "The recurring failure: a finished design blocked on one unanswered decision, then rebuilt from scratch later. The fix is the ruling, not more structure.", "w": "memory · STATE.md"}, "d9": {"t": "D-9", "k": "item", "d": "Ledger item D-9 on the [[bolo24|BOLO 24]] charter: the [[boresight]] HOLD from 9/3, converted 9/4, undated for twelve days and named by five boards running. **RULED GO 2026-09-16** (\"rule D9 go\"), staged clear: the no-dependency items deliver, the rest as their gates (D-5 · D-6 · D-7) clear.", "w": "_PRIVATE/BOLO-24-charter.md · STATE Blocked #10", "st": "ruled"}, "bolo24": {"t": "BOLO 24", "k": "item", "d": "The zero-budget ORANGE launch: 3D erotica stills in Blender, DARKROOM-fed, Ultrasin as the studio, a first signing with an arc. Charter in _PRIVATE/. Gated by [[d9|D-9]]; the next proposed gate is [[r9|R9]].", "w": "BOLO.md #24 · BORESIGHT 24: https://claude.ai/artifact/Km31pQKccwtmT5UZfVdUa1"}, "r9": {"t": "R9", "k": "item", "d": "Synthesis recommendation 9: thirty days on a fresh X account before any platform commit. Zero cost. Metric: follower growth against Kirenes' no-funnel rate and Variety Itsol's studio-promoted year one.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "r10": {"t": "R10", "k": "item", "d": "Fill reference seats 4 to 8 with the same agent template: a disclosed-AI creator on Fanvue, a Patreon 3D still artist, a Reddit-native grower, the itsmemphishxe reference.", "w": "_PRIVATE/BOLO-24-creator-cases-synthesis.md"}, "cam-line": {"t": "the cam line", "k": "item", "d": "The Lab-venture question: live cam access is Siswet's moat, and a rendered persona cannot stand in a live room. Board it as the difference between the two ORANGE plays, or rule it irrelevant.", "w": "oscar-mike/creator-cases.md"}, "ultra-dark": {"t": "ULTRA DARK", "k": "system", "d": "BOLO 27: the curation imprint under Ultrasin. A rating scale plus a written line on every post; commissioned edits as the first-dollar line. A funnel, never the asset.", "w": "oscar-mike/ultradark-walkthrough.md · _PRIVATE/ULTRADARK-*.md"}, "block-c": {"t": "Block C", "k": "item", "d": "The [[ultra-dark|ULTRA DARK]] walkthrough's third step: you mark 12 to 16 clips in [[stash|Stash]], say marked, the pull script fires, Resolve builds the 12-second blurb. Blocks A and B have been done since 9/4.", "w": "oscar-mike/ultradark-walkthrough.md"}, "stash": {"t": "Stash", "k": "system", "d": "The video library app on :9999. 15,492 scenes, 2,499 flagged as studio content, the UD pool of 2,111 five-stars. BOLO 28 made it the video twin of [[darkroom|DARKROOM]].", "w": "Q:\\fun\\.StashApp"}, "darkroom": {"t": "DARKROOM", "k": "system", "d": "The corpus browser on :8484. 55,841 girls-only images, verdicts, and since 9/9 the tag rail plus the TAGGING and CAPTCHA modules. Stamped 1.0 on 9/6, 1.1 on 9/9.", "w": "_PRIVATE/taxonomy_engine/"}, "bolo44": {"t": "BOLO 44", "k": "item", "d": "The tag rail and zero-shot tagging in [[darkroom|DARKROOM]]. Six axes, 48 values, 16,496 judged records. [[tier2|Tier 2]] probes now make the proposals.", "w": "BOLO.md #44 · oscar-mike/darkroom-tagging.md · DOPE SHEET 44 https://claude.ai/artifact/6uRCbniv1JNj5a4B6wFR6b"}, "tier2": {"t": "Tier 2", "k": "system", "d": "Per-axis logistic-regression probes trained on your CAPTCHA rulings. They beat zero-shot on all six axes (66 to 82 combined against 52 to 62). Retrain after each tagging session.", "w": "_PRIVATE/taxonomy_engine/probe_pass.py"}, "bolo43": {"t": "BOLO 43", "k": "item", "d": "[[l2b|L2b]] module 2: population signatures. Nine populations across the 27-cell gluteal substrate, the override construct for surgery, a three-line cell call. Seven decisions open in its §7.", "w": "_CANON_NODES/L2b-morphology-population-signatures.md"}, "l2b": {"t": "L2b MORPHOLOGY", "k": "system", "d": "The body-shape layer of the character system. Chain ruled 9/9: SKELETON → MUSCLE → FAT → CONDITION. Module 1 is gluteal (27 cells, 13 named types); module 2 is [[bolo43|population signatures]].", "w": "_CANON_NODES/L2b-morphology-gluteal.md"}, "telling-profile": {"t": "the Telling Profile", "k": "item", "d": "The Ten Questions of the Telling, answered for [[outliers|The Outliers]] as a [[series]]. Drafted 9/10 with 12 rulings queued. No human narrator; the Feed speaks, Tori sees.", "w": "_CANON_NODES/oxo-telling-profile.md"}, "series": {"t": "SERIES", "k": "ruling", "d": "Ruling R9 of 9/9: The Outliers is a series, not a feature and not prose. Recorded in the storyform frontmatter. It unblocked the first scene card and the first Fountain pages.", "w": "_CANON_NODES/oxo-storyform.md"}, "outliers": {"t": "The Outliers", "k": "system", "d": "OVEREXITOUT / The Outliers: the flagship BLACK IP. Storyform ruled 8/24, DCUS instanced 8/26, medium ruled [[series]] 9/9, first pages 9/10. Anna still has no node.", "w": "_CANON_NODES/ · OUTLIERS_FINAL_DRAFT/"}, "warroom": {"t": "WARROOM", "k": "system", "d": "The MCDP doctrine browser: MIL.01 to MIL.11 as a game encyclopedia on the [[ck3-rules|CK3 rules]]. Version 1.1 wears the [[watch-register|WATCH register]]. Name provisional; paused by you on 9/6.", "w": "MCDP-CODEX.html"}, "watch-register": {"t": "the WATCH register", "k": "system", "d": "One grammar, two faces keyed to room light: DAY paper for the lit desk, NIGHT near-black for the dark one. Seven hues, every ratio contrast-checked against the long-watch standards. WARROOM wears it; this page moved to the creator-cases colorway on 9/10 by your ruling.", "w": "_0.1_BVX_LEARN/_meta/WATCH-REGISTER.md"}, "ck3-rules": {"t": "the CK3 rules", "k": "system", "d": "Nineteen rules derived from Crusader Kings III's interface: concept links with nested tooltips capped at depth 3, timer or key lock, a character-sheet layout, an outliner plus an encyclopedia, one semantic color set. This page runs on them.", "w": "_0.1_BVX_LEARN/_meta/CK3-IA-STUDY.md"}, "bolo45": {"t": "BOLO 45", "k": "item", "d": "The creator-case sweep and the manager path. Ruled 9/10: [[natasha-teen|Natasha Teen]] is the referent; everything public unless you specify; the management recon ordered. Its three files never landed; relaunched this evening.", "w": "BOLO.md #45"}, "the-take": {"t": "THE TAKE", "k": "item", "d": "The placeholder name for the lessons block on each creator case. Ruled [[ttp|TTP]] on 9/10.", "w": "explainer page · BOLO 45", "st": "retired"}, "creator-case": {"t": "creator case", "k": "noun", "d": "One file about one creator: how they started, how they run it, how they get paid. Public record only, filed beside the [[register|performer register]]. Seven exist; two more are running.", "w": "_CANON_NODES/creator-case-*.md"}, "register": {"t": "the performer register", "k": "system", "d": "138 names, any sex, 21 in the stable core. Lanes: performer · e-girl · creator case · Stash name. Built 9/8 from nine of your lists; widened 9/9.", "w": "_CANON_NODES/performer-register.md"}, "nasa-girl": {"t": "the NASA girl", "k": "item", "d": "The performer you recalled by story (used to be an engineer, NASA, then did this). Two candidates were built on 9/10; you named her this evening: Rebel Rhyder. Her case is running; the candidates stay as receipts.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "natasha-teen": {"t": "Natasha Teen", "k": "person", "d": "Register row, lane P, starred by you 9/9. The referent for like Natasha Teen did; her case verifies whether she built an agency or roster.", "w": "_CANON_NODES/performer-register.md"}, "explainer": {"t": "the explainer register", "k": "ruling", "d": "The elementary landing-page voice you liked on 9/10: what we did last, what the plan was, what you did, in plain words. This board's right rail speaks it on every block.", "w": "https://claude.ai/code/artifact/68adc31f-f644-45de-881f-6d17a355021f"}, "modmigrate": {"t": "modmigrate", "k": "item", "d": "_tools/modmigrate/: the 9/7 Minecraft modpack migration (Modrinth Fabric 1.21.11 to NeoForge 1.21.11). Real work with no STATE row, no BOLO, no journal. Surfaced on three boards running.", "w": "_tools/modmigrate/"}, "bolo37": {"t": "BOLO 37", "k": "item", "d": "The proword selection loop: five candidates, pick three ranked, ten a day, Claude's sealed pick revealed after. Name bench MINT (rec). Three spec gaps; gap 3, placement, is answered by this page.", "w": "BOLO.md #37 · SOP.md §5"}, "bolo38": {"t": "BOLO 38", "k": "item", "d": "The sit rep as a front page, the CK3 save-load screen. Captured 9/6; fired 9/10 evening on your order; v0.5 on 9/10 night. Charlie Mike'd 9/11: OPORD retitle, the SOI published, both pages re-pointed. Its OPORD page carries the rest.", "w": "BOLO.md #38"}, "the-box": {"t": "the box", "k": "system", "d": "The machine's servers: [[stash|Stash]] on :9999 and [[darkroom|DARKROOM]] on :8484. Both up this evening, the first time at a board since 9/4.", "w": "localhost"}, "bolo29": {"t": "BOLO 29", "k": "item", "d": "The SFW TikTok channel: owned Fortnite skins doing the emotes, faceless, BLACK. Research banked; held on one question, the reward-versus-risk reading.", "w": "oscar-mike/bolo29-tiktok.md"}, "bolo35": {"t": "BOLO 35", "k": "item", "d": "The story timeline tool and its theory: sound synthesis against the conservatory score. Read delivered 9/6; four questions held.", "w": "oscar-mike/story-timeline.md"}, "bolo41": {"t": "BOLO 41", "k": "item", "d": "The locus system: research filed by neighborhood. Convention provisional in _0.1_BVX_LEARN/LOCI/; needs your ratification.", "w": "_0.1_BVX_LEARN/LOCI/README.md"}, "numbering": {"t": "the 03/03 numbering", "k": "item", "d": "Two domains share the 03 prefix: 03_SETTING_SYSTEMS (stood up 8/25) and the empty pre-reserved 03_PLOT_SYSTEMS. One rename either way.", "w": "ShroomsQ/_CANON/_SSOT/"}, "trash-land": {"t": "Trash Land", "k": "item", "d": "BOLO 30: the man-made trash DMZ between the southern and northern US, mountain-range scale. Seed node written 9/6; seven rulings open, name bench recommends The Midden.", "w": "_CANON_NODES/oxo-trash-land-seed.md"}, "main-effort": {"t": "the main effort", "k": "proword", "d": "MCDP 1's term: the one task everything else supports. Spoken, it names or asks for the single priority. Provisional since 8/21; the sit rep's Block VI rename rides on it. On this board it has been [[block-c|Block C]] plus [[d9|D-9]] since 9/4.", "w": "SOP.md §5", "st": "provisional"}, "smeac": {"t": "the five-paragraph order", "k": "noun", "d": "The Marine Corps operations order: Situation · Mission · Execution · Administration and Logistics · Command and Signal. Mission first, then how. A BOLO status page is written in this shape.", "w": "MIL.05 · MCDP 5 Planning"}, "speed": {"t": "speed", "k": "ruling", "d": "MCDP 1: speed over time is tempo, and tempo is itself a weapon. On a page: read in ten seconds, the order on top, the story underneath. One of the three that govern the status page, with [[focus]] and [[boldness]].", "w": "MIL.01 §4 · invariant 8"}, "focus": {"t": "focus", "k": "ruling", "d": "MCDP 1: the convergence of effects at the decisive time and place, which demands strict economy everywhere else. On a page: one [[main-effort|main effort]] named, everything else supporting it and kept short.", "w": "MIL.01 §4 · invariant 8"}, "boldness": {"t": "boldness", "k": "ruling", "d": "MCDP 1: unhesitating exploitation of uncertainty to pursue major rather than marginal results; do not strive for certainty before you act. On a page: every call carries a default that runs if you say nothing.", "w": "MIL.01 §4 · quotes"}, "commanders-intent": {"t": "commander's intent", "k": "ruling", "d": "The purpose behind a task, stated as task plus in order to. The why outlasts the what, so a subordinate can act without asking. The Mission paragraph of every status page carries it.", "w": "MIL.01 §8"}, "mission-tactics": {"t": "mission tactics", "k": "ruling", "d": "Assign the task and the intent, leave the method to the one doing it, intervene only by exception. It is why a status page states defaults instead of asking questions.", "w": "MIL.01 §8"}, "ofm": {"t": "OFM agency", "k": "noun", "d": "The fansite-era management agency: an operations vendor running messages, traffic and posting on the creator's own account for 20 to 50 percent or more. A different business from the licensed booking agent of the studio era (10 to 15 percent).", "w": "_CANON_NODES/creator-management-recon.md §0"}, "ash": {"t": "A.S.H.", "k": "item", "d": "Riley Reid's creator-first agency, launched April 2021 because friends were paying up to 30 percent. The verified item behind the recon's creator-first list; the earlier Clubhouse Media Group line was a conflation and is corrected.", "w": "_CANON_NODES/creator-management-recon.md"}, "fla-468": {"t": "Florida ch. 468", "k": "item", "d": "Florida's talent-agency licensing statute: anyone who, for compensation, procures engagements for an artist, and artist includes a model. Running a creator's own account is not obviously procuring; booking that creator into a shoot or brand deal plainly is. An attorney question the moment a second human is booked.", "w": "_CANON_NODES/creator-management-recon.md §0"}, "management-recon": {"t": "the management recon", "k": "item", "d": "The sourced read on the manager path, 171 URLs: two businesses share the word agency; Fanvue is the only platform with a real agency structure; creator-first is the documented origin of the lane; reputation, not capital, is the barrier.", "w": "_CANON_NODES/creator-management-recon.md"}, "management-voices": {"t": "the management voices", "k": "item", "d": "Twenty-two first-person accounts of people who became managers, agency owners or house-builders. Nobody credible started with a roster; they started with one relationship. The commission number is the ethics map. Account control is the line.", "w": "_CANON_NODES/creator-management-voices.md"}, "bolo42": {"t": "BOLO 42", "k": "item", "d": "The admired-performers table, delivered 9/8 as the [[register|performer register]]; widened 9/9 to any sex; the creator-case nodes link from its rows.", "w": "BOLO.md #42"}, "rebel-rhyder": {"t": "Rebel Rhyder", "k": "person", "d": "The [[nasa-girl|NASA girl]], named by you 9/10 evening. Her case landed the same night: an electrical engineer who worked in aerospace for two years, in her own words; NASA is Rocco Siffredi's word only. Register row added, lane P, source S.", "w": "_CANON_NODES/creator-case-rebel-rhyder.md"}, "challenge": {"t": "the challenge phrase", "k": "proword", "st": "ruled", "d": "The formal challenge, spoken as written in STATE.md's header. The countersign follows, first line, exact, then the board. The ritual is never explained.", "w": "STATE.md header · SOP.md §1"}, "out-block": {"t": "the OUT block", "k": "proword", "st": "ruled", "d": "Every reply that executes an [[oscar-mike|Oscar Mike]] or an [[endex|ENDEX]] closes with the fenced end-of-transmission block and nothing after it: OSCAR MIKE · OUT · OUT · OUT. A visible seam between what was parked and what starts next. Coded 9/6 on your order.", "w": "SOP.md §7 rule 9"}, "status-on-bolo": {"t": "status on BOLO N", "k": "proword", "st": "ruled", "d": "The plain-speech form of [[opord|OPORD N]]: \"give me the status on BOLO 45\" shows that BOLO's page. Dictation garble \"Frango\" reads as FRAGO, which is the update, not the page.", "w": "SOP.md §1 · §8"}, "recon": {"t": "recon", "k": "proword", "st": "benched", "d": "Benched 9/6: the [[boresight]] protocol aimed outside the wire (web and literature) instead of at the vault. \"Napkin recon\" would be the one-pass form. Waits in the [[bolo37|selection loop]].", "w": "SOP.md §5"}, "napkin": {"t": "napkin", "k": "proword", "st": "benched", "d": "Benched 9/6 as a modifier: back-of-the-napkin, one pass, rough numbers, no question loop. Spoken as a prefix: \"napkin boresight\", \"napkin recon\".", "w": "SOP.md §5"}, "syllabus": {"t": "syllabus", "k": "proword", "st": "benched", "d": "Benched 9/6: \"pull the syllabus on X\" = the tier-one 101 textbooks of a field, [[ivory-tower|ivory tower]], one per field to start.", "w": "SOP.md §5"}, "distill": {"t": "distill", "k": "proword", "st": "benched", "d": "Benched 9/6: make the BVX-LEARN one-sheet. The doctrine's own word: distill, don't summarize.", "w": "SOP.md §5"}, "grammar": {"t": "grammar", "k": "proword", "st": "benched", "d": "Benched 9/6: \"write the grammar\" = derive a system's operating language from its sources.", "w": "SOP.md §5"}, "mint": {"t": "MINT", "k": "proword", "st": "benched", "d": "Recommended name for the proword selection loop ([[bolo37|BOLO 37]]): where the lexicon gets struck, beside DARKROOM and WARROOM. Bench: BREVITY · SOI · CALLSIGN · LEXICON. Your ruling.", "w": "BOLO.md #37 · SOP.md §5"}, "readyroom": {"t": "READYROOM", "k": "proword", "st": "benched", "d": "Recommended name for the sit rep front page program: the Navy's briefing room, sibling of DARKROOM and WARROOM. Bench: OPSROOM · FRONTPAGE · THE BOARD. Your ruling.", "w": "BOLO.md #38"}, "ttp": {"t": "TTP", "k": "item", "d": "Tactics, Techniques and Procedures. Section 10 of every [[creator-case|creator case]]: the one mechanic worth studying, three to five transferable tips, what does not transfer, and which venture it feeds. Named by Chief 9/10 from the Corps bench (GOUGE was the provisional header); struck alternatives THE TAKE, LESSONS LEARNED, HOT WASH.", "w": "SOP.md §5 · _CANON_NODES/creator-case-*.md §10", "st": "ruled"}, "rtb": {"t": "RTB", "k": "proword", "d": "Romeo Tango Bravo, return to base. The parked work goes home: every keeper in oscar-mike/ is promoted to its real file, the rest deleted, the folder cleared. Chief's own coinage 9/10; replaces the retired [[sweep|sweep]]. Third movement of the park trio with [[oscar-mike|Oscar Mike]] and [[charlie-mike|Charlie Mike]]. 9/11: one meaning only — the pass that sends a parked card home and clears it; retires itself when oscar-mike/ is empty. The end of the sortie is Oscar Mike.", "w": "SOP.md §1", "st": "ruled"}, "charlie-mike": {"t": "Charlie Mike", "k": "proword", "d": "Continue mission. Resume a parked card: open it, one line on where it stood, pick up at its resume order, no re-derivation. Ruled 9/10. The park trio is Oscar Mike (park), Charlie Mike (resume), [[rtb|RTB]] (return to base).", "w": "SOP.md §1", "st": "ruled"}, "gouge": {"t": "GOUGE", "k": "item", "d": "Navy and Marine slang for the essential distilled information. Recommended 9/10 as the name for the creator-case lessons block and used as its provisional header for a few hours; Chief ruled [[ttp|TTP]] instead. Bench only.", "w": "SOP.md §5", "st": "retired"}, "frago": {"t": "FRAGO", "k": "proword", "st": "ruled", "d": "Fragmentary order: the UPDATE pushed onto a BOLO's standing page, never the page itself — Chief's clarification 9/10 late (\"FRAGO is just the update after we've made the BOLO status page\"). \"FRAGO 45\" folds what changed since the last build into [[opord|OPORD 45]] and republishes; only what changed, everything not mentioned stands as ordered; the page's Log keeps every FRAGO.", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "opord": {"t": "OPORD (retired)", "k": "proword", "st": "retired", "d": "Retired 9/11 after twelve hours (\"there has to be a better name than that, something much cooler\"). The thing it named is the [[dope-sheet|DOPE SHEET]].", "w": "SOP.md §5"}, "bolo46": {"t": "BOLO 46", "k": "item", "d": "The OXO series follow-through: the [[telling-profile|Telling Profile]]'s 12 rulings · Anna's node · the pilot's page one. Captured 9/11 at priority one on Chief's word; it had no BOLO before.", "w": "BOLO.
