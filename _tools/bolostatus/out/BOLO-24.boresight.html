md #46"}, "dope-sheet": {"t": "DOPE SHEET", "k": "proword", "st": "ruled", "d": "The standing status page for one BOLO — the [[smeac|five-paragraph order]] with the next action on top, plus the log; changed by [[frago|FRAGOs]]. RULED 9/11: header \"DOPE SHEET N\"; spoken \"give me the dope on N\", \"status report on N\", \"the situation on N\" all read the same. From the Scout Sniper's DOPE book: Data On Previous Engagements, everything known on the target and every prior engagement in one book. Replaced OPORD (retired the same morning).", "w": "SOP.md §0–1 · _tools/bolostatus/"}, "bolo47": {"t": "BOLO 47", "k": "item", "d": "The dashboard consult: eight ranked ideas from current Claude Code / VS Code operator boards for the [[sitrep|sit rep]] page. Captured 9/11; none taken yet.", "w": "BOLO.md #47"}, "bolo48": {"t": "BOLO 48", "k": "item", "d": "The name bench: every unruled word with its bench on one sheet. Ruled 9/11: DOPE SHEET · ADORNED · ABORT (the cancel word) · BREVITY (what the SOI holds) · HOTLINE / HOTLINE ACTUAL (the operator's callsign). Closed 9/11: the close-out is Oscar Mike, ENDEX retired. Open: READYROOM · MINT. Pool: \"caught up\" · INTEL.", "w": "BOLO.md #48 · SOP §5"}, "bolo49": {"t": "BOLO 49", "k": "item", "d": "The Massive presets: the best free banks for Native Instruments Massive, verified 9/11; the shortlist is on its sheet.", "w": "BOLO.md #49"}, "eink": {"t": "E-INK", "k": "ruling", "st": "provisional", "d": "The light face of every internal page, provisional 9/11: Kindle-gray paper (#D8D8D2 ground, #E4E4DE surface), never white — \"like an old Kindle… digital ink.\" Shown only when a viewer forces light; DARK is the only theme and the toggle is gone.", "w": "SOP.md §2 · the three templates"}, "adorned": {"t": "ADORNED", "k": "ruling", "st": "ruled", "d": "DARKROOM dress-state value, RULED 9/11 (\"let's do adorned\"): naked except for an accessory — socks, heels, jewelry, glasses, a hat, a harness; the r/WhyWearAnythingAtAll read. Replaced implied (retired 9/11: no garment and nothing shown). Vocab edited, zero-shot rerun, probes retrained the same morning; 42 old human confirmations still say implied and are left as Chief's record.", "w": "_PRIVATE/taxonomy_engine/vocab.json · BOLO 44"}, "actual": {"t": "ACTUAL", "k": "proword", "st": "ruled", "d": "The suffix for the commander in person on the net (\"Six Actual\"). RULED 9/11 as the formal form of the operator's callsign: [[hotline|HOTLINE ACTUAL]]. Never alone.", "w": "SOP.md §5"}, "bolo50": {"t": "BOLO 50", "k": "item", "d": "The standards campaign: every level of the operation as a standards organization; a networked library of outside and Command-made standards. Research phase: the harvest banked as a locus, the register pulled by agent. Opened 9/11 on a break-break.", "w": "BOLO.md #50 · _0.1_BVX_LEARN/LOCI/standards.locus.md"}, "abort": {"t": "ABORT", "k": "proword", "st": "ruled", "d": "The cancel word, RULED 9/11: \"abort abort abort\" spoken three times, then the correction. Cancels the immediately preceding order; the record keeps the abort line, not the order. Aircrew and JTAC lineage: the call not to release. First live use the same minute: \"abort abort abort the index process\" (the ENDEX). Replaced belay.", "w": "SOP.md §0–1 · §5"}, "brevity": {"t": "BREVITY", "k": "noun", "st": "ruled", "d": "What the [[soi|SOI]] holds, RULED 9/11 (\"I do like brevity better\"): the Command's word list, after the Multi-Service Brevity Codes, the list that makes radio short. The SOI's subtitle on every page. Replaced \"the lexicon\" (provisional) and \"the house tongue\" (retired). BREVITY leaves MINT's bench; MINT stands for the loop.", "w": "SOP.md §0 · §6 · the SOI page"}, "hotline": {"t": "HOTLINE", "k": "proword", "st": "ruled", "d": "The operator's callsign, RULED 9/11. Casual: \"Hotline\", \"word from Hotline\". On the net and on every page: **HOTLINE ACTUAL**. The point: the word comes from on high, detached from the person, the way CENTCOM ACTUAL speaks for the command, not for a man (\"remove the artist from the art\"). Replaces \"you\" on the explainer rail.", "w": "SOP.md §0–1 · §5 · const WHO in the templates"}, "bolo51": {"t": "BOLO 51", "k": "item", "d": "The logistics front: one standing audit, quality, and improvement function over every system in daily use, plus the token offload onto hooks, skills, subagents, routines, and the design canvas. Standards pulled from BOLO 50's register. Opened 9/12.", "w": "BOLO.md #51 · DOPE SHEET 51"}, "proword": {"t": "proword", "k": "noun", "st": "ruled", "d": "Procedure word. Radiotelephony's fixed words that stand for a whole instruction: ROGER, WILCO, OUT, SAY AGAIN. NATO's book for them is ACP 125. The Command's prowords are the same idea aimed at the protocol: say one and the procedure fires.", "w": "SOP.md §0–1 · ACP 125"}, "gear": {"t": "gear N", "k": "proword", "st": "provisional", "d": "The agent ceiling for the current task, spoken as a number. Gear 1 = 3 agents (the default; silence means gear 1) · 2 = 6 · 3 = 9 · 4 = 12 · 5 = 15, never used: the ceiling exists to be named. A shift lasts one task, then back to gear 1. At every gear, fetch-and-extract agents run haiku, write-ups sonnet, fable on the main line only. Working name (Chief 9/12: \"let's just call them gears for now\"); warps and DEFCON aborted in the same breath. Part of [[gearbox|the gearbox]].", "w": "SOP.md §1 · §5 · BOLO 52"}, "gearbox": {"t": "the gearbox", "k": "system", "st": "provisional", "d": "The sustainable-speed system, opened 9/12 as BOLO 52: the [[gear|gears]] (the agent ceiling), the gauge (_tools/usage/, weighted tokens per day from the local transcripts), and the weekly budget the week must fit. Lineage: the 9/10 sixteen-agent run spent half a week in one session. Never sixteen again.", "w": "_tools/usage/ · BOLO 52 · SOP.md §1"}, "bolo52": {"t": "BOLO 52", "k": "item", "d": "The gearbox: the sustainable-speed system. Gears 1–5 as the agent ceiling, the gauge, the weekly budget. Spun out of BOLO 51 on 9/12; name provisional.", "w": "BOLO.md #52"}, "bolo53": {"t": "BOLO 53", "k": "item", "d": "The Command's own development standard: the boresight → how-copy → build → FRAGO → Oscar Mike loop read as an iterative-incremental life cycle, filed beside the project flow. Tabled 9/12; OPENED 9/15 by Chief's \"Open 53\"; v0.1 working draft on disk.", "w": "BOLO.md #53 · DOPE SHEET 53 · ShroomsQ/_CANON/_SSOT/05_OPERATIONS/📐 ssot_05_operations_development_standard.md"}, "bolo54": {"t": "BOLO 54", "k": "item", "d": "The sit rep formation: orchestrator, independent specialists, one reviewer at the fan-in. Chief's doctrine 9/12 (Amdahl · Brooks · context is the cost unit · review at the merge). Built the same turn: prep.py · assemble.py · the sitrep skill. The main line's read drops from ~211 KB to ~3 KB.", "w": "BOLO.md #54 · DOPE SHEET 54 · .claude/skills/sitrep/"}, "formation": {"t": "the formation", "k": "system", "st": "provisional", "d": "How agents are laid out on any multi-agent job (BOLO 54, 9/12): hub and spoke. The main line decomposes into pieces that share no state; specialists run independently on disjoint inputs; they sync only at named handoff points; one reviewer, a script where it can be, sits at the fan-in. No peer cross-checks. Rides the [[gearbox|gearbox]]: the gear says how many, the formation says how they stand.", "w": "SOP.md §1 (the gear row) · BOLO 54"}, "bolo55": {"t": "BOLO 55", "k": "item", "d": "The DOPE SHEET format — the document layout. Captured 9/16 and RULED the same day (Chief: \"one page · keep the rail, keep it\"): one page, the explainer rail kept, the five-paragraph order with the order on top, the mantra, the log. Every sheet since builds to it.", "w": "BOLO.md #55 · DOPE SHEET 55"}, "command": {"t": "the Command", "k": "noun", "st": "ruled", "d": "The whole operation under HOTLINE ACTUAL: BLACK, ORANGE and OPERATOR together. RULED 2026-09-16 (\"let's go with command\") from a bench of ten on BOLO 48; \"the house\" is retired as the word. Marine usage: the authority a unit answers to. Command standard, the Command's ladder, Command-native; \"organic\" replaces in-house.", "w": "SOP.md §2 · §5 · BOLO 48"}, "bolo18": {"t": "BOLO 18", "k": "item", "d": "The two-stage spine sweep: every source in the Zotero library keyed to the story spine's shelves, then distilled shelf by shelf into the plot, setting and character models. Reopened 9/16 as the gate on all story-side work; the full pass keyed all 1,031 items the same night.", "w": "BOLO.md #18 · _tools/zotero/README.md · DOPE SHEET 18 https://claude.ai/artifact/CRVaYBt5GBFp7inyXYG3C5"}, "bolo25": {"t": "BOLO 25", "k": "item", "d": "The standard project. Watchlist row 25 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #25"}, "bolo31": {"t": "BOLO 31", "k": "item", "d": "MIL.01 read. Watchlist row 31 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #31"}, "bolo32": {"t": "BOLO 32", "k": "item", "d": "The markdown marking SOP. Watchlist row 32 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #32"}, "bolo33": {"t": "BOLO 33", "k": "item", "d": "The MCDP browser. Watchlist row 33 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #33"}, "bolo39": {"t": "BOLO 39", "k": "item", "d": "Food preservation. Watchlist row 39 in BOLO.md; the row carries its status and its resume order.", "w": "BOLO.md #39"}, "bolo57": {"t": "BOLO 57", "k": "item", "d": "Voice work as income: Chief can already build voices in ElevenLabs, so it is a fourth candidate venture beside 24 · 27 · 29. Four paths named, none costed. Held until a boresight prices it.", "w": "https://claude.ai/artifact/19rjZFkarB1QvEYK1vubdo"}, "bolo56": {"t": "BOLO 56", "k": "item", "d": "JUDY — the voice loop. Ears (BOLO 26), brain (keyword router, ruled 9/17), mouth (ElevenLabs, Blondie ruled 9/17), face and console all built. The wire — an MCP server exposing brain.py's tools to the VS Code session — is ruled and not yet built.", "w": "https://claude.ai/artifact/Ckg6W4JrNo8JvLR55ZW5Ea"}, "crew-grades": {"t": "crew grades", "k": "ruling", "st": "provisional", "d": "The seats in [[formation|the formation]] are named by NASA shuttle crew grade. RULED 2026-09-16 (\"I like specialist, mission specialist… go CDR\"; bench: NASA crew grades (rec) · Marine fire team · Mission Control consoles). The grade says what kind of work a seat does, never which model sits in it: [[cdr|CDR]] · [[ms|MS]] · [[ps|PS]] · [[range|RANGE]]. Gear 1 = one MS + two PS under the CDR. \"Sonnet specialist\" and \"haiku specialist\" retired. Provisional until it survives a week.", "w": "SOP.md §6 · BOLO 54"}, "cdr": {"t": "CDR", "k": "noun", "st": "provisional", "d": "Commander. The main line in [[formation|the formation]]: decomposes the job, rules, writes the header and the order. Fable sits there today. One of the [[crew-grades|crew grades]], RULED 2026-09-16.", "w": "SOP.md §6"}, "ms": {"t": "MS", "k": "noun", "st": "provisional", "d": "Mission Specialist. The writer seat in [[formation|the formation]]: the crew member who does the mission's work, drafts the sheet, writes the register. Sonnet sits there today. Usage: \"an MS drafts the sheet.\" One of the [[crew-grades|crew grades]].", "w": "SOP.md §6"}, "ps": {"t": "PS", "k": "noun", "st": "provisional", "d": "Payload Specialist. The fetcher seat in [[formation|the formation]]: flown for one payload, one narrow task, such as pulling links or extracting a batch. Haiku sits there today. Usage: \"two PS pull the links.\" One of the [[crew-grades|crew grades]].", "w": "SOP.md §6"}, "range": {"t": "RANGE", "k": "noun", "st": "provisional", "d": "The range safety officer: the script reviewer at the fan-in of [[formation|the formation]]. Holds the abort, never flies. A script wherever it can be, never a checker agent. Usage: \"RANGE stopped the run.\" One of the [[crew-grades|crew grades]].", "w": "SOP.md §6 · BOLO 54"}, "tm": {"t": "TM", "k": "noun", "st": "ruled", "d": "Technical Manual. The page type for a system document, RULED 2026-09-16 (\"TM go\"; bench TM (rec) · FM · SCHEMATIC), beside the SITREP (the board), the [[dope-sheet|DOPE SHEET]] (a BOLO's status) and the [[soi|SOI]] (the book). TM 04 = the plot system · TM 03 = the setting system · TM 02 = the character system, each built by _tools/tm/build.py from its SSOT markdown. Every TM carries the [[ck3-rules|CK3 hover layer]]; a section with no hover terms is a blocking finding.", "w": "SOP.md §6 · _tools/tm/"}, "organic": {"t": "organic", "k": "noun", "st": "ruled", "d": "The Command's word for what it builds and runs itself, RULED 2026-09-16 with [[command|the Command]]: \"organic\" replaces in-house. Military usage: organic assets are the ones a unit owns outright rather than borrows. An organic tool is one written here; an organic voice is one that runs on [[the-box|the box]].", "w": "SOP.md §6"}, "the-house": {"t": "the house (retired)", "k": "noun", "st": "retired", "d": "Retired 2026-09-16 for [[command|the Command]]. Was: the whole operation, and by extension house format, house tongue, in-house. Say the Command, Command format, [[organic]].", "w": "SOP.md §6"}, "judy": {"t": "JUDY", "k": "system", "st": "ruled", "d": "The voice loop, [[bolo56|BOLO 56]]: Chief talks, she listens, she answers out loud. Name RULED 2026-09-16, spelled J-U-D-Y, superseding the provisional THE HANDLER. Persona TARS (affable, informative, bratty); voice the 007 handler register, Blondie on ElevenLabs ruled 9/17; face on the desktop as PNG state swaps. Ears local on the 3090 ([[bolo26|BOLO 26]]), brain the keyword router (ruled 9/17), the wire an MCP server to the VS Code session (ruled, unbuilt). Lives in _tools/dictation/.", "w": "BOLO.md row 56 · DOPE SHEET 56"}, "go": {"t": "go N", "k": "proword", "st": "ruled", "d": "The phase go-word on a [[dope-sheet|DOPE SHEET]]: \"go 6\" fires phase 6 of the sheet's execution paragraph, nothing more. Coded 9/15 (dictation: \"goes to ex 6\"). RULED 2026-09-16 the hard way: \"go\" is the order, not the build-out. Chief said \"slice go,\" the whole pipeline stood up and six evenings got assigned, and he called it \"a little bit too far.\" Deliver the sheet's order, then wait for the next word.", "w": "SOP.md §8 · BOLO 55"}, "ladder": {"t": "the Command's ladder", "k": "ruling", "st": "ruled", "d": "The standards ladder from BOLO 50, RULED 2026-09-15: the NASA four rungs, policy → procedural requirement → standard → handbook, with spec as a tag on nodes. Every Command document carries its rung in the frontmatter (SOP.md sits on procedure). Each world's standards body is canon in its own right.", "w": "BOLO.md row 50 · _0.1_BVX_LEARN"}, "digest": {"t": "the session-open digest", "k": "system", "st": "provisional", "d": "What a session reads instead of the five files: the hook prints the Ready Rack, the blocked rows, the newest BOLOs, PMCS red, the box and the tree at open (SOP §4 under [[formation|the formation]], BOLO 54). The five are still read every sit rep, by the specialists and the prep script; the [[cdr|CDR]] reads the digest.", "w": "SOP.md §4 · _tools/sitrep/digest.py"}, "bolo26": {"t": "BOLO 26", "k": "item", "st": "ruled", "d": "Dictation with a custom dictionary: the whisper fix. Route RULED BUILD 9/16 and shipped the same session as _tools/dictation/ (faster-whisper on the 3090, the Command lexicon as initial prompt, SOP section 8 repair). Now the listening half of [[judy|JUDY]].", "w": "https://claude.ai/code/artifact/c5ece55b-4c2b-49e1-bc94-31bce8477ec9"}, "chief": {"t": "Chief", "k": "person", "st": "ruled", "d": "The operator's address, RULED 9/17 (\"across the board, change it everywhere, Chief, C-H-I-E-F\"). Replaces Papi in every live document, page, tool and memory; the frozen archives keep the old word as record. On the net and on the pages the callsign is still [[hotline|HOTLINE ACTUAL]]; in chat and in the record, Chief.", "w": "SOP.md §5 · §8"}, "launch-sequence": {"t": "the launch sequence", "k": "system", "st": "ruled", "d": "What [[go-for-launch|go for launch]] fires (BOLO 58, built 9/17): a zero-token script brings the DARKROOM and [[judy|JUDY]] up, probes the wire, opens the board and the [[soi|SOI]]; then the [[sitrep|sit rep]] runs in the formation; the reply carries the station poll. Stations RULED 9/17 by Chief: the board · the SOI · zero DOPE SHEETs · the DARKROOM · JUDY · the seven tools. The name RULED 9/17: \"just launch sequence\".", "w": "_tools/launch/launch.py · .claude/skills/launch/ · BOLO.md row 58"}, "go-for-launch": {"t": "go for launch", "k": "proword", "st": "ruled", "d": "The word that fires [[launch-sequence|the launch sequence]], RULED 9/17 over a bench of ten (five Marine, five NASA). Lineage: the flight director's go/no-go poll, every console answering go. Garbles: go for log · go for lunch. Never [[go|go N]], which is a phase go-word on a DOPE SHEET.", "w": "SOP.md §0–1 · §5 · §8 · .claude/skills/launch/"}, "good-traffic": {"t": "good traffic, stand by", "k": "proword", "st": "ruled", "d": "One of [[judy|JUDY]]'s two acknowledgments, RULED 9/17: your transmission came through clean, wait for the reply. The other is \"Copy.\" She says nothing else to confirm receipt.", "w": "SOP.md §5 · _tools/dictation/reader.py"}, "lock-in": {"t": "JUDY, lock in", "k": "proword", "st": "ruled", "d": "Switches [[judy|JUDY]] to the military-comms attitude, RULED 9/17: radiotelephone register, prowords, no jokes, brat 0, nine sentences at most. Preset key strac. Bench it beat: STRAC · BY THE BOOK · CONDITION ONE · NOMINAL.", "w": "SOP.md §1 · §5 · _tools/dictation/presets.py"}, "fries-in-the-bag": {"t": "JUDY, put the fries in the bag", "k": "proword", "st": "ruled", "d": "Switches [[judy|JUDY]] to the comfortable-day attitude, RULED 9/17: warm, dry, a light flirt, the information first; brat 45. The standing default. Preset key at-ease. Bench it beat: AT EASE · REST · CRUISE. Garble: \"put the fries in the best\".", "w": "SOP.md §1 · §5 · _tools/dictation/presets.py"}, "goon-time": {"t": "JUDY, it's goon time", "k": "proword", "st": "ruled", "d": "Switches [[judy|JUDY]] to the full-brat attitude, RULED 9/17: teasing, knowing, innuendo allowed, facts intact; brat 100, sixteen sentences. Preset key liberty. Bench it beat: LIBERTY CALL · ZERO-G · OFF THE LEASH.", "w": "SOP.md §1 · §5 · _tools/dictation/presets.py"}, "volcano": {"t": "the volcano", "k": "ruling", "st": "provisional", "d": "Chief's image for BOLO 24's edge (9/17): be the unexpected and immediately a contender while everyone else climbs ladders. The boresight priced it as a mechanism, not a wish: [[character-moat|character as moat]], [[motion-lane|motion as fuse]], a [[category-sentence|press-ready sentence]] as the attached audience, and a [[thirty-day-test|thirty-day test]] before a library is banked.", "w": "_PRIVATE/_boresight-24/market-demand.md §5 · BORESIGHT 24"}, "volcano-sequence": {"t": "the Volcano Sequence", "k": "system", "st": "provisional", "d": "The fused method for BOLO 24 (method brief, 9/17): NASA's reviews and [[conops|ConOps]], the Marines' [[mcpp|problem framing and war game]], the Double Diamond and Jobs-to-be-Done for the audience, and category design's [[lightning-strike|Lightning Strike]] for the splash. Five phases slotted into M-002 to M-005 without renaming them; each closed by a review the charter did not have (MCR · SDR/PDR · CDR/SIR/ORR · FRR · Gate 4).", "w": "_PRIVATE/_boresight-24/method.md §5"}, "conops": {"t": "ConOps", "k": "noun", "st": "ruled", "d": "Concept of operations, NASA systems engineering: walk the whole system end to end from the user's seat before building it, including the off-nominal scenarios. For BOLO 24: a follower's first thirty seconds, a subscriber's first paid week, a platform trust-and-safety review, a month where the conservative gate is missed twice. The missing design-research artifact the method brief named.", "w": "_PRIVATE/_boresight-24/method.md §2 · NASA SEH"}, "mcpp": {"t": "MCPP", "k": "noun", "st": "ruled", "d": "The Marine Corps Planning Process: problem framing → course-of-action development → COA war game → COA comparison and decision → orders development → transition. Problem framing is design research by another name; the war game is the pre-launch simulation BOLO 24 never had: play the launch three moves out against the algorithm, the platform and a rival account before a resource commits.", "w": "_PRIVATE/_boresight-24/method.md §3 · MCWP 5-10"}, "lightning-strike": {"t": "Lightning Strike", "k": "noun", "st": "ruled", "d": "Play Bigger's category-design launch: a category announcement compressed into a short window to generate maximum attention, then repeated on a three-to-six-month cadence. The closest documented pattern to [[volcano|the volcano]]. For BOLO 24 it is workstream W8, the splash: one [[category-sentence|sentence]], one asset built to carry it, the day-one sequence, cleared by its own FRR.", "w": "_PRIVATE/_boresight-24/method.md §4 · playbigger.com"}, "trl": {"t": "TRL", "k": "noun", "st": "ruled", "d": "Technology Readiness Level, NASA's maturity ladder from 1 (principles observed) to 9 (flight proven). The boresight's read: the render chain and the rig sit at 6–7 (demonstrated once, S4-01); the discovery engine sits at 3–4 (an analytical case, nothing demonstrated on a real audience). Raising the low one is what the [[thirty-day-test|thirty-day test]] is for.", "w": "_PRIVATE/_boresight-24/method.md §2"}, "thirty-day-test": {"t": "the thirty-day test", "k": "ruling", "st": "provisional", "d": "R9 from the creator-cases synthesis, dated by the boresight: the slice plus the first loop posted to X and Bluesky 10/1–10/31 under the disclosed frame, thresholds written before the first post. Follower growth at or above about 1,300 a month (the Variety Itsol rate) reads [[volcano|volcano]], bank forty; about 470 (the Kirenes rate) reads ladder, bank twenty; under 250 reads replan the positioning before November. Call D-15.", "w": "BORESIGHT 24 · D-15 · _PRIVATE/_boresight-24/facts.md §7"}, "motion-lane": {"t": "the motion lane", "k": "ruling", "st": "provisional", "d": "Call D-12: add short loops (five to fifteen seconds) as the viral unit beside the stills. The evidence: every documented fast breakout shipped motion; the best stills-only page found caps near a thousand a month after four years; the top of the lane (RadRoachHD 41,500 a month, wildeer 15,400) is animators and game devs. The pipeline renders a frame in thirty seconds, so a five-second loop is about an hour of GPU time.", "w": "BORESIGHT 24 · D-12 · _PRIVATE/_boresight-24/market-supply.md §1–2"}, "character-moat": {"t": "character as moat", "k": "ruling", "st": "provisional", "d": "The boresight's read of MCDP 1's center of gravity for BOLO 24: the character bible (Remi's wound, register and arc) is the one thing the cautionary cases lack and competitors cannot copy quickly. It is the moat, not the fuse: it keeps an audience, it does not fetch one. The fuse is [[motion-lane|motion]] and a [[category-sentence|sentence]].", "w": "BORESIGHT 24 · _PRIVATE/_boresight-24/method.md §3"}, "category-sentence": {"t": "the category sentence", "k": "ruling", "st": "provisional", "d": "Call D-16: the one sentence the whole launch carries, the [[lightning-strike|Lightning Strike]]'s point of view. Aitana Lopez's mechanism was a press-ready sentence ('the first AI model earning real money'), not a render. The studio's placeholder: 'a studio signed a girl who does not exist, and she is the only one in the lane with a life.' Chief words the real one.", "w": "BORESIGHT 24 · D-16"}, "processor-risk": {"t": "processor risk", "k": "noun", "st": "ruled", "d": "Every adult platform sits downstream of the same card networks. Gumroad banned NSFW in March 2024 (Stripe/PayPal); in July 2025 Collective Shout pressured the processors and Steam retired a theme-based set of games (incest, non-consent, torture — not AI-specific, and adult games broadly still sell there) while itch.io lost paid adult entirely (free adult re-indexed within days); Civitai lost card processing in May 2025 and went to crypto. The chokepoint is the moment a platform is classified as existing to sell explicit content. Calls D-13 and D-18.", "w": "_PRIVATE/_boresight-24/market-supply.md §3"}, "fanvue": {"t": "Fanvue", "k": "noun", "st": "ruled", "d": "The platform positioning itself as home for disclosed AI and CGI personas doing adult or near-adult content; ran the first 'AI Personality of the Year' award with OpenArt in June 2026 (won by Soraya Thorne). Evidence that the disclosed-persona lane has an institution to break into on purpose. The boresight recommends a Fanvue test beside Patreon, SubscribeStar Adult and Fansly (D-13).", "w": "_PRIVATE/_boresight-24/market-demand.md §3, §5"}, "aitana": {"t": "Aitana Lopez", "k": "item", "st": "ruled", "d": "The Barcelona agency's disclosed CGI influencer (debuted late 2023): about ten thousand a month in brand deals before two hundred thousand followers, now near 360 thousand. The mechanism the boresight names as Remi's honest path: a small team, a maintained life, and a press-ready sentence the media amplified for free. SFW, and the adult CGI-persona lane is copying it.", "w": "_PRIVATE/_boresight-24/market-demand.md §3, §5"}, "stills-ceiling": {"t": "the stills ceiling", "k": "noun", "st": "ruled", "d": "What a stills-only 3D page earns, observed 9/17 on Graphtreon: the best found (Mr. Vargas) near a thousand a month on 177 patrons after four years and a studio apprenticeship; Dreamrider3D at 31 dollars a month after six years; platform-wide 98 percent of Patreon creators never clear a thousand a month. Animation or a game wrapper is what pushes past it.", "w": "_PRIVATE/_boresight-24/market-supply.md §2"}, "the-ai-shock": {"t": "the AI shock", "k": "noun", "st": "ruled", "d": "What generative AI did to hand-rendered 3D by 2026: it split the lane instead of killing it. Civitai lost card processing (May 2025); 'slop' was Merriam-Webster's 2025 word of the year; the counter-trend is a human-made premium. The policy line everywhere is stylized versus photoreal-of-a-real-person, not AI versus hand. A consistent hand-posed 3D character reads as 'real 3D' against the flood.", "w": "_PRIVATE/_boresight-24/market-demand.md §2"}, "better-areas": {"t": "the better areas", "k": "noun", "st": "ruled", "d": "Adjacent lanes for the same Blender skill, from the demand read: VTuber model commissions (1,300 to 3,800 dollars entry, five to ten thousand rigged; a booming, policy-safe market), adult VR (projected 19 billion dollars by 2026, 97 percent subscription), AI-hybrid pipelines with the human finish sold as the product, and 3D visual novels (top adult-VN creators about five thousand a month in 2023). Real lanes; none is the one on the sheet.", "w": "_PRIVATE/_boresight-24/market-demand.md §6"}, "remi": {"t": "Remi Slate", "k": "person", "st": "provisional", "d": "Ultrasin's first signing: 21 in canon, born August 11 2005, the mother lost in 2020 (D-7), evicted at 18; a disclosed 3D persona (D-6) with a bratty, direct register and a wound and an arc. The character sheet is v0.2; the name is ruled 'for now' with the spelling open. The boresight's read: she is the moat; she needs motion and a sentence to travel.", "w": "_PRIVATE/BOLO-24-character-sheet.md"}, "route-b": {"t": "Route B", "k": "ruling", "st": "ruled", "d": "RULED 2026-09-17 (D-12, Chief: \"we're going to be doing Route B\"): the motion lane is local AI image-to-video on the finished Blender render — ComfyUI with Wan 2.2 or LTX on the 3090, NSFW loops and beginner workflows already on Civitai, zero dollars. Route A (the Spine-style living picture NIKKE actually uses) is the later splash asset if loops travel; Route C (light Blender motion) is the fallback. Nowhere in the plan does Chief animate by hand.", "w": "_PRIVATE/_boresight-24/motion-lane.md §4, §6"}, "lewd-line": {"t": "the lewd line", "k": "ruling", "st": "provisional", "d": "Call D-18: suggestive-not-explicit (bikini, lingerie, implied; no nipples, no genitals, no act) versus explicit. Lewd-first keeps Instagram and TikTok reach, the brand-deal ceiling (Lu do Magalu about 34 thousand a post, Milla Sofia 10 to 25 thousand), rails under five percent and no age-verification net; explicit buys per-fan revenue nobody has quantified and costs all of that. The standard ladder: a second, separated Fanvue account once the free audience converts.", "w": "_PRIVATE/_boresight-24/lewd-lane.md §4–5"}, "close-friends": {"t": "Close Friends", "k": "noun", "st": "ruled", "d": "Two things wearing one name. Instagram Subscriptions is the real rail: a paid Stories tier, zero Meta commission through 2026, app-store cut on top, ten thousand followers to unlock. The informal version — a Close Friends tier paid off-platform by Venmo, Cash App or PayPal friends-and-family — inherits the payment app's adult ban and its freezes (PayPal up to 180 days). The trap, per the rails read.", "w": "_PRIVATE/_boresight-24/rails.md §B1"}, "boring-rails": {"t": "the boring rails", "k": "noun", "st": "ruled", "d": "The 2026 rails that hold under five percent effective cost for a lewd-not-nude persona and trigger no ID wall because none is legally an adult platform: Instagram Subscriptions, Fanfix (20 percent, brand-safe, no nudity and no AI nudes), Passes (flat 10 percent), Ko-fi and Buy Me a Coffee as tip jars, Throne wishlists. Fanvue (15 to 20 percent) is the one that also carries an explicit paywall behind a lewd public layer.", "w": "_PRIVATE/_boresight-24/rails.md §B2, §B6"}, "age-verification": {"t": "the age-verification net", "k": "noun", "st": "ruled", "d": "What attaches the moment content is sold as explicit: 26 US states with adult age-verification laws as of June 2026 (upheld 6–3 in Free Speech Coalition v. Paxton, June 2025), the UK Online Safety Ac const B = DATA.board, G = DATA.glossary;
const WHO = 'HOTLINE ACTUAL';
const SOI_URL = "https://claude.ai/code/artifact/4c2fc9c7-e0d2-4626-8142-9740ff8ee0e5";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s) {

  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, l) => { const g = G[k]; const label = l || (g ? g.t : k); return g ? `<a class="t" data-t="${k}" tabindex="0">${label}</a>` : label; });
  return s;
}
const ST = { hot: ['●', 'hot'], open: ['○', 'open'], held: ['◐', 'held'], gated: ['◇', 'on your go'], parked: ['▭', 'parked'], done: ['✓', 'done'], ruled: ['✓', 'ruled'], good: ['●', 'up'], bad: ['▲', 'stalled'], missing: ['▲', 'no record'], corrected: ['↺', 'corrected'], new: ['✦', 'new'] };
const chip = s => { if (!s) return ''; const d = ST[s] || ['·', s]; return `<span class="chip st-${s}">${s === 'hot' ? '<i></i>' : d[0]} ${d[1]}</span>`; };
function trunk(t) { if (!t) return ''; const one = x => x === 'BLACK' ? `<span class="b">BLACK</span>` : x === 'ORANGE' ? `<span class="o">ORANGE</span>` : `<span class="p">${esc(x)}</span>`; return `<span class="tr">${t.split('/').map(one).join('')}</span>`; }

const K = B.bolo, F = B.frago, P = B.paragraphs;

/* ---- masthead: the one strip ---- */
$('#mNum').textContent = K.n;
if (K.kind) $('#mKind').textContent = K.kind; /* a BORESIGHT on the same template (Chief 9/17) */
$('#mTitle').textContent = K.title;
$('#mTitle').title = K.title;
$('#mState').innerHTML = chip(K.s);
$('#mVer').textContent = `${K.version || ''} · as of ${K.asof}`;
$('#footR').textContent = `Distribution: internal · decider ${K.decider} · ${K.home || ''}`;

/* ---- the document ---- */
const secNo = i => String(i + 1);
const itemHTML = it => `<li class="item"><span class="n num">${it.n != null ? it.n : ''}</span><div><div class="text">${md(it.t)}</div><div class="meta">${chip(it.s)}${it.when ? `<span class="when">${esc(it.when)}</span>` : ''}</div></div></li>`;
const groupsHTML = (groups, no) => groups.map((g, j) => `<div class="sub"><span class="lbl"><span class="no">${no}.${j + 1}</span>${esc(g.label)}</span><ul class="items">${g.items.map(itemHTML).join('')}</ul></div>`).join('');
function bodyHTML(p, no) {
  if (p.kind === 'list' && p.groups) return groupsHTML(p.groups, no);
  if (p.kind === 'mission') return `<div class="msn"><p class="task">${md(p.task)}</p><p class="intent">${md(p.intent)}</p>${p.spoken ? `<p class="spoken">${md(p.spoken)}</p>` : ''}</div>
    <div class="sub end"><span class="lbl"><span class="no">${no}.1</span>End state · done means</span><ol>${(p.endstate || []).map(e => `<li>${md(e)}</li>`).join('')}</ol></div>`;

    <div class="sub"><span class="lbl"><span class="no">${no}.1</span>Phases</span>${(p.phases || []).map(ph => `<div class="ph ${ph.s}"><span class="n num">${ph.n}</span><div class="text">${md(ph.t)}</div><div class="right">${chip(ph.s)}<span class="when">${esc(ph.when)}</span></div></div>`).join('')}</div>
    <div class="sub coord"><span class="lbl"><span class="no">${no}.2</span>Coordinating instructions</span><ul>${(p.coord || []).map(c => `<li>${md(c)}</li>`).join('')}</ul></div>
    <div class="sub coord"><span class="lbl"><span class="no">${no}.3</span>Running now</span><ul>${(p.running && p.running.length) ? p.running.map(c => `<li>${md(c)}</li>`).join('') : '<li>Nothing on this BOLO. It waits on you.</li>'}</ul></div>`;
  if (p.kind === 'files') return `<div class="tblwrap"><table class="files"><thead><tr><th>Where</th><th>What</th><th>State</th></tr></thead><tbody>${(p.files || []).map(f => `<tr><td class="p">${/^https?:/.test(f.path) ? `<a href="${esc(f.path)}" target="_blank" rel="noopener">${esc(f.path.replace('https://', ''))}</a>` : esc(f.path)}</td><td>${md(f.what)}</td><td>${chip(f.s)}</td></tr>`).join('')}</tbody></table></div>
    ${p.cost && p.cost.length ? `<div class="cost">${p.cost.map(c => `<div><b>${esc(c.v)}</b><span>${esc(c.k)}</span></div>`).join('')}</div>` : ''}`;
  if (p.kind === 'log') return `<div class="log">${(p.entries || []).map(e => `<div class="lg ${/claude|agent/i.test(e.who) ? 'claude' : ''}"><span class="when">${esc(e.when)}</span><span class="who">${esc(e.who)}</span><span>${md(e.t)}</span></div>`).join('')}</div>`;
  if (p.groups) return groupsHTML(p.groups, no);

  return '';
}
const callRow = (c, i) => `<tr class="${c.s}"><td class="n">${i + 1}</td><td class="q">${esc(c.q)}</td><td class="o">${esc(c.options)}${c.ruling ? `<span class="rul">${md(c.ruling)}</span>` : ''}</td><td class="d">default <em>${esc(c.default)}</em></td><td class="s">${chip(c.s)}</td></tr>`;

$('#page').innerHTML = `
  <h1 class="dt"><small>BOLO ${K.n} · standing status page · ${esc(K.version || '')}</small>${esc(K.title)}</h1>
  <dl class="fm">
    <dt>Number</dt><dd>BOLO ${K.n} ${trunk(K.trunk)}</dd>
    <dt>Issued · as of</dt><dd>${esc(K.issued)} · ${esc(K.asof)}</dd>
    <dt>Decider</dt><dd>${esc(K.decider)}</dd>
    <dt>Feeds</dt><dd>${md(K.feeds)}</dd>
    <dt>Status</dt><dd class="st">${chip(K.s)} ${md(K.status)}</dd>
  </dl>
  <section class="sec pre" id="sec-P"><div class="sh"><span class="no">P</span><h2>Preface</h2><span class="src">purpose · the order · the calls · the three</span></div>
    <div class="sub" id="sec-P1"><span class="lbl"><span class="no">P.1</span>Purpose · task, in order to</span><p class="purpose">${md(F.mission)}</p></div>
    <div class="sub" id="sec-P2"><span class="lbl"><span class="no">P.2</span>The order · next action</span><div class="order"><p class="big">${md(F.order)}</p><p class="default">${md(F.default)}</p></div></div>
    <div class="sub" id="sec-P3"><span class="lbl"><span class="no">P.3</span>${WHO}'s calls · defaults run if silent</span><div class="tblwrap"><table class="calls"><thead><tr><th></th><th>The call</th><th>Options</th><th>Default</th><th>State</th></tr></thead><tbody>${F.calls.map(callRow).join('')}</tbody></table></div></div>
    <div class="sub" id="sec-P4"><span class="lbl"><span class="no">P.4</span>The three</span><div class="three">${B.mantra.map(m => `<div><span class="w"><a class="t" data-t="${m.k}" tabindex="0">${esc(m.w)}</a></span><p>${md(m.line)}</p></div>`).join('')}</div></div>
  </section>
  ${P.map((p, i) => `<section class="sec" id="sec-${i + 1}" data-i="${i}"><div class="sh"><span class="no">${secNo(i)}</span><h2>${esc(p.name)}</h2><span class="src">¶ ${esc(p.id)}</span></div><p class="plain">${md(p.plain)}</p>${bodyHTML(p, secNo(i))}</section>`).join('')}
  <section class="sec" id="sec-A"><div class="sh"><span class="no">A</span><h2>Related</h2><span class="src">BOLOs this one leans on</span></div><div class="rel">${(K.related || []).map(r => `<div><b>BOLO ${r.n}</b>${md(r.why)}</div>`).join('')}</div></section>`;

/* ---- contents ---- */
const TOC = [
  { id: 'sec-P', no: 'P', nm: 'Preface' },
  { id: 'sec-P2', no: 'P.2', nm: 'The order', sub: true },
  { id: 'sec-P3', no: 'P.3', nm: 'The calls', sub: true },
  ...P.map((p, i) => ({ id: `sec-${i + 1}`, no: secNo(i), nm: p.name, i })),
  { id: 'sec-A', no: 'A', nm: 'Related' },
];
$('#tocRows').innerHTML = TOC.map(t => `<a class="toc-row ${t.sub ? 'sub' : ''}" href="#${t.id}" data-id="${t.id}"><span class="no">${esc(t.no)}</span><span class="nm">${esc(t.nm)}</span></a>`).join('');
$('#tocKv').innerHTML = `<dt>row</dt><dd>${esc(K.home || '')}</dd><dt>card</dt><dd>${esc(K.card || '')}</dd><dt>page</dt><dd>_tools/bolostatus/out/BOLO-${K.n}.html</dd>`;
$('#tocRows').addEventListener('click', e => { const a = e.target.closest('.toc-row'); if (!a) return; e.preventDefault(); jump(a.dataset.id); });
function jump(id) { const el = document.getElementById(id); if (el) { el.scrollIntoView({ block: 'start' }); setCurrent(id); } }

/* ---- where you are: follows the scroll ---- */
function strandFor(id) {
  const sec = document.getElementById(id); const top = sec && sec.closest('section');
  const i = top && top.dataset.i != null ? +top.dataset.i : null;
  const p = i != null ? P[i] : null;
  const ruled = F.calls.filter(c => c.s === 'ruled').length;
  const s = p ? p.strand : { last: F.mission, plan: F.order, you: ruled ? `${ruled} of ${F.calls.length} calls ruled.` : 'No call ruled yet.', next: F.default };
  const head = p ? `${secNo(i)} · ${p.name}` : 'Preface';
  $('#ctx').innerHTML = `<h4><small>Where you are</small>${esc(head)}</h4><div class="ctx">
    <div class="c"><span class="lbl">What we did last</span><p>${md(s.last)}</p></div>
    <div class="c"><span class="lbl">What the plan was</span><p>${md(s.plan)}</p></div>
    <div class="c"><span class="lbl">What ${WHO} did</span><p>${md(s.you)}</p></div>
    <div class="c"><span class="lbl">What's next</span><p>${md(s.next)}</p></div></div>`;
}
const topOf = id => document.getElementById(id).closest('section').id;
function setCurrent(id) {
  const top = topOf(id);
  document.querySelectorAll('.toc-row').forEach(r => { const rid = r.dataset.id; r.classList.toggle('on', r.classList.contains('sub') ? rid === id : topOf(rid) === top); });
  strandFor(id);
}
const spy = new IntersectionObserver(entries => {
  const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
  if (vis.length) setCurrent(vis[0].target.id);
}, { root: $('#doc'), rootMargin: '0px 0px -70% 0px', threshold: 0 });
TOC.forEach(t => spy.observe(document.getElementById(t.id)));
setCurrent('sec-P');

/* ---- tooltips: hover → open · 1.5 s or Space → lock · nested to depth 3 · Esc closes ---- */
let tips = [], openTimer = null, closeTimer = null;
function tipFor(target, depth) {
  const k = target.dataset.t; const g = G[k]; if (!g) return null; const el = document.createElement('div'); el.className = 'tip'; el.dataset.depth = depth;
  const deep = depth >= 3;
  el.innerHTML = `<div class="th"><b>${esc(g.t)}</b><span class="k">${esc(g.k)}</span></div><p>${deep ? esc(g.d.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kk, l) => l || (G[kk] ? G[kk].t : kk))) : md(g.d)}</p>${deep ? `<div class="w"><a href="#" class="glopen" data-k="${k}">Open in SOI →</a></div>` : `<div class="w">${esc(g.w || '')}</div>`}<div class="lock"><b></b></div><div class="hint">hold 1.5 s or press Space to lock · Esc closes · click opens the term</div>`;
  document.body.appendChild(el);
  const r = target.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  let x = Math.min(Math.max(12, r.left), window.innerWidth - w - 12); let y = r.bottom + 8; if (y + h > window.innerHeight - 12) y = Math.max(12, r.top - h - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const rec = { el, target, depth, locked: false, timer: null };
  const bar = $('.lock b', el); requestAnimationFrame(() => { bar.style.transition = 'width 1.5s linear'; bar.style.width = '100%'; });
  rec.timer = setTimeout(() => lock(rec), 1500);
  el.addEventListener('mouseenter', () => clearTimeout(closeTimer));
  el.addEventListener('mouseleave', () => scheduleClose(depth));
  el.addEventListener('click', e => { const a = e.target.closest('.glopen'); if (a) { e.preventDefault(); openTerm(a.dataset.k); } });
  target.classList.add('on'); tips.push(rec); return rec;
}
function lock(rec) { rec.locked = true; rec.el.classList.add('locked'); }
function closeTips(d) { tips.filter(t => t.depth >= d).forEach(t => { clearTimeout(t.timer); t.el.remove(); t.target.classList.remove('on'); }); tips = tips.filter(t => t.depth < d); }
function scheduleClose(depth) { clearTimeout(closeTimer); closeTimer = setTimeout(() => { const un = tips.filter(t => t.depth >= depth && !t.locked); if (un.length) closeTips(Math.min(...un.map(t => t.depth))); }, 220); }
function depthOf(t) { const p = t.closest('.tip'); return p ? +p.dataset.depth + 1 : 1; }
function onEnter(t) { clearTimeout(openTimer); clearTimeout(closeTimer); const d = depthOf(t); openTimer = setTimeout(() => { closeTips(d); tipFor(t, d); }, 120); }
document.addEventListener('mouseover', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest('.t'); if (t) { clearTimeout(openTimer); scheduleClose(depthOf(t)); } });
document.addEventListener('focusin', e => { const t = e.target.closest('.t'); if (t) onEnter(t); });
document.addEventListener('focusout', e => { const t = e.target.closest('.t'); if (t) scheduleClose(depthOf(t)); });
document.addEventListener('click', e => { const t = e.target.closest('.t'); if (t && t.dataset.t) { e.preventDefault(); openTerm(t.dataset.t); return; } if (!e.target.closest('.tip')) closeTips(1); });
function openTerm(k) { const g = G[k]; if (!g) return; $('#rail').classList.add('gl'); closeTips(1); $('#glDetail').innerHTML = `<h5>${esc(g.t)}</h5>${g.st ? chip(g.st === 'ruled' ? 'ruled' : g.st === 'benched' ? 'parked' : 'open') : ''}<p style="margin-top:6px">${md(g.d)}</p><div class="w">${esc(g.k)} · ${esc(g.w || '')}</div>`; }
function closeTerm() { $('#rail').classList.remove('gl'); }
$('#glClose').addEventListener('click', closeTerm);

/* ---- keys ---- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const up = e.key.toUpperCase();
  if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < P.length) jump(`sec-${i + 1}`); return; }
  if (up === 'P') { jump('sec-P'); return; }
  if (up === 'A') { jump('sec-A'); return; }
  if (up === 'G') { window.open(SOI_URL, '_blank', 'noopener'); return; }
  if (e.key === 'Escape') { if (tips.length) closeTips(1); else if ($('#rail').classList.contains('gl')) closeTerm(); return; }
  if (e.key === ' ' && tips.length) { e.preventDefault(); lock(tips[tips.length - 1]); return; }
});
