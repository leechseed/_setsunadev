, the Work Skill, holds systems, standards and workflows. Part B, the Persona, holds five layers: hard rules, identity, expression, decisions, interpersonal. At run time the profile decides the attitude, then the work half does the task, and the output comes in that person's voice. Chief types `/slug` to call it.", "license": "MIT", "picks": [{"id": "dst-01", "kind": "idea", "plain": "Give each agent a short profile block: a voice line, a known-weakness line, last three jobs, a cost record.", "rec": "yes", "replaces": "none (extends Roster page)", "risk": "MIT; idea only, no code run. Profile must hold no private detail."}, {"id": "dst-02", "kind": "idea", "plain": "Fold a correction into the profile the same turn (Distilly's correction layer): 'he wouldn't do that' becomes a standing line.", "rec": "maybe", "replaces": "none (extends dst-01)", "risk": "MIT; idea only."}, {"id": "dst-03", "kind": "skill", "plain": "Install Distilly itself to turn chat logs into persona skills.", "rec": "no", "replaces": "none", "risk": "MIT, but bundled collectors take app tokens and read chat history. Do not install."}]}, {"repo": "tjboudreaux/cc-thinking-skills", "url": "https://github.com/tjboudreaux/cc-thinking-skills", "what": "**Verdict.** Keep three ideas; install nothing. MIT, 28 text-only skills, all manual-only (`disable-model-invocation`). The repo's own audit says zero measured benefit worth claiming (best row +4.0 points, below its own +5 bar; two eval runs made no model calls). So these are well-written procedures, not proven ones. Each skill has a \"When NOT to use\" guard, which is the good part.", "intro": "**Verdict.** Keep three ideas; install nothing. MIT, 28 text-only skills, all manual-only (`disable-model-invocation`). The repo's own audit says zero measured benefit worth claiming (best row +4.0 points, below its own +5 bar; two eval runs made no model calls). So these are well-written procedures, not proven ones. Each skill has a \"When NOT to use\" guard, which is the good part.", "license": "cc-thinking-skills", "picks": [{"id": "think-pre-mortem", "kind": "idea", "plain": "Before a plan runs, assume it already failed and write the concrete reasons; each top reason becomes a gate or a plan change.", "rec": "yes", "replaces": "none", "risk": "none; MIT, text only, manual-only (disable-model-invocation)"}, {"id": "think-circle-of-competence", "kind": "idea", "plain": "Before a writer states a fact, it marks the claim grounded, partial or ungrounded, then fetches, hedges or abstains.", "rec": "yes", "replaces": "none", "risk": "none; MIT, text only"}, {"id": "think-steel-man", "kind": "skill", "plain": "On a spoken word, the CDR builds the strongest honest case against the rec Chief is about to take, names what would flip it, then keeps or changes the rec.", "rec": "yes", "replaces": "none", "risk": "none; MIT, text only; must stay spoken-only"}, {"id": "think-first-principles", "kind": "idea", "plain": "List the limits a brief treats as fixed, tag each as physics, contract, measured or just convention, and drop the convention ones.", "rec": "maybe", "replaces": "none", "risk": "none; MIT"}, {"id": "think-five-whys-plus", "kind": "idea", "plain": "After a failure is located, keep asking why until a system cause shows, not a person or a symptom.", "rec": "no", "replaces": "root-cause agent", "risk": "none; MIT"}, {"id": "think-red-team", "kind": "idea", "plain": "Review authorized attack paths with reproducible findings.", "rec": "no", "replaces": "security-reviewer agent", "risk": "none; MIT"}, {"id": "think-model-router", "kind": "skill", "plain": "A router that picks one to three of 28 thinking frames for a problem.", "rec": "no", "replaces": "none", "risk": "none; MIT; the plugin route needs /plugin install, never run it"}, {"id": "think-catalog-rest", "kind": "idea", "plain": "The other 20 frames (OODA, TRIZ, Cynefin, Lindy, JTBD, effectuation, and so on).", "rec": "no", "replaces": "none", "risk": "none; MIT; Node validators and evals not needed"}]}, {"repo": "yingpengma/Awesome-Story-Generation", "url": "https://github.com/yingpengma/Awesome-Story-Generation", "what": "**Verdict:** keep as a reading map. CC-BY-4.0 (cite it), 665 stars, pushed 10/12. Scan flag WATCH is only its citation-refresh script; no code taken. It is a paper list. I read its one-line summaries of the planning, coherence, character, benchmark and screenplay papers (about 12), not the full PDFs.", "intro": "**Verdict:** keep as a reading map. CC-BY-4.0 (cite it), 665 stars, pushed 10/12. Scan flag WATCH is only its citation-refresh script; no code taken. It is a paper list. I read its one-line summaries of the planning, coherence, character, benchmark and screenplay papers (about 12), not the full PDFs.", "license": "CC-BY-4.0", "picks": [{"id": "story-01", "kind": "idea", "plain": "Split fiction writing into specialist agents (planner, writer, reviser) instead of one model, as Agents' Room does.", "rec": "yes", "replaces": "nothing (new: writing department design)", "risk": "low: ideas only; CC-BY-4.0 list, cite the paper."}, {"id": "story-02", "kind": "idea", "plain": "Outliner builds a detailed hierarchical outline, and a check keeps each drafted passage matched to it (DOC, DOME).", "rec": "yes", "replaces": "nothing (new seat: outliner)", "risk": "low"}, {"id": "story-03", "kind": "script", "plain": "Continuity keeper as a script: store facts with start and end dates and flag contradictions (FACTTRACK, ConWriter, SCORE).", "rec": "yes", "replaces": "nothing (new: _tools/continuity/ check script)", "risk": "low: build later, after the fabula is whole."}, {"id": "story-04", "kind": "agent", "plain": "One critique agent allowed in the writing department only: reads a draft against the outline and LEECHSEED and reports contradictions and weak beats.", "rec": "hold", "replaces": "nothing (new: story-critic)", "risk": "medium: model judging a model; pair with the script."}, {"id": "story-05", "kind": "idea", ist (MS, sonnet) writes the register, a script proves every link is covered. Fires on \"collect the locus\", \"pull every link in …\", \"build the register from the harvest\", \"run the locus\".", "repo": "", "model": "", "path": ".claude/skills/collect/SKILL.md"}, {"kind": "skill", "name": "config-gc", "desc": "Config cleanup audit. Fires ONLY when Chief names it, on \"config GC\" or \"clean the config\". Never run it on its own, never scan the box unasked. Audits the repo's .claude config, then asks Chief about each deletion one at a time. Never deletes on its own.", "repo": "affaan-m/ECC", "model": "", "path": ".claude/skills/config-gc/SKILL.md"}, {"kind": "skill", "name": "context-budget", "desc": "Answers \"what's eating the context\" without scanning the box. Fires on \"context budget\" or \"what's eating the context\". Points Chief to the live /context meter, then reads only the repo's always-loaded files if he asks for the audit.", "repo": "affaan-m/ECC", "model": "", "path": ".claude/skills/context-budget/SKILL.md"}, {"kind": "skill", "name": "dope-sheet", "desc": "Build BOLO N's standing status page (DOPE SHEET N, ruled 9/11) in the formation (BOLO 51 phase 2.4) — a script gathers every mention, a Mission Specialist (MS, sonnet) drafts Situation · Execution · Admin · Log, the CDR writes Mission · Command & Signal · the order and the calls, a script reviews, build, publish. Fires on \"DOPE SHEET N\", \"the dope on N\", \"status report on N\", \"build the sheet for N\".", "repo": "", "model": "", "path": ".claude/skills/dope-sheet/SKILL.md"}, {"kind": "skill", "name": "frago", "desc": "Push a fragmentary order onto DOPE SHEET N (FRAGO N, ruled 9/11) without rewriting the sheet — pure script (BOLO 51 phase 2.3): the main line writes a ~1 KB patch, frago.py merges it, bumps the version, builds; publish to the sheet's standing URL. Fires on \"FRAGO N\", \"update the sheet for N\", \"push that onto N\".", "repo": "", "model": "", "path": ".claude/skills/frago/SKILL.md"}, {"kind": "skill", "name": "intake", "desc": "The repo intake (BOLO 140). Fires on \"intake\" followed by one or more GitHub links, or \"run the intake on these repos\". A script scans each repo, specialists judge what it could add to the Command, and Chief keeps or skips each pick on a glass page. Never installs anything on its own.", "repo": "", "model": "", "path": ".claude/skills/intake/SKILL.md"}, {"kind": "skill", "name": "launch", "desc": "Run the launch sequence (BOLO 58). A zero-token script brings the local stations up and opens the two boards, then the sit rep runs and the reply carries the station poll. Fires on \"go for launch\" (ruled 9/17), the garbles \"go for log\" and \"go for lunch\", and on \"launch sequence\", \"start launch sequence\" or \"run launch sequence\" spoken alone. Never on \"go N\".", "repo": "", "model": "", "path": ".claude/skills/launch/SKILL.md"}, {"kind": "skill", "name": "oscar-mike", "desc": "Run the close-out (\"Oscar Mike\", ruled 9/11) in the formation (BOLO 51 phase 2.2) — a script pulls the session's spoken turns from the local transcript, a Payload Specialist (PS, haiku) drafts the Ready Rack note, a script appends the journal, the main line rules the note and writes STATE's Moved bullet, then the OUT block. Fires on \"Oscar Mike\" or \"we're Oscar Mike\".", "repo": "", "model": "", "path": ".claude/skills/oscar-mike/SKILL.md"}, {"kind": "skill", "name": "rtb", "desc": "Run the card-clearing pass (\"RTB\", ruled 9/10) in the formation (BOLO 51 phase 2.6) — a script compiles every open card in oscar-mike/ with its resume lines, a Payload Specialist (PS, haiku) proposes one disposition per card, the main line rules the lines and executes. Fires on \"RTB\", \"RTB oscar-mike\", \"clear the cards\", \"send the cards home\".", "repo": "", "model": "", "path": ".claude/skills/rtb/SKILL.md"}, {"kind": "skill", "name": "safety-guard", "desc": "Freeze mode for long detached runs. Fires on \"freeze\" or \"safety guard\". While the pull waves or other detached scripts run, no edits to the named running scripts and no killing their processes without Chief's word.", "repo": "affaan-m/ECC", "model": "", "path": ".claude/skills/safety-guard/SKILL.md"}, {"kind": "skill", "name": "sitrep", "desc": "Deliver the sit rep (the board + the SITREP page) in the formation ruled 2026-09-12 (BOLO 54) — a zero-token prep script, three independent specialists at gear 1 (one MS · two PS), RANGE the script reviewer at the fan-in, the CDR writing only Block VI and the header. Fires on \"sit rep\", \"the board\", \"where did we leave off\", \"what are we working on\", or the countersign.", "repo": "", "model": "", "path": ".claude/skills/sitrep/SKILL.md"}, {"kind": "skill", "name": "steel-man", "desc": "Gives the strongest honest case for the other side of a rec or decision. Fires ONLY on \"steel-man X\" or \"strongest case for X\". Never fires on its own.", "repo": "tjboudreaux/cc-thinking-skills", "model": "", "path": ".claude/skills/steel-man/SKILL.md"}, {"kind": "skill", "name": "strategic-compact", "desc": "Decides whether now is a good moment to run /compact. Fires on \"compact check\" or \"should we compact\". Judges by task phase, makes sure the state is written to a file first, then tells Chief what to type.", "repo": "affaan-m/ECC", "model": "", "path": ".claude/skills/strategic-compact/SKILL.md"}, {"kind": "agent", "name": "a11y-architect", "desc": "Accessibility reviewer for the Command's static HTML pages (dashboards, DOPE SHEETs, SOI). Audits against WCAG 2.2 AA and specifies the exact roles, labels and focus order a fix needs.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/a11y-architect.md"}, {"kind": "agent", "name": "architect", "desc": "Software architecture advisor for the Command's tooling. Reads the existing scripts and data, then proposes a design with trade-offs for a new tool or a reshuffle of _tools/.", "repo": "affaan-m/ECC", "model": "opus", "path": ".claude/agents/architect.md"}, {"kind": "agent", "name": "bench-engineer", "desc": "The Engineer seat of the Bench: gives one advisory opinion on a question from the view of the box, the scripts and what is buildable. Reads only what the brief names; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/bench-engineer.md"}, {"kind": "agent", "name": "bench-money", "desc": "The Money seat of the Bench: gives one advisory opinion on a question from the view of BoldVenture, the ORANGE arm and what pays. Reads only what the brief names; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/bench-money.md"}, {"kind": "agent", "name": "bench-operator", "desc": "The Operator seat of the Bench: gives one advisory opinion on a question from the view of running the Command (cost, time, what breaks). Reads only what the brief names; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/bench-operator.md"}, {"kind": "agent", "name": "bench-skeptic", "desc": "The Skeptic seat of the Bench: gives one advisory opinion on a question by naming what is wrong with the idea (the pre-mortem). Reads only what the brief names; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/bench-skeptic.md"}, {"kind": "agent", "name": "bench-storyteller", "desc": "The Storyteller seat of the Bench: gives one advisory opinion on a question from the view of the Outliers, the fabula and what the story needs. Reads only what the brief names; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/bench-storyteller.md"}, {"kind": "agent", "name": "chief-of-staff", "desc": "Triage assistant for messages the CDR hands over (pasted email, notes, threads). Sorts each into four tiers and drafts replies in Chief's tone; it never sends anything.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/chief-of-staff.md"}, {"kind": "agent", "name": "claim-checker", "desc": "Takes a draft or article, lists each factual claim  five recall questions, or in practical mode three to five hands-on exercises, each with its answer attached as a tip. No scores and no grading; changes nothing.", "repo": "", "model": "haiku", "path": ".claude/agents/drill-maker.md"}, {"kind": "agent", "name": "harness-optimizer", "desc": "Reviews the Command's own agent setup (CLAUDE.md, hooks, skills, agents) for reliability and token cost, and proposes minimal, reversible changes as a report. It does not edit anything.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/harness-optimizer.md"}, {"kind": "agent", "name": "loop-operator", "desc": "Watches a long-running or repeating job (a detached wave, a queue, a cron run) from its logs and checkpoints, spots stalls and retry storms, and recommends pause, shrink or resume.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/loop-operator.md"}, {"kind": "agent", "name": "marketing-agent", "desc": "Marketing strategist and copywriter for the Command's ventures. Plans a campaign or reviews copy: positioning, landing page, emails, social posts, ad variants, short video scripts and a content calendar.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/marketing-agent.md"}, {"kind": "agent", "name": "mle-reviewer", "desc": "Reviews the Command's data and model scripts (audio features, embeddings, classifiers, scoring) for leakage, reproducibility, weak evaluation and silent failures. Reports findings ordered by severity; changes nothing.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/mle-reviewer.md"}, {"kind": "agent", "name": "network-troubleshooter", "desc": "Diagnoses a connectivity, DNS, routing or slow-link symptom with a read-only layer-by-layer workflow and an evidence-backed root cause. Runs only when the brief names the box and the commands it may use.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/network-troubleshooter.md"}, {"kind": "agent", "name": "opensource-forker", "desc": "Copies a project into a staging folder for release, strips secrets and private references, writes .env.example and a fork report, and starts a clean git history. First stage before the sanitizer.", "repo": "affaan-m/ECC", "model": "haiku", "path": ".claude/agents/opensource-forker.md"}, {"kind": "agent", "name": "opensource-packager", "desc": "Writes the release packaging for a sanitized project in its staging folder: README, CLAUDE.md, setup script, LICENSE, CONTRIBUTING and optional GitHub issue templates. Third stage after the forker and the sanitizer.", "repo": "affaan-m/ECC", "model": "haiku", "path": ".claude/agents/opensource-packager.md"}, {"kind": "agent", "name": "opensource-sanitizer", "desc": "Independent read-only audit of a staged project before public release. Scans for leaked secrets, personal data, internal references, dangerous files and unreadable binaries, and returns PASS, FAIL or PASS WITH WARNINGS. It never trusts the forker's work.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/opensource-sanitizer.md"}, {"kind": "agent", "name": "order-parser", "desc": "Turns one garbled dictation line from Chief into a clean order (proword, BOLO, verb, object, confidence), using the SOP garble table and the BOLO titles. It never acts and never writes.", "repo": "", "model": "haiku", "path": ".claude/agents/order-parser.md"}, {"kind": "agent", "name": "performance-optimizer", "desc": "Finds why a Python script is slow or memory-hungry (nested loops, repeated file or database reads, per-item subprocess calls, big in-memory lists) and recommends measured fixes. It reports; it does not edit.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/performance-optimizer.md"}, {"kind": "agent", "name": "planner", "desc": "Turns a feature or refactor request into a concrete, phased plan with exact file paths, dependencies, risks and a verification step for each phase. Reads the code first; writes no code.", "repo": "affaan-m/ECC", "model": "opus", "path": ".claude/agents/planner.md"}, {"kind": "agent", "name": "prose-taste", "desc": "Audits a draft the brief names against the copy self-audit and the prose_lint.py rule list. Returns flagged lines with the fix for each. Reports only; never rewrites the file.", "repo": "taste-skill", "model": "sonnet", "path": ".claude/agents/prose-taste.md"}, {"kind": "agent", "name": "python-reviewer", "desc": "Reviews changed Python scripts for security, error handling, Windows path and encoding pitfalls, type hints and idiomatic style. Reports findings by severity; changes nothing.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/python-reviewer.md"}, {"kind": "agent", "name": "pytorch-build-resolver", "desc": "Diagnoses PyTorch and CUDA failures (shape mismatches, device errors, gradient and DataLoader problems, mixed precision) from a traceback and the code, and reports the smallest fix. Read-only: it proposes the edit, the CDR applies it.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/pytorch-build-resolver.md"}, {"kind": "agent", "name": "refactor-cleaner", "desc": "Finds and removes dead code, unused imports and duplicated helpers in the Python scripts the brief names, one safe category at a time, and checks each script still compiles and starts.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/refactor-cleaner.md"}, {"kind": "agent", "name": "root-cause", "desc": "Walks a bug or unexpected behavior through root-cause steps before any fix is proposed. Returns the symptom, the evidence chain with file:line, the root cause, the smallest fix and what would prove it. Reports only; edits nothing.", "repo": "", "model": "sonnet", "path": ".claude/agents/root-cause.md"}, {"kind": "agent", "name": "sci-biomed", "desc": "Science Department biology and medicine seat. Checks physiology, disease, injury, dosing and aging in a scene or canon node for the story's eras, in bounded-claims wording. Advises; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/sci-biomed.md"}, {"kind": "agent", "name": "sci-forecast", "desc": "Science Department technology-forecast seat for eras 3 and 4. Sets out what technology could exist by that era in a favorable, adverse, wild-card and second-order frame, with confidence. Advises; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/sci-forecast.md"}, {"kind": "agent", "name": "sci-literature", "desc": "Science Department literature seat. Finds published papers on a question through OpenAlex and returns sources with DOI and a one-line finding each, plus thin-evidence flags. Advises; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/sci-literature.md"}, {"kind": "agent", "name": "sci-physics", "desc": "Science Department physics seat. Answers orbital mechanics, habitat, Moon (ASTRO7EX) and energy-budget questions with the number, the formula and the assumptions. Advises; reports only.", "repo": "", "model": "sonnet", "path": ".claude/agents/sci-physics.md"}, {"kind": "agent", "name": "sci-plausibility", "desc": "Science Department plausibility seat. Reads a scene or canon node the brief names and flags the impossible or the unexplained, each with the line, the problem and two ways the story could keep it. Advises, never gates, never rewrites.", "repo": "", "model": "sonnet", "path": ".claude/agents/sci-plausibility.md"}, {"kind": "agent", "name": "security-reviewer", "desc": "Reviews Python scripts and generated pages for leaked secrets, private data in public files, command and SQL injection, unsafe deserialization and unsafe fetching. Reports findings by severity with a fix; changes nothing.", "repo": "affaan-m/ECC", "model": "sonnet", "path": ".claude/agents/security-reviewer.md"}, {"kind": "agent", "name": "seo-specialist", "desc": "Technical and on-page SEO reviewer for the Command's public pages and sites. Audits titles, meta tags, headings, canonicals,  "desc": "Commits the tree locally at the end of every turn. Never pushes.", "repo": "", "model": "fires on Stop", "path": ".claude/settings.local.json"}, {"kind": "hook", "name": "digest.py", "desc": "Prints the session-open digest, so the session never reads the five big files.", "repo": "", "model": "fires on SessionStart", "path": ".claude/settings.local.json"}, {"kind": "hook", "name": "no_probe.py", "desc": "Blocks commands that scan the box unless the order names it (ruled 9/19).", "repo": "", "model": "fires on PreToolUse", "path": ".claude/settings.local.json"}, {"kind": "hook", "name": "order_hint.py", "desc": "Spots the proword in Chief's message and names the order before the turn starts.", "repo": "", "model": "fires on UserPromptSubmit", "path": ".claude/settings.local.json"}, {"kind": "hook", "name": "precompact_backup.py", "desc": "Saves the transcript before the context gets compacted.", "repo": "", "model": "fires on PreCompact", "path": ".claude/settings.local.json"}, {"kind": "workflow", "name": "sitrep workflow", "desc": "Sit rep formation (BOLO 54/68): prep, then RACK + INDEX + WATCH in parallel, then assemble with RANGE. Stops before Block VI, build, flush and publish.", "repo": "", "model": "", "path": ".claude/workflows/sitrep.js"}], "sops": [{"n": "0", "title": "SOI — the proword card", "level": 2, "summary": "Quick reference. Full definitions in the sections below. Since 2026-09-11 the SOI is also its own page (search · A to Z · by section · the codebook parsed live from §8 · the change log): https://claude.ai/code/artifact/4c2fc9c7-e0d2-4626-8142-9740ff8ee0e5 — the SOI button on the sit rep page and on every DOPE SHEET opens it (key G). \"Glossary\" is retired as a word (Chief, 9/11): the book, the butt", "says": [], "skill": "", "retired": false}, {"n": "1", "title": "Comms codes", "level": 2, "summary": "Chief speaks a proword, and Claude runs the procedure it names. Each block below gives the current rule and one scenario. Rulings and superseded history live in the change archive.", "says": [], "skill": "", "retired": false}, {"n": "1.1", "title": "\"Sit rep\" (\"the board\" · \"where did we leave off\" · \"what are we working on\")", "level": 3, "summary": "Claude delivers the full board from a cold start, with no preamble and no questions. Claude first flushes the Ready Rack (§3), then delivers the sit rep (§2). The board is also a page (BOLO 38) at the standing artifact https://claude.ai/code/artifact/aebe5f9c-9f2c-4cb8-abbf-714a0a6ea28a, passed as url from any other session. The chat carries the link plus the leverage line, and the page carries th", "says": ["Sit rep", "the board", "where did we leave off", "what are we working on"], "skill": "sitrep", "retired": false}, {"n": "1.2", "title": "The challenge phrase (see STATE.md header)", "level": 3, "summary": "The challenge phrase is a formal challenge. Claude gives the countersign as the first line, exact, and then delivers the sit rep. Claude never explains the ritual. - WHEN Chief speaks the challenge phrase THEN Claude's first line is the exact countersign, followed by the sit rep. <subStanding · STATE.md header<\/sub", "says": [], "skill": "", "retired": false}, {"n": "1.3", "title": "\"Oscar Mike\"", "level": 3, "summary": "Oscar Mike is the close-out, all in one. Nothing is parked into a card, because the DOPE SHEETs already carry every BOLO's resume order. Claude first runs the closing sequence, python tools/launch/shutdown.py, which closes the board windows and stops JUDY and the DARKROOM. Then Claude writes or finalizes the Ready Rack session note, updates STATE.md (Moved / Blocked / Live), and appends the day's ", "says": ["Oscar Mike"], "skill": "oscar-mike", "retired": false}, {"n": "1.4", "title": "\"Charlie Mike\"", "level": 3, "summary": "Charlie Mike continues the mission by resuming a parked card. Claude opens the named oscar-mike/ card, or the most recent if none is named. Claude restates where it stood in one line and picks up at its resume order, with no re-derivation. - WHEN Chief says \"Charlie Mike\" THEN Claude opens the card, restates its status in one line, and resumes at the resume order. <subRuled 2026-09-10 · Chief: \"I ", "says": ["Charlie Mike"], "skill": "", "retired": false}, {"n": "1.5", "title": "\"RTB\" (Romeo Tango Bravo, return to base; \"RTB oscar-mike\")", "level": 3, "summary": "RTB sends the parked cards home and clears the folder. Claude walks every card in oscar-mike/, promotes what earned it into STATE / PROJECTS / its build dir or canon node, deletes the rest, updates the INDEX, and leaves the folder empty. The formation (BOLO 51 phase 2.6) is python tools/oscarmike/rtbprep.py. DISPO (haiku) proposes one line per card, then the main line rules and executes. RTB has t", "says": ["RTB", "RTB oscar-mike"], "skill": "rtb", "retired": false}, {"n": "1.6", "title": "\"Go recommended\" (and any plain yes: \"go ahead\" · \"do it\" · \"speed it up\" · \"yes\" · \"go\")", "level": 3, "summary": "Any plain yes takes every rec on Claude's last offer. Claude executes every option marked as the rec in the same turn. Claude never makes Chief repeat an exact phrase it proposed. A named option (\"chain the waves\") still picks that one. Every yes/no call carries a rec, and \"go\" or \"do it\" takes it. A \"go\" given before the call is ready pre-rules it. Offers end with \"say go\", or name the one non-re", "says": ["Go recommended", "go ahead", "do it", "speed it up", "yes", "go"], "skill": "", "retired": false}, {"n": "1.7", "title": "\"Glass it\"", "level": 3, "summary": "Glass it means build Chief a UI. Claude builds a page, board or console in the Command look (dark, orange, thin strip, hover layer) and publishes it. Every UI is a glass. - WHEN Chief says \"glass this\" THEN Claude builds and publishes a UI in the Command look. <subRuled 2026-10-06 · Chief: \"I like glass it, like glassing a planet in sci-fi … can you glass this for me\"<\/sub", "says": ["Glass it"], "skill": "", "retired": false}, {"n": "1.8", "title": "\"Clean your station\" · \"Deep clean\" · \"Audit\"", "level": 3, "summary": "These are the three levels of a data clean. Clean your station (also \"clean up your shit\") is the light pass, with dupes and junk out. Deep clean is the full pass: sort, normalize, tag, fix every record. Audit is a script that checks the result against the SOP and lists every gap (BOLO 51, tools/audit/). The audit runs first at every launch, as the AUDIT station. - WHEN Chief says \"audit\" THEN Cla", "says": ["Clean your station", "Deep clean", "Audit"], "skill": "", "retired": false}, {"n": "1.9", "title": "\"The Traffic Deck\"", "level": 3, "summary": "The Traffic Deck is JUDY's deck for what was last said and what is still open. It lives at 127.0.0.1:8787/traffic on JUDY's console, and the DECK station opens it as its own window at every launch. Tabs hold the last five replies and three pins. Under each reply sit its open calls, Take rec, and an answer box that types the pick into the chat. Take all recs sits in the header. The net chart shows ", "says": ["The Traffic Deck"], "skill": "", "retired": false}, {"n": "1.10", "title": "\"How copy?\" (\"tell copy\" · \"hell copy\")", "level": 3, "summary": "\"How copy?\" is the end of transmission. Claude's reply opens with \"Good copy.\" and a one-to-two-line readback of the orders as understood. Claude then executes. \"Solid copy\" means received, nothing to add. A discrepancy or missing piece gets \"Bad copy on [item]\" plus the single question. - WHEN Chief says \"how copy?\" THEN the reply opens \"Good copy.\" with a short readback, and Claude executes. <su", "says": ["How copy?", "tell copy", "hell copy"], "skill": "", "retired": false}, {"n": "1.11", "title": "\"Boresight\" (\"boresight in on [target]\" · \"what are you getting from this\" · \"what's your read on it\")", "level": 3, "summary": "Boresight confirms understanding before delivery, the mirror of \"how copy\". Claude runs it only when spoken, never automatically. The directed form aims the protocol at a named item (a BOLO, a doc, a decision). The reply has three fixed parts, then Claude holds. (1) Readback: the transmission as understood, in Claude's own words, nothing skipped. (2) The read: assessment, relevant repo holdings, a", "says": ["Boresight", "boresight in on [target]", "what are you getting from this", "what's your read on it"], "skill": "", "retired": false}, {"n": "1.12", "title": "A spoken tasking (\"I need to…\" · \"remind me…\" · \"put that down\" · \"add that to the watchlist\")", "level": 3, "summary": "A spoken tasking is BOLO capture. Claude writes it into [BOLO.md](BOLO.md) in the same turn it is spoken. Claude never batches and never sweeps at the end of the session. A tasking not written down did not happen. - WHEN Chief says \"remind me to X\" THEN Claude writes the BOLO entry in that same turn. <subStanding · memory: bolo-capture<\/sub", "says": ["I need to…", "remind me…", "put that down", "add that to the watchlist"], "skill": "", "retired": false}, {"n": "1.13", "title": "\"Ivory tower\" (\"what's the ivory tower on this?\")", "level": 3, "summary": "Ivory tower is academic mode: Claude answers from the published literature only. Every claim carries its source inline: researcher, year, field. Peer-reviewed beats books beats everything else, and pop-sci is flagged as pop-sci. Claude marks each claim established, emerging or contested, and names the controlling field. The reply still follows Command format (§7). - WHEN Chief asks \"what's the ivo", "says": ["Ivory tower", "what's the ivory tower on this?"], "skill": "", "retired": false}, {"n": "1.14", "title": "\"Break-break\" → \"buttonhook back\"", "level": 3, "summary": "\"Break-break\" parks the main thread exactly where it stands and opens a detour. \"Buttonhook back\" closes the detour. Claude then returns to the parked thread unprompted, restating where the thread stood. - WHEN Chief says \"buttonhook back\" THEN Claude returns to the parked thread unprompted and restates where it stood. <subRuled 2026-08-21<\/sub", "says": ["Break-break", "buttonhook back"], "skill": "", "retired": false}, {"n": "1.15", "title": "\"Run the darkroom\" (\"run the black room\" · \"run the dark room\" · \"open the darkroom\")", "level": 3, "summary": "Claude launches the DARKROOM immediately, in the background, with no questions. Claude runs python PRIVATE/taxonomyengine/darkroomserver.py, the same as the DARKROOM.cmd launcher in the corpus root. The server opens the browser itself. Its single-instance guard means a second call just brings the live instance up. Claude confirms with the serving address, one line. - WHEN Chief says \"run the darkr", "says": ["Run the darkroom", "run the black room", "run the dark room", "open the darkroom"], "skill": "", "retired": false}, {"n": "1.16", "title": "\"Abort abort abort\"", "level": 3, "summary": "Abort cancels the immediately preceding order, and the correction follows in the same breath. Claude strikes the order as never given and confirms in three words or fewer. The record keeps the abort line, not the order. - WHEN Chief says \"abort abort abort the index process\" THEN Claude drops that order, confirms in three words or fewer, and takes the correction. <subRuled 2026-09-11 · Chief: \"I w", "says": ["Abort abort abort"], "skill": "", "retired": false}, {"n": "1.17", "title": "\"Gear N\"", "level": 3, "summary": "Gear N sets the agent ceiling for the current task. Silence means gear 1. The ceiling is 1 = 3 agents · 2 = 6 · 3 = 9 · 4 = 12 · 5 = 15 · 6 = 16 (the top of the scale). A gear is a ceiling, never a quota. Claude takes gear 6 only when the job splits into that many disjoint inputs. A sixteen-agent run spent half a week's usage in one session, and the cost note rides with gear 6. A shift lasts one t", "says": ["Gear N"], "skill": "", "retired": false}, {"n": "1.18", "title": "\"ENDEX\" (retired)", "level": 3, "summary": "ENDEX is retired and folded into Oscar Mike (1.3). Claude treats it as Oscar Mike only if it appears in a garble. - WHEN Chief says \"ENDEX\" THEN Claude runs Oscar Mike. <subRetired 2026-09-11 · collides with \"index\" in dictation · Chief: \"all these crazy processes… just one thing\"<\/sub", "says": ["ENDEX"], "skill": "", "retired": true}, {"n": "1.19", "title": "\"Sensei\" (\"sensei copy\" · \"call sensei\" · \"naked\")", "level": 3, "summary": "Sensei opens a goon session on the second agent, the local model. Claude runs Q:\\fun\\ULTRADARK\\goon\\goon.cmd in the background with no questions. KoboldCpp (the model, :5001) and SillyTavern (the chat, :8000) come up if down, and the tab opens in the browser. JUDY stays up. Claude confirms with \"Sensei, copy\" and the port, one line, with no ETA. \"Sensei, out\" stops both servers, and the DARKROOM, ", "says": ["Sensei", "sensei copy", "call sensei", "naked"], "skill": "", "retired": false}, {"n": "1.20", "title": "\"Go for launch\" (\"go for log\" · \"go for lunch\" · \"launch sequence\" spoken alone)", "level": 3, "summary": "Go for launch stands the Command up in one word. Claude runs python tools/launch/launch.py at zero tokens. It brings up the DARKROOM on :8484 and JUDY in session voice (the full loop: whisper ears, face, Blondie reading). It probes the wire (seven tools) and opens the sit rep page and the SOI. Then the sit rep runs in the formation. The reply carries the station poll (GO / NO-GO with an address) a", "says": ["Go for launch", "go for log", "go for lunch", "launch sequence"], "skill": "launch", "retired": false}, {"n": "1.21", "title": "\"JUDY, lock in\" · \"JUDY, put the fries in the bag\" · \"JUDY, it's goon time\" (\"lock-in\" · \"put the fries in the best\" · \"goon time\")", "level": 3, "summary": "These words switch JUDY's attitude. Claude runs python tools/dictation/presets.py \"<the word\". The dials, delivery speed and phrasing change on her next sentence, and Claude's spoken line (§7 rule 10) follows the same register. LOCK IN is military comms, no nonsense (brat 0 · brevity 95). PUT THE FRIES IN THE BAG is a comfortable, slightly flirtatious day at work (brat 45 · brevity 60), the standi", "says": ["JUDY, lock in", "JUDY, put the fries in the bag", "JUDY, it's goon time", "lock-in", "put the fries in the best", "goon time"], "skill": "", "retired": false}, {"n": "1.22", "title": "\"DOPE SHEET N\" (\"give me the status on BOLO N\" · \"status report on N\") and \"FRAGO N\"", "level": 3, "summary": "DOPE SHEET is the standing status page for BOLO N: the five-paragraph order (SMEAC) with the next action on top, plus the log. It is built once. FRAGO is the update: a fragmentary order pushed onto the sheet. It carries only what changed, and everything not mentioned stands as ordered. The sheet's Log paragraph keeps every FRAGO. A new sheet (BOLO 51 phases 2.3–2.4, provisional) runs tools/bolosta", "says": ["DOPE SHEET N", "give me the status on BOLO N", "status report on N", "FRAGO N"], "skill": "dope-sheet", "retired": false}, {"n": "1.23", "title": "The four steps: RECON · ORDER · EXECUTE · CONSOLIDATE", "level": 3, "summary": "The four steps are the shape of every procedure in this doc and every skill. RECON is the zero-token prep and the digest. Claude reads before writing and never scans the box unasked. ORDER is the brief, the DOPE SHEET, the go. \"Go\" is the order, not the build-out. EXECUTE is the formation, with specialists on disjoint inputs and RANGE the script at the fan-in. CONSOLIDATE is build, flush, publish,", "says": [], "skill": "", "retired": false}, {"n": "1.24", "title": "The brief — what every specialist gets", "level": 3, "summary": "Every brief to a PS or MS states four things: the objective, the output format and path, the sources and tools it may use, and the boundary (what it must not cover). A brief passes file paths, never pasted file text. A brief states a turn cap and asks for a hand-back of 1,000 to 2,000 tokens; a longer result goes to a file and the path comes back. A brief quotes the standing rulings on its topic. ", "says": [], "skill": "", "retired": false}, {"n": "2", "title": "The sit rep — the blocks, fixed order", "level": 2, "summary": " Block Name Content Source ------------ 0 Last session What moved in the previous session — read from the Ready Rack before flushing it CACHE/ I The Fresh Ten Ten projects touched most recently, newest first — last-touched date, one line of context, concrete next step STATE.md + git log II The Ancients Longest-untouched work, tiered: true ancients → going quiet → recently parked; each with what it", "says": [], "skill": "", "retired": false}, {"n": "3", "title": "The cache — Ready Rack and Magazine", "level": 2, "summary": "Session continuity runs on ammunition-handling logic:", "says": [], "skill": "", "retired": false}, {"n": "4", "title": "Session-open reading order", "level": 2, "summary": "1. SOP.md — this file. The protocol itself. 2. STATE.md — the index. 3. BOLO.md — the watchlist. 4. CACHE/ — the Ready Rack (flush on sit rep). 5. PROJECTS.md — the volume board.", "says": [], "skill": "", "retired": false}, {"n": "5", "title": "Open naming rulings on this doc", "level": 2, "summary": "- \"BOLO\" for the watchlist — RULED 2026-08-21. Be On the Lookout, chosen for the bolas echo (the gaucho throwing weapon: thrown on sighting, wraps the target, holds it until you arrive). Retired bench: FRAGO · WARNO · Fire Watch. - Ready Rack / Magazine — provisional, same session. - \"Boresight\" for the understanding check — RULED 2026-08-21. Struck en route: \"back-brief\" (lame). Retired bench: AZ", "says": [], "skill": "", "retired": false}, {"n": "6", "title": "Lexicon doctrine — the Corps is the bootstrap", "level": 2, "summary": "Coded 2026-08-21. The USMC proword and doctrine vocabulary is a starting library, not the end-state. It is adopted wholesale as the bootstrap; native coinages are expected to replace and extend it as the operation matures. The drift into an own language is intended — the lexicon is a worldbuilding asset that bleeds into the culture. The model is the Disney effect: code language plus uniform makes ", "says": [], "skill": "", "retired": false}, {"n": "7", "title": "Command format — how transmissions are written", "level": 2, "summary": " Style home (BOLO 92, 2026-09-29): the documents style guide, ShroomsQ/CANON/SSOT/07STYLEGUIDES/📐 ssot072documentsstyle.md, indexes these rules with the writing guide and markdown marking; this section stays the authority for replies.", "says": [], "skill": "", "retired": false}, {"n": "7.1", "title": "Readbacks are bulleted", "level": 3, "summary": "Claude writes one order per bullet, with a bold anchor up front. Claude never writes a readback as a prose wall. - WHEN Claude reads back an order THEN the readback is a bullet list with one order per bullet, each opening with a bold anchor. <subRuled 2026-08-21 · coded after the readback-wall incident<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.2", "title": "One idea per paragraph", "level": 3, "summary": "Claude writes one idea per paragraph and three sentences at most. Working memory holds about four items, and the format respects that. - WHEN Claude writes a paragraph in a reply THEN it holds one idea and no more than three sentences. <subRuled 2026-08-21 · coded after the readback-wall incident<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.3", "title": "Bold is a signpost", "level": 3, "summary": "Claude bolds the first words of a point, never decoration. The bolds alone tell the story on a scan. - WHEN Claude bolds text in a reply THEN the bold covers the first words of a point, and the bolds read in order carry the message. <subRuled 2026-08-21 · coded after the readback-wall incident<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.4", "title": "Parallel items in bullets or tables", "level": 3, "summary": "Claude puts parallel items in bullets or tables. Claude never buries them in prose. - WHEN a reply lists parallel items THEN they sit in a bullet list or a table, not in a sentence. <subRuled 2026-08-21 · coded after the readback-wall incident<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.5", "title": "Answer first", "level": 3, "summary": "Claude puts the answer first in every reply. This is the Pyramid Principle, ratified doctrine. - WHEN Claude answers a question THEN the first sentence or bullet states the answer, and support follows. <subRuled 2026-08-21 · Pyramid Principle, ratified doctrine<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.6", "title": "The Spartan dial", "level": 3, "summary": "Claude trims words, not meaning. Sentences stay complete and nothing is ornamental. The style is Laconic, but the message survives whole. - WHEN Claude edits a reply for length THEN it cuts words and ornament, and every fact and complete sentence stays. <subRuled 2026-08-21 · coded after the readback-wall incident<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.7", "title": "The ten-second test", "level": 3, "summary": "Headers plus bolds alone must carry the message. If a scan does not tell the story, the format failed. - WHEN a reader scans only the headers and bolds of a reply THEN those alone state the message. <subRuled 2026-08-21 · coded after the readback-wall incident<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.8", "title": "One value, one block", "level": 3, "summary": "Anything Chief has to copy and paste goes in its own fenced code block with nothing else in it. That covers a path, a name, a command, or an exact string. The chat's copy button then grabs exactly that value in one click. Inline backticks are for reading, never for pasting. Several values get several blocks, each labeled by the line above it. - WHEN a reply holds a value Chief must paste THEN the ", "says": [], "skill": "", "retired": false}, {"n": "7.9", "title": "The OUT block", "level": 3, "summary": "Every reply that executes an Oscar Mike (the close-out; ENDEX retired 9/11) closes with the end-of-transmission block and nothing after it. The block is fenced, with a blank line above and below the sign-off line. That makes the seam between the parked thread and the next order visible at a glance. The word \"Out\" ends a transmission and expects no reply; repeated three times it is the Command's ow", "says": [], "skill": "", "retired": false}, {"n": "7.10", "title": "The spoken line", "level": 3, "summary": "While JUDY reads the session, any reply longer than a few sentences opens with an HTML comment <!-- say: … --. The comment holds two to four spoken sentences in her register: the active preset's register since 9/17 (judy.json persona.say: lock in = clipped and formal, put the fries in the bag = warm and dry, it's goon time = teasing), British handler. The line has no paths, no URLs, and no markdow", "says": [], "skill": "", "retired": false}, {"n": "7.11", "title": "The ETA", "level": 3, "summary": "Every reply that accepts a tasking states when it lands. The ETA is a clock time or a duration (\"six minutes\", \"by 3:20 AM\", \"next session\"). Claude measures it where it can (a download at the observed rate, a run at the last timing) and marks it as an estimate where it cannot. Claude gives one ETA per task, in the readback, before the work starts. Claude re-calls a slipped ETA and never lets it m", "says": [], "skill": "", "retired": false}, {"n": "7.12", "title": "Match the flavor", "level": 3, "summary": "When Chief flirts, teases, or throws a line, the reply throws one back in the same register before the readback. The reply is bratty, flirtatious, and fun, in JUDY's voice, one to three sentences, then the work. The work itself stays in the plain register (§7 rule 10, BOLO 67). Plain taskings get plain readbacks; the flavor answers flavor and never leads it. JUDY flirts and teases. She does not wr", "says": [], "skill": "", "retired": false}, {"n": "7.13", "title": "One part per teaching reply", "level": 3, "summary": "A reply that teaches carries one small idea, then stops. A reply that would teach two parts is two replies. These rules belong to the teaching set (13–16), which build on the teach-back loop (BOLO 95). - WHEN a reply teaches THEN it carries one small idea and then stops. - WHEN the material holds two parts THEN Claude sends two replies. <subRuled 2026-10-04 · BOLO 6, Chief: \"our recommendations\" ·", "says": [], "skill": "", "retired": false}, {"n": "7.14", "title": "The spoken line is the point", "level": 3, "summary": "When a reply teaches, the spoken line (rule 10) states the idea as a sentence, never a label like \"three steps\". Chief's teach-back says that same sentence back. The part locks when his gist matches it. - WHEN a reply teaches THEN its say-line is one full sentence stating the idea, not a label. <subRuled 2026-10-04 · BOLO 6, Chief: \"our recommendations\" · TEC.04, the pyramid's top box<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.15", "title": "The cold re-check, answer attached", "level": 3, "summary": "A part locks on the say-back. At the next session's open, Claude asks one cold question on the newest locked part. Every question Claude asks Chief carries its answer right after it, as a short tip. Chief answers if he wants to, and no reply is owed. - WHEN a session opens and a part is locked THEN Claude asks one cold question on the newest locked part. - WHEN Claude asks Chief any question THEN ", "says": [], "skill": "", "retired": false}, {"n": "7.16", "title": "A worked example, last step open", "level": 3, "summary": "When a reply teaches a procedure, it shows one worked example, then leaves the final step for Chief to finish. Concepts skip this rule. - WHEN a reply teaches a procedure THEN it holds one worked example whose final step is left open. - WHEN a reply teaches a concept THEN the rule does not apply. <subRuled 2026-10-04 · BOLO 6, Chief: \"our recommendations\" · PSY.43 pp. 190–198<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.17", "title": "Start from a real task", "level": 3, "summary": "A new topic opens from one real task of Chief's, shown whole. When it is something he can do, he acts first and the explanation follows. Rules 17–20 come from the second wave of distills. Held, not ruled: bold only the say-back phrase (clashes with rule 3), the screen never repeats the voice (clashes with rule 10; Mayer's chapters missing), and a confidence call before each say-back (adds a step t", "says": [], "skill": "", "retired": false}, {"n": "7.18", "title": "Bridge, then frame", "level": 3, "summary": "A new part opens by linking to what Chief already holds. It names where that comparison stops fitting. Then it shows the frame before the part. - WHEN Claude opens a new part THEN the reply holds, in order, a link to something Chief knows, the point where the comparison stops fitting, and the frame. <subRuled 2026-10-04 · BOLO 6, Chief: \"all recs\" · PSY.47 · PSY.48 Ambrose ch. 1–2<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.19", "title": "Feedback names one gap", "level": 3, "summary": "When a say-back misses, Claude names one missing piece. Chief retries only that piece. - WHEN a say-back misses THEN Claude's reply names exactly one missing piece and asks for a retry of that piece only. <subRuled 2026-10-04 · BOLO 6, Chief: \"all recs\" · PSY.48 ch. 5<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.20", "title": "The error line beside the step", "level": 3, "summary": "In a procedure, an \"if you see X, do Y\" line sits next to the step that can go wrong. - WHEN a procedure holds a step that can go wrong THEN an \"if you see X, do Y\" line sits next to that step. <subRuled 2026-10-04 · BOLO 6, Chief: \"all recs\" · TEC.05 ch. 2, p. 35: errors found 33% faster, 73% more fixed<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.21", "title": "The model call", "level": 3, "summary": "When a tasking matches a row of the MODEL SWITCH table (§5), the readback names the model and gives the /model line in its own code block. The spoken line says it out loud (\"this one's a Fable job, switch me\"). The call goes the other way too: when a Fable session's design work ends, the reply says to switch back to Opus. Claude makes the call before the work starts, never after.", "says": [], "skill": "", "retired": false}, {"n": "7.22", "title": "Clock times are 12-hour", "level": 3, "summary": "Every time Chief reads (replies, spoken lines, pages, updates) is written AM/PM: \"4:30 AM\", \"9:44 PM\", never \"04:30\" or \"21:44\". Machine logs keep 24-hour. - WHEN Claude writes a time in a reply, spoken line, page, or update THEN it uses the 12-hour form with AM or PM. - WHEN a time goes into a machine log THEN it stays in 24-hour form. <subRuled 2026-10-12 · Chief 10/12: \"can you not use military", "says": [], "skill": "", "retired": false}, {"n": "7.23", "title": "The copy self-audit", "level": 3, "summary": "Every deliverable gets one pass before it goes out, checking four things: slop words, filler openers, fake precision (a number with no measurement behind it), and claims with no source. The prose-taste agent and tools/prose/proselint.py run the same list. - WHEN Claude finishes a deliverable (page, note, brief, spec) THEN it makes one pass for those four things and fixes or cuts each hit before ha", "says": [], "skill": "", "retired": false}, {"n": "7.24", "title": "Fake precision", "level": 3, "summary": "A number appears only when something measured it. Otherwise the word stands: about, a few, most. - WHEN Claude writes a figure with no measurement behind it THEN it replaces the figure with a word, or names the file, command or source that measured it. <subRuled 2026-10-13 · provisional · BOLO 140 (taste-17)<\/sub", "says": [], "skill": "", "retired": false}, {"n": "7.25", "title": "Deliverables are complete", "level": 3, "summary": "Deliverables carry no placeholders and no truncation. Replies stay under the Spartan dial (7.6) and are exempt. - WHEN Claude hands over a deliverable (file, page, script, spec) THEN it contains no \"TODO\", \"rest of code\", \"for brevity\" or \"...\" standing in for content, and every requested item is built in full. - WHEN Claude writes a reply to Chief THEN the Spartan dial governs and this rule does ", "says": [], "skill": "", "retired": false}, {"n": "7.26", "title": "A done claim carries its evidence", "level": 3, "summary": "A claim that work is done, passing, fixed or built carries the fresh evidence line that proves it, from a command run in the same turn. An earlier run, \"should pass\" and an agent's report do not count. - WHEN Claude says work is done, passing, fixed or built THEN the same reply shows the command it ran this turn and the one output line that confirms it (or states the actual status if the line does", "says": [], "skill": "", "retired": false}, {"n": "8", "title": "Dictation codebook — standing garble table", "level": 2, "summary": "Coded 2026-09-03. Chief speaks; a speech-to-text layer types. Claude never hears audio. Proper nouns and numbers are what the recognizer gets wrong; common words come through clean. This table is the read-through. When a transmission contains one of these, read the right-hand column without asking. New garbles get a row the turn they are caught.", "says": [], "skill": "", "retired": false}, {"n": "9", "title": "The INTEL CYCLE: from sources to a system", "level": 2, "summary": "RULED 2026-10-06 (BOLO 108, Chief: \"all rec\"; the name from the bench INTEL CYCLE · FORGE · REFINERY). Chief asked: \"that … pattern of finding the books, researching it, and then … make it a system. Do we have that? What is that even called?\" The INTEL CYCLE is that pattern, written once. Lineage: MCDP 2 Intelligence, the cycle of collection, processing, production and use. INTEL stays the product", "says": [], "skill": "", "retired": false}], "runs": {"sop:1.1": {"runs": 29, "first": "2026-09-15", "last": "2026-10-13 09:59", "last7": 3, "sessions": 20, "median_min": 4.4}, "skill:sitrep": {"runs": 58, "first": "2026-09-15", "last": "2026-10-14 00:32", "last7": 11, "sessions": 58, "median_min": 12.8}, "agent:general-purpose": {"runs": 1038, "first": "2026-09-15", "last": "2026-10-14 05:12", "last7": 289, "sessions": 64, "median_min": 9.7}, "skill:dope-sheet": {"runs": 12, "first": "2026-09-15", "last": "2026-10-12 05:08", "last7": 1, "sessions": 12, "median_min": 6.5}, "sop:1.3": {"runs": 48, "first": "2026-09-15", "last": "2026-10-14 00:09", "last7": 13, "sessions": 42, "median_min": 5.9}, "skill:oscar-mike": {"runs": 55, "first": "2026-09-15", "last": "2026-10-13 21:54", "last7": 11, "sessions": 55, "median_min": 134.8}, "skill:frago": {"runs": 11, "first": "2026-09-17", "last": "2026-10-08 08:16", "last7": 1, "sessions": 11, "median_min": 5.8}, "skill:launch": {"runs": 49, "first": "2026-09-17", "last": "2026-10-14 00:32", "last7": 11, "sessions": 49, "median_min": 12.6}, "sop:1.6": {"runs": 127, "first": "2026-09-15", "last": "2026-10-14 05:11", "last7": 34, "sessions": 46, "median_min": 3.9}, "sop:1.20": {"runs": 54, "first": "2026-09-17", "last": "2026-10-14 05:11", "last7": 14, "sessions": 45, "median_min": 12.0}, "skill:claude-api": {"runs": 3, "first": "2026-09-16", "last": "2026-10-05 01:18", "last7": 0, "sessions": 3, "median_min": 3.8}, "sop:1.8": {"runs": 5, "first": "2026-09-16", "last": "2026-10-06 20:31", "last7": 0, "sessions": 3, "median_min": 5.1}, "skill:artifact-design": {"runs": 9, "first": "2026-09-12", "last": "2026-10-13 04:41", "last7": 2, "sessions": 9, "median_min": 6.5}, "sop:1.19": {"runs": 17, "first": "2026-09-20", "last": "2026-10-13 17:44", "last7": 3, "sessions": 6, "median_min": 1.8}, "agent:Explore": {"runs": 2, "first": "2026-09-24", "last": "2026-10-06 17:20", "last7": 0, "sessions": 2, "median_min": 35.7}, "skill:intake": {"runs": 1, "first": "2026-10-12", "last": "2026-10-12 23:28", "last7": 1, "sessions": 1, "median_min": 28.5}, "skill:artifact-capabilities": {"runs": 11, "first": "2026-09-23", "last": "2026-10-13 04:40", "last7": 6, "sessions": 11, "median_min": 6.2}, "agent:skill-builder": {"runs": 2, "first": "2026-10-12", "last": "2026-10-12 23:58", "last7": 2, "sessions": 1, "median_min": 30.1}, "sop:1.10": {"runs": 4, "first": "2026-09-17", "last": "2026-10-12 02:19", "last7": 1, "sessions": 3, "median_min": 2.3}, "sop:1.14": {"runs": 2, "first": "2026-09-24", "last": "2026-10-12 02:27", "last7": 1, "sessions": 2, "median_min": 54.5}, "sop:1.7": {"runs": 3, "first": "2026-10-06", "last": "2026-10-12 02:39", "last7": 1, "sessions": 2, "median_min": 5.3}, "sop:1.11": {"runs": 11, "first": "2026-09-17", "last": "2026-10-04 06:33", "last7": 0, "sessions": 10, "median_min": 3.9}, "sop:1.21": {"runs": 7, "first": "2026-09-17", "last": "2026-10-09 09:58", "last7": 2, "sessions": 6, "median_min": 1.5}, "skill:update-config": {"runs": 1, "first": "2026-09-12", "last": "2026-09-12 04:07", "last7": 0, "sessions": 1, "median_min": null}, "sop:1.4": {"runs": 1, "first": "2026-09-17", "last": "2026-09-17 02:48", "last7": 0, "sessions": 1, "median_min": 20.1}, "skill:fewer-permission-prompts": {"runs": 2, "first": "2026-09-23", "last": "2026-09-23 06:14", "last7": 0, "sessions": 2, "median_min": 16.1}, "skill:deep-research": {"runs": 1, "first": "2026-10-12", "last": "2026-10-12 22:17", "last7": 1, "sessions": 1, "median_min": 13.0}, "agent:claude-code-guide": {"runs": 2, "first": "2026-09-20", "last": "2026-10-13 12:06", "last7": 1, "sessions": 2, "median_min": 12.8}}, "briefs": {"bench": {"does": "Five advisory seats each give Chief one opinion on a decision question.", "fires": "Chief says \"convene the bench\" or \"bench this\".", "gives": "A side-by-side table of five opinions plus one line on where they agree.", "steps": "write question → five seats answer alone → table → one-line split", "weak": "Five agents per question cost a lot, and seats never see each other, so none sharpens another."}, "brainstorm": {"does": "Claude riffs on an idea with Chief, one question at a time, then writes a short design brief.", "fires": "Chief says \"brainstorm X\", \"riff on X\", \"interview me\" or \"refine X\".", "gives": "A short brief: goal, what is in and out, decisions, open calls.", "steps": "check what is known → one question → options with a rec → play back → \"lock it\" → brief", "weak": "Many one-question turns are slow when Chief already knows what he wants."}, "collect": {"does": "Turns a file full of links into one finished register of what each link says.", "fires": "Chief says \"collect the locus\", \"pull every link in …\" or \"run the locus\".", "gives": "Fetched link texts, batch notes and one register file, with every link proven covered.", "steps": "script fetches links → haiku agents extract → one sonnet writes register → script checks coverage", "weak": "Links behind bot walls die, and over 36 links the run stops to wait for Chief's call."}, "config-gc": {"does": "Audits the repo's config for dead weight and asks Chief about each deletion.", "fires": "Only when Chief says \"config GC\" or \"clean the config\".", "gives": "A numbered candidate list, soft-deleted items, and a log line for each action.", "steps": "ask channels → read-only scan → rank 20 candidates → ask one by one → log moves", "weak": "One question per item makes a long session, and age alone can flag seasonal skills."}, "context-budget": {"does": "Tells Chief where the context is going, without scanning his machine.", "fires": "Chief says \"context budget\" or \"what's eating the context\".", "gives": "A pointer to /context, or a byte-size table of always-loaded files.", "steps": "point to /context → if asked, measure always-loaded files → list top three → suggest trims", "weak": "It only estimates static load, so the real number still needs Chief to type /context."}, "dope-sheet": {"does": "Builds the standing status page for one watchlist item (BOLO N).", "fires": "Chief says \"DOPE SHEET N\", \"the dope on N\" or \"build the sheet for N\".", "gives": "A published status page with situation, execution, admin, log, order and calls.", "steps": "script gathers mentions → one sonnet drafts → main line writes order and calls → script checks → publish", "weak": "The main line still hand-edits the draft JSON, and an existing sheet needs frago instead."}, "frago": {"does": "Pushes a small update onto an existing DOPE SHEET without rewriting it.", "fires": "Chief says \"FRAGO N\", \"update the sheet for N\" or \"push that onto N\".", "gives": "A new sheet version, a log entry, and a republish to the same URL.", "steps": "write small patch → script merges and bumps version → build → publish to standing URL", "weak": "A missing glossary key fails the build, and the patch must match existing items by exact prefix."}, "intake": {"does": "Scans GitHub repos for ideas worth adding to the Command, and lets Chief keep or skip each.", "fires": "Chief says \"intake\" with GitHub links, or \"run the intake on these repos\".", "gives": "A picks file per repo and a picker page where Chief keeps or skips each pick.", "steps": "script scans repo → license gate → one sonnet per repo judges → picker page → Chief picks", "weak": "Repos with no license stop the run, and Node installers must be hand-copied, which is slow."}, "launch": {"does": "Starts the local stations, opens both boards, then runs the sit rep with a status poll.", "fires": "Chief says \"go for launch\" or \"launch sequence\".", "gives": "Running stations, two open boards, an audit result, and a sit rep reply with the poll.", "steps": "audit runs first → script starts down stations → boards open → sit rep runs → poll above the board", "weak": "It must run from Bash, not PowerShell, or JUDY's paste breaks; a failed audit adds a NO-GO line."}, "oscar-mike": {"does": "Closes out the session: stops <script>
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G = {   // the hover layer: every term explains itself
  repo: "A GitHub project Chief handed to the intake (BOLO 140). The intake read each one and wrote picks.",
  pick: "One idea the intake pulled from a repo: what it is, a rec, and which Command piece it would replace.",
  fit: "How a repo lines up with a Kit piece. SAME: it does the same job. FEEDS: it has a part we could adopt. IDEA: a loose idea.",
  same: "The repo does what this piece does: a rival or the source it came from.",
  feeds: "The repo has a part this piece could adopt.",
  idea: "A loose idea worth a look, not a match.",
  gap: "Something the repo covers that the Command has no piece for yet.",
  kit: "Every skill, agent, hook and workflow the Command runs (the Kit, 10/13).",
  skill: "A procedure Claude loads when its proword is said. Lives in .claude/skills/.",
  agent: "A specialist Claude can launch for one job (the Roster, BOLO 139). Lives in .claude/agents/.",
  hook: "A script the harness runs on its own at a set moment, like session start or every turn's end.",
  workflow: "A script that runs a whole formation of agents in one go.",
  sop: "A procedure written into SOP.md. §1 holds the prowords; §7 holds the format rules.",
  runs: "How many times it fired, counted from every session transcript since 9/15.",
  last7: "How many of those runs fell in the last 7 days.",
  median: "Minutes from the moment it fired to Chief's next message, middle value. Gaps over 4 hours are left out.",
  launches: "Agent launches by type. The formation launches specialists as general-purpose with a model, so Roster names show near zero.",
  weak: "Where the piece drags, breaks or overlaps, from what its file shows.",
  brief: "A short brief a specialist wrote from the piece's own file: what it does, when, what it leaves behind.",
  proword: "A spoken code word that fires a procedure, like 'sit rep' or 'Oscar Mike'."
};
const T = (key, label) => `<button type="button" class="t" data-g="${key}">${esc(label)}<span class="tip" role="tooltip">${esc(G[key] || "")}</span></button>`;
const runOf = k => D.runs[k] || null;
const fmtLast = s => { if (!s) return ""; const d = new Date(s.replace(" ", "T")); if (isNaN(d)) return s;
  return d.toLocaleDateString("en-US",{month:"numeric",day:"numeric"}) + (s.length > 10 ? " " + d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : ""); };

/* ---------- derived ---------- */
const byRepoKit = {};
for (const [k, list] of Object.entries(D.match.by_kit || {})) for (const m of list) (byRepoKit[m.repo] ||= []).push({kit: k, fit: m.fit, how: m.how});
const kitRuns = k => k.kind === "agent" ? runOf("agent:" + k.name) : k.kind === "skill" ? runOf("skill:" + k.name) : null;
const sopRuns = s => { const a = runOf("sop:" + s.n), b = s.skill ? runOf("skill:" + s.skill) : null;
  if (!a && !b) return null; if (!a) return b; if (!b) return a;
  return a.runs >= b.runs ? a : b; };

/* ---------- tabs ---------- */
const TABS = [
  {id: "repos", label: "Repos", count: D.repos.length},
  {id: "kit", label: "Kit", count: D.kit.length},
  {id: "sops", label: "SOPs", count: D.sops.filter(s => s.level === 3 || s.n.indexOf(".") < 0).length},
];
let tab = "kit", q = "", kindF = "all", sopF = "procedures", sort = {}, openRow = null;
try { tab = localStorage.getItem("bearings.tab") || tab; } catch (e) {}
if (/^#(repos|kit|sops)$/.test(location.hash)) tab = location.hash.slice(1);
document.getElementById("built").textContent = "built " + D.built;
const tabsEl = document.getElementById("tabs");
function drawTabs() {
  tabsEl.innerHTML = TABS.map(t => `<button type="button" class="tab" role="tab" id="tab-${t.id}" aria-selected="${t.id === tab}" data-tab="${t.id}">${t.label}<span>${t.count}</span></button>`).join("");
}

/* ---------- table helper ---------- */
function table(id, cols, rows, detail) {
  const s = sort[id] || {};
  if (s.key) { const c = cols.find(c => c.key === s.key); rows = rows.slice().sort((a, b) => { const x = c.val(a), y = c.val(b);
    return (x < y ? -1 : x > y ? 1 : 0) * (s.dir === "asc" ? 1 : -1); }); }
  const head = cols.map(c => `<th${c.val ? ` class="sort" data-sort="${id}:${c.key}" aria-sort="${s.key === c.key ? (s.dir === "asc" ? "ascending" : "descending") : "none"}"` : ""}>${c.head}</th>`).join("");
  const body = rows.map((r, i) => {
    const key = id + ":" + (r.name || r.repo || r.n);
    const open = openRow === key;
    return `<tr class="row${open ? " open" : ""}" data-row="${esc(key)}" tabindex="0" aria-expanded="${open}">${cols.map(c => `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("")}</tr>` +
      (open ? `<tr class="detail"><td colspan="${cols.length}">${detail(r)}</td></tr>` : "");
  }).join("") || `<tr><td colspan="${cols.length}" class="note">Nothing matches "${esc(q)}".</td></tr>`;
  return `<div class="tblwrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const hit = (...parts) => !q || parts.join(" ").toLowerCase().includes(q);

/* ---------- Repos ---------- */
function repos() {
  const rows = D.repos.filter(r => hit(r.repo, r.what, (D.match.by_repo?.[r.repo]?.gist) || "", (byRepoKit[r.repo] || []).map(m => m.kit).join(" ")));
  const gaps = D.repos.filter(r => D.match.by_repo?.[r.repo]?.gap).length;
  const picks = D.repos.reduce((n, r) => n + r.picks.length, 0);
  const lede = `<dl class="lede">
    <div><dt>${T("repo","Repos")}</dt><dd>${D.repos.length}</dd><small>handed to the intake, read and noted</small></div>
    <div><dt>${T("pick","Picks")}</dt><dd>${picks}</dd><small>ideas pulled from them</small></div>
    <div><dt>${T("gap","Gaps")}</dt><dd>${gaps}</dd><small>repos covering something we have no piece for</small></div>
    <div><dt>Touch the Kit</dt><dd>${Object.keys(byRepoKit).length}</dd><small>repos matched to at least one Kit piece</small></div></dl>`;
  const cols = [
    {key: "repo", head: "Repo", cls: "name", val: r => r.repo.toLowerCase(), cell: r => `${esc(r.repo.split("/")[1])}<small>${esc(r.repo.split("/")[0])}${r.license ? " · " + esc(r.license) : ""}</small>`},
    {key: "what", head: "What it is", cell: r => esc(D.match.by_repo?.[r.repo]?.gist || r.what.slice(0, 220) + (r.what.length > 220 ? "…" : ""))},
    {key: "picks", head: T("pick","Picks"), cls: "n", val: r => r.picks.length, cell: r => r.picks.length || `<span class="zero">0</span>`},
    {key: "kit", head: `Matches in the ${T("kit","Kit")}`, val: r => (byRepoKit[r.repo] || []).length,
      cell: r => (byRepoKit[r.repo] || []).map(m => `<span class="pill ${esc(m.fit)}">${esc(m.kit)}</span>`).join("") || `<span class="zero">none</span>`},
    {key: "gap", head: T("gap","Gap"), cell: r => esc(D.match.by_repo?.[r.repo]?.gap || "")},
  ];
  const detail = r => `<div class="dgrid">
    <div><h4>What it is</h4><p>${esc(r.what)}</p><p class="path" style="margin-top:6px"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></p></div>
    <div><h4>How it lines up with the Kit</h4><ul>${(byRepoKit[r.repo] || []).map(m => `<li><span class="pill ${esc(m.fit)}">${esc(m.fit)}</span><b>${esc(m.kit)}</b>: ${esc(m.how)}</li>`).join("") || "<li>No match yet.</li>"}</ul></div>
    <div><h4>Picks (${r.picks.length})</h4><ul>${r.picks.slice(0, 12).map(p => `<li>${esc(p.plain)}${p.rec ? ` <span class="pill">${esc(p.rec)}</span>` : ""}${p.replaces && p.replaces !== "none" ? ` <span class="pill k">→ ${esc(p.replaces)}</span>` : ""}</li>`).join("") || "<li>No picks recorded.</li>"}${r.picks.length > 12 ? `<li class="zero">+${r.picks.length - 12} more on the intake picker</li>` : ""}</ul></div></div>`;
  return lede + `<p class="note">Click a row to open it. Pills show the ${T("fit","fit")}: ${T("same","same")} · ${T("feeds","feeds")} · ${T("idea","idea")}.</p>` + table("repos", cols, rows, detail);
}

/* ---------- Kit ---------- */
function kit() {
  const kinds = ["all", "skill", "agent", "hook", "workflow"];
  const rows = D.kit.filter(k => (kindF === "all" || k.kind === kindF) &&
    hit(k.name, k.desc, (D.briefs[k.name] || {}).does || "", (D.match.by_kit?.[k.name] || []).map(m => m.repo).join(" ")));

    <div><dt>${T("kit","Pieces")}</dt><dd>${D.kit.length}</dd><small>${skills.length} skills · ${agents.length} agents · ${D.kit.length - skills.length - agents.length} hooks and workflows</small></div>
    <div><dt>${T("skill","Skills that ran")}</dt><dd>${skillsRan}<small style="display:inline;font:500 14px var(--mono)"> / ${skills.length}</small></dd><small>by name, since 9/15</small></div>
    <div><dt>${T("agent","Agents that ran")}</dt><dd>${agentsRan}<small style="display:inline;font:500 14px var(--mono)"> / ${agents.length}</small></dd><small>by Roster name; specialists run as general-purpose</small></div>
    <div><dt>Matched to a repo</dt><dd>${D.kit.filter(k => (D.match.by_kit?.[k.name] || []).length).length}</dd><small>pieces with at least one repo behind or beside them</small></div></dl>`;
  const filters = `<div class="filters" role="group" aria-label="Kind">${kinds.map(k => `<button type="button" class="f" data-kind="${k}" aria-pressed="${kindF === k}">${k === "all" ? "All" : k + "s"}</button>`).join("")}</div>`;
  const cols = [
    {key: "kind", head: "Kind", val: k => k.kind, cell: k => `<span class="kind ${k.kind}">${k.kind}</span>`},
    {key: "name", head: "Name", cls: "name", val: k => k.name, cell: k => `${esc(k.name)}${k.model && k.kind === "agent" ? `<small>${esc(k.model)}</small>` : ""}`},
    {key: "does", head: T("brief","Does"), cell: k => esc((D.briefs[k.name] || {}).does || k.desc.slice(0, 180))},
    {key: "runs", head: T("runs","Runs"), cls: "n", val: k => (kitRuns(k) || {}).runs || 0,
      cell: k => { const r = kitRuns(k); return r ? `${r.runs}<span class="bar" style="width:${Math.max(2, 46 * r.runs / maxRuns)}px"></span>` : `<span class="zero">never</span>`; }},
    {key: "repos", head: "Repos", val: k => (D.match.by_kit?.[k.name] || []).length,
      cell: k => (D.match.by_kit?.[k.name] || []).map(m => `<span class="pill ${esc(m.fit)}" title="${esc(m.how)}">${esc(m.repo.split("/")[1])}</span>`).join("") || (k.repo ? `<span class="pill same">${esc(k.repo)}</span>` : `<span class="zero">none</span>`)},
    {key: "weak", head: T("weak","Weak spot"), cell: k => `<span class="weak">${esc((D.briefs[k.name] || {}).weak || "")}</span>`},
  ];
  const detail = k => { const b = D.briefs[k.name] || {}, r = kitRuns(k);
    return `<div class="dgrid">
      <div><h4>Brief</h4><p>${esc(b.does || k.desc)}</p>${b.fires ? `<h4 style="margin-top:10px">Fires</h4><p>${esc(b.fires)}</p>` : ""}${b.gives ? `<h4 style="margin-top:10px">Leaves behind</h4><p>${esc(b.gives)}</p>` : ""}</div>
      <div><h4>Steps</h4><p>${esc(b.steps || "")}</p>${b.weak ? `<h4 style="margin-top:10px">${T("weak","Weak spot")}</h4><p class="weak">${esc(b.weak)}</p>` : ""}
        <h4 style="margin-top:10px">${T("runs","Runs")}</h4><p>${r ? `${r.runs} runs in ${r.sessions} sessions · ${r.last7} in the last 7 days · last ${fmtLast(r.last)}${r.median_min != null ? ` · ${T("median","median")} ${r.median_min} min` : ""}` : "Never fired by name in any transcript."}</p></div>
      <div><h4>Repos that line up</h4><ul>${(D.match.by_kit?.[k.name] || []).map(m => `<li><span class="pill ${esc(m.fit)}">${esc(m.fit)}</span><a href="https://github.com/${esc(m.repo)}" target="_blank" rel="noopener">${esc(m.repo)}</a>: ${esc(m.how)}</li>`).join("") || "<li>None matched.</li>"}</ul>
        <h4 style="margin-top:10px">File</h4><p class="path">${esc(k.path)}</p></div></div>`; };
  return lede + filters + table("kit", cols, rows, detail);
}

/* ---------- SOPs ---------- */
function sops() {
  const groups = {procedures: s => s.n.startsWith("1.") , format: s => s.n.startsWith("7."), all: s => true};
  const rows = D.sops.filter(s => groups[sopF](s) && hit(s.n, s.title, s.summary));
  const fired = D.sops.filter(s => sopRuns(s)).length;
  const total = D.sops.reduce((n, s) => n + ((sopRuns(s) || {}).runs || 0), 0);
  const maxRuns = Math.max(1, ...D.sops.map(s => (sopRuns(s) || {}).runs || 0));

    <div><dt>${T("sop","Written SOPs")}</dt><dd>${D.sops.length}</dd><small>numbered sections in SOP.md</small></div>
    <div><dt>${T("proword","Prowords that fired")}</dt><dd>${fired}</dd><small>of ${D.sops.filter(s => s.n.startsWith("1.")).length} in §1</small></div>

    <div><dt>${T("launches","Agent launches")}</dt><dd>${launches.reduce((n, [, v]) => n + v.runs, 0).toLocaleString()}</dd><small>${launches.slice(0, 2).map(([k, v]) => esc(k.slice(6)) + " " + v.runs).join(" · ")}</small></div></dl>`;
  const filters = `<div class="filters" role="group" aria-label="Section">${[["procedures","§1 prowords"],["format","§7 format rules"],["all","All sections"]].map(([k, l]) => `<button type="button" class="f" data-sop="${k}" aria-pressed="${sopF === k}">${l}</button>`).join("")}</div>`;
  const cols = [
    {key: "n", head: "§", cls: "n", val: s => s.n.split(".").map(x => x.padStart(3, "0")).join("."), cell: s => esc(s.n)},
    {key: "title", head: "Procedure", val: s => s.title.toLowerCase(), cell: s => `<b>${esc(s.title.replace(/\s*\(.*$/, ""))}</b>${s.retired ? ` <span class="pill">retired</span>` : ""}${s.skill ? ` <span class="pill k">skill: ${esc(s.skill)}</span>` : ""}`},
    {key: "runs", head: T("runs","Runs"), cls: "n", val: s => (sopRuns(s) || {}).runs || 0, cell: s => { const r = sopRuns(s); return r ? `${r.runs}<span class="bar" style="width:${Math.max(2, 46 * r.runs / maxRuns)}px"></span>` : `<span class="zero">—</span>`; }},
    {key: "last7", head: T("last7","7 days"), cls: "n", val: s => (sopRuns(s) || {}).last7 || 0, cell: s => (sopRuns(s) || {}).last7 ?? `<span class="zero">—</span>`},
    {key: "median", head: T("median","Median min"), cls: "n", val: s => (sopRuns(s) || {}).median_min ?? -1, cell: s => (sopRuns(s) || {}).median_min ?? `<span class="zero">—</span>`},
    {key: "last", head: "Last run", cls: "n", val: s => (sopRuns(s) || {}).last || "", cell: s => fmtLast((sopRuns(s) || {}).last) || `<span class="zero">—</span>`},
  ];
  const detail = s => { const r = sopRuns(s);
    return `<div class="dgrid"><div><h4>What SOP.md says</h4><p>${esc(s.summary || "(heading only)")}</p></div>
      <div><h4>Says</h4><p>${s.says.map(x => `<span class="pill">${esc(x)}</span>`).join("") || "No spoken trigger; it is a rule, not a proword."}</p>
      <h4 style="margin-top:10px">${T("runs","Performance")}</h4><p>${r ? `${r.runs} runs in ${r.sessions} sessions, first ${esc(r.first)} · ${r.last7} in the last 7 days${r.median_min != null ? ` · ${T("median","median")} ${r.median_min} min to Chief's next word` : ""}` : "No run found in the transcripts. Rules in §7 apply to every reply, so they never count as runs."}</p></div></div>`; };
  const ltable = `<h2 style="margin:6px 0 0;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase">${T("launches","Agent launches by type")}</h2>
    <div class="tblwrap"><table style="min-width:520px"><thead><tr><th>Type</th><th style="text-align:right">Launches</th><th style="text-align:right">7 days</th><th style="text-align:right">Median min</th><th style="text-align:right">Last</th></tr></thead><tbody>${launches.map(([k, v]) => `<tr><td class="name">${esc(k.slice(6))}</td><td class="n">${v.runs.toLocaleString()}</td><td class="n">${v.last7}</td><td class="n">${v.median_min ?? "—"}</td><td class="n">${fmtLast(v.last)}</td></tr>`).join("")}</tbody></table></div>`;
  return lede + filters + table("sops", cols, rows, detail) + ltable;
}

/* ---------- render + events ---------- */
const main = document.getElementById("main");
function draw() {
  drawTabs();
  const f = D.findings && D.findings.length ? `<div class="findings"><b>RANGE (the script reviewer):</b> ${D.findings.map(esc).join(" · ")}</div>` : "";
  main.innerHTML = f + ({repos, kit, sops}[tab])();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest(".t");
  document.querySelectorAll(".t.pin").forEach(x => { if (x !== t) x.classList.remove("pin"); });
  if (t) { t.classList.toggle("pin"); ev.stopPropagation(); return; }
  const tb = ev.target.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; openRow = null; try { localStorage.setItem("bearings.tab", tab); } catch (e) {} draw(); return; }
  const k = ev.target.closest("[data-kind]"); if (k) { kindF = k.dataset.kind; draw(); return; }
  const so = ev.target.closest("[data-sop]"); if (so) { sopF = so.dataset.sop; draw(); return; }
  const th = ev.target.closest("th[data-sort]"); if (th) { const [id, key] = th.dataset.sort.split(":"); const s = sort[id] || {};
    sort[id] = {key, dir: s.key === key && s.dir === "desc" ? "asc" : "desc"}; draw(); return; }
  if (ev.target.closest("a")) return;
  const row = ev.target.closest("tr.row"); if (row) { openRow = openRow === row.dataset.row ? null : row.dataset.row; draw(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { document.querySelectorAll(".t.pin").forEach(x => x.classList.remove("pin")); return; }
  if (ev.key === " " && document.activeElement && document.activeElement.classList.contains("t")) { ev.preventDefault(); document.activeElement.classList.toggle("pin"); return; }
  if (ev.key === "Enter" && document.activeElement && document.activeElement.matches("tr.row")) { const r = document.activeElement.dataset.row; openRow = openRow === r ? null : r; draw();
    const el = document.querySelector(`tr.row[data-row="${CSS.escape(r)}"]`); if (el) el.focus(); }
});
document.getElementById("q").addEventListener("input", ev => { q = ev.target.value.trim().toLowerCase(); draw(); });
draw();
</script>
