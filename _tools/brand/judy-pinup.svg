             C37 34 36.5 36 37.5 38.5
             C40 40.5 42 42.5 42.5 45
             C41 49 36.5 52 32 52
             C27.5 52 23 49 21.5 45
             C22 42.5 24 40.5 26.5 38.5
             C27.5 36 27 33 25.5 30
             C24.5 27 25 23.5 27 21.5
             Z"/>
