<title>WARROOM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* WATCH register · DAY face — positive polarity for a lit room (MIL-STD-1472H 5.2.2.6; FAA HF-STD-001B 5.3.2.1.6) */
    --bg: #ECE5DF;
    --panel: #F5F0EC;
    --panel-2: #E2D9D3;
    --line: #CFC1BA;
    --line-2: #B8A79F;
    --ink: #372A2F;
    --ink-2: #5A4B51;
    --ink-3: #7E6E75;
    --accent: #8A1F44;
    --accent-soft: #EED4DD;
    --link: #2B5F9E;
    --link-soft: #D6E2F1;
    --good: #2E6B3F;
    --good-soft: #D7E6DA;
    --warn: #7A5D06;
    --warn-soft: #F0E4BF;
    --bad: #B03A22;
    --bad-soft: #F0D6CE;
    --help: #55627A;
    --mark: #F3E6B4;
    --focus: #2B5F9E;
    --shadow: 0 8px 24px rgba(34, 22, 25, 0.16);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --display: "Fraunces", "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    color-scheme: light dark;
  }
  /* contrast control (MIL-STD-1472H 5.2.2.7c): soft ≈7:1 · standard ≈10:1 · high ≈13:1 */
  :root[data-contrast="soft"] { --ink: #4A3C42; --ink-2: #6A5B61; }
  :root[data-contrast="high"] { --ink: #221619; --ink-2: #4A3B41; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      /* WATCH register · NIGHT face — negative polarity for a dark room; black ≤ 2 cd/m² (FAA 5.3.1.9.7), text ≈10:1, never white */
      --bg: #1C191B; --panel: #221E21; --panel-2: #2C2629; --line: #3C3539; --line-2: #4F464B;
      --ink: #CFC6C8; --ink-2: #A0959A; --ink-3: #7B7176;
      --accent: #D25A82; --accent-soft: #3B1E2B;
      --link: #6CC3D9; --link-soft: #1B3038;
      --good: #7EC38F; --good-soft: #1F3326;
      --warn: #D9B65A; --warn-soft: #3A3118;
      --bad: #E58A70; --bad-soft: #3D2119;
      --help: #9AA7B8; --mark: #4A3F1E; --focus: #6CC3D9;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    :root:not([data-theme="light"])[data-contrast="soft"] { --ink: #B5ABAE; --ink-2: #8E8388; }
    :root:not([data-theme="light"])[data-contrast="high"] { --ink: #E6DEE0; --ink-2: #B3A8AD; }
  }
  :root[data-theme="dark"] {
    --bg: #1C191B; --panel: #221E21; --panel-2: #2C2629; --line: #3C3539; --line-2: #4F464B;
      --ink: #CFC6C8; --ink-2: #A0959A; --ink-3: #7B7176;
      --accent: #D25A82; --accent-soft: #3B1E2B;
      --link: #6CC3D9; --link-soft: #1B3038;
      --good: #7EC38F; --good-soft: #1F3326;
      --warn: #D9B65A; --warn-soft: #3A3118;
      --bad: #E58A70; --bad-soft: #3D2119;
      --help: #9AA7B8; --mark: #4A3F1E; --focus: #6CC3D9;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
  }
  :root[data-theme="dark"][data-contrast="soft"] { --ink: #B5ABAE; --ink-2: #8E8388; }
  :root[data-theme="dark"][data-contrast="high"] { --ink: #E6DEE0; --ink-2: #B3A8AD; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--link); }
  code { font-family: var(--mono); font-size: 0.86em; background: var(--panel-2); padding: 0 4px; border-radius: 3px; }
  mark.rm { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- frame ---------- */
  .app {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 360px;
    grid-template-rows: 48px minmax(0, 1fr);
    height: 100vh;
  }
  header.top {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header.top h1 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
  header.top .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
  header.top .nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .ib {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-2);
    font-family: var(--mono); font-size: 11px; padding: 5px 9px; border-radius: 4px; cursor: pointer;
  }
  .ib:hover { border-color: var(--line-2); color: var(--ink); }
  .ib[disabled] { opacity: 0.4; cursor: default; }
  .ib kbd { color: var(--ink-3); margin-left: 5px; }

  /* ---------- outliner ---------- */
  nav.outliner { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px 0; }
  .o-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 6px 16px 4px; }
  .o-row {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; padding: 6px 12px 6px 10px; border: 0; border-left: 3px solid transparent;
    background: transparent; color: var(--ink-2); font-family: var(--serif); font-size: 14.5px; cursor: pointer;
  }
  .o-row:hover { background: var(--panel-2); color: var(--ink); }
  .o-row.active { border-left-color: var(--accent); color: var(--ink); background: var(--panel-2); }
  .o-row .mono-g {
    font-family: var(--mono); font-size: 11px; font-weight: 500; text-align: center;
    border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 0; color: var(--ink-2);
  }
  .o-row.active .mono-g { border-color: var(--accent); color: var(--accent); }
  .o-row .hk { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .o-row .t-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o-pins { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; }
  .o-pin { display: flex; align-items: center; gap: 8px; padding: 4px 16px; font-size: 13px; }
  .o-pin .t { flex: 1; }
  .o-pin button { appearance: none; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-family: var(--mono); font-size: 11px; }
  .o-pin.hl { background: var(--accent-soft); }
  .o-empty { padding: 4px 16px; font-size: 12px; color: var(--ink-3); font-style: italic; }

  /* ---------- the sheet ---------- */
  main.sheet { overflow-y: auto; padding: 28px 40px 80px; }
  .measure { max-width: 72ch; margin: 0 auto; }
  .identity { display: grid; grid-template-columns: 84px 1fr; gap: 20px; align-items: start; }
  .portrait {
    width: 84px; height: 84px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 30px; font-weight: 600; color: var(--accent);
    box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--line);
  }
  .portrait.small { width: 30px; height: 30px; font-size: 13px; box-shadow: none; border-radius: 4px; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .title { font-family: var(--display); font-size: clamp(26px, 3.2vw, 34px); line-height: 1.1; margin: 4px 0 8px; text-wrap: balance; font-weight: 600; }
  .thesis { font-size: 18px; line-height: 1.55; margin: 0; color: var(--ink); }
  .ageline { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--help); display: flex; gap: 14px; flex-wrap: wrap; }
  .ageline b { color: var(--ink-2); font-weight: 500; }

  .row-label { margin: 28px 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .row-label h2 { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
  .row-label .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .row-label .hint { font-size: 14px; color: var(--help); font-style: italic; margin-left: auto; }

  .traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .trait {
    display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start;
    border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px; background: var(--panel);
    font-size: 14px; line-height: 1.3; cursor: default; text-align: left; color: var(--ink); font-family: var(--serif);
  }
  .trait:hover, .trait:focus-visible { border-color: var(--accent); }
  .trait .sq {
    width: 26px; height: 26px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
    font-family: var(--mono); font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center;
  }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill {
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; background: var(--panel);
    font-size: 14px; color: var(--ink-2); cursor: default; display: inline-flex; gap: 6px; align-items: center; font-family: var(--serif);
  }
  .skill:hover, .skill:focus-visible { border-color: var(--link); color: var(--ink); }
  .skill i { font-style: normal; color: var(--link); font-family: var(--mono); font-size: 11px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 30px; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--ink-2); font-family: var(--serif);
    font-size: 14px; padding: 8px 12px 9px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab .n { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: 5px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--ink); }
  .pane { padding-top: 18px; }
  .pane[hidden] { display: none; }

  .concept { margin: 0 0 16px; }
  .concept h3 { margin: 0 0 3px; font-size: 16px; font-weight: 600; }
  .concept p { margin: 0; color: var(--ink); }
  .vtable { width: 100%; border-collapse: collapse; font-size: 16px; }
  .vtable th { text-align: left; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--line); }
  .vtable td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .vtable td:first-child { white-space: nowrap; font-weight: 600; width: 1%; padding-right: 18px; }
  blockquote.q { margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-2); }
  blockquote.q p { margin: 0; font-size: 16px; }
  blockquote.q .cap { display: block; margin-top: 4px; font-size: 14px; color: var(--help); font-style: italic; }
  .app-item { margin: 0 0 12px; }
  .app-item b { font-weight: 600; }
  .more { appearance: none; border: 1px dashed var(--line-2); background: transparent; color: var(--ink-2); font-family: var(--mono); font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

  .check-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .signed { font-family: var(--mono); font-size: 20px; font-weight: 500; }
  .signed.pos { color: var(--good); } .signed.neg { color: var(--bad); } .signed.zero { color: var(--ink-3); }
  .check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .check input { margin: 4px 0 0; accent-color: var(--good); }
  .check.on { color: var(--ink-3); }
  .check.on span { text-decoration: line-through; text-decoration-color: var(--good); }
  .check-note { font-size: 14px; color: var(--help); font-style: italic; margin-top: 8px; }
  .redlist { display: flex; flex-direction: column; gap: 4px; }
  .red { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 16px; color: var(--ink); }
  .red i { font-style: normal; color: var(--bad); font-family: var(--mono); }

  .cited { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 14px; }
  .cited .list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 8px 3px 4px; background: var(--panel); font-size: 12.5px; color: var(--ink-2); cursor: pointer; font-family: var(--serif);
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip .g { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 4px; color: var(--ink-2); }
  .chip.feed .g { color: var(--accent); border-color: var(--accent); }

  /* ---------- terms + tooltips ---------- */
  .t { color: var(--link); cursor: pointer; border-bottom: 1px dotted transparent; }
  .t:hover, .t.open { border-bottom-color: var(--link); }
  .t.hl { background: var(--link-soft); }
  .tip {
    position: fixed; z-index: 50; max-width: 400px; min-width: 250px;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: var(--shadow);
    padding: 10px 12px 10px; font-size: 15px; line-height: 1.5; color: var(--ink);
  }
  .tip.locked { border-color: var(--accent); }
  .tip .th { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .tip .th b { font-size: 15px; font-weight: 600; }
  .tip .th .lock { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .tip .sense { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; padding: 4px 0; border-top: 1px solid var(--line); }
  .tip .sense:first-of-type { border-top: 0; }
  .tip .sense .g { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; text-align: center; padding: 1px 0; margin-top: 3px; }
  .tip .sense .g.reader { color: var(--accent); border-color: var(--accent); }
  .tip .appears { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tip .appears .lab { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 2px; }
  .tip .appears .g { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 5px; color: var(--ink-2); cursor: pointer; }
  .tip .appears .g:hover { border-color: var(--accent); color: var(--accent); }
  .tip .why { margin: 0; }
  .tip .why b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-top: 6px; }
  .tip .why b.do { color: var(--good); } .tip .why b.not { color: var(--bad); }
  .tip .openg { display: block; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--link); cursor: pointer; }

  /* ---------- glossary panel ---------- */
  aside.glossary { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .g-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .g-head .eyebrow { display: flex; justify-content: space-between; }
  .g-head input {
    width: 100%; font-family: var(--serif); font-size: 14px; padding: 7px 10px; border: 1px solid var(--line-2);
    border-radius: 4px; background: var(--bg); color: var(--ink);
  }
  .g-cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cat { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 3px; cursor: pointer; }
  .cat.on { border-color: var(--accent); color: var(--accent); }
  .g-body { overflow-y: auto; flex: 1; min-height: 0; }
  .g-list { padding: 6px 0; }
  .g-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 5px 14px; font-size: 15px; cursor: pointer; border-left: 3px solid transparent; }
  .g-row:hover { background: var(--panel-2); }
  .g-row.on { border-left-color: var(--accent); background: var(--panel-2); }
  .g-row .srcs { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .g-row .srcs.reader { color: var(--accent); }
  .g-count { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); padding: 6px 14px 0; }
  .g-entry { padding: 14px 14px 30px; }
  .g-entry h2 { font-family: var(--display); font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .g-entry .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .g-entry .meta button { appearance: none; border: 0; background: transparent; color: var(--link); font-family: var(--mono); font-size: 10.5px; cursor: pointer; padding: 0; }
  .g-entry .sense { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .g-entry .sense .g { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-radius: 3px; text-align: center; padding: 2px 0; color: var(--ink-2); height: fit-content; cursor: pointer; }
  .g-entry .sense .g.reader { color: var(--accent); border-color: var(--accent); }
  .g-entry .sense .kind { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-top: 3px; }
  .g-entry .appears { margin-top: 12px; }
  .g-entry .appears .lab { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
  .g-entry .list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .g-hist { display: flex; gap: 4px; flex-wrap: wrap; }
  .g-hist .hh { appearance: none; border: 0; background: var(--panel-2); color: var(--ink-2); font-family: var(--serif); font-size: 12px; padding: 2px 8px; border-radius: 3px; cursor: pointer; }

  .kbd-help { position: fixed; bottom: 10px; right: 372px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .kbd-help kbd { color: var(--ink-2); }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px minmax(0, 1fr) 300px; }
    .kbd-help { display: none; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 48px auto minmax(0, 1fr) auto; height: auto; min-height: 100vh; }
    nav.outliner { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding: 6px; gap: 4px; }
    .o-label, .o-pins, .o-row .hk, .o-row .t-name { display: none; }
    .o-row { grid-template-columns: 34px; padding: 4px; }
    main.sheet { padding: 20px 18px 40px; overflow: visible; }
    aside.glossary { border-left: 0; border-top: 1px solid var(--line); max-height: 60vh; }
    .tip { max-width: calc(100vw - 24px); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>WARROOM</h1>
    <span class="sub">MCDP 1 to 8 · eleven one-sheets · BVX-LEARN · 1.0 accepted 2026-09-06</span>
    <div class="nav">
      <button class="ib" id="back" type="button" title="Back">←<kbd>B</kbd></button>
      <button class="ib" id="fwd" type="button" title="Forward">→<kbd>N</kbd></button>
      <button class="ib" id="contrast" type="button" title="Text contrast: soft / standard / high">contrast</button>
      <button class="ib" id="theme" type="button" title="Day for a lit room, night for a dark one">theme</button>
    </div>
  </header>

  <nav class="outliner" id="outliner"></nav>

  <main class="sheet" id="sheet"><div class="measure" id="sheetBody"></div></main>

  <aside class="glossary">
    <div class="g-head">
      <div class="eyebrow"><span>Glossary · the register</span><span id="gCount"></span></div>
      <input id="gSearch" type="search" placeholder="Search terms   /" autocomplete="off">
      <div class="g-cats" id="gCats"></div>
      <div class="g-hist" id="gHist"></div>
    </div>
    <div class="g-body" id="gBody"></div>
  </aside>
</div>
<div class="kbd-help"><kbd>Alt</kbd>+1…0,- sheets · <kbd>/</kbd> search · hover term, <kbd>Space</kbd> locks · <kbd>Esc</kbd> closes · <kbd>B</kbd>/<kbd>N</kbd> history</div>

<script>
var DATA = /*__DATA__*/;
</script>
<script>
(function () {
  'use strict';
  var sheets = DATA.sheets, terms = DATA.terms;
  var byId = {}; sheets.forEach(function (s) { byId[s.id] = s; });
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function store(k, v) { try { localStorage.setItem('codex.' + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem('codex.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }

  function mono(s) { var m = /MCDP\s+([\d-]+)/.exec(s.title || ''); return m ? m[1] : s.id.replace('MIL.', ''); }
  function shortTitle(s) { return (s.title || '').replace(/^MCDP\s+[\d-]+\s*[—–-]?\s*/, ''); }
  function plainText(h) { var d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; }

  /* ---------- history ---------- */
  var hist = [], hpos = -1;
  function push(state) {
    if (hpos >= 0 && JSON.stringify(hist[hpos]) === JSON.stringify(state)) return;
    hist = hist.slice(0, hpos + 1); hist.push(state); hpos = hist.length - 1; syncNav();
  }
  function go(state) {
    if (state.type === 'sheet') showSheet(state.id, state.tab, true);
    else if (state.type === 'term') showTerm(state.key, true);
  }
  function back() { if (hpos > 0) { hpos--; go(hist[hpos]); syncNav(); } }
  function fwd() { if (hpos < hist.length - 1) { hpos++; go(hist[hpos]); syncNav(); } }
  function syncNav() { $('back').disabled = hpos <= 0; $('fwd').disabled = hpos >= hist.length - 1; }

  /* ---------- outliner ---------- */
  var HK = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-'];
  var pins = load('pins', []);
  function renderOutliner() {
    var h = '<div class="o-label">Publications</div>';
    sheets.forEach(function (s, i) {
      h += '<button class="o-row" data-id="' + s.id + '" type="button"><span class="mono-g">' + esc(mono(s)) + '</span><span class="t-name">' + esc(shortTitle(s)) + '</span><span class="hk">' + (HK[i] || '') + '</span></button>';
    });
    h += '<div class="o-pins"><div class="o-label">Pinned terms</div>';
    if (!pins.length) h += '<div class="o-empty">Pin a term from its entry.</div>';
    pins.forEach(function (k) {
      var t = terms[k]; if (!t) return;
      h += '<div class="o-pin" data-k="' + esc(k) + '"><span class="t" data-t="' + esc(k) + '">' + esc(t.term) + '</span><button type="button" data-unpin="' + esc(k) + '" title="Unpin">×</button></div>';
    });
    h += '</div>';
    $('outliner').innerHTML = h;
    markActive();
  }
  function markActive() {
    var rows = $('outliner').querySelectorAll('.o-row');
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('active', rows[i].getAttribute('data-id') === current);
  }
  $('outliner').addEventListener('click', function (e) {
    var un = e.target.closest('[data-unpin]');
    if (un) { pins = pins.filter(function (k) { return k !== un.getAttribute('data-unpin'); }); store('pins', pins); renderOutliner(); return; }
    var r = e.target.closest('.o-row'); if (r) { showSheet(r.getAttribute('data-id')); }
  });

  /* ---------- the sheet ---------- */
  var current = null, currentTab = load('tab', 'concepts');
  var TABS = [['concepts', 'Core concepts'], ['vocab', 'Key vocabulary'], ['quotes', 'Quotes'], ['application', 'Application'], ['check', 'Self-check'], ['not', 'What does not work']];

  function citedBy(s) {
    return sheets.filter(function (o) { return o.id !== s.id && o.related.some(function (r) { return r.indexOf(s.id) >= 0; }); });
  }
  function definesUsedElsewhere(s) {
    var out = [];
    s.vocabulary.forEach(function (v) {
      var t = terms[v.term.toLowerCase()]; if (!t) return;
      var others = t.appears.filter(function (id) { return id !== s.id; });
      if (others.length) out.push({ term: t.term, key: v.term.toLowerCase(), n: others.length });
    });
    return out.sort(function (a, b) { return b.n - a.n; }).slice(0, 12);
  }

  function showSheet(id, tab, silent) {
    var s = byId[id]; if (!s) return;
    current = id; if (tab) currentTab = tab;
    store('sheet', id);
    var checks = load('check.' + id, {});
    var h = '';
    h += '<div class="identity"><div class="portrait">' + esc(mono(s)) + '</div><div>';
    h += '<div class="eyebrow">' + esc(s.id) + ' · ' + esc(s.bvx_id) + ' · ' + esc(s.domain || 'MILITARY DOCTRINE') + '</div>';
    h += '<h1 class="title">' + esc(s.title) + '</h1>';

    h += '</div></div>';

    h += '<div class="row-label"><h2>Invariants</h2><span class="n">' + s.invariants.length + '</span><span class="hint">hover a badge for the full statement</span></div><div class="traits">';

    });

    h += '<div class="row-label"><h2>Heuristics</h2><span class="n">' + s.heuristics.length + '</span><span class="hint">hover for do this / not this</span></div><div class="skills">';
    s.heuristics.forEach(function (r, i) {
      h += '<button class="skill" type="button" data-heur="' + i + '"><i>▸</i>' + r.situation + '</button>';
    });
    h += '</div>';

    h += '<div class="tabs">';
    TABS.forEach(function (t) {
      var n = { concepts: s.concepts.length, vocab: s.vocabulary.length, quotes: s.quotes.length, application: s.application.length, check: s.selfcheck.length, not: '' }[t[0]];
      h += '<button class="tab' + (t[0] === currentTab ? ' active' : '') + '" type="button" data-tab="' + t[0] + '">' + t[1] + (n !== '' ? '<span class="n">' + n + '</span>' : '') + '</button>';
    });
    h += '</div>';

    h += '<div class="pane" data-pane="concepts"' + (currentTab !== 'concepts' ? ' hidden' : '') + '>';
    s.concepts.forEach(function (c, i) { h += '<div class="concept"><h3>' + (i + 1) + '. ' + c.title + '</h3><p>' + c.body + '</p></div>'; });
    h += '</div>';

    h += '<div class="pane" data-pane="vocab"' + (currentTab !== 'vocab' ? ' hidden' : '') + '><table class="vtable"><tr><th>Term</th><th>Definition in this publication</th></tr>';
    s.vocabulary.forEach(function (v) { h += '<tr><td><span class="t" data-t="' + esc(v.term.toLowerCase()) + '">' + esc(v.term) + '</span></td><td>' + v.definition + '</td></tr>'; });
    h += '</table></div>';

    h += '<div class="pane" data-pane="quotes"' + (currentTab !== 'quotes' ? ' hidden' : '') + '>';
    s.quotes.forEach(function (q, i) {
      h += '<blockquote class="q"' + (i >= 6 ? ' data-over="1" hidden' : '') + '><p>“' + q.quote + '”</p>' + (q.caption ? '<span class="cap">' + q.caption + '</span>' : '') + '</blockquote>';
    });
    if (s.quotes.length > 6) h += '<button class="more" type="button" data-more="quotes">' + (s.quotes.length - 6) + ' more</button>';
    h += '</div>';

    h += '<div class="pane" data-pane="application"' + (currentTab !== 'application' ? ' hidden' : '') + '>';
    s.application.forEach(function (a) { h += '<p class="app-item">' + (a.lead ? '<b>' + a.lead + '</b> ' : '') + a.body + '</p>'; });
    h += '</div>';

    var done = s.selfcheck.filter(function (_, i) { return checks[i]; }).length;
    var signed = done - (s.selfcheck.length - done);
    h += '<div class="pane" data-pane="check"' + (currentTab !== 'check' ? ' hidden' : '') + '>';
    h += '<div class="check-head"><span class="signed ' + (signed > 0 ? 'pos' : signed < 0 ? 'neg' : 'zero') + '" id="signed">' + (signed > 0 ? '+' : '') + signed + '</span><span class="hint">' + done + ' of ' + s.selfcheck.length + ' held · checked minus unchecked</span></div>';
    s.selfcheck.forEach(function (c, i) {
      h += '<label class="check' + (checks[i] ? ' on' : '') + '"><input type="checkbox" data-chk="' + i + '"' + (checks[i] ? ' checked' : '') + '><span>' + c + '</span></label>';
    });
    if (s.selfcheck_note) h += '<div class="check-note">' + s.selfcheck_note + '</div>';
    h += '</div>';

    h += '<div class="pane" data-pane="not"' + (currentTab !== 'not' ? ' hidden' : '') + '><div class="redlist">';
    splitRed(s.doesnt_work).forEach(function (x) { h += '<div class="red"><i>−</i><span>' + x + '</span></div>'; });
    h += '</div></div>';

    var cb = citedBy(s), du = definesUsedElsewhere(s);
    h += '<div class="cited"><div class="row-label"><h2>Cited by</h2><span class="n">' + cb.length + '</span></div><div class="list">';
    cb.forEach(function (o) { h += '<button class="chip" type="button" data-open="' + o.id + '"><span class="g">' + esc(mono(o)) + '</span>' + esc(shortTitle(o)) + '</button>'; });
    if (!cb.length) h += '<span class="o-empty">No other sheet lists this one as related.</span>';
    h += '</div>';
    if (du.length) {
      h += '<div class="row-label"><h2>Terms defined here, used elsewhere</h2><span class="n">' + du.length + '</span></div><div class="list">';
      du.forEach(function (d) { h += '<button class="chip" type="button" data-term="' + esc(d.key) + '"><span class="g">' + d.n + '</span>' + esc(d.term) + '</button>'; });
      h += '</div>';
    }
    if (s.feeds && s.feeds.length) {
      h += '<div class="row-label"><h2>Feeds the operation</h2><span class="n">' + s.feeds.length + '</span></div><div class="list">';
      s.feeds.forEach(function (f) { h += '<span class="chip feed" title="' + esc(f.note || '') + '"><span class="g">' + esc(f.strength || '') + '</span>' + esc(f.layer || '') + (f.variable ? ' · ' + esc(f.variable) : '') + '</span>'; });
      h += '</div>';
    }
    h += '</div>';

    $('sheetBody').innerHTML = h;
    $('sheet').scrollTop = 0;
    markActive();
    if (!silent) push({ type: 'sheet', id: id, tab: currentTab });
    document.title = s.title + ' · WARROOM';
  }
  function splitRed(text) {
    var t = plainText(text).replace(/\.$/, '');
    return t.split(/,\s+|;\s+/).map(function (x) { return x.trim(); }).filter(Boolean).map(esc);
  }

  $('sheetBody').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (tab) {
      currentTab = tab.getAttribute('data-tab'); store('tab', currentTab);
      var tabs = $('sheetBody').querySelectorAll('.tab'); for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i] === tab);
      var panes = $('sheetBody').querySelectorAll('.pane'); for (var j = 0; j < panes.length; j++) panes[j].hidden = panes[j].getAttribute('data-pane') !== currentTab;
      if (hpos >= 0 && hist[hpos].type === 'sheet') hist[hpos].tab = currentTab;

    }
    var more = e.target.closest('[data-more]');
    if (more) { var over = $('sheetBody').querySelectorAll('[data-over]'); for (var k = 0; k < over.length; k++) over[k].hidden = false; more.remove(); return; }
    var open = e.target.closest('[data-open]');
    if (open) { showSheet(open.getAttribute('data-open')); return; }
    var tm = e.target.closest('[data-term]');
    if (tm) { showTerm(tm.getAttribute('data-term')); return; }
    var chk = e.target.closest('[data-chk]');
    if (chk) {
      var st = load('check.' + current, {}); st[chk.getAttribute('data-chk')] = chk.checked; store('check.' + current, st);
      chk.closest('.check').classList.toggle('on', chk.checked);
      var s = byId[current], done = s.selfcheck.filter(function (_, i) { return st[i]; }).length, signed = done - (s.selfcheck.length - done);
      var el = $('signed'); el.textContent = (signed > 0 ? '+' : '') + signed; el.className = 'signed ' + (signed > 0 ? 'pos' : signed < 0 ? 'neg' : 'zero');
      el.nextElementSibling.textContent = done + ' of ' + s.selfcheck.length + ' held · checked minus unchecked';
      return;
    }
  });

  /* ---------- tooltips (CK3 contract: hover opens, nest to depth 3, lock by timer or key, Esc closes) ---------- */
  var tips = [], showTimer = null, hideTimer = null, lockTimer = null;
  function tipTerm(key, depth) {
    var t = terms[key]; if (!t) return '';
    var h = '<div class="th"><b>' + esc(t.term) + '</b><span class="lock">hover 1.5 s or Space to lock</span></div>';
    t.senses.slice(0, 3).forEach(function (x) {
      var s = byId[x.source];
      h += '<div class="sense"><span class="g' + (x.kind === 'reader' ? ' reader' : '') + '" title="' + esc(x.kind === 'reader' ? 'reader mark, ' + x.source : 'author definition, ' + x.source) + '">' + esc(s ? mono(s) : x.source) + '</span><span>' + (depth < 3 ? x.sense : plainText(x.sense)) + '</span></div>';
    });
    if (t.senses.length > 3) h += '<div class="sense"><span class="g">+' + (t.senses.length - 3) + '</span><span class="o-empty" style="padding:0">more senses in the glossary</span></div>';
    if (t.appears.length) {
      h += '<div class="appears"><span class="lab">appears in</span>';
      t.appears.forEach(function (id) { var s = byId[id]; if (s) h += '<span class="g" data-open="' + id + '" title="' + esc(s.title) + '">' + esc(mono(s)) + '</span>'; });
      h += '</div>';
    }
    h += '<span class="openg" data-term="' + esc(key) + '">Open in glossary →</span>';
    return h;
  }
  function tipInv(i) {
    var inv = byId[current].invariants[i]; if (!inv) return '';
    return '<div class="th"><b>I' + (i + 1) + ' · ' + plainText(inv.lead) + '</b><span class="lock">Space locks</span></div><p class="why">' + inv.body + '</p>';
  }
  function tipHeur(i) {
    var r = byId[current].heuristics[i]; if (!r) return '';
    return '<div class="th"><b>' + plainText(r.situation) + '</b><span class="lock">Space locks</span></div><p class="why"><b class="do">Do this</b>' + r.do + '<b class="not">Not this</b>' + r.not + '</p>';
  }
  function openTip(anchor, html, depth) {
    closeTipsFrom(depth);
    var el = document.createElement('div');
    el.className = 'tip'; el.setAttribute('data-depth', depth); el.innerHTML = html; el.tabIndex = -1;
    document.body.appendChild(el);
    var r = anchor.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
    var x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var y = r.bottom + 6; if (y + hh > window.innerHeight - 8) y = Math.max(8, r.top - hh - 6);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    tips.push({ el: el, anchor: anchor, locked: false });
    anchor.classList.add('open');
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () { lockTop(); }, 1500);
    el.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
    el.addEventListener('mouseleave', function () { scheduleHide(); });
    el.addEventListener('click', function (e) {
      var o = e.target.closest('[data-open]'); if (o) { closeTipsFrom(0); showSheet(o.getAttribute('data-open')); return; }
      var t = e.target.closest('[data-term]'); if (t) { closeTipsFrom(0); showTerm(t.getAttribute('data-term')); return; }
      var tt = e.target.closest('.t'); if (tt) { closeTipsFrom(0); showTerm(tt.getAttribute('data-t')); }
    });
  }
  function lockTop() { if (!tips.length) return; var top = tips[tips.length - 1]; top.locked = true; top.el.classList.add('locked'); top.el.querySelector('.lock').textContent = 'locked · Esc closes'; }
  function closeTipsFrom(depth) {
    while (tips.length > depth) { var t = tips.pop(); t.el.remove(); t.anchor.classList.remove('open'); }
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      for (var i = tips.length - 1; i >= 0; i--) { if (tips[i].locked) break; var t = tips.pop(); t.el.remove(); t.anchor.classList.remove('open'); }
    }, 220);
  }
  function depthOf(el) { var tip = el.closest('.tip'); return tip ? parseInt(tip.getAttribute('data-depth'), 10) + 1 : 0; }
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest('.t, .trait, .skill'); if (!a) return;
    clearTimeout(hideTimer); clearTimeout(showTimer);
    var depth = depthOf(a);
    if (depth > 3) return;
    showTimer = setTimeout(function () {
      var html = a.classList.contains('t') ? tipTerm(a.getAttribute('data-t'), depth) : a.hasAttribute('data-inv') ? tipInv(+a.getAttribute('data-inv')) : tipHeur(+a.getAttribute('data-heur'));
      if (html) openTip(a, html, depth);
      hlPin(a.classList.contains('t') ? a.getAttribute('data-t') : null);
    }, 140);
  });
  document.addEventListener('mouseout', function (e) {
    var a = e.target.closest('.t, .trait, .skill'); if (!a) return;
    clearTimeout(showTimer); scheduleHide(); hlPin(null);
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('.tip')) return;
    var t = e.target.closest('.t');
    if (t) { e.preventDefault(); closeTipsFrom(0); showTerm(t.getAttribute('data-t')); return; }
    if (!e.target.closest('.trait, .skill')) closeTipsFrom(0);
  });
  function hlPin(key) {
    var rows = $('outliner').querySelectorAll('.o-pin'); for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('hl', !!key && rows[i].getAttribute('data-k') === key);
  }

  /* ---------- glossary ---------- */
  var keys = Object.keys(terms).sort(function (a, b) { return terms[a].term.toLowerCase().localeCompare(terms[b].term.toLowerCase()); });
  var gFilter = load('gcat', 'all'), gQuery = '', gHist = load('ghist', []), gOpen = null;
  function renderCats() {
    var h = '<button class="cat' + (gFilter === 'all' ? ' on' : '') + '" data-cat="all" type="button">all</button><button class="cat' + (gFilter === 'reader' ? ' on' : '') + '" data-cat="reader" type="button">reader marks</button>';
    sheets.forEach(function (s) { h += '<button class="cat' + (gFilter === s.id ? ' on' : '') + '" data-cat="' + s.id + '" type="button" title="' + esc(s.title) + '">' + esc(mono(s)) + '</button>'; });
    $('gCats').innerHTML = h;
  }
  function filtered() {
    var q = gQuery.trim().toLowerCase();
    return keys.filter(function (k) {
      var t = terms[k];
      if (gFilter === 'reader' && !t.senses.some(function (x) { return x.kind === 'reader'; })) return false;
      if (gFilter !== 'all' && gFilter !== 'reader' && !t.senses.some(function (x) { return x.source === gFilter; }) && t.appears.indexOf(gFilter) < 0) return false;
      if (q && k.indexOf(q) < 0 && !t.senses.some(function (x) { return plainText(x.sense).toLowerCase().indexOf(q) >= 0; })) return false;
      return true;
    });
  }
  function renderList() {
    var f = filtered();
    $('gCount').textContent = f.length + ' / ' + keys.length;
    var h = '<div class="g-list">';
    f.slice(0, 400).forEach(function (k) {
      var t = terms[k], reader = t.senses.some(function (x) { return x.kind === 'reader'; });
      var srcs = []; t.senses.forEach(function (x) { var s = byId[x.source]; var m = s ? mono(s) : x.source; if (srcs.indexOf(m) < 0) srcs.push(m); });
      h += '<div class="g-row' + (k === gOpen ? ' on' : '') + '" data-k="' + esc(k) + '"><span>' + esc(t.term) + '</span><span class="srcs' + (reader ? ' reader' : '') + '">' + esc(srcs.slice(0, 4).join(' ')) + (srcs.length > 4 ? ' +' + (srcs.length - 4) : '') + '</span></div>';
    });
    if (f.length > 400) h += '<div class="g-count">' + (f.length - 400) + ' more · narrow the search</div>';
    h += '</div>';
    $('gBody').innerHTML = h;
  }
  function renderHist() {
    var h = ''; gHist.slice(-6).reverse().forEach(function (k) { if (terms[k]) h += '<button class="hh" type="button" data-k="' + esc(k) + '">' + esc(terms[k].term) + '</button>'; });
    $('gHist').innerHTML = h;
  }
  function showTerm(key, silent) {
    var t = terms[key]; if (!t) return;
    gOpen = key;
    gHist = gHist.filter(function (k) { return k !== key; }); gHist.push(key); if (gHist.length > 12) gHist.shift(); store('ghist', gHist);
    var pinned = pins.indexOf(key) >= 0;
    var h = '<div class="g-entry"><h2>' + esc(t.term) + '</h2><div class="meta"><span>' + t.senses.length + ' sense' + (t.senses.length === 1 ? '' : 's') + ' · appears in ' + t.appears.length + '</span><button type="button" data-pin="' + esc(key) + '">' + (pinned ? 'unpin' : 'pin to outliner') + '</button><button type="button" data-list="1">← list</button></div>';
    t.senses.forEach(function (x) {
      var s = byId[x.source];
      h += '<div class="sense"><span class="g' + (x.kind === 'reader' ? ' reader' : '') + '" data-open="' + esc(x.source) + '" title="' + esc(s ? s.title : x.source) + '">' + esc(s ? mono(s) : x.source) + '</span><span>' + x.sense + '<span class="kind">' + (x.kind === 'reader' ? 'reader mark · ' + esc(x.section) : 'author definition · key vocabulary') + '</span></span></div>';
    });
    if (t.appears.length) {
      h += '<div class="appears"><span class="lab">appears in</span><div class="list">';
      t.appears.forEach(function (id) { var s = byId[id]; if (s) h += '<button class="chip" type="button" data-open="' + id + '"><span class="g">' + esc(mono(s)) + '</span>' + esc(shortTitle(s)) + '</button>'; });
      h += '</div></div>';
    }
    h += '</div>';
    $('gBody').innerHTML = h;
    renderHist();
    if (!silent) push({ type: 'term', key: key });
  }
  $('gBody').addEventListener('click', function (e) {
    var row = e.target.closest('.g-row'); if (row) { showTerm(row.getAttribute('data-k')); return; }
    var o = e.target.closest('[data-open]'); if (o) { showSheet(o.getAttribute('data-open')); return; }
    var p = e.target.closest('[data-pin]');
    if (p) { var k = p.getAttribute('data-pin'); if (pins.indexOf(k) >= 0) pins = pins.filter(function (x) { return x !== k; }); else pins.push(k); store('pins', pins); renderOutliner(); showTerm(k, true); return; }
    if (e.target.closest('[data-list]')) { gOpen = null; renderList(); }
  });
  $('gCats').addEventListener('click', function (e) { var c = e.target.closest('.cat'); if (!c) return; gFilter = c.getAttribute('data-cat'); store('gcat', gFilter); renderCats(); gOpen = null; renderList(); });
  $('gHist').addEventListener('click', function (e) { var b = e.target.closest('.hh'); if (b) showTerm(b.getAttribute('data-k')); });
  $('gSearch').addEventListener('input', function () { gQuery = this.value; gOpen = null; renderList(); });

  /* ---------- keys + theme ---------- */
  document.addEventListener('keydown', function (e) {
    var inField = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Escape') { closeTipsFrom(0); if (inField) document.activeElement.blur(); return; }
    if (e.altKey && !e.ctrlKey && !e.metaKey) { var i = HK.indexOf(e.key); if (i >= 0 && sheets[i]) { e.preventDefault(); showSheet(sheets[i].id); } return; }
    if (inField) return;
    if (e.key === '/') { e.preventDefault(); $('gSearch').focus(); $('gSearch').select(); return; }
    if (e.key === ' ' || e.key === 'Enter') { if (tips.length) { e.preventDefault(); lockTop(); } return; }
    if (e.key === 'b' || e.key === 'B' || e.key === 'Backspace') { e.preventDefault(); back(); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); fwd(); return; }
  });
  $('back').addEventListener('click', back); $('fwd').addEventListener('click', fwd);
  var themeState = load('theme', 'system');
  function applyTheme() { if (themeState === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', themeState); $('theme').textContent = { system: 'auto', dark: 'night · dark room', light: 'day · lit room' }[themeState]; }
  var contrastState = load('contrast', 'standard');
  function applyContrast() { if (contrastState === 'standard') document.documentElement.removeAttribute('data-contrast'); else document.documentElement.setAttribute('data-contrast', contrastState); $('contrast').textContent = 'contrast · ' + contrastState; }
  $('contrast').addEventListener('click', function () { contrastState = contrastState === 'standard' ? 'soft' : contrastState === 'soft' ? 'high' : 'standard'; store('contrast', contrastState); applyContrast(); });
  $('theme').addEventListener('click', function () { themeState = themeState === 'system' ? 'dark' : themeState === 'dark' ? 'light' : 'system'; store('theme', themeState); applyTheme(); });
  window.addEventListener('resize', function () { closeTipsFrom(0); });

  /* ---------- boot ---------- */
  applyTheme(); applyContrast();
  renderOutliner(); renderCats(); renderList(); renderHist();
  showSheet(load('sheet', sheets[0].id));
})();
</script>
